<meta charset="utf-8">
<title>하계 표류 시험판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한밤 산중의 먹빛 한 장. 좁은 세로 두루마리 한 줄, 위에는 생(生)과 업, 그 아래 몸 상태, 본문은 장면이 쌓이며 흘러내린다. */
:root {
  --ink: #12151b;
  --ink-2: #1a1e26;
  --line: #2c3240;
  --paper: #eee9dd;
  --muted: #aaa69b;
  --accent: #c8a35a;
  --red: #e0675c;
  --violet: #b58ee0;
  --jade: #72c29d;
  --gold: #e8c26e;
  --f-display: "Song Myung", "Noto Serif KR", serif;
  --f-body: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --log-h: 132px;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--paper); }
body { font-family: var(--f-body); font-weight: 500; font-size: 17px; line-height: 1.85; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--log-h) + 48px); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ink); border-bottom: 1px solid var(--line); padding-block: 12px 10px; display: grid; gap: 10px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-ui); }
#life { font-family: var(--f-display); font-size: 22px; color: var(--accent); letter-spacing: 0.06em; }
#karma { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
#stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); }
.stat { display: grid; gap: 0; text-align: center; padding-block: 4px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.stat b { font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat.realm b { color: var(--accent); }
#items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-ui); font-size: 12px; }
#items li { border: 1px solid var(--line); border-radius: 2px; padding: 1px 8px; color: var(--paper); }
#items li.none { color: var(--muted); border-style: dashed; }

#stage { display: grid; gap: 28px; padding-top: 28px; }
.scene h2, .ending h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0 0 14px; letter-spacing: 0.04em; text-wrap: balance; }
.prose p { margin: 0 0 1.1em; }
.prose strong { font-weight: 700; color: #f1ecdf; }
.c-red { color: var(--red); } .c-violet { color: var(--violet); } .c-jade { color: var(--jade); } .c-gold { color: var(--gold); }

.choices { display: grid; gap: 8px; margin-top: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.choice { display: flex; gap: 10px; align-items: baseline; text-align: left; width: 100%; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 11px 14px; font-family: var(--f-ui); font-size: 16px; line-height: 1.5; transition: border-color .15s, background .15s, opacity .2s; }
.choice .num { color: var(--muted); font-size: 13px; min-width: 1em; font-variant-numeric: tabular-nums; }
.choice .tag { color: var(--accent); white-space: nowrap; font-weight: 500; }
.choice .txt { min-width: 0; }
.choice.earned { border-style: dashed; border-color: #6d5a33; }
.choice.earned .tag { color: var(--gold); }
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--accent); background: #20252f; outline: none; }
.choice:disabled { cursor: default; }
.choice.picked { border-color: var(--accent); background: #262b35; box-shadow: inset 0 0 0 1px var(--accent); }
.choice.picked .num { color: var(--accent); }
.choice.dim { opacity: 0.45; }
.scene > .next { margin-top: 14px; }

.outcome { border-left: 1px solid var(--line); padding-left: 16px; margin-top: 22px; scroll-margin-top: 160px; }
.next kbd { font-family: var(--f-ui); font-size: 11px; margin-left: 10px; opacity: 0.7; letter-spacing: 0; }

.logbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--ink-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.logbox .in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.logbox h3 { margin: 0 0 4px; font-family: var(--f-ui); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; }
#log { list-style: none; margin: 0; padding: 0; max-height: calc(var(--log-h) - 30px); overflow-y: auto; font-family: var(--f-ui); font-size: 13px; line-height: 1.7; }
#log li { display: flex; flex-wrap: wrap; gap: 2px 8px; }
#log li:first-child { color: var(--paper); }
#log li:not(:first-child) { opacity: 0.7; }
#log .t { color: var(--paper); }
#log .g { color: var(--accent); }
#log .up { color: var(--jade); } #log .down { color: var(--red); }
#log:empty::before { content: "아직 아무것도 하지 않았다."; color: var(--muted); }
.changes { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-ui); font-size: 14px; }
.changes .up { color: var(--jade); } .changes .down { color: var(--red); }
.next { font-family: var(--f-ui); font-size: 15px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 8px 22px; letter-spacing: 0.1em; }
.next:hover:not(:disabled), .next:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
.next:disabled { opacity: 0.35; cursor: default; }

.ending { border-top: 1px solid var(--line); padding-top: 22px; }
.ending.death h2 { color: var(--red); }
.ending .note { color: var(--muted); font-size: 15px; }
.karma { font-family: var(--f-ui); margin: 0 0 16px; display: grid; gap: 4px; max-width: 320px; }
.karma div { display: flex; justify-content: space-between; }
.karma dt { color: var(--muted); } .karma dd { margin: 0; font-variant-numeric: tabular-nums; }
.karma .total { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.karma .total dt, .karma .total dd { color: var(--accent); }
.ach { font-family: var(--f-ui); font-size: 14px; color: var(--gold); }
#loading { color: var(--muted); font-family: var(--f-ui); }

@media (max-width: 480px) {
  body { font-size: 16px; }
  #stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="bar"><span id="life">제 1 생</span><span id="karma">업 0</span></div>
    <div id="stats"></div>
    <ul id="items"></ul>
  </header>
  <main id="stage"><p id="loading">산길을 더듬는 중…</p></main>
</div>
<aside class="logbox"><div class="in"><h3>지나온 길</h3><ul id="log"></ul></div></aside>

<script type="module" src="src/main.js"></script>

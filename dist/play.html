, 다섯을 모두 지웠다.", "발치에 **환약 한 알**이 굴러왔다. 던져 준 이는 이미 없었다."], "U003.c3.o1": ["\"벌레 주제에 흥정이야?\"", "", "**<red>갈비뼈 세 대가 한꺼번에 부러졌다.<\/red>**", "", "\"사흘. 못 하면 다음엔 네 목이야.\""], "U004.title": "장로의 추격", "U004.desc": ["산길.", "", "앞에 선 노인.", "**<purple>검붉은 장포<\/purple>**. {마교}의 {장로}다.", "", "\"배신자 놈의 제자가 {일류}가 됐다지.\"", "\"**그놈은 오늘 아침에 묻었다.**\"", "", "장로의 소매 끝이 **젖어 있다.**", "피인지 물인지 알 수 없다."], "U004.c1.tag": "복수", "U004.c1.text": "사부의 칼로 맞선다", "U004.c1.o0": ["사부가 {마교}를 버리며 만든 칼.", "", "{장로}의 눈이 커진다.", "\"…그놈의 칼을 네가?\"", "", "**<gold>칼끝이 장로의 심장에 닿았다.<\/gold>**", "", "젖은 소매. 물이었다.", "**사부는 아직 살아 있다.** 거짓말이었다."], "U004.c1.o1": ["스무 합.", "", "**<red>{장로}의 {장력}이 {단전}을 찢었다.<\/red>**"], "U004.c2.tag": "의심", "U004.c2.text": "젖은 소매를 보고 거짓말이라고 짚는다", "U004.c2.o0": ["\"묻었다면서, 소매가 물에 젖었군.\"", "\"강을 건너다 놓쳤겠지.\"", "", "{장로}의 얼굴이 일그러진다.", "\"…눈이 좋구나.\"", "", "장로가 등을 돌린다.", "\"**그놈을 찾으면 너도 함께 묻어 주마.**\""], "U004.c2.o1": ["\"…거짓말을 알아본 값이다.\"", "", "{장로}의 손가락이 어깨를 꿰뚫었다.", "**<red>왼어깨가 타들어 간다.<\/red>**"], "U004.c3.tag": "도주", "U004.c3.text": "등을 돌려 계곡으로 몸을 던진다", "U004.c3.o0": ["절벽 아래로 몸을 던졌다.", "", "**<green>살았다.<\/green>**", "", "그 뒤로 산길마다 **검붉은 장포**의 그림자가 어른거린다."], "U004.c3.o1": ["뛰어내리기 전에", "**<purple>검붉은 손바닥<\/purple>**이 등에 닿았다."], "U005.title": "제자가 되고 싶습니다", "U005.desc": ["{객잔} 앞에 꼬마 하나가 무릎을 꿇고 있다.", "", "사흘째라고 한다.", "", "\"제자로 받아 주십시오!\"", "", "꼬마의 손바닥에 **굳은살**이 박여 있다.", "혼자 나무 막대로 칼질을 한 흔적이다.", "", "문득, 처음 이 세계에 떨어졌던 날이 떠오른다."], "U005.c1.tag": "수락", "U005.c1.text": "제자로 받는다", "U005.c1.o0": ["꼬마의 이름은 **소운**.", "", "가르치다 보니 내가 배우는 게 더 많다.", "**흐릿하던 기초가 다시 또렷해진다.**"], "U005.c2.tag": "시험", "U005.c2.text": "나무 막대로 열 번만 막아보라고 한다", "U005.c2.o0": ["꼬마가 열 번을 다 막았다.", "", "열한 번째엔 나를 노리고 막대를 휘둘렀다.", "**웃음이 났다.**", "", "그 자리에서 제자로 받았다."], "U005.c2.o1": ["세 번째에 막대를 놓쳤다.", "", "꼬마가 이를 악물고 일어선다.", "\"내일 또 오겠습니다!\"", "", "**그 눈빛이 오래 남는다.**"], "U005.c3.tag": "거절", "U005.c3.text": "돌아가라고 한다", "U005.c3.o0": ["{동전} 한 꾸러미를 쥐여 주고 돌려보냈다.", "", "꼬마는 끝까지 고개를 숙이고 있었다."], "U006.title": "연화의 부탁", "U006.desc": ["연화루 뒷마당.", "", "연화가 비파를 끌어안고 앉아 있다.", "", "\"{루주}가 저를 고을 사또에게 팔아넘긴대요.\"", "", "연화가 고개를 든다.", "\"**저를 데리고 떠나 줄 수 있어요?**\""], "U006.c1.tag": "약속", "U006.c1.text": "함께 떠나자고 한다", "U006.c1.o0": ["그날 밤, 연화를 업고 담을 넘었다.", "", "쫓아온 사또의 사병들은", "**칼 한 번에 물러섰다.**", "", "새벽 강가에서 연화가 웃는다.", "\"…이제 어디로 가요?\""], "U006.c2.tag": "속값", "U006.c2.text": "{루주}에게 몸값을 치러 준다", "U006.c2.o0": ["{은자} 다섯 냥을 {루주} 앞에 던졌다.", "", "연화의 몸값 문서가 불길 속에 타오른다.", "", "\"…갚을게요. 평생 걸려도.\""], "U006.c3.tag": "외면", "U006.c3.text": "내가 끼어들 일이 아니라고 한다", "U006.c3.o0": ["연화가 오래 웃는다.", "\"…그래요. {무인}들은 다 그렇죠.\"", "", "다음 날 연화루에서 **비파 소리가 끊겼다.**"], "U007.title": "비무대회", "U007.desc": ["성도(省都)의 광장.", "", "**청하성 {비무}대회.**", "삼 년에 한 번, 성 안의 {일류}들이 모인다.", "", "우승 상금은 **{은자} 다섯 냥**.", "그보다 탐나는 건 우승자에게만 열린다는", "**성주의 {장서각}.**", "", "결승 상대가 정해졌다.", "푸른 장포의 검수. 걸음이 **오른쪽으로 조금 기운다.**"], "U007.c1.tag": "정면", "U007.c1.text": "정면으로 맞선다", "U007.c1.o0": ["백 합.", "", "광장이 숨을 죽였다.", "", "**<gold>상대의 검이 하늘로 튀어 올랐다.<\/gold>**", "", "함성이 터진다.", "{장서각}의 열쇠가 손에 쥐어졌다."], "U007.c1.o1": ["백 합 끝에 무릎을 꿇었다.", "", "그래도 준우승.", "**{은자} 한 냥**과 이름값이 남았다."], "U007.c2.tag": "허점", "U007.c2.text": "기운 쪽, 왼쪽으로 파고든다", "U007.c2.o0": ["왼쪽으로 돌았다.", "상대의 검이 반 박자 늦는다.", "", "**<gold>칼등이 상대의 손목을 쳤다.<\/gold>**", "", "\"…다리 다친 걸 어떻게 알았소.\"", "상대가 웃으며 고개를 숙인다."], "U007.c2.o1": ["상대는 기운 걸음을 미끼로 썼다.", "", "**<red>왼쪽에서 기다리던 검이 옆구리를 갈랐다.<\/red>**", "", "준우승. 상처가 깊다."], "U007.c3.tag": "기권", "U007.c3.text": "결승을 앞두고 기권한다", "U007.c3.o0": ["\"…기권하겠소.\"", "", "광장이 웅성거린다.", "준우승 상금 {은자} 한 냥만 챙겨 내려왔다.", "", "**몸은 멀쩡하다. 이름값은 조금 깎였다.**"], "U008.title": "고수의 하루", "U008.desc": ["{일류}가 되자 할 일이 넘친다.", "", "{상단}의 호위 청탁.", "고을 {무관}의 지도 요청.", "그리고, 아무도 찾지 않는 **산속의 고요**."], "U008.c1.tag": "청부", "U008.c1.text": "{상단} 호위를 맡는다", "U008.c1.o0": ["{일류}가 붙은 {상단}은 {녹림}도 건드리지 않았다.", "", "**{은자} 한 냥**을 받았다."], "U008.c1.o1": ["간 큰 {녹림} 한 무리가 덤볐다.", "", "정리하는 데 반 각.", "{상단}주가 웃돈을 얹어 준다."], "U008.c2.tag": "지도", "U008.c2.text": "고을 {무관}에서 수련생들을 가르친다", "U008.c2.o0": ["기초를 가르치다 보면", "**잊고 있던 것들이 다시 보인다.**", "", "{무관}주가 사례금을 건넨다."], "U008.c3.tag": "명상", "U008.c3.text": "산속에서 홀로 칼을 다듬는다", "U008.c3.o0": ["폭포 소리 속에서 칼을 휘둘렀다.", "", "어느 순간 칼과 물소리가 **<gold>하나가 되었다.<\/gold>**"], "U008.c3.o1": ["하루 종일 같은 초식을 반복했다.", "", "**칼끝이 한 치 정확해졌다.**"], "U009.title": "강이 되는 기운", "U009.desc": ["{일류}의 {단전}.", "", "기운은 이제 물줄기가 아니다.", "**강**이다.", "", "강을 다스리는 일은 고요하고, 또 위험하다."], "U009.c1.tag": "정진", "U009.c1.text": "강의 흐름을 고요히 따라간다", "U009.c1.o0": ["흐름을 거스르지 않았다.", "", "**{단전}이 한층 깊어졌다.**"], "U009.c2.tag": "역류", "U009.c2.text": "강을 거슬러 단숨에 키운다", "U009.c2.o0": ["거꾸로 오르는 강물이 {경맥}을 넓힌다.", "", "**<gold>{단전}이 크게 부풀었다.<\/gold>**"], "U009.c2.o1": ["강둑이 터졌다.", "", "**<purple>{경맥} 세 곳이 동시에 찢어졌다.<\/purple>**"], "U009.c3.tag": "심법", "U009.c3.text": "배운 심법으로 강줄기를 이끈다", "U009.c3.o0": ["{구결}이 둑이 되고, 물길이 된다.", "", "**<green>거대한 강이 얌전히 {단전}으로 모인다.<\/green>**"], "U009.c4.tag": "치유", "U009.c4.text": "쌓인 상처부터 다스린다", "U009.c4.o0": ["기운이 상처마다 스며든다.", "", "**묵은 통증이 씻겨 나간다.**"], "U010.title": "이름값", "U010.desc": ["이름이 나자 도전자도 늘었다.", "", "오늘의 도전자는 **{이류} 셋**.", "셋이서 한꺼번에 덤비겠다고 한다.", "", "\"{일류}라고 별거 있나!\""], "U010.c1.tag": "응전", "U010.c1.text": "셋을 한꺼번에 상대한다", "U010.c1.o0": ["세 합.", "", "세 자루의 칼이 차례로 땅에 떨어졌다.", "", "구경꾼들의 함성.", "**이름값이 한 뼘 올랐다.**"], "U010.c1.o1": ["셋이 생각보다 손발이 맞았다.", "", "이기긴 했지만 **팔에 칼자국이 하나 늘었다.**"], "U010.c2.tag": "훈계", "U010.c2.text": "칼을 뽑지 않고 기세로 물린다", "U010.c2.o0": ["기운을 한 번 내뿜었다.", "", "셋이 동시에 뒷걸음질 친다.", "\"…다, 다음에 다시 오겠소!\""], "U010.c2.o1": ["기세만으로는 부족했다.", "", "결국 칼을 뽑았다.", "**쓸데없이 힘만 뺐다.**"], "U010.c3.tag": "무시", "U010.c3.text": "상대하지 않고 지나간다", "U010.c3.o0": ["\"겁쟁이 {일류}!\"", "", "등 뒤의 야유가 따라온다.", "**신경 쓰이지 않는다. 별로.**"], "U011.title": "세 번째 벽", "U011.desc": ["{단전}에 강이 가득 찼다.", "", "세 번째 벽은 성벽도 아니다.", "**<purple>하늘<\/purple>**이다.", "", "넘으면 **{절정}**.", "무림에서 한 손에 꼽히는 이름들의 자리."], "U011.c1.tag": "폐관", "U011.c1.text": "삼 년 {폐관}에 든다", "U011.c1.o0": ["삼 년.", "", "동굴 입구를 막은 바위가 **안에서 부서졌다.**", "", "산 아래 마을 사람들이 그날 하늘이 울었다고 말한다.", "", "**<gold>{절정} 고수가 되었다.<\/gold>**"], "U011.c1.o1": ["하늘이 **<purple>되받아쳤다.<\/purple>**", "", "**<red>{단전}의 절반이 무너졌다.<\/red>**"], "U011.c1.o2": ["삼 년이 흘렀다.", "하늘은 여전히 높다.", "", "그래도 **하늘의 높이를 알았다.**"], "U011.c6.tag": "독룡초", "U011.c6.text": "천년 독룡초를 삼키고 하늘에 부딪친다", "U011.c6.o0": ["핏빛 꽃잎을 씹었다.", "", "여느 무인이라면 녹아내렸을 독기.", "몸이 그 독기를 **삼키고, 삭이고, 기운으로 바꾼다.**", "", "하늘이 **<gold>갈라졌다.<\/gold>**", "", "**<gold>{절정} 고수가 되었다.<\/gold>**"], "U011.c6.o1": ["독룡초의 기운이 온몸을 태웠다.", "하늘은 아직 멀다.", "", "그래도 **<green>{단전}이 바다처럼 넓어졌다.<\/green>**"], "U011.c2.tag": "생사결", "U011.c2.text": "목숨을 건 결투 속에서 깨달음을 찾는다", "U011.c2.o0": ["{절정} 고수에게 {생사결}을 청했다.", "", "죽음이 칼끝 한 치 앞까지 왔을 때.", "**<gold>하늘이 열렸다.<\/gold>**", "", "**<gold>절정 고수가 되었다.<\/gold>**"], "U011.c2.o1": ["깨달음은 오지 않았다.", "", "**<red>칼이 먼저 왔다.<\/red>**"], "U011.c2.o2": ["깨달음 직전에 상대가 칼을 거뒀다.", "\"…아직 아니야. 다음에 오게.\"", "", "**살았다. 아깝게.**"], "U011.c3.tag": "장서각", "U011.c3.text": "성주의 {장서각}에서 옛 고수의 기록을 찾는다", "U011.c3.o0": ["먼지 쌓인 서가 맨 아래.", "백 년 전 {절정} 고수의 **<gold>깨달음 기록<\/gold>**.", "", "한 줄을 읽는 순간,", "하늘에 금이 보였다.", "", "**<gold>절정 고수가 되었다.<\/gold>**"], "U011.c3.o1": ["기록은 있었다.", "읽을 수는 있었다.", "**이해할 수가 없었다. 아직은.**"], "U011.c4.tag": "마공", "U011.c4.text": "{마공}으로 하늘을 찢는다", "U011.c4.o0": ["**<purple>검붉은 기운<\/purple>**이 하늘을 찢었다.", "", "웃음이 멈추지 않는다.", "거울 속 나는 **<purple>내가 아닌 무언가<\/purple>**다.", "", "**<gold>{절정} 고수가 되었다.<\/gold>**"], "U011.c4.o1": ["하늘 대신", "**<purple>내가 찢어졌다.<\/purple>**"], "U011.c5.tag": "인내", "U011.c5.text": "아직 하늘을 볼 때가 아니다", "U011.c5.o0": ["하늘 앞에서 돌아섰다.", "", "**강을 더 깊게 판다.**"], "T012.title": "약방의 깊은 서랍", "T012.desc": ["{이류}쯤 되면 약방 주인의 태도가 달라진다.", "", "\"손님 같은 분께는 **깊은 서랍**을 열어 드리지요.\"", "", "백년 묵은 인삼, 곰의 쓸개, 이름 모를 버섯.", "값은 하나같이 **비싸다.**"], "T012.c1.tag": "인삼", "T012.c1.text": "백년삼 한 뿌리를 산다", "T012.c1.o0": ["달여 마신 뒤 사흘 밤낮 운기했다.", "", "**<green>{단전}이 묵직하게 차올랐다.<\/green>**"], "T012.c2.tag": "버섯", "T012.c2.text": "싸게 파는 이름 모를 버섯을 산다", "T012.c2.o0": ["주인도 무엇인지 모른다던 버섯.", "", "씹는 순간 **<gold>{단전}이 화끈 달아올랐다.<\/gold>**"], "T012.c2.o1": ["씹는 순간 혀가 마비됐다.", "", "**<purple>독버섯이었다.<\/purple>** 이틀을 앓았다."], "T012.c3.tag": "흥정", "T012.c3.text": "약재 손질을 거들고 값을 깎는다", "T012.c3.o0": ["하루 종일 약재를 썰고 달였다.", "", "주인이 남은 약재 찌꺼기로 탕약을 지어 준다.", "**찌꺼기라도 {이류}의 몸엔 약이 된다.**"], "T013.title": "험지 탐색", "T013.desc": ["사냥꾼들이 들어가지 않는다는 골짜기.", "", "독안개, 낭떠러지, 이름 모를 짐승의 울음.", "", "그래서 **아무도 손대지 않은 것들**이 남아 있다."], "T013.c1.tag": "탐색", "T013.c1.text": "골짜기 깊이 들어간다", "T013.c1.o0": ["절벽 틈에서 **<gold>푸른 빛이 도는 풀<\/gold>**을 찾았다.", "", "씹자 {경맥}을 따라 시원한 기운이 흐른다."], "T013.c1.o1": ["바위 뒤에서 **<red>거대한 곰<\/red>**이 일어섰다.", "", "한참을 싸웠다.", "이기긴 했지만 **어깨가 너덜너덜하다.**"], "T013.c1.o2": ["하루 종일 헤맸다.", "", "빈손이지만, 험한 길을 걷는 내내 **기운을 끌어 썼다.**"], "T013.c2.tag": "수련", "T013.c2.text": "독안개 속에서 숨을 참고 버틴다", "T013.c2.o0": ["숨을 멈추고 기운으로 독을 밀어냈다.", "", "반 {시진}.", "**<gold>독이 {경맥}을 단련시켰다.<\/gold>**"], "T013.c2.o1": ["독이 기운을 비집고 들어왔다.", "", "**<purple>사흘을 열에 시달렸다.<\/purple>**"], "T013.c3.tag": "돌아섬", "T013.c3.text": "입구에서 돌아선다", "T013.c3.o0": ["골짜기 입구에서 바람 냄새만 맡고 돌아섰다.", "", "**괜히 몸만 식었다.**"], "T014.title": "문파의 객", "T014.desc": ["작은 문파 하나가 손님으로 초대했다.", "", "\"{이류} 고수께서 우리 제자들과 한 번 겨뤄 주시면…\"", "", "대가는 **숙식과 서고 열람.**"], "T014.c1.tag": "대련", "T014.c1.text": "제자들과 차례로 겨룬다", "T014.c1.o0": ["열 명과 겨뤘다.", "", "열 번 모두 **이겼다.**", "제자들의 눈빛이 달라진다.", "", "남의 {무공}을 받아내다 보니", "**내 기운이 어디서 막히는지 보였다.**"], "T014.c1.o1": ["열 명과 겨뤘다.", "", "남의 {무공}을 받아내다 보니", "**내 기운이 어디서 막히는지 보였다.**"], "T014.c2.tag": "서고", "T014.c2.text": "서고에 틀어박혀 책을 읽는다", "T014.c2.o0": ["낡은 문집 귀퉁이에서", "**<gold>옛 고수의 운기 요결<\/gold>** 한 줄을 찾았다.", "", "그대로 따라 하자 기운이 한결 매끄럽다."], "T014.c2.o1": ["대부분 아는 내용이었다.", "", "**그래도 기초를 다시 다졌다.**"], "T014.c3.tag": "사양", "T014.c3.text": "정중히 사양하고 노잣돈만 받는다", "T014.c3.o0": ["문파주가 아쉬워하며 노잣돈을 건넨다.", "\"언제든 다시 오시오.\""], "U012.title": "남궁세가", "U012.desc": ["{남궁세가}의 정문.", "", "초대장을 내밀자 문지기가 허리를 숙인다.", "", "남궁현이 뛰어나온다.", "\"드디어 왔구려!\"", "", "그 뒤로, 흰 수염의 노인이 천천히 걸어 나온다.", "남궁세가의 **{가주}**다.", "\"현이 자랑하던 그 {일류}인가. **검 한 번 보여 주게.**\""], "U012.c1.tag": "검무", "U012.c1.text": "{가주} 앞에서 검을 펼친다", "U012.c1.o0": ["검을 펼쳤다.", "", "{가주}의 눈이 가늘어진다.", "\"…거칠지만, 날이 살아 있군.\"", "", "가주가 검을 들어 **한 초식**을 보여 준다.", "\"이건 선물이네.\"", "", "**<gold>창궁무애검의 첫 초식이 눈에 새겨졌다.<\/gold>**"], "U012.c1.o1": ["검을 펼쳤다.", "", "{가주}가 고개를 젓는다.", "\"현이 사람 보는 눈이 아직 어리군.\"", "", "남궁현이 민망한 얼굴로 술을 따른다.", "**술은 좋았다.**"], "U012.c2.tag": "겸양", "U012.c2.text": "{가주}의 검을 먼저 청한다", "U012.c2.o0": ["\"{가주}님의 검을 먼저 보고 싶습니다.\"", "", "가주가 껄껄 웃는다.", "\"건방지고, 영리하군.\"", "", "가주의 검이 정원의 낙엽 백 장을 한꺼번에 갈랐다.", "**눈에 새겼다. 손이 따라가지 못할 뿐.**"], "U012.c3.tag": "연회", "U012.c3.text": "검 얘기는 미루고 연회부터 즐긴다", "U012.c3.o0": ["사흘 밤낮 연회가 이어졌다.", "", "{남궁세가} 사람들과 안면을 텄다.", "**강호의 인맥이 넓어졌다.**"], "U013.title": "다시 찾은 청하촌", "U013.desc": ["처음 이 세계에서 마주한 마을, 청하촌.", "", "장터 사람들이 수군거린다.", "\"저 사람… 예전에 이상한 옷 입고 왔던…\"", "\"{일류}라던데?\"", "", "청하{무관}의 낡은 대문이 보인다.", "지붕 한쪽이 **무너져 있다.**"], "U013.c1.tag": "후원", "U013.c1.text": "{무관} 지붕을 고칠 돈을 내놓는다", "U013.c1.o0": ["{은자} 두 냥을 사범 손에 쥐여 주었다.", "", "사범이 한참 말이 없다가", "\"…잡일꾼 놈이 출세했구나.\"", "", "그날 밤, {무관} 수련생들이 술상을 차렸다."], "U013.c2.tag": "지도", "U013.c2.text": "{무관} 수련생들을 하루 가르친다", "U013.c2.o0": ["새벽 마당.", "옛날 내가 물을 긷던 그 자리에서", "이제는 내가 {마보}를 가르친다.", "", "**처음 기가 돌던 날이 떠오른다.**"], "U013.c3.tag": "의원", "U013.c3.text": "약방 의원 노인을 찾아간다", "U013.c3.o0": ["노인이 지팡이를 짚고 나를 위아래로 본다.", "", "\"…{일류}라.\"", "\"물동이도 못 들던 놈이 **제법 컸구먼.**\"", "", "노인이 환약 하나를 던진다.", "\"그래도 아직 멀었어. 이거나 삼켜보거라.\""], "U013.c3.o1": ["약방 문이 닫혀 있다.", "", "이웃 말로는", "**의원은 몇 달 전 어디론가 떠났다고 한다.**"], "U014.title": "불타는 마을", "U014.desc": ["산 너머로 검은 연기가 오른다.", "", "작은 마을 하나가 불타고 있다.", "**<purple>검붉은 깃발.<\/purple>** {마교}의 약탈대다.", "", "마을 한가운데 우물가.", "약탈대 대장이 아이 하나의 목덜미를 잡고 있다.", "", "그 대장의 왼손이 **비어 있다.** 무기는 오른손에만."], "U014.c1.tag": "구출", "U014.c1.text": "곧장 대장에게 달려든다", "U014.c1.o0": ["대장의 빈 왼쪽으로 파고들었다.", "", "**<gold>아이를 낚아채는 동시에 칼이 대장의 손목을 갈랐다.<\/gold>**", "", "대장이 쓰러지자 약탈대가 흩어진다.", "", "아이가 내 옷자락을 붙잡고 놓지 않는다."], "U014.c1.o1": ["대장은 {절정}이었다.", "", "**<red>아이와 함께 쓰러졌다.<\/red>**"], "U014.c1.o2": ["아이는 구했다.", "", "대장의 칼이 등을 길게 그었다.", "**<red>상처가 깊다.<\/red>** 약탈대는 마을을 다 태우고 떠났다."], "U014.c2.tag": "구호", "U014.c2.text": "불부터 끄고 마을 사람들을 피신시킨다", "U014.c2.o0": ["불길 속에서 사람들을 업어 날랐다.", "", "약탈대는 실컷 털고 떠났다.", "그래도 **죽은 사람은 없었다.**", "", "촌장이 마을에 남은 전부라며 {동전} 꾸러미를 내민다. 받지 않았다."], "U014.c3.tag": "외면", "U014.c3.text": "{마교}와 엮이기 싫어 지나친다", "U014.c3.o0": ["등 뒤로 비명이 이어졌다.", "", "**돌아보지 않았다.**", "", "그날 밤, 잠이 오지 않았다."], "U015.title": "구름 위의 그림자", "U015.desc": ["맑은 날.", "", "하늘에 구름 한 점이 **거꾸로 흐른다.**", "", "품속의 흔적이 **뜨거워진다.**", "", "그날, 구름 위를 지나가던 그것.", "숨이 막힌다. 그때처럼.", "", "아니다. **그때보다 덜하다.**"], "U015.c1.tag": "응시", "U015.c1.text": "고개를 들어 거꾸로 흐르는 구름을 본다", "U015.c1.o0": ["구름은 이미 흩어지고 있었다.", "", "아무것도 없다.", "", "그런데 {단전}이 **<gold>저절로 돌기 시작했다.<\/gold>**", "흔적이 기운을 끌어당긴다."], "U015.c1.o1": ["아주 잠깐, 구름 속에서 **금빛**이 번뜩였다.", "", "**<red>코와 귀에서 피가 쏟아졌다.<\/red>**", "", "그래도 버텼다. {일류}의 몸이라."], "U015.c2.tag": "엎드림", "U015.c2.text": "땅에 엎드려 지나가기를 기다린다", "U015.c2.o0": ["얼굴을 흙에 묻었다.", "", "한참 뒤 고개를 들자", "하늘은 평범하게 맑다.", "", "**{일류}가 되어도, 그것 앞에서는 여전히 벌레다.**"], "U016.title": "사부의 부탁", "U016.desc": ["강가 나룻배.", "", "삿갓 아래 낯익은 얼굴.", "**사부다.** 한쪽 다리를 절고 있다.", "", "\"{장로}를 따돌리다 이렇게 됐다.\"", "\"{일류}가 됐다고 들었다. 그래서 왔다.\"", "", "사부가 품에서 **검은 목패**를 꺼낸다.", "\"{마교} 안에 나를 따르던 자들의 명단이다. 이걸 {무림맹}에 넘기면 마교 한쪽이 무너진다.\"", "\"**넘기는 순간, 나는 다시는 숨지 못한다.**\""], "U016.c1.tag": "전달", "U016.c1.text": "목패를 {무림맹}에 넘기겠다고 한다", "U016.c1.o0": ["사부가 웃는다.", "\"그래. 그게 맞다.\"", "", "목패가 {무림맹}에 들어간 날,", "{마교}의 지부 셋이 하룻밤에 무너졌다.", "", "그리고 사부의 소식은 **끊겼다.**"], "U016.c2.tag": "은둔", "U016.c2.text": "목패를 강에 던지고 함께 숨자고 한다", "U016.c2.o0": ["목패가 강물 속으로 가라앉는다.", "", "사부가 오래 나를 본다.", "\"…미련한 놈. 끝까지.\"", "", "그날 밤, 사부가 남은 검을 전부 가르쳐 주었다.", "**<gold>{단전}이 크게 깊어졌다.<\/gold>**"], "U016.c3.tag": "흥정", "U016.c3.text": "목패를 {마교}에 팔아넘긴다", "U016.c3.o0": ["사부가 잠든 사이 목패를 챙겼다.", "", "{마교} {장로}가 목패를 받으며 웃는다.", "\"배신자의 제자답군.\"", "", "**<purple>{은자} 열 냥<\/purple>**이 던져졌다.", "사부는 그 뒤로 다시 보이지 않았다."], "U016.c3.o1": ["목패에 손을 대는 순간.", "", "잠든 줄 알았던 사부의 눈이 떠졌다.", "\"…그래. 너도 결국.\"", "", "**<red>사부의 칼은 여전히 빨랐다.<\/red>**"], "U017.title": "현상금 사냥", "U017.desc": ["{관부} 앞 방.", "", "**{사파} 고수 '혈랑' 수배. 현상금 {은자} 다섯 냥.**", "", "그림 속 사내는 {이류} 고수 셋을 죽였다고 적혀 있다.", "", "{포두}가 다가와 속삭인다.", "\"혈랑은 보름달 밤에만 움직이오. **오늘이 보름이고.**\""], "U017.c1.tag": "사냥", "U017.c1.text": "보름달 밤 혈랑을 쫓는다", "U017.c1.o0": ["달빛 아래 혈랑과 마주했다.", "", "{이류} 셋을 죽인 칼.", "**{일류}에게는 반 박자 느렸다.**", "", "{포두}가 {은자} 다섯 냥을 세어 건넨다."], "U017.c1.o1": ["혈랑은 혼자가 아니었다.", "", "셋을 베고, 넷째에게 등을 베였다.", "혈랑은 놓쳤다.", "**<red>상처만 남았다.<\/red>**"], "U017.c2.tag": "거절", "U017.c2.text": "남의 목에 값을 매기는 일은 사양한다", "U017.c2.o0": ["{포두}가 어깨를 으쓱한다.", "", "다음 날, 혈랑을 쫓던 {이류} 둘이 **시체로 돌아왔다.**"], "U018.title": "고수를 찾는 사람들", "U018.desc": ["{객잔} 탁자 위에 서찰이 셋 놓여 있다.", "", "하나는 **세가의 무사 {교두} 자리.**", "하나는 **청부 살인.**", "하나는 **이름 없는 노승의 차 한 잔 초대.**"], "U018.c1.tag": "교두", "U018.c1.text": "세가 무사들을 한동안 가르친다", "U018.c1.o0": ["보름 동안 세가 무사들을 가르쳤다.", "", "사례금이 두둑하다.", "**가르치며 내 칼도 다듬어졌다.**"], "U018.c2.tag": "청부", "U018.c2.text": "청부 살인을 받는다", "U018.c2.o0": ["표적은 어느 상인이었다.", "", "칼은 빨랐다.", "**<purple>돈은 무겁고, 손은 더러워졌다.<\/purple>**"], "U018.c2.o1": ["표적의 호위 중에 **{절정}**이 있었다.", "", "**<red>청부 값보다 목숨 값이 비쌌다.<\/red>**"], "U018.c3.tag": "노승", "U018.c3.text": "노승의 차 한 잔 초대에 응한다", "U018.c3.o0": ["노승은 말 한마디 없이 차만 따랐다.", "", "세 번째 잔을 비울 때,", "**<gold>{단전}의 강이 고요해졌다.<\/gold>**", "", "노승이 처음으로 입을 연다.", "\"칼을 쥔 손에 힘을 빼게.\""], "U018.c3.o1": ["노승은 차만 따르고 아무 말도 없었다.", "", "**차는 맛있었다.**"], "W001.title": "눈 덮인 고개", "W001.desc": ["마을로 가는 지름길은 **고개 하나**를 넘는다.", "", "산허리부터 눈이 쌓였다.", "꼭대기에서 **<red>눈보라<\/red>**가 소용돌이친다.", "", "에둘러 가면 사흘 길이다."], "W001.c1.tag": "강행", "W001.c1.text": "눈보라를 뚫고 고개를 넘는다", "W001.c1.o0": ["무릎까지 빠지는 눈.", "속눈썹에 얼음이 맺힌다.", "", "발가락 감각이 **<red>사라졌다.<\/red>**", "고개는 넘었지만 걸음마다 발이 욱신거린다."], "W001.c1.o1": ["꼭대기 어디쯤에서 다리가 멈췄다.", "", "졸음이 쏟아진다.", "**<red>눈이 몸을 덮어 온다.<\/red>**"], "W001.c1.o2": ["이를 악물고 걸었다.", "", "해 질 녘, 고개 너머로 **마을 불빛**이 보인다.", "다리가 **단단해졌다.**"], "W001.c2.tag": "우회", "W001.c2.text": "사흘 길을 돌아간다", "W001.c2.o0": ["사흘을 걸었다.", "", "발바닥이 다 까졌다.", "대신 **살아서 도착했다.**"], "W001.c3.tag": "불씨", "W001.c3.text": "라이터로 불을 피우며 천천히 오른다", "W001.c3.o0": ["딸깍.", "", "바위 그늘마다 불을 지피며 올랐다.", "**<green>몸이 얼지 않았다.<\/green>**", "", "고개를 넘으니 손끝이 조금 단단해져 있다."], "W001.c4.tag": "설행", "W001.c4.text": "눈보라 한가운데로 곧장 걸어 들어간다", "W001.c4.o0": ["눈보라가 살을 할퀸다.", "그런데 **춥지 않다.**", "", "눈 속을 한참 걸었을까.", "바위틈에서 **연기 한 줄기**가 오른다.", "", "눈 속에 묻힌 **초막** 하나."], "W001_초막.title": "눈 속의 초막", "W001_초막.desc": ["초막 안에 **백발 노인** 하나가 앉아 있다.", "화로도 없는데 노인의 입김이 보이지 않는다.", "", "노인이 눈을 뜬다.", "\"…그 눈보라를 걸어서 왔다고?\"", "", "노인의 시선이 내 몸을 위아래로 훑는다.", "\"몸이 **추위를 모르는구나.** 재미있는 놈이군.\""], "W001_초막.c1.tag": "가르침", "W001_초막.c1.text": "가르침을 청한다", "W001_초막.c1.o0": ["노인이 손가락으로 내 가슴을 짚었다.", "", "\"숨을 들이쉴 때 **눈을 삼킨다고 생각해라.**\"", "", "밤새 노인의 호흡을 따라 했다.", "새벽녘, {단전}에 **<gold>서늘한 기운<\/gold>**이 고였다.", "", "노인이 등을 돌린다. \"이제 가라. 다시 찾아도 이 초막은 없다.\""], "W001_초막.c2.tag": "휴식", "W001_초막.c2.text": "하룻밤 쉬어 가게 해 달라고 한다", "W001_초막.c2.o0": ["노인은 대답하지 않았다.", "", "대신 **김이 오르는 탕약** 한 그릇이 앞에 놓였다.", "", "아침에 눈을 떴을 때 초막은 비어 있었다.", "**<green>몸이 가볍다.<\/green>**"], "W001_초막.c3.tag": "의심", "W001_초막.c3.text": "노인을 경계하며 초막을 나선다", "W001_초막.c3.o0": ["\"쯧.\"", "", "등 뒤로 문이 닫혔다.", "돌아보니 **초막이 보이지 않는다.**", "", "눈 위에 내 발자국만 남았다."], "W002.title": "불타는 장원", "W002.desc": ["밤하늘이 **<red>붉다.<\/red>**", "", "언덕 아래 큰 장원이 불타고 있다.", "하인들이 물동이를 들고 우왕좌왕한다.", "", "\"아가씨가! **아가씨가 아직 안에 계십니다!**\"", "", "안채 지붕이 **<red>무너져 내린다.<\/red>**"], "W002.c1.tag": "물동이", "W002.c1.text": "물을 길어 나르며 불을 끈다", "W002.c1.o0": ["밤새 물을 날랐다.", "", "새벽녘 불길이 잡혔다.", "장주가 그을린 손으로 내 손을 잡는다.", "\"고맙소. **진가장은 은혜를 잊지 않소.**\""], "W002.c2.tag": "돌입", "W002.c2.text": "젖은 천을 뒤집어쓰고 불길로 뛰어든다", "W002.c2.o0": ["연기 속에서 **쓰러진 소녀**를 찾았다.", "", "등에 업고 무너지는 들보 사이를 뛰었다.", "", "밖으로 굴러 나오자 사방에서 **<green>환호성<\/green>**이 터진다."], "W002.c2.o1": ["세 걸음 만에 숨이 막혔다.", "", "옷자락에 불이 붙었다.", "**<red>살갗이 타들어 간다.<\/red>**", "", "누군가 내 발목을 잡아 끌어냈다."], "W002.c2.o2": ["불길 속에서 길을 잃었다.", "", "천장이 **<red>내려앉는다.<\/red>**"], "W002.c3.tag": "구경", "W002.c3.text": "불구경만 하다 자리를 뜬다", "W002.c3.o0": ["불길은 새벽까지 이어졌다.", "", "길을 떠나며 돌아보았다.", "안채가 있던 자리에 **검은 기둥**만 서 있다.", "", "발걸음이 무겁다."], "W002.c4.tag": "불길", "W002.c4.text": "불길 한가운데를 걸어 들어간다", "W002.c4.o0": ["불길이 몸을 감쌌다.", "**뜨겁지만, 견딜 만하다.**", "", "안채 깊숙한 곳.", "연기 속에서 **쓰러진 소녀**를 안아 들었다.", "", "불길을 헤치고 걸어 나오자, 모두가 **말을 잃었다.**", "", "장주가 무릎을 꿇는다.", "\"…은인이시오. 진가장의 문은 언제나 열려 있소.\"", "**<gold>진가장의 신표<\/gold>**를 손에 쥐여 준다."], "W002_답례.title": "진가장의 답례", "W002_답례.desc": ["길에서 **진가장의 하인**이 나를 알아보았다.", "", "\"은인 어른! 장주님께서 꼭 모셔 오라 하셨습니다.\"", "", "새로 지은 진가장.", "장주가 직접 문 앞까지 나와 있다.", "그 뒤에서 **진 소저**가 고개를 숙인다.", "", "\"원하는 것을 말해 보시오.\""], "W002_답례.c1.tag": "보검", "W002_답례.c1.text": "장원에 대대로 내려온 검을 청한다", "W002_답례.c1.o0": ["장주가 잠시 망설이다 검갑을 열었다.", "", "푸른빛이 도는 **<gold>청강검<\/gold>**.", "\"선대께서 쓰시던 검이오. 은인께라면 아깝지 않소.\""], "W002_답례.c2.tag": "재물", "W002_답례.c2.text": "노자를 넉넉히 받는다", "W002_답례.c2.o0": ["장주가 손뼉을 치자 하인이 **은자 주머니**를 내왔다.", "", "\"부족하면 언제든 다시 오시오.\""], "W002_답례.c3.tag": "소저", "W002_답례.c3.text": "진 소저와 이야기를 나눈다", "W002_답례.c3.o0": ["정원의 정자.", "", "진 소저가 찻잔을 내민다.", "\"그날… 불 속에서 **등이 따뜻했어요.**\"", "", "찻잔 너머로 소저의 귀가 붉다.", "", "돌아가는 길, 품속에 **수놓은 향낭** 하나가 들어 있었다."], "W003.title": "한빙 동굴", "W003.desc": ["한여름인데 골짜기 바닥에 **<purple>서리<\/purple>**가 앉았다.", "", "서리를 따라가니 절벽 아래 **동굴** 하나.", "입구에서부터 냉기가 **<red>뼈를 파고든다.<\/red>**", "", "동굴 안쪽에서 희미한 **푸른빛**이 새어 나온다.", "약초꾼들 말로는, 안쪽에 들어간 자는 **얼음 조각상**이 되어 돌아왔다고 한다."], "W003.c1.tag": "운기", "W003.c1.text": "입구의 냉기 속에서 {운기조식}을 한다", "W003.c1.o0": ["냉기가 {경맥}을 훑고 지나간다.", "", "{단전}의 기운이 **<green>한층 맑아졌다.<\/green>**"], "W003.c2.tag": "채취", "W003.c2.text": "조금 더 들어가 얼음 결정을 캔다", "W003.c2.o0": ["손가락만 한 **얼음 결정** 몇 개를 캤다.", "녹지 않는 얼음이다.", "", "약방에 넘기면 값을 꽤 받겠다."], "W003.c2.o1": ["손이 **<red>얼음에 들러붙었다.<\/red>**", "", "살점을 뜯어내고서야 빠져나왔다."], "W003.c3.tag": "안쪽", "W003.c3.text": "푸른빛을 따라 동굴 안쪽으로 들어간다", "W003.c3.o0": ["냉기가 살갗에서 **멎는다.**", "", "얼음 기둥 사이를 지나 가장 안쪽.", "얼음 틈에 **<gold>하얀 풀 한 포기<\/gold>**가 피어 있다.", "", "**<gold>빙백초(氷魄草)<\/gold>**.", "벽을 넘는 무인들이 목숨을 걸고 찾는 영초다."], "W003.c4.tag": "심처", "W003.c4.text": "얼음벽을 부수고 가장 깊은 곳까지 내려간다", "W003.c4.o0": ["얼음벽 너머, 냉기가 **<purple>살아 있는 것처럼<\/purple>** 휘몰아친다.", "몸은 그 냉기를 **그저 흘려보낸다.**", "", "가장 깊은 곳.", "얼음 속에 **가부좌를 튼 노인**이 갇혀 있다.", "", "노인의 무릎 위에 **얼어붙은 서책** 한 권.", "표지에 세 글자.", "", "**<gold>한빙장(寒氷掌)<\/gold>**."], "W003.c5.tag": "후퇴", "W003.c5.text": "발길을 돌린다", "W003.c5.o0": ["동굴을 등졌다.", "", "골짜기를 벗어나자 한여름 햇살이 쏟아진다.", "**살아 있다는 게 실감 난다.**"], "W003_한빙장.title": "얼음 손바닥", "W003_한빙장.desc": ["얼어붙었던 **한빙장 비급**이 마침내 녹았다.", "", "첫 장부터 글씨가 **<purple>서리처럼 차갑다.<\/purple>**", "\"손바닥에 겨울을 담아라.\""], "W003_한빙장.c1.tag": "수련", "W003_한빙장.c1.text": "한 달을 들여 익힌다", "W003_한빙장.c1.o0": ["한 달.", "", "손바닥을 펼치자 **<gold>서리가 피어올랐다.<\/gold>**", "내리친 바위에 **얼음꽃**이 번진다."], "W003_한빙장.c1.o1": ["냉기가 손끝에서 **<red>역류했다.<\/red>**", "", "팔뚝이 하얗게 얼어붙었다.", "한 달을 꼬박 앓았다."], "W003_한빙장.c2.tag": "처분", "W003_한빙장.c2.text": "값나가는 비급을 팔아 버린다", "W003_한빙장.c2.o0": ["이름 모를 상인이 눈을 번뜩이며 **은자 꾸러미**를 내밀었다.", "", "팔고 나서야 아까운 마음이 든다."], "K001.title": "성문 검문", "K001.desc": ["현성(縣城)의 성문.", "", "{관병} 둘이 창을 엇갈려 길을 막는다.", "\"**신분패.**\"", "", "그런 게 있을 리 없다.", "관병의 눈이 내 얼굴과 손을 번갈아 훑는다."], "K001.c1.tag": "정직", "K001.c1.text": "신분패가 없다고 솔직히 말한다", "K001.c1.o0": ["관병이 코웃음을 쳤다.", "\"촌놈이구먼. **통행세나 내.**\"", "", "동전 몇 닢을 털리고 성안에 들어섰다."], "K001.c1.o1": ["\"신분패가 없다?\"", "관병의 눈빛이 바뀐다.", "\"요즘 **간자**가 들끓는다더니.\"", "", "옥으로 끌려갔다."], "K001.c1.o2": ["\"수상한 놈이다! 베어!\"", "", "**<red>창날이 배를 꿰뚫었다.<\/red>**"], "K001.c2.tag": "뇌물", "K001.c2.text": "관병 손에 동전 꾸러미를 쥐여 준다", "K001.c2.o0": ["관병이 꾸러미 무게를 가늠한다.", "\"…가 봐.\""], "K001.c3.tag": "개구멍", "K001.c3.text": "성문을 포기하고 성벽의 개구멍을 찾는다", "K001.c3.o0": ["성벽 아래 **개구멍**을 찾았다.", "", "진흙투성이가 되어 성안으로 기어들었다."], "K001.c3.o1": ["반쯤 기어들었을 때 엉덩이에 **<red>몽둥이<\/red>**가 떨어졌다.", "\"이놈 봐라!\"", "", "실컷 두들겨 맞고 쫓겨났다."], "K002.title": "소굴의 포로", "K002.desc": ["눈을 뜨니 **<red>손발이 묶여 있다.<\/red>**", "", "산길에서 {녹림} 무리에게 붙잡혔다.", "동굴 안에는 나 말고도 포로가 여섯.", "상인, 농부, 그리고 **팔에 붕대를 감은 청년.**", "", "포로들이 나를 흘끔거린다.", "\"저놈, 옷차림이 이상해. **산적 끄나풀 아냐?**\"", "", "동굴 입구에서 산적 둘이 졸고 있다."], "K002.c1.tag": "혼자", "K002.c1.text": "밤을 틈타 혼자 밧줄을 끊고 빠져나간다", "K002.c1.o0": ["돌 모서리에 밧줄을 문질렀다.", "", "새벽녘, 밧줄이 끊어졌다.", "졸던 산적 옆을 숨죽여 지나 **<green>숲으로 내달렸다.<\/green>**"], "K002.c1.o1": ["밧줄을 끊는 소리에 포로 하나가 소리쳤다.", "\"저놈이 도망간다!\"", "", "산적의 발길질이 **<red>갈비뼈를 부러뜨렸다.<\/red>**", "", "며칠 뒤 산적들은 쓸모없는 포로를 산길에 내다 버렸다."], "K002.c2.tag": "밀고", "K002.c2.text": "산적에게 포로들의 탈출 계획을 일러바친다", "K002.c2.o0": ["산적 두목이 껄껄 웃는다.", "\"눈치 빠른 놈이네.\"", "", "밧줄이 풀렸다.", "손에 **동전 한 줌**이 쥐여졌다.", "", "등 뒤에서 포로들의 비명이 들린다."], "K002.c2.o1": ["\"고자질하는 놈은 **언젠가 우리도 판다.**\"", "", "**<red>칼날이 목을 그었다.<\/red>**"], "K002.c3.tag": "설득", "K002.c3.text": "포로들을 다독여 함께 탈출할 계획을 짠다", "K002.c3.o0": ["\"끄나풀이라뇨. 저도 똑같이 묶여 있잖습니까.\"", "", "포로들의 얼굴이 하나둘 풀린다.", "붕대 감은 청년이 고개를 끄덕였다.", "\"…믿어 보지.\"", "", "새벽.", "일곱이 한꺼번에 들고일어나 **<green>졸던 산적을 덮쳤다.<\/green>**", "", "산을 빠져나온 뒤, 청년이 이름을 밝혔다.", "\"청하표국 소표두 **유진**이오. 이 은혜는 표국이 갚겠소.\"", "", "표국의 **표패** 하나를 손에 쥐여 준다."], "K003.title": "화산의 산문", "K003.desc": ["구름에 잠긴 봉우리.", "가파른 돌계단 끝에 **{산문}**이 서 있다.", "", "**{화산파}**.", "", "산문 앞에는 입문을 청하는 젊은이들이 줄지어 무릎을 꿇었다.", "문지기 제자가 그 줄을 **귀찮다는 듯** 훑는다.", "", "\"근본 없는 놈은 받지 않는다.\""], "K003.c1.tag": "인내", "K003.c1.text": "줄 끝에 무릎을 꿇고 기다린다", "K003.c1.o0": ["사흘 밤낮.", "", "나흘째 새벽, 지나가던 노도인이 걸음을 멈췄다.", "\"끈기는 있구나.\"", "", "소매에서 **매화 문양 패** 하나를 꺼내 던져 준다."], "K003.c1.o1": ["사흘 밤낮을 꿇었다.", "", "문은 열리지 않았다.", "무릎만 **<red>망가졌다.<\/red>**"], "K003.c2.tag": "담장", "K003.c2.text": "담을 넘어 제자들의 수련을 엿본다", "K003.c2.o0": ["나무 위에서 반나절.", "", "제자들의 **검로**를 눈에 새겼다."], "K003.c2.o1": ["\"**첩자다!**\"", "", "목검이 사방에서 쏟아졌다.", "산문 밖으로 **<red>내던져졌다.<\/red>**"], "K003.c3.tag": "장로", "K003.c3.text": "계단을 내려오는 노도인에게 먼저 인사를 올린다", "K003.c3.o0": ["노도인이 걸음을 멈췄다.", "", "한참 내 얼굴을 보더니 웃음을 터뜨린다.", "\"허허. **눈빛이 맑구나.**\"", "", "노도인이 문지기를 돌아본다.", "\"이 아이는 내가 데려가마.\"", "", "문지기가 허리를 숙인다. \"장, 장로님…!\"", "", "**<gold>{화산파}의 {속가제자}가 되었다.<\/gold>**"], "Q001.title": "독곡 깊은 곳", "Q001.desc": ["남쪽 **독곡**.", "", "골짜기 전체가 **<purple>보랏빛 안개<\/purple>**에 잠겨 있다.", "안개에 닿은 새가 **떨어져 죽는다.**", "", "안개가 짙을수록 귀한 독초가 자란다고 한다.", "가장 짙은 곳에는 **천 년 묵은 독룡초**가 있다는 소문."], "Q001.c1.tag": "가장자리", "Q001.c1.text": "안개 가장자리에서 약초를 캔다", "Q001.c1.o0": ["숨을 참고 반나절.", "", "바구니에 **값나가는 독초**가 그득하다."], "Q001.c1.o1": ["숨이 모자랐다.", "**<purple>독기<\/purple>**를 한 모금 들이켰다.", "", "사흘을 토하며 앓았다."], "Q001.c2.tag": "안개", "Q001.c2.text": "안개 속으로 들어간다", "Q001.c2.o0": ["안개를 헤치고 들어갔다.", "", "**<purple>검푸른 버섯<\/purple>** 무리를 찾았다.", "약방 노인이 보면 기절할 물건이다."], "Q001.c2.o1": ["눈앞이 보랏빛으로 물든다.", "", "손끝부터 **<purple>검게 썩어 들어간다.<\/purple>**", "", "간신히 기어 나왔다."], "Q001.c2.o2": ["안개가 폐를 채웠다.", "", "**<purple>온몸이 검푸르게 물든다.<\/purple>**"], "Q001.c3.tag": "독초", "Q001.c3.text": "독초를 씹어 독기에 몸을 길들이며 들어간다", "Q001.c3.o0": ["독초를 씹었다.", "혀가 저리고, **그뿐이다.**", "", "독기가 뱃속에서 삭는다.", "한 걸음, 또 한 걸음.", "", "안개 한가운데에서 **<gold>독각사(毒角蛇)<\/gold>**의 허물을 찾았다.", "허물 안에 **푸른 내단**이 남아 있다."], "Q001.c4.tag": "독룡초", "Q001.c4.text": "가장 짙은 안개 한가운데로 걸어 들어간다", "Q001.c4.o0": ["안개가 폐를 채운다.", "**아무 일도 일어나지 않는다.**", "", "썩어 문드러진 짐승 뼈를 밟고, 검게 죽은 나무 사이를 지났다.", "", "골짜기 가장 깊은 곳.", "**<gold>핏빛 꽃잎을 단 풀 한 포기.<\/gold>**", "", "**<gold>천년 독룡초(毒龍草).<\/gold>**", "여느 무인은 만지기만 해도 녹아내리는 영초다."], "Q002.title": "독이 든 잔", "Q002.desc": ["고을 유지의 연회.", "이름이 알려진 무인들이 한자리에 모였다.", "", "건배를 청하는 손에 잔이 들렸다.", "", "잔을 입에 대기 직전.", "술 향 밑에 **<purple>아주 희미한 쓴내<\/purple>**가 깔려 있다.", "", "맞은편 사내가 웃고 있다.", "**눈은 웃지 않는다.**"], "Q002.c1.tag": "엎기", "Q002.c1.text": "잔을 엎고 사내를 노려본다", "Q002.c1.o0": ["잔이 엎어졌다.", "술이 닿은 탁자가 **<purple>치익<\/purple>** 소리를 낸다.", "", "연회장이 얼어붙었다.", "사내는 창을 깨고 **<red>달아났다.<\/red>**", "", "유지가 사색이 되어 내게 절을 한다."], "Q002.c2.tag": "흘리기", "Q002.c2.text": "마시는 척하며 소매에 흘린다", "Q002.c2.o0": ["소매 안으로 술을 흘렸다.", "", "사내의 얼굴에 **실망**이 스친다.", "연회가 끝날 무렵, 사내는 사라지고 없었다."], "Q002.c2.o1": ["한 모금이 목을 넘어갔다.", "", "**<purple>창자가 뒤틀린다.<\/purple>**", "", "탁자를 붙잡고 내력을 끌어올려 독을 밀어냈다.", "보름을 앓았다."], "Q002.c2.o2": ["한 모금이 목을 넘어갔다.", "", "내력이 **<purple>흩어진다.<\/purple>**", "사내의 웃음소리가 멀어진다."], "Q002.c3.tag": "가늠", "Q002.c3.text": "한 모금만 머금어 독을 가늠한다", "Q002.c3.o0": ["한 모금 머금었다.", "", "혀가 저리다. 뱃속이 한 번 꿈틀한다.", "**버틸 만하다.**", "", "\"…산초 독이군. 싸구려를 썼어.\"", "", "사내의 얼굴이 **<red>하얗게 질린다.<\/red>**", "유지의 호위들이 사내를 덮쳤다.", "", "유지가 감격해 **은자 열 냥**을 내놓는다."], "Q002.c4.tag": "단숨", "Q002.c4.text": "독인 줄 알면서 단숨에 비운다", "Q002.c4.o0": ["잔을 들어 사내를 마주 보았다.", "그리고 **단숨에 비웠다.**", "", "독기가 핏줄을 타고 들어온다.", "들어와서, **흩어진다.**", "", "빈 잔을 내려놓았다.", "\"좋은 술이군. **한 잔 더.**\"", "", "사내의 손이 떨린다.", "품에서 **<purple>검은 독병<\/purple>**이 굴러떨어졌다.", "", "연회장이 뒤집혔다.", "붙잡힌 사내가 피를 토하며 실토한다.", "\"…**사천의 독문**이 시킨 일이오.\"", "", "그날 밤부터 강호에 소문이 돌았다.", "**독을 마셔도 죽지 않는 자.**"], "B001.title": "숨 쉬지 않는 손님", "B001.desc": ["{객잔} 구석 자리.", "", "산발한 노인 하나가 국수를 먹고 있다.", "**감옥에서 숨을 쉬지 않던 그 노인이다.**", "", "쇠사슬도, 간수도 없다.", "노인이 젓가락을 내려놓는다.", "\"…시끄러운 놈. 아직 살아 있었구나.\""], "B001.c1.tag": "가르침", "B001.c1.text": "다음 가르침을 청한다", "B001.c1.o0": ["노인이 국숫값을 내 앞으로 밀었다.", "", "\"그럼 **사흘 동안 숨을 멈춰 봐라.**\"", "\"죽으면 거기까지고.\""], "B001.c2.tag": "술", "B001.c2.text": "술 한 병을 시켜 노인 앞에 놓는다", "B001.c2.o0": ["노인이 말없이 술을 비웠다.", "", "빈 병을 내려놓으며 손가락으로 내 {단전}을 툭 친다.", "\"**막힌 데가 하나 있구나.**\"", "", "그 자리가 뜨끈하게 풀렸다."], "B001.c3.tag": "정체", "B001.c3.text": "어떻게 감옥을 나왔는지 묻는다", "B001.c3.o0": ["\"나왔다니.\"", "", "노인이 웃는다.", "\"**들어가 있었던 적이 없다.** 쉬기 좋은 곳이었을 뿐.\"", "", "눈을 깜빡이는 사이, 노인의 자리가 비어 있었다.", "국숫값과 함께."], "B001_귀식.title": "거북의 숨", "B001_귀식.desc": ["노인의 초막.", "", "\"숨을 멈추는 게 아니다. **숨이 필요 없는 몸이 되는 거다.**\"", "", "노인이 내 가슴에 손바닥을 얹는다.", "\"첫날은 괴롭고, 둘째 날은 무섭고, 셋째 날은 **조용하다.**\""], "B001_귀식.c1.tag": "인내", "B001_귀식.c1.text": "노인의 말대로 천천히 숨을 줄여 간다", "B001_귀식.c1.o0": ["사흘째 새벽.", "", "심장 소리가 아주 멀리서 들린다.", "그런데 **괴롭지 않다.**", "", "노인이 고개를 끄덕인다.", "\"**귀식대법(龜息大法).** 물에 빠져도, 독연기 속에서도 한동안은 살 거다.\""], "B001_귀식.c1.o1": ["둘째 날 밤, 눈앞이 하얘졌다.", "", "노인의 손바닥이 등을 쳤다.", "**숨이 터졌다.**", "", "\"급하면 죽는다고 했지.\"", "그래도 {단전}에 **무언가 남았다.**"], "B001_귀식.c2.tag": "억지", "B001_귀식.c2.text": "하루 만에 끝내려고 숨을 꽉 참는다", "B001_귀식.c2.o0": ["\"쯧.\"", "", "눈을 떴을 때는 초막 밖 풀밭이었다.", "노인은 보이지 않는다.", "**<red>가슴이 찢어질 듯 아프다.<\/red>**"], "B002.title": "의원의 부름", "B002.desc": ["약방 아이가 숨을 헐떡이며 달려왔다.", "\"의원 어르신이 **찾으세요!**\"", "", "약방 안.", "노인이 커다란 약초 바구니를 등에 지고 있다.", "\"깊은 산에 **백 년에 한 번 피는 꽃**이 필 때가 됐네.\"", "\"늙은이 혼자 가기엔 길이 험해서 말이야.\""], "B002.c1.tag": "동행", "B002.c1.text": "짐을 대신 지고 따라나선다", "B002.c1.o0": ["노인의 바구니를 받아 멨다.", "생각보다 **훨씬 무겁다.**", "", "노인이 앞서 걷는다.", "지팡이 소리가 이상하리만치 **가볍다.**"], "B002.c2.tag": "사양", "B002.c2.text": "바쁘다며 사양한다", "B002.c2.o0": ["\"그런가.\"", "", "노인이 서운한 기색 없이 문을 나선다.", "", "사흘 뒤 약방 아이가 **약첩 하나**를 전해 주었다.", "\"어르신이 몸 챙기래요.\""], "B002_약초밭.title": "백 년의 꽃", "B002_약초밭.desc": ["인적 없는 골짜기 끝.", "", "바위틈에 **<gold>은빛 꽃<\/gold>** 한 송이가 막 벌어지고 있다.", "", "그때, 덤불이 갈라진다.", "**<red>집채만 한 멧돼지.<\/red>**", "꽃 냄새를 맡고 온 놈이다.", "", "노인은 꽃 앞에 쭈그려 앉아 **꼼짝도 않는다.**"], "B002_약초밭.c1.tag": "막기", "B002_약초밭.c1.text": "노인 앞을 막아선다", "B002_약초밭.c1.o0": ["멧돼지가 달려든다.", "", "눈을 질끈 감았다.", "", "탁.", "", "눈을 떴을 때, 멧돼지는 **코앞에서 고꾸라져** 있었다.", "노인의 지팡이 끝에 피 한 방울.", "", "\"…늙은이 앞을 막는 놈은 오랜만이군.\"", "노인이 꽃잎 하나를 떼어 내 입에 넣는다.", "**<gold>몸속이 환하게 밝아진다.<\/gold>**", "", "\"내일부터 약방에 나오게. **침 놓는 법**을 가르쳐 주지.\""], "B002_약초밭.c2.tag": "채취", "B002_약초밭.c2.text": "멧돼지가 노인에게 정신 팔린 틈에 꽃을 꺾는다", "B002_약초밭.c2.o0": ["꽃을 꺾어 품에 넣었다.", "", "돌아보니 멧돼지는 쓰러져 있고,", "노인이 **나를 보고 있다.**", "", "\"…그래. 그게 자네 그릇이구먼.\"", "", "노인은 그 뒤로 다시 나를 찾지 않았다."], "B002_약초밭.c3.tag": "도주", "B002_약초밭.c3.text": "노인을 끌고 달아난다", "B002_약초밭.c3.o0": ["노인의 팔을 잡아끌었다.", "**꿈쩍도 하지 않는다.**", "", "멧돼지가 들이받았다.", "**<red>나만 날아갔다.<\/red>**", "", "정신을 차리니 노인이 내 갈비뼈에 침을 놓고 있다.", "\"꽃은 땄네. 수고했어.\""], "B003.title": "유진의 표행", "B003.desc": ["\"이보시오! 은인!\"", "", "청하표국의 깃발을 단 수레 행렬.", "맨 앞에서 **유진**이 손을 흔든다.", "", "\"이번에 큰 짐을 맡았소. 고갯길이 **영 꺼림칙해서.**\"", "\"은인이 함께해 준다면 든든하겠는데.\""], "B003.c1.tag": "동행", "B003.c1.text": "함께 길을 나선다", "B003.c1.o0": ["유진이 활짝 웃는다.", "\"그럴 줄 알았소!\"", "", "수레 행렬이 고갯길로 들어선다.", "**바람이 멎었다.**"], "B003.c2.tag": "사양", "B003.c2.text": "다른 일이 있다며 사양한다", "B003.c2.o0": ["\"아쉽구려.\"", "", "유진이 품에서 **노자**를 꺼내 쥐여 준다.", "\"다음엔 꼭 함께하시오.\""], "B003_습격.title": "고갯길의 매복", "B003_습격.desc": ["고갯마루.", "", "양쪽 비탈에서 **<red>화살<\/red>**이 쏟아진다.", "\"{녹림}이다! 수레를 지켜라!\"", "", "스물이 넘는다.", "**유진의 왼팔에 화살이 박혔다.**"], "B003_습격.c1.tag": "선봉", "B003_습격.c1.text": "앞장서서 녹림의 우두머리를 노린다", "B003_습격.c1.o0": ["화살을 헤치고 비탈을 뛰어올랐다.", "", "바위 위에서 **우두머리**가 칼을 뽑는다.", "\"표국 개 한 마리가 겁도 없이.\""], "B003_습격.c1.o0.win": ["화살을 헤치고 비탈을 뛰어올랐다.", "", "우두머리의 칼을 쳐내고 **목에 칼끝을 겨눴다.**", "\"물러나라.\"", "", "녹림이 썰물처럼 빠졌다.", "", "유진이 피 묻은 손으로 내 어깨를 잡는다.", "\"…은인. 표국에서 **정식 {표사} 자리**를 내주겠소.\""], "B003_습격.c1.o0.lose": ["우두머리의 칼이 **<red>어깨를 갈랐다.<\/red>**", "", "굴러떨어지는 나를 유진이 받아 냈다.", "표사들이 간신히 녹림을 물리쳤다."], "B003_습격.c2.tag": "수레", "B003_습격.c2.text": "수레 곁에서 짐을 지킨다", "B003_습격.c2.o0": ["수레에 붙는 놈들을 막았다.", "", "해 질 녘, 녹림이 물러났다.", "**짐은 하나도 잃지 않았다.**"], "B003_습격.c2.o1": ["수레 셋 중 하나를 빼앗겼다.", "", "유진이 이를 악문다. \"…그래도 사람은 살았소.\""], "B003_습격.c3.tag": "유진", "B003_습격.c3.text": "쓰러진 유진을 업고 화살을 피한다", "B003_습격.c3.o0": ["유진을 업고 바위 뒤로 뛰었다.", "등 뒤로 화살이 **쉭쉭** 박힌다.", "", "녹림이 물러간 뒤, 유진이 웃었다.", "\"두 번이나 목숨을 빚졌구려.\"", "", "유진이 허리춤의 **은장도**를 풀어 준다.", "\"우리 집안에서 형제에게 주는 칼이오.\""], "B003_습격.c3.o1": ["화살 하나가 **<red>등에 박혔다.<\/red>**", "", "유진을 끝까지 내려놓지 않았다.", "정신을 잃기 직전, 표사들의 함성이 들렸다."], "B004.title": "진 소저의 편지", "B004.desc": ["진가장의 하인이 **편지 한 통**을 내민다.", "", "단정한 글씨.", "\"보름날 밤, 성안에 **등불 축제**가 열린다고 합니다.\"", "\"…혹시 시간이 되신다면.\"", "", "편지 끝에 작은 **매화** 하나가 그려져 있다."], "B004.c1.tag": "축제", "B004.c1.text": "보름날 성안으로 간다", "B004.c1.o0": ["보름날 밤.", "", "수천 개의 등불이 강물 위를 흐른다.", "다리 위에서 **진 소저**가 등불을 들고 서 있다."], "B004.c2.tag": "답장", "B004.c2.text": "바쁘다는 답장만 보낸다", "B004.c2.o0": ["답장을 써서 하인에게 들려 보냈다.", "", "며칠 뒤, 다시 하인이 왔다.", "편지 대신 **손수 지은 무복** 한 벌이 들려 있다."], "B004_등불.title": "등불 아래", "B004_등불.desc": ["진 소저가 등불을 강물에 띄운다.", "", "\"빌었어요.\"", "\"…뭘 빌었는지는 **안 알려 드릴 거예요.**\"", "", "그때, 다리 끝에서 비단옷 사내들이 다가온다.", "선두의 공자가 소저와 나를 번갈아 훑는다.", "\"진 소저. **혼담 자리**는 마다하시더니, 이런 떠돌이와 노니십니까?\"", "", "공자가 검집으로 내 가슴을 툭 친다.", "\"떠돌이 주제에. **검을 뽑아 보시오.**\""], "B004_등불.c1.tag": "비무", "B004_등불.c1.text": "공자의 비무를 받는다", "B004_등불.c1.o0": ["공자의 검이 화려하다.", "", "**그뿐이었다.**", "세 수 만에 공자의 검이 강물에 떨어졌다.", "", "구경꾼들의 박수 속에서 진 소저가 내 소매를 잡는다.", "\"…이제 아무도 혼담 얘기는 못 하겠네요.\""], "B004_등불.c1.o1": ["공자의 검이 **<red>옆구리를 스쳤다.<\/red>**", "", "공자가 코웃음을 치며 떠났다.", "", "진 소저가 손수건으로 상처를 누른다.", "\"…바보 같아요. 정말.\"", "손이 떨리고 있다."], "B004_등불.c2.tag": "손", "B004_등불.c2.text": "소저의 손을 잡고 군중 속으로 빠져나간다", "B004_등불.c2.o0": ["소저의 손을 잡고 뛰었다.", "", "등불 사이를 헤치고, 골목을 돌고, 웃음이 터질 때까지.", "", "숨을 고르며 소저가 말한다.", "\"…빌었던 거, **이뤄졌어요.**\"", "", "소저의 손이 놓이지 않는다."], "B004_등불.c3.tag": "물러남", "B004_등불.c3.text": "소저를 위해 조용히 물러난다", "B004_등불.c3.o0": ["\"소저에게 어울리는 자리는 따로 있겠지요.\"", "", "돌아서는 등 뒤로 등불 하나가 강물에 떨어지는 소리.", "", "그날 이후 진가장의 편지는 오지 않았다."], "M001.title": "외눈의 손님", "M001.desc": ["비 오는 저녁.", "", "{무관} 대문 앞에 **삿갓 쓴 사내**가 서 있다.", "삿갓 아래로 **한쪽 눈을 가린 검은 천**.", "", "사범이 마당으로 나온다.", "사범의 얼굴이 **하얗게 질렸다.**", "처음 보는 표정이다.", "", "\"…사제(師弟).\"", "\"이십 년이오, 사형. **보름 뒤, 생사결.**\"", "", "사내는 그 말만 남기고 빗속으로 사라졌다."], "M001.c1.tag": "사연", "M001.c1.text": "사범에게 사연을 묻는다", "M001.c1.o0": ["그날 밤, 사범이 술병을 땄다.", "", "\"이십 년 전, 문파가 마을 하나를 불태우라 명했다.\"", "\"마교 잔당을 숨겨 줬다는 이유로.\"", "", "\"나는 아이들을 업고 도망쳤다.\"", "\"그 난리 통에 사제가 **한쪽 눈을 잃었고.**\"", "", "사범이 잔을 비운다.", "\"배신자는 나다. 사제는 **틀린 게 하나도 없어.**\""], "M001.c2.tag": "추적", "M001.c2.text": "빗속으로 사내의 뒤를 밟는다", "M001.c2.o0": ["골목 끝에서 사내가 멈췄다.", "", "\"따라오는 발소리가 시끄럽군.\"", "", "칼집째 휘두른 일격에 **벽까지 날아갔다.**", "", "\"사형에게 전해라. **도망치지 말라고.**\""], "M001.c2.o1": ["사내는 객잔으로 들어갔다.", "", "창 너머로 본 사내는 혼자 술을 마시며,", "**낡은 목검 하나**를 오래도록 쓰다듬고 있었다."], "M001.c3.tag": "식구", "M001.c3.text": "무관 식구들에게 알리고 함께 대비한다", "M001.c3.o0": ["석두가 주먹을 쥔다.", "\"사범님 혼자 싸우게 둘 순 없지.\"", "", "그날부터 수련생들이 새벽마다 **대문을 지켰다.**", "사범은 아무 말도 하지 않았지만,", "저녁상의 고기가 **한 점씩 늘었다.**"], "M002.title": "생사결", "M002.desc": ["보름째 새벽.", "", "무관 뒤 공터.", "사범과 외눈의 사내가 **열 걸음**을 두고 마주 섰다.", "", "\"사형. 검을 뽑으시오.\"", "사범의 손이 검자루 위에서 **떨린다.**", "", "이십 년 동안 한 번도 검을 뽑지 않은 손이다."], "M002.c1.tag": "곁", "M002.c1.text": "사범의 곁을 지킨다", "M002.c1.o0": ["사범의 등 뒤에 섰다.", "", "사범이 고개를 돌리지 않은 채 말한다.", "\"…고맙다.\"", "", "검이 뽑혔다.", "", "백 합.", "사제의 검이 부러졌고, 사범의 옆구리에서 **<red>피가 쏟아졌다.<\/red>**", "", "사제가 부러진 검을 내려다본다.", "\"…이십 년 동안 **늘었구려, 사형.**\"", "", "사제는 검을 버리고 떠났다."], "M002.c2.tag": "관전", "M002.c2.text": "두 사람의 결투를 지켜본다", "M002.c2.o0": ["숨을 죽이고 지켜보았다.", "", "두 자루의 검이 **새벽을 갈랐다.**", "눈으로 좇을 수 없는 검로.", "", "마지막 일 합.", "사범의 검끝이 사제의 목 앞에서 **멈췄다.**", "", "\"…베시오.\"", "\"못 한다. 이십 년 전에도, 지금도.\"", "", "사제가 웃었다. 처음으로.", "", "사범은 그 자리에 무릎을 꿇었다. **<red>옆구리가 붉게 젖어 있다.<\/red>**"], "M002.c3.tag": "대신", "M002.c3.text": "사범 앞을 막아서며 대신 검을 뽑는다", "M002.c3.o0": ["\"제자가 대신 받겠습니다.\"", "", "사제의 외눈이 가늘어진다.", "\"…사형이 **좋은 제자를 두었군.**\"", "", "삼십 합.", "내 검이 사제의 소매를 베었다.", "", "사제가 검을 거둔다.", "\"됐다. 이 정도면.\"", "", "사제가 사범에게 고개를 숙였다.", "\"사형. 그날 아이들은… **살았소?**\"", "\"…다들 살았다.\"", "\"그럼 됐소.\""], "M002.c3.o1": ["사제의 검이 **<red>어깨를 꿰뚫었다.<\/red>**", "", "쓰러지는 나를 사범이 받아 안았다.", "", "\"…그만하자, 사제.\"", "사범이 처음으로 검을 뽑았다.", "", "결투는 길지 않았다.", "사범도 나도, **피투성이였다.**"], "M002.c3.o2": ["사제의 검은 **보이지 않았다.**", "", "목이 차갑다.", "사범의 외침이 멀리서 들린다."], "M003.title": "마지막 가르침", "M003.desc": ["결투가 끝나고 한 달.", "", "사범이 나를 마당으로 불렀다.", "지팡이를 짚은 채, 낡은 현판을 올려다본다.", "", "\"나는 사제와 함께 **그 마을 터**에 가 보려 한다.\"", "\"이십 년 동안 한 번도 못 갔거든.\"", "", "\"내가 없는 동안 이 무관을 맡아 다오.\"", "\"그리고 언젠가… **네가 이 현판의 주인이 되어라.**\""], "M003.c1.tag": "사양", "M003.c1.text": "정중히 거절한다", "M003.c1.o0": ["\"아직 갈 길이 멉니다.\"", "", "사범이 한참 나를 본다.", "그리고 웃는다.", "\"그래. **그게 맞다.**\"", "", "사범이 품에서 누렇게 바랜 종이 한 장을 꺼낸다.", "\"청하무관 구결의 **마지막 장**이다. 아무에게도 보여 준 적 없다.\"", "", "다음 날 새벽.", "사범과 외눈의 사제가 나란히 대문을 나섰다.", "", "사범은 **한 번도 뒤돌아보지 않았다.**", "대문에 걸린 목검 하나만, 바람에 흔들리고 있었다."], "M003.c2.tag": "후계", "M003.c2.text": "사범의 후계자가 되어 무관을 맡는다", "M003.c2.o0": ["무릎을 꿇고 두 손으로 현판을 받았다.", "", "사범이 내 머리에 손을 얹는다.", "\"…처음 왔을 땐, 물동이 하나 제대로 못 들던 놈이.\"", "", "다음 날부터 나는 **관주 대리**가 되었다.", "새벽마다 대문을 열고, 어린 수련생들의 마보를 봐 주고,", "밤이면 사범의 구결을 한 줄씩 다시 읽었다.", "", "가끔 먼 곳에서 편지가 온다.", "\"마을 터에 **매화**가 피었다.\"", "", "몇 해 뒤.", "돌아온 사범이 새 현판을 직접 걸었다.", "**내 이름이 새겨진 현판이었다.**"], "J001.title": "마지막 겨울", "J001.desc": ["첫눈이 내린 날.", "", "석두가 무관 대문 앞에 서 있다.", "눈이 머리에 쌓이는 줄도 모르고.", "", "\"의원 어르신이… **겨울을 못 넘기신대.**\"", "", "석두가 웃으려다 실패한다."], "J001.c1.tag": "영약", "J001.c1.text": "산을 뒤져 귀한 약초를 구해 온다", "J001.c1.o0": ["사흘 밤낮 눈 덮인 산을 뒤졌다.", "", "손가락이 얼어 터질 무렵,", "눈 속에서 **붉은 열매 하나**를 찾았다.", "", "석두의 어머니는 봄까지 버텼다.", "", "매화가 피던 날 아침.", "어머니가 내 손을 잡았다.", "\"우리 석두… **잘 부탁하네.**\"", "", "그 손이 아주 천천히, 식어 갔다."], "J001.c2.tag": "곁", "J001.c2.text": "석두와 함께 어머니 곁을 지킨다", "J001.c2.o0": ["겨울 내내 석두의 집에서 장작을 팼다.", "", "어머니는 매일 밤 옛날이야기를 했다.", "석두가 어렸을 때 얼마나 울보였는지.", "석두는 그때마다 **귀까지 빨개졌다.**", "", "동짓날 밤.", "어머니가 실 뭉치를 내민다.", "\"자네 것도 떴네. **석두 거랑 똑같이.**\"", "", "다음 날 아침, 어머니는 일어나지 않았다.", "", "목도리가 **따뜻하다.**"], "J001.c3.tag": "돈", "J001.c3.text": "약값에 보태라며 돈을 쥐여 준다", "J001.c3.o0": ["석두가 돈주머니를 한참 내려다본다.", "", "\"…갚을게. 꼭.\"", "", "비싼 약 덕분에 어머니는 고통 없이 겨울을 났다.", "", "정월 대보름.", "석두가 혼자 무관 마당에 서 있었다.", "\"어머니가… **편히 가셨어.**\"", "\"너한테 고맙다고 전해 달래.\""], "J002.title": "석두의 길", "J002.desc": ["어머니를 보내고 한 달.", "", "석두가 보따리를 메고 찾아왔다.", "", "\"나, **변방 군영**에 가려고.\"", "\"여기 있으면 자꾸 어머니 생각이 나서.\"", "", "석두가 머리를 긁적인다.", "\"…말리지 마라.\""], "J002.c1.tag": "만류", "J002.c1.text": "붙잡는다", "J002.c1.o0": ["\"가지 마.\"", "", "석두가 한참 말이 없다.", "", "\"…너는 꼭 그렇게 말할 줄 알았다.\"", "", "석두는 보따리를 내려놓았다.", "", "그해 봄, 석두는 장터 대장간의 **견습**이 되었다.", "가끔 내 칼을 공짜로 갈아 준다.", "\"친구 칼은 원래 공짜야.\""], "J002.c2.tag": "배웅", "J002.c2.text": "보내 준다", "J002.c2.o0": ["마을 어귀까지 걸었다.", "", "석두가 목도리를 고쳐 매며 웃는다.", "\"편지할게. 글은 못 쓰지만 **배워서라도.**\"", "", "석두의 등이 고갯길 너머로 작아진다.", "한 번 돌아보고,", "**크게 손을 흔들었다.**"], "J003.title": "변방에서 온 편지", "J003.desc": ["{객잔} 주인이 **편지 한 통**을 내민다.", "\"변방에서 왔다는구먼. 몇 달은 걸렸겠어.\"", "", "봉투가 흙먼지에 절어 있다."], "J003.c1.tag": "개봉", "J003.c1.text": "편지를 뜯는다", "J003.c1.o0": ["삐뚤빼뚤한 글씨.", "", "\"나 석두. 글 배웠다. 잘 쓰지?\"", "\"여기 바람이 엄청 세. 근데 별이 **청하촌보다 많아.**\"", "\"십부장 됐다. 웃지 마라.\"", "\"돈 좀 보낸다. 밥 굶지 말고.\"", "", "편지 끝에 그림이 하나.", "목도리를 맨 졸라맨 둘이 **어깨동무**를 하고 있다."], "J003.c1.o1": ["낯선 글씨다.", "", "\"석두의 동료입니다.\"", "\"석두는 지난달 오랑캐의 야습 때, 막사의 아이들을 피신시키다…\"", "", "편지가 손에서 미끄러졌다.", "", "봉투 안에 **목검 하나**가 더 들어 있다.", "손잡이에 서툰 글씨가 새겨져 있다.", "", "**\"친구 칼은 원래 공짜야.\"**"], "O001.title": "옥중의 노인", "O001.desc": ["간수가 옆 감방 문을 걷어찬다.", "", "\"늙은이. 밥 먹는 꼴을 못 봤는데 **밥은 왜 받아?**\"", "", "간수가 노인의 주먹밥을 바닥에 내던지고 짓밟는다.", "쇠사슬을 걷어찬다.", "", "노인은 미동도 없다.", "숨소리도 없다."], "O001.c1.tag": "나눔", "O001.c1.text": "간수가 간 뒤 내 주먹밥을 반으로 갈라 건넨다", "O001.c1.o0": ["쇠창살 사이로 주먹밥 반쪽을 밀어 넣었다.", "", "한참 뒤.", "어둠 속에서 **손가락 하나**가 주먹밥을 툭 건드렸다.", "", "\"…먹지도 않는 걸 주는 놈은 처음이군.\""], "O001.c2.tag": "막기", "O001.c2.text": "간수를 막아선다", "O001.c2.o0": ["\"그만하쇼.\"", "", "간수의 몽둥이가 이쪽으로 향했다.", "**<red>사흘을 일어나지 못했다.<\/red>**", "", "나흘째 밤.", "부러진 갈비뼈 위로 **서늘한 기운**이 스며든다.", "옆 감방에서 낮은 목소리.", "\"…바보 같은 놈.\""], "O001.c2.o1": ["\"그만하쇼.\"", "", "간수가 나를 노려보다 혀를 찬다.", "\"미친놈들끼리 잘 놀아라.\"", "", "간수가 사라지자,", "옆 감방의 쇠사슬이 **아주 작게** 찰랑였다."], "O001.c3.tag": "외면", "O001.c3.text": "모른 척 벽을 보고 눕는다", "O001.c3.o0": ["눈을 감았다.", "", "간수의 웃음소리가 멀어진다.", "", "잠들기 전, 옆 감방에서", "**아주 오래된 한숨 같은 것**이 들린 것 같았다."], "O002.title": "마지막 숨", "O002.desc": ["노인의 초막.", "", "노인이 누워 있다.", "처음 보는 모습이다.", "", "\"왔구나.\"", "\"백 년 전에, 원수를 찾을 때까지 **숨을 참기로** 했다.\"", "\"숨을 쉬면 늙으니까.\"", "", "\"원수는 오십 년 전에 죽었더군. 늙어서.\"", "노인이 웃는다.", "\"그 뒤로는… **그만둘 이유가 없었다.**\"", "", "\"감옥에서 주먹밥을 받았을 때 생각했다.\"", "\"**이제 숨을 쉬어도 되겠군.**\""], "O002.c1.tag": "곁", "O002.c1.text": "노인의 손을 잡고 곁을 지킨다", "O002.c1.o0": ["노인이 **숨을 들이쉬었다.**", "", "백 년 만의 숨.", "", "노인의 얼굴에 주름이 번진다.", "머리카락이 눈처럼 하얘진다.", "", "\"…공기가 이렇게 **달았던가.**\"", "", "노인의 손바닥이 내 {단전}에 닿았다.", "따뜻한 것이 **강물처럼** 흘러든다.", "", "\"급하면 죽는다. 잊지 마라.\"", "", "두 번째 숨은 없었다.", "", "초막 밖에서 새가 울었다.", "노인이 백 년 동안 듣지 못했을 소리였다."], "O002.c2.tag": "만류", "O002.c2.text": "숨을 쉬지 말라고 붙잡는다", "O002.c2.o0": ["\"쉬지 마세요. 아직—\"", "", "노인이 내 이마를 손가락으로 툭 쳤다.", "\"급하면 죽는다고 했지.\"", "", "노인이 숨을 들이쉰다.", "길게. 깊게. 그리고 가늘게.", "", "\"…이 숨 하나를 **너에게 남긴다.**\"", "", "노인의 머리맡에서 **낡은 서책**을 찾았다.", "표지에 한 글자.", "", "**식(息)**."], "SYS_SCALE.title": "검은 비늘", "SYS_SCALE.desc": ["(시스템 장면)"], "SYS_SCALE.c1.tag": "비늘", "SYS_SCALE.c1.text": "(시스템)", "SYS_SCALE.c1.o0": ["끝이라고 느낀 순간.", "", "**<gold>쨍.<\/gold>**", "", "품속의 {검은 비늘}이 날아든 일격을 튕겨냈다.", "비늘에는 **흠집 하나 없다.**", "", "상대가 멍하니 굳은 사이, **<green>죽어라 내달렸다.<\/green>**", "", "품속의 비늘이 **차갑게 식었다.** 더는 아무 기척이 없다."]}, "glossary": {"무인": "무공을 익힌 사람. 칼이나 주먹으로 싸우는 무술가.", "무공": "싸움 기술과 기운을 다루는 수련법을 통틀어 이르는 말.", "내공": "수련으로 몸 안에 쌓은 기운. 많을수록 힘과 속도가 강해진다.", "삼류": "무인 등급 중 가장 낮은 단계. 무공에 막 발을 들인 수준.", "영과": "신비한 기운이 깃든 열매. 먹으면 몸이 튼튼해진다.", "금창약": "칼에 베인 상처에 바르는 약.", "은자": "은으로 만든 돈. 한 냥이면 장정 한 달 품삯쯤 된다.", "전낭": "돈을 넣어 허리에 차는 주머니.", "관병": "나라에 속한 병사.", "관부": "고을을 다스리는 관청. 죄인을 잡아들이는 곳이기도 하다.", "국사": "황제의 스승으로 나라의 큰일을 돌보는 사람. 이 세계에서는 황실을 지키는 정체 모를 노인이다.", "도포": "도사들이 입는, 소매가 넓은 긴 옷.", "전각": "궁궐이나 절에 있는 크고 화려한 건물.", "산채": "산적들이 산속에 꾸린 소굴.", "흑풍채": "이 근방 고갯길을 차지한 산적 무리.", "정파": "의리와 명예를 중시하는 명문 무림 세력.", "사파": "이익을 좇는 무림 세력. 산적, 살수, 뒷골목 조직 등.", "마교": "천마를 받드는 거대한 무림 세력. 정파와는 철천지원수다.", "마공": "마교의 무공. 빠르게 강해지지만 몸과 마음을 갉아먹는다.", "혈마공": "피를 매개로 기운을 끌어올리는 마공.", "화산파": "화산에 자리 잡은 이름난 정파 문파. 화려한 검술로 유명하다.", "삼대제자": "문파를 세운 사람으로부터 3대째 이어지는 제자. 문파의 젊은 주력이다.", "마보": "말을 탄 것처럼 무릎을 굽히고 버티는 기초 수련 자세.", "토납법": "숨을 뱉고 들이마시며 몸 안의 기운을 다스리는 호흡 수련법.", "구결": "무공의 요령을 외우기 쉽게 정리한 짧은 글귀.", "시진": "옛 시간 단위. 한 시진은 약 두 시간이다.", "해시": "밤 9시에서 11시 사이.", "객잔": "밥과 술을 팔고 잠자리도 내주는 숙소 겸 식당.", "훈장": "서당에서 아이들에게 글을 가르치는 선생.", "무관": "돈을 받고 무술을 가르치는 도장.", "고뿔": "감기를 이르는 옛말.", "영근": "하늘과 땅의 영기를 빨아들이는 타고난 뿌리라고 한다. 수만 명 가운데 하나 날까 말까 한, 하늘이 고른 그릇.", "이류": "삼류 위의 무인 등급. 웬만한 고을에서는 고수 소리를 듣는다.", "투전": "패를 뽑아 끗수를 겨루는 노름.", "보부상": "물건을 지고 이 장터 저 장터를 떠도는 장사꾼.", "기녀": "술자리에서 노래와 춤으로 손님을 접대하는 여인.", "법력": "무공과는 결이 다른, 정체 모를 힘. 내공으로는 설명되지 않는다.", "무복": "무술을 익힐 때 입는 활동하기 편한 옷.", "사문": "자신이 속한 문파를 높여 부르는 말.", "상단": "여럿이 함께 장사하는 큰 상인 조직.", "죽비": "대나무로 만든 회초리 같은 도구. 수련생을 깨우칠 때 친다.", "검은 비늘": "뿔 달린 자가 남긴 비늘. 차갑고 단단하다. 쓰는 법은 모르지만, 하계의 어떤 칼도 흠집 하나 내지 못한다.", "용의 정혈": "뿔 달린 자가 남긴 피 한 방울. 지금은 그 쓰임을 알 수 없다.", "동전": "구리로 만든 작은 돈. 백 닢을 꿰어 한 꾸러미, 천 닢이면 은자 한 냥쯤 된다.", "비무": "무예를 겨루는 일. 목숨을 걸지 않는 대련.", "표국": "돈을 받고 물건이나 사람을 지켜 실어 나르는 곳.", "표사": "표국에 속해 짐을 지키는 무인.", "정식 제자": "잡일꾼이 아니라 정식으로 무공을 배우는 제자.", "비급": "무공의 비법을 적은 책.", "운기조식": "몸 안의 기운을 돌려 다스리고 쌓는 수련.", "단전": "배꼽 아래, 기운이 모이는 곳.", "폐관": "바깥과 연락을 끊고 틀어박혀 수련하는 일.", "내상": "몸 안, 기운이 다니는 길이 다친 것.", "녹림": "산적 무리를 점잖게 이르는 말.", "표두": "표국 일행을 이끄는 우두머리.", "무당파": "태극의 이치를 따르는 이름난 정파 문파.", " 의 생사결에서 대신 나서 이긴다.", "마지막_가르침.name": "마지막 가르침", "마지막_가르침.desc": "사범이 구결의 마지막 장을 남기고 떠났다. 한 번도 뒤돌아보지 않았다.", "마지막_가르침.hint": "모든 부탁을 들어줄 필요는 없다.", "마지막_가르침.cond": "무관을 맡아 달라는 부탁을 정중히 거절한다.", "청하무관의_주인.name": "청하무관의 후계자", "청하무관의_주인.desc": "사범이 떠난 무관을 지켰고, 훗날 현판에 내 이름이 걸렸다.", "청하무관의_주인.hint": "물동이도 못 들던 잡일꾼이 있었다.", "청하무관의_주인.cond": "사범의 후계자가 되어 무관을 맡는다.", "봄까지.name": "봄까지", "봄까지.desc": "석두의 어머니는 매화가 피던 날 떠났다.", "봄까지.hint": "겨울을 넘기게 해 줄 무언가.", "봄까지.cond": "석두 어머니를 위해 눈 덮인 산에서 약초를 구한다.", "똑같은_목도리.name": "똑같은 목도리", "똑같은_목도리.desc": "석두 것과 똑같은 목도리를 받았다.", "똑같은_목도리.hint": "곁에 있어 주는 것만으로 충분할 때가 있다.", "똑같은_목도리.cond": "석두와 함께 어머니의 마지막 겨울을 지킨다.", "변방의_별.name": "변방의 별", "변방의_별.desc": "변방에서 석두의 소식이 왔다.", "변방의_별.hint": "떠난 친구는 편지를 쓰겠다고 했다.", "변방의_별.cond": "변방으로 떠난 석두의 편지를 받는다.", "마지막_숨.name": "마지막 숨", "마지막_숨.desc": "백 년 동안 숨을 참던 노인이, 마침내 숨을 쉬었다.", "마지막_숨.hint": "감옥에서 건넨 주먹밥 반쪽.", "마지막_숨.cond": "옥중 노인의 마지막을 함께한다."}, "codex": {"뿔_달린_자.name": "뿔 달린 자", "뿔_달린_자.s0": "하늘이 갈라진 날, 구름 위를 지나가던 존재. 검은 뿔과 흑요석 비늘.", "뿔_달린_자.s1": "벌레 따위는 쳐다보지도 않는다. 지나간 자리에 비늘이나 피가 떨어져 있을 뿐.", "뿔_달린_자.s2": "눈을 마주하고도 버틴 범인을 기억하겠다고 했다.", "떠돌이_무인.name": "떠돌이 무인", "떠돌이_무인.s0": "숲에서 피투성이로 쓰러져 있던 무인.", "떠돌이_무인.s1": "검은 옷의 자들에게 쫓기고 있다. 말수가 적고 칼이 빠르다.", "떠돌이_무인.s2": "나를 제자로 받아들였다.", "떠돌이_무인.s3": "마교에서 도망친 자. 낡은 책도 그가 훔쳤다. 마교를 버리며 제 칼을 만들었다.", "떠돌이_무인.s4": "마교 장로는 그를 묻었다고 했다. 거짓말이었다. 아직 살아 있다.", "떠돌이_무인.s5": "마교 안의 제 사람들 명단을 품고 있었다. 그 목패의 끝을 내가 정했다.", "약초꾼_노인.name": "약초꾼 노인", "약초꾼_노인.s0": "산비탈에서 약초를 캐던 노인.", "약초꾼_노인.s1": "청하촌 약방 주인이 허리를 숙이는 의원이었다.", "약초꾼_노인.s2": "지팡이 한 번에 사람 목숨을 거둔다. 평범한 노인이 아니다.", "약초꾼_노인.s3": "일류가 된 나를 보고도 여전히 벌레라 불렀다. 무인이 아닐지도 모른다.", "국사.name": "국사", "국사.s0": "황궁 뒤편 전각의 백발 노인. 눈빛만으로 사람을 짓누른다.", "국사.s1": "발이 땅에서 뜬 사자를 부린다. 무인이 아니라, 그 위의 존재.", "국사.s2": "내가 이방인이라는 사실을 안다. 살려 두고 몇 번이고 들여다보려 한다.", "국사.s3": "나를 칼처럼 부린다. 쓸모가 다하는 날이 언제일지는 모른다.", "진우.name": "진우", "진우.s0": "화산파 삼대제자. 흑풍채에 붙잡혀 있던 걸 구해 주었다.", "진우.s1": "은혜를 갚으러 산길을 찾아왔다. 의리가 있다.", "남궁현.name": "남궁현", "남궁현.s0": "남궁세가의 자제. 새 신발에 굳은살 없는 손으로 비무를 청해 왔다.", "남궁현.s1": "이류가 되어 다시 찾아왔다. 손바닥에 굳은살이 박였다.", "남궁현.s2": "남궁세가로 나를 초대했다. 가주 앞에서도 내 편을 들었다.", "문신의_사내.name": "문신의 사내", "문신의_사내.s0": "얼굴 반쪽을 덮은 검붉은 문신. 검은 옷의 자들을 이끈다.", "문신의_사내.s1": "일류의 무위. 사부를 배신자라 부른다.", "문신의_사내.s2": "내 칼에 쓰러졌다.", "석두.name": "석두", "석두.s0": "청하무관의 수련생. 숨을 배꼽 아래로 내리라고 알려 주었다.", "석두.s1": "어머니가 오래 앓고 있다.", "왕두.name": "칼자국 왕두", "왕두.s0": "이마에 칼자국. 청하무관의 골목대장.", "왕두.s1": "흑풍채에 아버지의 객잔을 잃었다. 그 칼자국도 그날 생겼다.", "외팔이_노도.name": "외팔이 노도", "외팔이_노도.s0": "흑풍채의 늙은 칼잡이. 한 손으로도 통나무를 소리 없이 가른다.", "외팔이_노도.s1": "원래 표국의 표사. 흑풍채에 표물과 왼팔을 함께 잃었다.", "곽철.name": "곽철", "곽철.s0": "흑풍채 부두목. 손이 늘 칼자루 근처에 머문다.", "곽철.s1": "두목을 몰아내고 그 자리에 앉았다.", "연화.name": "연화", "연화.s0": "연화루의 기녀. 비파를 뜯으며 손님의 칼 냄새를 맡는다.", "연화.s1": "누구를 베었다는 무인들의 자랑에 지쳐 있다.", "연화.s2": "연화루를 떠났다. 갚겠다는 말을 자주 한다.", "소운.name": "소운", "소운.s0": "객잔 앞에 사흘을 무릎 꿇고 있던 꼬마. 손바닥에 굳은살.", "소운.s1": "나의 첫 제자. 가르치다 보면 내가 더 배운다.", "마교_장로.name": "마교 장로", "마교_장로.s0": "검붉은 장포의 노인. 사부를 쫓는다.", "마교_장로.s1": "사부의 칼에 쓰러졌다.", "토납법.name": "토납법", "토납법.s0": "감옥의 노인이 가르쳐 준 호흡법.", "토납법.s1": "들이쉼은 길게, 머묾은 깊게, 내쉼은 가늘게. 급하면 탈이 난다.", "토납법.s2": "핵심은 머묾. 숨이 아니라 마음을 붙잡는다.", "이름_없는_심법.name": "이름 없는 심법", "이름_없는_심법.s0": "가짜 비급 더미에 끼어 있던 진짜 호흡법. 누가 베꼈는지 알 수 없다.", "청하심결.name": "청하심결", "청하심결.s0": "청하무관에 대대로 내려오는 구결. 정식 제자 중 하나에게만 전한다.", "청하심결.s1": "익혔다. 기운이 처음 느껴 보는 방향으로 돈다.", "화산_기초검법.name": "화산의 기초 검법", "화산_기초검법.s0": "진우에게 배운 화산의 기초. 사흘 밤낮을 휘둘러 가지 끝으로 바람을 갈랐다.", "외팔이의_도법.name": "외팔이의 도법", "외팔이의_도법.s0": "칼은 팔이 아니라 허리로 휘두른다.", "외팔이의_도법.s1": "천한 번째에 칼끝이 바람을 갈랐다. 그때 처음 기가 돌았다.", "사부의_검법.name": "사부의 검", "사부의_검법.s0": "마교의 것이 아니다. 사부가 마교를 버리며 만든 칼.", "혈마공.name": "혈마공", "혈마공.s0": "검붉은 먹으로 사람 몸 위의 선을 그린 책. 보고 있으면 속이 울렁인다.", "혈마공.s1": "마교의 무공. 이름은 혈마공.", "혈마공.s2": "빠르게 강해진다. 대신 몸과 마음을 갉아먹는다.", "흑풍채.name": "흑풍채", "흑풍채.s0": "이 근방 고갯길을 차지한 산적 무리.", "흑풍채.s1": "들어가려면 값을 치러야 한다. 대개 남의 목숨으로.", "흑풍채.s2": "무너졌다.", "청하무관.name": "청하무관", "청하무관.s0": "청하촌의 허름한 무관. 잡일꾼을 구한다.", "청하무관.s1": "보름마다 비무를 열어 정식 제자를 뽑는다.", "청하무관.s2": "사범이 진 빚에 시달린다. 빚쟁이는 흑풍채다.", "청하표국.name": "청하표국", "청하표국.s0": "청하촌   // blocks: 이 표시가 달린 결과(예: "food": true)가 나오면 그 결과를 빼고 다시 굴리고, 결과 화면에 체질 발동을 표시한다
  // tiers: 단계별 이름(언어 파일 karmaScreen.traits.<이름>), 값, 막는 결과 표시
  traits: [
    { id: "철위", tiers: [{ name: "철위", price: 200, blocks: ["food"] }, { name: "만독불침", price: 800, blocks: ["food", "poison"] }] },
    { id: "수화불침", tiers: [{ name: "수화불침", price: 200, blocks: ["chill"] }, { name: "한서불침", price: 800, blocks: ["chill", "frost"] }] },
    { id: "선면", tiers: [{ name: "선면", price: 200, blocks: ["wary"] }] },

  testKarma: 50000, // 시험용: 설정 화면에서 업을 넣는 버튼 (0이면 버튼 숨김, 출시 전 0으로)
  // 전투: 명중 = baseHit + (내 민첩 - 상대 민첩)×perAgi - 상대 행운×perLuckEvade + 경지 차×perRealmHit (minHit~maxHit)
  // 피해 = (1 + 근골×perStr + 경지 우위×perRealmDmg) × (무공 배율) × 0.85~1.15, 치명타 = baseCrit + 행운×perLuckCrit (피해 2배), 방어 = 받는 피해 guard만큼 감소
  combat: { baseHit: 75, perAgi: 3, perLuckEvade: 1, perRealmHit: 8, minHit: 15, maxHit: 95, perStr: 0.5, perRealmDmg: 1, baseCrit: 5, perLuckCrit: 2, guard: 0.7, lineDelay: 1000 },
  combatEnabled: false, // false면 전투 화면 없이 속으로 싸움을 계산해 결과만 보여 준다

  storage: { meta: "sunheyb.meta.v1", save: "sunheyb.save.v2", settings: "sunheyb.settings.v1" },

  fallbackEvents: { 0: "D_삼류의_문턱" },

  scaleGuard: { item: "검은_비늘", event: "SYS_SCALE", usedFlag: "비늘이_막음" }, // 한 생에 한 번만

// 브라우저 저장소 감싸기. 저장이 막힌 환경에서도 게임이 멈추지 않게 한다.
const Store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (_) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (_) {}
  },
};

// 시드 가능한 난수. 같은 시드면 같은 결과가 나와서 버그 재현이 쉽다.
class Rng {
  constructor(seed = Date.now()) {
    this.s = seed >>> 0;
  }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  percent() {
    return this.next() * 100;
  }
  pickWeighted(list, weightOf) {
    const total = list.reduce((s, x) => s + weightOf(x), 0);
    let r = this.next() * total;
    for (const x of list) {
      r -= weightOf(x);
      if (r < 0) return x;
    }
    return list[list.length - 1];
  }
}

// 한 번의 생(生) 동안의 주인공 상태.
class GameState {
  constructor(config) {
    this.stats = { ...config.startStats };
    this.items = [...config.startItems];
    this.flags = new Set();
    this.bonds = {};
    this.reputation = {};
    this.affiliation = null;
    this.situation = null; // 지금 처한 상황(예: "수감"). 있으면 그 상황의 장면만 나온다
    this.seen = new Set();
    this.outcomesSeen = [];
    this.achievements = [];
    this.scenes = 0;
    this.lastEventId = null;
    this.recent = []; // 최근 본 장면 3개
    this.termCounts = {}; // 이번 생에 용어 밑줄이 나온 횟수
    this.rare = 0; // 이번 생에 터진 드문 인과 수
    this.log = []; // 하단 기록창 내용 {title, tag, changes, dead}
    this.dead = false;
    this.ending = null; // 귀결(이야기가 매듭지어진 결말) id
    this.pastBonds = {}; // 지난 생들의 최고 인연 (기시감)
  }
  stat(name) {
    return this.stats[name] ?? 0;
  }
  hasItem(name) {
    return this.items.includes(name);
  }
  addItem(name) {
    this.items.push(name);
  }
  removeItem(name) {
    const i = this.items.indexOf(name);
    if (i >= 0) this.items.splice(i, 1);
  }
}

// 데이터 읽기. 이벤트 묶음 목록은 data/events/index.json에 있다.
// 단일 파일로 빌드된 판에서는 window.EVENT_DATA / window.ACHIEVEMENT_DATA를 그대로 쓴다.
class EventLoader {
  constructor(indexPath, achievementsPath, codexPath) {
    this.codexPath = codexPath;
    this.indexPath = indexPath;
    this.achievementsPath = achievementsPath;
  }
  async load() {
    if (window.EVENT_DATA) return this.merge(window.EVENT_DATA);
    const base = this.indexPath.slice(0, this.indexPath.lastIndexOf("/") + 1);
    const index = await (await fetch(this.indexPath)).json();
    const batches = await Promise.all(index.batches.map(async (f) => (await fetch(base + f)).json()));
    return this.merge(batches);
  }
  async loadCodex() {
    const data = window.CODEX_DATA ?? (await (await fetch(this.codexPath)).json());
    return data.sections;
  }
  async loadCombat() {
    return window.COMBAT_DATA ?? (await (await fetch("data/combat.json")).json());
  }
  async loadAchievements() {
    const data = window.ACHIEVEMENT_DATA ?? (await (await fetch(this.achievementsPath)).json());
    return data.achievements;
  }
  merge(batches) {
    const byId = new Map();
    for (const b of batches) for (const ev of b.events) byId.set(ev.id, ev);
    return byId;
  }
}

// 조건 판정과 다음 장면 고르기.
// pool 종류: "pool"(기본, 무작위 등장) / "chain"(다른 장면의 next_event로만) / "fixed"(정해진 때에만, 예: 첫 장면)
function meetsCondition(state, cond = {}) {
  if (cond.items && !cond.items.every((i) => state.hasItem(i))) return false;
  if (cond.flags && !cond.flags.every((f) => state.flags.has(f))) return false;
  if (cond.flags_any && !cond.flags_any.some((f) => state.flags.has(f))) return false;
  if (cond.flags_none && cond.flags_none.some((f) => state.flags.has(f))) return false;
  if (cond.stat_min && !Object.entries(cond.stat_min).every(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.stat_min_any && !Object.entries(cond.stat_min_any).some(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.realm_min != null && state.stat("경지") < cond.realm_min) return false;
  if (cond.realm_max != null && state.stat("경지") > cond.realm_max) return false;
  // 인연: { 인물: 최소 인연 }
  if (cond.bond_min && !Object.entries(cond.bond_min).every(([k, v]) => (state.bonds?.[k] ?? 0) >= v)) return false;
  // 전생의 인연: { 인물: 지난 생들에서 쌓았던 최고 인연 } — 기시감 선택지
  if (cond.past_bond_min && !Object.entries(cond.past_bond_min).every(([k, v]) => (state.pastBonds?.[k] ?? 0) >= v)) return false;
  // 체질: { 체질id: 최소 단계 } — 켜 둔 체질이 그 단계 이상일 때만
  if (cond.traits && !Object.entries(cond.traits).every(([k, v]) => (state.traits?.[k] ?? 0) >= v)) return false;
  // 소속: "none"이면 무소속일 때만, 이름이면 그 소속일 때만. affiliation_not은 그 소속이면 안 됨.
  const aff = state.affiliation ?? "none";
  if (cond.affiliation && cond.affiliation !== aff) return false;
  if (cond.affiliation_not && cond.affiliation_not.includes(aff)) return false;
  return true;
}

class EventSelector {
  constructor(eventsById, rng, config) {
    this.events = eventsById;
    this.rng = rng;
    this.config = config;
  }
  // 인과록 기반 새로움 가중치 (NoveltyWeigher)
  useNovelty(weigher) {
    this.novelty = weigher;
  }
  byId(id) {
    return this.events.get(id) ?? null;
  }
  next(state) {
    // repeat=true인 장면(수련 등)은 여러 번 나올 수 있다. 단, 방금 본 장면은 다른 후보가 있으면 건너뛴다.
    let pool = [...this.events.values()].filter(
      (ev) =>
        (ev.pool ?? "pool") === "pool" &&
        (ev.situation ?? null) === (state.situation ?? null) && // 상황(감옥 등)에 맞는 장면만
        (ev.repeat || !state.seen.has(ev.id)) &&
        meetsCondition(state, ev.conditions)
    );
    // 최근에 본 장면(최대 3개)은 다른 후보가 있으면 건너뛴다.
    const recent = state.recent ?? [state.lastEventId];
    for (let n = recent.length; n > 0; n--) {
      const left = pool.filter((ev) => !recent.slice(-n).includes(ev.id));
      if (left.length) { pool = left; break; }
    }
    if (!pool.length) {
      // 이 경지에서 더 나올 장면이 없으면 경지별 마지막 장면(한 번만)
      const fb = this.byId(this.config.fallbackEvents?.[state.stat("경지")]);
      return fb && !state.seen.has(fb.id) ? fb : null;
    }
    // 내 소속과 같은 group의 장면은 더 자주 나온다.
    const boost = (ev) => (ev.group && ev.group === state.affiliation ? this.config.affiliationBoost : 1) * this.personBoost(ev, state);
    const fresh = (ev) => (this.novelty ? this.novelty.weight(ev, state) : 1);
    return this.rng.pickWeighted(pool, (ev) => (ev.weight ?? this.config.defaultWeight) * boost(ev) * fresh(ev));
  }
  // 인연을 쌓은 인물이 나오는 장면(person)은 더 자주 나온다: 인연 n당 ×(1 + n/perBond), 최대 maxBond배
  personBoost(ev, state) {
    if (!ev.person) return 1;
    const { perBond, max } = this.config.personBoost;
    const people = Array.isArray(ev.person) ? ev.person : [ev.person];
    const best = Math.max(0, ...people.map((p) => state.bonds?.[p] ?? 0));
    return Math.min(max, 1 + best / perBond);
  }
  // 비추천(warn) 선택지는 항상 맨 뒤로 보낸다.
  availableChoices(ev, state) {
    const ok = ev.choices.filter((c) => meetsCondition(state, c.condition));
    return [...ok.filter((c) => !c.warn), ...ok.filter((c) => c.warn)];
  }
}

// 새로움 가중치: 인과록(모든 생의 기록)을 보고, 아직 못 본 것이 남은 장면을 더 자주 띄운다.
// 노려볼 만한 것(지금 고를 수 있는 선택지 + 기본 확률 minChance% 이상, 또는 기본 결과)만 센다.

class NoveltyWeigher {
  constructor(record, config) {
    this.record = record;
    this.cfg = config.novelty;
  }
  // 지금 상태에서 노려볼 만한 결과들 [{ evId, choice, outcome, index }]
  reachable(ev, state) {
    const out = [];
    for (const c of ev.choices) {
      if (!meetsCondition(state, c.condition)) continue;
      c.outcomes.forEach((o, index) => {
        if (o.effects?.death) return;
        if (o.chance != null && o.chance < this.cfg.minChance) return;
        out.push({ choice: c, outcome: o, index });
      });
    }
    return out;
  }
  // 이번 생에 겪은 결과까지 포함해 본 적 있는지
  seenOutcome(state, key) {
    return this.record.data.outcomes.includes(key) || state.outcomesSeen.includes(key);
  }
  weight(ev, state) {
    const rec = this.record;
    if (!rec.knows(`ev:${ev.id}`)) return this.cfg.unseen;
    const reach = this.reachable(ev, state);
    let w = 1;
    if (reach.some((r) => !this.seenOutcome(state, `${ev.id}:c${r.choice.id}.o${r.index}`))) w *= this.cfg.outcome;
    if (reach.some((r) => r.outcome.effects?.achievement && !rec.data.achievements.includes(r.outcome.effects.achievement))) w *= this.cfg.achievement;
    const people = ev.person ? (Array.isArray(ev.person) ? ev.person : [ev.person]) : [];
    const items = reach.flatMap((r) => r.outcome.effects?.items ?? []);
    if (people.some((p) => !rec.knows(`bond:${p}`)) || items.some((x) => !rec.knows(`item:${x}`))) w *= this.cfg.codex;
    return w;
  }
  // 아직 한 번도 골라 본 적 없는 선택지 (모든 생 + 이번 생)
  isFreshChoice(evId, choiceId, state) {
    const p = `${evId}:c${choiceId}.`;
    return !this.record.data.outcomes.some((k) => k.startsWith(p)) && !state.outcomesSeen.some((k) => k.startsWith(p));
  }
}

// 선택 결과 판정(확률 + 스탯 보정)과 효과 적용.

class ResultResolver {
  constructor(rng, config) {
    this.rng = rng;
    this.config = config;
  }

  chanceOf(outcome, state) {
    let c = outcome.chance;
    for (const [stat, per] of Object.entries(outcome.mods ?? {})) c += per * state.stat(stat);
    // 하한은 chanceMin이지만, 원래부터 그보다 낮게 잡은 극악 확률은 그대로 둔다.
    return Math.min(this.config.chanceMax, Math.max(Math.min(this.config.chanceMin, outcome.chance), c));
  }

  // 드문 인과: 기본 확률이 rareChance 이하이면서 죽음이 아닌 결과.
  isRare(outcome) {
    return outcome.chance != null && outcome.chance <= this.config.rareChance && !outcome.effects?.death;
  }

  // chance가 있는 결과들을 차례로 쌓고, 남은 확률은 chance 없는 결과가 가져간다.
  // deaths: 전생에 이 선택지에서 죽은 횟수. 죽음 확률을 조금 깎아준다(전생의 기억).
  //  - 죽음 결과에 chance가 있으면 그만큼 빼고,
  //  - 죽음이 나머지 확률이면 처음 나오는 평범한 생존 결과에 더한다.
  //  - 드문 인과(대박)는 배율로만 조금 올려서 대박의 희소함은 지킨다.
  pick(choice, state, deaths = 0) {
    // noDeathIf: 이 조건을 채우면 이 선택지에서는 죽지 않는다 (남은 확률은 마지막 생존 결과가 가져감)
    if (choice.noDeathIf && meetsCondition(state, choice.noDeathIf)) {
      const alive = choice.outcomes.filter((o) => !o.effects?.death);
      const last = alive[alive.length - 1];
      choice = { ...choice, outcomes: alive.map((o) => (o === last ? { ...o, chance: undefined } : o)) };
    }
    const m = this.config.deathMemory;
    const bonus = Math.min(m.cap, deaths * m.perDeath);
    const outs = choice.outcomes;
    const fallback = outs.find((o) => o.chance == null) ?? null;
    const fallbackDeath = !!fallback?.effects?.death;
    let boosted = false;
    const r = this.rng.percent();
    let acc = 0;
    for (const o of outs) {
      if (o.chance == null) continue;
      let c = this.chanceOf(o, state);
      if (bonus) {
        if (o.effects?.death) c = Math.max(0, c - bonus);
        else if (this.isRare(o)) c *= 1 + Math.min(m.rareCap, deaths * m.rarePerDeath);
        else if (fallbackDeath && !boosted) { c += bonus; boosted = true; }
      }
      acc += c;
      if (r < acc) return o;
    }
    return fallback ?? outs[outs.length - 1];
  }

  // 효과를 적용하고, 화면에 보여줄 변화 목록(언어와 무관한 구조)을 돌려준다.
  apply(outcome, state) {
    const changes = [];
    const e = outcome.effects ?? {};
    for (const [k, v] of Object.entries(e)) {
      // 없앤 능력치(체력 등)는 적용하지 않는다
      if (this.config.disabledStats?.includes(k.replace(/_set$/, ""))) continue;
      if (k === "death") state.dead = !!v;
      else if (k === "items") v.forEach((i) => { state.addItem(i); changes.push({ type: "gain", item: i, good: true }); });
      else if (k === "items_remove") v.forEach((i) => { state.removeItem(i); changes.push({ type: "lose", item: i, good: false }); });
      else if (k === "items_clear") { if (state.items.length) changes.push({ type: "loseAll", good: false }); state.items = []; }
      else if (k === "flags") v.forEach((f) => state.flags.add(f));
      else if (k === "flags_remove") v.forEach((f) => state.flags.delete(f));
      else if (k === "achievement") state.achievements.push(v);
      else if (k === "next_event" || k === "전투") continue;
      else if (k === "ending") state.ending = v;
      // 전투 기세 같은 임시 수치를 조용히 0으로 (예: "기세_reset": true)
      // 체력 회복·피해: 단계(조금/제법/완전, 가볍게/크게/치명)를 최대 체력 비율로
      else if (k === "회복" || k === "피해") {
        const max = state.stat("최대체력");
        const amt = Math.max(1, Math.ceil(max * this.config.hpTiers[k][v]));
        state.stats.체력 = k === "회복" ? Math.min(max, state.stat("체력") + amt) : state.stat("체력") - amt;
        changes.push({ type: "hp", kind: k, tier: v, good: k === "회복" });
      }
      else if (k.endsWith("_reset")) state.stats[k.slice(0, -6)] = 0;
      else if (k === "realm_set") { if (v > state.stat("경지")) state.stats.체력 = state.stat("최대체력"); state.stats.경지 = v; changes.push({ type: "realm", value: v, good: true }); }
      else if (k.endsWith("_set")) { const s = k.slice(0, -4); state.stats[s] = v; changes.push({ type: "set", stat: s, value: v, good: false }); }
      else if (k === "상황") {
        // 상황 "없음"은 상황에서 벗어난다 (예: 감옥에서 풀려남)
        state.situation = v === "없음" ? null : v;
        changes.push({ type: "situation", name: v, good: v === "없음" });
      }
      else if (k === "소속") {
        // 소속 "없음"은 무소속으로 되돌린다.
        state.affiliation = v === "없음" ? null : v;
        changes.push(v === "없음" ? { type: "leave", good: false } : { type: "join", name: v, good: true });
      }
      else if (k === "인연") { addAll(state.bonds, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "bond", name: who, delta: d, good: d > 0 }); }
      else if (k === "평판") { addAll(state.reputation, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "fame", name: who, delta: d, good: d > 0 }); }
      else if (typeof v === "number") {
        state.stats[k] = state.stat(k) + v;
        changes.push({ type: "stat", stat: k, delta: v, good: v > 0 });
      }
    }
    if (state.stat("체력") <= 0) state.dead = true;
    return changes;
  }
}

function addAll(target, deltas) {
  for (const [k, d] of Object.entries(deltas)) target[k] = (target[k] ?? 0) + d;
}


// 전투 엔진: 화면과 상관없이 합(合) 단위로 계산만 한다.
// 근골 = 피해량, 민첩 = 명중·회피(선공도 민첩), 행운 = 치명타·회피 보정, 내공 = 무공 위력(쓸 때 소모, 끝나면 복구)
class Battle {
  constructor(rng, config, player, enemy, arts, items = []) {
    this.rng = rng;
    this.cfg = config.combat;
    this.config = config;
    this.player = player; // GameState
    this.enemy = { ...enemy, hp: enemy.체력, max: enemy.체력 };
    this.arts = arts; // 지금 쓸 수 있는 무공
    this.itemDefs = items; // 전투 소지품 정의 (data/combat.json items)
    this.buff = {}; // 소지품으로 오른 능력치 (이번 전투만)
    this.usedOnce = new Set();
    this.enemyBlind = false;
    this.after = []; // 전투가 끝나면 받을 피해 단계
    this.neigongStart = player.stat("내공");
    this.round = 0;
    this.over = null; // "win" | "lose"
    // 민첩이 높은 쪽이 먼저 친다 (같으면 나)
    this.playerFirst = player.stat("민첩") >= enemy.민첩;
  }
  // 공격자 능력치 묶음
  me() {
    const s = this.player;
    const b = this.buff;
    return { 근골: s.stat("근골") + (b.근골 ?? 0), 민첩: s.stat("민첩") + (b.민첩 ?? 0), 행운: s.stat("행운") + (b.행운 ?? 0), realm: s.stat("경지") };
  }
  hitChance(att, def) {
    const c = this.cfg;
    const v = c.baseHit + (att.민첩 - def.민첩) * c.perAgi - def.행운 * c.perLuckEvade + (att.realm - def.realm) * c.perRealmHit;
    return Math.max(c.minHit, Math.min(c.maxHit, v));
  }
  damage(att, def, mult = 1) {
    const c = this.cfg;
    const base = 1 + att.근골 * c.perStr + Math.max(0, att.realm - def.realm) * c.perRealmDmg;
    const spread = 0.85 + this.rng.next() * 0.3;
    return Math.max(1, Math.round(base * mult * spread));
  }
  // 한 번의 공격. 결과 { who, hit, crit, dmg, art }
  strike(who, art = null, guarded = false) {
    const att = who === "me" ? this.me() : this.enemy;
    const def = who === "me" ? this.enemy : this.me();
    const res = { who, art: art?.id ?? null, hit: false, crit: false, dmg: 0 };
    // 눈이 가려진 놈의 공격은 반드시 빗나간다
    if (who === "enemy" && this.enemyBlind) { this.enemyBlind = false; res.blind = true; return res; }
    if (this.rng.percent() >= this.hitChance(att, def)) return res;
    res.hit = true;
    let mult = 1;
    if (art) mult = art.power + this.player.stat("내공") * art.perNeigong * 0.1;
    if (this.rng.percent() < this.cfg.baseCrit + att.행운 * this.cfg.perLuckCrit) { res.crit = true; mult *= 2; }
    let dmg = this.damage(att, def, mult);
    if (guarded) dmg = Math.max(0, Math.round(dmg * (1 - this.cfg.guard)));
    res.dmg = dmg;
    if (who === "me") this.enemy.hp -= dmg;
    else this.player.stats.체력 = this.player.stat("체력") - dmg;
    return res;
  }
  // 한 합: action = { type: "attack" | "art" | "guard", art }
  turn(action) {
    this.round += 1;
    const log = [];
    const art = action.type === "art" ? action.art : null;
    if (action.type === "item") log.push(this.useItem(action.item));
    if (art) this.player.stats.내공 = this.player.stat("내공") - art.cost;
    const guard = action.type === "guard";
    const mine = () => { if (!guard && action.type !== "item") log.push(this.strike("me", art)); };
    const theirs = () => { log.push(this.strike("enemy", null, guard)); };
    const order = this.playerFirst ? [mine, theirs] : [theirs, mine];
    for (const step of order) {
      step();
      if (this.enemy.hp <= 0) { this.over = "win"; break; }
      if (this.player.stat("체력") <= 0) { this.over = "lose"; break; }
    }
    return log;
  }
  // 소지품 쓰기. 결과 { who: "item", item, ... }
  useItem(def) {
    const s = this.player;
    if (def.heal) {
      const max = s.stat("최대체력");
      const amt = Math.max(1, Math.ceil(max * this.config.hpTiers.회복[def.heal]));
      s.stats.체력 = Math.min(max, s.stat("체력") + amt);
    }
    if (def.blind) this.enemyBlind = true;
    if (def.buff) for (const [k, v] of Object.entries(def.buff)) this.buff[k] = (this.buff[k] ?? 0) + v;
    if (def.after) this.after.push(def.after);
    if (def.once) this.usedOnce.add(def.id);
    if (def.consume) s.removeItem(def.id);
    return { who: "item", item: def.id };
  }
  // 지금 쓸 수 있는 전투 소지품
  usableItems() {
    return this.itemDefs.filter((d) => this.player.hasItem(d.id) && !this.usedOnce.has(d.id));
  }
  // 쓸 수 있는 무공 (내공이 모자라면 못 씀)
  usableArts() {
    return this.arts.map((a) => ({ ...a, ok: this.player.stat("내공") >= a.cost }));
  }
  // 전투가 끝나면 내공은 원래대로
  finish() {
    this.player.stats.내공 = this.neigongStart;
    // 소지품의 뒤탈 (예: 검은 환약)
    for (const tier of this.after) {
      const max = this.player.stat("최대체력");
      this.player.stats.체력 = Math.max(1, this.player.stat("체력") - Math.max(1, Math.ceil(max * this.config.hpTiers.피해[tier])));
    }
  }
}

// 언어 파일 읽기와 글 꺼내기. 화면에 나가는 모든 글은 여기를 거친다.
// 언어 파일: lang/<언어>/ui.json, events.json, achievements.json, items.json, names.json(인물·세력), glossary.json(용어 풀이)
const FILES = ["ui", "events", "achievements", "items", "names", "glossary", "codex"];

class I18n {
  constructor(langDir) {
    this.langDir = langDir;
    this.packs = {};
    this.lang = null;
  }

  async use(lang) {
    if (!this.packs[lang]) {
      const inline = window.LANG_DATA?.[lang];
      this.packs[lang] =
        inline ??
        Object.fromEntries(
          await Promise.all(FILES.map(async (f) => [f, await (await fetch(`${this.langDir}/${lang}/${f}.json`)).json()]))
        );
    }
    this.lang = lang;
    this.p = this.packs[lang];
    document.documentElement.lang = lang;
  }

  // 화면 글자. 예: t("menu.title"), t("game.life", { n: 3 })
  t(path, vars) {
    let s = path.split(".").reduce((o, k) => o?.[k], this.p.ui);
    if (s == null) return path;
    if (vars && typeof s === "string") for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
    return s;
  }

  // 이벤트 글. 예: ev(id, "title"), ev(id, "c2.o0")
  ev(id, part) {
    return this.p.events[`${id}.${part}`] ?? `${id}.${part}`;
  }

  ach(id, field) {
    return this.p.achievements[`${id}.${field}`] ?? id;
  }

  // 인과록 도감 글. part: "name" 또는 "s0", "s1" …
  codex(id, part) {
    return this.p.codex?.[`${id}.${part}`] ?? id;
  }

  item(id) {
    return this.p.items[id] ?? id.replaceAll("_", " ");
  }

  // 전투 글: combat("enemy.<id>.name"), combat("art.<id>.name")
  combat(key) {
    return this.p.combat?.[key] ?? key.split(".")[1].replaceAll("_", " ");
  }

  name(id) {
    return this.p.names?.[id] ?? id.replaceAll("_", " ");
  }

  // 용어 풀이. 없으면 null
  gloss(term) {
    return this.p.glossary?.[term] ?? null;
  }

  stat(id) {
    return this.p.ui.stats?.[id] ?? id;
  }

  realm(n) {
    return this.p.ui.realms?.[n] ?? String(n);
  }
}

// 회차(몇 번째 생)와 업(業), 인과록, 전생의 죽음 기록, 업 상점 단계.

const empty = () => ({ life: 0, karma: 0, karmaEarned: 0, outcomes: [], achievements: [], deaths: {}, shop: {}, traits: {}, known: [], bondsMax: {}, endings: [] });

class LifeRecord {
  constructor(config) {
    this.config = config;
    const saved = Store.get(config.storage.meta, {});
    this.data = { ...empty(), ...saved };
    // 예전 기록에는 누적 업이 없으므로 남은 업으로 채운다.
    if (saved.karmaEarned == null) this.data.karmaEarned = this.data.karma;
    // 예전 기록의 인과록(업적)도 도감 지식으로 옮겨 둔다.
    this.data.known = [...new Set([...this.data.known, ...this.data.achievements.map((a) => `ach:${a}`)])];
  }
  save() {
    Store.set(this.config.storage.meta, this.data);
  }
  wipe() {
    this.data = empty();
    Store.remove(this.config.storage.meta);
  }
  startLife() {
    this.data.life += 1;
    this.save();
    return this.data.life;
  }
  // 인과록 도감용: 모든 생을 통틀어 겪은 것(ev:/flag:/item:/ach:/bond:/aff:)
  learn(keys) {
    const set = new Set(this.data.known);
    const before = set.size;
    keys.forEach((k) => set.add(k));
    if (set.size !== before) { this.data.known = [...set]; this.save(); }
  }
  knows(key) {
    return this.data.known.includes(key);
  }
  // 전생의 기억: 어떤 선택지에서 몇 번 죽었는지
  deathsAt(evId, choiceId) {
    return this.data.deaths[`${evId}:${choiceId}`] ?? 0;
  }
  recordDeath(evId, choiceId) {
    const k = `${evId}:${choiceId}`;
    this.data.deaths[k] = (this.data.deaths[k] ?? 0) + 1;
    this.save();
  }
  // 시험용: 업을 그냥 넣어 준다
  grant(amount) {
    this.data.karma += amount;
    this.save();
  }
  spend(amount) {
    if (this.data.karma < amount) return false;
    this.data.karma -= amount;
    this.save();
    return true;
  }
  // 한 생이 끝날 때 업을 계산해 쌓는다.
  endLife(state) {
    const k = this.config.karma;
    const known = new Set(this.data.outcomes);
    const fresh = [...new Set(state.outcomesSeen)].filter((o) => !known.has(o));
    const newAch = [...new Set(state.achievements)].filter((a) => !this.data.achievements.includes(a));
    const parts = [
      { id: "scenes", value: state.scenes * k.perScene },
      { id: "fresh", value: fresh.length * k.perNewOutcome },
      { id: "realm", value: state.stat("경지") * k.perRealm },
      { id: "achievements", value: newAch.length * k.perAchievement },
      { id: "wealth", value: Math.max(0, Math.floor(state.stat("재물") / k.wealthPer)), note: state.stat("재물") },
      { id: "rare", value: (state.rare ?? 0) * k.perRare },
      { id: "ending", value: state.ending ? k.perEnding : 0 },
    ];
    // 오래 버틸수록 배율이 붙는다: 1 + 턴 수 × perSceneMult (최대 maxMult)
    const base = parts.reduce((s, p) => s + p.value, 0);
    const mult = Math.min(k.maxMult, 1 + state.scenes * k.perSceneMult);
    const total = Math.round(base * mult);
    // 기시감용: 인물마다 지난 생들의 최고 인연
    for (const [who, v] of Object.entries(state.bonds)) this.data.bondsMax[who] = Math.max(this.data.bondsMax[who] ?? 0, v);
    if (state.ending && !this.data.endings.includes(state.ending)) this.data.endings.push(state.ending);
    this.data.outcomes.push(...fresh);
    this.data.achievements.push(...newAch);
    this.data.karma += total;
    this.data.karmaEarned += total;
    this.save();
    return { parts, base, mult, total, newAch };
  }
}

// 업 상점: 업을 써서 타고난 바탕을 올린다. 산 단계는 매 생 시작할 때 적용된다.
class KarmaShop {
  constructor(config, record) {
    this.items = config.shop;
    this.traits = config.traits ?? [];
    this.record = record;
  }
  level(id) {
    return this.record.data.shop[id] ?? 0;
  }
  price(id) {
    const it = this.items.find((x) => x.id === id);
    return Math.round(it.base * Math.pow(it.growth, this.level(id)));
  }
  isMax(id) {
    const it = this.items.find((x) => x.id === id);
    return this.level(id) >= it.max;
  }
  buy(id) {
    if (this.isMax(id) || !this.record.spend(this.price(id))) return false;
    this.record.data.shop[id] = this.level(id) + 1;
    this.record.save();
    return true;
  }
  // 새 생의 상태에 산 만큼 더해준다.
  apply(state) {
    for (const it of this.items) state.stats[it.stat] = state.stat(it.stat) + it.amount * this.level(it.id);
  }
  // 체질: record.data.traits[id] = { lv: 산 단계(1부터), on: 켜짐 }
  traitData(id) {
    const v = this.record.data.traits[id];
    if (v == null) return { lv: 0, on: false };
    return typeof v === "boolean" ? { lv: 1, on: v } : v; // 예전 기록(참/거짓) 호환
  }
  traitLevel(id) {
    return this.traitData(id).lv;
  }
  traitOn(id) {
    const d = this.traitData(id);
    return d.lv > 0 && d.on;
  }
  // 지금 단계(안 샀으면 첫 단계)와 다음 단계
  tierOf(tr) {
    return tr.tiers[Math.max(0, this.traitLevel(tr.id) - 1)];
  }
  nextTier(tr) {
    return tr.tiers[this.traitLevel(tr.id)] ?? null;
  }
  buyTrait(id) {
    const tr = this.traits.find((x) => x.id === id);
    const next = tr && this.nextTier(tr);
    if (!next || !this.record.spend(next.price)) return false;
    this.record.data.traits[id] = { lv: this.traitLevel(id) + 1, on: true };
    this.record.save();
    return true;
  }
  toggleTrait(id) {
    const d = this.traitData(id);
    if (!d.lv) return;
    this.record.data.traits[id] = { lv: d.lv, on: !d.on };
    this.record.save();
  }
  // 켜 둔 체질의 단계 { id: lv } — 매 생(이어하기 포함) 시작할 때 state.traits로 넣는다
  activeLevels() {
    return Object.fromEntries(this.traits.filter((x) => this.traitOn(x.id)).map((x) => [x.id, this.traitLevel(x.id)]));
  }
  // 이 결과를 막는 켜 둔 체질의 지금 단계 (없으면 undefined)
  blocker(outcome) {
    for (const tr of this.traits) {
      if (!this.traitOn(tr.id)) continue;
      const tier = this.tierOf(tr);
      if (tier.blocks.some((b) => outcome[b])) return tier;
    }
  }
}

// 사용자 설정: 글자 크기, 언어, 용어 밑줄(twice: 한 생에 용어당 두 번까지 / always / off).
const TERM_MODES = ["twice", "always", "off"];

const FONT_SIZES = [
  { id: "s", px: 15 },

// 진행 중인 생 저장/불러오기. "다음에 볼 장면"까지 함께 저장해서
// 결과를 본 뒤 껐다 켜도 선택을 다시 할 수 없게 한다.


class SaveManager {
  constructor(config) {
    this.config = config;
    this.key = config.storage.save;
  }
  has() {
    return !!Store.get(this.key);
  }
  save(state, eventId) {
    Store.set(this.key, {
      eventId,
      state: {
        stats: state.stats,
        items: state.items,
        flags: [...state.flags],
        bonds: state.bonds,
        reputation: state.reputation,
        affiliation: state.affiliation,
        situation: state.situation ?? null,
        ending: state.ending ?? null,
        seen: [...state.seen],
        outcomesSeen: state.outcomesSeen,
        achievements: state.achievements,
        scenes: state.scenes,
        lastEventId: state.lastEventId,
        recent: state.recent,
        termCounts: state.termCounts,
        rare: state.rare,
        log: state.log,
      },
    });
  }
  load() {
    const raw = Store.get(this.key);
    if (!raw) return null;
    const s = new GameState(this.config);
    Object.assign(s, raw.state, { flags: new Set(raw.state.flags), seen: new Set(raw.state.seen) });
    return { state: s, eventId: raw.eventId };
  }
  clear() {
    Store.remove(this.key);
  }
}

// 키보드 입력을 지금 보이는 화면 하나에만 전달한다.

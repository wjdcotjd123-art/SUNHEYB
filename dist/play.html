html { color: var(--paper); min-height: 100%;
  /* 한지 배경 그림 — 화면에 꽉 차게, 스크롤해도 고정 */
  background: var(--ink) var(--bg-img) center / cover no-repeat fixed; }
body { margin: 0; background: transparent; }
body { font-family: var(--f-body); font-weight: 500; font-size: var(--fs, 17px); line-height: 1.85; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--log-h) + 48px); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ink) var(--bg-img) center / cover no-repeat fixed; /* 같은 그림을 같은 자리에 깔아 이음새 없이 */ text-shadow: 0 0 6px #f4f1ea, 0 0 2px #f4f1ea; /* 먹 위에서도 글자가 읽히게 */ border-bottom: 1px solid var(--line); padding-block: 12px 10px; display: grid; gap: 10px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-ui); }
#life { font-family: var(--f-display); font-size: 22px; color: var(--accent); letter-spacing: 0.06em; }
.bar-r { display: flex; gap: 14px; align-items: baseline; }
#toMenu { font-family: var(--f-ui); font-size: 12px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 2px 10px; }
#toMenu:hover, #toMenu:focus-visible { color: var(--paper); border-color: var(--muted); outline: none; }
#karma { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
#stats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); }
.stat { display: grid; gap: 0; text-align: center; padding-block: 4px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.stat.hp { grid-column: span 2; }
.stat b.hpbar { display: block; height: 10px; margin: 8px 6px 0; border: 1px solid var(--line); border-radius: 2px; background: var(--ink-2); overflow: hidden; }
.stat b.hpbar i { display: block; height: 100%; background: var(--jade); transition: width .4s; }
.stat b.hpbar.low i { background: var(--red); }
.stat b small.gear { font-size: 11px; font-weight: 500; color: var(--jade); margin-left: 2px; }
.stat b { font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat.realm b { color: var(--accent); }
#items li.situation { color: var(--red); border-color: color-mix(in srgb, var(--red) 60%, transparent); }
#items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-ui); font-size: 12px; }
#items li { border: 1px solid var(--line); border-radius: 2px; padding: 1px 8px; color: var(--paper); }
#items li.none { color: var(--muted); border-style: dashed; }

#stage { display: grid; gap: 28px; padding-top: 28px; }
.scene h2, .ending h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0 0 14px; letter-spacing: 0.04em; text-wrap: balance; }
.prose p { margin: 0 0 0.75em; }
.scene [hidden] { display: none !important; }
.scene-title { position: relative; padding-right: 3em; }
.page-num { position: absolute; right: 0; top: 0.2em; font-family: var(--f-body, inherit); font-size: 24px; letter-spacing: 0.05em; opacity: 0.6; }
.page-arrow { position: absolute; transform: translateY(-50%); z-index: 20; background: none; border: none; color: inherit; padding: 8px 4px; cursor: pointer; line-height: 0; animation: arrowBlink 1.2s ease-in-out infinite; }
.scene { position: relative; }
.page-next { left: calc(100% + 40px); }
@media (max-width: 720px) { .page-next { left: auto; right: -14px; } .page-prev { right: auto !important; left: -14px; } }
.page-prev { right: calc(100% + 40px); animation: none; opacity: 0.25; }
.page-arrow:hover { animation: none; opacity: 0.9; }
@keyframes arrowBlink { 0%,100% { opacity: 0.75; } 50% { opacity: 0.12; } }
.prose strong { font-weight: 700; color: var(--strong); }
.term { border-bottom: 1px dotted currentColor; text-underline-offset: 3px; cursor: help; }
.term:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.gloss { position: fixed; z-index: 10; max-width: min(300px, calc(100vw - 24px)); background: var(--tip); border: 1px solid var(--accent); border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px; font-family: var(--f-ui); font-size: 14px; line-height: 1.6; color: var(--paper); box-shadow: 0 6px 20px rgba(0,0,0,0.45); pointer-events: none; }
.gloss[hidden], .shop[hidden] { display: none; } /* display:grid가 hidden을 덮어써서 빈 상자가 남던 문제 */
.gloss b { color: var(--accent); font-weight: 500; }
.c-red { color: var(--red); } .c-purple { color: var(--violet); } .c-green { color: var(--jade); } .c-gold { color: var(--gold); }

.choices { display: grid; gap: 8px; margin-top: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.choice { display: flex; gap: 10px; align-items: baseline; text-align: left; width: 100%; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 11px 14px; font-family: var(--f-ui); font-size: 16px; line-height: 1.5; transition: border-color .15s, background .15s, opacity .2s; }
.choice, .next { position: relative; overflow: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.choice::after, .next::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); pointer-events: none; }
.choice.holding::after, .next.holding::after { width: 100%; transition: width var(--hold, 650ms) linear; }
.choice .num { color: var(--muted); font-size: 13px; min-width: 1em; font-variant-numeric: tabular-nums; }
.choice .mad, .chosen .mad { color: var(--violet); font-weight: 500; white-space: nowrap; }
.choice .req, .chosen .req { color: var(--accent); white-space: nowrap; font-weight: 500; }
.choice .tag { color: var(--accent); white-space: nowrap; font-weight: 500; }
.choice .txt { min-width: 0; }
.fortune-banner { margin: 0 0 10px; font-family: var(--f-display); font-size: 17px; letter-spacing: 0.2em; color: var(--gold); text-shadow: 0 0 14px color-mix(in srgb, var(--gold) 55%, transparent); animation: fortuneIn 1.2s ease-out 1; }
.fortune-banner .hanja { color: var(--gold); opacity: 0.75; }
@keyframes fortuneIn { from { opacity: 0; letter-spacing: 0.6em; } to { opacity: 1; letter-spacing: 0.2em; } }
.rare-banner { margin: 0 0 18px; padding: 10px 14px; font-family: var(--f-display); font-size: 20px; letter-spacing: 0.14em; color: var(--ink); background: linear-gradient(90deg, #b8913f, var(--gold), #f6dd9a, var(--gold), #b8913f); background-size: 200% 100%; border-radius: 3px; text-align: center; animation: rareSweep 1.6s ease-out 1, rarePulse 2.6s ease-in-out 1.6s infinite; box-shadow: 0 0 30px color-mix(in srgb, var(--gold) 35%, transparent); }
@keyframes rareSweep { from { background-position: 100% 0; transform: scale(0.96); opacity: 0; } to { background-position: 0 0; transform: scale(1); opacity: 1; } }
@keyframes rarePulse { 0%, 100% { box-shadow: 0 0 22px color-mix(in srgb, var(--gold) 25%, transparent); } 50% { box-shadow: 0 0 40px color-mix(in srgb, var(--gold) 50%, transparent); } }
.bt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; font-family: var(--f-ui); font-size: 13px; }
.bt-grid label { display: grid; gap: 4px; color: var(--muted); }
.bt-grid input { width: 100%; box-sizing: border-box; min-width: 0; background: var(--ink-2); border: 1px solid var(--line); color: var(--paper); border-radius: 3px; padding: 6px 8px; font: inherit; font-size: 15px; }
.bt-arts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 18px; font-family: var(--f-ui); font-size: 14px; }
.pk .pk-field { position: relative; height: 150px; margin: 6px 0 12px; }
.pk .pk-tag { position: absolute; width: 58%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px 6px 6px 0; background: var(--ink-2); display: grid; gap: 8px; font-family: var(--f-ui); }
.pk .pk-tag b { font-weight: 500; font-size: 15px; }
.pk .pk-tag small { color: var(--accent); font-size: 13px; }
.pk .pk-enemy { top: 0; right: 0; }
.pk .pk-me { bottom: 0; left: 0; border-radius: 6px 6px 0 6px; }
.pk .pk-bar .hpbar { display: block; height: 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--ink); overflow: hidden; }
.pk .pk-bar .hpbar i { display: block; height: 100%; background: var(--jade); transition: width .5s; }
.pk .pk-bar .hpbar.low i { background: var(--red); }
.pk .pk-box { border: 2px solid var(--line); border-radius: 6px; background: var(--ink-2); padding: 14px 16px; }
.pk .pk-log { min-height: 6.6em; margin: 0 0 14px; }
.pk .pk-log p { margin: 0 0 4px; animation: pkLine .35s ease-out 1; }
@keyframes pkLine { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.pk .pk-prompt { margin: 0 0 10px; font-family: var(--f-ui); font-size: 15px; }
.pk .pk-box { transition: opacity .25s, filter .25s; }
.pk.busy .pk-box { opacity: 0.35; filter: grayscale(0.6); pointer-events: none; }
.pk .pk-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pk .pk-cell { min-height: 52px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 8px 14px; background: var(--ink); border: 1px solid var(--line); border-radius: 4px; font-family: var(--f-ui); font-size: 16px; text-align: left; }
.pk .pk-cell small { color: var(--accent); font-size: 12px; }
.pk .pk-cell.on:not(:disabled), .pk .pk-cell:hover:not(:disabled) { border-color: var(--accent); background: var(--hover); }
.pk .pk-cell.on:not(:disabled) span::before { content: "▶ "; color: var(--accent); }
.pk .pk-cell:disabled { opacity: 0.35; cursor: default; }
.pk .pk-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.pk .pk-foot:empty { display: none; }
.pk .pk-small { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 2px 10px; font-family: var(--f-ui); font-size: 12px; }
.battle-head { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.2em; color: var(--accent); margin: 0 0 14px; }
.fighters { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; font-family: var(--f-ui); font-size: 14px; }
.fighters > div { display: grid; gap: 6px; }
.fighters .hpbar { display: block; height: 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--ink-2); overflow: hidden; }
.fighters .hpbar i { display: block; height: 100%; background: var(--jade); transition: width .4s; }
.fighters .hpbar.low i { background: var(--red); }
.battle-log { min-height: 5.5em; }
.battle-end { font-family: var(--f-display); font-size: 20px; margin: 14px 0; }
.battle-end.win { color: var(--gold); }
.battle-end.lose { color: var(--red); }
.trait-banner { margin: 0 0 16px; padding: 10px 14px; border-left: 3px solid var(--green, var(--jade)); background: color-mix(in srgb, var(--jade) 10%, transparent); font-family: var(--f-ui); display: grid; gap: 4px; animation: fortuneIn 0.9s ease-out 1; }
.trait-banner b { font-weight: 500; letter-spacing: 0.12em; color: var(--green, var(--jade)); }
.trait-banner span { font-size: 14px; color: var(--muted); }
.outcome.rare .prose strong { color: var(--strong); }
.karma .part-rare dt, .karma .part-rare dd { color: var(--gold); }
.karma .part-mult dt, .karma .part-mult dd { color: var(--accent); }
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--accent); background: var(--hover); outline: none; }
.choice:disabled { cursor: default; }
.choice.warn { background: color-mix(in srgb, var(--red) 12%, transparent); border-color: color-mix(in srgb, var(--red) 45%, transparent); opacity: 0.8; flex-wrap: wrap; }
.choice.warn .tag { color: var(--red); }
.choice.trait { flex-wrap: wrap; row-gap: 2px; }
.choice .trait-label { flex-basis: 100%; font-size: 12px; letter-spacing: 0.08em; color: var(--paper); opacity: 0.75; }
.prose.dejavu { margin-top: 14px; padding-left: 12px; border-left: 2px solid var(--violet); color: var(--violet); font-style: italic; }
.choice .end-label { margin-left: auto; font-size: 11px; letter-spacing: 0.12em; color: var(--violet); border: 1px solid color-mix(in srgb, var(--violet) 60%, transparent); border-radius: 2px; padding: 0 6px; align-self: center; white-space: nowrap; }
.choice .end-label + .fresh-label, .choice .end-label + .warn-label { margin-left: 6px; }
.choice .go-label { display: none; margin-left: auto; align-self: center; white-space: nowrap; font-family: var(--f-ui); font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 8px; background: var(--hover); }
.choice .go-label kbd { font-family: var(--f-ui); font-size: 10px; margin-left: 6px; opacity: 0.7; }
.choice.picked .go-label { display: inline-block; }
.choice.picked .fresh-label { display: none; }
.choice .fresh-label { margin-left: auto; font-size: 11px; letter-spacing: 0.08em; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 2px; padding: 0 6px; align-self: center; white-space: nowrap; }
.choice .fresh-label + .warn-label { margin-left: 6px; }
.choice.warn .warn-label { margin-left: auto; font-size: 11px; letter-spacing: 0.08em; color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 60%, transparent); border-radius: 2px; padding: 0 6px; align-self: center; }
.choice.warn:hover:not(:disabled), .choice.warn:focus-visible { border-color: var(--red); background: color-mix(in srgb, var(--red) 20%, transparent); opacity: 1; }
.intro { padding-top: 12vh; }
.intro .prose { font-size: 1.05em; }
.choice.picked { border-color: var(--accent); background: var(--tip); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.picked .num { color: var(--accent); }
.choice.dim { opacity: 0.45; }
.scene > .next { margin-top: 14px; }

.outcome h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.3; margin: 0 0 6px; letter-spacing: 0.04em; color: var(--muted); }
.chosen { margin: 0 0 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-family: var(--f-ui); font-size: 15px; color: var(--muted); }
.chosen .tag { color: var(--accent); }
.next kbd { font-family: var(--f-ui); font-size: 11px; margin-left: 10px; opacity: 0.7; letter-spacing: 0; }

.logbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--ink-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.logbox .in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.logbox h3 { margin: 0 0 4px; font-family: var(--f-ui); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; }
body.no-log .logbox { display: none; }
body.no-log .wrap { padding-bottom: 48px; }
#log { list-style: none; margin: 0; padding: 0; max-height: calc(var(--log-h) - 30px); overflow-y: auto; font-family: var(--f-ui); font-size: 13px; line-height: 1.7; }
#log li { display: flex; flex-wrap: wrap; gap: 2px 8px; }
#log li:first-child { color: var(--paper); }
#log li:not(:first-child) { opacity: 0.7; }
#log .t { color: var(--paper); }
#log .g { color: var(--accent); }
#log .up { color: var(--jade); } #log .down { color: var(--red); }
#log li.empty { color: var(--muted); opacity: 1; }
.changes { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-ui); font-size: 14px; }
.changes .up { color: var(--jade); } .changes .down { color: var(--red); }
.next { font-family: var(--f-ui); font-size: 15px; background: var(--hover); border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 8px 22px; letter-spacing: 0.1em; }
.next:hover:not(:disabled), .next:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
.next:disabled { opacity: 0.35; cursor: default; }

.ending { border-top: 1px solid var(--line); padding-top: 22px; }
.ending.death h2 { color: var(--red); }
.ending .note { color: var(--muted); font-size: 15px; }
.ending .memory { color: var(--gold); font-family: var(--f-display); letter-spacing: 0.06em; }
.new-mark { font-size: 11px; letter-spacing: 0.08em; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 2px; padding: 0 5px; margin-left: 4px; vertical-align: middle; }
/* 귀결은 천천히 떠오른다: 제목 → 문구 → 정산 */
.ending.ending h2 { animation: endfade 2.2s ease both; }
.ending.ending .note { animation: endfade 2.6s ease .9s both; }
.ending.ending > :not(h2):not(.note) { animation: endfade 1.2s ease 2.4s both; }
@keyframes endfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.karma { font-family: var(--f-ui); margin: 0 0 16px; display: grid; gap: 4px; max-width: 320px; }
.karma div { display: flex; justify-content: space-between; }
.karma dt { color: var(--muted); } .karma dd { margin: 0; font-variant-numeric: tabular-nums; }
.karma .total { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.karma .total dt, .karma .total dd { color: var(--accent); }
.ach { font-family: var(--f-ui); font-size: 14px; color: var(--gold); }
#loading { color: var(--muted); font-family: var(--f-ui); }

/* 메인·하위 화면 */
#screen { padding-block: 48px 64px; }
.mast { display: grid; gap: 6px; margin-bottom: 40px; }
.eyebrow { margin: 0; font-family: var(--f-ui); font-size: 12px; letter-spacing: 0.3em; color: var(--muted); }
.mast h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 72px; line-height: 1.1; letter-spacing: 0.12em; color: var(--paper); }
.sub { margin: 0; font-family: var(--f-ui); font-size: 14px; color: var(--muted); }
.sub b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
.menu-list { display: grid; gap: 2px; max-width: 360px; }
.menu-item { display: grid; grid-template-columns: 1.6em auto 1fr; align-items: baseline; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 14px 4px; font-family: var(--f-ui); }
.menu-item .num { color: var(--muted); font-size: 13px; }
.menu-item .lbl { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.08em; }
.menu-item .mnote { grid-column: 3; justify-self: start; padding-left: 14px; font-size: 12px; color: var(--muted); }
.menu-item:hover:not(:disabled) .lbl, .menu-item:focus-visible .lbl { color: var(--accent); }
.menu-item:focus-visible { outline: none; }
.menu-item:disabled { cursor: default; opacity: 0.4; }
.menu-item.armed .lbl, .menu-item.armed .mnote { color: var(--red); }
.hanja { font-family: var(--f-body); font-size: 0.62em; font-weight: 400; color: var(--muted); margin-left: 0.25em; letter-spacing: 0.06em; vertical-align: 0.12em; }
.back { font-family: var(--f-ui); font-size: 13px; background: none; border: none; color: var(--muted); padding: 0; margin-bottom: 24px; }
.back:hover, .back:focus-visible { color: var(--paper); outline: none; }
.back kbd, #toMenu kbd { font-family: var(--f-ui); font-size: 11px; margin-left: 10px; opacity: 0.7; }
.sub-screen h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0 0 8px; letter-spacing: 0.08em; }
.sub-screen .big { font-family: var(--f-display); font-size: 64px; color: var(--accent); margin: 8px 0 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
.shop-tabs { margin: 24px 0 6px; }
.shop-title { font-family: var(--f-ui); font-size: 13px; font-weight: 500; letter-spacing: 0.14em; color: var(--muted); margin: 32px 0 6px; }
.shop { list-style: none; margin: 0; padding: 0; display: grid; }
.shop-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.shop-info { display: grid; gap: 2px; min-width: 0; }
.shop-info b { font-weight: 500; }
.shop-info span { font-size: 13px; color: var(--muted); }
.shop-info .shop-lv { color: var(--accent); }
.end-confirm { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 14, 8, 0.45); z-index: 50; }
.end-card { background: var(--tip); border: 1px solid var(--line); padding: 24px 28px; max-width: 360px; text-align: center; font-family: var(--f-body); }
.end-card p { margin: 0 0 18px; line-height: 1.7; white-space: pre-line; }
.end-btns { display: flex; gap: 10px; justify-content: center; }
.end-btns button { font-family: var(--f-ui); padding: 8px 14px; border: 1px solid var(--line); background: var(--ink-2); cursor: pointer; }
.end-btns .yes { color: var(--accent); border-color: var(--accent); }
.end-btns kbd { margin-left: 6px; font-size: 10px; opacity: 0.6; }
.shop-info .lore { font-size: 12px; font-style: italic; opacity: 0.75; }
.trait-bonus { font-size: 11px; color: var(--jade); }
.shop-buy { flex: none; font-family: var(--f-ui); font-size: 14px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.shop-buy:hover:not(:disabled), .shop-buy:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
.shop-btns { flex: none; display: flex; gap: 6px; }
.tier-pips { margin-left: 8px; color: var(--accent); letter-spacing: 0.15em; font-size: 12px; }
.shop-info .tier-line { color: var(--paper); opacity: 0.8; }
.shop-buy:disabled { opacity: 0.35; cursor: default; }
.sub-screen .empty { margin-top: 32px; padding: 18px; border: 1px dashed var(--line); border-radius: 3px; color: var(--muted); font-family: var(--f-ui); font-size: 15px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
.tab { font-family: var(--f-ui); font-size: 14px; background: none; border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.tab small { font-size: 11px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.tab:focus-visible { outline: 1px solid var(--accent); }
.main-tabs .tab { font-size: 15px; padding: 6px 14px; }
.sub-tabs { margin-top: 12px; }
.sub-tabs .tab { font-size: 13px; padding: 4px 10px; }
.codex-list li span { color: var(--paper); font-size: 14px; line-height: 1.7; }
.codex-list li .more { color: var(--muted); font-size: 12px; font-style: italic; }
.codex-body > .sub { margin-top: 16px; }
.ach-list .cond { font-size: 12px; color: var(--accent); opacity: 0.85; }
.ach-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 0; }
.ach-list li { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.ach-list b { font-weight: 500; color: var(--muted); }
.ach-list span { font-size: 13px; color: var(--muted); }
.ach-list li.on b { color: var(--gold); }
.ach-list li.on span { color: var(--paper); }
.set-row { display: grid; gap: 10px; padding: 20px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.set-lbl { font-size: 15px; }
.set-note { margin: 0; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn, .wipe { font-family: var(--f-ui); font-size: 14px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 14px; }
.seg-btn.on { border-color: var(--accent); color: var(--accent); }
.seg-btn:focus-visible, .wipe:focus-visible { outline: 1px solid var(--accent); }
.wipe { justify-self: start; color: var(--red); }
.wipe.armed { background: var(--red); color: var(--ink); border-color: var(--red); }
.wipe:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 480px) {
  .mast h1 { font-size: 56px; }
  #stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
/* 휴대폰: 상단 정보를 두 줄로 줄여 본문을 넓게 */
@media (max-width: 600px) {
  .top { padding-block: 6px; gap: 4px; }
  #life { font-size: 18px; }
  #toMenu { padding: 1px 8px; }
  #toMenu kbd { display: none; }
  #stats { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px 8px; }

": "구덩이를 기어올라 달아난다", "M001.c4.o0": ["구덩이를 기어올랐다. 사람들 사이를 밀치고 내달렸다.", "등 뒤에서 고함이 쫓아왔다.", "", "**<red>발밑이 꺼졌다.<\/red>**", "비탈이었다."], "M001.c4.o1": ["구덩이를 기어올랐다. 사람들 사이를 밀치고 내달렸다.", "등 뒤에서 고함이 쫓아왔다.", "", "**무작정 산속으로 달렸다.**"], "M002.title": "산속의 밤", "M002.desc": ["고함이 멀어질 때까지 달렸다.", "숨이 턱까지 찼다. 돌아보니, 쫓아오는 이는 없었다.", "**길도 없었다.**", "", "해가 산 너머로 넘어갔다.", "한기가 옷 속으로 스며들었다.", "어디선가 **짐승 우는 소리**가 들렸다."], "M002.c1.tag": "불", "M002.c1.text": "라이터로 불을 피운다", "M002.c1.o0": ["마른 가지를 긁어모았다. 딸깍. **불이 붙었다.**", "손이 녹았다.", "", "**<red>불빛 너머 어둠 속에서, 눈 두 개가 번뜩였다.<\/red>**"], "M002.c1.o1": ["마른 가지를 긁어모았다. 딸깍. **불이 붙었다.**", "손이 녹았다.", "", "밤새 불을 지켰다.", "새벽녘, 덤불 속에서 **무언가 물러가는 소리**가 들렸다."], "M002.c2.tag": "웅크림", "M002.c2.text": "바위틈에 몸을 웅크린다", "M002.c2.o0": ["바위틈에 몸을 밀어 넣었다.", "이가 딱딱 부딪쳤다. 잠들면 안 된다고, 몇 번이고 되뇌었다.", "", "눈을 감았다.", "**<red>다시 뜨지 못했다.<\/red>**"], "M002.c2.o1": ["바위틈에 몸을 밀어 넣었다.", "이가 딱딱 부딪쳤다. 잠들면 안 된다고, 몇 번이고 되뇌었다.", "", "새벽이 길었다.", "손발이 **굳어 있었다**."], "M002.c3.tag": "걸음", "M002.c3.text": "밤새 걷는다", "M002.c3.o0": ["어둠 속으로 발을 내디뎠다.", "", "**<red>발밑이 꺼졌다.<\/red>**", "비탈이었다."], "M002.c3.o1": ["어둠 속으로 발을 내디뎠다.", "", "한참을 걷자, 나무 사이로 **불빛**이 보였다.", "…사람이다.", "", "불빛을 향해, 비탈을 내려갔다."], "M002.c3.o2": ["어둠 속으로 발을 내디뎠다.", "나뭇가지에 얼굴이 긁혔다. 몇 번이고 넘어졌다.", "", "동이 틀 무렵, **<green>개울 소리<\/green>**가 들렸다."], "M002.c4.tag": "숨", "M002.c4.text": "숨을 고르며 추위를 버틴다", "M002.c4.o0": ["바위에 기대 앉아, 숨을 골랐다.", "들이쉬고, 모으고, 내쉬었다. **어째서인지, 그렇게 해야 할 것 같았다**.", "", "아랫배가 미지근해졌다. 밤이, 생각보다 짧았다."], "M003.title": "굶주림", "M003.desc": ["이튿날. **배 속이 뒤틀렸다.**", "마지막으로 먹은 게 편의점 삼각김밥이었던가.", "", "개울가 덤불에 **붉은 열매**가 달려 있었다.", "물가 바위에는, **짐승 발자국**이 찍혀 있었다."], "M003.c1.tag": "열매", "M003.c1.text": "붉은 열매를 따 먹는다", "M003.c1.o0": ["열매를 따 입에 넣었다. 시큼했다.", "몇 알을 더 삼켰다.", "", "**<purple>해가 기울 무렵, 배를 움켜쥐고 쓰러졌다.<\/purple>**"], "M003.c1.o1": ["열매를 따 입에 넣었다. 시큼했다.", "몇 알을 더 삼켰다.", "", "반나절을 **배앓이**로 굴렀다.", "그래도 허기는 가셨다."], "M003.c2.tag": "물", "M003.c2.text": "개울물로 배를 채운다", "M003.c2.o0": ["개울에 엎드려, 배가 출렁일 때까지 마셨다.", "", "허기는 **그대로였다**."], "M003.c3.tag": "발자국", "M003.c3.text": "짐승 발자국을 따라간다", "M003.c3.o0": ["발자국을 따라 덤불을 헤쳤다.", "", "**<red>덤불 속에서, 멧돼지가 튀어나왔다.<\/red>**"], "M003.c3.o1": ["발자국을 따라 덤불을 헤쳤다.", "", "발자국 끝에, **올가미에 걸린 토끼**가 버둥대고 있었다.", "올가미. 사람이 놓은 물건이었다.", "", "**<green>근처에, 사람이 산다.<\/green>**"], "M003.c4.tag": "숨", "M003.c4.text": "숨을 고르며 허기를 다스린다", "M003.c4.o0": ["개울가에 앉아, 숨을 골랐다.", "숨이, **스스로 길어졌다**. 배 속의 뒤틀림이 조금씩 잦아들었다.", "", "허기는 그대로였다. 그래도, 버틸 만했다."], "M004.title": "산 아래로", "M004.desc": ["사흘째. 나무 사이로 가는 **연기 한 줄**이 보였다.", "연기를 따라 내려가니, 지게를 진 사내가 나무를 하고 있었다.", "", "사내가 나를 보고 **도끼를 고쳐 쥐었다**.", "", "「◇◇◇! ◇◇ ◇◇◇◇?」"], "M004.c1.tag": "손", "M004.c1.text": "두 손을 들고 다가간다", "M004.c1.o0": ["두 손을 들고, 천천히 다가갔다.", "", "사내가 한참 나를 훑어보았다.", "**도끼가 천천히 내려갔다.**", "", "사내가 턱짓을 했다. 따라오라는 뜻이었다."], "M004.c2.tag": "허기", "M004.c2.text": "배를 문지르며 먹을 것을 청한다", "M004.c2.o0": ["배를 문지르며, 입 앞에 손을 모아 보였다.", "", "사내의 얼굴이 풀렸다.", "품에서 **주먹밥 하나**를 꺼내, 던져 주었다.", "", "허겁지겁 먹는 동안, 사내는 혀를 찼다.", "「◇◇◇◇.」"], "M004.c3.tag": "미행", "M004.c3.text": "몰래 물러나 사내의 뒤를 밟는다", "M004.c3.o0": ["덤불 속으로 물러났다.", "지게 소리를 따라, 거리를 두고 걸었다.", "", "사내가 돌아섰다.", "**<red>도끼가, 먼저 날아왔다.<\/red>**"], "M004.c3.o1": ["덤불 속으로 물러났다.", "지게 소리를 따라, 거리를 두고 걸었다.", "", "해 질 녘, **<green>산 아래 마을의 불빛<\/green>**이 보였다."], "M004.c4.tag": "불", "M004.c4.text": "라이터를 켜 보인다", "M004.c4.o0": ["딸깍.", "", "사내가 비명을 질렀다.", "**<red>도끼가 날아왔다.<\/red>**"], "M004.c4.o1": ["딸깍.", "", "사내가 비명을 질렀다.", "**지게를 내던지고**, 산 아래로 달아났다.", "", "그 길을 따라가니, 마을이 나왔다."], "M004.c5.tag": "외면", "M004.c5.text": "마을 쪽을 등지고, 반대편 골짜기로 내려간다", "M004.c5.o0": ["마을 쪽을 등졌다.", "…저 마을에 내려가면, 또 같은 삶이다.", "", "반대편 골짜기로, 발을 옮겼다."], "M010.title": "끌려 내려가다", "M010.desc": ["노인을 따라 산을 내려왔다.", "뒤에서 사람들이 수군거리며 따라왔다.", "", "산 아래, **흙담과 초가지붕**이 늘어선 마을이었다.", "전봇대도, 아스팔트도 없었다.", "…촬영장이라기엔, **너무 멀리까지** 이어져 있었다.", "", "노인이 나를 **헛간**으로 밀어 넣었다.", "", "「◇◇◇ ◇◇.」", "", "문이 닫혔다. **빗장 거는 소리**가 났다."], "M010.c1.tag": "외침", "M010.c1.text": "문을 두드리며 소리친다", "M010.c1.o0": ["문을 두드렸다.", "\"열어 주세요! 저 아무것도 안 했어요!\"", "", "빗장이 열렸다.", "**<red>몽둥이가, 먼저 들어왔다.<\/red>**"], "M010.c1.o1": ["문을 두드렸다.", "\"열어 주세요! 저 아무것도 안 했어요!\"", "", "한참 뒤, 등짐을 진 노인이 왔다.", "노인이 문틈으로 **입술에 손가락을 댔다**.", "", "문틈으로, **밥 한 그릇**이 들어왔다."], "M010.c2.tag": "문틈", "M010.c2.text": "문틈으로 바깥을 살핀다", "M010.c2.o0": ["문틈에 눈을 댔다.", "", "마당에서 놀던 아이 하나가, 나를 발견했다.", "아이가 손가락으로 해를 가리키며 말했다.", "", "「◇◇.」", "", "따라 했다. 아이들이 **깔깔 웃었다**.", "", "**<green>한 낱말을, 얻었다.<\/green>**"], "M010.c3.tag": "탈출", "M010.c3.text": "헛간 벽을 뚫고 달아난다", "M010.c3.o0": ["썩은 판자를 발로 찼다. 틈이 벌어졌다.", "담을 넘으려는 순간, 개가 다리를 물었다.", "", "**<red>사내들이 몰려들었다.<\/red>**"], "M010.c3.o1": ["썩은 판자를 발로 찼다. 틈이 벌어졌다.", "", "마을 어귀에서, **붙잡혔다**.", "끌려와 다시 헛간에 던져졌다.", "빗장이 **하나 더** 걸렸다."], "M010.c4.tag": "잠", "M010.c4.text": "짚더미에 누워 잠을 청한다", "M010.c4.o0": ["짚더미에 몸을 묻었다.", "", "꿈속에서, **비 오는 퇴근길**을 걸었다.", "", "눈을 뜨니, 여전히 헛간이었다."], "M011.title": "손짓과 낱말", "M011.desc": ["며칠이 지났다.", "헛간에서 나와, 노인의 집 일을 거들었다.", "장작 패기. 물 긷기. **말은 한 마디도 통하지 않았다.**", "", "노인은 나를 불러도 대답이 없자, 그냥 손짓으로 부렸다.", "이대로는 안 되겠다."], "M011.c1.tag": "아이", "M011.c1.text": "아이들 틈에서 사물을 가리킨다", "M011.c1.o0": ["마당의 아이들 틈에 쪼그려 앉았다.", "돌을 가리켰다. 나무를 가리켰다. 물동이를 가리켰다.", "", "아이들이 앞다투어 **이름을 외쳤다**.", "「◇◇!」 「◇◇◇!」", "", "하나씩, 따라 했다."], "M011.c2.tag": "장터", "M011.c2.text": "장터에 따라가 흥정을 엿듣는다", "M011.c2.o0": ["노인의 짐을 지고 장터에 따라갔다.", "", "하루 종일, **흥정하는 소리**를 들었다.", "손가락을 펴는 수만큼, 같은 소리가 되풀이됐다.", "", "**<green>숫자를, 알았다.<\/green>**"], "M011.c3.tag": "서당", "M011.c3.text": "서당 창밖에서 글 읽는 소리를 듣는다", "M011.c3.o0": ["서당 담 밑에 웅크렸다.", "글 읽는 소리가 창밖으로 흘러나왔다.", "", "「◇◇!」", "", "훈장의 회초리가 아니라, **<red>지나가던 무사의 칼집<\/red>**이 머리를 내리쳤다."], "M011.c3.o1": ["서당 담 밑에 웅크렸다.", "아이들이 **소리 높여 글을 읽었다**. 같은 소리를, 몇 번이고.", "", "들켰다. 훈장이 회초리를 들고 쫓아 나왔다.", "등짝이 화끈거렸다.", "", "그래도, 몇 마디가 **귀에 붙었다**."], "M011.c4.tag": "그림", "M011.c4.text": "땅바닥에 그림을 그려 뜻을 묻는다", "M011.c4.o0": ["나뭇가지로 땅에 그림을 그렸다.", "해. 집. 사람.", "", "노인이 그림마다 **이름을 일러 주었다**.", "", "신이 나서, 하나를 더 그렸다.", "**하늘에서 떨어지는 사람.**", "", "노인의 얼굴이 굳었다.", "노인이 발로 그림을 **지워 버렸다**."], "M011.c11.tag": "아이", "M011.c11.text": "아이들 틈에서 마을 이야기를 듣는다", "M011.c11.o0": ["마당의 아이들 틈에 쪼그려 앉았다.", "", "아이들은 묻지도 않은 이야기를 **쏟아냈다**.", "누구네 소가 새끼를 낳았고, 누구네 아들이 장가를 갔고.", "뒷산 너머에는 **산적**이 산다고 했다."], "M011.c12.tag": "장터", "M011.c12.text": "장터에 따라가 세상 물정을 익힌다", "M011.c12.o0": ["노인의 짐을 지고 장터에 따라갔다.", "", "쌀 한 되에 동전 몇 닢. 은자 한 냥이면 얼마나 사는지.", "하루 종일, **값을 외웠다**."], "M011.c13.tag": "글", "M011.c13.text": "서당 창밖에서 글자를 훔쳐본다", "M011.c13.o0": ["서당 담 밑에 웅크렸다.", "말은 알아들어도, **글자는 하나도 읽을 수 없었다**.", "", "들켰다. 훈장의 회초리가 등짝을 쳤다."], "M011.c13.o1": ["서당 담 밑에 웅크렸다.", "말은 알아들어도, **글자는 하나도 읽을 수 없었다**.", "", "창틈으로, 아이들이 쓰는 글자를 **하나씩 따라 그렸다**.", "**<green>글자 몇 개를, 얻었다.<\/green>**"], "M011.c14.tag": "물음", "M011.c14.text": "우 영감에게 이 세상에 대해 묻는다", "M011.c14.o0": ["\"여기는, 어떤 곳입니까.\"", "", "영감이 장작을 패다 말고, 나를 한참 보았다.", "\"낙양 땅이다. 황제가 계시는 도읍은 멀고, **칼 찬 놈들**은 가깝지.\"", "\"무림이니 강호니 하는 놈들 말이다. 엮이지 마라.\"", "", "**<gold>강호.<\/gold>** 처음 듣는 말이었다."], "M012.title": "오해", "M012.desc": ["이웃집 닭이 없어졌다.", "", "사람들이 몰려왔다. 손가락이, **나를 가리켰다**.", "", "「◇◇◇! ◇◇ ◇◇◇!」", "", "무슨 말인지 몰라도, 뜻은 알았다.", "**<red>도둑으로 몰렸다.<\/red>**"], "M012.c1.tag": "고개", "M012.c1.text": "고개를 저으며 두 손을 펴 보인다", "M012.c1.o0": ["고개를 저었다. 빈 두 손을 펴 보였다.", "", "사람들은 더 화를 냈다.", "**<red>누군가 휘두른 몽둥이가, 뒤통수를 쳤다.<\/red>**"], "M012.c1.o1": ["고개를 저었다. 빈 두 손을 펴 보였다.", "", "노인이 사람들 앞으로 나섰다.", "「◇◇◇, ◇◇◇◇.」", "", "사람들이 **투덜대며 흩어졌다**."], "M012.c5.tag": "해명", "M012.c5.text": "말로 차근차근 해명한다", "M012.c5.o0": ["\"닭이 없어진 게 새벽이라고 하셨지요.\"", "\"저는 그때, 영감님과 산에서 장작을 하고 있었습니다.\"", "", "사람들이 **우 영감을 돌아보았다**.", "영감이 고개를 끄덕였다.", "", "사람들이 투덜대며 흩어졌다.", "\"…말은 또 청산유수네.\""], "M012.c2.tag": "닭", "M012.c2.text": "닭을 찾아 나선다", "M012.c2.o0": ["사람들을 밀치고 뛰쳐나갔다.", "", "담 너머, 개울가.", "**닭은 덤불 속에 숨어 있었다.**", "", "닭을 안고 돌아오자, 사람들이 **입을 다물었다**.", "닭 주인이 머쓱한 얼굴로, **떡 하나**를 내밀었다."], "M012.c3.tag": "도망", "M012.c3.text": "달아난다", "M012.c3.o0": ["뒤돌아 달렸다.", "", "도망치는 놈이, 범인이었다.", "**<red>돌과 몽둥이가, 한꺼번에 쏟아졌다.<\/red>**"], "M012.c3.o1": ["뒤돌아 달렸다.", "", "마을 밖 언덕까지 달아났다.", "해가 지고서야, 몰래 헛간으로 돌아왔다.", "", "**마을 사람들의 눈빛이 달라져 있었다.**"], "M012.c4.tag": "라이터", "M012.c4.text": "라이터를 켜 보인다", "M012.c4.o0": ["딸깍.", "", "사람들이 비명을 질렀다.", "**<red>요괴다, 하는 소리 같은 것이 들렸다. 그리고 돌이 날아왔다.<\/red>**"], "M012.c4.o1": ["딸깍.", "", "사람들이 비명을 지르며 **물러났다**.", "닭 이야기는, 그걸로 끝이었다.", "", "대신 아무도, 내 곁에 오지 않았다."], "M013.title": "노인의 술", "M013.desc": ["밤. 노인이 마루에 앉아 **술을 홀짝였다**.", "", "나를 보더니, 잔 하나를 더 꺼내 놓았다.", "「◇◇.」"], "M013.c1.tag": "술", "M013.c1.text": "옆에 앉아 잔을 받는다", "M013.c1.o0": ["노인 옆에 앉았다. 술이 목을 긁었다.", "", "노인이 혼잣말처럼, **오래 무언가를 이야기했다**.", "알아들은 건 몇 마디뿐이었다.", "", "그래도 노인은, **처음으로 웃었다**."], "M013.c2.tag": "사양", "M013.c2.text": "고개를 숙이고 물러난다", "M013.c2.o0": ["고개를 숙이고, 헛간으로 돌아왔다.", "", "짚더미에 누워, 낮에 들은 낱말들을 **입속으로 되뇌었다**."], "M020.title": "시간이 흐르다", "M020.desc": ["계절이 두 번 바뀌었다.", "", "어느 아침, 노인이 나를 불렀다.", "\"장작 좀 패 오너라.\"", "", "…들렸다.", "**<gold>말이, 들렸다.<\/gold>**"], "M020.c1.tag": "말", "M020.c1.text": "\"…예, 다녀오겠습니다.\" 하고 대답한다", "M020.c1.o0": ["\"…예, 다녀오겠습니다.\"", "", "노인이 도끼를 쥔 채, **눈을 크게 떴다**.", "그러고는 껄껄 웃었다.", "\"이놈 봐라. 말을 하네.\""], "M021.title": "말 없는 세월", "M021.desc": ["계절이 두 번 바뀌었다.", "", "말은 여전히, **몇 마디뿐**이었다.", "사람들은 나를 **꿍얼이**라 불렀다.", "알아듣지 못할 말만 꿍얼댄다고.", "그 말만은, 알아들었다."], "M021.c1.tag": "고개", "M021.c1.text": "고개를 숙이고 장작을 팬다", "M021.c1.o0": ["고개를 숙이고, 장작을 팼다.", "", "말을 몰라도, **도끼질은 늘었다**."], "V001.title": "떠돌이 무인", "V001.desc": ["마을 어귀 정자에, **낡은 칼**을 찬 사내가 드러누워 있었다.", "술 냄새가 났다. 아이들이 멀찍이서 구경했다.", "", "사내가 눈을 감은 채, 날아드는 파리를 **손가락 두 개로 집었다**.", "아이들이 탄성을 질렀다."], "V001.c1.tag": "청", "V001.c1.text": "무공을 가르쳐 달라고 청한다", "V001.c1.o0": ["\"무공을, 가르쳐 주십시오.\"", "", "사내가 한쪽 눈을 떴다.", "\"범부가 무공은 무슨.\"", "", "사흘 동안, 사내 대신 장작을 패고 물을 길었다.", "나흘째 아침, 사내가 **턱짓**을 했다.", "\"무릎 굽혀. 허리 펴고. 그게 **마보**다. 버텨.\"", "", "다리가 부들부들 떨렸다. 구경하던 아이들이 **우와** 하고 소리쳤다."], "V001.c2.tag": "흉내", "V001.c2.text": "사내의 손놀림을 흉내 낸다", "V001.c2.o0": ["정자 아래서, 사내의 손놀림을 따라 했다.", "파리는 한 마리도 잡히지 않았다.", "", "사내가 껄껄 웃더니, 지팡이로 내 팔꿈치를 툭 쳤다.", "「◇◇.」", "", "팔꿈치를 낮추자, **손이 조금 빨라졌다**."], "V001.c3.tag": "술", "V001.c3.text": "술 한 병을 사다 바친다", "V001.c3.o0": ["술 한 병을 사다, 정자에 올려놓았다.", "", "사내가 병째 들이켜더니, **눈이 풀렸다**.", "\"술값은 해야지. 이거나 한번 따라 해 보시오.\"", "", "사내가 중얼거린 몇 구절.", "**들이쉼은 길게, 머묾은 깊게, 내쉼은 가늘게.**"], "V001.c4.tag": "지나침", "V001.c4.text": "멀찍이 지나친다", "V001.c4.o0": ["멀찍이 지나쳤다.", "", "등 뒤에서, 아이들의 **탄성**이 한 번 더 들렸다."], "V002.title": "길목 객잔", "V002.desc": ["낙양으로 가는 길목의 객잔.", "노인의 소개로, **허드렛일**을 하게 되었다.", "", "점심 무렵, 칼 찬 손님 둘이 시비가 붙었다.", "탁자가 뒤집혔다.", "", "한 사내가 **탁자를 밟고, 그대로 지붕 위로 솟구쳤다**.", "…사람이, 날았다."], "V002.c1.tag": "숨기", "V002.c1.text": "탁자 밑으로 숨는다", "V002.c1.o0": ["탁자 밑으로 기어들었다.", "", "지붕 위에서 쇳소리가 몇 번 울리고, 조용해졌다.", "기어 나오니, 손님들이 **아무렇지 않게** 다시 국수를 먹고 있었다.", "", "여기서는, **이게 흔한 일이었다**."], "V002.c2.tag": "끼어들기", "V002.c2.text": "말리려고 끼어든다", "V002.c2.o0": ["\"그, 그만들 하세요!\"", "", "칼끝이, 내 쪽으로 돌았다.", "**<red>목이 서늘했다.<\/red>**"], "V002.c2.o1": ["\"그, 그만들 하세요!\"", "", "칼끝이 내 뺨을 스쳤다.", "손님들이 **혀를 찼다**.", "「◇◇◇.」", "대충, 미친놈이라는 뜻 같았다."], "V002.c3.tag": "귀", "V002.c3.text": "손님들의 수군거림에 귀를 기울인다", "V002.c3.o0": ["싸움이 끝나자, 손님들이 수군거렸다.", "\"녹풍채 놈들이 또 산을 내려왔다더군.\"", "\"낙양 관아는 뭘 하는지.\"", "\"숭산 쪽 스님들이 나선다는 말도 있던데.\"", "", "**<gold>강호.<\/gold>** 낯선 말들이, 하나씩 귀에 박혔다."], "V002.c4.tag": "부축", "V002.c4.text": "쓰러진 쪽을 부축한다", "V002.c4.o0": ["싸움에 진 사내가 마당에 쓰러져 있었다.", "부축해 우물가에 앉혔다.", "", "사내가 피 묻은 손으로, **은자 한 냥**을 쥐여 주었다.", "객잔 주인이 **눈을 휘둥그레 떴다**."], "V002.c5.tag": "삼재", "V002.c5.text": "쓰러진 손님의 검을 주워 든다", "V002.c5.o0": ["뒹구는 검을 주워 들었다.", "처음 쥐는 검인데, **무게가 낯설지 않았다**.", "천으로 위를 막고, 지로 아래를 막았다.", "", "두 사내가 동시에 멈췄다.", "\"…이건 또 뭐야.\"", "", "객잔 주인이 술병을 떨어뜨렸다. 손님들이 **숟가락을 든 채** 굳었다."], "V003.title": "불 켜는 물건", "V003.desc": ["비단옷을 입은 상인이, 노인의 집 앞을 기웃거렸다.", "", "나를 보더니, **손뼉을 쳤다**.", "엄지를 딱딱 튕기는 시늉을 했다. **라이터**였다."], "V003.c1.tag": "팔기", "V003.c1.text": "라이터를 판다", "V003.c1.o0": ["라이터를 내밀었다.", "", "상인이 몇 번이고 불을 켜 보더니, **은자 두 냥**을 내놓았다.", "구경하던 마을 사람들이 **입을 쩍 벌렸다**."], "V003.c2.tag": "흥정", "V003.c2.text": "값을 올려 부른다", "V003.c2.o0": ["\"그걸로는 안 됩니다. 이 불은, 비가 와도 켜집니다.\"", "", "상인의 눈이 반짝였다.", "**은자 다섯 냥**이 나왔다.", "", "노인이 뒤에서 **혀를 내둘렀다**.", "\"이놈, 장사꾼이었나.\""], "V003.c3.tag": "거절", "V003.c3.text": "고개를 저어 거절한다", "V003.c3.o0": ["고개를 저었다.", "상인이 웃는 얼굴로 물러났다.", "", "그날 밤, 헛간 문이 소리 없이 열렸다.", "**<red>복면 쓴 사내가, 칼을 들고 있었다.<\/red>**"], "V003.c3.o1": ["고개를 저었다.", "상인이 웃는 얼굴로 물러났다.", "", "그날 밤, 헛간 밖에서 **발소리**가 서성이다 사라졌다.", "라이터를 **품 깊숙이** 넣고 잤다."], "V004.title": "산적의 습격", "V004.desc": ["한밤중, 개들이 **한꺼번에 짖었다**.", "", "횃불. 고함. 말발굽.", "「녹풍채다!」 하는 소리 같은 것이 들렸다.", "**<red>산적들이 마을로 쏟아져 들어왔다.<\/red>**"], "V004.c1.tag": "숨기", "V004.c1.text": "노인을 끌고 짚더미 속에 숨는다", "V004.c1.o0": ["노인의 팔을 잡아끌었다. 짚더미 속으로 파고들었다.", "", "짚더미에, **횃불이 던져졌다**.", "**<red>연기가 목을 막았다.<\/red>**"], "V004.c1.o1": ["노인의 팔을 잡아끌었다. 짚더미 속으로 파고들었다.", "", "발소리가 몇 번 지나갔다.", "새벽이 오고, 산적들이 물러갔다.", "", "노인이 내 손을 오래 잡고 있었다.", "「◇◇◇.」"], "V004.c2.tag": "맞섬", "V004.c2.text": "장작 패던 도끼를 쥐고 맞선다", "V004.c2.o0": ["도끼를 쥐고 뛰어나갔다.", "", "산적의 칼이, 도끼보다 **빨랐다**.", "**<red>땅바닥이, 얼굴로 다가왔다.<\/red>**"], "V004.c2.o1": ["도끼를 쥐고 뛰어나갔다.", "", "산적 하나의 정강이를 찍었다. 비명이 터졌다.", "산적들이 **멈칫했다**. 그 틈에 마을 사내들이 몽둥이를 들고 몰려나왔다.", "", "날이 밝자, 마을 사람들이 **나를 보는 눈이 달라져 있었다**."], "V004.c3.tag": "달아남", "V004.c3.text": "혼자 산으로 달아난다", "V004.c3.o0": ["뒷담을 넘어, 산으로 달렸다.", "", "덤불을 헤치는데, 앞에 **횃불**이 있었다.", "**<red>머리 위로 자루가 씌워졌다.<\/red>**"], "V004.c3.o1": ["뒷담을 넘어, 산으로 달렸다.", "", "새벽에 돌아오니, 노인의 집이 **반쯤 타 있었다**.", "노인은 살아 있었다.", "노인은, **나를 보지 않았다**."], "V004.c4.tag": "삼재", "V004.c4.text": "쓰러진 산적의 칼을 주워 든다", "V004.c4.o0": ["쓰러진 산적의 칼을 주워 들었다.", "몸이 먼저 움직였다. 천. 지. 인.", "", "두 놈을 쓰러뜨렸다. 셋째 놈의 횃불이, **어깨를 지졌다**.", "", "산적들이 물러간 새벽, 마을 사람들이 나를 둘러쌌다."], "V004.c4.o1": ["쓰러진 산적의 칼을 주워 들었다.", "", "어째서인지, 그 움직임이 **머리를 스쳤다**. 천. 지. 인.", "횃불을 든 산적 셋이, 차례로 **칼을 놓쳤다**.", "", "산적들이 비명을 지르며 물러갔다.", "날이 밝자, 마을 사람들이 **멀찍이서** 나를 보았다.", "\"…저 사람, 원래 저랬나?\""], "V004.c5.tag": "녹풍도", "V004.c5.text": "장작 패던 도끼를 크게 휘두른다", "V004.c5.o0": ["도끼 자루를 쥐자, 팔이 저절로 크게 돌았다.", "산적 둘이 비틀거리며 물러났다. 셋째의 횃불이, **등을 지졌다**.", "", "산적들이 물러간 새벽, 마을 사람들이 나를 둘러쌌다."], "V004.c5.o1": ["도끼 자루를 쥐자, 팔이 저절로 크게 돌았다.", "바람을 가르는 소리. 도끼날이 산적 셋의 횃불을 **한 번에** 쳐 날렸다.", "", "앞장선 산적이, 내 도끼를 보고 얼어붙었다.", "「◇ ◇◇ ◇◇◇…!」", "", "산적들이 서로 얼굴을 보더니, 말머리를 돌렸다.", "날이 밝자, 마을 사람들이 나를 **멀찍이서** 보았다."], "N010.title": "화톳불의 사내들", "N010.desc": ["바위 그늘에 **화톳불**. 사내 넷이 둘러앉아 있었다.", "허리에 **초록 띠**. 무릎 위에, 칼.", "", "발밑에서 나뭇가지가 **뚝** 부러졌다.", "사내들이 일제히 일어섰다.", "", "「◇◇! ◇◇◇◇?」"], "N010.c1.tag": "손", "N010.c1.text": "두 손을 들어 보인다", "N010.c1.o0": ["두 손을 들어 보였다.", "", "사내 하나가 다가와 내 몸을 더듬었다. 아무것도 나오지 않자, 혀를 찼다.", "「◇◇◇.」", "", "**<red>뒤에서 날아온 것은, 칼등이 아니었다.<\/red>**"], "N010.c1.o1": ["두 손을 들어 보였다.", "", "사내 하나가 다가와 내 몸을 더듬었다. 쓸 만한 게 없자, 혀를 찼다.", "「◇◇◇◇. ◇◇.」", "", "사내들이 낄낄대며 나를 비탈 아래로 **걷어찼다**.", "구르고, 또 굴렀다. 불빛이 멀어졌다."], "N010.c2.tag": "외침", "N010.c2.text": "\"도와주세요!\" 하고 소리친다", "N010.c2.o0": ["\"도와주세요! 길을 잃었어요!\"", "", "사내들의 얼굴이 **굳었다**. 하나가 산 아래쪽을 살피고, 하나가 칼을 뽑았다.", "…소리를 지르면, 누가 온다고 여긴 걸까.", "", "**<red>소리는, 거기서 끊겼다.<\/red>**"], "N010.c2.o1": ["\"도와주세요! 길을 잃었어요!\"", "", "입에 **헝겊**이 처박혔다. 나무에 묶였다.", "사내들은 산 아래를 한참 살피다가, 다시 불가에 앉았다.", "", "새벽, 사내들이 잠든 사이 밧줄을 나무껍질에 비볐다. 손목이 **풀렸다**."], "N010.c3.tag": "도망", "N010.c3.text": "등을 돌려 어둠 속으로 달아난다", "N010.c3.o0": ["등을 돌려, 어둠 속으로 달렸다.", "", "뒤에서 무언가 **휙** 날아왔다.", "**<red>돌이었다. 뒤통수가, 먼저 땅에 닿았다.<\/red>**"], "N010.c3.o1": ["등을 돌려, 어둠 속으로 달렸다.", "", "뒤에서 고함과 발소리. 덤불 속에 엎드려, 숨을 죽였다.", "발소리가 **지나갔다**."], "N010.c4.tag": "라이터", "N010.c4.text": "라이터를 켜 들이민다", "N010.c4.o0": ["라이터를 켜, 사내들 앞에 들이밀었다.", "", "", "사내 하나가 **뒷걸음질**쳤다. 다른 하나는, 도끼를 던졌다.", "**<red>불꽃이, 바닥에 떨어졌다.<\/red>**"], "N010.c4.o1": ["라이터를 켜, 사내들 앞에 들이밀었다.", "", "손가락 끝에서 피어난 **불꽃**에, 사내들이 얼어붙었다.", "「◇◇! ◇◇◇!」", "", "사내들이 칼도 챙기지 못하고, 비탈 위로 **달아났다**.", "화톳불 곁에 고기 굽던 꼬챙이가 남았다. 손대지 않았다. 손이 떨려서."], "N011.title": "끌려가는 밤", "N011.desc": ["자루가 벗겨졌다.", "", "산길. 손목이 밧줄에 묶여, 앞사람 등에 이어져 있었다.", "마을 사내 둘, **이웃집 아낙** 하나.", "", "뒤에서 산적이 창대로 등을 밀었다.", "「◇◇◇. ◇◇◇◇.」"], "N011.c1.tag": "이빨", "N011.c1.text": "밧줄을 이로 물어뜯는다", "N011.c1.o0": ["걸으면서, 밧줄을 이로 물어뜯었다.", "", "산적이 **돌아보았다**.", "**<red>창날이, 달빛을 한 번 받았다.<\/red>**"], "N011.c1.o1": ["걸으면서, 밧줄을 이로 물어뜯었다.", "굽잇길에서 밧줄이 **끊어졌다**. 비탈 아래 덤불로 몸을 굴렸다.", "", "앞에 묶인 마을 사내가 돌아보았다. 나를 보고, **고개를 저었다**.", "", "새벽에 마을로 돌아오니, 노인의 집이 **반쯤 타 있었다**.", "노인은 살아 있었다. 노인은, **나를 보지 않았다**."], "N011.c2.tag": "따름", "N011.c2.text": "앞사람을 따라 묵묵히 걷는다", "N011.c2.o0": ["묵묵히 걸었다.", "", "새벽, **산채 마당**에 닿았다.", "애꾸눈 사내가 내 발치에 칼을 던지고, 무릎 꿇린 마을 사내를 턱으로 가리켰다.", "「◇◇◇.」", "", "…밧줄을 끊으라는 줄 알았다.", "칼을 주워, 마을 사내의 밧줄을 끊어 주었다.", "", "마당이 **조용해졌다**.", "**<red>애꾸눈 사내가, 웃으며 칼을 뽑았다.<\/red>**"], "N011.c3.tag": "아낙", "N011.c3.text": "앞에 묶인 아낙의 매듭을 몰래 늦춘다", "N011.c3.o0": ["손끝으로, 앞에 묶인 아낙의 매듭을 더듬었다.", "", "아낙이 놀라 **비명을 질렀다**.", "산적이 횃불을 들이댔다.", "**<red>창대가, 이번엔 거꾸로 들려 있었다.<\/red>**"], "N011.c3.o1": ["손끝으로, 앞에 묶인 아낙의 매듭을 더듬었다.", "매듭이 **풀렸다**. 아낙이 숨을 삼키고, 내 매듭도 풀었다.", "", "개울을 건널 때, 둘이서 물속으로 **몸을 던졌다**.", "산적들의 고함이, 물소리에 묻혔다.", "", "새벽, 아낙과 함께 마을로 돌아왔다.", "노인이 마당에 나와 있었다. 한참 나를 보더니, 내 젖은 등을 **쓸어 주었다**."], "N011.c4.tag": "라이터", "N011.c4.text": "쉬는 틈에 라이터를 켠다", "N011.c4.o0": ["산적들이 쉬는 틈에, 묶인 손으로 라이터를 켰다.", "", "산적 하나가 불꽃을 보고, 그대로 **창을 내질렀다**.", "**<red>무서운 것은, 먼저 찌르는 법이었다.<\/red>**"], "N011.c4.o1": ["산적들이 쉬는 틈에, 묶인 손으로 라이터를 켰다.", "", "손끝에서 불꽃이 피어오르자, 산적들이 **얼어붙었다**.", "「◇◇! ◇◇◇◇!」", "", "그 불꽃으로, 밧줄을 **지졌다**. 툭, 툭. 밧줄이 끊겼다.", "산적들은 다가오지 못했다. 마을 사람들과 함께, 뒷걸음질로 산을 내려왔다.", "", "그 뒤로 마을에는, 산적들이 **요괴**를 만났다는 소문이 돌았다."], "V005.title": "관병의 검문", "V005.desc": ["창을 든 **관병**들이 마을 어귀를 막고 있었다.", "오가는 사람마다, 손바닥만 한 **패**를 내보였다.", "", "나에게는, 아무것도 없었다."], "V005.c2.tag": "말", "V005.c2.text": "\"이 마을에서 머슴을 삽니다.\" 하고 둘러댄다", "V005.c2.o0": ["\"이 마을에서 머슴을 삽니다. 저 집 노인네 댁입니다.\"", "", "관병이 노인 쪽을 보았다. 노인이 **고개를 끄덕였다**.", "\"…가 봐.\""], "V005.c1.tag": "노인", "V005.c1.text": "노인 뒤에 붙어 선다", "V005.c1.o0": ["노인 뒤에 바짝 붙었다.", "", "노인이 관병에게 **엽전 몇 닢**을 쥐여 주었다.", "관병이 나를 한 번 훑어보고, 손을 휘저었다. 지나가라는 뜻이었다."], "V005.c3.tag": "버팀", "V005.c3.text": "가만히 서서 버틴다", "V005.c3.o0": ["가만히 섰다.", "관병이 무어라 물었다. 대답하지 못했다.", "", "**<red>창대가 무릎을 쳤다. 끌려갔다. 돌아오지 못했다.<\/red>**"], "V005.c3.o1": ["가만히 섰다.", "관병이 무어라 물었다. 대답하지 못했다.", "", "창대가 무릎을 쳤다.", "노인이 달려와 허리를 굽신거린 뒤에야, **풀려났다**."], "V006.title": "새벽 수련", "V006.desc": ["닭도 울기 전, 뒷마당에 섰다.", "배운 것이라곤, **몇 가지 자세와 숨 쉬는 법**뿐이었다."], "V006.c1.tag": "마보", "V006.c1.text": "마보로 버틴다", "V006.c1.o0": ["무릎을 굽히고, 허리를 폈다.", "다리가 떨리기 시작해도, **버텼다**.", "", "해가 뜰 무렵, 다리에 감각이 없었다."], "V006.c2.tag": "호흡", "V006.c2.text": "숨을 고른다", "V006.c2.o0": ["눈을 감고, 배운 구절대로 숨을 쉬었다.", "들이쉼은 길게. 머묾은 깊게. 내쉼은 가늘게.", "", "아랫배 어딘가가, **미지근해졌다**."], "V006.c3.tag": "쉼", "V006.c3.text": "오늘은 쉰다", "V006.c3.o0": ["짚더미에 다시 누웠다.", "", "하루쯤은, 괜찮겠지."], "V007.title": "삼류의 문턱", "V007.desc": ["아랫배의 미지근한 기운이, **꽉 찼다**.", "더는 들어갈 자리가 없었다.", "", "몸 안 어딘가에, **보이지 않는 벽**이 있었다."], "V007.c1.tag": "밀기", "V007.c1.text": "기운을 끌어모아 벽을 민다", "V007.c1.o0": ["기운을 끌어모아, 벽을 밀었다.", "", "벽은 꿈쩍도 하지 않았다.", "**<red>입에서 피가 넘어왔다.<\/red>**"], "V007.c1.o1": ["기운을 끌어모아, 벽을 밀었다.", "", "무언가가, **툭 터졌다**.", "기운이 막힘없이 몸을 한 바퀴 돌았다.", "", "**<gold>{삼류}에 들었다.<\/gold>**", "", "노인이 마당에서 나를 보더니, **고개를 갸웃했다**.", "\"…네놈, 눈빛이 달라졌구나.\""], "V007.c2.tag": "기다림", "V007.c2.text": "서두르지 않고 기운을 더 다진다", "V007.c2.o0": ["벽을 밀지 않았다.", "대신, 차오른 기운을 **천천히 다졌다**."], "V008.title": "노인의 마지막", "V008.desc": ["겨울이었다.", "노인이, **자리에서 일어나지 못했다**.", "", "마른 손이 나를 찾아 허공을 더듬었다."], "V008.c1.tag": "손", "V008.c1.text": "손을 잡아 준다", "V008.c1.o0": ["노인의 손을 잡았다.", "", "손이 천천히, **식어 갔다**.", "", "마을 사람들이 와서 고개를 숙였다. 누군가 내 어깨를 두드렸다."], "V008.c2.tag": "약", "V008.c2.text": "약방으로 달려간다", "V008.c2.o0": ["약방으로 달렸다. 눈길에 몇 번이고 넘어졌다.", "", "약을 지어 돌아왔을 때, **노인은 이미 눈을 감고 있었다**."], "V008.c3.tag": "단지", "V008.c3.text": "떨리는 손가락이 가리키는 부엌으로 간다", "V008.c3.o0": ["부엌으로 가, 아궁이 옆 흙을 긁어냈다.", "흙 속에서, 그 **단지**가 나왔다.", "", "단지를 들고 오자, 노인이 그것을 내 쪽으로 **밀었다**.", "", "\"…영감님. 이건, 아드님 장가 밑천으로 모아 두신 돈 아닙니까?\"", "", "노인이 한참 나를 보았다.", "마른 입술이, 천천히 움직였다.", "\"…너도, 내 아들이나 **다름없다**.\"", "", "노인의 손이, 단지 위에서 **식어 갔다**.", "", "마을 사람들이 와서 고개를 숙였다.", "단지를 끌어안고, 오래 일어나지 못했다."], "V009.title": "수명이 다하다", "V009.desc": ["세월이 흘렀다.", "노인의 헛간은, 어느새 **내 집**이 되어 있었다.", "", "손은 굳은살로, 머리는 서리로 덮였다.", "배운 것도, 이룬 것도 많지 않았다.", "", "그래도 **끝까지 살아 냈다**."], "V009.c11.tag": "사범", "V009.c11.text": "무관 마당에서 제자들의 검 소리를 듣는다", "V009.c11.o0": ["무관 툇마루에 앉아, 마당을 내다보았다.", "천. 지. 인.", "**제자들의 목검 소리**가, 마당 가득 울렸다.", "", "흔해 빠진 검법이었다.", "그래도 이 검법으로, **여기까지 왔다**.", "", "그 뒤로도 백운무관 마당에서, 여러 해 제자들을 길렀다.", "", "**<gold>수명이 다했다.<\/gold>**"], "V009.c12.tag": "고참", "V009.c12.text": "무관 장부를 덮고 마당을 쓴다", "V009.c12.o0": ["무관 장부를 덮었다.", "빗자루를 들고, 늘 그랬듯 **마당을 쓸었다**.", "", "막내 수련생이 달려와, 빗자루를 빼앗았다.", "\"사범님, 그건 제 일입니다!\"", "", "그 뒤로도 무관의 마당을, 여러 해 더 쓸었다.", "", "**<gold>수명이 다했다.<\/gold>**"], "V009.c13.tag": "어른", "V009.c13.text": "정자에 앉아 아이들의 인사를 받는다", "V009.c13.o0": ["마을 어귀 정자에 앉았다.", "지나가는 아이들이, **꾸벅꾸벅** 인사를 했다.", "", "하늘에서 떨어진 꿍얼이는, 와우촌의 **어른**이 되어 있었다.", "", "그 뒤로도 와우촌의 일은, 여러 해 내 손을 거쳐 갔다.", "", "**<gold>수명이 다했다.<\/gold>**"], "V009.c14.tag": "가게", "V009.c14.text": "가게 문을 닫으며 마지막 셈을 마친다", "V009.c14.o0": ["가게 문을 닫았다.", "주판 대신, 손가락으로 **마지막 셈**을 했다.", "", "좌판 하나로 시작한 가게였다.", "간판에는, **내 이름**이 걸려 있었다.", "", "그 뒤로도 그 가게는, 여러 해 장터 고을의 불을 밝혔다.", "", "**<gold>수명이 다했다.<\/gold>**"], "V009.c1.tag": "하늘", "V009.c1.text": "마루에 앉아 하늘을 올려다본다", "V009.c1.o0": ["마루에 앉아, 하늘을 올려다보았다.", "벼락이 떨어지던 그날처럼, **맑은 하늘**이었다.", "", "…돌아가지는, 못했구나.", "", "그 뒤로도 와우촌에서, 여러 해를 더 살았다.", "", "**<gold>수명이 다했다.<\/gold>**"], "V009.c2.tag": "라이터", "V009.c2.text": "품속의 라이터를 켜 본다", "V009.c2.o0": ["품속을 더듬었다.", "라이터는, 오래전에 **가스가 다 떨어졌다**.", "", "딸깍. 딸깍.", "불은 켜지지 않았다.", "", "그 뒤로도 와우촌에서, 여러 해를 더 살았다.", "", "**<gold>수명이 다했다.<\/gold>**"], "V010.title": "마을의 하루", "V010.desc": ["별일 없는 하루였다.", "노인이 오늘 할 일을 **손가락으로 꼽았다**."], "V010.c1.tag": "장작", "V010.c1.text": "장작을 팬다", "V010.c1.o0": ["장작을 팼다.", "도끼질에, **어깨가 조금 넓어졌다**."], "V010.c2.tag": "심부름", "V010.c2.text": "장터 심부름을 간다", "V010.c2.o0": ["장터에 다녀왔다.", "거스름돈 몇 닢이, **내 몫**으로 남았다."], "V010.c3.tag": "산", "V010.c3.text": "산에 올라 나물을 캔다", "V010.c3.o0": ["산비탈을 오르내렸다.", "**발걸음이 가벼워졌다.**"], "V010.c4.tag": "수다", "V010.c4.text": "마을 아이들과 이야기한다", "V010.c4.o0": ["아이들이 하늘에서 떨어진 이야기를 해 달라고 졸랐다.", "\"거기는, 사람들이 다 작은 상자를 들고 다녀.\"", "", "아이들이 **까르르 웃었다**. 아무도 믿지 않았다."], "M030.title": "불어난 개울", "M030.desc": ["장마였다.", "개울이 흙탕물로 **불어났다**.", "", "아이 하나가, **물살에 떠내려가고** 있었다.", "", "「◇◇! ◇◇◇!」", "", "강둑의 아낙이 비명을 질렀다.", "사람들이 몰려들었다. **아무도 뛰어들지 않았다.**"], "M030.c1.tag": "뛰어듦", "M030.c1.text": "물속으로 뛰어든다", "M030.c1.o0": ["물속으로 뛰어들었다.", "물살이 몸을 **휘감았다**.", "", "아이의 옷깃을 잡았다. 강둑 쪽으로, 있는 힘껏 밀어 올렸다.", "사람들이 아이를 끌어올렸다.", "그다음은, 내 차례였다.", "", "발이 닿지 않았다. 물이 입으로 들어왔다.", "가라앉는 귀에, 강둑의 목소리가 들렸다.", "", "\"살았다! 아이가 살았어!\"", "\"꿍얼이는? 그 꿍얼이는 어디 갔어!\"", "", "나를 찾는 목소리였다.", "처음으로, 그 말이 **알아들렸다**.", "", "\"…여기, 있…\"", "", "처음 입에 올린 이곳의 말은, 물소리에 묻혔다.", "", "흙탕물이 목구멍을 채웠다.", "수면 위의 빛이, 점점 멀어졌다.", "", "**<red>더는, 떠오르지 못했다.<\/red>**"], "M030.c2.tag": "손짓", "M030.c2.text": "강둑을 따라 달리며 손짓한다", "M030.c2.o0": ["강둑을 따라 달리며, 아이를 가리키고 팔을 휘저었다.", "\"밧줄! 밧줄 가져와요!\"", "", "아무도 알아듣지 못했다.", "", "…결국, 물속으로 뛰어들었다.", "", "아이의 옷깃을 잡았다. 강둑 쪽으로, 있는 힘껏 밀어 올렸다.", "사람들이 아이를 끌어올렸다.", "그다음은, 내 차례였다.", "", "발이 닿지 않았다. 물이 입으로 들어왔다.", "가라앉는 귀에, 강둑의 목소리가 들렸다.", "", "\"살았다! 아이가 살았어!\"", "\"꿍얼이는? 그 꿍얼이는 어디 갔어!\"", "", "나를 찾는 목소리였다.", "처음으로, 그 말이 **알아들렸다**.", "", "\"…여기, 있…\"", "", "처음 입에 올린 이곳의 말은, 물소리에 묻혔다.", "", "흙탕물이 목구멍을 채웠다.", "수면 위의 빛이, 점점 멀어졌다.", "", "**<red>더는, 떠오르지 못했다.<\/red>**"], "V011.title": "빈 헛간", "V011.desc": ["영감의 짐을 정리했다.", "낡은 옷 두 벌. 담뱃대 하나. 그게 전부였다.", "", "이불 밑에서, **엽전 꾸러미** 하나가 나왔다."], "V011.c1.tag": "간직", "V011.c1.text": "꾸러미를 품에 넣는다", "V011.c1.o0": ["꾸러미를 품에 넣었다.", "", "생각보다, **무거웠다**."], "V011.c2.tag": "마을", "V011.c2.text": "마을 아이들 엿값으로 나눠 준다", "V011.c2.o0": ["꾸러미를 풀어, 아이들 손에 한 닢씩 쥐여 주었다.", "", "그날 와우촌 엿장수가, **동이 났다**."], "V012.title": "영감의 무덤", "V012.desc": ["뒷산, 누운 소의 등허리쯤.", "**영감의 무덤**에 풀이 돋아 있었다."], "V012.c1.tag": "풀", "V012.c1.text": "무덤의 풀을 뽑는다", "V012.c1.o0": ["무덤의 풀을 하나하나 뽑았다.", "", "해가 질 때까지, 아무 말도 하지 않았다."], "V012.c2.tag": "술", "V012.c2.text": "무덤에 술 한 잔을 붓는다", "V012.c2.o0": ["무덤에 술 한 잔을 부었다.", "", "\"…영감님 덕에, 살았습니다.\"", "", "바람이 불었다. 영감이 혀를 차는 소리 같았다."], "V013.title": "떠나간 아들", "V013.desc": ["낯선 사내가 영감의 집 앞에 서 있었다.", "", "\"…아버지는?\"", "", "영감이 술자리에서 말하던, **떠나간 아들**이었다."], "V013.c1.tag": "무덤", "V013.c1.text": "무덤으로 데려간다", "V013.c1.o0": ["아들을 뒷산 무덤으로 데려갔다.", "", "아들이 무덤 앞에 **무릎을 꿇었다**. 한참을 일어나지 못했다.", "", "산을 내려오며, 아들이 말했다.", "\"…아버지 곁에, 당신이 있어 줘서 다행이오.\""], "V013.c2.tag": "집", "V013.c2.text": "집을 내어 준다", "V013.c2.o0": ["\"이 집은, 원래 당신 집입니다.\"", "", "아들이 집을 둘러보다, 고개를 저었다.", "\"아니오. 아버지는 이 집을, **당신에게** 남긴 거요.\"", "", "아들은 하룻밤을 묵고, 다시 길을 떠났다."], "V013.c3.tag": "화", "V013.c3.text": "왜 이제 왔냐고 따진다", "V013.c3.o0": ["\"왜, 이제 왔습니까.\"", "", "아들이 대답하지 못했다.", "주먹을 쥔 채, 고개를 숙였다.", "", "아들은 무덤에만 들렀다가, **그날로 떠났다**."], "V013.c4.tag": "단지", "V013.c4.text": "영감이 남긴 단지를 아들 앞에 내놓는다", "V013.c4.o0": ["영감이 남긴 단지를, 아들 앞에 내놓았다.", "\"…아드님 장가 밑천이었습니다.\"", "", "아들이 단지를 한참 내려다보았다. 그리고 내 쪽으로 **도로 밀었다**.", "\"아버지가 마지막에 누구 손에 쥐여 줬는지, 그게 아버지 뜻이오.\"", "", "아들은 무덤에 절을 하고, 떠나기 전에 한 번 돌아보았다.", "\"…아우님. 아버지를, 고맙소.\""], "W001.title": "와우촌", "W001.desc": ["말이 들리고 나서야, 알게 된 것들이 있었다.", "", "이 마을의 이름은 **와우촌(臥牛村)**.", "뒷산이 **누운 소**처럼 생겼다 해서 붙은 이름이었다.", "", "나를 거둔 노인은, 마을 사람들이 **우 영감**이라 불렀다.", "", "\"그동안 꿍얼거리기만 하더니.\"", "우 영감이 마을 사람들을 하나씩 손가락으로 짚었다.", "\"저건 촌장. 깐깐하니 조심해라.\"", "\"저 약초 바구니 든 아이는 향아.\"", "\"그리고 저 꼬맹이 놈이, 네게 처음 말을 가르친 소삼이다.\""], "W001.c1.tag": "향아", "W001.c1.text": "향아에게 고개를 숙여 인사한다", "W001.c1.o0": ["향아에게 고개를 숙였다.", "", "향아가 바구니를 고쳐 들며, **얼굴을 붉혔다**.", "\"…하늘에서 떨어졌다던, 그분이죠?\"", "", "뒤에서 마을 아낙들이 **킥킥 웃었다**."], "W001.c2.tag": "촌장", "W001.c2.text": "촌장에게 찾아가 인사한다", "W001.c2.o0": ["촌장에게 찾아가, 허리를 깊이 숙였다.", "", "촌장이 나를 **위아래로 훑었다**.", "\"말을 한다니 다행이군. 사고 치면, 마을에서 나가는 걸세.\"", "", "우 영감이 뒤에서 **헛기침**을 했다."], "W001.c3.tag": "소삼", "W001.c3.text": "소삼의 머리를 쓰다듬는다", "W001.c3.o0": ["소삼의 머리를 쓰다듬었다.", "\"고맙다. 네 덕에 말을 배웠어.\"", "", "소삼이 **가슴을 쭉 폈다**.", "\"그럼 이제 내가 스승이네? 스승한테는 엿을 사 줘야 돼.\""], "W002.title": "장터의 노점", "W002.desc": ["낙양 성 밖 **장터 고을**.", "와우촌에서 반나절을 걸으면 닿는, 이 근방에서 가장 큰 장이었다.", "", "주머니에 은자가 있었다.", "빈 자리 하나가, 눈에 들어왔다."], "W002.c1.tag": "좌판", "W002.c1.text": "좌판을 펴고 장사를 시작한다", "W002.c1.o0": ["은자 한 냥으로 좌판과 물건을 샀다.", "", "**첫날, 하나도 팔지 못했다.**", "", "사흘째, 옆 좌판 아주머니가 혀를 찼다.", "\"그렇게 서 있으면 누가 사 가나. 소리를 질러, 소리를!\"", "", "\"싸요! 싸!\"", "**처음으로, 물건이 팔렸다.**"], "W002.c2.tag": "아이디어", "W002.c2.text": "현대의 셈법을 떠올린다", "W002.c2.o0": ["…하나 사면 하나 덤.", "편의점에서 수도 없이 본 그 문구가 떠올랐다.", "", "\"두 개 사시면, 하나 더 드립니다!\"", "", "장터 사람들이 **우르르 몰려들었다**.", "옆 좌판 상인들이 **눈을 흘겼다**."], "W002.c3.tag": "그만", "W002.c3.text": "아직은 아니라며 돌아선다", "W002.c3.o0": ["돌아섰다.", "돈은, 쓰는 순간 사라진다."], "W002.c4.tag": "속임", "W002.c4.text": "되 바닥을 높여 곡식을 덜어 판다", "W002.c4.o0": ["되 바닥에 나무판을 한 장 덧댔다.", "", "사흘째, 단골 아주머니가 산 곡식을 **자기 되에 다시 부어 보았다**.", "\"…반 되가 비는데?\"", "", "좌판이 엎어졌다. 장꾼들의 주먹이 쏟아졌다.", "**와우촌 외지 놈이 되를 속인다**는 말이, 반나절 만에 마을까지 닿았다."], "W002.c4.o1": ["되 바닥에 나무판을 한 장 덧댔다.", "", "곡식은 **잘 팔렸다**. 덜어 낸 만큼, 고스란히 남았다.", "", "…다만 장터 사람들의 눈은, 생각보다 밝았다.", "\"저 외지 놈 되는, 어째 늘 얕아.\""], "W003.title": "장날", "W003.desc": ["장날이었다.", "좌판 앞에, 사람들이 **오갔다**."], "W003.c1.tag": "소리", "W003.c1.text": "목청껏 손님을 부른다", "W003.c1.o0": ["\"싸요! 싸!\"", "", "목이 쉬도록 외쳤다.", "저녁 무렵, **전대가 묵직했다**."], "W003.c2.tag": "외상", "W003.c2.text": "단골에게 외상을 준다", "W003.c2.o0": ["단골에게 외상을 주었다.", "", "단골은, **다시 오지 않았다**."], "W003.c2.o1": ["단골에게 외상을 주었다.", "", "보름 뒤, 단골이 **친척까지 데리고** 왔다."], "W003.c3.tag": "왈패", "W003.c3.text": "자릿세를 뜯으러 온 왈패를 상대한다", "W003.c3.o0": ["왈패가 좌판을 걷어찼다.", "\"자릿세를 안 내?\"", "", "**좌판이 엎어졌다.** 물건이 진흙에 굴렀다."], "W003.c3.o1": ["왈패가 좌판을 걷어찼다.", "\"자릿세를 안 내?\"", "", "걷어차는 발목을, 잡아챘다.", "왈패가 **엉덩방아**를 찧었다.", "", "옆 좌판 아주머니가 **박수를 쳤다**."], "W004.title": "품앗이", "W004.desc": ["모내기 철이었다.", "온 마을이 한 논에 모여, **줄지어 모를 심었다**."], "W004.c1.tag": "논", "W004.c1.text": "허리를 굽혀 끝까지 모를 심는다", "W004.c1.o0": ["허리가 끊어질 듯했다.", "", "해 질 녘, 촌장이 내 어깨를 **두드렸다**.", "\"하늘에서 떨어진 놈치고는, 허리가 제법이군.\""], "W004.c2.tag": "새참", "W004.c2.text": "향아를 도와 새참을 나른다", "W004.c2.o0": ["향아를 도와, 새참 광주리를 날랐다.", "", "광주리 너머로, 향아가 **웃었다**.", "논에서 지켜보던 아낙들이, 또 **킥킥댔다**."], "W004.c3.tag": "아이들", "W004.c3.text": "아이들과 미꾸라지를 잡는다", "W004.c3.o0": ["소삼과 아이들을 따라, 논두렁에서 미꾸라지를 잡았다.", "", "**한 바구니**가 찼다.", "그날 저녁, 우 영감네 국이 **유난히 진했다**."], "W004.c4.tag": "녹풍도", "W004.c4.text": "낫을 들고 논둑의 웃자란 풀을 쳐 낸다", "W004.c4.o0": ["낫을 들고, 논둑에 섰다.", "낫을 크게 돌리자, 웃자란 풀이 **세 이랑**씩 눕혀졌다.", "", "모를 심던 사람들이 허리를 펴고 쳐다보았다.", "\"허, 저 사람 낫질 좀 보게.\"", "", "우 영감만은 웃지 않았다.", "\"…그 낫질, 보고 있자니 영 **기분이 나쁘구나**.\"", "영감은 그 말만 하고, 다시 모를 심었다."], "W005.title": "막힌 우물", "W005.desc": ["마을 우물이 **흙탕물**이 되었다.", "", "촌장이 우물가에서 **발을 굴렀다**.", "\"누가 좀 들어가 봐야 하는데…\"", "", "아무도 나서지 않았다."], "W005.c1.tag": "들어감", "W005.c1.text": "밧줄을 매고 우물로 내려간다", "W005.c1.o0": ["밧줄을 허리에 감고, 우물로 내려갔다.", "", "중간쯤에서, **밧줄이 끊어졌다**.", "**<red>차가운 물이 머리 위로 닫혔다.<\/red>**"], "W005.c1.o1": ["밧줄을 허리에 감고, 우물로 내려갔다.", "바닥에 무너진 돌을 하나씩 걷어 올렸다.", "", "이튿날, 우물물이 **맑아졌다**.", "", "촌장이 처음으로, 내게 **먼저 고개를 숙였다**.", "\"…고맙네.\""], "W005.c2.tag": "지식", "W005.c2.text": "물을 끓여 마시자고 말한다", "W005.c2.o0": ["\"우물을 고치는 동안, 물은 꼭 끓여서 마셔야 합니다.\"", "", "\"왜?\"", "\"…물속에 보이지 않는 벌레가 있어서요.\"", "", "사람들이 **비웃었다**.", "", "보름 뒤, 이웃 마을에 **배앓이**가 돌았다. 와우촌만 멀쩡했다.", "사람들이 나를 보는 눈이, **달라졌다**."], "W005.c3.tag": "지켜봄", "W005.c3.text": "나서지 않고 지켜본다", "W005.c3.o0": ["나서지 않았다.", "", "결국 촌장의 아들이 내려갔다.", "촌장이 나를 **흘겨보았다**."], "W005.c4.tag": "물장사", "W005.c4.text": "집 물독을 채워 두고, 물을 판다", "W005.c4.o0": ["우물이 흐려지기 전에 길어 둔 물이, 헛간 독에 **세 독** 있었다.", "", "\"한 동이에 동전 두 닢.\"", "", "처음엔 욕을 하던 사람들도, 이틀째부터는 **말없이 동전을 내밀었다**.", "", "닷새 뒤 촌장의 아들이 우물을 고쳤다.", "그날부터 마을 사람들은 나를, **물장수**라 불렀다. 좋은 뜻은 아니었다."], "W006.title": "우 영감의 중매", "W006.desc": ["어느 저녁, 우 영감이 술잔을 내밀었다.", "", "\"너도 이제, **자리 잡을 때**가 됐다.\"", "\"향아네 부모가, 너를 싫어하지 않더구나.\"", "", "우 영감이 내 눈치를 살폈다."], "W006.c1.tag": "승낙", "W006.c1.text": "고개를 숙여 승낙한다", "W006.c1.o0": ["\"…영감님 뜻대로 하겠습니다.\"", "", "우 영감이 **무릎을 쳤다**.", "\"하하! 이놈, 하늘에서 떨어지길 잘했구나!\"", "", "한 달 뒤, 와우촌에서 **혼례**가 열렸다.", "마을 사람들이 모두 모였다. 소삼이 제일 크게 **떠들었다**.", "", "붉은 옷의 향아가, 고개를 숙인 채 웃었다."], "W006.c2.tag": "망설임", "W006.c2.text": "돌아갈 곳이 있다며 망설인다", "W006.c2.o0": ["\"…저는, 돌아가야 할 곳이 있습니다.\"", "", "우 영감이 한참 말이 없었다.", "\"하늘로 말이냐.\"", "", "대답하지 못했다.", "우 영감이 술잔을 비우고, **혼자 웃었다**.", "\"그래. 억지로는 안 되지.\""], "W007.title": "마을 잔치", "W007.desc": ["가을걷이가 끝났다.", "마을 공터에 **모닥불**이 올랐다.", "", "누군가 내 손에 술잔을 쥐여 주었다."], "W007.c1.tag": "노래", "W007.c1.text": "떠밀려 노래를 부른다", "W007.c1.o0": ["떠밀려 모닥불 앞에 섰다.", "아는 노래라고는, **지구의 노래**뿐이었다.", "", "부르고 나니, 사방이 **조용했다**.", "", "소삼이 먼저 손뼉을 쳤다. 이어서 모두가 쳤다.", "\"뭔 소린지 하나도 모르겠는데, 좋다!\""], "W007.c2.tag": "씨름", "W007.c2.text": "씨름판에 나선다", "W007.c2.o0": ["씨름판에 나섰다.", "마을 장사에게, **단번에 메다꽂혔다**.", "", "사람들이 **배를 잡고 웃었다**."], "W007.c2.o1": ["씨름판에 나섰다.", "", "마을 장사를, **모래판에 눕혔다**.", "", "함성이 터졌다. 촌장까지 **술잔을 들어 올렸다**."], "W007.c3.tag": "구석", "W007.c3.text": "구석에서 조용히 마신다", "W007.c3.o0": ["구석에 앉아, 조용히 마셨다.", "", "우 영감이 옆에 와 앉았다.", "\"…좋은 밤이구나.\""], "W007.c4.tag": "슬쩍", "W007.c4.text": "잔치 고기를 소매에 챙긴다", "W007.c4.o0": ["다들 씨름판을 보는 틈에, 고기 한 덩이를 소매에 밀어 넣었다.", "", "돌아서는데, 소매에서 **기름이 뚝뚝** 떨어졌다.", "", "\"…저놈 소매 좀 봐라.\"", "모닥불 앞이 **웃음바다**가 되었다. 웃음 끝이, 차가웠다."], "W007.c4.o1": ["다들 씨름판을 보는 틈에, 고기 한 덩이를 소매에 밀어 넣었다.", "", "헛간에서 혼자 뜯었다. **맛있었다**.", "", "이튿날, 잔칫상을 차린 아낙들이 수군거렸다.", "\"고기가 한 덩이 비던데…\""], "W008.title": "돌림병", "W008.desc": ["이웃 마을에 **돌림병**이 돌았다.", "", "와우촌 어귀에, 앓는 사람들이 몰려왔다.", "촌장이 **마을 입구를 막자**고 했다."], "W008.c1.tag": "막음", "W008.c1.text": "촌장을 따라 입구를 막는다", "W008.c1.o0": ["입구를 막았다.", "", "와우촌은 **무사했다**.", "담 너머에서 들려오던 기침 소리는, 며칠 뒤 **그쳤다**."], "W008.c2.tag": "돌봄", "W008.c2.text": "천을 얼굴에 감고 앓는 이들을 돌본다", "W008.c2.o0": ["천을 얼굴에 감고, 앓는 이들 곁에 앉았다.", "물을 끓이고, 이마를 닦았다.", "", "열흘째, **내 이마가 뜨거웠다**.", "**<red>다시는 일어나지 못했다.<\/red>**"], "W008.c2.o1": ["천을 얼굴에 감고, 앓는 이들 곁에 앉았다.", "물을 끓이고, 손을 씻기고, 이마를 닦았다.", "", "**절반이, 살아 돌아갔다**.", "", "향아가 약초를 들고, 몰래 담을 넘어와 거들었다."], "W008.c3.tag": "향아", "W008.c3.text": "향아와 약초를 캐러 산에 오른다", "W008.c3.o0": ["향아를 따라 산에 올랐다.", "해열에 쓴다는 풀을, **바구니 가득** 캤다.", "", "약초 달인 물을 담 너머로 넘겼다.", "담 너머에서 누군가, **고맙다고 외쳤다**."], "W008.c4.tag": "숨", "W008.c4.text": "숨을 고르며 앓는 이들을 돌본다", "W008.c4.o0": ["천을 얼굴에 감고, 앓는 이들 곁에 앉았다.", "숨을 고르며 열흘을 버텼다.", "", "**<red>열하루째, 끝내 내 이마도 뜨거워졌다.<\/red>**"], "W008.c4.o1": ["천을 얼굴에 감고, 앓는 이들 곁에 앉았다.", "밤이 되면, **몸이 숨 쉬는 법을 알고 있었다**. 배운 적도 없는데.", "", "**열흘을 버텼다.** 앓는 이들의 절반이 살아 돌아갔다.", "", "향아가 고개를 갸웃했다.", "\"…당신은, 어떻게 안 옮아요?\""], "W009.title": "촌장의 부탁", "W009.desc": ["촌장이 나를 불렀다.", "방 안에, **마을 장부**가 펼쳐져 있었다.", "", "\"…내 눈이 침침해서 말일세.\"", "\"자네, 셈이 빠르다지.\""], "W009.c1.tag": "맡음", "W009.c1.text": "장부를 맡는다", "W009.c1.o0": ["장부를 맡았다.", "", "**곱셈 구구**로 셈을 하자, 촌장이 눈을 크게 떴다.", "\"그게… 무슨 셈법인가?\"", "\"…저 사는 곳에서는, 다들 이렇게 합니다.\"", "", "그날부터 마을 일은, **나를 거쳐** 정해졌다."], "W009.c2.tag": "사양", "W009.c2.text": "분에 넘친다며 사양한다", "W009.c2.o0": ["\"분에 넘칩니다.\"", "", "촌장이 장부를 덮었다.", "\"…겸손한 것도, 마음에 드는군.\""], "B001.title": "백운무관의 방", "B001.desc": ["장터 고을 어귀에, **방**이 붙어 있었다.", "", "글은 아직 서툴렀다. 옆 사람이 소리 내어 읽었다.", "\"백운무관, 수련생 받음. 입관 시험 있음.\"", "", "방 앞에 몰려든 젊은이들이 **수군거렸다**.", "\"백운무관이면, 엄 관주네 아냐? 무섭다던데.\""], "B001.c1.tag": "문", "B001.c1.text": "무관의 문을 두드린다", "B001.c1.o0": ["무관의 문을 두드렸다."], "B001.c2.tag": "지나침", "B001.c2.text": "지나친다", "B001.c2.o0": ["방을 등지고, 와우촌으로 돌아왔다.", "", "그날 밤, 이상하게 **잠이 오지 않았다**."], "B002.title": "입관 시험", "B002.desc": ["좁은 마당. 낡은 **목인**과, 무기 걸이.", "", "마루에 앉은 사내가 나를 내려다보았다. **엄 관주**였다.", "\"마보. 향 한 대 탈 동안 버텨라.\"", "", "옆에서 수련생 둘이 **킬킬댔다**.", "덩치 큰 쪽이 속삭였다.", "\"저거 사흘 만에 나간다에 동전 한 닢.\""], "B002.c1.tag": "버팀", "B002.c1.text": "무릎을 굽히고 버틴다", "B002.c1.o0": ["무릎을 굽혔다.", "", "향이 반도 타기 전에, **다리가 꺾였다**.", "덩치 큰 수련생이 **배를 잡고 웃었다**.", "", "엄 관주가 말했다.", "\"…물 긷고 장작 패라. 잡일꾼이다.\""], "B002.c1.o1": ["무릎을 굽혔다.", "", "다리가 불타는 듯했다. 그래도, **버텼다**.", "향이 다 탔다.", "", "킬킬대던 수련생들이 **입을 다물었다**.", "엄 관주가 짧게 말했다.", "\"…들어와라.\""], "B002.c2.tag": "아는자세", "B002.c2.text": "배운 마보 자세로 버틴다", "B002.c2.o0": ["떠돌이 무인에게 배운 대로, 무릎을 굽히고 허리를 폈다.", "", "향이 다 타도록, **흔들리지 않았다**.", "", "엄 관주의 눈썹이 **조금 올라갔다**.", "\"누구한테 배웠나.\"", "\"지나가던 술꾼한테요.\"", "", "수련생들 사이에서, **웃음이 터졌다**. 엄 관주는 웃지 않았다.", "\"…들어와라.\""], "B002.c3.tag": "포기", "B002.c3.text": "무릎을 펴고 돌아선다", "B002.c3.o0": ["무릎을 폈다.", "\"…다음에 오겠습니다.\"", "", "등 뒤에서, 덩치 큰 수련생이 **동전 한 닢**을 받아 챙겼다."], "B003.title": "잡일꾼의 나날", "B003.desc": ["새벽 물 긷기. 장작. 마당 쓸기.", "", "물동이를 지고 오는데, 덩치 큰 수련생이 발을 걸었다.", "**마철**이었다.", "\"어이쿠, 하늘에서 떨어진 놈이 이것도 못 알아채?\"", "", "수련생들이 **킬킬댔다**. 같은 날 들어온 **진호**만, 웃지 않았다."], "B003.c1.tag": "참음", "B003.c1.text": "물동이를 다시 채워 온다", "B003.c1.o0": ["말없이 우물로 돌아가, 물동이를 다시 채웠다.", "", "저녁에, 진호가 **주먹밥 하나**를 내밀었다.", "\"…저 형, 원래 저래. 신경 쓰지 마.\""], "B003.c2.tag": "맞섬", "B003.c2.text": "마철의 멱살을 잡는다", "B003.c2.o0": ["마철의 멱살을 잡았다.", "", "마철의 주먹이, **먼저** 들어왔다.", "마당에 나동그라졌다.", "", "엄 관주가 마루에서 보고 있었다. 아무 말도 하지 않았다."], "B003.c2.o1": ["마철의 멱살을 잡았다.", "", "마철이 휘두른 주먹을, 고개를 숙여 **피했다**.", "내 머리가, 그대로 마철의 턱을 받았다.", "", "수련생들이 **얼어붙었다**.", "마철이 턱을 감싸 쥐고, 나를 **노려보았다**.", "\"…너, 두고 보자.\""], "B003.c3.tag": "비꼼", "B003.c3.text": "현대식으로 비아냥댄다", "B003.c3.o0": ["\"발재간 자랑하고 싶었으면, 축구 선수가 됐어야지.\"", "", "\"축…? 뭐라고?\"", "\"…아니야.\"", "", "마철이 어이없다는 얼굴로 **웃어 버렸다**.", "\"이상한 놈이네.\""], "B004.title": "삼재검법", "B004.desc": ["엄 관주가 목검을 하나 던져 주었다.", "", "\"**삼재검법**. 천, 지, 인. 세 가지만 기억해라.\"", "\"하늘을 베고, 땅을 쓸고, 사람을 찌른다.\"", "\"천하에서 가장 흔한 검법이다. 그래서, 가장 **기본**이다.\""], "B004.c1.tag": "따라함", "B004.c1.text": "관주의 초식을 그대로 따라 한다", "B004.c1.o0": ["관주의 검을 따라, 목검을 휘둘렀다.", "천. 지. 인.", "", "백 번을 휘두르자, 팔이 **떨어져 나갈 듯했다**.", "천 번째에, 관주가 **고개를 끄덕였다**."], "B004.c2.tag": "질문", "B004.c2.text": "왜 세 가지뿐이냐고 묻는다", "B004.c2.o0": ["\"왜, 세 가지뿐입니까?\"", "", "엄 관주가 처음으로, **입꼬리를 올렸다**.", "\"네가 세 가지를 다 하면, 그때 네 번째를 가르쳐 주마.\""], "B010.title": "토납법", "B010.desc": ["엄 관주가 목검을 거두게 했다.", "", "\"검만 휘둘러서는, 평생 **삼류**도 못 된다.\"", "\"숨부터 다시 배워라. **토납법**이다.\"", "", "관주가 마루에 가부좌를 틀었다.", "\"들이쉬어 단전에 모으고, 내쉬어 몸에 돌린다. 그게 전부다.\""], "B010.c1.tag": "따름", "B010.c1.text": "관주를 따라 가부좌를 튼다", "B010.c1.o0": ["관주를 따라 가부좌를 틀었다.", "", "들이쉬고, 모으고, 내쉬었다.", "다리가 저리고, 등이 가려웠다.", "", "해가 질 무렵, 아랫배에 **따뜻한 것**이 고였다.", "관주가 눈을 감은 채 말했다.", "\"…그게, 기다.\""], "B010.c2.tag": "구절", "B010.c2.text": "떠돌이 무인에게 배운 구절을 외어 보인다", "B010.c2.o0": ["\"들이쉼은 길게, 머묾은 깊게, 내쉼은 가늘게.\"", "", "관주가 **눈을 떴다**.", "\"…그 술꾼이, 제법 쓸 만한 걸 줬구나.\"", "", "그날, 관주는 내게만 **한 구절을 더** 일러 주었다.", "수련생들이 **힐끔거렸다**."], "B010.c3.tag": "졸음", "B010.c3.text": "눈을 감은 채 졸음을 참는다", "B010.c3.o0": ["눈을 감았다.", "…", "", "**죽비**가 어깨를 쳤다.", "수련생들이 **킥킥댔다**.", "", "\"다시.\""], "B010.c3.o1": ["눈을 감았다. 졸음이 몰려왔다.", "허벅지를 꼬집으며, 숨을 셌다.", "", "하나. 둘. 셋.", "**백을 셀 무렵**, 졸음 대신 따뜻한 것이 아랫배에 고였다."], "B005.title": "무관의 새벽", "B005.desc": ["무관의 새벽.", "수련생들이 마당에 **줄지어** 섰다."], "B005.c1.tag": "검", "B005.c1.text": "삼재검법을 반복한다", "B005.c1.o0": ["천. 지. 인.", "같은 초식을, **수백 번**.", "", "목검 끝이, 어제보다 **조금 덜 흔들렸다**."], "B005.c2.tag": "토납", "B005.c2.text": "토납법으로 숨을 고른다", "B005.c2.o0": ["가부좌를 틀고, 관주가 일러 준 대로 숨을 쉬었다.", "", "아랫배에, 따뜻한 것이 **고였다**."], "B005.c3.tag": "진호", "B005.c3.text": "진호와 맞대련을 한다", "B005.c3.o0": ["진호와 목검을 맞댔다.", "", "몇 합 만에 진호의 목검이 **날아갔다**.", "진호가 손목을 털며 웃었다.", "\"…너, 요즘 무섭다.\""], "B005.c4.tag": "떠남", "B005.c4.text": "무관을 그만두고 와우촌으로 돌아간다", "B005.c4.o0": ["엄 관주에게 큰절을 올렸다.", "\"…돌아가겠습니다.\"", "", "관주는 붙잡지 않았다.", "\"검은, 두고 가라.\"", "", "진호가 대문 밖까지 따라 나와, **오래 손을 흔들었다**."], "B006.title": "보름 비무", "B006.desc": ["보름마다 열리는 **비무**.", "이기면, 잡일꾼에서 **정식 제자**가 된다.", "", "엄 관주가 이름을 불렀다.", "내 상대는, **마철**이었다.", "", "마철이 목검을 어깨에 걸치고 **이를 드러냈다**.", "\"오늘, 두고 보자던 거 갚는다.\""], "B006.c1.tag": "정면", "B006.c1.text": "정면으로 맞붙는다", "B006.c1.o0": ["정면으로 맞붙었다.", "", "마철의 목검이 **무겁게** 떨어졌다. 막을 때마다 팔이 저렸다.", "세 번째 합에, **목검을 놓쳤다**.", "", "마철이 손을 내밀었다.", "\"…다음 보름에, 또 해.\""], "B006.c1.o1": ["정면으로 맞붙었다.", "", "천. 마철의 목검을 위로 걷어 올렸다.", "지. 발목을 쓸었다.", "**인.** 목검 끝이, 마철의 가슴 앞에서 **멈췄다**.", "", "마당이 **조용해졌다**.", "엄 관주가 짧게 말했다.", "\"…정식 제자다.\"", "", "마철이 한참 나를 보다가, **처음으로 웃었다**."], "B006.c2.tag": "묘수", "B006.c2.text": "마철의 버릇을 노린다", "B006.c2.o0": ["마철은 크게 휘두르기 전에, 늘 **왼발을 끌었다**.", "", "왼발이 끌리는 순간, 파고들었다.", "목검 끝이 마철의 손목을 쳤다. 목검이 **날아갔다**.", "", "수련생들이 **함성을 질렀다**.", "\"…정식 제자다.\""], "B007.title": "진호의 빚", "B007.desc": ["진호가 우물가에 쭈그려 앉아 있었다.", "", "\"…아버지 노름빚이야. 은자 세 냥.\"", "\"못 갚으면, 나 무관 그만두고 끌려가서 일해야 돼.\""], "B007.c1.tag": "갚음", "B007.c1.text": "내 돈으로 갚아 준다", "B007.c1.o0": ["전대를 털어, 은자 세 냥을 쥐여 주었다.", "", "진호가 한참 은자를 내려다보다가, **울었다**.", "\"…평생, 형이라고 부를게.\""], "B007.c2.tag": "찾아감", "B007.c2.text": "빚쟁이를 함께 찾아간다", "B007.c2.o0": ["진호와 함께 노름방을 찾아갔다.", "", "몽둥이가 **여섯**이었다.", "둘이서 실컷 얻어맞고, 쫓겨났다."], "B007.c2.o1": ["진호와 함께 노름방을 찾아갔다.", "", "\"빚은 갚겠소. 대신, 이자는 없던 걸로 합시다.\"", "몽둥이를 든 놈 하나의 손목을, **꺾었다**.", "", "노름방 주인이 **이자를 깎았다**. 진호가 나를 **멍하니** 보았다."], "B007.c3.tag": "관주", "B007.c3.text": "엄 관주에게 사정을 말한다", "B007.c3.o0": ["엄 관주에게 사정을 말했다.", "", "관주가 말없이 일어나, 어디론가 나갔다.", "", "다음 날, 진호의 빚 문서가 **불에 타 있었다**.", "관주는 아무것도 말하지 않았다."], "B008.title": "보호비", "B008.desc": ["녹풍채의 졸개 다섯이, 무관 마당에 들어섰다.", "", "\"이 고을 장사치들은 다 우리한테 **보호비**를 내지.\"", "\"무관이라고 다를 거 있나?\"", "", "엄 관주는, 장터에 나가고 없었다."], "B008.c1.tag": "막음", "B008.c1.text": "목검을 들고 앞을 막는다", "B008.c1.o0": ["목검을 들고 앞을 막았다.", "", "놈들은, **진검**이었다.", "**<red>목검이 동강 나고, 칼날이 들어왔다.<\/red>**"], "B008.c1.o1": ["목검을 들고 앞을 막았다.", "", "둘을 쓰러뜨렸다. 셋째의 칼등이, 내 옆머리를 쳤다.", "", "정신을 차렸을 때, 엄 관주가 돌아와 있었다.", "마당에 졸개 다섯이 **나란히 누워** 있었다."], "B008.c1.o2": ["목검을 들고 앞을 막았다.", "", "천. 지. 인.", "**흔해 빠진 삼재검법**에, 졸개 셋이 차례로 쓰러졌다.", "남은 둘이 **줄행랑**을 쳤다.", "", "수련생들이 **얼어붙은 채** 나를 보았다.", "장터에서 돌아온 엄 관주가, 마당을 한 번 둘러보더니 말했다.", "\"…삼재검법을, 제대로 썼군.\""], "B008.c2.tag": "돈", "B008.c2.text": "돈을 쥐여 보낸다", "B008.c2.o0": ["전대에서 은자를 꺼내, 놈들 손에 쥐여 주었다.", "", "놈들이 **휘파람**을 불며 나갔다.", "", "돌아온 엄 관주가 이야기를 듣고, 한참 **말이 없었다**."], "B008.c3.tag": "관주", "B008.c3.text": "장터로 달려가 관주를 부른다", "B008.c3.o0": ["뒷담을 넘어, 장터로 달렸다.", "", "엄 관주가 무관에 들어선 지, **차 한 잔** 마실 새도 되지 않았다.", "졸개 다섯이 마당에 **나란히 누웠다**.", "", "…저게, 사람이 할 수 있는 일인가."], "B009.title": "두 번째 벽", "B009.desc": ["단전이, 다시 **꽉 찼다**.", "", "삼류의 벽이 담장이었다면, 이번 벽은 **성벽**이었다.", "엄 관주가 말했다.", "\"그 벽 앞에서 늙어 죽는 놈이 태반이다.\""], "B009.c1.tag": "밀기", "B009.c1.text": "기운을 모아 벽을 민다", "B009.c1.o0": ["기운을 모아, 벽을 밀었다.", "", "**<red>벽이, 나를 밀어냈다.<\/red>**", "입에서 피가 넘어왔다."], "B009.c1.o1": ["기운을 모아, 벽을 밀었다.", "", "벽 너머에서, 무언가가 **열렸다**.", "", "**<gold>{이류}에 들었다.<\/gold>**", "", "무관 마당에 나서자, 수련생들이 **일제히 고개를 숙였다**.", "엄 관주가 오래 나를 보더니, 말했다.", "\"…내 뒤를, 맡길 놈이 생겼구나.\""], "B009.c2.tag": "다짐", "B009.c2.text": "서두르지 않고 기운을 다진다", "B009.c2.o0": ["벽을 밀지 않았다.", "대신, 단전의 기운을 **천천히 다졌다**."], "B011.title": "관주의 마당", "B011.desc": ["엄 관주의 걸음이, 눈에 띄게 **느려졌다**.", "", "어느 새벽, 관주가 나를 마루로 불렀다.", "목검 하나를 내밀었다. 내가 처음 무관에 들어온 날, 던져 주었던 그 목검이었다.", "", "\"…마당은, 이제 네가 쓸어라.\""], "B011.c1.tag": "받음", "B011.c1.text": "두 손으로 목검을 받는다", "B011.c1.o0": ["두 손으로 목검을 받았다.", "", "그날부터 새벽 마당의 구령은, **내 목소리**였다.", "수련생들이 일제히 **허리를 숙였다**."], "B011.c2.tag": "사양", "B011.c2.text": "아직 멀었다며 사양한다", "B011.c2.o0": ["\"…아직, 멀었습니다.\"", "", "관주가 처음으로, **소리 내어 웃었다**.", "\"그 말을 하는 놈이라 맡기는 거다.\""], "W010.title": "간판", "W010.desc": ["좌판이 가게가 되었다.", "가게 앞에, 새로 깎은 **간판**이 걸렸다.", "", "옆 좌판이던 아주머니가, 눈물을 훔쳤다.", "\"소리 지를 줄도 모르던 사람이…\""], "W010.c1.tag": "이름", "W010.c1.text": "간판에 내 이름을 새긴다", "W010.c1.o0": ["간판에, **내 이름**을 새겼다.", "", "이 세상에서 처음 남기는, 내 이름이었다."], "W010.c2.tag": "와우", "W010.c2.text": "간판에 와우촌의 이름을 새긴다", "W010.c2.o0": ["간판에 **'와우'** 두 글자를 새겼다.", "", "와우촌 사람들이 장에 올 때마다, 간판 앞에서 **어깨를 폈다**."], "W011.title": "장부", "W011.desc": ["촌장이 자리에서 일어나지 못하게 되었다.", "", "마을 사람들이 촌장의 집 앞에 모였다.", "촌장이 **장부**를 내밀었다. 손이 떨렸다.", "", "\"…자네가, 맡게.\""], "W011.c1.tag": "받음", "W011.c1.text": "장부를 받는다", "W011.c1.o0": ["장부를 받았다.", "", "마을 사람들이 **고개를 숙였다**.", "하늘에서 떨어진 놈에게, 와우촌이 고개를 숙였다."], "W011.c2.tag": "나눔", "W011.c2.text": "마을 사람들과 함께 맡자고 한다", "W011.c2.o0": ["\"혼자서는 못 합니다. 다 같이 하지요.\"", "", "촌장이 껄껄 웃었다.", "\"…그래서, 자네한테 맡기는 걸세.\""], "W012.title": "사라진 아이", "W012.desc": ["새벽, 마을이 **발칵 뒤집혔다**.", "", "\"소삼이가 없어! 우리 소삼이가!\"", "소삼 어머니가 맨발로 마당을 뛰어다녔다.", "", "소삼만이 아니었다. 아랫집 아이도, **둘이 함께** 사라졌다.", "", "마을 어귀 진흙 위에, **수레바퀴 자국**이 산길로 이어져 있었다."], "W012.c1.tag": "추격", "W012.c1.text": "바퀴 자국을 쫓아 산길로 달린다", "W012.c1.o0": ["바퀴 자국을 쫓아, 산길을 내달렸다."], "W012.c2.tag": "촌장", "W012.c2.text": "촌장에게 알려 장정들을 모은다", "W012.c2.o0": ["촌장에게 달려가, 장정들을 모았다.", "", "몽둥이와 횃불을 든 장정 열이 산길을 올랐다.", "해 질 녘, 버려진 수레를 찾았다.", "", "수레 안에 **소삼**이 묶여 있었다. 울지도 않고, 이를 악물고 있었다.", "", "아랫집 아이는, **없었다**.", "**<red>수레가 둘이었던 것이다.<\/red>**"], "W012.c3.tag": "관아", "W012.c3.text": "관아에 알리러 낙양으로 달린다", "W012.c3.o0": ["낙양 관아까지, 반나절을 달렸다.", "", "관리는 하품을 했다.", "\"애새끼 둘 없어진 걸로, 관병을 내라고?\"", "", "빈손으로 돌아온 와우촌은, **조용했다**.", "소삼의 집 앞에서, 소삼 어머니가 땅바닥에 주저앉아 있었다.", "", "**<red>소삼은, 돌아오지 않았다.<\/red>**"], "W012B.title": "인신매매단", "W012B.desc": ["산 중턱, 수레 한 대가 쉬고 있었다.", "", "사내 셋. 하나는 오줌을 누고, 둘은 육포를 씹고 있었다.", "수레 덮개 아래로, **작은 발 네 개**가 비어져 나와 있었다."], "W012B.c1.tag": "밧줄", "W012B.c1.text": "몰래 다가가 아이들의 밧줄을 끊는다", "W012B.c1.o0": ["수레 뒤로 기어갔다. 칼 대신 깨진 사금파리로, 밧줄을 긁었다.", "", "\"뭐야, 너!\"", "**<red>육포를 씹던 사내의 칼이, 등 뒤에서 들어왔다.<\/red>**"], "W012B.c1.o1": ["수레 뒤로 기어갔다. 칼 대신 깨진 사금파리로, 밧줄을 긁었다.", "", "들켰다. 사내들이 덤벼들었다.", "소삼을 들쳐 업고, 다른 아이 손을 끌고, **산비탈을 굴렀다**.", "", "피투성이로 마을 어귀에 닿았을 때, 아이들은 **둘 다 살아 있었다**."], "W012B.c1.o2": ["수레 뒤로 기어갔다. 칼 대신 깨진 사금파리로, 밧줄을 긁었다.", "", "밧줄이 끊어졌다. 소삼이 눈을 크게 떴다. 입술에 손가락을 댔다.", "", "두 아이의 손을 잡고, **소리 없이** 덤불로 사라졌다.", "", "마을 어귀에서, 소삼 어머니가 **무너지듯** 아이를 끌어안았다.", "마을 사람들이 나를 둘러싸고, **아무 말도 하지 못했다**."], "W012B.c2.tag": "불", "W012B.c2.text": "라이터로 수레 덮개에 불을 붙인다", "W012B.c2.o0": ["딸깍.", "덮개 끝에 불이 옮겨붙었다. 말이 **비명을 지르며** 날뛰었다.", "", "\"불이다!\"", "사내들이 불을 끄는 사이, 아이 둘을 끌어냈다.", "", "돌아보니, 수레가 **통째로 타오르고** 있었다.", "소삼이 내 옷자락을 붙잡고 중얼거렸다.", "\"갑자기 불이 어디서… 아저씨, 사실은 진짜 요괴지?\""], "W012B.c4.tag": "삼재", "W012B.c4.text": "사내의 허리에서 칼을 빼앗는다", "W012B.c4.o0": ["오줌 누던 사내의 허리에서, 칼을 **뽑아 들었다**.", "", "손이, 칼자루를 **먼저 알아보았다**. 천. 지. 인.", "세 사내가 차례로 칼을 놓쳤다.", "", "아이들의 밧줄을 끊고 돌아서자, 사내들은 이미 **산 아래로 도망치고** 있었다.", "소삼이 입을 벌린 채 나를 올려다보았다.", "\"…아저씨, 그거 어디서 배웠어?\"", "\"…글쎄.\""], "W013.title": "누명", "W013.desc": ["개울가에서, **박 서방**이 죽은 채 발견되었다.", "옆구리에 칼자국. 피는 이미 굳어 있었다.", "", "그리고 내 헛간에서, **피 묻은 낫**이 나왔다.", "", "사람들이 몽둥이를 들고 몰려왔다.", "\"외지 놈이 결국…!\""], "W013.c1.tag": "사흘", "W013.c1.text": "진범을 찾겠다며 사흘을 달라고 한다", "W013.c1.o0": ["\"사흘만 주십시오. 진짜 범인을 찾겠습니다.\"", "", "사람들이 웅성거렸다.", "촌장이 한참 나를 보다가, 고개를 끄덕였다.", "\"사흘이네. 못 찾으면, 이 마을을 떠나게.\""], "W013.c2.tag": "영감", "W013.c2.text": "우 영감 뒤에 선다", "W013.c2.o0": ["우 영감이 지팡이를 짚고, 내 앞에 섰다.", "\"이놈은 내가 거둔 놈이다. 내 목을 먼저 쳐라.\"", "", "몽둥이들이 **내려갔다**.", "하지만 그날부터, 마을 사람들은 내 눈을 **피했다**."], "W013.c3.tag": "달아남", "W013.c3.text": "밤을 틈타 달아난다", "W013.c3.o0": ["그날 밤, 헛간 뒷벽을 뜯고 빠져나왔다.", "", "등 뒤에서, 횃불이 줄지어 산길을 올라왔다.", "\"살인자가 도망쳤다!\"", "", "와우촌의 불빛이, **점점 작아졌다**."], "W013.c4.tag": "덮어씌움", "W013.c4.text": "낫을 떠돌이 땜장이의 짐에 넣는다", "W013.c4.o0": ["그날 밤, 장터에서 온 **땜장이의 짐** 속에 낫을 밀어 넣었다.", "", "이튿날, 낫을 찾아낸 사람은 **소삼**이었다.", "\"…형, 어젯밤에 땜장이 짐 앞에서 뭐 했어?\"", "", "몽둥이들이, 다시 **내 쪽으로** 돌아섰다."], "W013.c4.o1": ["그날 밤, 장터에서 온 **땜장이의 짐** 속에 낫을 밀어 넣었다.", "", "이튿날, 땜장이는 몽둥이에 쫓겨 **마을을 떠났다**. 끝까지 아니라고 울부짖었다.", "사람들이 내게 머쓱하게 사과했다.", "", "…노름빚에 쪼들리던 **곽 씨**만은, 그 뒤로도 나를 보며 **웃었다**."], "W013B.title": "사흘", "W013B.desc": ["사흘.", "박 서방의 시체는 아직, 마을 사당에 누워 있었다."], "W013B.c1.tag": "상처", "W013B.c1.text": "시체의 상처를 다시 살핀다", "W013B.c1.o0": ["상처를 들여다보았다. 아무것도 알아낼 수 없었다.", "", "사흘째 저녁, 촌장이 고개를 저었다.", "\"…떠나게.\""], "W013B.c1.o1": ["상처를 들여다보았다.", "칼자국이 **오른쪽 옆구리**, 아래에서 위로 비스듬히.", "", "…추리 소설에서 수없이 읽은 장면이었다.", "**찌른 놈은, 왼손잡이다.**", "", "마을에 왼손잡이는 셋. 그중 하나, 노름빚에 쪼들리던 **곽 씨**의 소매에서 **박 서방의 엽전 꾸러미**가 나왔다.", "", "몽둥이를 들었던 사람들이, **하나씩 내 앞에서 고개를 숙였다**."], "W013B.c2.tag": "장부", "W013B.c2.text": "노름방 장부를 뒤진다", "W013B.c2.o0": ["장터 고을 노름방에 숨어들었다.", "장부를 펼치기도 전에, 몽둥이에 쫓겨났다.", "", "사흘이, 지나 버렸다."], "W013B.c2.o1": ["장터 고을 노름방에 숨어들었다.", "장부 맨 끝, 박 서방에게 빌린 돈 **은자 두 냥**. 빌린 사람은 **곽 씨**였다.", "", "장부를 촌장 앞에 내던졌다.", "곽 씨가 **무릎을 꿇었다**."], "W013B.c3.tag": "함정", "W013B.c3.text": "범인을 꾀어낼 소문을 낸다", "W013B.c3.o0": ["\"박 서방이 죽기 전에, 범인 이름을 땅에 써 두었다더라.\"", "", "소문을 내고, 개울가 덤불에 숨었다.", "", "자정 무렵, 누군가 **땅을 긁으러** 왔다.", "횃불을 들이대자, **곽 씨**의 얼굴이 드러났다.", "", "덤불에 함께 숨어 있던 장정들이, **입을 다물지 못했다**.", "\"…하늘에서 떨어진 놈이, 머리는 귀신이구먼.\""], "W014.title": "혼례 잔치", "W014.desc": ["대장장이네 아들이 **장가를 갔다**.", "온 마을이 대장간 앞마당에 모였다.", "", "붉은 비단, 꽹과리 소리, 국수 냄새."], "W014.c1.tag": "초", "W014.c1.text": "떡에 초를 꽂아 축하한다", "W014.c1.o0": ["떡 한가운데에, 가는 초를 꽂았다.", "딸깍. 라이터로 불을 붙였다.", "", "\"자, 신랑 신부가 같이 **후 하고 부는 겁니다**.\"", "", "신랑 신부가 영문도 모른 채 불을 껐다.", "마을 사람들이 **와 하고 박수를 쳤다**.", "그날부터 와우촌 혼례에는, **떡에 초를 꽂는 풍습**이 생겼다."], "W014.c2.tag": "춤", "W014.c2.text": "향아의 손을 잡고 춤판에 끼어든다", "W014.c2.o0": ["향아의 손을 잡고, 춤판에 끼어들었다.", "", "발이 꼬였다. 향아가 **소리 내어 웃었다**.", "마을 아낙들이 손뼉을 치며 **수군거렸다**.", "\"다음 잔치는, 저 둘이겠구먼.\""], "W014.c3.tag": "부부", "W014.c3.text": "향아와 나란히 앉아 신랑 신부를 본다", "W014.c3.o0": ["향아와 나란히 앉아, 신랑 신부를 보았다.", "", "향아가 내 손을 슬쩍 잡았다.", "\"…우리 때보다, 국수가 짜네요.\""], "W014.c4.tag": "술", "W014.c4.text": "신랑 친구들과 술 대작을 한다", "W014.c4.o0": ["신랑 친구들과 사발로 술을 들이켰다.", "", "눈을 떠 보니, **헛간**이었다."], "W014.c4.o1": ["신랑 친구들과 사발로 술을 들이켰다.", "", "새벽녘, 마당에 서 있는 건 **나 하나**뿐이었다.", "대장장이가 내 어깨를 두드렸다.", "\"자네, 술은 장사로구먼.\""], "W031.title": "손가락질", "W031.desc": ["우물가를 지나는데, 빨래하던 아낙들의 말이 **뚝** 끊겼다.", "", "등 뒤에서, 다시 소리가 났다.", "\"…저 사람이야.\"", "\"하늘에서 떨어졌다더니, 하는 짓은 땅에서 굴러먹던 놈이네.\""], "W031.c1.tag": "모른척", "W031.c1.text": "못 들은 척 지나간다", "W031.c1.o0": ["못 들은 척 지나갔다.", "", "저녁밥이 **유난히 쓸었다**."], "W031.c2.tag": "맞받음", "W031.c2.text": "돌아서서 아낙들을 노려본다", "W031.c2.o0": ["돌아서서, 아낙들을 노려보았다.", "", "아낙들이 빨랫감을 챙겨 **흩어졌다**.", "그날 밤, 헛간 지붕에 **돌이 날아들었다**."], "W031.c3.tag": "사과", "W031.c3.text": "\"제가 잘못했습니다.\" 하고 고개를 숙인다", "W031.c3.o0": ["\"…제가 잘못했습니다.\"", "", "아낙들이 서로 얼굴을 보았다.", "한참 뒤, 가장 나이 든 아낙이 혀를 찼다.", "\"알면 됐수. 사람이, 한 번은 그럴 수 있지.\""], "W015.title": "산적의 제안", "W015.desc": ["장터에서 돌아오는 길, 고갯마루 바위에 **칼 찬 사내**가 걸터앉아 있었다.", "얼굴에 길게 칼자국. 허리에 **초록 띠**.", "", "\"네 소문은 들었다.\"", "\"마을 놈들 등쳐 먹는 재주가 있다며.\"", "", "사내가 품에서 **은자 한 냥**을 꺼내 바위에 올려놓았다.", "\"보름 뒤 그믐밤. 와우촌 어느 집 곳간이 두둑한지, 길만 알려 다오. 몫은 따로 챙겨 주지.\"", "", "**녹풍채**였다."], "W015.c1.tag": "받음", "W015.c1.text": "은자를 집어 든다", "W015.c1.o0": ["은자를 집어 들었다.", "", "사내가 이를 드러내고 웃었다.", "\"그믐밤, 개울 건너 물방앗간.\""], "W015.c2.tag": "거절", "W015.c2.text": "\"사람 잘못 보셨소.\" 하고 지나친다", "W015.c2.o0": ["\"사람 잘못 보셨소.\"", "", "사내가 은자를 도로 품에 넣었다.", "\"생각 바뀌면, 고갯마루에 **초록 천**을 매달아 둬라.\""], "W015.c3.tag": "알림", "W015.c3.text": "마을로 내달려 촌장에게 알린다", "W015.c3.o0": ["마을로 내달려, 촌장에게 알렸다.", "", "그믐밤, 장정들이 횃불을 들고 고개를 지켰다.", "산적들은 **내려오지 않았다**.", "", "촌장이 처음으로 내 어깨를 두드렸다.", "\"…자네를, 내가 잘못 봤나 보군.\"", "", "고갯마루 바위에, **초록 천에 싼 죽은 쥐**가 놓여 있었다."], "W016.title": "그믐밤", "W016.desc": ["그믐밤. 달이 없었다.", "", "물방앗간 그늘에서, 산적 열댓이 **숨을 죽이고** 있었다.", "칼자국 사내가 턱짓했다.", "\"앞장서라.\"", "", "와우촌 쪽에서, **개 한 마리가 짖었다**."], "W016.c1.tag": "앞장", "W016.c1.text": "앞장서서 곳간까지 길을 잡는다", "W016.c1.o0": ["앞장섰다.", "", "곳간 문이 부서지고, 쌀가마가 산으로 올라갔다.", "새벽, 마을은 **울음소리**로 깼다.", "", "산으로 오르는 길에, 칼자국 사내가 내 어깨를 쳤다.", "\"돌아가 봐야 맞아 죽을 테니, 따라와라. 두목님이 한번 보자신다.\""], "W016.c2.tag": "헛길", "W016.c2.text": "일부러 엉뚱한 골짜기로 이끈다", "W016.c2.o0": ["산적들을 끌고, 엉뚱한 골짜기로 들어섰다.", "", "골짜기 끝은 **막다른 절벽**이었다.", "칼자국 사내가 천천히 칼을 뽑았다.", "\"…길을 모르는 놈은 아니었는데.\"", "", "**<red>달 없는 밤이, 더 어두워졌다.<\/red>**"], "W016.c2.o1": ["산적들을 끌고, 엉뚱한 골짜기로 들어섰다.", "", "골짜기를 두 번 헤매는 사이, 마을 개들이 **한꺼번에 짖었다**. 횃불이 하나둘 켜졌다.", "", "\"…젠장. 날 샜다.\"", "산적들이 산으로 물러갔다. 칼자국 사내가, 돌아서기 전에 나를 **오래** 보았다.", "", "은자 한 냥은, 그대로 내 품에 남았다."], "W016.c3.tag": "돌아섬", "W016.c3.text": "\"배가 아파서…\" 하며 헛간으로 돌아간다", "W016.c3.o0": ["\"…배가 아파서.\"", "", "헛간으로 돌아와, 이불을 머리끝까지 덮었다.", "", "새벽, 마을은 **울음소리**로 깼다. 곳간 세 채가 비어 있었다.", "", "누군가 그믐밤 물방앗간 쪽에서, **내 뒷모습**을 보았다고 했다."], "W017.title": "장부의 구멍", "W017.desc": ["장부를 맞추다가, 손이 멈췄다.", "", "마을 **곗돈**에서, **은자 세 냥**이 비었다.", "돈궤 열쇠는, 촌장과 나 둘만 가지고 있었다.", "", "그날 밤, 촌장이 술병을 들고 헛간으로 왔다.", "한참을 말없이 마시다가, 입을 열었다.", "\"…손자 놈이 열병이 났네. 의원이 인삼을 써야 산다더군.\"", "\"가을걷이 끝나면, 한 푼 안 틀리고 채워 넣겠네.\"", "", "촌장이 **처음으로**, 내게 고개를 깊이 숙였다.", "\"이번 한 번만, 못 본 걸로 해 주게.\""], "W017.c1.tag": "모른척", "W017.c1.text": "장부를 덮는다", "W017.c1.o0": ["장부를 덮었다.", "\"…저는 아무것도 못 봤습니다.\"", "", "촌장이 내 손을 **두 손으로** 잡았다.", "", "가을걷이가 끝나고, 곗돈은 **한 푼 안 틀리고** 채워졌다.", "손자는, 살았다."], "W017.c2.tag": "고발", "W017.c2.text": "마을 사람들 앞에 장부를 펼친다", "W017.c2.o0": ["이튿날, 마을 공터에서 장부를 펼쳤다.", "", "웅성거림. 촌장의 얼굴이 **흙빛**이 되었다.", "촌장은 변명하지 않았다. 열쇠를 내려놓고, 돌아섰다.", "", "새 촌장이 섰다. 사람들은 나를 **바른 사람**이라 불렀다.", "…그 말에는, **거리**가 묻어 있었다.", "", "보름 뒤, 촌장의 손자가 **숨을 거두었다**는 말이 들렸다."], "W017.c3.tag": "협박", "W017.c3.text": "\"입막음 값은 받아야겠습니다.\" 하고 손을 내민다", "W017.c3.o0": ["\"입막음 값은, 받아야겠습니다.\"", "", "촌장의 눈빛이 **식었다**.", "", "이튿날, 촌장이 마을 사람들을 불러 모았다.", "\"곗돈이 비었네. 열쇠는 나와 **저 사람**, 둘뿐이지.\"", "", "몽둥이를 든 사람들이, 나를 보았다.", "장부를 아는 사람은, 이 마을에 **촌장과 나뿐**이었다."], "W017.c3.o1": ["\"입막음 값은, 받아야겠습니다.\"", "", "촌장의 손이 떨렸다.", "한참 뒤, 촌장이 품에서 **은자 한 냥**을 꺼내 놓았다.", "\"…이게 다일세.\"", "", "그 뒤로 촌장은, 나를 보면 **길을 돌아서** 갔다."], "W018.title": "아궁이 밑 단지", "W018.desc": ["새벽, 물을 길어 오다 부엌 문틈으로 보았다.", "", "우 영감이 아궁이 옆 흙바닥을 **긁어내고** 있었다.", "흙 속에서 작은 **단지**가 나왔다. 영감이 단지를 기울이자, 은자가 **짤랑** 소리를 냈다.", "", "영감이 은자를 한 닢씩 세며 중얼거렸다.", "\"…이만하면, 그놈 장가 밑천은 되겠지.\"", "", "영감은 단지를 도로 묻고, 흙을 **발로 다졌다**."], "W018.c1.tag": "훔침", "W018.c1.text": "영감이 잠든 밤, 단지를 파낸다", "W018.c1.o0": ["영감이 잠든 밤, 아궁이 옆 흙을 긁어냈다.", "단지를 꺼내 드는데, 등 뒤에서 **기침 소리**가 났다.", "", "등잔을 든 영감이, 문간에 서 있었다.", "", "영감은 소리치지 않았다.", "한참 나를 보다가, 내 보따리를 **마당에 내놓았다**.", "\"…날 밝기 전에, 가거라.\"", "", "그 목소리가, 몽둥이보다 **아팠다**."], "W018.c1.o1": ["영감이 잠든 밤, 아궁이 옆 흙을 긁어냈다.", "단지에서 은자를 꺼내고, 흙을 **꼭 그대로** 다져 두었다.", "", "…며칠 뒤, 영감이 새벽 부엌에 오래 앉아 있었다.", "빈 단지를 무릎에 올려 둔 채.", "", "영감은 끝내, **아무 말도 하지 않았다**.", "그 뒤로 영감은 내게, 술을 권하지 않았다."], "W018.c2.tag": "모른척", "W018.c2.text": "못 본 척 물동이를 내려놓는다", "W018.c2.o0": ["못 본 척, 물동이를 내려놓았다.", "", "영감이 부엌에서 나오며 헛기침을 했다.", "\"…일찍 일어났구나.\"", "\"예. 물이 차가워서요.\""], "W018.c3.tag": "일러줌", "W018.c3.text": "\"거기 두면 도둑이 먼저 찾습니다.\" 하고 일러 준다", "W018.c3.o0": ["\"…영감님. 거기 두면, 도둑이 **제일 먼저** 찾습니다.\"", "", "영감이 화들짝 놀라 돌아보았다. 얼굴이 붉어졌다가, 이내 **허허** 웃었다.", "\"그럼 어디 두랴.\"", "", "둘이서 쇠죽 끓이는 솥 밑, 돌 하나를 들어내고 단지를 넣었다.", "", "영감이 흙 묻은 손을 털며 말했다.", "\"…그놈 얘기, 들려준 적 있던가.\"", "그날 아침, 처음으로 **떠나간 아들** 이야기를 끝까지 들었다."], "W030.title": "쫓겨나다", "W030.desc": ["새벽, 헛간 문이 **발길에 걷어차였다**.", "", "마을 사내들이 몽둥이를 들고 서 있었다.", "맨 앞의 사내가, 내 보따리를 마당에 내던졌다.", "", "\"해 뜨기 전에 나가.\"", "\"다시 이 마을에 발 들이면, 그땐 **다리를 분질러** 놓을 테니.\""], "W030.c1.tag": "떠남", "W030.c1.text": "보따리를 주워 들고 떠난다", "W030.c1.o0": ["보따리를 주워 들었다.", "", "아무도, 배웅하지 않았다.", "개 한 마리만, 마을 어귀까지 **따라오다** 돌아갔다."], "W030.c2.tag": "버팀", "W030.c2.text": "\"증거 있으면 대 보시오.\" 하고 버틴다", "W030.c2.o0": ["\"증거 있으면, 대 보시오.\"", "", "대답 대신, **몽둥이**가 날아왔다.", "", "정신이 들었을 때, 나는 마을 어귀 **돌다리 밑**에 버려져 있었다."], "W030.c3.tag": "산채", "W030.c3.text": "고갯마루 녹풍채를 찾아간다", "W030.c3.o0": ["보따리를 메고, 마을 반대편 고갯마루로 올랐다.", "", "바위에 걸터앉아 있던 칼자국 사내가, 나를 보고 웃었다.", "\"결국 왔군. 마을 놈들한테 쫓겨났나?\"", "\"따라와. 두목님 앞에서, 밥값을 증명해야 할 거다.\""], "W020.title": "떠나는 길", "W020.desc": ["와우촌 어귀의 돌다리.", "돌아보면, **누운 소의 등허리** 같은 뒷산이 보였다.", "", "앞에는, 낙양으로 가는 큰길이 뻗어 있었다."], "W020.c1.tag": "낙양", "W020.c1.text": "낙양 쪽 큰길로 걷는다", "W020.c1.o0": ["낙양 쪽으로 걸었다.", "**사람이 많은 곳**이라면, 내 자리 하나쯤은 있겠지."], "W020.c2.tag": "숭산", "W020.c2.text": "숭산 쪽 산길로 걷는다", "W020.c2.o0": ["숭산 쪽으로 걸었다.", "산 위에는 **스님들이 무공을 한다**고 했다."], "W020.c3.tag": "뒤돌아봄", "W020.c3.text": "마지막으로 마을을 오래 돌아본다", "W020.c3.o0": ["마을을, 오래 돌아보았다.", "", "헛간 지붕. 우물. 정자.", "**두 번 다시 보지 못할 것들**이었다."], "W021.title": "길 위에서", "W021.desc": ["길은 길었다.", "", "해가 지고, 뜨고, 또 졌다.", "객잔 처마 밑에서 잤다. 남의 밭일을 거들고 밥을 얻었다.", "", "어느 고갯마루에서, 칼 찬 **낭인** 셋이 길을 막았다.", "\"가진 거 내놔.\""], "W021.c1.tag": "내줌", "W021.c1.text": "가진 것을 다 내준다", "W021.c1.o0": ["전대를 통째로 던져 주었다.", "낭인들이 낄낄대며 길을 비켰다.", "", "그 뒤로도 여러 해, **길을 걸었다**.", "어디에도 오래 머물지 않았다.", "", "**<gold>수명이 다했다.<\/gold>**"], "W021.c2.tag": "싸움", "W021.c2.text": "돌을 쥐고 맞선다", "W021.c2.o0": ["돌을 쥐고, 앞의 낭인에게 덤벼들었다.", "", "**<red>칼이, 돌보다 빨랐다.<\/red>**"], "W021.c2.o1": ["돌을 쥐고, 앞의 낭인에게 덤벼들었다.", "돌이 낭인의 이마를 깼다. 나머지 둘이 **주춤했다**.", "그 틈에 고갯마루를 넘어 달렸다.", "", "그 뒤로도 여러 해, **길을 걸었다**.", "길 위에서 만난 사람들은, 나를 **돌팔매 나그네**라 불렀다.", "", "**<gold>수명이 다했다.<\/gold>**"], "W021.c3.tag": "말", "W021.c3.text": "\"나도 갈 곳 없는 놈이오.\" 하고 말을 건다", "W021.c3.o0": ["\"나도, 갈 곳 없는 놈이오.\"", "", "낭인 하나가 나를 한참 보더니, 칼을 거두었다.", "\"…같이 가든가.\"", "", "그 뒤로도 여러 해, 낭인들과 **길을 걸었다**.", "무공은 끝내 배우지 못했다. 대신, 밥 짓는 솜씨는 셋 중 최고였다.", "", "**<gold>수명이 다했다.<\/gold>**"], "W021.c4.tag": "삼재", "W021.c4.text": "앞선 낭인의 칼을 빼앗는다", "W021.c4.o0": ["앞선 낭인의 손목을 쳐, 칼을 **빼앗았다**.", "왜인지 모르게, **다음 수가 보였다**. 천. 지. 인.", "", "낭인 셋이 칼을 거두고, 한 걸음씩 물러섰다.", "\"…어느 문파 사람이오?\"", "\"문파는 없소.\"", "", "그 뒤로도 여러 해, **길을 걸었다**.", "길에서 마주친 사람들은, 흔해 빠진 검법을 쓰는 이상한 나그네를 오래 이야기했다.", "", "**<gold>수명이 다했다.<\/gold>**"], "B012.title": "진호와의 밤", "B012.desc": ["모두 잠든 밤, 마당에서 **목검 소리**가 났다.", "진호였다.", "", "\"…낮에 너무 뒤처져서.\"", "진호가 머쓱하게 웃었다."], "B012.c1.tag": "대련", "B012.c1.text": "삼재검법으로 맞대련을 한다", "B012.c1.o0": ["달빛 아래, 진호와 목검을 맞댔다.", "천. 지. 인. 막고, 쓸고, 찔렀다.", "", "새벽닭이 울 때까지, **백 합**을 넘겼다.", "진호가 땀을 훔치며 웃었다.", "\"…내일도, 할래?\""], "B012.c2.tag": "숨", "B012.c2.text": "나란히 앉아 토납을 한다", "B012.c2.o0

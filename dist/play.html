<style>
/* 한밤 산중의 먹빛 한 장. 좁은 세로 두루마리 한 줄, 위에는 생(生)과 업, 그 아래 몸 상태, 본문은 장면이 쌓이며 흘러내린다. */
:root {
  --ink: #12151b;
  --ink-2: #1a1e26;
  --line: #2c3240;
  --paper: #eee9dd;
  --muted: #aaa69b;
  --accent: #c8a35a;
  --red: #e0675c;
  --violet: #b58ee0;
  --jade: #72c29d;
  --gold: #e8c26e;
  --f-display: "Song Myung", "Noto Serif KR", serif;
  --f-body: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --log-h: 132px;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--paper); }
body { font-family: var(--f-body); font-weight: 500; font-size: var(--fs, 17px); line-height: 1.85; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--log-h) + 48px); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ink); border-bottom: 1px solid var(--line); padding-block: 12px 10px; display: grid; gap: 10px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-ui); }
#life { font-family: var(--f-display); font-size: 22px; color: var(--accent); letter-spacing: 0.06em; }
.bar-r { display: flex; gap: 14px; align-items: baseline; }
#toMenu { font-family: var(--f-ui); font-size: 12px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 2px 10px; }
#toMenu:hover, #toMenu:focus-visible { color: var(--paper); border-color: var(--muted); outline: none; }
#karma { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
#stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); }
.stat { display: grid; gap: 0; text-align: center; padding-block: 4px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.stat b { font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat.realm b { color: var(--accent); }
#items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-ui); font-size: 12px; }
#items li { border: 1px solid var(--line); border-radius: 2px; padding: 1px 8px; color: var(--paper); }
#items li.none { color: var(--muted); border-style: dashed; }

#stage { display: grid; gap: 28px; padding-top: 28px; }
.scene h2, .ending h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0 0 14px; letter-spacing: 0.04em; text-wrap: balance; }
.prose p { margin: 0 0 1.1em; }
.prose strong { font-weight: 700; color: #f1ecdf; }
.term { border-bottom: 1px dotted currentColor; text-underline-offset: 3px; cursor: help; }
.term:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.gloss { position: fixed; z-index: 10; max-width: min(300px, calc(100vw - 24px)); background: #262b36; border: 1px solid var(--accent); border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px; font-family: var(--f-ui); font-size: 14px; line-height: 1.6; color: var(--paper); box-shadow: 0 6px 20px rgba(0,0,0,0.45); pointer-events: none; }
.gloss b { color: var(--accent); font-weight: 500; }
.c-red { color: var(--red); } .c-purple { color: var(--violet); } .c-green { color: var(--jade); } .c-gold { color: var(--gold); }

.choices { display: grid; gap: 8px; margin-top: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.choice { display: flex; gap: 10px; align-items: baseline; text-align: left; width: 100%; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 11px 14px; font-family: var(--f-ui); font-size: 16px; line-height: 1.5; transition: border-color .15s, background .15s, opacity .2s; }
.choice .num { color: var(--muted); font-size: 13px; min-width: 1em; font-variant-numeric: tabular-nums; }
.choice .tag { color: var(--accent); white-space: nowrap; font-weight: 500; }
.choice .txt { min-width: 0; }
.choice.earned { border-style: dashed; border-color: #6d5a33; }

.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--accent); background: #20252f; outline: none; }
.choice:disabled { cursor: default; }
.choice.picked { border-color: var(--accent); background: #262b35; box-shadow: inset 0 0 0 1px var(--accent); }
.choice.picked .num { color: var(--accent); }
.choice.dim { opacity: 0.45; }
.scene > .next { margin-top: 14px; }

.outcome { border-left: 1px solid var(--line); padding-left: 16px; margin-top: 22px; scroll-margin-top: 160px; }
.next kbd { font-family: var(--f-ui); font-size: 11px; margin-left: 10px; opacity: 0.7; letter-spacing: 0; }

.logbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--ink-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.logbox .in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.logbox h3 { margin: 0 0 4px; font-family: var(--f-ui); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; }
#log { list-style: none; margin: 0; padding: 0; max-height: calc(var(--log-h) - 30px); overflow-y: auto; font-family: var(--f-ui); font-size: 13px; line-height: 1.7; }
#log li { display: flex; flex-wrap: wrap; gap: 2px 8px; }
#log li:first-child { color: var(--paper); }
#log li:not(:first-child) { opacity: 0.7; }
#log .t { color: var(--paper); }
#log .g { color: var(--accent); }
#log .up { color: var(--jade); } #log .down { color: var(--red); }
#log li.empty { color: var(--muted); opacity: 1; }
.changes { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-ui); font-size: 14px; }
.changes .up { color: var(--jade); } .changes .down { color: var(--red); }
.next { font-family: var(--f-ui); font-size: 15px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 8px 22px; letter-spacing: 0.1em; }
.next:hover:not(:disabled), .next:focus-visible { background: var(--accent); color: var(--ink); outline: none; }

.ending { border-top: 1px solid var(--line); padding-top: 22px; }

.karma { font-family: var(--f-ui); margin: 0 0 16px; display: grid; gap: 4px; max-width: 320px; }

.ach { font-family: var(--f-ui); font-size: 14px; color: var(--gold); }
#loading { color: var(--muted); font-family: var(--f-ui); }

#screen { padding-block: 48px 64px; }
.mast { display: grid; gap: 6px; margin-bottom: 40px; }
.eyebrow { margin: 0; font-family: var(--f-ui); font-size: 12px; letter-spacing: 0.3em; color: var(--muted); }
.mast h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 72px; line-height: 1.1; letter-spacing: 0.12em; color: var(--paper); }
.sub { margin: 0; font-family: var(--f-ui); font-size: 14px; color: var(--muted); }
.sub b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
.menu-list { display: grid; gap: 2px; max-width: 360px; }
.menu-item { display: grid; grid-template-columns: 1.6em 1fr; align-items: baseline; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 14px 4px; font-family: var(--f-ui); }
.menu-item .num { color: var(--muted); font-size: 13px; }
.menu-item .lbl { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.08em; }

.sub-screen h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0 0 8px; letter-spacing: 0.08em; }
.sub-screen .big { font-family: var(--f-display); font-size: 64px; color: var(--accent); margin: 8px 0 0; line-height: 1.1; font-variant-numeric: tabular-nums; }

.tab { font-family: var(--f-ui); font-size: 14px; background: none; border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.tab small { font-size: 11px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.tab:focus-visible { outline: 1px solid var(--accent); }

.ach-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 0; }

.ach-list b { font-weight: 500; color: var(--muted); }

.set-row { display: grid; gap: 10px; padding: 20px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.set-lbl { font-size: 15px; }
.set-note { margin: 0; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn, .wipe { font-family: var(--f-ui); font-size: 14px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 14px; }
.seg-btn.on { border-color: var(--accent); color: var(--accent); }
.seg-btn:focus-visible, .wipe:focus-visible { outline: 1px solid var(--accent); }
.wipe { justify-self: start; color: var(--red); }
.wipe.armed { background: var(--red); color: var(--ink); border-color: var(--red); }
.wipe:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 480px) {
  .mast h1 { font-size: 56px; }
  #stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

찌른다.", "침이 고인다.", "", "하지만 **처음 보는 열매다.**"], "D001.c1.tag": "포식", "D001.c1.text": "먹는다", "D001.c1.o0": ["한 입. 또 한 입.", "달다. 미치도록 달다.", "", "그런데 혀끝이 저려온다.", "곧이어 목구멍이 타들어 간다.", "", "**<purple>독이다.<\/purple>**"], "D001.c1.o1": ["열매가 혀에 닿자마자 녹아내린다.", "뜨거운 기운이 배꼽 아래로 퍼진다.", "", "온몸의 뼈마디가 **우두둑** 소리를 낸다.", "", "**<gold>{영과}(靈果)였다.<\/gold>**"], "D001.c1.o2": ["한 입. 또 한 입.", "달다. 미치도록 달다.", "", "정신없이 먹고 나니 **배가 든든하다.**"], "D001.c2.tag": "시식", "D001.c2.text": "조금만 맛본다", "D001.c2.o0": ["혀끝이 살짝 저린다.", "급히 뱉어냈다.", "", "**<purple>독이 있었다.<\/purple>** 조금만 먹길 다행이다."], "D001.c2.o1": ["새콤하고 달다.", "몇 알 더 따서 먹었다.", "", "**허기가 조금 가셨다.**"], "D001.c3.tag": "인내", "D001.c3.text": "먹지 않는다", "D001.c3.o0": ["모르는 건 입에 대지 않는다.", "배를 움켜쥐고 걸음을 옮긴다."], "D001.c4.tag": "경험", "D001.c4.text": "짐승이 먹던 것을 골라 먹는다", "D001.c4.o0": ["아까 산토끼가 먹던 그 열매다.", "짐승이 먹는 건 사람도 먹을 수 있다.", "", "**안심하고 배를 채웠다.**"], "D002.title": "맑은 샘물", "D002.desc": ["목이 타들어 간다.", "입술이 갈라져 피 맛이 난다.", "", "졸졸.", "물소리다.", "", "바위틈에서 **맑은 샘물**이 솟고 있다.", "", "그런데 샘 주변에", "**<red>짐승 뼈가 흩어져 있다.<\/red>**"], "D002.c1.tag": "해갈", "D002.c1.text": "엎드려 마신다", "D002.c1.o0": ["정신없이 물을 들이켠다.", "", "등 뒤에서 낮은 그르렁 소리.", "돌아보니 **<red>누런 눈<\/red>**이 번뜩인다.", "", "샘은 놈의 영역이었다.", "죽어라 도망쳤다. 어깨가 찢겼다."], "D002.c1.o1": ["차갑다.", "물이 목을 타고 내려가며 온몸을 깨운다.", "", "**살 것 같다.**"], "D002.c2.tag": "경계", "D002.c2.text": "주변을 먼저 살핀다", "D002.c2.o0": ["뼈를 살피다 이상한 걸 깨달았다.", "짐승에게 뜯긴 흔적이 없다.", "", "샘 깊은 곳에서", "**<gold>희미한 기운<\/gold>**이 피어오른다.", "", "물을 마시자 머리가 맑아진다."], "D002.c2.o1": ["진흙에 커다란 발자국이 찍혀 있다.", "아직 마르지 않았다.", "", "**<red>맹수가 근처에 있다.<\/red>**", "물 몇 모금만 급히 떠 마시고 자리를 떴다."], "D002.c2.o2": ["별다른 흔적은 없다.", "오래된 뼈일 뿐이다.", "", "**천천히 목을 축였다.**"], "D002.c3.tag": "회피", "D002.c3.text": "불길하다. 떠난다", "D002.c3.o0": ["뼈가 마음에 걸린다.", "마른 침을 삼키며 발길을 돌렸다."], "D003.title": "덤불 속 산토끼", "D003.desc": ["부스럭.", "", "덤불이 흔들린다.", "숨을 죽이고 들여다본다.", "", "**산토끼 한 마리.**", "붉은 열매를 오물오물 씹고 있다.", "", "통통하다.", "잡으면 **한 끼는 된다.**"], "D003.c1.tag": "사냥", "D003.c1.text": "덮친다", "D003.c1.o0": ["몸을 날렸다.", "손끝에 따뜻한 털이 잡힌다.", "", "**<green>잡았다.<\/green>**", "", "날고기라도 배는 찬다."], "D003.c1.o1": ["몸을 날렸다.", "토끼는 이미 없다.", "", "**돌부리에 무릎이 깨졌다.**"], "D003.c2.tag": "관찰", "D003.c2.text": "가만히 지켜본다", "D003.c2.o0": ["토끼는 열매를 다 먹고 유유히 사라졌다.", "", "멀쩡하다.", "**저 열매는 먹어도 되는 모양이다.**"], "D003.c3.tag": "투척", "D003.c3.text": "돌을 던진다", "D003.c3.o0": ["딱.", "", "**<green>정통으로 맞혔다.<\/green>**", "토끼가 버둥거리다 축 늘어진다."], "D003.c3.o1": ["돌은 엉뚱한 곳에 떨어졌다.", "토끼는 순식간에 사라졌다."], "D004.title": "버려진 오두막", "D004.desc": ["해가 진다.", "숲이 금세 어두워진다.", "", "나무 사이로 **오두막** 하나가 보인다.", "지붕은 반쯤 무너졌다.", "문짝은 경첩 하나에 겨우 매달려 있다.", "", "사람 기척은 없다.", "**<red>안쪽에서 퀴퀴한 냄새가 난다.<\/red>**"], "D004.c1.tag": "수색", "D004.c1.text": "안을 뒤진다", "D004.c1.o0": ["구석의 거적을 들췄다.", "", "**<red>백골.<\/red>**", "", "비명을 삼켰다.", "뒷걸음치다 썩은 기둥에 부딪혔다.", "지붕이 무너져 내린다."], "D004.c1.o1": ["먼지 쌓인 궤짝을 열었다.", "", "**<green>낡은 삼베옷<\/green>**과 **<green>녹슨 손칼<\/green>**.", "", "이 세계 사람들이 입는 옷이다.", "지금 입은 옷보다는 **덜 눈에 띌 것이다.**"], "D004.c2.tag": "휴식", "D004.c2.text": "들어가서 잠만 잔다", "D004.c2.o0": ["한밤중.", "문 밖에서 킁킁거리는 소리.", "", "**<red>늑대다.<\/red>**", "", "문짝을 몸으로 막고 밤을 새웠다.", "한숨도 못 잤다."], "D004.c2.o1": ["바람을 막아줄 벽이 있다는 게 이렇게 고마울 줄이야.", "", "**오랜만에 깊이 잠들었다.**"], "D004.c3.tag": "경계", "D004.c3.text": "들어가지 않는다", "D004.c3.o0": ["냄새가 영 꺼림칙하다.", "오두막 처마 밑에 웅크려 밤을 보냈다.", "", "춥다. 그래도 무사하다."], "D005.title": "얼어붙는 밤", "D005.desc": ["밤이 깊다.", "기온이 뚝 떨어졌다.", "", "이가 딱딱 부딪힌다.", "손끝 감각이 사라져 간다.", "", "**<red>이대로 자면 얼어 죽을지도 모른다.<\/red>**"], "D005.c1.tag": "불씨", "D005.c1.text": "나뭇가지를 비벼 불을 피운다", "D005.c1.o0": ["손바닥이 벗겨지도록 비볐다.", "", "연기. 그리고 작은 불씨.", "", "**<green>불이 붙었다.<\/green>**", "따뜻하다. 눈물이 날 만큼."], "D005.c1.o1": ["손바닥만 벗겨졌다.", "불은 끝내 붙지 않았다.", "", "**덜덜 떨며 밤을 지새웠다.**"], "D005.c2.tag": "인내", "D005.c2.text": "낙엽을 긁어모아 파묻힌다", "D005.c2.o0": ["새벽녘, 몸이 불덩이 같다.", "", "**<red>{고뿔}에 걸렸다.<\/red>**"], "D005.c2.o1": ["낙엽 냄새 속에서 겨우 잠들었다.", "", "**살아서 아침을 맞았다.**"], "D005.c3.tag": "강행", "D005.c3.text": "몸을 데우려 밤새 걷는다", "D005.c3.o0": ["어둠 속에서 발밑이 꺼졌다.", "", "**<red>낭떠러지였다.<\/red>**"], "D005.c3.o1": ["밤새 걸었다.", "다리가 후들거린다.", "", "그래도 **조금 단단해진 기분이다.**"], "D005.c4.tag": "라이터", "D005.c4.text": "주머니 속 라이터를 켠다", "D005.c4.o0": ["딸깍.", "", "**<gold>불꽃<\/gold>**이 피어오른다.", "", "지구에서 가져온 유일한 문명.", "모닥불 앞에서 처음으로 집 생각에 목이 멘다."], "D006.title": "약초꾼 노인", "D006.desc": ["산비탈에서 **노인 하나**가 땅을 파고 있다.", "", "등에는 커다란 약초 바구니.", "허리춤에는 두툼한 **보따리**.", "", "노인이 고개를 든다.", "주름진 얼굴이 주인공의 옷차림을 훑는다.", "", "\"…자네, 이 근방 사람이 아니구먼.\""], "D006.c1.tag": "질문", "D006.c1.text": "마을로 가는 길을 묻는다", "D006.c1.o0": ["노인이 지팡이로 산 아래를 가리킨다.", "", "\"개울을 따라 반나절이면 **청하촌**일세.\"", "", "노인이 품에서 **주먹밥** 하나를 꺼내 건넨다.", "", "**<green>마을의 위치를 알았다.<\/green>**"], "D006.c2.tag": "노동", "D006.c2.text": "약초 캐는 일을 돕는다", "D006.c2.o0": ["해가 기울 때까지 흙을 팠다.", "허리가 끊어질 것 같다.", "", "노인이 작은 단지를 내민다.", "\"품삯일세. 다쳤을 때 바르게.\"", "", "**<green>{금창약}을 얻었다.<\/green>**"], "D006.c3.tag": "약탈", "D006.c3.text": "보따리를 낚아채 달아난다", "D006.c3.o0": ["보따리에 손이 닿는 순간.", "", "노인의 지팡이가 **보이지 않았다.**", "", "\"쯧. 젊은 놈이.\"", "", "**<red>시야가 뒤집힌다.<\/red>**"], "D006.c3.o1": ["보따리를 낚아채 내달렸다.", "등 뒤에서 노인의 욕설이 멀어진다.", "", "**<green>{은자} 몇 냥<\/green>**과 말린 약초가 들어 있다.", "", "가슴 한구석이 **찜찜하다.**"], "D006.c3.o2": ["달리다 발이 꼬였다.", "노인의 지팡이가 정수리를 내리쳤다.", "", "\"도둑놈의 새끼!\"", "", "**<red>머리가 깨졌다.<\/red>**"], "D007.title": "불어난 강", "D007.desc": ["길이 끊겼다.", "", "앞을 가로막은 건 **흙탕물이 된 강**.", "어젯밤 비에 물이 불었다.", "", "물살이 거칠다.", "건너편까지는 서른 걸음 남짓.", "", "물가 얕은 곳에 **물고기 그림자**가 어른거린다."], "D007.c1.tag": "도강", "D007.c1.text": "헤엄쳐 건넌다", "D007.c1.o0": ["강 한가운데서 다리에 쥐가 났다.", "", "흙탕물이 입과 코로 밀려든다.", "", "**<red>떠내려간다.<\/red>**"], "D007.c1.o1": ["물살에 휩쓸려 한참을 떠내려갔다.", "겨우 바위를 붙잡고 기어 나왔다.", "", "**<red>온몸이 멍투성이다.<\/red>**"], "D007.c1.o2": ["이를 악물고 팔을 저었다.", "", "**<green>건넜다.<\/green>**", "숨이 턱까지 찬다. 그래도 해냈다."], "D007.c2.tag": "사냥", "D007.c2.text": "맨손으로 물고기를 잡는다", "D007.c2.o0": ["물살을 노려보다 손을 내리꽂았다.", "", "미끈한 감촉.", "**<green>잡았다.<\/green>**"], "D007.c2.o1": ["한나절 내내 허탕만 쳤다.", "옷만 흠뻑 젖었다."], "D007.c3.tag": "우회", "D007.c3.text": "강을 따라 하류로 내려간다", "D007.c3.o0": ["물길을 따라 걷는다.", "", "멀리서 **밥 짓는 연기**가 피어오른다.", "", "**<green>사람 사는 곳이 가깝다.<\/green>**"], "D008.title": "쓰러진 무인", "D008.desc": ["비린내가 난다.", "", "숲길 한가운데.", "**<red>피투성이 사내<\/red>**가 나무에 기대 쓰러져 있다.", "", "허리에 찬 **검집**.", "찢긴 옷 사이로 드러난 단단한 몸.", "", "보통 사람이 아니다.", "**{무인}(武人)이다.**", "", "가슴이 미약하게 오르내린다.", "아직, 살아 있다."], "D008.c1.tag": "치료", "D008.c1.text": "상처를 치료해준다", "D008.c1.o0": ["옷을 찢어 상처를 동여맸다.", "", "한참 뒤.", "사내가 눈을 뜬다.", "", "\"…빚을 졌군.\"", "", "사내가 {은자} 다섯 냥을 손에 쥐여준다.", "", "**<gold>{무인}과 인연이 생겼다.<\/gold>**"], "D008.c1.o1": ["피를 막느라 정신이 없던 그때.", "", "사방에서 **<red>검은 옷의 사내들<\/red>**이 걸어 나온다.", "", "\"같이 있던 놈이다. 함께 묻어라.\""], "D008.c2.tag": "약탈", "D008.c2.text": "품을 뒤진다", "D008.c2.o0": ["품에 손을 넣는 순간.", "", "**<red>손목이 붙잡혔다.<\/red>**", "", "핏발 선 눈이 이쪽을 노려본다.", "\"…쥐새끼가.\"", "", "검광이 번쩍였다."], "D008.c2.o1": ["묵직한 {전낭}.", "그리고 **<gold>낡은 책자<\/gold>** 한 권.", "", "표지에 무언가 적혀 있다.", "읽을 수는 없지만, **범상치 않은 물건이다.**"], "D008.c3.tag": "외면", "D008.c3.text": "못 본 척 지나친다", "D008.c3.o0": ["엮이면 좋을 게 없다.", "걸음을 재촉했다.", "", "등 뒤로 **멀리서 칼 부딪치는 소리**가 들려왔다."], "D008.c4.tag": "금창약", "D008.c4.text": "{금창약}을 발라준다", "D008.c4.o0": ["{금창약}을 상처에 듬뿍 발랐다.", "피가 거짓말처럼 멎는다.", "", "사내가 눈을 뜬다.", "주인공을, 그리고 빈 약단지를 본다.", "", "\"귀한 걸 썼군.\"", "\"…내 제자가 될 텐가?\"", "", "**<gold>사부를 얻었다.<\/gold>**"], "D008.c5.tag": "기척", "D008.c5.text": "주변의 기척을 살핀다", "D008.c5.o0": ["숨을 고르고 귀를 기울인다.", "", "왼쪽 수풀. 오른쪽 나무 위.", "**<red>추격자 둘.<\/red>**", "", "놈들은 아직 이쪽을 눈치채지 못했다."], "D009.title": "산적의 길목", "D009.desc": ["고갯마루.", "", "바위 뒤에서 사내들이 우르르 쏟아져 나온다.", "녹슨 칼. 몽둥이. 누런 이.", "", "\"어이, 거기.\"", "\"**<red>가진 거 다 내놓고 가라.<\/red>**\"", "", "다섯. 아니, 여섯.", "뒤쪽 길도 막혔다."], "D009.c1.tag": "굴복", "D009.c1.text": "가진 것을 다 내준다", "D009.c1.o0": ["주머니를 탈탈 털어 내밀었다.", "", "\"쳇, 거지새끼였네.\"", "", "발길질 몇 번.", "**목숨은 건졌다.**"], "D009.c2.tag": "도주", "D009.c2.text": "도망친다", "D009.c2.o0": ["몸을 돌려 비탈로 뛰어내렸다.", "가시덤불이 살을 찢는다.", "", "욕설이 멀어진다.", "", "**<green>따돌렸다.<\/green>**"], "D009.c2.o1": ["세 걸음.", "", "뒤통수에 몽둥이가 꽂혔다.", "", "**<red>눈앞이 캄캄해진다.<\/red>**"], "D009.c3.tag": "입산", "D009.c3.text": "{산채}에 들어가겠다고 한다", "D009.c3.o0": ["두목이 피식 웃는다.", "", "\"배짱은 있네.\"", "", "부하 하나가 등을 걷어차 무릎을 꿇린다.", "\"좋아. 대신 **<red>값을 치러야지.<\/red>**\"", "", "부하들이 묶인 행인 하나를 끌고 온다.", "칼 한 자루가 발치에 떨어진다."], "D009.c3.o1": ["\"너 같은 비리비리한 놈은 필요 없어.\"", "", "**<red>칼날이 목을 그었다.<\/red>**"], "D009.c4.tag": "저항", "D009.c4.text": "녹슨 손칼을 겨눈다", "D009.c4.o0": ["앞장선 놈의 팔뚝을 그었다.", "", "\"이 미친놈이…!\"", "", "놈들이 멈칫한 틈에 내달렸다.", "**<green>살았다.<\/green>**"], "D009.c4.o1": ["손칼을 쥔 손이 덜덜 떨린다.", "", "\"오, 무섭네?\"", "", "웃음소리.", "**<red>그리고 여섯 개의 칼날.<\/red>**"], "D010.title": "관병의 수색", "D010.desc": ["말발굽 소리.", "", "창을 든 **{관병}들**이 길을 막고 행인들을 검문하고 있다.", "", "벽에 **수배 그림**이 붙어 있다.", "글은 못 읽어도 그림은 알아본다.", "", "그림 속 사내가 입은 옷.", "후드티에 청바지, 운동화.", "", "**<red>지금 내 옷차림 그대로다.<\/red>**", "", "관병들이 찾는 사람은,", "**<red>나다.<\/red>**"], "D010.c1.tag": "순응", "D010.c1.text": "순순히 다가간다", "D010.c1.o0": ["{관병} 대장이 주인공을 위아래로 훑는다.", "", "\"…찾았다. 정중히 모셔라.\"", "", "포박은 없다.", "대신 **<gold>황궁의 문양<\/gold>**이 새겨진 마차가 다가온다.", "", "마차 안에서, 처음으로 **배불리 먹었다.**"], "D010.c1.o1": ["\"이놈이 그 **간자**다!\"", "", "변명할 틈도 없었다.", "", "**<red>목에 칼이 떨어졌다.<\/red>**"], "D010.c2.tag": "도주", "D010.c2.text": "숲으로 숨는다", "D010.c2.o0": ["\"저기다! 잡아라!\"", "", "화살이 허벅지를 꿰뚫었다.", "", "**<red>끌려간다.<\/red>**"], "D010.c2.o1": ["덤불 속에 엎드려 숨을 죽였다.", "", "말발굽 소리가 멀어진다.", "", "**살았다.** 하지만 이제 **<red>쫓기는 몸이다.<\/red>**"], "D010.c3.tag": "위장", "D010.c3.text": "삼베옷으로 갈아입고 백성인 척한다", "D010.c3.o0": ["낡은 삼베옷에 고개를 푹 숙였다.", "", "{관병}이 힐끗 보더니 턱짓한다.", "\"지나가.\"", "", "**<green>무사히 빠져나왔다.<\/green>**"], "D010.c3.o1": ["\"잠깐.\"", "", "{관병}이 주인공의 신발을 내려다본다.", "**<red>운동화.<\/red>**", "", "\"…이놈 잡아!\"", "", "창대가 옆구리를 후려친다."], "D008_추격자.title": "수풀 속의 칼", "D008_추격자.desc": ["숨을 죽인다.", "", "왼쪽 수풀에 하나.", "오른쪽 나무 위에 하나.", "**<red>검은 옷의 추격자들.<\/red>**", "", "나무 위의 놈은 **팔에 붕대**를 감고 있다.", "피가 배어 나온다. {무인}에게 당한 상처다.", "", "쓰러진 무인이 희미하게 신음한다.", "놈들이 고개를 돌리기까지,", "**얼마 남지 않았다.**"], "D008_추격자.c1.tag": "도주", "D008_추격자.c1.text": "{무인}을 업고 반대편으로 달린다", "D008_추격자.c1.o0": ["{무인}을 들쳐 업었다.", "생각보다 무겁다. 무릎이 꺾일 것 같다.", "", "그래도 달렸다.", "등 뒤의 기척이 점점 멀어진다.", "", "**<green>따돌렸다.<\/green>**", "", "등 위에서 무인이 중얼거린다.", "\"…미련한 놈.\""], "D008_추격자.c1.o1": ["열 걸음도 못 가 다리가 풀렸다.", "", "등 뒤에서 바람 가르는 소리.", "", "**<red>비수가 등에 박혔다.<\/red>**"], "D008_추격자.c2.tag": "밀고", "D008_추격자.c2.text": "추격자들에게 {무인}의 위치를 알린다", "D008_추격자.c2.o0": ["\"여, 여기 있습니다!\"", "", "검은 옷의 사내가 다가와 주인공을 내려다본다.", "그리고 피식 웃는다.", "", "\"눈치는 빠르군.\"", "", "**<green>{은자} 한 줌<\/green>**이 발치에 떨어진다.", "등 뒤로 짧은 비명이 들렸다.", "", "**<purple>무언가 더러운 것이 손에 묻은 기분이다.<\/purple>**"], "D008_추격자.c2.o1": ["\"여, 여기 있습니다!\"", "", "\"그래. 수고했다.\"", "", "**<red>입막음은 확실하게.<\/red>**"], "D008_추격자.c3.tag": "기습", "D008_추격자.c3.text": "다친 놈부터 덮친다", "D008_추격자.c3.o0": ["나무에서 내려오는 순간을 노렸다.", "붕대 감은 팔을 그대로 걷어찼다.", "", "\"크악!\"", "", "그 틈에 {무인}이 눈을 떴다.", "검광 두 번.", "", "**<gold>추격자들이 쓰러졌다.<\/gold>**", "", "\"…쓸 만한 놈이군.\""], "D008_추격자.c3.o1": ["달려드는 발소리가 너무 컸다.", "", "놈이 성한 팔로 칼을 휘둘렀다.", "", "**<red>시야가 붉게 물든다.<\/red>**"], "D008_추격자.c4.tag": "손칼", "D008_추격자.c4.text": "녹슨 손칼을 던진다", "D008_추격자.c4.o0": ["손칼이 허공을 갈랐다.", "", "퍽.", "나무 위의 놈이 떨어진다.", "", "남은 하나가 당황한 사이,", "{무인}이 몸을 일으켜 마무리했다.", "", "**<gold>살았다. 둘 다.<\/gold>**"], "D008_추격자.c4.o1": ["손칼이 나무줄기에 박혔다.", "", "\"찾았다.\"", "", "**<red>두 개의 칼날이 동시에 날아든다.<\/red>**"], "D009_입산시험.title": "흑풍채의 값", "D009_입산시험.desc": ["발치에 떨어진 칼.", "", "그 앞에 무릎 꿇린 **젊은 사내**.", "입에 재갈이 물려 있다.", "", "사내의 눈은 겁에 질려 있지 않다.", "**이쪽을 똑바로 보고 있다.**", "", "그리고 손목의 밧줄이", "**<gold>조금 느슨하다.<\/gold>**", "", "두목이 턱짓한다.", "\"**<red>베어라. 그럼 오늘부터 {흑풍채} 식구다.<\/red>**\""], "D009_입산시험.c1.tag": "참수", "D009_입산시험.c1.text": "칼을 들어 벤다", "D009_입산시험.c1.o0": ["손이 떨린다.", "", "눈을 감고 내리쳤다.", "", "따뜻한 것이 얼굴에 튄다.", "", "두목이 어깨를 두드린다.", "\"잘했다, 막내.\"", "", "두목이 {은자} 세 냥을 던져준다.", "", "**<purple>오늘, 처음으로 사람을 죽였다.<\/purple>**"], "D009_입산시험.c2.tag": "거부", "D009_입산시험.c2.text": "못 하겠다고 한다", "D009_입산시험.c2.o0": ["\"…못 합니다.\"", "", "정적.", "", "두목이 껄껄 웃는다.", "\"사람 못 죽이는 놈은 처음이네. 그래도 배짱은 있어.\"", "", "**<green>잡일꾼으로 {산채}에 남게 되었다.<\/green>**", "", "대신, **실컷 두들겨 맞았다.**"], "D009_입산시험.c2.o1": ["\"…못 합니다.\"", "", "\"그래? 그럼 **<red>네가 대신 묻혀라.<\/red>**\""], "D009_입산시험.c3.tag": "결박", "D009_입산시험.c3.text": "베는 척하며 밧줄을 끊는다", "D009_입산시험.c3.o0": ["칼을 내리치는 척, 밧줄을 그었다.", "", "그 순간.", "사내가 **<gold>튀어 올랐다.<\/gold>**", "", "맨손으로 산적 둘을 쓰러뜨리고,", "주인공의 멱살을 잡아 끌고 숲으로 뛰어든다.", "", "\"정신 차리고 뛰어!\"", "", "**<gold>살았다.<\/gold>**", "", "사내가 숨을 고르며 말한다.", "\"{화산파} {삼대제자} **진우**다. 은혜는 갚지.\""], "D009_입산시험.c3.o1": ["밧줄을 긋는 순간,", "두목의 눈이 번뜩였다.", "", "\"이 새끼가?\"", "", "**<red>둘 다 죽여.<\/red>**"], "D009_입산시험.c4.tag": "역습", "D009_입산시험.c4.text": "칼을 들고 두목에게 달려든다", "D009_입산시험.c4.o0": ["아무도 예상하지 못했다.", "주인공 자신조차.", "", "칼날이 두목의 목에 박혔다.", "", "산적들이 얼어붙는다.", "", "**<gold>{흑풍채} 두목이 죽었다.<\/gold>**", "", "누군가 중얼거린다.", "\"…새 두목이다.\"", "", "{산채} 창고에 쌓인 {은자}가 이제 **내 것이다.**"], "D009_입산시험.c4.o1": ["두목은 웃으며 몸을 비틀었다.", "", "**<red>그게 마지막으로 본 광경이었다.<\/red>**"], "D010_황궁의_마차.title": "국사(國師)", "D010_황궁의_마차.desc": ["마차는 사흘을 달렸다.", "", "도착한 곳은 황궁이 아니었다.", "황궁 뒤편, **향 연기가 자욱한 {전각}**.", "", "백발의 노인이 앉아 있다.", "관복도, 갑옷도 아닌 **<gold>소매 넓은 {도포}<\/gold>**.", "", "노인이 눈을 뜬다.", "", "그 순간, 숨이 막혔다.", "**<red>눈빛만으로 온몸이 짓눌린다.<\/red>**", "", "\"…하늘에 금이 간 날, 떨어진 것이 너로구나.\"", "\"**어디서 왔느냐.**\""], "D010_황궁의_마차.c1.tag": "진실", "D010_황궁의_마차.c1.text": "다른 세상에서 왔다고 말한다", "D010_황궁의_마차.c1.o0": ["노인의 눈썹이 꿈틀한다.", "", "\"…다른 세상이라.\"", "", "한참을 말없이 주인공을 바라보다,", "옥으로 된 패 하나를 던져준다.", "", "\"살아남거라. 언젠가 다시 부르마.\"", "", "**<gold>{국사}의 관심을 얻었다.<\/gold>**"], "D010_황궁의_마차.c1.o1": ["\"…다른 세상이라.\"", "", "노인의 입꼬리가 올라간다.", "", "\"그렇다면 **<red>속을 열어 보아야겠구나.<\/red>**\"", "", "{전각}의 문이 닫힌다."], "D010_황궁의_마차.c2.tag": "기만", "D010_황궁의_마차.c2.text": "기억을 잃었다고 둘러댄다", "D010_황궁의_마차.c2.o0": ["노인의 눈이 가늘어진다.", "", "\"**<red>내 앞에서 거짓을 말하는구나.<\/red>**\"", "", "보이지 않는 손이 목을 조여 온다.", "의식이 멀어지기 직전, 손이 풀렸다.", "", "\"…쓸모없는 것. 내다 버려라.\""], "D010_황궁의_마차.c2.o1": ["노인은 한동안 말이 없다.", "", "\"…그래. 그런 일도 있겠지.\"", "", "{관병}들이 주인공을 궁 밖에 내려놓았다.", "**<green>풀려났다.<\/green>** {은자} 몇 냥과 함께."], "D010_황궁의_마차.c3.tag": "침묵", "D010_황궁의_마차.c3.text": "입을 다문다", "D010_황궁의_마차.c3.o0": ["입을 열지 않는다.", "", "노인이 처음으로 웃는다.", "", "\"겁에 질려서도 혀를 아끼는구나.\"", "\"**<gold>그릇이 아주 없지는 않군.<\/gold>**\"", "", "노인의 손가락이 이마를 톡 친다.", "머릿속이 맑게 개는 느낌.", "", "\"가거라.\""], "D010_감옥.title": "지하 감옥", "D010_감옥.desc": ["축축하다.", "쥐 오줌 냄새가 코를 찌른다.", "", "쇠창살 너머로 간수 하나가 졸고 있다.", "허리춤에 **열쇠꾸러미**.", "", "옆 감방에는 **산발한 노인**.", "쇠사슬에 묶인 채 벽에 기대 있다.", "", "그런데 이상하다.", "**<gold>노인의 숨소리가 들리지 않는다.<\/gold>**", "죽은 건 아닌데. 숨을 쉬는 것 같지가 않다."], "D010_감옥.c1.tag": "탈옥", "D010_감옥.c1.text": "간수가 잠든 틈에 열쇠를 노린다", "D010_감옥.c1.o0": ["팔을 쇠창살 밖으로 뻗는다.", "손끝이 열쇠고리에 닿았다.", "", "찰랑.", "", "간수는 깨지 않았다.", "", "**<green>탈옥했다.<\/green>**"], "D010_감옥.c1.o1": ["찰랑.", "", "간수가 눈을 떴다.", "", "\"이놈이!\"", "", "**<red>몽둥이가 쏟아진다.<\/red>**"], "D010_감옥.c2.tag": "말걸기", "D010_감옥.c2.text": "옆 감방의 노인에게 말을 건다", "D010_감옥.c2.o0": ["\"…저기요.\"", "", "대답이 없다.", "사흘째 말을 걸었다.", "", "나흘째 밤.", "노인이 눈을 떴다.", "", "\"…시끄러운 놈.\"", "\"숨 쉬는 법부터 틀렸다. 따라 해 봐라.\"", "", "**<gold>노인에게 호흡법을 배웠다.<\/gold>**"], "D010_감옥.c2.o1": ["\"…저기요.\"", "", "대답이 없다.", "며칠을 말을 걸어도 노인은 미동도 없다.", "", "**그래도, 혼자가 아니라는 게 위안이 됐다.**"], "D010_감옥.c3.tag": "매수", "D010_감옥.c3.text": "간수에게 {은자}를 찔러준다", "D010_감옥.c3.o0": ["간수가 {은자}를 깨물어 본다.", "", "\"…뒷문은 {해시}(亥時)에 열린다.\"", "", "**<green>풀려났다.<\/green>**"], "D010_감옥.c3.o1": ["간수가 {은자}를 챙기고 히죽 웃는다.", "", "\"고맙다. 잘 쓰마.\"", "", "**<red>문은 열리지 않았다.<\/red>**"], "D010_감옥.c4.tag": "옥패", "D010_감옥.c4.text": "{국사}에게 받은 옥패를 보여준다", "D010_감옥.c4.o0": ["간수가 옥패를 보더니 하얗게 질린다.", "", "\"구, {국사}님의…!\"", "", "**<gold>문이 열렸다.<\/gold>**", "간수가 연신 허리를 숙인다.", "", "간수가 {은자} 세 냥을 쥐여주며 연신 허리를 숙인다."], "D011.title": "청하촌", "D011.desc": ["드디어, **사람 사는 곳**이다.", "", "흙담. 초가지붕. 장터의 소란.", "", "사람들의 시선이 주인공의 옷에 꽂힌다.", "수군거림.", "", "장터 한쪽, 비단옷을 입은 **상인**이 이쪽을 유심히 본다.", "아니, 정확히는", "**주인공의 주머니 쪽을.**", "", "마을 안쪽에서는", "**기합 소리**가 들려온다. {무관}이 있는 모양이다."], "D011.c1.tag": "흥정", "D011.c1.text": "상인에게 다가가 물건을 팔겠다고 한다", "D011.c1.o0": ["라이터를 켜 보였다.", "", "상인의 눈이 휘둥그레진다.", "\"이, 이건 대체…!\"", "", "**<gold>{은자} 쉰 냥.<\/gold>**", "평생 만져본 적 없는 큰돈이다.", "", "상인이 라이터를 품에 넣으며 묻는다.", "\"**이런 걸 어디서 구했소?**\""], "D011.c2.tag": "무관", "D011.c2.text": "기합 소리를 따라간다", "D011.c2.o0": ["허름한 {무관}.", "웃통을 벗은 청년들이 목검을 휘두르고 있다.", "", "문 앞에 방이 붙어 있다.", "글은 못 읽어도, 옆의 아이가 읽어준다.", "", "\"**잡일꾼 구함.** 숙식 제공이래요.\"", "", "무관 앞 우물에서 물 한 바가지를 얻어 마셨다."], "D011.c3.tag": "객잔", "D011.c3.text": "{객잔}에서 일자리를 구한다", "D011.c3.o0": ["주방 설거지 자리를 얻었다.", "", "고된 일이다.", "그래도 **밥은 굶지 않는다.**", "", "그리고 {객잔}에는", "**<gold>온갖 소문이 모인다.<\/gold>**"], "D011.c3.o1": ["\"근본도 모르는 놈은 안 써.\"", "", "문전박대.", "**마을 어귀 처마 밑에서 밤을 보냈다.**"], "D012.title": "낯익은 지팡이", "D012.desc": ["약방 앞을 지나는데.", "", "탁. 탁.", "", "**<red>낯익은 지팡이 소리.<\/red>**", "", "산에서 보따리를 빼앗았던 그 노인이", "약방 문을 열고 나온다.", "", "약방 주인이 허리를 숙인다.", "\"**의원 어르신**, 살펴 가십시오.\"", "", "노인의 고개가 천천히 이쪽으로 돌아간다."], "D012.c1.tag": "사죄", "D012.c1.text": "무릎 꿇고 사죄하며 {은자}를 돌려준다", "D012.c1.o0": ["\"그때는… 배가 고파서…\"", "", "노인이 한참 내려다본다.", "", "\"…쯧. 일어나게.\"", "\"도둑질한 놈이 돌려주러 오는 건 처음 보는군.\"", "", "**<gold>노인이 약방 일을 맡겼다.<\/gold>**"], "D012.c2.tag": "외면", "D012.c2.text": "고개를 숙이고 모르는 척 지나간다", "D012.c2.o0": ["\"거기 서라.\"", "", "약방 주인과 일꾼들이 길을 막는다.", "", "\"**<red>도둑놈이다!<\/red>**\"", "", "장터 한복판에서 몰매를 맞았다.", "이제 마을 사람 모두가 주인공을 안다."], "D012.c2.o1": ["노인은 아무 말도 하지 않았다.", "", "그저 **지팡이로 바닥을 한 번 쳤을 뿐.**", "", "등 뒤가 서늘하다."], "D012.c3.tag": "도주", "D012.c3.text": "등을 돌려 달린다", "D012.c3.o0": ["뛰었다.", "아무도 쫓아오지 않았다.", "", "골목 끝에서 돌아보니", "노인은 그 자리에 서서 **이쪽을 보고 있다.**", "", "**<red>이 마을에서 약을 구하긴 글렀다.<\/red>**"], "D013.title": "첫 번째 가르침", "D013.desc": ["모닥불 건너편.", "{무인}이 칼을 닦고 있다.", "", "\"너, **{무공}을 배워본 적 있나.**\"", "", "고개를 젓자, 무인이 혀를 찬다.", "", "\"이 세상에서 칼 하나 못 쥐는 놈은 **<red>개죽음<\/red>**이다.\"", "\"기초 정도는 가르쳐 주지.\"", "", "무인이 일어선다.", "**자세가 낮다. 무릎이 거의 땅에 닿는다.**"], "D013.c1.tag": "수련", "D013.c1.text": "시키는 대로 {마보}를 선다", "D013.c1.o0": ["한 {시진}.", "다리가 불타는 것 같다.", "", "두 시진.", "감각이 사라졌다.", "", "그때, 배꼽 아래가 **<gold>따뜻해졌다.<\/gold>**", "", "{무인}이 처음으로 웃는다.", "\"…기가 돌았군.\"", "", "**<gold>{삼류} 무인이 되었다.<\/gold>**"], "D013.c1.o1": ["다리가 풀려 고꾸라졌다.", "", "\"오늘은 여기까지.\"", "", "**그래도 다리에 힘이 붙었다.**"], "D013.c2.tag": "질문", "D013.c2.text": "왜 이렇게 자세를 낮추는지 묻는다", "D013.c2.o0": ["{무인}이 의외라는 듯 본다.", "", "\"뿌리가 깊어야 기가 고인다.\"", "\"무작정 따라 하는 놈보다는 낫군.\"", "", "**<green>수련의 요령을 깨달았다.<\/green>**", "다음 수련이 조금 쉬워질 것이다.", "", "그날 밤, 혼자 다시 자세를 잡아봤다. **다리에 힘이 붙는다.**"], "D013.c3.tag": "거절", "D013.c3.text": "칼싸움 같은 건 하고 싶지 않다고 한다", "D013.c3.o0": ["{무인}이 한참 바라본다.", "", "\"…그래. 네 목숨이니.\"", "", "다음 날 아침.", "**<red>무인은 사라지고 없었다.<\/red>**", "", "모닥불 자리에 {은자} 몇 냥이 놓여 있다."], "D014.title": "읽을 수 없는 책", "D014.desc": ["{무인}의 품에서 가져온 책을 펼친다.", "", "글자는 한 자도 읽을 수 없다.", "", "하지만 **그림**이 있다.", "사람의 몸. 그 위를 흐르는 선들.", "", "선은 **<purple>검붉은 먹<\/purple>**으로 그려져 있다.", "가만히 보고 있으면", "**<purple>속이 울렁거린다.<\/purple>**"], "D014.c1.tag": "독학", "D014.c1.text": "그림을 보며 따라 해본다", "D014.c1.o0": ["선을 따라 숨을 들이쉰다.", "", "배 속에서 무언가 꿈틀거린다.", "뜨겁다. 아니, 차갑다.", "", "**<purple>피를 토했다.<\/purple>**", "", "**<red>기가 거꾸로 흘렀다.<\/red>**"], "D014.c1.o1": ["선을 따라 숨을 들이쉰다.", "", "배 속에서 무언가 꿈틀거린다.", "**<purple>차갑고 끈적한 기운<\/purple>**이 혈관을 타고 돈다.", "", "힘이 솟는다.", "그런데 **<purple>기분이 좋지 않다.<\/purple>**", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "D014.c1.o2": ["한참을 따라 해봤지만", "아무 일도 일어나지 않았다.", "", "**속만 울렁거린다.**"], "D014.c2.tag": "해독", "D014.c2.text": "글을 아는 사람에게 읽어달라고 한다", "D014.c2.o0": ["서당 {훈장}이 책을 펼치다 얼굴이 하얗게 질린다.", "", "\"이, 이건…\"", "\"**<purple>{혈마공}(血魔功)<\/purple>**이오.\"", "\"**{마교}의 {무공}이란 말이오!**\"", "", "훈장은 {은자}도 받지 않고 문을 닫아걸었다.", "", "건넨 은자 세 냥은 **돌려받지 못했다.**"], "D014.c3.tag": "매각", "D014.c3.text": "장터에 내다 판다", "D014.c3.o0": ["골동품상이 책을 휘리릭 넘기더니", "{은자}를 넉넉히 쳐준다.", "", "**<green>은자 서른 냥.<\/green>**", "", "너무 쉽게 팔렸다.", "**<red>조금 이상할 만큼.<\/red>**"], "D014.c4.tag": "소각", "D014.c4.text": "불길하다. 태워버린다", "D014.c4.o0": ["책이 타들어 간다.", "", "검붉은 먹이 녹아내리며", "**<purple>비명 같은 소리<\/purple>**가 났다. 착각이겠지.", "", "속이 개운하다."], "D015.title": "무관의 잡일꾼", "D015.desc": ["{무관} 마당.", "", "턱수염 덥수룩한 **{사범}**이 주인공을 위아래로 훑는다.", "", "\"물 긷고, 장작 패고, 마당 쓸고.\"", "\"**대신 밥은 준다.**\"", "", "사범 뒤에서 수련생 하나가 비웃는다.", "이마에 **<red>칼자국<\/red>**이 있는 덩치 큰 놈.", "", "\"저런 비실이가 버티겠어요?\""], "D015.c1.tag": "인내", "D015.c1.text": "고개를 숙이고 일을 받는다", "D015.c1.o0": ["새벽부터 밤까지 물을 길었다.", "", "칼자국 사내가 일부러 물통을 걷어찬다.", "다시 길었다.", "", "한 달 뒤.", "**<green>팔뚝에 근육이 붙었다.<\/green>**", "", "{사범}이 지나가며 툭 던진다.", "\"내일부터 새벽 수련에 끼어라.\""], "D015.c2.tag": "도발", "D015.c2.text": "칼자국 사내를 노려본다", "D015.c2.o0": ["\"뭘 봐?\"", "", "주먹이 날아온다.", "몸이 먼저 움직였다. 고개를 숙였다.", "", "헛방.", "", "마당이 조용해진다.", "{사범}이 턱수염을 쓸며 웃는다.", "", "\"**<gold>눈은 좋군.<\/gold>** 들어와라.\""], "D015.c2.o1": ["\"뭘 봐?\"", "", "주먹이 날아왔다.", "", "**<red>코뼈가 부러졌다.<\/red>**", "", "{사범}이 혀를 찬다.", "\"…그래도 일은 해라.\""], "D015.c3.tag": "거절", "D015.c3.text": "잡일은 사양한다", "D015.c3.o0": ["\"그럼 꺼져.\"", "", "등 뒤로 웃음소리가 쏟아진다.", "", "그날 밤도 처마 밑에서 떨었다."], "D016.title": "책을 찾는 자들", "D016.desc": ["밤.", "", "잠결에 눈을 떴다.", "**<red>누군가 내려다보고 있다.<\/red>**", "", "검은 옷. 검은 복면.", "숲에서 {무인}을 쫓던 자들과 **같은 차림**이다.", "", "\"그 시체 품에서 가져간 것.\"", "\"**<red>내놔라.<\/red>**\"", "", "복면 사이로 보이는 눈.", "**어딘가 초조해 보인다.**"], "D016.c1.tag": "반납", "D016.c1.text": "책을 순순히 내준다", "D016.c1.o0": ["책을 받아 든 사내가 숨을 내쉰다.", "", "\"…현명하군.\"", "", "**<green>사내는 그대로 사라졌다.<\/green>**"], "D016.c1.o1": ["책을 받아 든 사내가 중얼거린다.", "", "\"**<red>읽었는지 아닌지 모르니.<\/red>**\""], "D016.c2.tag": "모른척", "D016.c2.text": "그런 건 모른다고 잡아뗀다", "D016.c2.o0": ["\"그래?\"", "", "**<red>칼끝이 뺨을 긋는다.<\/red>**", "", "사내가 방을 샅샅이 뒤진다.", "아무것도 없다.", "", "\"…다음엔 귀가 떨어질 거다.\""], "D016.c2.o1": ["사내가 주위를 뒤진다.", "아무것도 없다.", "", "\"…헛걸음이군.\"", "", "**사라졌다.**", "하지만 **<red>놈들은 다시 올 것이다.<\/red>**", "", "그날 밤은 한숨도 자지 못했다."], "D016.c3.tag": "흥정", "D016.c3.text": "판 곳을 알려줄 테니 목숨을 달라고 한다", "D016.c3.o0": ["\"골동품상에 팔았소. 장터 동쪽 끝.\"", "", "사내가 잠시 생각하더니", "칼을 거둔다.", "", "", "사내가 {은자} 몇 냥을 바닥에 던져두고 간다.", "다음 날 아침.", "**<red>골동품상이 불타 있었다.<\/red>**", "", "**<purple>내 탓일까.<\/purple>**"], "D016.c4.tag": "역공", "D016.c4.text": "베개 밑의 손칼로 찌른다", "D016.c4.o0": ["초조한 눈빛. 그게 틈이었다.", "", "손칼이 복면 아래로 파고든다.", "", "사내가 비틀거리며 창밖으로 몸을 날린다.", "", "**<green>살았다.<\/green>**", "바닥에 **<gold>검은 패<\/gold>** 하나가 떨어져 있다."], "D016.c4.o1": ["손칼이 허공을 찔렀다.", "", "\"…쥐새끼가 이빨을 드러내는군.\"", "", "**<red>마지막으로 본 것은 검은 소매였다.<\/red>**"], "D017.title": "새벽 마당", "D017.desc": ["닭도 울기 전.", "", "{무관} 마당에 수련생들이 줄지어 선다.", "물동이를 내려놓고 맨 끝에 섰다.", "", "{사범}이 외친다.", "\"**{마보}!** 향 한 대 탈 때까지 버틴다!\"", "", "옆의 수련생이 작게 속삭인다.", "\"**숨을 배꼽 아래로 내려.** 그래야 오래 가.\""], "D017.c1.tag": "버티기", "D017.c1.text": "이를 악물고 버틴다", "D017.c1.o0": ["향이 반쯤 탔을 때.", "다리가 떨리다 못해 **뜨거워졌다.**", "", "아니다. 다리가 아니다.", "배꼽 아래가.", "", "**<gold>기가 돌기 시작했다.<\/gold>**", "", "{사범}이 눈을 가늘게 뜬다.", "\"…잡일꾼 놈이?\""], "D017.c1.o1": ["향이 반도 타기 전에 주저앉았다.", "", "웃음소리.", "", "그래도 **어제보다 오래 버텼다.**"], "D017.c2.tag": "호흡", "D017.c2.text": "속삭임대로 숨을 아래로 내린다", "D017.c2.o0": ["들이쉬고. 아래로.", "내쉬고. 다시 아래로.", "", "어느 순간 배꼽 아래에서", "**<gold>작은 불씨<\/gold>**가 켜졌다.", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**", "", "속삭였던 수련생이 씩 웃는다.", "\"거봐. 나 **석두**야.\""], "D017.c2.o1": ["숨에 신경 쓰다 자세가 무너졌다.", "", "{사범}의 {죽비}가 등짝에 꽂힌다.", "", "그래도 **숨 쉬는 법은 조금 알 것 같다.**"], "D017.c3.tag": "요령", "D017.c3.text": "떠돌이 {무인}에게 배운 대로 뿌리를 내린다", "D017.c3.o0": ["\"뿌리가 깊어야 기가 고인다.\"", "", "그 말을 떠올리며 무릎을 더 낮췄다.", "", "향이 다 탔다.", "마당에 서 있는 건 **나 하나뿐이다.**", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "D017.c3.o1": ["뿌리는 내렸는데 기는 오지 않았다.", "", "그래도 마지막까지 버텼다.", "{사범}이 처음으로 고개를 끄덕인다."], "D018.title": "칼자국 왕두", "D018.desc": ["우물가.", "", "물동이가 발길에 차여 엎어진다.", "", "이마에 칼자국. **왕두**다.", "", "\"잡일꾼 주제에 요즘 {사범}님 눈에 드는 모양이지?\"", "", "왕두 뒤로 패거리 둘.", "그런데 왕두의 **오른쪽 무릎에 붕대**가 감겨 있다."], "D018.c1.tag": "인내", "D018.c1.text": "말없이 물을 다시 긷는다", "D018.c1.o0": ["대꾸하지 않았다.", "", "왕두가 혀를 차며 물동이를 한 번 더 걷어찬다.", "", "세 번을 다시 길었다.", "**어깨가 단단해진 것 같다.**"], "D018.c2.tag": "급소", "D018.c2.text": "붕대 감은 무릎을 걷어찬다", "D018.c2.o0": ["퍽.", "", "왕두가 무릎을 움켜쥐고 고꾸라진다.", "", "패거리들이 얼어붙는다.", "", "멀리서 지켜보던 {사범}이 피식 웃는다.", "\"**<gold>싸움은 머리로 하는 거다.<\/gold>**\""], "D018.c2.o1": ["발을 뻗는 순간, 왕두가 몸을 틀었다.", "", "\"그걸 노릴 줄 알았지.\"", "", "**<red>셋이서 실컷 두들겨 팼다.<\/red>**"], "D018.c3.tag": "고자질", "D018.c3.text": "{사범}에게 일러바친다", "D018.c3.o0": ["{사범}이 왕두를 불러 세운다.", "", "왕두는 마당을 백 바퀴 돌았다.", "", "그날 밤.", "**<red>이불 속에 누가 물을 부어놨다.<\/red>**"], "D018.c4.tag": "일권", "D018.c4.text": "정면으로 주먹을 내지른다", "D018.c4.o0": ["배꼽 아래의 기운을 주먹에 실었다.", "", "**쾅.**", "", "왕두가 우물 벽까지 날아갔다.", "", "\"…너, 너 언제…\"", "", "**<gold>{무관}에서 나를 무시하는 놈은 이제 없다.<\/gold>**"], "D018.c4.o1": ["기운이 손끝까지 오지 않았다.", "", "왕두가 비웃으며 주먹을 받아낸다.", "**<red>손목이 꺾였다.<\/red>**"], "D019.title": "산채의 밤", "D019.desc": ["{산채}의 모닥불.", "산적들이 술판을 벌이고 있다.", "", "한쪽에서는 **{투전}판**.", "{은자}가 오가는 소리가 요란하다.", "", "구석에서는 늙은 산적 하나가 혼자 칼을 간다.", "**왼손이 없다.**", "", "부두목이 손짓한다.", "\"막내, 이리 와서 한 판 해.\""], "D019.c1.tag": "투전", "D019.c1.text": "{투전}판에 낀다", "D019.c1.o0": ["패를 쥔 손에 땀이 찬다.", "", "한 판. 두 판.", "", "**<green>이겼다.<\/green>**", "부두목의 얼굴이 굳는다."], "D019.c1.o1": ["패가 영 안 붙는다.", "", "부두목이 {은자}를 쓸어 담으며 웃는다.", "\"**막내가 착하네.**\""], "D019.c2.tag": "외팔이", "D019.c2.text": "칼 가는 늙은 산적 옆에 앉는다", "D019.c2.o0": ["한참을 말없이 앉아 있었다.", "", "\"…칼은 이렇게 쥐는 거다.\"", "", "외팔이가 남은 한 손으로 시범을 보인다.", "놀랍도록 빠르다.", "", "\"나도 한때는 **<gold>{이류}<\/gold>** 소리 들었지.\""], "D019.c2.o1": ["\"꺼져.\"", "", "숫돌이 날아왔다.", "이마가 찢어졌다."], "D019.c3.tag": "술", "D019.c3.text": "산적들과 어울려 술을 마신다", "D019.c3.o0": ["독한 술이 목을 태운다.", "", "산적들이 어깨를 두드린다.", "\"이제 좀 식구 같네!\"", "", "다음 날 아침.", "**머리가 깨질 것 같다.**"], "D019.c4.tag": "탈주", "D019.c4.text": "다들 취한 틈에 {산채}를 빠져나간다", "D019.c4.o0": ["코 고는 소리 사이로 발을 옮겼다.", "", "목책을 넘고, 비탈을 굴렀다.", "", "**<green>빠져나왔다.<\/green>**", "", "이제 {흑풍채}는 **<red>나를 배신자로 여길 것이다.<\/red>**"], "D019.c4.o1": ["목책에 걸린 방울이 울렸다.", "", "\"막내가 튄다!\"", "", "**<red>끌려와서 반쯤 죽도록 맞았다.<\/red>**"], "D020.title": "새 두목", "D020.desc": ["두목의 자리.", "호랑이 가죽이 깔린 의자에 앉았다.", "", "산적 서른 명이 이쪽을 보고 있다.", "", "존경하는 눈빛이 아니다.", "**<red>언제 목을 딸지 재는 눈빛이다.<\/red>**", "", "부두목 **곽철**이 앞으로 나선다.", "\"새 두목님. 첫 명령을 내리시지요.\"", "", "그 손이 **칼자루 근처에 머물러 있다.**"], "D020.c1.tag": "분배", "D020.c1.text": "창고의 {은자}를 모두에게 나눠준다", "D020.c1.o0": ["창고 문을 활짝 열었다.", "", "\"전부 나눠 가져라.\"", "", "환호성.", "곽철의 손이 칼자루에서 떨어진다.", "", "**<gold>산적들이 처음으로 고개를 숙인다.<\/gold>**"], "D020.c1.o1": ["{은자}를 나눠주자 곽철이 비웃는다.", "", "\"돈으로 사는 충성은 오래 안 가지.\"", "", "그날 밤, 곽철은 **<red>절반을 데리고 {산채}를 떠났다.<\/red>**"], "D020.c2.tag": "본보기", "D020.c2.text": "곽철을 먼저 친다", "D020.c2.o0": ["말이 끝나기도 전에 몸을 날렸다.", "", "곽철의 칼이 반쯤 뽑힌 채 멈춘다.", "", "**<gold>쓰러진 건 곽철이었다.<\/gold>**", "", "{산채}가 쥐 죽은 듯 조용해진다."], "D020.c2.o1": ["곽철은 기다리고 있었다.", "", "**<red>칼날이 먼저 닿았다.<\/red>**"], "D020.c3.tag": "해산", "D020.c3.text": "{흑풍채}를 해산하겠다고 선언한다", "D020.c3.o0": ["\"오늘부로 {흑풍채}는 없다.\"", "", "웅성거림.", "곽철이 크게 웃는다.", "", "\"그럼 넌 두목이 아니군.\"", "", "**<red>{산채} 밖으로 내던져졌다.<\/red>**", "그래도 품에는 창고에서 챙긴 {은자} 몇 냥이 있다."], "D021.title": "화산의 빚", "D021.desc": ["산길에서 누군가 손을 흔든다.", "", "흰 {무복}. 등에 멘 검.", "**진우**다.", "", "\"찾느라 애먹었다, 은인!\"", "", "진우가 허리를 깊이 숙인다.", "\"{화산파} 제자는 은혜를 잊지 않는다.\"", "\"**원하는 걸 말해봐.**\""], "D021.c1.tag": "검법", "D021.c1.text": "검 쓰는 법을 가르쳐 달라고 한다", "D021.c1.o0": ["진우가 나뭇가지 하나를 건넨다.", "", "\"{사문}의 검법은 못 가르쳐. 대신 기초는.\"", "", "사흘 밤낮을 휘둘렀다.", "나흘째 아침, 가지 끝이 **<gold>바람을 갈랐다.<\/gold>**", "", "\"…너, 재능 있다.\""], "D021.c1.o1": ["사흘 밤낮을 휘둘렀다.", "", "손바닥이 다 까졌다.", "\"…괜찮아. 다들 처음엔 그래.\""], "D021.c2.tag": "재물", "D021.c2.text": "돈을 달라고 한다", "D021.c2.o0": ["진우가 잠시 멈칫하더니 {전낭}을 통째로 내민다.", "", "\"…그래. 그게 필요하겠지.\"", "", "**<green>{은자} 열 냥.<\/green>**", "", "진우의 눈빛이 조금 식은 것 같다."], "D021.c3.tag": "추천", "D021.c3.text": "{화산파}에 들어가고 싶다고 한다", "D021.c3.o0": ["진우가 난감한 얼굴을 한다.", "", "\"입문 시험은 내가 어쩔 수 없어. 대신…\"", "", "품에서 **<gold>매화 문양 패<\/gold>**를 꺼낸다.", "\"이걸 보여주면 시험은 볼 수 있을 거야.\""], "D021.c3.o1": ["\"…미안. 범인은 화산 문턱도 못 넘어.\"", "", "진우가 대신 말린 고기 한 덩이를 쥐여준다.", "", "**<red>범인.<\/red>** 그 말이 귀에 박힌다."], "D022.title": "숨 쉬는 법", "D022.desc": ["감옥의 노인이 가르쳐 준 구절.", "", "**들이쉼은 길게. 머묾은 깊게. 내쉼은 가늘게.**", "", "밤마다 따라 해 봤지만", "아직 아무것도 느껴지지 않는다.", "", "노인의 마지막 말이 떠오른다.", "\"**<purple>급하면 죽는다.<\/purple>**\""], "D022.c1.tag": "인내", "D022.c1.text": "한 달 동안 매일 밤 천천히 따라 한다", "D022.c1.o0": ["스무하루째 밤.", "", "숨이 배꼽 아래에서 **<gold>멈추지 않고 돌았다.<\/gold>**", "", "한 바퀴. 두 바퀴.", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "D022.c1.o1": ["한 달이 지났다.", "기는 오지 않았다.", "", "하지만 **잠이 깊어지고 몸이 가볍다.**"], "D022.c2.tag": "강행", "D022.c2.text": "숨을 억지로 오래 참는다", "D022.c2.o0": ["더. 조금만 더.", "", "눈앞이 하얘졌다.", "", "**<purple>코피가 쏟아졌다.<\/purple>**", "", "급하면 죽는다. 그 말이 맞았다."], "D022.c2.o1": ["숨을 참고, 참고, 또 참았다.", "", "배 속이 **뜨겁다.**", "", "기가 돌았다. 거칠게, 날뛰듯이.", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**", "하지만 가슴 한쪽이 **<purple>욱신거린다.<\/purple>**"], "D022.c3.tag": "질문", "D022.c3.text": "옥중 노인을 다시 찾아간다", "D022.c3.o0": ["감옥 담장 밖, 노인의 감방 창살 아래.", "", "\"…미련한 놈. 다시 오다니.\"", "", "노인이 구절 하나를 더 읊어준다.", "", "\"**머묾이 핵심이다.** 숨이 아니라 마음을 붙잡아라.\""], "D023.title": "국사의 사자", "D023.desc": ["밤길.", "", "등 뒤에서 발소리가 없다.", "그런데 돌아보니 **누군가 서 있다.**", "", "흰 옷의 소년.", "발이 **<gold>땅에서 한 뼘 떠 있다.<\/gold>**", "", "\"{국사}님의 명이다.\"", "", "소년이 손바닥만 한 **<gold>투명한 구슬<\/gold>**을 내민다.", "\"**손을 얹어라.** 네 안에 무엇이 있는지 본다.\""], "D023.c1.tag": "순응", "D023.c1.text": "구슬에 손을 얹는다", "D023.c1.o0": ["손을 얹자 구슬 속에", "**<gold>희미한 빛 한 줄기<\/gold>**가 피어오른다.", "", "소년의 눈이 커진다.", "", "\"…있다. **{영근}**이 있어.\"", "", "소년이 처음으로 웃는다.", "\"{국사}님께 고하겠다. 그때까지 살아 있어라.\""], "D023.c1.o1": ["손을 얹었다.", "", "구슬은 **아무 빛도 내지 않았다.**", "", "소년이 차갑게 고개를 돌린다.", "\"**<red>범인이군.<\/red>** 헛걸음했다.\"", "", "눈 깜빡할 사이, 소년이 사라졌다.", "", "**발이 땅에서 떠 있던 사람.**", "이 세계에는 **<gold>{무인}보다 더 높은 무언가<\/gold>**가 있다."], "D023.c2.tag": "거절", "D023.c2.text": "왜 그래야 하냐고 묻는다", "D023.c2.o0": ["소년이 고개를 갸웃한다.", "", "\"범인이 질문을 하네.\"", "", "손가락 하나가 움직였다.", "**<red>몸이 땅바닥에 처박혔다.<\/red>**", "", "\"다음엔 묻지 말고 따라라.\"", "", "소년이 사라진 자리에 **{은자} 한 냥**이 떨어져 있다. 약값이라는 듯."], "D023.c3.tag": "라이터", "D023.c3.text": "대신 라이터를 켜 보인다", "D023.c3.o0": ["딸깍.", "", "불꽃을 본 소년이 처음으로 놀란다.", "", "\"…{법력}도 없이 불을?\"", "", "소년이 라이터를 낚아채 사라진다.", "", "\"**{국사}님께 보여드리겠다.**\"", "", "구슬 시험은 **잊힌 모양이다.**"], "D024.title": "객잔의 소문", "D024.desc": ["설거지통 너머로 손님들의 말소리가 들린다.", "", "창가의 **{보부상}**.", "\"{흑풍채} 놈들 목에 **현상금**이 붙었다더군.\"", "", "구석의 **취객**.", "\"검은 옷 입은 놈들 말이야. 그게 다 **<purple>{마교}<\/purple>** 졸개래.\"", "", "이층 계단의 **{기녀}**.", "\"황궁 {국사}님이 **사람을 찾는다**던데요. 하늘에서 떨어진 사람.\""], "D024.c1.tag": "현상금", "D024.c1.text": "{보부상}에게 술을 따르며 더 묻는다", "D024.c1.o0": ["{보부상}이 술잔을 비우며 손가락 다섯 개를 편다.", "", "\"두목 목 하나에 **{은자} 오십 냥.**\"", "\"산적 하나당 다섯 냥이고.\"", "", "보부상이 팁으로 동전 한 꾸러미를 던져준다."], "D024.c2.tag": "흑의인", "D024.c2.text": "취객 옆에 앉아 검은 옷의 자들에 대해 묻는다", "D024.c2.o0": ["취객이 목소리를 낮춘다.", "", "\"{마교}에서 **<purple>도망친 놈<\/purple>**이 있대. 귀한 걸 훔쳐서.\"", "\"그걸 찾느라 온 산을 뒤지고 다닌다더라.\"", "", "**도망친 놈.** 숲에서 쓰러져 있던 그 {무인}이 떠오른다."], "D024.c2.o1": ["\"뭘 그렇게 캐물어?\"", "", "취객의 눈이 갑자기 맑아진다.", "", "**<red>취한 척이었다.<\/red>**", "", "취객이 술값도 안 내고 사라졌다. 그 값은 내 품삯에서 깎였다."], "D024.c3.tag": "국사", "D024.c3.text": "{기녀}에게 {국사} 이야기를 묻는다", "D024.c3.o0": ["{기녀}가 부채로 입을 가리고 웃는다.", "", "\"하늘에 금이 간 밤에 별이 하나 떨어졌대요.\"", "\"{국사}님이 그걸 **보물**이라 하셨다나.\"", "", "보물.", "**<red>등골이 서늘하다.<\/red>**", "", "기녀가 웃으며 술 한 잔을 따라준다."], "D025.title": "라이터의 출처", "D025.desc": ["장터를 걷는데 누가 소매를 잡는다.", "", "그 비단옷 **상인**이다.", "", "\"찾았소! 그 불 켜는 물건 말이오.\"", "\"**하나 더 없소?** 부르는 값을 주겠소.\"", "", "상인 뒤에 덩치 큰 호위 둘.", "웃고 있지만 **<red>눈은 웃지 않는다.<\/red>**"], "D025.c1.tag": "허풍", "D025.c1.text": "구해올 수 있다고 큰소리친다", "D025.c1.o0": ["\"좋소! 선금이오.\"", "", "**<green>{은자} 스무 냥<\/green>**이 손에 쥐어진다.", "", "상인이 등을 두드린다.", "\"**보름 안에** 가져오시오. 못 가져오면…\"", "", "호위들이 손가락 마디를 꺾는다."], "D025.c2.tag": "정직", "D025.c2.text": "하나뿐이었다고 솔직히 말한다", "D025.c2.o0": ["상인이 한참 이쪽을 살핀다.", "", "\"…거짓말은 아닌 것 같군.\"", "", "상인이 명패 하나를 건넨다.", "\"혹시 비슷한 물건이 생기면 **금화{상단}**으로 오시오.\""], "D025.c2.o1": ["\"거짓말.\"", "", "호위 하나가 멱살을 잡아 골목으로 끌고 간다.", "", "주머니를 뒤집어 털렸다.", "**<red>있는 걸 다 빼앗겼다.<\/red>**"], "D025.c3.tag": "도주", "D025.c3.text": "소매를 뿌리치고 인파 속으로 달린다", "D025.c3.o0": ["좌판을 넘고, 골목을 꺾었다.", "", "**<green>따돌렸다.<\/green>**", "", "하지만 청하촌 장터에는 **당분간 얼씬도 못 하겠다.**"], "D025.c3.o1": ["다섯 걸음 만에 호위의 손이 뒷덜미를 잡았다.", "", "\"**<red>도망치는 걸 보니 뭔가 있군.<\/red>**\""], "D026.title": "다시 온 그림자", "D026.desc": ["달이 없는 밤.", "", "풀벌레 소리가 **뚝 끊겼다.**", "", "나무 사이로 검은 옷이 하나, 둘, 셋.", "", "가운데 선 자는 복면을 쓰지 않았다.", "얼굴 반쪽이 **<purple>검붉은 문신<\/purple>**으로 덮여 있다.", "", "\"그놈이 너한테 뭘 맡겼는지 다 안다.\"", "\"**<red>오늘은 묻지 않는다.<\/red>**\""], "D026.c1.tag": "도주", "D026.c1.text": "등을 돌려 계곡 쪽으로 뛴다", "D026.c1.o0": ["비탈을 미끄러져 내려갔다.", "계곡물에 몸을 던졌다.", "", "물살이 몸을 휘감아 한참을 끌고 갔다.", "", "**<green>살았다.<\/green>**", "온몸이 돌에 긁혀 성한 데가 없다."], "D026.c1.o1": ["세 걸음.", "", "등 뒤에서 **<purple>차가운 기운<\/purple>**이 덮쳐왔다.", "", "**<red>그대로 어둠이 내렸다.<\/red>**"], "D026.c2.tag": "사부", "D026.c2.text": "사부의 이름을 크게 외친다", "D026.c2.o0": ["\"사부님!!\"", "", "대답 대신,", "**<gold>검광이 밤을 갈랐다.<\/gold>**", "", "문신의 사내가 한 걸음 물러선다.", "\"…살아 있었나, 배신자.\"", "", "사부가 앞을 막아선다.", "\"내 제자다. **꺼져라.**\"", "", "그림자들이 물러갔다."], "D026.c2.o1": ["\"사부님!!\"", "", "대답이 없다.", "", "문신의 사내가 웃는다.", "\"그놈은 **<red>이미 죽었다.<\/red>**\"", "", "그 말이 마지막으로 들은 말이었다."], "D026.c3.tag": "역습", "D026.c3.text": "먼저 덤빈다", "D026.c3.o0": ["배꼽 아래의 기운을 전부 끌어올렸다.", "", "가장 가까운 놈의 팔목을 꺾고, 칼을 빼앗았다.", "", "휘둘렀다. 무작정.", "", "**<gold>검은 옷 하나가 쓰러졌다.<\/gold>**", "", "문신의 사내가 눈을 가늘게 뜬다.", "\"…재미있군. 다음에 보자.\""], "D026.c3.o1": ["주먹이 닿기도 전에", "**<purple>검붉은 손바닥<\/purple>**이 가슴에 닿았다.", "", "**<red>심장이 멎었다.<\/red>**"], "D026.c4.tag": "흥정", "D026.c4.text": "물건은 없지만 그 {무인}이 간 곳을 안다고 거짓말한다", "D026.c4.o0": ["\"서, 서쪽이오! 화산 쪽으로!\"", "", "문신의 사내가 한참 이쪽을 내려다본다.", "", "\"…거짓이면 다시 온다.\"", "", "그림자들이 서쪽으로 사라졌다.", "다리가 풀려 주저앉았다."], "D026.c4.o1": ["\"서, 서쪽이…\"", "", "\"**<red>눈동자가 왼쪽으로 갔군.<\/red>**\"", "", "문신의 사내가 손을 들었다."]}, "glossary": {"무인": "무공을 익힌 사람. 칼이나 주먹으로 싸우는 무술가.", "무공": "싸움 기술과 기운을 다루는 수련법을 통틀어 이르는 말.", "내공": "수련으로 몸 안에 쌓은 기운. 많을수록 힘과 속도가 강해진다.", "삼류": "무인 등급 중 가장 낮은 단계. 무공에 막 발을 들인 수준.", "영과": "신비한 기운이 깃든 열매. 먹으면 몸이 튼튼해진다.", "금창약": "칼에 베인 상처에 바르는 약.", "은자": "은으로 만든 돈. 한 냥, 두 냥 하고 센다.", "전낭": "돈을 넣어 허리에 차는 주머니.", "관병": "나라에 속한 병사.", "관부": "고을을 다스리는 관청. 죄인을 잡아들이는 곳이기도 하다.", "국사": "황제의 스승으로 나라의 큰일을 돌보는 사람. 이 세계에서는 황실을 지키는 정체 모를 노인이다.", "도포": "도사들이 입는, 소매가 넓은 긴 옷.", "전각": "궁궐이나 절에 있는 크고 화려한 건물.", "산채": "산적들이 산속에 꾸린 소굴.", "흑풍채": "이 근방 고갯길을 차지한 산적 무리.", "정파": "의리와 명예를 중시하는 명문 무림 세력.", "사파": "이익을 좇는 무림 세력. 산적, 살수, 뒷골목 조직 등.", "마교": "천마를 받드는 거대한 무림 세력. 정파와는 철천지원수다.", "마공": "마교의 무공. 빠르게 강해지지만 몸과 마음 (() => {
// 게임 전체 설정값. 숫자는 여기서만 바꾼다.
const CONFIG = {
  startStats: { 체력: 10, 근골: 3, 민첩: 3, 재물: 0, 내공: 0, 경지: 0 },
  startItems: ["라이터"],
  defaultWeight: 5,

  defaultLanguage: "ko",
  langDir: "lang",
  shownStats: ["체력", "근골", "민첩", "내공", "재물"],

  storage: { meta: "sunheyb.meta.v1", save: "sunheyb.save.v2", settings: "sunheyb.settings.v1" },

};

// 브라우저 저장소 감싸기. 저장이 막힌 환경에서도 게임이 멈추지 않게 한다.
const Store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (_) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (_) {}
  },
};

// 시드 가능한 난수. 같은 시드면 같은 결과가 나와서 버그 재현이 쉽다.
class Rng {
  constructor(seed = Date.now()) {
    this.s = seed >>> 0;
  }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  percent() {
    return this.next() * 100;
  }
  pickWeighted(list, weightOf) {
    const total = list.reduce((s, x) => s + weightOf(x), 0);
    let r = this.next() * total;
    for (const x of list) {
      r -= weightOf(x);
      if (r < 0) return x;
    }
    return list[list.length - 1];
  }
}

// 한 번의 생(生) 동안의 주인공 상태.
class GameState {
  constructor(config) {
    this.stats = { ...config.startStats };
    this.items = [...config.startItems];
    this.flags = new Set();
    this.bonds = {};
    this.reputation = {};
    this.affiliation = null;
    this.seen = new Set();
    this.outcomesSeen = [];
    this.achievements = [];
    this.scenes = 0;
    this.log = []; // 하단 기록창 내용 {title, tag, changes, dead}
    this.dead = false;
  }
  stat(name) {
    return this.stats[name] ?? 0;
  }
  hasItem(name) {
    return this.items.includes(name);
  }
  addItem(name) {
    this.items.push(name);
  }
  removeItem(name) {
    const i = this.items.indexOf(name);
    if (i >= 0) this.items.splice(i, 1);
  }
}

// 데이터 읽기. 이벤트 묶음 목록은 data/events/index.json에 있다.
// 단일 파일로 빌드된 판에서는 window.EVENT_DATA / window.ACHIEVEMENT_DATA를 그대로 쓴다.
class EventLoader {
  constructor(indexPath, achievementsPath) {
    this.indexPath = indexPath;
    this.achievementsPath = achievementsPath;
  }
  async load() {
    if (window.EVENT_DATA) return this.merge(window.EVENT_DATA);
    const base = this.indexPath.slice(0, this.indexPath.lastIndexOf("/") + 1);
    const index = await (await fetch(this.indexPath)).json();
    const batches = await Promise.all(index.batches.map(async (f) => (await fetch(base + f)).json()));
    return this.merge(batches);
  }
  async loadAchievements() {
    const data = window.ACHIEVEMENT_DATA ?? (await (await fetch(this.achievementsPath)).json());
    return data.achievements;
  }
  merge(batches) {
    const byId = new Map();
    for (const b of batches) for (const ev of b.events) byId.set(ev.id, ev);
    return byId;
  }
}

// 조건 판정과 다음 장면 고르기.
function meetsCondition(state, cond = {}) {
  if (cond.items && !cond.items.every((i) => state.hasItem(i))) return false;
  if (cond.flags && !cond.flags.every((f) => state.flags.has(f))) return false;
  if (cond.flags_any && !cond.flags_any.some((f) => state.flags.has(f))) return false;
  if (cond.flags_none && cond.flags_none.some((f) => state.flags.has(f))) return false;
  if (cond.stat_min && !Object.entries(cond.stat_min).every(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.realm_min != null && state.stat("경지") < cond.realm_min) return false;
  return true;
}

class EventSelector {
  constructor(eventsById, rng, config) {
    this.events = eventsById;
    this.rng = rng;
    this.config = config;
  }
  byId(id) {
    return this.events.get(id) ?? null;
  }
  next(state) {
    const pool = [...this.events.values()].filter(
      (ev) => ev.pool !== "chain" && !state.seen.has(ev.id) && meetsCondition(state, ev.conditions)
    );
    if (!pool.length) return null;
    return this.rng.pickWeighted(pool, (ev) => ev.weight ?? this.config.defaultWeight);
  }
  availableChoices(ev, state) {
    return ev.choices.filter((c) => meetsCondition(state, c.condition));
  }
}

// 선택 결과 판정(확률 + 스탯 보정)과 효과 적용.
class ResultResolver {
  constructor(rng, config) {
    this.rng = rng;
    this.config = config;
  }

  chanceOf(outcome, state) {
    let c = outcome.chance;
    for (const [stat, per] of Object.entries(outcome.mods ?? {})) c += per * state.stat(stat);
    return Math.min(this.config.chanceMax, Math.max(this.config.chanceMin, c));
  }

  // chance가 있는 결과들을 차례로 쌓고, 남은 확률은 chance 없는 결과가 가져간다.
  pick(choice, state) {
    const r = this.rng.percent();
    let acc = 0;
    let fallback = null;
    for (const o of choice.outcomes) {
      if (o.chance == null) {
        fallback = fallback ?? o;
        continue;
      }
      acc += this.chanceOf(o, state);
      if (r < acc) return o;
    }
    return fallback ?? choice.outcomes[choice.outcomes.length - 1];
  }

  // 효과를 적용하고, 화면에 보여줄 변화 목록(언어와 무관한 구조)을 돌려준다.
  apply(outcome, state) {
    const changes = [];
    const e = outcome.effects ?? {};
    for (const [k, v] of Object.entries(e)) {
      if (k === "death") state.dead = !!v;
      else if (k === "items") v.forEach((i) => { state.addItem(i); changes.push({ type: "gain", item: i, good: true }); });
      else if (k === "items_remove") v.forEach((i) => { state.removeItem(i); changes.push({ type: "lose", item: i, good: false }); });
      else if (k === "items_clear") { if (state.items.length) changes.push({ type: "loseAll", good: false }); state.items = []; }
      else if (k === "flags") v.forEach((f) => state.flags.add(f));
      else if (k === "flags_remove") v.forEach((f) => state.flags.delete(f));
      else if (k === "achievement") state.achievements.push(v);
      else if (k === "next_event") continue;
      else if (k === "realm_set") { state.stats.경지 = v; changes.push({ type: "realm", value: v, good: true }); }
      else if (k.endsWith("_set")) { const s = k.slice(0, -4); state.stats[s] = v; changes.push({ type: "set", stat: s, value: v, good: false }); }
      else if (k === "소속") { state.affiliation = v; changes.push({ type: "join", name: v, good: true }); }
      else if (k === "인연") { addAll(state.bonds, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "bond", name: who, delta: d, good: d > 0 }); }
      else if (k === "평판") { addAll(state.reputation, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "fame", name: who, delta: d, good: d > 0 }); }
      else if (typeof v === "number") {
        state.stats[k] = state.stat(k) + v;
        changes.push({ type: "stat", stat: k, delta: v, good: v > 0 });
      }
    }
    if (state.stat("체력") <= 0) state.dead = true;
    return changes;
  }
}

function addAll(target, deltas) {
  for (const [k, d] of Object.entries(deltas)) target[k] = (target[k] ?? 0) + d;
}


// 언어 파일 읽기와 글 꺼내기. 화면에 나가는 모든 글은 여기를 거친다.
// 언어 파일: lang/<언어>/ui.json, events.json, achievements.json, items.json, names.json(인물·세력), glossary.json(용어 풀이)
const FILES = ["ui", "events", "achievements", "items", "names", "glossary"];

class I18n {
  constructor(langDir) {
    this.langDir = langDir;
    this.packs = {};
    this.lang = null;
  }

  async use(lang) {
    if (!this.packs[lang]) {
      const inline = window.LANG_DATA?.[lang];
      this.packs[lang] =
        inline ??
        Object.fromEntries(
          await Promise.all(FILES.map(async (f) => [f, await (await fetch(`${this.langDir}/${lang}/${f}.json`)).json()]))
        );
    }
    this.lang = lang;
    this.p = this.packs[lang];
    document.documentElement.lang = lang;
  }

  // 화면 글자. 예: t("menu.title"), t("game.life", { n: 3 })
  t(path, vars) {
    let s = path.split(".").reduce((o, k) => o?.[k], this.p.ui);
    if (s == null) return path;
    if (vars && typeof s === "string") for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
    return s;
  }

  // 이벤트 글. 예: ev(id, "title"), ev(id, "c2.o0")
  ev(id, part) {
    return this.p.events[`${id}.${part}`] ?? `${id}.${part}`;
  }

  ach(id, field) {
    return this.p.achievements[`${id}.${field}`] ?? id;
  }

  item(id) {
    return this.p.items[id] ?? id.replaceAll("_", " ");
  }

  name(id) {
    return this.p.names?.[id] ?? id.replaceAll("_", " ");
  }

  // 용어 풀이. 없으면 null
  gloss(term) {
    return this.p.glossary?.[term] ?? null;
  }

  stat(id) {
    return this.p.ui.stats?.[id] ?? id;
  }

  realm(n) {
    return this.p.ui.realms?.[n] ?? String(n);
  }
}

// 회차(몇 번째 생)와 업(業), 인과록 기록.

const EMPTY = { life: 0, karma: 0, outcomes: [], achievements: [] };

class LifeRecord {
  constructor(config) {
    this.config = config;
    this.data = { ...EMPTY, ...Store.get(config.storage.meta, {}) };
  }
  save() {
    Store.set(this.config.storage.meta, this.data);
  }
  wipe() {
    this.data = { ...EMPTY, outcomes: [], achievements: [] };
    Store.remove(this.config.storage.meta);
  }
  startLife() {
    this.data.life += 1;
    this.save();
    return this.data.life;
  }
  // 한 생이 끝날 때 업을 계산해 쌓는다.
  endLife(state) {
    const k = this.config.karma;
    const known = new Set(this.data.outcomes);
    const fresh = [...new Set(state.outcomesSeen)].filter((o) => !known.has(o));
    const newAch = [...new Set(state.achievements)].filter((a) => !this.data.achievements.includes(a));
    const parts = [
      { id: "scenes", value: state.scenes * k.perScene },
      { id: "fresh", value: fresh.length * k.perNewOutcome },
      { id: "realm", value: state.stat("경지") * k.perRealm },
      { id: "achievements", value: newAch.length * k.perAchievement },
    ];
    const total = parts.reduce((s, p) => s + p.value, 0);
    this.data.outcomes.push(...fresh);
    this.data.achievements.push(...newAch);
    this.data.karma += total;
    this.save();
    return { parts, total, newAch };
  }
}

// 사용자 설정: 글자 크기, 언어.

const FONT_SIZES = [
  { id: "s", px: 15 },
  { id: "m", px: 17 },
  { id: "l", px: 19 },
  { id: "xl", px: 21 },
];

class Settings {

    this.key = config.storage.settings;
    this.data = { fontSize: "m", language: config.defaultLanguage, ...Store.get(this.key, {}) };
  }
  set(k, v) {

    this.apply();
  }
  apply() {
    const f = FONT_SIZES.find((x) => x.id === this.data.fontSize) ?? FONT_SIZES[1];
    document.documentElement.style.setProperty("--fs", `${f.px}px`);

// 진행 중인 생 저장/불러오기. "다음에 볼 장면"까지 함께 저장해서
// 결과를 본 뒤 껐다 켜도 선택을 다시 할 수 없게 한다.


class SaveManager {
  constructor(config) {
    this.config = config;
    this.key = config.storage.save;
  }
  has() {
    return !!Store.get(this.key);
  }
  save(state, eventId) {
    Store.set(this.key, {
      eventId,
      state: {
        stats: state.stats,
        items: state.items,
        flags: [...state.flags],
        bonds: state.bonds,
        reputation: state.reputation,
        affiliation: state.affiliation,
        seen: [...state.seen],
        outcomesSeen: state.outcomesSeen,
        achievements: state.achievements,
        scenes: state.scenes,
        log: state.log,
      },
    });
  }
  load() {
    const raw = Store.get(this.key);
    if (!raw) return null;
    const s = new GameState(this.config);
    Object.assign(s, raw.state, { flags: new Set(raw.state.flags), seen: new Set(raw.state.seen) });
    return { state: s, eventId: raw.eventId };
  }
  clear() {
    Store.remove(this.key);
  }
}

// 키보드 입력을 지금 보이는 화면 하나에만 전달한다.
let handler = null;

document.addEventListener("keydown", (e) => {
  if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  if (handler?.(e)) e.preventDefault();
});

const Keys = {
  set(fn) {
    handler = fn;
  },
  clear() {
    handler = null;
  },
};

// 본문 표기 규칙을 HTML로 바꾼다. **굵게**, <red>…</red> 등 색 태그,
// {용어} 또는 {용어|보이는글} → 마우스를 올리면 풀이가 뜨는 단어.
// 색 태그: red(위험·피해) purple(독·마기) green(획득·상승) gold(기연·희귀)
const COLORS = ["red", "purple", "green", "gold"];

function lineToHtml(line) {
  let s = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const c of COLORS) {
    s = s.replaceAll(`&lt;${c}&gt;`, `<span class="c-${c}">`).replaceAll(`&lt;/${c}&gt;`, "</span>");
  }
  s = s.replace(/\{([^{}|]+)(?:\|([^{}]+))?\}/g, (_, term, shown) => `<span class="term" tabindex="0" data-term="${term}">${shown ?? term}</span>`);
  return s;
}

// 빈 줄을 기준으로 문단을 나눈다.
function linesToHtml(lines) {
  const paras = [[]];
  for (const l of lines) l === "" ? paras.push([]) : paras[paras.length - 1].push(lineToHtml(l));
  return paras.filter((p) => p.length).map((p) => `<p>${p.join("<br>")}</p>`).join("");
}

// 용어 풀이 창. 표시된 단어(.term)에 마우스를 올리면 뜨고, 떼면 사라진다.
// 휴대폰처럼 마우스가 없으면 누를 때마다 열고 닫는다. 키보드로 포커스해도 뜬다.
class Tooltip {
  constructor(root, i18n) {
    this.i = i18n;
    this.box = document.createElement("div");
    this.box.className = "gloss";
    this.box.setAttribute("role", "tooltip");
    this.box.hidden = true;
    root.body.append(this.box);
    this.current = null;

    const termOf = (e) => e.target.closest?.(".term");
    root.addEventListener("mouseover", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("mouseout", (e) => { const t = termOf(e); if (t && !t.contains(e.relatedTarget)) this.close(); });
    root.addEventListener("focusin", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("focusout", (e) => { if (termOf(e)) this.close(); });
    root.addEventListener("click", (e) => {
      const t = termOf(e);
      if (t && window.matchMedia("(hover: none)").matches) {
        this.current === t && !this.box.hidden ? this.close() : this.open(t);
      } else if (!t) this.close();
    });
    window.addEventListener("scroll", () => this.close(), { passive: true });
  }

  open(el) {
    const text = this.i.gloss(el.dataset.term);
    if (!text) return;
    this.current = el;
    this.box.innerHTML = `<b>${el.dataset.term}</b><span>${text}</span>`;
    this.box.hidden = false;
    const r = el.getBoundingClientRect();
    const w = this.box.offsetWidth, h = this.box.offsetHeight;
    const margin = 12;
    const left = Math.min(Math.max(margin, r.left + r.width / 2 - w / 2), window.innerWidth - w - margin);
    const above = r.top - h - 8;
    const top = above > margin ? above : r.bottom + 8;
    this.box.style.left = `${left}px`;
    this.box.style.top = `${top}px`;
  }

  close() {
    this.box.hidden = true;
    this.current = null;
  }
}

// 플레이 화면 그리기 전담. 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 화면에는 지금 장면 하나만 보이고, 지나온 행동은 하단 기록창에 한 줄씩 쌓인다.
// 조작: 숫자키(1~9)로 고르기, Enter로 확인, Esc로 메인.


class GameView {
  constructor(root, config, i18n) {
    this.config = config;
    this.i = i18n;
    this.$ = (sel) => root.querySelector(sel);
    this.layer = this.$("#game");
    this.stage = this.$("#stage");
    this.logList = this.$("#log");
    this.onMenu = null;
    this.$("#toMenu").addEventListener("click", () => this.onMenu?.());
  }

  open(onMenu) {
    this.onMenu = onMenu;
    this.layer.hidden = false;
    this.$("#toMenu").hidden = false;
    this.$("#toMenu").innerHTML = `${this.i.t("game.toMenu")}<kbd>Esc</kbd>`;
    this.$("#logTitle").textContent = this.i.t("game.logTitle");
  }

  close() {
    this.layer.hidden = true;
    Keys.clear();
  }

  // 화면별 키 처리 + 공통 Esc(메인으로)
  keys(fn) {
    Keys.set((e) => {
      if (e.key === "Escape" && this.onMenu && !this.$("#toMenu").hidden) { this.onMenu(); return true; }
      return fn ? fn(e) : false;
    });
  }

  header(life, karma) {
    this.$("#life").textContent = this.i.t("game.life", { n: life });
    this.$("#karma").textContent = this.i.t("game.karma", { k: karma });
  }

  stats(state) {
    const i = this.i;
    const rows = [`<div class="stat realm"><span>${i.stat("경지")}</span><b>${i.realm(state.stat("경지"))}</b></div>`];
    for (const s of this.config.shownStats) rows.push(`<div class="stat"><span>${i.stat(s)}</span><b>${state.stat(s)}</b></div>`);
    this.$("#stats").innerHTML = rows.join("");
    this.$("#items").innerHTML = state.items.length
      ? state.items.map((x) => `<li>${i.gloss(i.item(x)) ? `<span class="term" tabindex="0" data-term="${i.item(x)}">${i.item(x)}</span>` : i.item(x)}</li>`).join("")
      : `<li class="none">${i.t("game.emptyHands")}</li>`;
  }

  // 변화 기록 하나를 글로.
  changeText(c) {
    const i = this.i;
    if (c.type === "gain") return i.t("changes.gain", { item: i.item(c.item) });
    if (c.type === "lose") return i.t("changes.lose", { item: i.item(c.item) });
    if (c.type === "loseAll") return i.t("changes.loseAll");
    if (c.type === "realm") return i.t("changes.realm", { realm: i.realm(c.value) });
    if (c.type === "set") return `${i.stat(c.stat)} ${c.value}`;
    if (c.type === "join") return i.t("changes.join", { name: i.name(c.name) });
    if (c.type === "bond") return i.t(c.delta > 0 ? "changes.bondUp" : "changes.bondDown", { name: i.name(c.name) });
    if (c.type === "fame") return i.t(c.delta > 0 ? "changes.fameUp" : "changes.fameDown", { name: i.name(c.name) });
    return `${i.stat(c.stat)} ${c.delta > 0 ? "+" : ""}${c.delta}`;
  }

  changesHtml(changes) {
    return changes.map((c) => `<span class="${c.good ? "up" : "down"}">${this.changeText(c)}</span>`).join(" ");
  }

  show(sec) {
    this.stage.replaceChildren(sec);
    window.scrollTo({ top: 0 });
  }

  // 기록창 전체를 다시 그린다 (최신이 맨 위). 기록에는 글 대신 id만 있어서 언어를 바꿔도 맞게 나온다.
  renderLog(entries) {
    const i = this.i;
    if (!entries.length) {
      this.logList.innerHTML = `<li class="empty">${i.t("game.logEmpty")}</li>`;
      return;
    }
    this.logList.innerHTML = entries
      .slice()
      .reverse()
      .map(
        (x) =>
          `<li class="${x.dead ? "dead" : ""}"><span class="t">${i.ev(x.ev, "title")}</span><span class="g">[${i.ev(x.ev, `c${x.c}.tag`)}]</span>${this.changesHtml(x.changes)}${x.dead ? `<span class="down">${i.t("game.death")}</span>` : ""}</li>`
      )
      .join("");
  }

  scene(ev, choices, onConfirm) {
    const i = this.i;
    const sec = el("section", "scene");
    sec.innerHTML = `<h2>${i.ev(ev.id, "title")}</h2><div class="prose">${linesToHtml(i.ev(ev.id, "desc"))}</div>`;
    const list = el("div", "choices");
    const confirm = button(i.t("game.next"), () => go());
    confirm.hidden = true;
    let picked = null;

    const select = (n) => {
      picked = choices[n];
      list.querySelectorAll(".choice").forEach((b, j) => b.classList.toggle("picked", j === n));
      confirm.hidden = false;
    };
    const go = () => {
      if (!picked) return;
      this.keys(null);
      list.querySelectorAll(".choice").forEach((b) => { b.disabled = true; if (!b.classList.contains("picked")) b.classList.add("dim"); });
      confirm.remove();
      onConfirm(picked, sec);
    };

    choices.forEach((c, n) => {
      const b = el("button", "choice" + (c.condition ? " earned" : ""));
      b.type = "button";
      b.innerHTML = `<span class="num">${n + 1}</span><span class="tag">[${i.ev(ev.id, `c${c.id}.tag`)}]</span><span class="txt">${lineToHtml(i.ev(ev.id, `c${c.id}.text`))}</span>`;
      b.addEventListener("click", () => select(n));
      list.append(b);
    });
    sec.append(list, confirm);
    this.show(sec);

    this.keys((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= choices.length) { select(n - 1); return true; }
      if (e.key === "Enter" && picked) { go(); return true; }
      return false;
    });
  }

  // 결과는 같은 화면, 고른 항목 아래에 붙는다. textKey 예: "c2.o0"
  outcome(sec, evId, textKey, changes, buttonKey, onNext) {
    const out = el("div", "outcome");
    out.innerHTML = `<div class="prose">${linesToHtml(this.i.ev(evId, textKey))}</div>`;
    if (changes.length) {
      out.innerHTML += `<ul class="changes">${changes.map((c) => `<li class="${c.good ? "up" : "down"}">${this.changeText(c)}</li>`).join("")}</ul>`;
    }
    const b = button(this.i.t(buttonKey), onNext);
    out.append(b);
    sec.append(out);
    out.scrollIntoView({ block: "start", behavior: "smooth" });
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }

  ending(kind, summary, onDone) {
    const i = this.i;
    this.$("#toMenu").hidden = true;
    const sec = el("section", "ending " + kind);
    const head = kind === "death" ? i.t("ending.deathHead") : i.t("ending.endHead");
    const sub = kind === "death" ? "" : `<p class="note">${i.t("ending.endNote")}</p>`;
    sec.innerHTML = `<h2>${head}</h2>${sub}
      <dl class="karma">${summary.parts.map((p) => `<div><dt>${i.t(`ending.${p.id}`)}</dt><dd>+${p.value}</dd></div>`).join("")}
      <div class="total"><dt>${i.t("ending.total")}</dt><dd>+${summary.total}</dd></div></dl>
      ${summary.newAch.length ? `<p class="ach">${i.t("ending.newAch", { list: summary.newAch.map((a) => i.ach(a, "name")).join(", ") })}</p>` : ""}`;
    const b = button(i.t("game.toMain"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }
}

function button(text, onClick, cls = "next") {
  const b = el("button", cls);
  b.type = "button";
  b.innerHTML = `${text}<kbd>Enter</kbd>`;
  b.addEventListener("click", () => { if (b.disabled) return; b.disabled = true; onClick(); });
  return b;
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// 메인 화면과 그 하위 화면(인과록, 업, 설정). 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 조작: 메인에서는 숫자키로 바로 이동, 하위 화면은 Esc로 돌아가기.



class MenuScreens {
  constructor(root, i18n) {
    this.layer = root.querySelector("#screen");
    this.i = i18n;
  }

  hide() {
    this.layer.hidden = true;
  }

  show(sec, onBack) {
    this.layer.hidden = false;
    this.layer.replaceChildren(sec);
    window.scrollTo({ top: 0 });
    if (onBack) {
      const back = el("button", "back");
      back.type = "button";
      back.innerHTML = `${this.i.t("common.back")}<kbd>Esc</kbd>`;
      back.addEventListener("click", onBack);
      sec.prepend(back);
      Keys.set((e) => (e.key === "Escape" ? (onBack(), true) : false));
    }
  }

  // info: { lives, karma, hasSave }, h: { continue, newLife, achievements, karma, settings }
  main(info, h) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "menu");
    sec.innerHTML = `
      <div class="mast">
        <p class="eyebrow">${t("menu.eyebrow")}</p>
        <h1>${t("menu.title")}</h1>
        <p class="sub">${info.lives ? t("menu.livesLine", { n: `<b>${info.lives}</b>`, k: `<b>${info.karma}</b>` }) : t("menu.noLives")}</p>
      </div>`;
    const items = [
      { key: "continue", run: h.continue, off: !info.hasSave, note: info.hasSave ? "" : t("menu.noSave") },
      { key: "newLife", run: h.newLife, note: info.hasSave ? t("menu.loseSave") : "" },
      { key: "achievements", run: h.achievements },
      { key: "karma", run: h.karma },
      { key: "settings", run: h.settings },
    ];
    const nav = el("nav", "menu-list");
    let armed = false; // 새로 하기 두 번 확인용
    items.forEach((it, n) => {
      const b = el("button", "menu-item");
      b.type = "button";
      b.disabled = !!it.off;
      b.innerHTML = `<span class="num">${n + 1}</span><span class="lbl">${t("menu." + it.key)}</span>${it.note ? `<span class="mnote">${it.note}</span>` : ""}`;
      b.addEventListener("click", () => {
        if (it.key === "newLife" && info.hasSave && !armed) {
          armed = true;
          b.classList.add("armed");
          b.querySelector(".mnote").textContent = t("menu.confirmNew");
          return;
        }
        it.run();
      });
      nav.append(b);
    });
    sec.append(nav);
    this.show(sec);
    Keys.set((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= items.length && !items[n - 1].off) { nav.children[n - 1].click(); return true; }
      if (e.key === "Enter" && !items[0].off) { nav.children[0].click(); return true; }
      return false;
    });
  }

  // 분류 탭(전체 + 지역·모임별). 달성한 것은 이름·설명·달성 조건, 못 한 것은 힌트만.
  achievements(list, unlocked, outcomeCount, onBack) {
    const i = this.i;
    const sec = el("section", "sub-screen");
    const got = list.filter((a) => unlocked.includes(a.id)).length;
    const cats = Object.keys(i.t("achievementsScreen.categories")).filter((c) => list.some((a) => a.category === c));
    const tabs = [{ id: "*", label: i.t("achievementsScreen.all"), items: list }].concat(
      cats.map((c) => ({ id: c, label: i.t(`achievementsScreen.categories.${c}`), items: list.filter((a) => a.category === c) }))
    );
    sec.innerHTML = `
      <h2>${i.t("achievementsScreen.title")}</h2>
      <p class="sub">${i.t("achievementsScreen.sub", { got: `<b>${got}</b>`, all: list.length, n: `<b>${outcomeCount}</b>` })}</p>
      <div class="tabs" role="tablist"></div>
      <ul class="ach-list"></ul>`;
    const bar = sec.querySelector(".tabs");
    const ul = sec.querySelector(".ach-list");
    const render = (tab) => {
      bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === tab.id));
      ul.innerHTML = tab.items
        .map((a) =>
          unlocked.includes(a.id)
            ? `<li class="on"><b>${i.ach(a.id, "name")}</b><span>${i.ach(a.id, "desc")}</span><span class="cond">${i.t("achievementsScreen.condLabel")} · ${i.ach(a.id, "cond")}</span></li>`
            : `<li><b>${i.t("achievementsScreen.locked")}</b><span>${i.ach(a.id, "hint")}</span></li>`
        )
        .join("");
    };
    tabs.forEach((tab) => {
      const b = el("button", "tab");
      b.type = "button";
      b.id = `tab-${tab.id === "*" ? "all" : tab.id}`;
      b.dataset.id = tab.id;
      b.setAttribute("role", "tab");
      const n = tab.items.filter((a) => unlocked.includes(a.id)).length;
      b.innerHTML = `${tab.label}<small>${n}/${tab.items.length}</small>`;
      b.addEventListener("click", () => render(tab));
      bar.append(b);
    });
    render(tabs[0]);
    this.show(sec, onBack);
  }

  karma(total, onBack) {
    const t = (k) => this.i.t(k);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `
      <h2>${t("karmaScreen.title")}</h2>
      <p class="big">${total}</p>
      <p class="sub">${t("karmaScreen.sub")}</p>
      <p class="empty">${t("karmaScreen.empty")}</p>`;
    this.show(sec, onBack);
  }

  // current: 설정값, languages: [{id, name}], h: { fontSize, language, wipe }
  settings(current, languages, h, onBack) {
    const t = (k) => this.i.t(k);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `<h2>${t("settings.title")}</h2>
      <div class="set-row"><span class="set-lbl">${t("settings.fontSize")}</span><div class="seg" id="seg-fs" role="group"></div></div>
      ${languages.length > 1 ? `<div class="set-row"><span class="set-lbl">${t("settings.language")}</span><div class="seg" id="seg-lang" role="group"></div></div>` : ""}
      <div class="set-row danger"><span class="set-lbl">${t("settings.wipe")}</span><p class="set-note">${t("settings.wipeNote")}</p></div>`;
    segment(sec.querySelector("#seg-fs"), FONT_SIZES.map((f) => ({ id: f.id, label: t(`settings.sizes.${f.id}`) })), current.fontSize, "fs", h.fontSize);
    const langSeg = sec.querySelector("#seg-lang");
    if (langSeg) segment(langSeg, languages.map((l) => ({ id: l.id, label: l.name })), current.language, "lang", h.language);

    const wipe = el("button", "wipe");
    wipe.type = "button";
    wipe.id = "wipe";
    wipe.textContent = t("settings.wipeBtn");
    let armed = false;
    wipe.addEventListener("click", () => {
      if (!armed) {
        armed = true;
        wipe.textContent = t("settings.wipeConfirm");
        wipe.classList.add("armed");
        return;
      }
      h.wipe();
      wipe.textContent = t("settings.wiped");
      wipe.disabled = true;
    });
    sec.querySelector(".danger").append(wipe);
    this.show(sec, onBack);
  }
}

function segment(box, options, currentId, prefix, onPick) {
  options.forEach((o) => {
    const b = el("button", "seg-btn" + (o.id === currentId ? " on" : ""));
    b.type = "button";
    b.id = `${prefix}-${o.id}`;
    b.textContent = o.label;
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      onPick(o.id);
    });
    box.append(b);
  });
}

// 앱 흐름: 메인 화면 ↔ 플레이(장면 → 선택 → 결과 → 다음 장면) → 정산 → 메인.













class App {
  constructor(events, achievements, i18n, settings) {
    this.rng = new Rng();
    this.selector = new EventSelector(events, this.rng, CONFIG);
    this.resolver = new ResultResolver(this.rng, CONFIG);
    this.record = new LifeRecord(CONFIG);
    this.saves = new SaveManager(CONFIG);
    this.settings = settings;
    this.i18n = i18n;
    this.achievements = achievements;
    this.view = new GameView(document, CONFIG, i18n);
    this.menu = new MenuScreens(document, i18n);
  }

  // ── 메인 화면 ──
  home() {
    this.view.close();
    this.menu.main(
      { lives: this.record.data.life, karma: this.record.data.karma, hasSave: this.saves.has() },
      {
        continue: () => this.continueLife(),
        newLife: () => this.newLife(),
        achievements: () =>
          this.menu.achievements(this.achievements, this.record.data.achievements, this.record.data.outcomes.length, () => this.home()),
        karma: () => this.menu.karma(this.record.data.karma, () => this.home()),
        settings: () => this.openSettings(),
      }
    );
  }

  async openSettings() {
    const langs = await Promise.all(
      CONFIG.languages.map(async (id) => {
        await this.i18n.use(id);
        return { id, name: this.i18n.t("lang.name") };
      })
    );
    await this.i18n.use(this.settings.data.language);
    this.menu.settings(
      this.settings.data,
      langs,
      {
        fontSize: (id) => this.settings.set("fontSize", id),
        language: async (id) => { this.settings.set("language", id); await this.i18n.use(id); this.openSettings(); },
        wipe: () => { this.record.wipe(); this.saves.clear(); },
      },
      () => this.home()
    );
  }

  // ── 플레이 ──
  enterGame() {
    this.menu.hide();
    this.view.open(() => this.home());
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.stats(this.state);
    this.view.renderLog(this.state.log);
  }

  newLife() {
    this.saves.clear();
    this.state = new GameState(CONFIG);
    this.record.startLife();
    this.enterGame();
    this.play(this.selector.next(this.state));
  }

  continueLife() {
    const saved = this.saves.load();
    if (!saved) return this.home();
    this.state = saved.state;
    this.enterGame();
    this.play(saved.eventId ? this.selector.byId(saved.eventId) : null);
  }

  play(ev) {
    if (!ev) return this.finish("end");
    const s = this.state;
    if (!s.seen.has(ev.id)) {
      s.seen.add(ev.id);
      s.scenes += 1;
    }
    this.saves.save(s, ev.id);
    this.view.scene(ev, this.selector.availableChoices(ev, s), (choice, sec) => {
      const outcome = this.resolver.pick(choice, s);
      const textKey = `c${choice.id}.o${choice.outcomes.indexOf(outcome)}`;
      s.outcomesSeen.push(`${ev.id}:${textKey}`);
      const changes = this.resolver.apply(outcome, s);
      s.log.push({ ev: ev.id, c: choice.id, changes, dead: s.dead });
      this.view.stats(s);
      this.view.renderLog(s.log);

      if (s.dead) {
        this.saves.clear();
        return this.view.outcome(sec, ev.id, textKey, changes, "game.closeEyes", () => this.finish("death"));
      }
      // 다음 장면을 지금 정해 저장해 둔다 (껐다 켜서 다시 고르기 방지).
      const nextId = outcome.effects?.next_event;
      const next = nextId ? this.selector.byId(nextId) : this.selector.next(s);
      this.saves.save(s, next?.id ?? null);
      this.view.outcome(sec, ev.id, textKey, changes, "game.continue", () => this.play(next));
    });
  }

  finish(kind) {
    this.saves.clear();
    const summary = this.record.endLife(this.state);
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.ending(kind, summary, () => this.home());
  }
}

async function boot() {
  const settings = new Settings(CONFIG);
  settings.apply();
  const i18n = new I18n(CONFIG.langDir);
  const lang = CONFIG.languages.includes(settings.data.language) ? settings.data.language : CONFIG.defaultLanguage;
  await i18n.use(lang);
  new Tooltip(document, i18n);
  const loader = new EventLoader(CONFIG.eventIndex, CONFIG.achievementsPath);
  const [events, ach] = await Promise.all([loader.load(), loader.loadAchievements()]);
  new App(events, ach, i18n, settings).home();
}

boot();

})();
</script>

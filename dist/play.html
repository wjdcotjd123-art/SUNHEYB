  // 부분음 하나: 주파수, 크기, 울림 길이, 시작 시각, 내보낼 곳, 붙는 시간, 끝 주파수 배율
  partial(freq, amp, dur, t, dest, attack = 0.004, glide = 0) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  noise(dur, t, dest, freq, amp, q = 0.7) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf;
    f.type = "lowpass";
    f.frequency.value = freq;
    f.Q.value = q;
    g.gain.setValueAtTime(amp, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(dest);
    s.start(t);
  }

  // 쪽 넘김: 두꺼운 한지가 낮게 두 번 결을 스치는 '사-락'(0.2초)
  page(t) {
    const out = this.out(1, 0.03);
    this.rasp(t, 0.08, 700, 450, 0.35, 1200, out);
    this.rasp(t + 0.07, 0.13, 520, 280, 0.45, 1000, out);
  }

  // 종이 결 스침 한 번: 섬유 알갱이 섞인 잡음을 대역으로 걸러 주파수를 내린다
  rasp(t, dur, f0, f1, amp, lpf, dest) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * (dur + 0.02)), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.7 + (Math.random() < 0.035 ? (Math.random() * 2 - 1) * 0.6 : 0);
    const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf;
    bp.type = "bandpass"; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    lp.type = "lowpass"; lp.frequency.value = lpf;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp).connect(lp).connect(g).connect(dest);
    s.start(t);
    s.stop(t + dur + 0.02);
  }

  // 경지 상승: 맑은 풍경 한 음
  realm(t) {
    const out = this.out(0.85, 0.35), lp = this.lowpass(2200, out);
    [[1, 0.13, 1.8], [2.0, 0.025, 0.9], [2.76, 0.012, 0.5]].forEach(([r, a, d]) => this.partial(659.3 * r, a, d, t, lp, 0.012));
    this.partial(130.8, 0.05, 1.8, t, out, 0.25);
  }

  // 기연·드문 인과: 낮은 도 위의 편경 도·레·솔
  fortune(t) {
    const lp = this.lowpass(1600, this.out(0.9, 0.3));
    this.partial(65.4, 0.16, 2, t, lp, 0.4);
    [523.3, 587.3, 784.0].forEach((f, i) => {
      [[1, 0.15, 1.0], [2.01, 0.03, 0.5]].forEach(([r, a, d]) => this.partial(f * r, a, d, t + i * 0.34, lp, 0.015));
    });
  }

  // 죽음: 묵직한 박동 두 번, 느려진 한 번, 그리고 멈춘다
  death(t) {
    const out = this.out(1, 0.15), sat = this.ctx.createGain();
    sat.gain.value = 0.8;
    this.satLp.disconnect();
    this.satLp.connect(sat).connect(out);
    [[0, 1], [0.22, 0.7], [0.95, 0.9], [1.17, 0.6], [2.3, 0.55]].forEach(([dt, a]) => {
      this.partial(58, 0.9 * a, 0.28, t + dt, this.sat, 0.004, 0.75);
      this.noise(0.06, t + dt, this.sat, 300, 0.5 * a, 0.8);
    });
  }

  // 귀결: 부풀었다 잦아드는 징
  ending(t) {
    const out = this.out(0.8, 1);
    this.noise(0.3, t, out, 400, 0.25);
    [[1, 0.3, 4, 0.02], [1.48, 0.16, 3.2, 0.3], [1.98, 0.13, 3, 0.5], [2.61, 0.1, 2.4, 0.7], [3.43, 0.07, 2, 0.8], [4.1, 0.05, 1.6, 0.9]]
      .forEach(([r, a, d, att]) => this.partial(98 * r, a, d, t, out, att, 0.985));
  }
}

// 키보드 입력을 지금 보이는 화면 하나에만 전달한다.
let handler = null;

document.addEventListener("keydown", (e) => {
  if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  if (handler?.(e)) e.preventDefault();
});

// 키 꾹 누르기: 누르고 있는 동안 gauge 게이지가 차고, 다 차면 onFire. 떼면 취소.
class KeyHold {
  constructor(ms = 650) {
    this.ms = ms;
    this.key = null;
    this.timer = null;
    this.gauge = null;
    document.addEventListener("keyup", (e) => { if (e.key === this.key) this.cancel(); });
    window.addEventListener("blur", () => this.cancel());
  }

  start(key, gauge, onFire) {
    this.cancel();
    this.key = key;
    this.gauge = gauge;
    gauge.style.setProperty("--hold", `${this.ms}ms`);
    gauge.classList.add("holding");
    this.timer = setTimeout(() => { this.cancel(); onFire(); }, this.ms);
  }

  cancel() {
    clearTimeout(this.timer);
    this.timer = null;
    this.gauge?.classList.remove("holding");
    this.gauge = null;
    this.key = null;
  }
}

const hold = new KeyHold();

const Keys = {
  set(fn) {
    hold.cancel();
    handler = fn;
  },
  clear() {
    hold.cancel();
    handler = null;
  },
  // 지금 눌린 key를 꾹 누르고 있으면 onFire
  hold(key, gauge, onFire) {
    hold.start(key, gauge, onFire);
  },
};

// 본문 표기 규칙을 HTML로 바꾼다. **굵게**, <red>…</red> 등 색 태그,
// {용어} 또는 {용어|보이는글} → 마우스를 올리면 풀이가 뜨는 단어.
// 색 태그: red(위험·피해) purple(독·마기) green(획득·상승) gold(기연·희귀)
const COLORS = ["red", "purple", "green", "gold"];

function lineToHtml(line) {
  let s = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const c of COLORS) {
    s = s.replaceAll(`&lt;${c}&gt;`, `<span class="c-${c}">`).replaceAll(`&lt;/${c}&gt;`, "</span>");
  }
  s = s.replace(/\{([^{}|]+)(?:\|([^{}]+))?\}/g, (_, term, shown) => `<span class="term" tabindex="0" data-term="${term}">${shown ?? term}</span>`);
  return s;
}

// 줄 간격 규칙: 문장이 끝난 줄(. ? ! … " 등으로 끝남)마다 한 문단, 문단 사이 간격은 모두 같다.
// 문장이 안 끝난 줄은 다음 줄과 이어 붙인다(강제 개행 없음). 원본의 빈 줄은 무시한다.
const SENTENCE_END = /[.?!…"”'’」』)~]$/;
const plain = (l) => l.replace(/\*\*/g, "").replace(/<\/?(red|purple|green|gold)>/g, "").replace(/[{}]/g, "").trim();
function linesToHtml(lines) {
  const paras = [];
  let buf = [];
  for (const l of lines) {
    if (l === "") continue;
    buf.push(lineToHtml(l));
    if (SENTENCE_END.test(plain(l))) { paras.push(buf.join(" ")); buf = []; }
  }
  if (buf.length) paras.push(buf.join(" "));
  return paras.map((p) => `<p>${p}</p>`).join("");
}

// 용어 풀이 창. 표시된 단어(.term)에 마우스를 올리면 뜨고, 떼면 사라진다.
// 휴대폰처럼 마우스가 없으면 누를 때마다 열고 닫는다. 키보드로 포커스해도 뜬다.
class Tooltip {
  constructor(root, i18n) {
    this.i = i18n;
    this.box = document.createElement("div");
    this.box.className = "gloss";
    this.box.setAttribute("role", "tooltip");
    this.box.hidden = true;
    root.body.append(this.box);
    this.current = null;

    const termOf = (e) => e.target.closest?.(".term");
    root.addEventListener("mouseover", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("mouseout", (e) => { const t = termOf(e); if (t && !t.contains(e.relatedTarget)) this.close(); });
    root.addEventListener("focusin", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("focusout", (e) => { if (termOf(e)) this.close(); });
    root.addEventListener("click", (e) => {
      const t = termOf(e);
      if (t && window.matchMedia("(hover: none)").matches) {
        this.current === t && !this.box.hidden ? this.close() : this.open(t);
      } else if (!t) this.close();
    });
    window.addEventListener("scroll", () => this.close(), { passive: true });
    // 화면이 바뀌어 단어가 사라졌거나, 마우스가 단어 밖에 있으면 닫는다 (mouseout을 놓치는 환경 대비)
    root.addEventListener("mousemove", (e) => {
      if (this.box.hidden) return;
      if (!this.current?.isConnected || !this.current.contains(e.target)) this.close();
    }, { passive: true });
    root.addEventListener("keydown", () => this.close());
    window.addEventListener("blur", () => this.close());
  }

  open(el) {
    const text = el.dataset.tip ?? this.i.gloss(el.dataset.term);
    if (!text) return;
    this.current = el;
    this.box.innerHTML = `<b>${el.dataset.term}</b><span>${text}</span>`;
    this.box.hidden = false;
    const r = el.getBoundingClientRect();
    const w = this.box.offsetWidth, h = this.box.offsetHeight;
    const margin = 12;
    const left = Math.min(Math.max(margin, r.left + r.width / 2 - w / 2), window.innerWidth - w - margin);
    const above = r.top - h - 8;
    const top = above > margin ? above : r.bottom + 8;
    this.box.style.left = `${left}px`;
    this.box.style.top = `${top}px`;
  }

  close() {
    this.box.hidden = true;
    this.current = null;
  }
}

// 플레이 화면 그리기 전담. 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 화면에는 지금 장면 하나만 보이고, 지나온 행동은 하단 기록창에 한 줄씩 쌓인다.
// 조작: 숫자키(1~9)로 고르기, Enter로 확인, Esc로 메인.



class GameView {
  constructor(root, config, i18n) {
    this.config = config;
    this.i = i18n;
    this.$ = (sel) => root.querySelector(sel);
    this.layer = this.$("#game");
    this.stage = this.$("#stage");
    this.logList = this.$("#log");
    this.onMenu = null;
    this.$("#toMenu").addEventListener("click", () => this.onMenu?.());
  }

  open(onMenu) {
    this.onMenu = onMenu;
    this.layer.hidden = false;
    this.$("#toMenu").hidden = false;
    this.$("#toMenu").innerHTML = `${this.i.t("game.toMenu")}<kbd>Esc</kbd>`;
    this.$("#logTitle").textContent = this.i.t("game.logTitle");
  }

  close() {
    this.layer.hidden = true;
    Keys.clear();
  }

  // 화면별 키 처리 + 공통 Esc(메인으로)
  keys(fn) {
    Keys.set((e) => {
      if (e.key === "Escape" && this.onMenu && !this.$("#toMenu").hidden) { this.onMenu(); return true; }
      return fn ? fn(e) : false;
    });
  }

  header(life, karma) {
    this.$("#karma").textContent = this.i.t("game.karma", { k: karma });
  }

  // 이번 생에서 몇 번째 장면인지 (예: 12장)
  chapter(n) {
    this.$("#life").textContent = this.i.t("game.chapter", { n });
  }

  stats(state) {
    const i = this.i;
    const rows = [`<div class="stat realm"><span>${i.stat("경지")}</span><b>${i.realm(state.stat("경지"))}</b></div>`];
    for (const s of this.config.shownStats) {
      // 체력은 숫자 대신 막대(최대 체력 대비 10칸)
      if (s === "체력") {
        const max = Math.max(1, state.stat("최대체력"));
        const n = Math.max(0, Math.min(10, Math.ceil((state.stat("체력") / max) * 10)));
        rows.push(`<div class="stat hp"><span>${i.stat(s)}</span><b class="hpbar${n <= 3 ? " low" : ""}"><i style="width:${n * 10}%"></i></b></div>`);
      } else {
        const bonus = state.gear()[s] ?? 0; // 무기 보너스는 따로 표시
        rows.push(`<div class="stat"><span>${i.stat(s)}</span><b>${state.stat(s)}${bonus ? `<small class="gear">(+${bonus})</small>` : ""}</b></div>`);
      }
    }
    this.$("#stats").innerHTML = rows.join("");
    const sit = state.situation ? `<li class="situation">${i.t(`situations.${state.situation}`)}</li>` : "";
    this.$("#items").innerHTML = sit + (state.items.length
      ? state.items.map((x) => { const d = i.itemDesc(x); return `<li>${d ? `<span class="term" tabindex="0" data-term="${i.item(x)}" data-tip="${d.replaceAll('"', "&quot;")}">${i.item(x)}</span>` : i.item(x)}</li>`; }).join("")
      : `<li class="none">${i.t("game.emptyHands")}</li>`);
  }

  // 변화 기록 하나를 글로.
  changeText(c) {
    const i = this.i;
    if (c.type === "gain") return i.t("changes.gain", { item: i.item(c.item) });
    if (c.type === "lose") return i.t("changes.lose", { item: i.item(c.item) });
    if (c.type === "loseAll") return i.t("changes.loseAll");
    if (c.type === "realm") return i.t("changes.realm", { realm: i.realm(c.value) });
    if (c.type === "set") return `${i.stat(c.stat)} ${c.value}`;
    if (c.type === "join") return i.t("changes.join", { name: i.name(c.name) });
    if (c.type === "leave") return i.t("changes.leave");
    if (c.type === "hp") return i.t(`changes.hp.${c.tier}`);
    if (c.type === "stat" && c.stat === this.config.madness?.stat) return i.t(c.delta > 0 ? "changes.madUp" : "changes.madDown");
    if (c.type === "stall") return i.t("changes.stall");
    if (c.type === "situation") return c.name === "없음" ? i.t("changes.situationEnd") : i.t("changes.situation", { name: i.t(`situations.${c.name}`) });
    if (c.type === "bond") return i.t(c.delta > 0 ? "changes.bondUp" : "changes.bondDown", { name: i.name(c.name) });
    if (c.type === "fame") return i.t(c.delta > 0 ? "changes.fameUp" : "changes.fameDown", { name: i.name(c.name) });
    const extra = c.extra ? ` <small class="trait-bonus">${i.t("changes.traitBonus", { n: c.extra.n, name: i.t(`karmaScreen.traits.${c.extra.name}.short`) })}</small>` : "";
    return `${i.stat(c.stat)} ${c.delta > 0 ? "+" : ""}${c.delta}${extra}`;
  }

  changesHtml(changes) {
    return changes.map((c) => `<span class="${c.good ? "up" : "down"}">${this.changeText(c)}</span>`).join(" ");
  }

  show(sec) {
    this.limitTerms(sec);
    this.stage.replaceChildren(sec);
    window.scrollTo({ top: 0 });
  }

  // 용어 밑줄 정리: termContext = { mode: () => "twice"|"always"|"off", counts: {} }
  // twice면 한 생에 용어마다 두 번까지만 밑줄을 남기고, 나머지는 보통 글자로 바꾼다.
  limitTerms(root) {
    const ctx = this.termContext;
    if (!ctx) return;
    const mode = ctx.mode();
    if (mode === "always") return;
    root.querySelectorAll(".term").forEach((t) => {
      const term = t.dataset.term;
      const n = ctx.counts[term] ?? 0;
      if (mode === "off" || n >= this.config.termLimit) t.replaceWith(...t.childNodes);
      else ctx.counts[term] = n + 1;
    });
  }

  // 기록창 전체를 다시 그린다 (최신이 맨 위). 기록에는 글 대신 id만 있어서 언어를 바꿔도 맞게 나온다.
  renderLog(entries) {
    const i = this.i;
    if (!entries.length) {
      this.logList.innerHTML = `<li class="empty">${i.t("game.logEmpty")}</li>`;
      return;
    }
    this.logList.innerHTML = entries
      .slice()
      .reverse()
      .map(
        (x) =>
          `<li class="${x.dead ? "dead" : ""}"><span class="t">${i.ev(x.ev, "title")}</span><span class="g">[${i.ev(x.ev, `c${x.c}.tag`)}]</span>${this.changesHtml(x.changes)}${x.dead ? `<span class="down">${i.t("game.death")}</span>` : ""}</li>`
      )
      .join("");
  }

  // 선택지 뒤에 붙는 꼬리표: 열린 이유(소지품·능력치 조건·체질)와 영향을 주는 능력치
  choiceTags(c) {
    const cond = c.condition ?? {};
    const i = this.i;
    const tags = [];
    if ((cond.items ?? []).length) tags.push(i.t("game.itemChoice"));
    for (const [k, v] of Object.entries(cond.stat_min ?? {})) tags.push(i.t("game.statChoice", { stat: i.stat(k), v }));
    const any = Object.entries(cond.stat_min_any ?? {});
    if (any.length) tags.push(any.map(([k, v]) => i.t("game.statChoice", { stat: i.stat(k), v })).join(i.t("game.or")));
    for (const [id, lv] of Object.entries(cond.traits ?? {})) {
      const tr = (this.config.traits ?? []).find((x) => x.id === id);
      const name = tr?.tiers[lv - 1]?.name ?? id;
      tags.push(i.t(`karmaScreen.traits.${name}.name`));
    }
    // 기억으로 열린 선택지는 [기억] 표시
    for (const m of this.config.memories ?? []) if ((cond.flags ?? []).includes(m.flag)) tags.push(i.t("game.memoryChoice"));
    const req = (c.madness ? ` <span class="mad">[${i.t("game.madness")}]</span>` : "") + tags.map((x) => ` <span class="req">[${x}]</span>`).join("");
    const stat = c.stat && !(cond.stat_min && c.stat in cond.stat_min) ? ` <span class="tag">[${i.stat(c.stat)}]</span>` : "";
    return req + stat;
  }

  scene(ev, choices, onConfirm, isFresh = () => false, dejavu = false) {
    const i = this.i;
    const sec = el("section", "scene");
    // 기연 장면이면 제목 위에 기연 표시 (선택지에는 힌트를 주지 않는다)
    // 본문이 길면 쪽으로 나눈다(빈 줄에서만 자름). 방향키·Enter·오른쪽 클릭·밀기로 넘기고, 마지막 쪽에서 선택지가 나온다
    const pages = splitPages(i.ev(ev.id, "desc"), CONFIG.pageChars ?? 260);
    let page = 0;
    let arrowTop = null;
    sec.innerHTML = `${ev.fortune ? `<p class="fortune-banner">${i.t("game.fortune")}</p>` : ""}<h2 class="scene-title">${i.ev(ev.id, "title")}${pages.length > 1 ? `<span class="page-num"></span>` : ""}</h2><div class="prose page-body"></div>${pages.length > 1 ? `<button type="button" class="page-arrow page-prev" aria-label="앞 쪽"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button type="button" class="page-arrow page-next" aria-label="다음 쪽"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>` : ""}${dejavu ? `<div class="prose dejavu">${linesToHtml(i.ev(ev.id, "dejavu"))}</div>` : ""}`;
    const body = sec.querySelector(".page-body");
    const nextBtn = sec.querySelector(".page-next");
    const prevBtn = sec.querySelector(".page-prev");
    const dj = sec.querySelector(".dejavu");
    const list = el("div", "choices");
    const lastPage = () => page === pages.length - 1;
    const drawPage = () => {
      body.innerHTML = linesToHtml(pages[page]);
      const pn = sec.querySelector(".page-num");
      if (pn) pn.textContent = `${page + 1}/${pages.length}`;
      list.hidden = !lastPage();
      if (nextBtn) nextBtn.hidden = lastPage();
      if (prevBtn) prevBtn.hidden = page === 0;
      // 화살표 높이는 모든 쪽에서 같게: 가장 짧은 쪽 본문의 가운데(선택지 옆으로 안 내려감)
      if (arrowTop == null) {
        let minH = Infinity;
        for (const pg of pages) { body.innerHTML = linesToHtml(pg); minH = Math.min(minH, body.offsetHeight); }
        body.innerHTML = linesToHtml(pages[page]);
        arrowTop = body.offsetTop + minH / 2;
      }
      const mid = arrowTop;
      for (const btn of [nextBtn, prevBtn]) if (btn) btn.style.top = `${mid}px`;
      if (dj) dj.hidden = !lastPage();
      window.scrollTo?.(0, 0);
    };
    const turn = (d) => {
      const n = page + d;
      if (n < 0 || n >= pages.length) return false;
      page = n; drawPage(); this.onPageTurn?.(); return true;
    };
    nextBtn?.addEventListener("click", () => turn(1));
    prevBtn?.addEventListener("click", () => turn(-1));
    if (pages.length > 1) {
      // 오른쪽 클릭: 다음 쪽 (마지막 쪽에서는 브라우저 메뉴 그대로)
      sec.addEventListener("contextmenu", (e) => { if (!lastPage()) { e.preventDefault(); turn(1); } });
      // 밀기(휴대폰 터치·PC 마우스 끌기): 오른쪽→왼쪽이면 다음 쪽, 반대면 앞 쪽
      let sx = null, sy = null;
      sec.addEventListener("pointerdown", (e) => { if (e.button === 0) { sx = e.clientX; sy = e.clientY; } });
      const end = (e) => {
        if (sx == null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        sx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { turn(dx < 0 ? 1 : -1); window.getSelection?.().removeAllRanges(); }
      };
      sec.addEventListener("pointerup", end);
      sec.addEventListener("pointercancel", () => { sx = null; });
      sec.style.touchAction = "pan-y";
    }
    let picked = null;

    // 고른 선택지 박스 안에 '결정 Enter' 표시가 생기고, 그 박스를 한 번 더 누르면 결정
    const select = (n) => {
      picked = choices[n];
      list.querySelectorAll(".choice").forEach((b, j) => b.classList.toggle("picked", j === n));
    };
    const commit = () => {
      this.lastChoice = picked; // 결과 화면에서 선택지의 능력치 표시용
      this.keys(null);
      onConfirm(picked);
    };
    // 귀결(이번 생이 끝나는 결말)로 이어지는 선택지는 한 번 더 묻는다
    const go = () => {
      if (!picked) return;
      if (picked.outcomes.some((o) => o.effects?.ending)) this.confirmEnd(sec, commit, () => this.keys(sceneKeys));
      else commit();
    };

    choices.forEach((c, n) => {
      const b = el("button", "choice" + (c.warn ? " warn" : ""));
      b.type = "button";
      b.innerHTML = `<span class="num">${n + 1}</span><span class="txt">${lineToHtml(i.ev(ev.id, `c${c.id}.text`))}${this.choiceTags(c)}</span>${c.outcomes.some((o) => o.effects?.ending) ? `<span class="end-label">${i.t("game.conclude")}</span>` : ""}${isFresh(c) ? `<span class="fresh-label">${i.t("game.fresh")}</span>` : ""}${c.warn ? `<span class="warn-label">${i.t("game.warn")}</span>` : ""}<span class="go-label">${i.t("game.go")}<kbd>Enter</kbd></span>`;
      b.addEventListener("click", () => {
        if (b.dataset.held) { delete b.dataset.held; return; } // 꾹 눌러 이미 결정했다
        picked === c ? go() : select(n); // 고른 걸 한 번 더 누르면 결정 (더블클릭 포함)
      });
      holdToFire(b, b, () => { b.dataset.held = "1"; select(n); go(); }); // 꾹 누르면 게이지가 차고 바로 결정
      list.append(b);
    });
    sec.append(list);
    this.show(sec);
    drawPage();

    const sceneKeys = (e) => {
      if (e.key === "ArrowRight") { turn(1); return true; }
      if (e.key === "ArrowLeft") { turn(-1); return true; }
      if (!lastPage()) { if (e.key === "Enter" || e.key === " ") { turn(1); return true; } return false; }
      const n = Number(e.key);
      if (n >= 1 && n <= choices.length) {
        // 고른 번호를 한 번 더 꾹 누르고 있으면 결정
        if (picked === choices[n - 1]) Keys.hold(e.key, list.children[n - 1], go);
        else select(n - 1);
        return true;
      }
      if (e.key === "Enter" && picked) { go(); return true; }
      return false;
    };
    this.keys(sceneKeys);
  }

  // 결말 확인창: "이번 생은 여기서 끝난다. 정말 고르겠는가?"
  confirmEnd(host, onYes, onNo) {
    const i = this.i;
    const box = el("div", "end-confirm");
    box.setAttribute("role", "dialog");
    box.innerHTML = `<div class="end-card"><p>${i.t("game.endConfirm")}</p><div class="end-btns"><button type="button" class="yes">${i.t("game.endYes")}<kbd>Enter</kbd></button><button type="button" class="no">${i.t("game.endNo")}<kbd>Esc</kbd></button></div></div>`;
    const close = () => box.remove();
    const yes = () => { close(); onYes(); };
    const no = () => { close(); onNo(); };
    box.querySelector(".yes").addEventListener("click", yes);
    box.querySelector(".no").addEventListener("click", no);
    host.append(box);
    box.querySelector(".no").focus();
    // Esc가 메뉴로 가지 않도록 메뉴 처리보다 먼저 받는다
    Keys.set((e) => {
      if (e.key === "Enter") { yes(); return true; }
      if (e.key === "Escape") { no(); return true; }
      return true; // 창이 떠 있는 동안 다른 키는 막는다
    });
  }

  // 첫 생에만 나오는 도입 화면.
  intro(evId, onDone) {
    const sec = el("section", "intro");
    sec.innerHTML = `<div class="prose">${linesToHtml(this.i.ev(evId, "intro"))}</div>`;
    const b = button(this.i.t("game.continue"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }

  // 결과는 새 화면으로: 장면 제목, 고른 선택 한 줄, 결과 글. textKey 예: "c2.o0"
  // textEv: 결과 글을 가져올 장면 (검은 비늘처럼 다른 장면의 결과로 바뀐 경우)
  outcome(evId, choiceId, textKey, changes, buttonKey, onNext, rare = false, fortune = false, textEv = evId, trait = null) {
    const i = this.i;
    const sec = el("section", "outcome" + (rare ? " rare" : ""));
    // trait: 결과를 바꾼 체질 id
    const traitHtml = trait ? `<div class="trait-banner"><b>${i.t("game.trait", { name: i.t(`karmaScreen.traits.${trait}.name`) })}</b><span>${i.t(`karmaScreen.traits.${trait}.fired`)}</span></div>` : "";
    sec.innerHTML = `${traitHtml}${rare ? `<p class="rare-banner">${i.t("game.rare", { n: this.config.karma.perRare })}</p>` : fortune ? `<p class="fortune-banner">${i.t("game.fortune")}</p>` : ""}<h2>${i.ev(evId, "title")}</h2>
      <p class="chosen">${lineToHtml(i.ev(evId, `c${choiceId}.text`))}${this.lastChoice ? this.choiceTags(this.lastChoice) : ""}</p>
      <div class="prose">${linesToHtml(i.ev(textEv, textKey))}</div>`;
    if (changes.length) {
      sec.innerHTML += `<ul class="changes">${changes.map((c) => `<li class="${c.good ? "up" : "down"}">${this.changeText(c)}</li>`).join("")}</ul>`;
    }
    const b = button(i.t(buttonKey), onNext);
    sec.append(b);
    this.show(sec);
    // Enter는 바로, 1~5는 꾹 누르고 있으면 넘어간다
    this.keys((e) => {
      if (e.key === "Enter") { b.click(); return true; }
      if (/^[1-5]$/.test(e.key)) { Keys.hold(e.key, b, () => b.click()); return true; }
      return false;
    });
    // 빈 곳을 꾹 누르고 있으면 '계속' 버튼의 게이지가 차고 넘어간다 (버튼·용어는 제외)
    // (꺼 둠) 빈 곳을 꾹 눌러 넘어가기: 글을 복사하려다 넘어가 버려서 막았다
    // holdToFire(sec, b, () => b.click(), undefined, (e) => !e.target.closest("button, .term, a"));
  }

  ending(kind, summary, onDone) {
    const i = this.i;
    this.$("#toMenu").hidden = true;
    const sec = el("section", "ending " + kind);
    const end = this.lastEnding;
    const head = kind === "death" ? i.t("ending.deathHead") : kind === "ending" ? i.t(`endings.${end}.head`) : i.t("ending.endHead");
    const sub = kind === "death" ? "" : kind === "ending" ? `<p class="note">${i.t(`endings.${end}.note`)}</p>` : `<p class="note">${i.t("ending.endNote")}</p>`;
    sec.innerHTML = `<h2>${head}</h2>${sub}
      <dl class="karma">${summary.parts.filter((p) => p.value > 0 || ["scenes", "fresh"].includes(p.id)).map((p) => `<div class="part-${p.id}"><dt>${i.t(`ending.${p.id}`, { w: p.note ?? 0 })}</dt><dd>+${p.value}</dd></div>`).join("")}
      ${summary.mult > 1 ? `<div class="part-mult"><dt>${i.t("ending.mult")}</dt><dd>×${summary.mult.toFixed(2)}</dd></div>` : ""}
      <div class="total"><dt>${i.t("ending.total")}</dt><dd>+${summary.total}</dd></div></dl>
      ${summary.newAch.length ? `<p class="ach">${i.t("ending.newAch", { list: summary.newAch.map((a) => i.ach(a, "name")).join(", ") })}</p>` : ""}
      ${(summary.newMemories ?? []).map((m) => `<p class="memory">${i.t("ending.newMemory", { name: i.t(`karmaScreen.memories.${m}.name`) })}</p>`).join("")}`;
    const b = button(i.t("game.toMain"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }
}

function button(text, onClick, cls = "next") {
  const b = el("button", cls);
  b.type = "button";
  b.innerHTML = `${text}<kbd>Enter</kbd>`;
  b.addEventListener("click", () => { if (b.disabled) return; b.disabled = true; onClick(); });
  return b;
}

// 꾹 누르기: ms 동안 누르고 있으면 onFire. gauge 요소에 holding 클래스를 붙여 CSS로 게이지를 채운다.
// 손을 떼거나, 밖으로 나가거나, 스크롤하면 취소된다.
function holdToFire(area, gauge, onFire, ms = 650, accept = () => true) {
  let timer = null;
  const cancel = () => {
    if (!timer) return;
    clearTimeout(timer);
    timer = null;
    gauge.classList.remove("holding");
  };
  area.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || !accept(e)) return;
    cancel();
    gauge.style.setProperty("--hold", `${ms}ms`);
    gauge.classList.add("holding");
    timer = setTimeout(() => {
      timer = null;
      gauge.classList.remove("holding");
      onFire();
    }, ms);
  });
  for (const t of ["pointerup", "pointerleave", "pointercancel"]) area.addEventListener(t, cancel);
  area.addEventListener("contextmenu", (e) => { if (timer) e.preventDefault(); }); // 휴대폰 길게 누르기 메뉴 막기
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// 본문 줄들을 쪽으로 나눈다. 빈 줄(문단 경계)에서만 자르고, 한 쪽은 대략 limit 글자.
function splitPages(lines, limit) {
  const len = (l) => String(l).replace(/\*\*|<[^>]+>|[{}]/g, "").length;
  const pages = [];
  let cur = [], n = 0;
  const paras = [];
  let buf = [];
  for (const l of lines) { if (l === "") { if (buf.length) paras.push(buf); buf = []; } else buf.push(l); }
  if (buf.length) paras.push(buf);
  for (const p of paras) {
    const pl = p.reduce((a, l) => a + len(l), 0);
    if (cur.length && n + pl > limit) { pages.push(cur); cur = []; n = 0; }
    cur.push(...(cur.length ? ["", ...p] : p)); n += pl;
  }
  if (cur.length) pages.push(cur);
  // 마지막 쪽이 너무 짧으면 앞 쪽에 붙인다
  if (pages.length > 1 && pages.at(-1).reduce((a, l) => a + len(l), 0) < limit * 0.25) { const last = pages.pop(); pages[pages.length - 1].push("", ...last); }
  return pages.length ? pages : [lines];
}

// 전투 화면: 적과 나의 체력 막대, 합마다의 전투 기록, 공격·무공·방어 선택.


class BattleScreen {
  constructor(view, i18n) {
    this.view = view;
    this.i = i18n;
  }
  bar(hp, max) {
    const n = Math.max(0, Math.min(10, Math.ceil((hp / Math.max(1, max)) * 10)));
    return `<span class="hpbar${n <= 3 ? " low" : ""}"><i style="width:${n * 10}%"></i></span>`;
  }
  // 피해 크기를 말로: 상대 최대 체력 대비
  tier(dmg, max) {
    const r = dmg / Math.max(1, max);
    return r < 0.15 ? "light" : r < 0.35 ? "mid" : "heavy";
  }
  line(b, r) {
    const t = (k, v) => this.i.t(k, v);
    const enemy = this.i.combat(`enemy.${b.enemy.id}.name`);
    const art = r.art ? this.i.combat(`art.${r.art}.name`) : null;
    if (r.who === "me") {
      if (!r.hit) return t("battle.meMiss", { art: art ? `${art}. ` : "" });
      const head = (art ? `**${art}!** ` : "") + (r.crit ? t("battle.crit") + " " : "");
      return head + t(`battle.meHit.${this.tier(r.dmg, b.enemy.max)}`, { enemy });
    }
    if (r.blind) return t("battle.blindMiss");
    if (!r.hit) return t("battle.enemyMiss", { enemy });
    if (r.dmg === 0) return t("battle.guarded", { enemy });
    const max = b.player.stat("최대체력");
    return (r.crit ? t("battle.enemyCrit", { enemy }) + " " : "") + t(`battle.enemyHit.${this.tier(r.dmg, max)}`, { enemy });
  }
  // 포켓몬 배틀처럼: 위쪽에 적·나의 이름표와 체력 막대, 그 아래 전투 글, 맨 아래 명령 칸(항상 고정).
  // 전투 글은 한 줄씩 저절로 흐르고(Enter·클릭으로 빨리 넘김), 그동안 명령 칸은 흐려져 잠긴다.
  // battle: Battle, onEnd(result: "win" | "lose")
  run(b, onEnd) {
    const i = this.i;
    const enemy = i.combat(`enemy.${b.enemy.id}.name`);
    const delay = this.view.config.combat.lineDelay ?? 1000;
    const snap = (t, e = b.enemy.hp, m = b.player.stat("체력")) => ({ t, e, m });
    let shown = snap("");
    let lines = []; // 화면에 쌓인 이번 공방의 글
    let queue = [snap(i.t("battle.appear", { enemy })), snap(i.t(b.playerFirst ? "battle.meFirst" : "battle.enemyFirst", { enemy }))];
    let mode = "cmd"; // cmd | arts | items
    let busy = false;
    let cursor = 0;
    let page = 0;
    let timer = null;
    const sec = el("section", "battle pk");
    sec.innerHTML = `
      <div class="pk-field">
        <div class="pk-tag pk-enemy"><b>${enemy}</b><span class="pk-bar"></span></div>
        <div class="pk-tag pk-me"><b>${i.t("battle.me")} · <small></small></b><span class="pk-bar"></span></div>
      </div>
      <div class="pk-log prose"></div>
      <div class="pk-box">
        <p class="pk-prompt"></p>
        <div class="pk-menu"></div>
        <div class="pk-foot"></div>
      </div>`;
    const $ = (q) => sec.querySelector(q);
    const drawField = () => {
      $(".pk-enemy .pk-bar").innerHTML = this.bar(shown.e, b.enemy.max);
      $(".pk-me .pk-bar").innerHTML = this.bar(shown.m, b.player.stat("최대체력"));
      $(".pk-me small").textContent = i.realm(b.player.stat("경지"));
      $(".pk-log").innerHTML = lines.map((l) => `<p>${lineToHtml(l)}</p>`).join("");
    };
    const list = () => (mode === "arts" ? b.usableArts() : b.usableItems());
    const cells = () => {
      if (mode === "cmd") {
        return [
          { label: i.t("battle.attack"), run: () => act({ type: "attack" }) },
          { label: i.t("battle.arts"), ok: b.usableArts().length > 0, run: () => { mode = "arts"; cursor = 0; page = 0; drawMenu(); } },
          { label: i.t("battle.guard"), run: () => act({ type: "guard" }) },
          { label: i.t("battle.items"), ok: b.usableItems().length > 0, run: () => { mode = "items"; cursor = 0; page = 0; drawMenu(); } },
        ];
      }
      const out = list().slice(page * 4, page * 4 + 4).map((x) =>
        mode === "arts"
          ? { label: i.combat(`art.${x.id}.name`), tag: i.t("battle.cost", { n: x.cost }), ok: x.ok, run: () => act({ type: "art", art: x }) }
          : { label: i.item(x.id), tag: i.t(`battle.itemDesc.${x.id}`), run: () => act({ type: "item", item: x }) }
      );
      while (out.length < 4) out.push({ label: "", ok: false });
      return out;
    };
    const drawMenu = () => {
      sec.classList.toggle("busy", busy);
      $(".pk-prompt").textContent = i.t(mode === "cmd" ? "battle.prompt" : mode === "arts" ? "battle.pickArt" : "battle.pickItem");
      const menu = $(".pk-menu");
      const foot = $(".pk-foot");
      menu.innerHTML = "";
      foot.innerHTML = "";
      cells().forEach((c, n) => {
        const btn = el("button", "pk-cell" + (n === cursor ? " on" : ""));
        btn.type = "button";
        btn.disabled = busy || c.ok === false;
        btn.innerHTML = c.label ? `<span>${c.label}</span>${c.tag ? `<small>${c.tag}</small>` : ""}` : "";
        btn.addEventListener("click", () => { if (!busy && c.ok !== false) c.run(); });
        menu.append(btn);
      });
      if (mode !== "cmd") {
        const pages = Math.ceil(list().length / 4);
        if (pages > 1) {
          const prev = el("button", "pk-small"); prev.textContent = "◀"; prev.disabled = page === 0;
          prev.addEventListener("click", () => { page -= 1; cursor = 0; drawMenu(); });
          const next = el("button", "pk-small"); next.textContent = "▶"; next.disabled = page >= pages - 1;
          next.addEventListener("click", () => { page += 1; cursor = 0; drawMenu(); });
          foot.append(prev, next);
        }
        const back = el("button", "pk-small"); back.textContent = i.t("battle.back");
        back.addEventListener("click", () => toCmd());
        foot.append(back);
      }
    };
    const toCmd = () => { mode = "cmd"; cursor = 0; drawMenu(); };
    // 글 한 줄 흘려보내기: 다 흐르면 명령 칸을 다시 연다 (전투가 끝났으면 결과로)
    const step = () => {
      clearTimeout(timer);
      if (!queue.length) {
        busy = false;
        this.view.stats(b.player);
        if (b.over) return setTimeout(() => onEnd(b.over), delay);
        return toCmd();
      }
      shown = queue.shift();
      lines.push(shown.t);
      drawField();
      timer = setTimeout(step, delay);
    };
    sec.addEventListener("click", (e) => { if (busy && !e.target.closest(".pk-box")) step(); });
    const act = (a) => {
      let e = b.enemy.hp;
      let m = b.player.stat("체력");
      const res = b.turn(a);
      lines = [];
      queue = a.type === "guard" ? [snap(i.t("battle.guardStance"), e, m)] : [];
      for (const r of res) {
        if (r.who === "me") e -= r.dmg;
        else if (r.who === "enemy") m -= r.dmg;
        else m = b.player.stat("체력"); // 소지품 (회복 등)
        queue.push(snap(r.who === "item" ? i.t(`battle.itemUse.${r.item}`) : this.line(b, r), e, m));
      }
      if (b.over) queue.push(snap(i.t(`battle.${b.over}`, { enemy }), e, m));
      busy = true;
      mode = "cmd"; // 행동한 뒤에는 명령 칸으로 (글이 다 흐를 때까지 흐리게)
      cursor = 0;
      drawMenu();
      step();
    };
    this.view.show(sec);
    busy = true;
    drawField();
    drawMenu();
    step();
    this.view.keys((e) => {
      if (busy) {
        if (e.key === "Enter" || e.key === " ") { step(); return true; }
        return false;
      }
      const cs = cells();
      const move = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -2, ArrowDown: 2 }[e.key];
      if (move) { cursor = (cursor + move + 4) % 4; drawMenu(); return true; }
      const n = Number(e.key);
      if (n >= 1 && n <= 4) { cursor = n - 1; if (cs[cursor].ok !== false) cs[cursor].run(); else drawMenu(); return true; }
      if (e.key === "Enter") { if (cs[cursor].ok !== false) cs[cursor].run(); return true; }
      if (e.key === "Escape" && mode !== "cmd") { toCmd(); return true; }
      return false;
    });
  }
}

// 메인 화면과 그 하위 화면(인과록, 업, 설정). 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 조작: 메인에서는 숫자키로 바로 이동, 하위 화면은 Esc로 돌아가기.




class MenuScreens {
  constructor(root, i18n) {
    this.layer = root.querySelector("#screen");
    this.i = i18n;
  }

  hide() {
    this.layer.hidden = true;
  }

  show(sec, onBack) {
    this.layer.hidden = false;
    this.layer.replaceChildren(sec);
    window.scrollTo({ top: 0 });
    if (onBack) {
      const back = el("button", "back");
      back.type = "button";
      back.innerHTML = `${this.i.t("common.back")}<kbd>Esc</kbd>`;
      back.addEventListener("click", onBack);
      sec.prepend(back);
      Keys.set((e) => (e.key === "Escape" ? (onBack(), true) : false));
    }
  }

  // 이어서 하기 옆에 흐리게: "12장 · 노인의 전각"
  whereNote(w) {
    if (!w) return "";
    const title = w.eventId ? this.i.ev(w.eventId, "title") : "";
    const ch = this.i.t("game.chapter", { n: w.chapter });
    return title && title !== `${w.eventId}.title` ? `${ch} · ${title}` : ch;
  }

  // info: { lives, karma, hasSave, where }, h: { continue, newLife, achievements, karma, settings }
  main(info, h) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "menu");
    sec.innerHTML = `
      <div class="mast">
        <p class="eyebrow">${t("menu.eyebrow")}</p>
        <h1>${t("menu.title")}</h1>
        <p class="sub">${info.lives ? t("menu.livesLine", { n: `<b>${info.lives}</b>`, k: `<b>${info.karma}</b>` }) : t("menu.noLives")}</p>
      </div>`;
    const items = [
      { key: "continue", run: h.continue, off: !info.hasSave, note: info.hasSave ? this.whereNote(info.where) : t("menu.noSave") },
      { key: "newLife", run: h.newLife, note: info.hasSave ? t("menu.loseSave") : "" },
      { key: "achievements", run: h.achievements },
      { key: "karma", run: h.karma },
      { key: "settings", run: h.settings },
    ];
    const nav = el("nav", "menu-list");
    let armed = false; // 새로 하기 두 번 확인용
    items.forEach((it, n) => {
      const b = el("button", "menu-item");
      b.type = "button";
      b.disabled = !!it.off;
      b.innerHTML = `<span class="num">${n + 1}</span><span class="lbl">${t("menu." + it.key)}</span>${it.note ? `<span class="mnote">${it.note}</span>` : ""}`;
      b.addEventListener("click", () => {
        if (it.key === "newLife" && info.hasSave && !armed) {
          armed = true;
          b.classList.add("armed");
          b.querySelector(".mnote").textContent = t("menu.confirmNew");
          return;
        }
        it.run();
      });
      nav.append(b);
    });
    sec.append(nav);
    this.show(sec);
    // 숫자 키로 고른 항목을 기억해 두고, 엔터는 그 항목을 누른다(처음엔 1번)
    let sel = items.findIndex((it) => !it.off);
    Keys.set((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= items.length && !items[n - 1].off) { sel = n - 1; nav.children[sel].focus(); nav.children[sel].click(); return true; }
      if (e.key === "Enter" && sel >= 0) { nav.children[sel].click(); return true; }
      return false;
    });
  }

  // 인과록: 인물 / 무공 / 집단 / 물건 / 업적 탭.
  // 도감 항목은 단계마다 req 중 하나라도 겪었으면 열린다(모든 생 누적). 첫 단계 전에는 이름도 ???.
  codex(sections, achList, record, onBack, startTab = "people") {
    const i = this.i;
    const sec = el("section", "sub-screen codex");
    const unlocked = record.data.achievements;
    const opened = (st) => st.req.some((r) => record.knows(r));
    const tabs = sections.map((s) => s.id).concat("achievements");
    const countOf = (id) => {
      if (id === "achievements") return [achList.filter((a) => unlocked.includes(a.id)).length, achList.length];
      const es = sections.find((s) => s.id === id).entries;
      return [es.filter((e) => opened(e.stages[0])).length, es.length];
    };
    sec.innerHTML = `<h2>${i.t("achievementsScreen.title")}</h2><div class="tabs main-tabs" role="tablist"></div><div class="codex-body"></div>`;
    const bar = sec.querySelector(".main-tabs");
    const body = sec.querySelector(".codex-body");

    // 탭 안에서 카테고리별로 나눠 보기 (전체 + 카테고리 하위 탭)
    const renderEntries = (id) => {
      const secData = sections.find((s) => s.id === id);
      // 아직 하나도 열리지 않은 갈래는 이름부터 감춘다 (모르는 세력·장소가 미리 드러나지 않게)
      const cats = (secData.categories ?? []).filter((c) => secData.entries.some((e) => e.category === c && opened(e.stages[0])));
      body.innerHTML = `<div class="tabs sub-tabs" role="tablist"></div><div class="codex-cat"></div>`;
      const sbar = body.querySelector(".sub-tabs");
      const stabs = [{ id: "*", label: i.t("achievementsScreen.all"), items: secData.entries }].concat(
        cats.map((c) => ({ id: c, label: i.t(`codex.categories.${id}.${c}`), items: secData.entries.filter((e) => e.category === c) }))
      );
      stabs.forEach((tab) => {
        const b = el("button", "tab");
        b.type = "button";
        b.dataset.id = tab.id;
        b.innerHTML = `${tab.label}<small>${tab.items.filter((e) => opened(e.stages[0])).length}/${tab.items.length}</small>`;
        b.addEventListener("click", () => drawCat(tab));
        sbar.append(b);
      });
      const drawCat = (tab) => {
        sbar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === tab.id));
        listEntries(tab.items, body.querySelector(".codex-cat"));
      };
      drawCat(stabs[0]);
    };
    const listEntries = (es, target) => {
      target.innerHTML = `<ul class="ach-list codex-list">${es
        .map((e) => {
          const open = e.stages.filter(opened);
          if (!open.length || !opened(e.stages[0])) return `<li><b>${i.t("codex.unknown")}</b></li>`;
          const lines = e.stages.map((st, n) => (opened(st) ? `<span>${i.codex(e.id, `s${n}`)}</span>` : "")).join("");
          const more = open.length < e.stages.length ? `<span class="more">${i.t("codex.more")}</span>` : "";
          return `<li class="on"><b>${i.codex(e.id, "name")}</b>${lines}${more}</li>`;
        })
        .join("")}</ul>`;
    };
    const renderAch = () => {
      body.innerHTML = `<p class="sub">${i.t("achievementsScreen.sub", { got: `<b>${unlocked.filter((a) => achList.some((x) => x.id === a)).length}</b>`, all: achList.length, n: `<b>${record.data.outcomes.length}</b>` })}</p><div class="tabs sub-tabs" role="tablist"></div><ul class="ach-list"></ul>`;
      const sbar = body.querySelector(".sub-tabs");
      const ul = body.querySelector(".ach-list");
      const cats = Object.keys(i.t("achievementsScreen.categories")).filter((c) => achList.some((a) => a.category === c && unlocked.includes(a.id)));
      const stabs = [{ id: "*", label: i.t("achievementsScreen.all"), items: achList }].concat(
        cats.map((c) => ({ id: c, label: i.t(`achievementsScreen.categories.${c}`), items: achList.filter((a) => a.category === c) }))
      );
      const draw = (tab) => {
        sbar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === tab.id));
        ul.innerHTML = tab.items
          .map((a) =>
            unlocked.includes(a.id)
              ? `<li class="on"><b>${i.ach(a.id, "name")}</b><span>${i.ach(a.id, "desc")}</span><span class="cond">${i.t("achievementsScreen.condLabel")} · ${i.ach(a.id, "cond")}</span></li>`
              : `<li><b>${i.t("achievementsScreen.locked")}</b><span>${i.ach(a.id, "hint")}</span></li>`
          )
          .join("");
      };
      stabs.forEach((tab) => {
        const b = el("button", "tab");
        b.type = "button";
        b.id = `tab-${tab.id === "*" ? "all" : tab.id}`;
        b.dataset.id = tab.id;
        const n = tab.items.filter((a) => unlocked.includes(a.id)).length;
        b.innerHTML = `${tab.label}<small>${n}/${tab.items.length}</small>`;
        b.addEventListener("click", () => draw(tab));
        sbar.append(b);
      });
      draw(stabs[0]);
    };
    const select = (id) => {
      bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === id));
      id === "achievements" ? renderAch() : renderEntries(id);
    };
    tabs.forEach((id) => {
      const b = el("button", "tab");
      b.type = "button";
      b.id = `codex-${id}`;
      b.dataset.id = id;
      const [got, all] = countOf(id);
      b.innerHTML = `${i.t(`codex.sections.${id}`)}<small>${got}/${all}</small>`;
      b.addEventListener("click", () => select(id));
      bar.append(b);
    });
    select(startTab);
    this.show(sec, onBack);
  }

  // 업 상점. shop: KarmaShop, onBuy(id)
  karma(total, shop, onBuy, onBack, tr, mem) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `
      <h2>${t("karmaScreen.title")}</h2>
      <p class="big">${total}</p>
      <p class="sub">${t("karmaScreen.sub")}</p>
      <div class="tabs main-tabs shop-tabs" role="tablist"></div>
      <ul class="shop base"></ul>
      <ul class="shop traits"></ul>
      <ul class="shop memories"></ul>
      <ul class="shop arts"></ul>`;
    // 탭: 타고난 바탕 / 체질 (산 뒤에 다시 그려도 보던 탭을 유지)
    const allMems = shop.visibleMemories();
    const mems = allMems.filter((m) => m.tab !== "arts");
    const arts = allMems.filter((m) => m.tab === "arts"); // 업에 새긴 무공: 기억과 같은 방식, 탭만 따로
    const unseen = shop.unseenMemories();
    const tabs = [["base", t("karmaScreen.shopTitle")], ["traits", t("karmaScreen.traitTitle")]];
    if (mems.length) tabs.push(["memories", t("karmaScreen.memoryTitle")]); // 장의 끝을 본 뒤에만 보인다
    if (arts.length) tabs.push(["arts", t("karmaScreen.artTitle")]);
    const bar = sec.querySelector(".shop-tabs");
    const pick = (id) => {
      this.shopTab = id;
      bar.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.id === id)));
      sec.querySelector(".shop.base").hidden = id !== "base";
      sec.querySelector(".shop.traits").hidden = id !== "traits";
      sec.querySelector(".shop.memories").hidden = id !== "memories";
      sec.querySelector(".shop.arts").hidden = id !== "arts";
      if ((id === "memories" || id === "arts") && unseen.length) mem.seen();
    };
    for (const [id, label] of tabs) {
      const b = el("button", "tab");
      b.type = "button";
      b.dataset.id = id;
      b.id = `shop-tab-${id}`;
      b.innerHTML = label + (id === "memories" && unseen.length ? ` <span class="new-mark">${t("game.fresh")}</span>` : "");
      b.addEventListener("click", () => pick(id));
      bar.append(b);
    }
    const ul = sec.querySelector(".shop.base");
    shop.items.forEach((it, n) => {
      const lv = shop.level(it.id);
      const price = shop.price(it.id);
      const max = shop.isMax(it.id);
      const li = el("li", "shop-row");
      li.innerHTML = `<div class="shop-info"><b>${t(`karmaScreen.items.${it.id}.name`)}</b><span>${t(`karmaScreen.items.${it.id}.desc`)}</span><span class="shop-lv">${t("karmaScreen.level", { v: lv * it.amount })}</span></div>`;
      const b = el("button", "shop-buy");
      b.type = "button";
      b.id = `buy-${n}`;
      b.textContent = max ? t("karmaScreen.max") : t("karmaScreen.buy", { p: price });
      b.disabled = max || total < price;
      b.addEventListener("click", () => onBuy(it.id));
      li.append(b);
      ul.append(li);
    });
    const tl = sec.querySelector(".traits");
    shop.traits.forEach((it, n) => {
      const lv = shop.traitLevel(it.id);
      const on = shop.traitOn(it.id);
      const tier = shop.tierOf(it);
      const next = shop.nextTier(it);
      const li = el("li", "shop-row");
      const state = lv ? `<span class="shop-lv">${t(on ? "karmaScreen.traitOn" : "karmaScreen.traitOff")}</span>` : "";
      // 단계가 여럿인 체질은 단계 점(●○)과 지금 단계·다음 경지를 보여 준다
      const multi = it.tiers.length > 1;
      const pips = multi ? `<span class="tier-pips">${it.tiers.map((_, k) => (k < lv ? "●" : "○")).join("")}</span>` : "";
      const up = multi && lv
        ? `<span class="tier-line">${next ? t("karmaScreen.tierNext", { lv, name: t(`karmaScreen.traits.${next.name}.name`), desc: t(`karmaScreen.traits.${next.name}.desc`) }) : t("karmaScreen.tierMax", { lv })}</span>`
        : "";
      li.innerHTML = `<div class="shop-info"><b>${t(`karmaScreen.traits.${tier.name}.name`)}${pips}</b><span class="lore">${t(`karmaScreen.traits.${tier.name}.lore`)}</span><span>${t(`karmaScreen.traits.${tier.name}.desc`)}</span>${up}${state}</div>`;
      const box = el("div", "shop-btns");
      if (lv) {
        const tg = el("button", "shop-buy");
        tg.type = "button";
        tg.id = `trait-${n}-toggle`;
        tg.textContent = t(on ? "karmaScreen.turnOff" : "karmaScreen.turnOn");
        tg.addEventListener("click", () => tr.toggle(it.id));
        box.append(tg);
      }
      if (next) {
        const b = el("button", "shop-buy");
        b.type = "button";
        b.id = `trait-${n}`;
        b.textContent = t(lv ? "karmaScreen.upgrade" : "karmaScreen.buy", { p: next.price });
        b.disabled = total < next.price;
        b.addEventListener("click", () => tr.buy(it.id));
        box.append(b);
      }
      li.append(box);
      tl.append(li);
    });
    const drawMem = (ml, list, pre) => list.forEach((m, n) => {
      const owned = shop.memoryOwned(m.id);
      const on = shop.memoryOn(m.id);
      const li = el("li", "shop-row");
      const state = owned ? `<span class="shop-lv">${t(on ? "karmaScreen.traitOn" : "karmaScreen.traitOff")}</span>` : "";
      const fresh = unseen.includes(m.id) ? ` <span class="new-mark">${t("game.fresh")}</span>` : "";
      li.innerHTML = `<div class="shop-info"><b>${t(`karmaScreen.memories.${m.id}.name`)}${fresh}</b><span class="lore">${t(`karmaScreen.memories.${m.id}.lore`)}</span><span>${t(`karmaScreen.memories.${m.id}.desc`)}</span>${state}</div>`;
      const box = el("div", "shop-btns");
      const b = el("button", "shop-buy");
      b.type = "button";
      b.id = `${pre}-${n}`;
      if (owned) {
        b.textContent = t(on ? "karmaScreen.turnOff" : "karmaScreen.turnOn");
        b.addEventListener("click", () => mem.toggle(m.id));
      } else {
        b.textContent = t("karmaScreen.buy", { p: m.price });
        b.disabled = total < m.price;
        b.addEventListener("click", () => mem.buy(m.id));
      }
      box.append(b);
      li.append(box);
      ml.append(li);
    });
    drawMem(sec.querySelector(".shop.memories"), mems, "memory");
    drawMem(sec.querySelector(".shop.arts"), arts, "art");
    const ok = (tab) => (tab === "memories" ? mems.length : tab === "arts" ? arts.length : true);
    pick(this.shopTab && ok(this.shopTab) ? this.shopTab : "base");
    this.show(sec, onBack);
  }

  // current: 설정값, languages: [{id, name}], h: { fontSize, language, wipe }
  settings(current, languages, h, onBack) {
    const t = (k) => this.i.t(k);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `<h2>${t("settings.title")}</h2>
      <div class="set-row"><span class="set-lbl">${t("settings.fontSize")}</span><div class="seg" id="seg-fs" role="group"></div></div>
      <div class="set-row"><span class="set-lbl">${t("settings.termMode")}</span><p class="set-note">${t("settings.termNote")}</p><div class="seg" id="seg-term" role="group"></div></div>
      <div class="set-row"><span class="set-lbl">${t("settings.sound")}</span><div class="seg" id="seg-sound" role="group"></div></div>
      ${languages.length > 1 ? `<div class="set-row"><span class="set-lbl">${t("settings.language")}</span><div class="seg" id="seg-lang" role="group"></div></div>` : ""}
      <div class="set-row danger"><span class="set-lbl">${t("settings.wipe")}</span><p class="set-note">${t("settings.wipeNote")}</p></div>`;
    segment(sec.querySelector("#seg-fs"), FONT_SIZES.map((f) => ({ id: f.id, label: t(`settings.sizes.${f.id}`) })), current.fontSize, "fs", h.fontSize);
    segment(sec.querySelector("#seg-term"), TERM_MODES.map((m) => ({ id: m, label: t(`settings.termModes.${m}`) })), current.termMode ?? "twice", "term", h.termMode);
    segment(sec.querySelector("#seg-sound"), SOUND_LEVELS.map((x) => ({ id: x.id, label: t(`settings.sounds.${x.id}`) })), current.sound ?? "mid", "sound", h.sound);
    const langSeg = sec.querySelector("#seg-lang");
    if (langSeg) segment(langSeg, languages.map((l) => ({ id: l.id, label: l.name })), current.language, "lang", h.language);

    const wipe = el("button", "wipe");
    wipe.type = "button";
    wipe.id = "wipe";
    wipe.textContent = t("settings.wipeBtn");
    let armed = false;
    wipe.addEventListener("click", () => {
      if (!armed) {
        armed = true;
        wipe.textContent = t("settings.wipeConfirm");
        wipe.classList.add("armed");
        return;
      }
      h.wipe();
      wipe.textContent = t("settings.wiped");
      wipe.disabled = true;
    });
    sec.querySelector(".danger").append(wipe);
    // 시험용 업 버튼 (config.testKarma가 0이면 숨김)
    if (h.testKarma) {
      const row = el("div", "set-row");
      row.innerHTML = `<span class="set-lbl">${t("settings.test")}</span>`;
      const tb = el("button", "wipe");
      tb.type = "button";
      tb.id = "test-karma";
      tb.textContent = t("settings.testKarma");
      tb.addEventListener("click", () => { h.testKarma(); tb.textContent = t("settings.testDone"); });
      row.append(tb);
      if (h.testBattle) {
        const fb = el("button", "wipe");
        fb.type = "button";
        fb.id = "test-battle";
        fb.textContent = t("settings.testBattle");
        fb.addEventListener("click", () => h.testBattle());
        row.append(fb);
      }
      sec.append(row);
    }
    this.show(sec, onBack);
  }

  // 시험용 전투 설정: 능력치 입력과 무공 선택. onFight(stats, artIds)
  battleTest(base, arts, items, onFight, onBack) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "sub-screen");
    const keys = ["경지", "최대체력", "근골", "민첩", "행운", "내공"];
    sec.innerHTML = `<h2>${t("settings.testBattle")}</h2><p class="sub">${t("settings.testBattleNote")}</p>
      <div class="bt-grid">${keys.map((k) => `<label>${this.i.stat(k)}<input type="number" min="0" id="bt-${k}" value="${base.stat(k)}"></label>`).join("")}</div>
      <div class="bt-arts">${arts.map((a) => `<label><input type="checkbox" value="${a.id}"> ${this.i.combat(`art.${a.id}.name`)}</label>`).join("")}</div>
      <div class="bt-arts bt-items">${items.map((x) => `<label><input type="checkbox" value="${x.id}" ${base.hasItem(x.id) ? "checked" : ""}> ${this.i.item(x.id)}</label>`).join("")}</div>`;
    const go = el("button", "next");
    go.type = "button";
    go.textContent = t("settings.testFight");
    go.addEventListener("click", () => {
      const stats = Object.fromEntries(keys.map((k) => [k, Number(sec.querySelector(`#bt-${k}`).value) || 0]));
      const ids = [...sec.querySelectorAll(".bt-arts:not(.bt-items) input:checked")].map((x) => x.value);
      const itemIds = [...sec.querySelectorAll(".bt-items input:checked")].map((x) => x.value);
      onFight(stats, ids, itemIds);
    });
    sec.append(go);
    this.show(sec, onBack);
  }
}

function segment(box, options, currentId, prefix, onPick) {
  options.forEach((o) => {
    const b = el("button", "seg-btn" + (o.id === currentId ? " on" : ""));
    b.type = "button";
    b.id = `${prefix}-${o.id}`;
    b.textContent = o.label;
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      onPick(o.id);
    });
    box.append(b);
  });
}

// 앱 흐름: 메인 화면 ↔ 플레이(장면 → 선택 → 결과 → 다음 장면) → 정산 → 메인.




















class App {
  constructor(events, achievements, codex, i18n, settings, combat) {
    this.codex = codex;
    this.combat = combat; // { enemies, arts }
    this.rng = new Rng();
    this.selector = new EventSelector(events, this.rng, CONFIG);
    this.resolver = new ResultResolver(this.rng, CONFIG);
    this.record = new LifeRecord(CONFIG);
    this.shop = new KarmaShop(CONFIG, this.record);
    this.novelty = new NoveltyWeigher(this.record, CONFIG);
    this.selector.useNovelty(this.novelty);
    this.selector.useSides(new SideLean(CONFIG));
    this.sound = new SoundBank();
    this.sound.setLevel(settings.data.sound);
    this.saves = new SaveManager(CONFIG);
    this.settings = settings;
    this.i18n = i18n;
    // 장면 글 갈래(사도련 편이면 맹주 → 사도련주 등)
    this.variants = new TextVariants(events);
    i18n.evFilter = (id, v) => this.variants.apply(id, v, this.state);
    this.achievements = achievements;
    this.view = new GameView(document, CONFIG, i18n);
    this.view.onPageTurn = () => this.sound.play("page");
    this.battleScreen = new BattleScreen(this.view, i18n);
    if (!CONFIG.showLog) document.body.classList.add("no-log");
    this.menu = new MenuScreens(document, i18n);
  }

  // ── 메인 화면 ──
  home() {
    this.view.close();
    this.menu.main(
      { lives: this.record.data.life, karma: this.record.data.karma, hasSave: this.saves.has(), where: this.saves.peek() },
      {
        continue: () => this.continueLife(),
        newLife: () => this.newLife(),
        achievements: () => this.menu.codex(this.codex, this.achievements, this.record, () => this.home()),
        karma: () => this.openShop(),
        settings: () => this.openSettings(),
      }
    );
  }

  openShop() {
    this.menu.karma(
      this.record.data.karma,
      this.shop,
      (id) => { this.shop.buy(id); this.openShop(); },
      () => this.home(),
      { buy: (id) => { this.shop.buyTrait(id); this.openShop(); }, toggle: (id) => { this.shop.toggleTrait(id); this.openShop(); } },
      { buy: (id) => { this.shop.buyMemory(id); this.openShop(); }, toggle: (id) => { this.shop.toggleMemory(id); this.openShop(); }, seen: () => this.shop.markMemoriesSeen() }
    );
  }

  async openSettings() {
    const langs = await Promise.all(
      CONFIG.languages.map(async (id) => {
        await this.i18n.use(id);
        return { id, name: this.i18n.t("lang.name") };
      })
    );
    await this.i18n.use(this.settings.data.language);
    this.menu.settings(
      this.settings.data,
      langs,
      {
        fontSize: (id) => this.settings.set("fontSize", id),
        termMode: (id) => this.settings.set("termMode", id),
        sound: (id) => { this.settings.set("sound", id); this.sound.setLevel(id); this.sound.play("realm"); },
        language: async (id) => { this.settings.set("language", id); await this.i18n.use(id); this.openSettings(); },
        wipe: () => { this.record.wipe(); this.saves.clear(); },
        testKarma: CONFIG.testKarma ? () => this.record.grant(CONFIG.testKarma) : null,
        testBattle: CONFIG.testKarma ? () => this.openBattleTest() : null,
      },
      () => this.home()
    );
  }

  // 인과록 도감: 지금 상태에서 알게 된 것을 기록
  learnFrom(s, evId) {
    this.record.learn([
      `ev:${evId}`,
      ...[...s.flags].map((f) => `flag:${f}`),
      ...s.items.map((x) => `item:${x}`),
      ...Object.keys(s.bonds).map((b) => `bond:${b}`),
      ...s.achievements.map((a) => `ach:${a}`),
      ...(s.affiliation ? [`aff:${s.affiliation}`] : []),
    ]);
  }

  // ── 플레이 ──
  enterGame() {
    this.menu.hide();
    this.state.traits = this.shop.activeLevels();
    this.state.pastBonds = { ...this.record.data.bondsMax };
    this.state.pastAchievements = [...this.record.data.achievements]; // 지난 생들에서 얻은 업적
    this.state.pastKnown = [...this.record.data.known]; // 지난 생들에서 겪은 것(ev:/flag:/item:/aff:/ach:/bond:)
    this.view.termContext = { mode: () => this.settings.data.termMode, counts: this.state.termCounts };
    this.view.open(() => this.home());
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.stats(this.state);
    this.view.renderLog(this.state.log);
  }

  newLife() {
    this.saves.clear();
    this.state = new GameState(CONFIG);
    this.state.stats.업 = this.record.data.karmaEarned; // 지금까지 쌓은 업 총량이 확률 보정에 쓰인다 (화면에는 안 보임)
    this.shop.apply(this.state);
    for (const f of this.shop.memoryFlags()) this.state.flags.add(f); // 켜 둔 기억
    this.state.stats.체력 = this.state.stat("최대체력"); // 최대 체력으로 시작
    this.record.learn(this.state.items.map((x) => `item:${x}`));
    const life = this.record.startLife();
    this.enterGame();
    const first = this.selector.byId(CONFIG.prologueId);
    // 도입부(intro)는 맨 첫 생에만 보여준다.
    if (first?.intro && life === 1) return this.view.intro(first.id, () => this.play(first));
    this.play(first ?? this.selector.next(this.state));
  }

  continueLife() {
    const saved = this.saves.load();
    if (!saved) return this.home();
    this.state = saved.state;
    this.enterGame();
    this.play(saved.eventId ? this.selector.byId(saved.eventId) : null);
  }

  play(ev) {
    if (!ev) return this.finish("end");
    const s = this.state;
    s.seen.add(ev.id);
    if (ev.situation) s.situation = ev.situation; // 상황 장면에 들어서면 그 상황에 처한다
    s.lastEventId = ev.id;
    s.recent = [...(s.recent ?? []), ev.id].slice(-3);
    this.saves.save(s, ev.id);
    // '처음' 표시: 두 번째 생부터, 한 번도 골라 본 적 없는 선택지
    const isFresh = (c) => this.record.data.life > 1 && this.novelty.isFreshChoice(ev.id, c.id, s);
    this.view.chapter(s.scenes + 1);
    const choices = this.rankChoices(ev, s);
    this.view.scene(ev, choices, (choice) => {
      s.scenes += 1;
      const wall = CONFIG.stagnation.walls[s.stat("경지")];
      s.stagnant = wall != null && s.stat("내공") >= wall ? (s.stagnant ?? 0) + 1 : 0;
      // memory=false인 장면(첫 장면 등)은 전생의 기억 보정을 받지 않는다.
      const deaths = ev.memory === false ? 0 : this.record.deathsAt(ev.id, choice.id);
      let outcome = this.resolver.pick(choice, s, deaths);
      // 체질: 켜 둔 체질이 막는 결과가 나오면 그 결과들을 빼고 다시 굴린다.
      let trait = this.shop.blocker(outcome, choice);
      if (trait) {
        let outs = choice.outcomes.filter((o) => !this.shop.blocker(o, choice));
        if (!outs.length) trait = null;
        else {
          // 남은 결과에 기본 결과(chance 없음)가 없으면 마지막 결과를 기본으로
          if (!outs.some((o) => o.chance == null)) outs = outs.map((o, k) => (k === outs.length - 1 ? { ...o, chance: undefined, src: o } : o));
          const re = this.resolver.pick({ ...choice, outcomes: outs }, s, deaths);
          outcome = re.src ?? re;
        }
      }
      // 확률 보정 때문에 결과가 복사본일 수 있어서, 원본 위치는 src나 글로 찾는다
      const oi = choice.outcomes.findIndex((o) => o === outcome || o === outcome.src || o.text === outcome.text);
      let textKey = `c${choice.id}.o${oi}`;
      let textEv = ev.id;
      s.outcomesSeen.push(`${ev.id}:${textKey}`);
      // 검은 비늘: 죽을 결과가 나오면 한 생에 한 번 막는다. 장면마다 막는 글(ev.scale)이 따로 있을 수 있고,
      // 그 글에 다음 장면이 없으면 같은 장면을 다시 띄운다(목숨만 건지고 성공은 다시 굴린다).
      const guard = CONFIG.scaleGuard;
      let replay = false;
      if (this.resolver.kills(outcome, s) && s.hasItem(guard.item) && !s.flags.has(guard.usedFlag)) {
        const gev = this.selector.byId(ev.scale ?? guard.event);
        outcome = gev.choices[0].outcomes[0];
        textEv = gev.id;
        textKey = "c1.o0";
        replay = !outcome.effects?.next_event && !ev.scaleEnds;
      }
      const rare = this.resolver.isRare(outcome);
      if (rare) s.rare += 1;
      const changes = this.resolver.apply(outcome, s);
      s.log.push({ ev: ev.id, c: choice.id, changes, dead: s.dead });
      this.learnFrom(s, ev.id);
      this.view.stats(s);
      this.view.renderLog(s.log);
      this.sound.play(this.cueFor(s, changes, rare || !!outcome.fortune));

      if (s.dead) {
        this.saves.clear();
        this.record.recordDeath(ev.id, choice.id);
        return this.view.outcome(ev.id, choice.id, textKey, changes, "game.closeEyes", () => this.finish("death"), rare, !!outcome.fortune, textEv, trait?.name);
      }
      // 귀결: 이야기가 매듭지어지면 결과를 보여 준 뒤 생을 마친다
      if (s.ending) {
        this.saves.clear();
        return this.view.outcome(ev.id, choice.id, textKey, changes, "game.continue", () => this.finish("ending"), rare, !!outcome.fortune, textEv, trait?.name);
      }
      // 전투: 결과를 보여 준 뒤 전투 화면으로
      const fight = outcome.effects?.전투;
      if (fight) {
        this.saves.save(s, ev.id);
        return this.view.outcome(ev.id, choice.id, textKey, changes, "game.continue", () => this.fight(fight, ev, choice, oi), rare, !!outcome.fortune, textEv, trait?.name);
      }
      // 다음 장면을 지금 정해 저장해 둔다 (껐다 켜서 다시 고르기 방지).
      // 마기가 차오르면 다음 장면은 마두 발작
      const mad = CONFIG.madness;
      const nextId = s.stat(mad.stat) >= mad.threshold && ev.id !== mad.event ? mad.event : outcome.effects?.next_event ?? (replay ? ev.id : null);
      const next = nextId ? this.selector.byId(nextId) : this.selector.next(s);
      this.saves.save(s, next?.id ?? null);
      this.view.outcome(ev.id, choice.id, textKey, changes, "game.continue", () => this.play(next), rare, !!outcome.fortune, textEv, trait?.name);
    }, isFresh, !!ev.dejavu && meetsCondition(s, { past_bond_min: { [ev.dejavu.person]: ev.dejavu.min } }));
  }

  // 전투 한 판. fight = { enemy, lethal, win: {text, effects}, lose: {text, effects}, next? }
  // 지금 상태에서 이 선택지로 죽을 확률(%). 결과 판정(pick)·체질·검은 비늘 규칙을 그대로 따른다.
  // 결과에 맞는 효과음 하나 (죽음 > 귀결 > 경지 상승 > 기연·드문 인과)
  cueFor(s, changes, lucky) {
    if (s.dead) return "death";
    if (s.ending) return "ending";
    if (changes.some((c) => c.type === "realm")) return "realm";
    return lucky ? "fortune" : null;
  }

  deathChance(ev, choice, s) {
    const deaths = ev.memory === false ? 0 : this.record.deathsAt(ev.id, choice.id);
    const guard = CONFIG.scaleGuard;
    // 검은 비늘이 남아 있으면 이 선택지에서는 죽지 않는다
    if (s.hasItem(guard.item) && !s.flags.has(guard.usedFlag)) return 0;
    const dies = (o) => this.resolver.kills(o, s);
    let outs = choice.outcomes.filter((o) => !this.shop.blocker(o, choice));
    const reroll = outs.length && outs.length < choice.outcomes.length;
    if (reroll && !outs.some((o) => o.chance == null)) outs = outs.map((o, k) => (k === outs.length - 1 ? { ...o, chance: undefined, src: o } : o));
    const reDeath = reroll ? this.resolver.distribution({ ...choice, outcomes: outs }, s, deaths).reduce((a, [o, p]) => a + (dies(o.src ?? o) ? p : 0), 0) / 100 : 0;
    let total = 0;
    for (const [o0, p] of this.resolver.distribution(choice, s, deaths)) {
      const o = o0.src ?? o0;
      if (reroll && this.shop.blocker(o, choice)) total += p * reDeath;
      else if (dies(o)) total += p;
    }
    return total;
  }

  // 죽을 확률이 기준 이상이면 비추천으로 표시하고 맨 뒤로 보낸다.
  rankChoices(ev, s) {
    const list = this.selector.availableChoices(ev, s).map((c) => ({ ...c, warn: this.deathChance(ev, c, s) >= CONFIG.warnDeath }));
    return [...list.filter((c) => !c.warn), ...list.filter((c) => c.warn)];
  }

  fight(fight, ev, choice, oi) {
    const s = this.state;
    const enemy = this.combat.enemies.find((x) => x.id === fight.enemy);
    const arts = this.combat.arts.filter((a) => meetsCondition(s, a.req));
    const battle = new Battle(this.rng, CONFIG, s, enemy, arts, this.combat.items ?? []);
    // 경지가 한 단계라도 높으면 싸울 것도 없이 이긴다
    const outclass = s.stat("경지") > enemy.realm;
    // 전투를 꺼 두면 화면 없이 공격만 주고받는 걸로 속으로 계산해 결과만 낸다
    const quiet = (done) => { while (!battle.over) battle.turn({ type: "attack" }); done(battle.over); };
    const run = outclass ? (done) => done("win") : CONFIG.combatEnabled ? (done) => this.battleScreen.run(battle, done) : quiet;
    run((result) => {
      battle.finish();
      // 목숨을 걸지 않은 싸움(lethal: false)은 져도 숨은 붙어 있다
      if (result === "lose" && fight.lethal === false) s.stats.체력 = Math.max(1, s.stat("체력"));
      const end = fight[result];
      const changes = this.resolver.apply({ effects: end.effects ?? {} }, s);
      s.log.push({ ev: ev.id, c: choice.id, changes, dead: s.dead });
      this.learnFrom(s, ev.id);
      this.view.stats(s);
      this.view.renderLog(s.log);
      this.sound.play(this.cueFor(s, changes, false));
      const key = `c${choice.id}.o${oi}.${result}`;
      if (s.dead) {
        this.saves.clear();
        this.record.recordDeath(ev.id, choice.id);
        return this.view.outcome(ev.id, choice.id, key, changes, "game.closeEyes", () => this.finish("death"));
      }
      const next = fight.next ? this.selector.byId(fight.next) : this.selector.next(s);
      this.saves.save(s, next?.id ?? null);
      this.view.outcome(ev.id, choice.id, key, changes, "game.continue", () => this.play(next));
    });
  }

  // 시험용: 산적의 길목 전투만 따로 해 보기. 진행 중인 생과 기록에는 영향 없음
  openBattleTest() {
    const saved = this.saves.load()?.state;
    const base = saved ?? new GameState(CONFIG);
    const enemy = this.combat.enemies.find((x) => x.id === CONFIG.testBattleEnemy);
    this.menu.battleTest(base, this.combat.arts, this.combat.items ?? [], (stats, artIds, itemIds) => {
      const s = new GameState(CONFIG);
      s.items = [...itemIds];
      Object.assign(s.stats, stats);
      s.stats.체력 = s.stat("최대체력");
      const arts = this.combat.arts.filter((a) => artIds.includes(a.id));
      this.menu.hide();
      this.view.open(() => this.openBattleTest());
      this.view.header(this.record.data.life, this.record.data.karma);
      this.view.stats(s);
      const battle = new Battle(this.rng, CONFIG, s, enemy, arts, this.combat.items ?? []);
      this.battleScreen.run(battle, () => { battle.finish(); this.openBattleTest(); });
    }, () => this.openSettings());
  }

  finish(kind) {
    this.saves.clear();
    const summary = this.record.endLife(this.state);
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.lastEnding = this.state.ending;
    this.view.ending(kind, summary, () => this.home());
  }
}

async function boot() {
  const settings = new Settings(CONFIG);
  settings.apply();
  const i18n = new I18n(CONFIG.langDir);
  const lang = CONFIG.languages.includes(settings.data.language) ? settings.data.language : CONFIG.defaultLanguage;
  await i18n.use(lang);
  new Tooltip(document, i18n);
  const loader = new EventLoader(CONFIG.eventIndex, CONFIG.achievementsPath, CONFIG.codexPath);
  const [events, ach, codex, combat] = await Promise.all([loader.load(), loader.loadAchievements(), loader.loadCodex(), loader.loadCombat()]);
  new App(events, ach, codex, i18n, settings, combat).home();
}

boot();

})();
</script>

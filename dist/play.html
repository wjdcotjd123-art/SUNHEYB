// 브라우저 저장소 감싸기. 저장이 막힌 환경에서도 게임이 멈추지 않게 한다.
const Store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (_) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (_) {}
  },
};

// 시드 가능한 난수. 같은 시드면 같은 결과가 나와서 버그 재현이 쉽다.
class Rng {
  constructor(seed = Date.now()) {
    this.s = seed >>> 0;
  }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  percent() {
    return this.next() * 100;
  }
  pickWeighted(list, weightOf) {
    const total = list.reduce((s, x) => s + weightOf(x), 0);
    let r = this.next() * total;
    for (const x of list) {
      r -= weightOf(x);
      if (r < 0) return x;
    }
    return list[list.length - 1];
  }
}

// 한 번의 생(生) 동안의 주인공 상태.
class GameState {
  constructor(config) {
    this.stats = { ...config.startStats };
    this.items = [...config.startItems];
    this.flags = new Set();
    this.bonds = {};
    this.reputation = {};
    this.affiliation = null;
    this.seen = new Set();
    this.outcomesSeen = [];
    this.achievements = [];
    this.scenes = 0;
    this.lastEventId = null;
    this.rare = 0; // 이번 생에 터진 드문 인과 수
    this.log = []; // 하단 기록창 내용 {title, tag, changes, dead}
    this.dead = false;
  }
  stat(name) {
    return this.stats[name] ?? 0;
  }
  hasItem(name) {
    return this.items.includes(name);
  }
  addItem(name) {
    this.items.push(name);
  }
  removeItem(name) {
    const i = this.items.indexOf(name);
    if (i >= 0) this.items.splice(i, 1);
  }
}

// 데이터 읽기. 이벤트 묶음 목록은 data/events/index.json에 있다.
// 단일 파일로 빌드된 판에서는 window.EVENT_DATA / window.ACHIEVEMENT_DATA를 그대로 쓴다.
class EventLoader {
  constructor(indexPath, achievementsPath) {
    this.indexPath = indexPath;
    this.achievementsPath = achievementsPath;
  }
  async load() {
    if (window.EVENT_DATA) return this.merge(window.EVENT_DATA);
    const base = this.indexPath.slice(0, this.indexPath.lastIndexOf("/") + 1);
    const index = await (await fetch(this.indexPath)).json();
    const batches = await Promise.all(index.batches.map(async (f) => (await fetch(base + f)).json()));
    return this.merge(batches);
  }
  async loadAchievements() {
    const data = window.ACHIEVEMENT_DATA ?? (await (await fetch(this.achievementsPath)).json());
    return data.achievements;
  }
  merge(batches) {
    const byId = new Map();
    for (const b of batches) for (const ev of b.events) byId.set(ev.id, ev);
    return byId;
  }
}

// 조건 판정과 다음 장면 고르기.
// pool 종류: "pool"(기본, 무작위 등장) / "chain"(다른 장면의 next_event로만) / "fixed"(정해진 때에만, 예: 첫 장면)
function meetsCondition(state, cond = {}) {
  if (cond.items && !cond.items.every((i) => state.hasItem(i))) return false;
  if (cond.flags && !cond.flags.every((f) => state.flags.has(f))) return false;
  if (cond.flags_any && !cond.flags_any.some((f) => state.flags.has(f))) return false;
  if (cond.flags_none && cond.flags_none.some((f) => state.flags.has(f))) return false;
  if (cond.stat_min && !Object.entries(cond.stat_min).every(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.stat_min_any && !Object.entries(cond.stat_min_any).some(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.realm_min != null && state.stat("경지") < cond.realm_min) return false;
  if (cond.realm_max != null && state.stat("경지") > cond.realm_max) return false;
  // 소속: "none"이면 무소속일 때만, 이름이면 그 소속일 때만. affiliation_not은 그 소속이면 안 됨.
  const aff = state.affiliation ?? "none";
  if (cond.affiliation && cond.affiliation !== aff) return false;
  if (cond.affiliation_not && cond.affiliation_not.includes(aff)) return false;
  return true;
}

class EventSelector {
  constructor(eventsById, rng, config) {
    this.events = eventsById;
    this.rng = rng;
    this.config = config;
  }
  byId(id) {
    return this.events.get(id) ?? null;
  }
  next(state) {
    // repeat=true인 장면(수련 등)은 여러 번 나올 수 있다. 단, 방금 본 장면은 다른 후보가 있으면 건너뛴다.
    let pool = [...this.events.values()].filter(
      (ev) => (ev.pool ?? "pool") === "pool" && (ev.repeat || !state.seen.has(ev.id)) && meetsCondition(state, ev.conditions)
    );
    if (pool.length > 1) pool = pool.filter((ev) => ev.id !== state.lastEventId);
    if (!pool.length) return null;
    // 내 소속과 같은 group의 장면은 더 자주 나온다.
    const boost = (ev) => (ev.group && ev.group === state.affiliation ? this.config.affiliationBoost : 1);
    return this.rng.pickWeighted(pool, (ev) => (ev.weight ?? this.config.defaultWeight) * boost(ev));
  }
  availableChoices(ev, state) {
    return ev.choices.filter((c) => meetsCondition(state, c.condition));
  }
}

// 선택 결과 판정(확률 + 스탯 보정)과 효과 적용.
class ResultResolver {
  constructor(rng, config) {
    this.rng = rng;
    this.config = config;
  }

  chanceOf(outcome, state) {
    let c = outcome.chance;
    for (const [stat, per] of Object.entries(outcome.mods ?? {})) c += per * state.stat(stat);
    // 하한은 chanceMin이지만, 원래부터 그보다 낮게 잡은 극악 확률은 그대로 둔다.
    return Math.min(this.config.chanceMax, Math.max(Math.min(this.config.chanceMin, outcome.chance), c));
  }

  // 드문 인과: 기본 확률이 rareChance 이하이면서 죽음이 아닌 결과.
  isRare(outcome) {
    return outcome.chance != null && outcome.chance <= this.config.rareChance && !outcome.effects?.death;
  }

  // chance가 있는 결과들을 차례로 쌓고, 남은 확률은 chance 없는 결과가 가져간다.
  // deaths: 전생에 이 선택지에서 죽은 횟수. 죽음 확률을 조금 깎아준다(전생의 기억).
  //  - 죽음 결과에 chance가 있으면 그만큼 빼고,
  //  - 죽음이 나머지 확률이면 처음 나오는 평범한 생존 결과에 더한다.
  //  - 드문 인과(대박)는 배율로만 조금 올려서 대박의 희소함은 지킨다.
  pick(choice, state, deaths = 0) {
    const m = this.config.deathMemory;
    const bonus = Math.min(m.cap, deaths * m.perDeath);
    const outs = choice.outcomes;
    const fallback = outs.find((o) => o.chance == null) ?? null;
    const fallbackDeath = !!fallback?.effects?.death;
    let boosted = false;
    const r = this.rng.percent();
    let acc = 0;
    for (const o of outs) {
      if (o.chance == null) continue;
      let c = this.chanceOf(o, state);
      if (bonus) {
        if (o.effects?.death) c = Math.max(0, c - bonus);
        else if (this.isRare(o)) c *= 1 + Math.min(m.rareCap, deaths * m.rarePerDeath);
        else if (fallbackDeath && !boosted) { c += bonus; boosted = true; }
      }
      acc += c;
      if (r < acc) return o;
    }
    return fallback ?? outs[outs.length - 1];
  }

  // 효과를 적용하고, 화면에 보여줄 변화 목록(언어와 무관한 구조)을 돌려준다.
  apply(outcome, state) {
    const changes = [];
    const e = outcome.effects ?? {};
    for (const [k, v] of Object.entries(e)) {
      if (k === "death") state.dead = !!v;
      else if (k === "items") v.forEach((i) => { state.addItem(i); changes.push({ type: "gain", item: i, good: true }); });
      else if (k === "items_remove") v.forEach((i) => { state.removeItem(i); changes.push({ type: "lose", item: i, good: false }); });
      else if (k === "items_clear") { if (state.items.length) changes.push({ type: "loseAll", good: false }); state.items = []; }
      else if (k === "flags") v.forEach((f) => state.flags.add(f));
      else if (k === "flags_remove") v.forEach((f) => state.flags.delete(f));
      else if (k === "achievement") state.achievements.push(v);
      else if (k === "next_event") continue;
      else if (k === "realm_set") { state.stats.경지 = v; changes.push({ type: "realm", value: v, good: true }); }
      else if (k.endsWith("_set")) { const s = k.slice(0, -4); state.stats[s] = v; changes.push({ type: "set", stat: s, value: v, good: false }); }
      else if (k === "소속") {
        // 소속 "없음"은 무소속으로 되돌린다.
        state.affiliation = v === "없음" ? null : v;
        changes.push(v === "없음" ? { type: "leave", good: false } : { type: "join", name: v, good: true });
      }
      else if (k === "인연") { addAll(state.bonds, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "bond", name: who, delta: d, good: d > 0 }); }
      else if (k === "평판") { addAll(state.reputation, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "fame", name: who, delta: d, good: d > 0 }); }
      else if (typeof v === "number") {
        state.stats[k] = state.stat(k) + v;
        changes.push({ type: "stat", stat: k, delta: v, good: v > 0 });
      }
    }
    if (state.stat("체력") <= 0) state.dead = true;
    return changes;
  }
}

function addAll(target, deltas) {
  for (const [k, d] of Object.entries(deltas)) target[k] = (target[k] ?? 0) + d;
}


// 언어 파일 읽기와 글 꺼내기. 화면에 나가는 모든 글은 여기를 거친다.
// 언어 파일: lang/<언어>/ui.json, events.json, achievements.json, items.json, names.json(인물·세력), glossary.json(용어 풀이)
const FILES = ["ui", "events", "achievements", "items", "names", "glossary"];

class I18n {
  constructor(langDir) {
    this.langDir = langDir;
    this.packs = {};
    this.lang = null;
  }

  async use(lang) {
    if (!this.packs[lang]) {
      const inline = window.LANG_DATA?.[lang];
      this.packs[lang] =
        inline ??
        Object.fromEntries(
          await Promise.all(FILES.map(async (f) => [f, await (await fetch(`${this.langDir}/${lang}/${f}.json`)).json()]))
        );
    }
    this.lang = lang;
    this.p = this.packs[lang];
    document.documentElement.lang = lang;
  }

  // 화면 글자. 예: t("menu.title"), t("game.life", { n: 3 })
  t(path, vars) {
    let s = path.split(".").reduce((o, k) => o?.[k], this.p.ui);
    if (s == null) return path;
    if (vars && typeof s === "string") for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
    return s;
  }

  // 이벤트 글. 예: ev(id, "title"), ev(id, "c2.o0")
  ev(id, part) {
    return this.p.events[`${id}.${part}`] ?? `${id}.${part}`;
  }

  ach(id, field) {
    return this.p.achievements[`${id}.${field}`] ?? id;
  }

  item(id) {
    return this.p.items[id] ?? id.replaceAll("_", " ");
  }

  name(id) {
    return this.p.names?.[id] ?? id.replaceAll("_", " ");
  }

  // 용어 풀이. 없으면 null
  gloss(term) {
    return this.p.glossary?.[term] ?? null;
  }

  stat(id) {
    return this.p.ui.stats?.[id] ?? id;
  }

  realm(n) {
    return this.p.ui.realms?.[n] ?? String(n);
  }
}

// 회차(몇 번째 생)와 업(業), 인과록, 전생의 죽음 기록, 업 상점 단계.

const empty = () => ({ life: 0, karma: 0, karmaEarned: 0, outcomes: [], achievements: [], deaths: {}, shop: {} });

class LifeRecord {
  constructor(config) {
    this.config = config;
    const saved = Store.get(config.storage.meta, {});
    this.data = { ...empty(), ...saved };
    // 예전 기록에는 누적 업이 없으므로 남은 업으로 채운다.
    if (saved.karmaEarned == null) this.data.karmaEarned = this.data.karma;
  }
  save() {
    Store.set(this.config.storage.meta, this.data);
  }
  wipe() {
    this.data = empty();
    Store.remove(this.config.storage.meta);
  }
  startLife() {
    this.data.life += 1;
    this.save();
    return this.data.life;
  }
  // 전생의 기억: 어떤 선택지에서 몇 번 죽었는지
  deathsAt(evId, choiceId) {
    return this.data.deaths[`${evId}:${choiceId}`] ?? 0;
  }
  recordDeath(evId, choiceId) {
    const k = `${evId}:${choiceId}`;
    this.data.deaths[k] = (this.data.deaths[k] ?? 0) + 1;
    this.save();
  }
  spend(amount) {
    if (this.data.karma < amount) return false;
    this.data.karma -= amount;
    this.save();
    return true;
  }
  // 한 생이 끝날 때 업을 계산해 쌓는다.
  endLife(state) {
    const k = this.config.karma;
    const known = new Set(this.data.outcomes);
    const fresh = [...new Set(state.outcomesSeen)].filter((o) => !known.has(o));
    const newAch = [...new Set(state.achievements)].filter((a) => !this.data.achievements.includes(a));
    const parts = [
      { id: "scenes", value: state.scenes * k.perScene },
      { id: "fresh", value: fresh.length * k.perNewOutcome },
      { id: "realm", value: state.stat("경지") * k.perRealm },
      { id: "achievements", value: newAch.length * k.perAchievement },
      { id: "wealth", value: Math.max(0, Math.floor(state.stat("재물") / k.wealthPer)), note: state.stat("재물") },
      { id: "rare", value: (state.rare ?? 0) * k.perRare },
    ];
    const total = parts.reduce((s, p) => s + p.value, 0);
    this.data.outcomes.push(...fresh);
    this.data.achievements.push(...newAch);
    this.data.karma += total;
    this.data.karmaEarned += total;
    this.save();
    return { parts, total, newAch };
  }
}

// 업 상점: 업을 써서 타고난 바탕을 올린다. 산 단계는 매 생 시작할 때 적용된다.
class KarmaShop {
  constructor(config, record) {
    this.items = config.shop;
    this.record = record;
  }
  level(id) {
    return this.record.data.shop[id] ?? 0;
  }
  price(id) {
    const it = this.items.find((x) => x.id === id);
    return Math.round(it.base * Math.pow(it.growth, this.level(id)));
  }
  isMax(id) {
    const it = this.items.find((x) => x.id === id);
    return this.level(id) >= it.max;
  }
  buy(id) {
    if (this.isMax(id) || !this.record.spend(this.price(id))) return false;
    this.record.data.shop[id] = this.level(id) + 1;
    this.record.save();
    return true;
  }
  // 새 생의 상태에 산 만큼 더해준다.
  apply(state) {
    for (const it of this.items) state.stats[it.stat] = state.stat(it.stat) + it.amount * this.level(it.id);
  }
}

// 진행 중인 생 저장/불러오기. "다음에 볼 장면"까지 함께 저장해서
// 결과를 본 뒤 껐다 켜도 선택을 다시 할 수 없게 한다.


class SaveManager {
  constructor(config) {
    this.config = config;
    this.key = config.storage.save;
  }
  has() {
    return !!Store.get(this.key);
  }
  save(state, eventId) {
    Store.set(this.key, {
      eventId,
      state: {
        stats: state.stats,
        items: state.items,
        flags: [...state.flags],
        bonds: state.bonds,
        reputation: state.reputation,
        affiliation: state.affiliation,
        seen: [...state.seen],
        outcomesSeen: state.outcomesSeen,
        achievements: state.achievements,
        scenes: state.scenes,
        lastEventId: state.lastEventId,
        rare: state.rare,
        log: state.log,
      },
    });
  }
  load() {
    const raw = Store.get(this.key);
    if (!raw) return null;
    const s = new GameState(this.config);
    Object.assign(s, raw.state, { flags: new Set(raw.state.flags), seen: new Set(raw.state.seen) });
    return { state: s, eventId: raw.eventId };
  }
  clear() {
    Store.remove(this.key);
  }
}

// 키보드 입력을 지금 보이는 화면 하나에만 전달한다.

// 본문 표기 규칙을 HTML로 바꾼다. **굵게**, <red>…</red> 등 색 태그,
// {용어} 또는 {용어|보이는글} → 마우스를 올리면 풀이가 뜨는 단어.
// 색 태그: red(위험·피해) purple(독·마기) green(획득·상승) gold(기연·희귀)
const COLORS = ["red", "purple", "green", "gold"];

function lineToHtml(line) {
  let s = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const c of COLORS) {
    s = s.replaceAll(`&lt;${c}&gt;`, `<span class="c-${c}">`).replaceAll(`&lt;/${c}&gt;`, "</span>");
  }
  s = s.replace(/\{([^{}|]+)(?:\|([^{}]+))?\}/g, (_, term, shown) => `<span class="term" tabindex="0" data-term="${term}">${shown ?? term}</span>`);
  return s;
}

// 빈 줄을 기준으로 문단을 나눈다.
function linesToHtml(lines) {
  const paras = [[]];
  for (const l of lines) l === "" ? paras.push([]) : paras[paras.length - 1].push(lineToHtml(l));
  return paras.filter((p) => p.length).map((p) => `<p>${p.join("<br>")}</p>`).join("");
}

// 용어 풀이 창. 표시된 단어(.term)에 마우스를 올리면 뜨고, 떼면 사라진다.
// 휴대폰처럼 마우스가 없으면 누를 때마다 열고 닫는다. 키보드로 포커스해도 뜬다.
class Tooltip {
  constructor(root, i18n) {
    this.i = i18n;
    this.box = document.createElement("div");
    this.box.className = "gloss";
    this.box.setAttribute("role", "tooltip");
    this.box.hidden = true;
    root.body.append(this.box);
    this.current = null;

    const termOf = (e) => e.target.closest?.(".term");
    root.addEventListener("mouseover", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("mouseout", (e) => { const t = termOf(e); if (t && !t.contains(e.relatedTarget)) this.close(); });
    root.addEventListener("focusin", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("focusout", (e) => { if (termOf(e)) this.close(); });
    root.addEventListener("click", (e) => {
      const t = termOf(e);
      if (t && window.matchMedia("(hover: none)").matches) {
        this.current === t && !this.box.hidden ? this.close() : this.open(t);
      } else if (!t) this.close();
    });
    window.addEventListener("scroll", () => this.close(), { passive: true });
  }

  open(el) {
    const text = this.i.gloss(el.dataset.term);
    if (!text) return;
    this.current = el;
    this.box.innerHTML = `<b>${el.dataset.term}</b><span>${text}</span>`;
    this.box.hidden = false;
    const r = el.getBoundingClientRect();
    const w = this.box.offsetWidth, h = this.box.offsetHeight;
    const margin = 12;
    const left = Math.min(Math.max(margin, r.left + r.width / 2 - w / 2), window.innerWidth - w - margin);
    const above = r.top - h - 8;
    const top = above > margin ? above : r.bottom + 8;
    this.box.style.left = `${left}px`;
    this.box.style.top = `${top}px`;
  }

  close() {
    this.box.hidden = true;
    this.current = null;
  }
}

// 플레이 화면 그리기 전담. 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 화면에는 지금 장면 하나만 보이고, 지나온 행동은 하단 기록창에 한 줄씩 쌓인다.
// 조작: 숫자키(1~9)로 고르기, Enter로 확인, Esc로 메인.


class GameView {
  constructor(root, config, i18n) {
    this.config = config;
    this.i = i18n;
    this.$ = (sel) => root.querySelector(sel);
    this.layer = this.$("#game");
    this.stage = this.$("#stage");
    this.logList = this.$("#log");
    this.onMenu = null;
    this.$("#toMenu").addEventListener("click", () => this.onMenu?.());
  }

  open(onMenu) {
    this.onMenu = onMenu;
    this.layer.hidden = false;
    this.$("#toMenu").hidden = false;
    this.$("#toMenu").innerHTML = `${this.i.t("game.toMenu")}<kbd>Esc</kbd>`;
    this.$("#logTitle").textContent = this.i.t("game.logTitle");
  }

  close() {
    this.layer.hidden = true;
    Keys.clear();
  }

  // 화면별 키 처리 + 공통 Esc(메인으로)
  keys(fn) {
    Keys.set((e) => {
      if (e.key === "Escape" && this.onMenu && !this.$("#toMenu").hidden) { this.onMenu(); return true; }
      return fn ? fn(e) : false;
    });
  }

  header(life, karma) {
    this.$("#life").textContent = this.i.t("game.life", { n: life });
    this.$("#karma").textContent = this.i.t("game.karma", { k: karma });
  }

  stats(state) {
    const i = this.i;
    const rows = [`<div class="stat realm"><span>${i.stat("경지")}</span><b>${i.realm(state.stat("경지"))}</b></div>`];
    for (const s of this.config.shownStats) rows.push(`<div class="stat"><span>${i.stat(s)}</span><b>${state.stat(s)}</b></div>`);
    this.$("#stats").innerHTML = rows.join("");
    this.$("#items").innerHTML = state.items.length
      ? state.items.map((x) => `<li>${i.gloss(i.item(x)) ? `<span class="term" tabindex="0" data-term="${i.item(x)}">${i.item(x)}</span>` : i.item(x)}</li>`).join("")
      : `<li class="none">${i.t("game.emptyHands")}</li>`;
  }

  // 변화 기록 하나를 글로.
  changeText(c) {
    const i = this.i;
    if (c.type === "gain") return i.t("changes.gain", { item: i.item(c.item) });
    if (c.type === "lose") return i.t("changes.lose", { item: i.item(c.item) });
    if (c.type === "loseAll") return i.t("changes.loseAll");
    if (c.type === "realm") return i.t("changes.realm", { realm: i.realm(c.value) });
    if (c.type === "set") return `${i.stat(c.stat)} ${c.value}`;
    if (c.type === "join") return i.t("changes.join", { name: i.name(c.name) });
    if (c.type === "leave") return i.t("changes.leave");
    if (c.type === "bond") return i.t(c.delta > 0 ? "changes.bondUp" : "changes.bondDown", { name: i.name(c.name) });
    if (c.type === "fame") return i.t(c.delta > 0 ? "changes.fameUp" : "changes.fameDown", { name: i.name(c.name) });
    return `${i.stat(c.stat)} ${c.delta > 0 ? "+" : ""}${c.delta}`;
  }

  changesHtml(changes) {
    return changes.map((c) => `<span class="${c.good ? "up" : "down"}">${this.changeText(c)}</span>`).join(" ");
  }

  show(sec) {
    this.stage.replaceChildren(sec);
    window.scrollTo({ top: 0 });
  }

  // 기록창 전체를 다시 그린다 (최신이 맨 위). 기록에는 글 대신 id만 있어서 언어를 바꿔도 맞게 나온다.
  renderLog(entries) {
    const i = this.i;
    if (!entries.length) {
      this.logList.innerHTML = `<li class="empty">${i.t("game.logEmpty")}</li>`;
      return;
    }
    this.logList.innerHTML = entries
      .slice()
      .reverse()
      .map(
        (x) =>
          `<li class="${x.dead ? "dead" : ""}"><span class="t">${i.ev(x.ev, "title")}</span><span class="g">[${i.ev(x.ev, `c${x.c}.tag`)}]</span>${this.changesHtml(x.changes)}${x.dead ? `<span class="down">${i.t("game.death")}</span>` : ""}</li>`
      )
      .join("");
  }

  scene(ev, choices, onConfirm) {
    const i = this.i;
    const sec = el("section", "scene");
    // 기연 장면이면 제목 위에 기연 표시 (선택지에는 힌트를 주지 않는다)
    sec.innerHTML = `${ev.fortune ? `<p class="fortune-banner">${i.t("game.fortune")}</p>` : ""}<h2>${i.ev(ev.id, "title")}</h2><div class="prose">${linesToHtml(i.ev(ev.id, "desc"))}</div>`;
    const list = el("div", "choices");
    const confirm = button(i.t("game.next"), () => go());
    confirm.hidden = true;
    let picked = null;

    const select = (n) => {
      picked = choices[n];
      list.querySelectorAll(".choice").forEach((b, j) => b.classList.toggle("picked", j === n));
      confirm.hidden = false;
    };
    const go = () => {
      if (!picked) return;
      this.keys(null);
      onConfirm(picked);
    };

    choices.forEach((c, n) => {
      const b = el("button", "choice" + (c.warn ? " warn" : ""));
      b.type = "button";
      b.innerHTML = `<span class="num">${n + 1}</span><span class="tag">[${i.ev(ev.id, `c${c.id}.tag`)}]</span><span class="txt">${lineToHtml(i.ev(ev.id, `c${c.id}.text`))}</span>${c.warn ? `<span class="warn-label">${i.t("game.warn")}</span>` : ""}`;
      b.addEventListener("click", () => select(n));
      list.append(b);
    });
    sec.append(list, confirm);
    this.show(sec);

    this.keys((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= choices.length) { select(n - 1); return true; }
      if (e.key === "Enter" && picked) { go(); return true; }
      return false;
    });
  }

  // 첫 생에만 나오는 도입 화면.
  intro(evId, onDone) {
    const sec = el("section", "intro");
    sec.innerHTML = `<div class="prose">${linesToHtml(this.i.ev(evId, "intro"))}</div>`;
    const b = button(this.i.t("game.continue"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }

  // 결과는 새 화면으로: 장면 제목, 고른 선택 한 줄, 결과 글. textKey 예: "c2.o0"
  outcome(evId, choiceId, textKey, changes, buttonKey, onNext, rare = false, fortune = false) {
    const i = this.i;
    const sec = el("section", "outcome" + (rare ? " rare" : ""));
    sec.innerHTML = `${rare ? `<p class="rare-banner">${i.t("game.rare", { n: this.config.karma.perRare })}</p>` : fortune ? `<p class="fortune-banner">${i.t("game.fortune")}</p>` : ""}<h2>${i.ev(evId, "title")}</h2>
      <p class="chosen"><span class="tag">[${i.ev(evId, `c${choiceId}.tag`)}]</span> ${lineToHtml(i.ev(evId, `c${choiceId}.text`))}</p>
      <div class="prose">${linesToHtml(i.ev(evId, textKey))}</div>`;
    if (changes.length) {
      sec.innerHTML += `<ul class="changes">${changes.map((c) => `<li class="${c.good ? "up" : "down"}">${this.changeText(c)}</li>`).join("")}</ul>`;
    }
    const b = button(i.t(buttonKey), onNext);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }

  ending(kind, summary, onDone) {
    const i = this.i;
    this.$("#toMenu").hidden = true;
    const sec = el("section", "ending " + kind);
    const head = kind === "death" ? i.t("ending.deathHead") : i.t("ending.endHead");
    const sub = kind === "death" ? "" : `<p class="note">${i.t("ending.endNote")}</p>`;
    sec.innerHTML = `<h2>${head}</h2>${sub}
      <dl class="karma">${summary.parts.filter((p) => p.value > 0 || ["scenes", "fresh"].includes(p.id)).map((p) => `<div class="part-${p.id}"><dt>${i.t(`ending.${p.id}`, { w: p.note ?? 0 })}</dt><dd>+${p.value}</dd></div>`).join("")}
      <div class="total"><dt>${i.t("ending.total")}</dt><dd>+${summary.total}</dd></div></dl>
      ${summary.newAch.length ? `<p class="ach">${i.t("ending.newAch", { list: summary.newAch.map((a) => i.ach(a, "name")).join(", ") })}</p>` : ""}`;
    const b = button(i.t("game.toMain"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }
}

function button(text, onClick, cls = "next") {
  const b = el("button", cls);
  b.type = "button";
  b.innerHTML = `${text}<kbd>Enter</kbd>`;
  b.addEventListener("click", () => { if (b.disabled) return; b.disabled = true; onClick(); });
  return b;
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// 메인 화면과 그 하위 화면(인과록, 업, 설정). 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 조작: 메인에서는 숫자키로 바로 이동, 하위 화면은 Esc로 돌아가기.



class MenuScreens {
  constructor(root, i18n) {
    this.layer = root.querySelector("#screen");
    this.i = i18n;
  }

  hide() {
    this.layer.hidden = true;
  }

  show(sec, onBack) {
    this.layer.hidden = false;
    this.layer.replaceChildren(sec);
    window.scrollTo({ top: 0 });
    if (onBack) {
      const back = el("button", "back");
      back.type = "button";
      back.innerHTML = `${this.i.t("common.back")}<kbd>Esc</kbd>`;
      back.addEventListener("click", onBack);
      sec.prepend(back);
      Keys.set((e) => (e.key === "Escape" ? (onBack(), true) : false));
    }
  }

  // info: { lives, karma, hasSave }, h: { continue, newLife, achievements, karma, settings }
  main(info, h) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "menu");
    sec.innerHTML = `
      <div class="mast">
        <p class="eyebrow">${t("menu.eyebrow")}</p>
        <h1>${t("menu.title")}</h1>
        <p class="sub">${info.lives ? t("menu.livesLine", { n: `<b>${info.lives}</b>`, k: `<b>${info.karma}</b>` }) : t("menu.noLives")}</p>
      </div>`;
    const items = [
      { key: "continue", run: h.continue, off: !info.hasSave, note: info.hasSave ? "" : t("menu.noSave") },
      { key: "newLife", run: h.newLife, note: info.hasSave ? t("menu.loseSave") : "" },
      { key: "achievements", run: h.achievements },
      { key: "karma", run: h.karma },
      { key: "settings", run: h.settings },
    ];
    const nav = el("nav", "menu-list");
    let armed = false; // 새로 하기 두 번 확인용
    items.forEach((it, n) => {
      const b = el("button", "menu-item");
      b.type = "button";
      b.disabled = !!it.off;
      b.innerHTML = `<span class="num">${n + 1}</span><span class="lbl">${t("menu." + it.key)}</span>${it.note ? `<span class="mnote">${it.note}</span>` : ""}`;
      b.addEventListener("click", () => {
        if (it.key === "newLife" && info.hasSave && !armed) {
          armed = true;
          b.classList.add("armed");
          b.querySelector(".mnote").textContent = t("menu.confirmNew");
          return;
        }
        it.run();
      });
      nav.append(b);
    });
    sec.append(nav);
    this.show(sec);
    Keys.set((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= items.length && !items[n - 1].off) { nav.children[n - 1].click(); return true; }
      if (e.key === "Enter" && !items[0].off) { nav.children[0].click(); return true; }
      return false;
    });
  }

  // 분류 탭(전체 + 지역·모임별). 달성한 것은 이름·설명·달성 조건, 못 한 것은 힌트만.
  achievements(list, unlocked, outcomeCount, onBack) {
    const i = this.i;
    const sec = el("section", "sub-screen");
    const got = list.filter((a) => unlocked.includes(a.id)).length;
    const cats = Object.keys(i.t("achievementsScreen.categories")).filter((c) => list.some((a) => a.category === c));
    const tabs = [{ id: "*", label: i.t("achievementsScreen.all"), items: list }].concat(
      cats.map((c) => ({ id: c, label: i.t(`achievementsScreen.categories.${c}`), items: list.filter((a) => a.category === c) }))
    );
    sec.innerHTML = `
      <h2>${i.t("achievementsScreen.title")}</h2>
      <p class="sub">${i.t("achievementsScreen.sub", { got: `<b>${got}</b>`, all: list.length, n: `<b>${outcomeCount}</b>` })}</p>
      <div class="tabs" role="tablist"></div>
      <ul class="ach-list"></ul>`;
    const bar = sec.querySelector(".tabs");
    const ul = sec.querySelector(".ach-list");
    const render = (tab) => {
      bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === tab.id));
      ul.innerHTML = tab.items
        .map((a) =>
          unlocked.includes(a.id)
            ? `<li class="on"><b>${i.ach(a.id, "name")}</b><span>${i.ach(a.id, "desc")}</span><span class="cond">${i.t("achievementsScreen.condLabel")} · ${i.ach(a.id, "cond")}</span></li>`
            : `<li><b>${i.t("achievementsScreen.locked")}</b><span>${i.ach(a.id, "hint")}</span></li>`
        )
        .join("");
    };
    tabs.forEach((tab) => {
      const b = el("button", "tab");
      b.type = "button";
      b.id = `tab-${tab.id === "*" ? "all" : tab.id}`;
      b.dataset.id = tab.id;
      b.setAttribute("role", "tab");
      const n = tab.items.filter((a) => unlocked.includes(a.id)).length;
      b.innerHTML = `${tab.label}<small>${n}/${tab.items.length}</small>`;
      b.addEventListener("click", () => render(tab));
      bar.append(b);
    });
    render(tabs[0]);
    this.show(sec, onBack);
  }

  // 업 상점. shop: KarmaShop, onBuy(id)
  karma(total, shop, onBuy, onBack) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `
      <h2>${t("karmaScreen.title")}</h2>
      <p class="big">${total}</p>
      <p class="sub">${t("karmaScreen.sub")}</p>
      <h3 class="shop-title">${t("karmaScreen.shopTitle")}</h3>
      <ul class="shop"></ul>`;
    const ul = sec.querySelector(".shop");
    shop.items.forEach((it, n) => {
      const lv = shop.level(it.id);
      const price = shop.price(it.id);
      const max = shop.isMax(it.id);
      const li = el("li", "shop-row");
      li.innerHTML = `<div class="shop-info"><b>${t(`karmaScreen.items.${it.id}.name`)}</b><span>${t(`karmaScreen.items.${it.id}.desc`)}</span><span class="shop-lv">${t("karmaScreen.level", { v: lv * it.amount })}</span></div>`;
      const b = el("button", "shop-buy");
      b.type = "button";
      b.id = `buy-${n}`;
      b.textContent = max ? t("karmaScreen.max") : t("karmaScreen.buy", { p: price });
      b.disabled = max || total < price;
      b.addEventListener("click", () => onBuy(it.id));
      li.append(b);
      ul.append(li);
    });
    this.show(sec, onBack);
  }

  // current: 설정값, languages: [{id, name}], h: { fontSize, language, wipe }
  settings(current, languages, h, onBack) {
    const t = (k) => this.i.t(k);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `<h2>${t("settings.title")}</h2>
      <div class="set-row"><span class="set-lbl">${t("settings.fontSize")}</span><div class="seg" id="seg-fs" role="group"></div></div>
      ${languages.length > 1 ? `<div class="set-row"><span class="set-lbl">${t("settings.language")}</span><div class="seg" id="seg-lang" role="group"></div></div>` : ""}
      <div class="set-row danger"><span class="set-lbl">${t("settings.wipe")}</span><p class="set-note">${t("settings.wipeNote")}</p></div>`;
    segment(sec.querySelector("#seg-fs"), FONT_SIZES.map((f) => ({ id: f.id, label: t(`settings.sizes.${f.id}`) })), current.fontSize, "fs", h.fontSize);
    const langSeg = sec.querySelector("#seg-lang");
    if (langSeg) segment(langSeg, languages.map((l) => ({ id: l.id, label: l.name })), current.language, "lang", h.language);

    const wipe = el("button", "wipe");
    wipe.type = "button";
    wipe.id = "wipe";
    wipe.textContent = t("settings.wipeBtn");
    let armed = false;
    wipe.addEventListener("click", () => {
      if (!armed) {
        armed = true;
        wipe.textContent = t("settings.wipeConfirm");
        wipe.classList.add("armed");
        return;
      }
      h.wipe();
      wipe.textContent = t("settings.wiped");
      wipe.disabled = true;
    });
    sec.querySelector(".danger").append(wipe);
    this.show(sec, onBack);
  }
}

function segment(box, options, currentId, prefix, onPick) {
  options.forEach((o) => {
    const b = el("button", "seg-btn" + (o.id === currentId ? " on" : ""));
    b.type = "button";
    b.id = `${prefix}-${o.id}`;
    b.textContent = o.label;
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      onPick(o.id);
    });
    box.append(b);
  });
}

// 앱 흐름: 메인 화면 ↔ 플레이(장면 → 선택 → 결과 → 다음 장면) → 정산 → 메인.














class App {
  constructor(events, achievements, i18n, settings) {
    this.rng = new Rng();
    this.selector = new EventSelector(events, this.rng, CONFIG);
    this.resolver = new ResultResolver(this.rng, CONFIG);
    this.record = new LifeRecord(CONFIG);
    this.shop = new KarmaShop(CONFIG, this.record);
    this.saves = new SaveManager(CONFIG);
    this.settings = settings;
    this.i18n = i18n;
    this.achievements = achievements;
    this.view = new GameView(document, CONFIG, i18n);
    this.menu = new MenuScreens(document, i18n);
  }

  // ── 메인 화면 ──
  home() {
    this.view.close();
    this.menu.main(
      { lives: this.record.data.life, karma: this.record.data.karma, hasSave: this.saves.has() },
      {
        continue: () => this.continueLife(),
        newLife: () => this.newLife(),
        achievements: () =>
          this.menu.achievements(this.achievements, this.record.data.achievements, this.record.data.outcomes.length, () => this.home()),
        karma: () => this.openShop(),
        settings: () => this.openSettings(),
      }
    );
  }

  openShop() {
    this.menu.karma(this.record.data.karma, this.shop, (id) => { this.shop.buy(id); this.openShop(); }, () => this.home());
  }

  async openSettings() {
    const langs = await Promise.all(
      CONFIG.languages.map(async (id) => {
        await this.i18n.use(id);
        return { id, name: this.i18n.t("lang.name") };
      })
    );
    await this.i18n.use(this.settings.data.language);
    this.menu.settings(
      this.settings.data,
      langs,
      {
        fontSize: (id) => this.settings.set("fontSize", id),
        language: async (id) => { this.settings.set("language", id); await this.i18n.use(id); this.openSettings(); },
        wipe: () => { this.record.wipe(); this.saves.clear(); },
      },
      () => this.home()
    );
  }

  // ── 플레이 ──
  enterGame() {
    this.menu.hide();
    this.view.open(() => this.home());
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.stats(this.state);
    this.view.renderLog(this.state.log);
  }

  newLife() {
    this.saves.clear();
    this.state = new GameState(CONFIG);
    this.state.stats.업 = this.record.data.karmaEarned; // 지금까지 쌓은 업 총량이 확률 보정에 쓰인다 (화면에는 안 보임)
    this.shop.apply(this.state);
    const life = this.record.startLife();
    this.enterGame();
    const first = this.selector.byId(CONFIG.prologueId);
    // 도입부(intro)는 맨 첫 생에만 보여준다.
    if (first?.intro && life === 1) return this.view.intro(first.id, () => this.play(first));
    this.play(first ?? this.selector.next(this.state));
  }

  continueLife() {
    const saved = this.saves.load();
    if (!saved) return this.home();
    this.state = saved.state;
    this.enterGame();
    this.play(saved.eventId ? this.selector.byId(saved.eventId) : null);
  }

  play(ev) {
    if (!ev) return this.finish("end");
    const s = this.state;
    s.seen.add(ev.id);
    s.lastEventId = ev.id;
    this.saves.save(s, ev.id);
    this.view.scene(ev, this.selector.availableChoices(ev, s), (choice) => {
      s.scenes += 1;
      const outcome = this.resolver.pick(choice, s, this.record.deathsAt(ev.id, choice.id));
      const rare = this.resolver.isRare(outcome);
      if (rare) s.rare += 1;
      const textKey = `c${choice.id}.o${choice.outcomes.indexOf(outcome)}`;
      s.outcomesSeen.push(`${ev.id}:${textKey}`);
      const changes = this.resolver.apply(outcome, s);
      s.log.push({ ev: ev.id, c: choice.id, changes, dead: s.dead });
      this.view.stats(s);
      this.view.renderLog(s.log);

      if (s.dead) {
        this.saves.clear();
        this.record.recordDeath(ev.id, choice.id);
        return this.view.outcome(ev.id, choice.id, textKey, changes, "game.closeEyes", () => this.finish("death"), rare, !!outcome.fortune);
      }
      // 다음 장면을 지금 정해 저장해 둔다 (껐다 켜서 다시 고르기 방지).
      const nextId = outcome.effects?.next_event;
      const next = nextId ? this.selector.byId(nextId) : this.selector.next(s);
      this.saves.save(s, next?.id ?? null);
      this.view.outcome(ev.id, choice.id, textKey, changes, "game.continue", () => this.play(next), rare, !!outcome.fortune);
    });
  }

  finish(kind) {
    this.saves.clear();
    const summary = this.record.endLife(this.state);
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.ending(kind, summary, () => this.home());
  }
}

async function boot() {
  const settings = new Settings(CONFIG);
  settings.apply();
  const i18n = new I18n(CONFIG.langDir);
  const lang = CONFIG.languages.includes(settings.data.language) ? settings.data.language : CONFIG.defaultLanguage;
  await i18n.use(lang);
  new Tooltip(document, i18n);
  const loader = new EventLoader(CONFIG.eventIndex, CONFIG.achievementsPath);
  const [events, ach] = await Promise.all([loader.load(), loader.loadAchievements()]);
  new App(events, ach, i18n, settings).home();
}

boot();

})();
</script>

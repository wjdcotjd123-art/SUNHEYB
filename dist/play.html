// 브라우저 저장소 감싸기. 저장이 막힌 환경에서도 게임이 멈추지 않게 한다.
const Store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (_) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (_) {}
  },
};

// 시드 가능한 난수. 같은 시드면 같은 결과가 나와서 버그 재현이 쉽다.
class Rng {
  constructor(seed = Date.now()) {
    this.s = seed >>> 0;
  }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  percent() {
    return this.next() * 100;
  }
  pickWeighted(list, weightOf) {
    const total = list.reduce((s, x) => s + weightOf(x), 0);
    let r = this.next() * total;
    for (const x of list) {
      r -= weightOf(x);
      if (r < 0) return x;
    }
    return list[list.length - 1];
  }
}

// 한 번의 생(生) 동안의 주인공 상태.
class GameState {
  constructor(config) {
    this.stats = { ...config.startStats };
    this.items = [...config.startItems];
    this.flags = new Set();
    this.bonds = {};
    this.reputation = {};
    this.affiliation = null;
    this.situation = null; // 지금 처한 상황(예: "수감"). 있으면 그 상황의 장면만 나온다
    this.seen = new Set();
    this.outcomesSeen = [];
    this.achievements = [];
    this.scenes = 0;
    this.lastEventId = null;
    this.recent = []; // 최근 본 장면 3개
    this.termCounts = {}; // 이번 생에 용어 밑줄이 나온 횟수
    this.rare = 0; // 이번 생에 터진 드문 인과 수
    this.log = []; // 하단 기록창 내용 {title, tag, changes, dead}
    this.dead = false;
    this.ending = null; // 귀결(이야기가 매듭지어진 결말) id
    this.pastBonds = {}; // 지난 생들의 최고 인연 (기시감)
  }
  stat(name) {
    return this.stats[name] ?? 0;
  }
  hasItem(name) {
    return this.items.includes(name);
  }
  addItem(name) {
    this.items.push(name);
  }
  removeItem(name) {
    const i = this.items.indexOf(name);
    if (i >= 0) this.items.splice(i, 1);
  }
}

// 데이터 읽기. 이벤트 묶음 목록은 data/events/index.json에 있다.
// 단일 파일로 빌드된 판에서는 window.EVENT_DATA / window.ACHIEVEMENT_DATA를 그대로 쓴다.
class EventLoader {
  constructor(indexPath, achievementsPath, codexPath) {
    this.codexPath = codexPath;
    this.indexPath = indexPath;
    this.achievementsPath = achievementsPath;
  }
  async load() {
    if (window.EVENT_DATA) return this.merge(window.EVENT_DATA);
    const base = this.indexPath.slice(0, this.indexPath.lastIndexOf("/") + 1);
    const index = await (await fetch(this.indexPath)).json();
    const batches = await Promise.all(index.batches.map(async (f) => (await fetch(base + f)).json()));
    return this.merge(batches);
  }
  async loadCodex() {
    const data = window.CODEX_DATA ?? (await (await fetch(this.codexPath)).json());
    return data.sections;
  }
  async loadAchievements() {
    const data = window.ACHIEVEMENT_DATA ?? (await (await fetch(this.achievementsPath)).json());
    return data.achievements;
  }
  merge(batches) {
    const byId = new Map();
    for (const b of batches) for (const ev of b.events) byId.set(ev.id, ev);
    return byId;
  }
}

// 조건 판정과 다음 장면 고르기.
// pool 종류: "pool"(기본, 무작위 등장) / "chain"(다른 장면의 next_event로만) / "fixed"(정해진 때에만, 예: 첫 장면)
function meetsCondition(state, cond = {}) {
  if (cond.items && !cond.items.every((i) => state.hasItem(i))) return false;
  if (cond.flags && !cond.flags.every((f) => state.flags.has(f))) return false;
  if (cond.flags_any && !cond.flags_any.some((f) => state.flags.has(f))) return false;
  if (cond.flags_none && cond.flags_none.some((f) => state.flags.has(f))) return false;
  if (cond.stat_min && !Object.entries(cond.stat_min).every(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.stat_min_any && !Object.entries(cond.stat_min_any).some(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.realm_min != null && state.stat("경지") < cond.realm_min) return false;
  if (cond.realm_max != null && state.stat("경지") > cond.realm_max) return false;
  // 인연: { 인물: 최소 인연 }
  if (cond.bond_min && !Object.entries(cond.bond_min).every(([k, v]) => (state.bonds?.[k] ?? 0) >= v)) return false;
  // 전생의 인연: { 인물: 지난 생들에서 쌓았던 최고 인연 } — 기시감 선택지
  if (cond.past_bond_min && !Object.entries(cond.past_bond_min).every(([k, v]) => (state.pastBonds?.[k] ?? 0) >= v)) return false;
  // 체질: { 체질id: 최소 단계 } — 켜 둔 체질이 그 단계 이상일 때만
  if (cond.traits && !Object.entries(cond.traits).every(([k, v]) => (state.traits?.[k] ?? 0) >= v)) return false;
  // 소속: "none"이면 무소속일 때만, 이름이면 그 소속일 때만. affiliation_not은 그 소속이면 안 됨.
  const aff = state.affiliation ?? "none";
  if (cond.affiliation && cond.affiliation !== aff) return false;
  if (cond.affiliation_not && cond.affiliation_not.includes(aff)) return false;
  return true;
}

class EventSelector {
  constructor(eventsById, rng, config) {
    this.events = eventsById;
    this.rng = rng;
    this.config = config;
  }
  // 인과록 기반 새로움 가중치 (NoveltyWeigher)
  useNovelty(weigher) {
    this.novelty = weigher;
  }
  byId(id) {
    return this.events.get(id) ?? null;
  }
  next(state) {
    // repeat=true인 장면(수련 등)은 여러 번 나올 수 있다. 단, 방금 본 장면은 다른 후보가 있으면 건너뛴다.
    let pool = [...this.events.values()].filter(
      (ev) =>
        (ev.pool ?? "pool") === "pool" &&
        (ev.situation ?? null) === (state.situation ?? null) && // 상황(감옥 등)에 맞는 장면만
        (ev.repeat || !state.seen.has(ev.id)) &&
        meetsCondition(state, ev.conditions)
    );
    // 최근에 본 장면(최대 3개)은 다른 후보가 있으면 건너뛴다.
    const recent = state.recent ?? [state.lastEventId];
    for (let n = recent.length; n > 0; n--) {
      const left = pool.filter((ev) => !recent.slice(-n).includes(ev.id));
      if (left.length) { pool = left; break; }
    }
    if (!pool.length) {
      // 이 경지에서 더 나올 장면이 없으면 경지별 마지막 장면(한 번만)
      const fb = this.byId(this.config.fallbackEvents?.[state.stat("경지")]);
      return fb && !state.seen.has(fb.id) ? fb : null;
    }
    // 내 소속과 같은 group의 장면은 더 자주 나온다.
    const boost = (ev) => (ev.group && ev.group === state.affiliation ? this.config.affiliationBoost : 1) * this.personBoost(ev, state);
    const fresh = (ev) => (this.novelty ? this.novelty.weight(ev, state) : 1);
    return this.rng.pickWeighted(pool, (ev) => (ev.weight ?? this.config.defaultWeight) * boost(ev) * fresh(ev));
  }
  // 인연을 쌓은 인물이 나오는 장면(person)은 더 자주 나온다: 인연 n당 ×(1 + n/perBond), 최대 maxBond배
  personBoost(ev, state) {
    if (!ev.person) return 1;
    const { perBond, max } = this.config.personBoost;
    const people = Array.isArray(ev.person) ? ev.person : [ev.person];
    const best = Math.max(0, ...people.map((p) => state.bonds?.[p] ?? 0));
    return Math.min(max, 1 + best / perBond);
  }
  // 비추천(warn) 선택지는 항상 맨 뒤로 보낸다.
  availableChoices(ev, state) {
    const ok = ev.choices.filter((c) => meetsCondition(state, c.condition));
    return [...ok.filter((c) => !c.warn), ...ok.filter((c) => c.warn)];
  }
}

// 새로움 가중치: 인과록(모든 생의 기록)을 보고, 아직 못 본 것이 남은 장면을 더 자주 띄운다.
// 노려볼 만한 것(지금 고를 수 있는 선택지 + 기본 확률 minChance% 이상, 또는 기본 결과)만 센다.

class NoveltyWeigher {
  constructor(record, config) {
    this.record = record;
    this.cfg = config.novelty;
  }
  // 지금 상태에서 노려볼 만한 결과들 [{ evId, choice, outcome, index }]
  reachable(ev, state) {
    const out = [];
    for (const c of ev.choices) {
      if (!meetsCondition(state, c.condition)) continue;
      c.outcomes.forEach((o, index) => {
        if (o.effects?.death) return;
        if (o.chance != null && o.chance < this.cfg.minChance) return;
        out.push({ choice: c, outcome: o, index });
      });
    }
    return out;
  }
  // 이번 생에 겪은 결과까지 포함해 본 적 있는지
  seenOutcome(state, key) {
    return this.record.data.outcomes.includes(key) || state.outcomesSeen.includes(key);
  }
  weight(ev, state) {
    const rec = this.record;
    if (!rec.knows(`ev:${ev.id}`)) return this.cfg.unseen;
    const reach = this.reachable(ev, state);
    let w = 1;
    if (reach.some((r) => !this.seenOutcome(state, `${ev.id}:c${r.choice.id}.o${r.index}`))) w *= this.cfg.outcome;
    if (reach.some((r) => r.outcome.effects?.achievement && !rec.data.achievements.includes(r.outcome.effects.achievement))) w *= this.cfg.achievement;
    const people = ev.person ? (Array.isArray(ev.person) ? ev.person : [ev.person]) : [];
    const items = reach.flatMap((r) => r.outcome.effects?.items ?? []);
    if (people.some((p) => !rec.knows(`bond:${p}`)) || items.some((x) => !rec.knows(`item:${x}`))) w *= this.cfg.codex;
    return w;
  }
  // 아직 한 번도 골라 본 적 없는 선택지 (모든 생 + 이번 생)
  isFreshChoice(evId, choiceId, state) {
    const p = `${evId}:c${choiceId}.`;
    return !this.record.data.outcomes.some((k) => k.startsWith(p)) && !state.outcomesSeen.some((k) => k.startsWith(p));
  }
}

// 선택 결과 판정(확률 + 스탯 보정)과 효과 적용.

class ResultResolver {
  constructor(rng, config) {
    this.rng = rng;
    this.config = config;
  }

  chanceOf(outcome, state) {
    let c = outcome.chance;
    for (const [stat, per] of Object.entries(outcome.mods ?? {})) c += per * state.stat(stat);
    // 하한은 chanceMin이지만, 원래부터 그보다 낮게 잡은 극악 확률은 그대로 둔다.
    return Math.min(this.config.chanceMax, Math.max(Math.min(this.config.chanceMin, outcome.chance), c));
  }

  // 드문 인과: 기본 확률이 rareChance 이하이면서 죽음이 아닌 결과.
  isRare(outcome) {
    return outcome.chance != null && outcome.chance <= this.config.rareChance && !outcome.effects?.death;
  }

  // chance가 있는 결과들을 차례로 쌓고, 남은 확률은 chance 없는 결과가 가져간다.
  // deaths: 전생에 이 선택지에서 죽은 횟수. 죽음 확률을 조금 깎아준다(전생의 기억).
  //  - 죽음 결과에 chance가 있으면 그만큼 빼고,
  //  - 죽음이 나머지 확률이면 처음 나오는 평범한 생존 결과에 더한다.
  //  - 드문 인과(대박)는 배율로만 조금 올려서 대박의 희소함은 지킨다.
  pick(choice, state, deaths = 0) {
    // noDeathIf: 이 조건을 채우면 이 선택지에서는 죽지 않는다 (남은 확률은 마지막 생존 결과가 가져감)
    if (choice.noDeathIf && meetsCondition(state, choice.noDeathIf)) {
      const alive = choice.outcomes.filter((o) => !o.effects?.death);
      const last = alive[alive.length - 1];
      choice = { ...choice, outcomes: alive.map((o) => (o === last ? { ...o, chance: undefined } : o)) };
    }
    const m = this.config.deathMemory;
    const bonus = Math.min(m.cap, deaths * m.perDeath);
    const outs = choice.outcomes;
    const fallback = outs.find((o) => o.chance == null) ?? null;
    const fallbackDeath = !!fallback?.effects?.death;
    let boosted = false;
    const r = this.rng.percent();
    let acc = 0;
    for (const o of outs) {
      if (o.chance == null) continue;
      let c = this.chanceOf(o, state);
      if (bonus) {
        if (o.effects?.death) c = Math.max(0, c - bonus);
        else if (this.isRare(o)) c *= 1 + Math.min(m.rareCap, deaths * m.rarePerDeath);
        else if (fallbackDeath && !boosted) { c += bonus; boosted = true; }
      }
      acc += c;
      if (r < acc) return o;
    }
    return fallback ?? outs[outs.length - 1];
  }

  // 효과를 적용하고, 화면에 보여줄 변화 목록(언어와 무관한 구조)을 돌려준다.
  apply(outcome, state) {
    const changes = [];
    const e = outcome.effects ?? {};
    for (const [k, v] of Object.entries(e)) {
      // 없앤 능력치(체력 등)는 적용하지 않는다
      if (this.config.disabledStats?.includes(k.replace(/_set$/, ""))) continue;
      if (k === "death") state.dead = !!v;
      else if (k === "items") v.forEach((i) => { state.addItem(i); changes.push({ type: "gain", item: i, good: true }); });
      else if (k === "items_remove") v.forEach((i) => { state.removeItem(i); changes.push({ type: "lose", item: i, good: false }); });
      else if (k === "items_clear") { if (state.items.length) changes.push({ type: "loseAll", good: false }); state.items = []; }
      else if (k === "flags") v.forEach((f) => state.flags.add(f));
      else if (k === "flags_remove") v.forEach((f) => state.flags.delete(f));
      else if (k === "achievement") state.achievements.push(v);
      else if (k === "next_event") continue;
      else if (k === "ending") state.ending = v;
      // 전투 기세 같은 임시 수치를 조용히 0으로 (예: "기세_reset": true)
      else if (k.endsWith("_reset")) state.stats[k.slice(0, -6)] = 0;
      else if (k === "realm_set") { state.stats.경지 = v; changes.push({ type: "realm", value: v, good: true }); }
      else if (k.endsWith("_set")) { const s = k.slice(0, -4); state.stats[s] = v; changes.push({ type: "set", stat: s, value: v, good: false }); }
      else if (k === "상황") {
        // 상황 "없음"은 상황에서 벗어난다 (예: 감옥에서 풀려남)
        state.situation = v === "없음" ? null : v;
        changes.push({ type: "situation", name: v, good: v === "없음" });
      }
      else if (k === "소속") {
        // 소속 "없음"은 무소속으로 되돌린다.
        state.affiliation = v === "없음" ? null : v;
        changes.push(v === "없음" ? { type: "leave", good: false } : { type: "join", name: v, good: true });
      }
      else if (k === "인연") { addAll(state.bonds, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "bond", name: who, delta: d, good: d > 0 }); }
      else if (k === "평판") { addAll(state.reputation, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "fame", name: who, delta: d, good: d > 0 }); }
      else if (typeof v === "number") {
        state.stats[k] = state.stat(k) + v;
        changes.push({ type: "stat", stat: k, delta: v, good: v > 0 });
      }
    }
    return changes;
  }
}

function addAll(target, deltas) {
  for (const [k, d] of Object.entries(deltas)) target[k] = (target[k] ?? 0) + d;
}


// 언어 파일 읽기와 글 꺼내기. 화면에 나가는 모든 글은 여기를 거친다.
// 언어 파일: lang/<언어>/ui.json, events.json, achievements.json, items.json, names.json(인물·세력), glossary.json(용어 풀이)
const FILES = ["ui", "events", "achievements", "items", "names", "glossary", "codex"];

class I18n {
  constructor(langDir) {
    this.langDir = langDir;
    this.packs = {};
    this.lang = null;
  }

  async use(lang) {
    if (!this.packs[lang]) {
      const inline = window.LANG_DATA?.[lang];
      this.packs[lang] =
        inline ??
        Object.fromEntries(
          await Promise.all(FILES.map(async (f) => [f, await (await fetch(`${this.langDir}/${lang}/${f}.json`)).json()]))
        );
    }
    this.lang = lang;
    this.p = this.packs[lang];
    document.documentElement.lang = lang;
  }

  // 화면 글자. 예: t("menu.title"), t("game.life", { n: 3 })
  t(path, vars) {
    let s = path.split(".").reduce((o, k) => o?.[k], this.p.ui);
    if (s == null) return path;
    if (vars && typeof s === "string") for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
    return s;
  }

  // 이벤트 글. 예: ev(id, "title"), ev(id, "c2.o0")
  ev(id, part) {
    return this.p.events[`${id}.${part}`] ?? `${id}.${part}`;
  }

  ach(id, field) {
    return this.p.achievements[`${id}.${field}`] ?? id;
  }

  // 인과록 도감 글. part: "name" 또는 "s0", "s1" …
  codex(id, part) {
    return this.p.codex?.[`${id}.${part}`] ?? id;
  }

  item(id) {
    return this.p.items[id] ?? id.replaceAll("_", " ");
  }

  name(id) {
    return this.p.names?.[id] ?? id.replaceAll("_", " ");
  }

  // 용어 풀이. 없으면 null
  gloss(term) {
    return this.p.glossary?.[term] ?? null;
  }

  stat(id) {
    return this.p.ui.stats?.[id] ?? id;
  }

  realm(n) {
    return this.p.ui.realms?.[n] ?? String(n);
  }
}

// 회차(몇 번째 생)와 업(業), 인과록, 전생의 죽음 기록, 업 상점 단계.

const empty = () => ({ life: 0, karma: 0, karmaEarned: 0, outcomes: [], achievements: [], deaths: {}, shop: {}, traits: {}, known: [], bondsMax: {}, endings: [] });

class LifeRecord {
  constructor(config) {
    this.config = config;
    const saved = Store.get(config.storage.meta, {});
    this.data = { ...empty(), ...saved };
    // 업 상점 '타고난 체력'은 '타고난 행운'으로 바뀌었다
    if (this.data.shop.체력 != null && this.data.shop.행운 == null) { this.data.shop.행운 = this.data.shop.체력; delete this.data.shop.체력; }
    // 예전 기록에는 누적 업이 없으므로 남은 업으로 채운다.
    if (saved.karmaEarned == null) this.data.karmaEarned = this.data.karma;
    // 예전 기록의 인과록(업적)도 도감 지식으로 옮겨 둔다.
    this.data.known = [...new Set([...this.data.known, ...this.data.achievements.map((a) => `ach:${a}`)])];
  }
  save() {
    Store.set(this.config.storage.meta, this.data);
  }
  wipe() {
    this.data = empty();
    Store.remove(this.config.storage.meta);
  }
  startLife() {
    this.data.life += 1;
    this.save();
    return this.data.life;
  }
  // 인과록 도감용: 모든 생을 통틀어 겪은 것(ev:/flag:/item:/ach:/bond:/aff:)
  learn(keys) {
    const set = new Set(this.data.known);
    const before = set.size;
    keys.forEach((k) => set.add(k));
    if (set.size !== before) { this.data.known = [...set]; this.save(); }
  }
  knows(key) {
    return this.data.known.includes(key);
  }
  // 전생의 기억: 어떤 선택지에서 몇 번 죽었는지
  deathsAt(evId, choiceId) {
    return this.data.deaths[`${evId}:${choiceId}`] ?? 0;
  }
  recordDeath(evId, choiceId) {
    const k = `${evId}:${choiceId}`;
    this.data.deaths[k] = (this.data.deaths[k] ?? 0) + 1;
    this.save();
  }
  // 시험용: 업을 그냥 넣어 준다
  grant(amount) {
    this.data.karma += amount;
    this.save();
  }
  spend(amount) {
    if (this.data.karma < amount) return false;
    this.data.karma -= amount;
    this.save();
    return true;
  }
  // 한 생이 끝날 때 업을 계산해 쌓는다.
  endLife(state) {
    const k = this.config.karma;
    const known = new Set(this.data.outcomes);
    const fresh = [...new Set(state.outcomesSeen)].filter((o) => !known.has(o));
    const newAch = [...new Set(state.achievements)].filter((a) => !this.data.achievements.includes(a));
    const parts = [
      { id: "scenes", value: state.scenes * k.perScene },
      { id: "fresh", value: fresh.length * k.perNewOutcome },
      { id: "realm", value: state.stat("경지") * k.perRealm },
      { id: "achievements", value: newAch.length * k.perAchievement },
      { id: "wealth", value: Math.max(0, Math.floor(state.stat("재물") / k.wealthPer)), note: state.stat("재물") },
      { id: "rare", value: (state.rare ?? 0) * k.perRare },
      { id: "ending", value: state.ending ? k.perEnding : 0 },
    ];
    // 오래 버틸수록 배율이 붙는다: 1 + 턴 수 × perSceneMult (최대 maxMult)
    const base = parts.reduce((s, p) => s + p.value, 0);
    const mult = Math.min(k.maxMult, 1 + state.scenes * k.perSceneMult);
    const total = Math.round(base * mult);
    // 기시감용: 인물마다 지난 생들의 최고 인연
    for (const [who, v] of Object.entries(state.bonds)) this.data.bondsMax[who] = Math.max(this.data.bondsMax[who] ?? 0, v);
    if (state.ending && !this.data.endings.includes(state.ending)) this.data.endings.push(state.ending);
    this.data.outcomes.push(...fresh);
    this.data.achievements.push(...newAch);
    this.data.karma += total;
    this.data.karmaEarned += total;
    this.save();
    return { parts, base, mult, total, newAch };
  }
}

// 업 상점: 업을 써서 타고난 바탕을 올린다. 산 단계는 매 생 시작할 때 적용된다.
class KarmaShop {
  constructor(config, record) {
    this.items = config.shop;
    this.traits = config.traits ?? [];
    this.record = record;
  }
  level(id) {
    return this.record.data.shop[id] ?? 0;
  }
  price(id) {
    const it = this.items.find((x) => x.id === id);
    return Math.round(it.base * Math.pow(it.growth, this.level(id)));
  }
  isMax(id) {
    const it = this.items.find((x) => x.id === id);
    return this.level(id) >= it.max;
  }
  buy(id) {
    if (this.isMax(id) || !this.record.spend(this.price(id))) return false;
    this.record.data.shop[id] = this.level(id) + 1;
    this.record.save();
    return true;
  }
  // 새 생의 상태에 산 만큼 더해준다.
  apply(state) {
    for (const it of this.items) state.stats[it.stat] = state.stat(it.stat) + it.amount * this.level(it.id);
  }
  // 체질: record.data.traits[id] = { lv: 산 단계(1부터), on: 켜짐 }
  traitData(id) {
    const v = this.record.data.traits[id];
    if (v == null) return { lv: 0, on: false };
    return typeof v === "boolean" ? { lv: 1, on: v } : v; // 예전 기록(참/거짓) 호환
  }
  traitLevel(id) {
    return this.traitData(id).lv;
  }
  traitOn(id) {
    const d = this.traitData(id);
    return d.lv > 0 && d.on;
  }
  // 지금 단계(안 샀으면 첫 단계)와 다음 단계
  tierOf(tr) {
    return tr.tiers[Math.max(0, this.traitLevel(tr.id) - 1)];
  }
  nextTier(tr) {
    return tr.tiers[this.traitLevel(tr.id)] ?? null;
  }
  buyTrait(id) {
    const tr = this.traits.find((x) => x.id === id);
    const next = tr && this.nextTier(tr);
    if (!next || !this.record.spend(next.price)) return false;
    this.record.data.traits[id] = { lv: this.traitLevel(id) + 1, on: true };
    this.record.save();
    return true;
  }
  toggleTrait(id) {
    const d = this.traitData(id);
    if (!d.lv) return;
    this.record.data.traits[id] = { lv: d.lv, on: !d.on };
    this.record.save();
  }
  // 켜 둔 체질의 단계 { id: lv } — 매 생(이어하기 포함) 시작할 때 state.traits로 넣는다
  activeLevels() {
    return Object.fromEntries(this.traits.filter((x) => this.traitOn(x.id)).map((x) => [x.id, this.traitLevel(x.id)]));
  }
  // 이 결과를 막는 켜 둔 체질의 지금 단계 (없으면 undefined)
  blocker(outcome) {
    for (const tr of this.traits) {
      if (!this.traitOn(tr.id)) continue;
      const tier = this.tierOf(tr);
      if (tier.blocks.some((b) => outcome[b])) return tier;
    }
  }
}

// 사용자 설정: 글자 크기, 언어, 용어 밑줄(twice: 한 생에 용어당 두 번까지 / always / off).
const TERM_MODES = ["twice", "always", "off"];

const FONT_SIZES = [

// 진행 중인 생 저장/불러오기. "다음에 볼 장면"까지 함께 저장해서
// 결과를 본 뒤 껐다 켜도 선택을 다시 할 수 없게 한다.


class SaveManager {
  constructor(config) {
    this.config = config;
    this.key = config.storage.save;
  }
  has() {
    return !!Store.get(this.key);
  }
  save(state, eventId) {
    Store.set(this.key, {
      eventId,
      state: {
        stats: state.stats,
        items: state.items,
        flags: [...state.flags],
        bonds: state.bonds,
        reputation: state.reputation,
        affiliation: state.affiliation,
        situation: state.situation ?? null,
        ending: state.ending ?? null,
        seen: [...state.seen],
        outcomesSeen: state.outcomesSeen,
        achievements: state.achievements,
        scenes: state.scenes,
        lastEventId: state.lastEventId,
        recent: state.recent,
        termCounts: state.termCounts,
        rare: state.rare,
        log: state.log,
      },
    });
  }
  load() {
    const raw = Store.get(this.key);
    if (!raw) return null;
    const s = new GameState(this.config);
    Object.assign(s, raw.state, { flags: new Set(raw.state.flags), seen: new Set(raw.state.seen) });
    return { state: s, eventId: raw.eventId };
  }
  clear() {
    Store.remove(this.key);
  }
}

// 키보드 입력을 지금 보이는 화면 하나에만 전달한다.
let handler = null;

document.addEventListener("keydown", (e) => {
  if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  if (handler?.(e)) e.preventDefault();
});

const Keys = {
  set(fn) {
    handler = fn;
  },
  clear() {
    handler = null;
  },
};

// 본문 표기 규칙을 HTML로 바꾼다. **굵게**, <red>…</red> 등 색 태그,
// {용어} 또는 {용어|보이는글} → 마우스를 올리면 풀이가 뜨는 단어.
// 색 태그: red(위험·피해) purple(독·마기) green(획득·상승) gold(기연·희귀)
const COLORS = ["red", "purple", "green", "gold"];

function lineToHtml(line) {
  let s = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const c of COLORS) {
    s = s.replaceAll(`&lt;${c}&gt;`, `<span class="c-${c}">`).replaceAll(`&lt;/${c}&gt;`, "</span>");
  }
  s = s.replace(/\{([^{}|]+)(?:\|([^{}]+))?\}/g, (_, term, shown) => `<span class="term" tabindex="0" data-term="${term}">${shown ?? term}</span>`);
  return s;
}

// 줄 간격 규칙: 문장이 끝난 줄(. ? ! … " 등으로 끝남)마다 한 문단, 문단 사이 간격은 모두 같다.
// 문장이 안 끝난 줄은 다음 줄과 이어 붙인다(강제 개행 없음). 원본의 빈 줄은 무시한다.
const SENTENCE_END = /[.?!…"”'’」』)~]$/;
const plain = (l) => l.replace(/\*\*/g, "").replace(/<\/?(red|purple|green|gold)>/g, "").replace(/[{}]/g, "").trim();
function linesToHtml(lines) {
  const paras = [];
  let buf = [];
  for (const l of lines) {
    if (l === "") continue;
    buf.push(lineToHtml(l));
    if (SENTENCE_END.test(plain(l))) { paras.push(buf.join(" ")); buf = []; }
  }
  if (buf.length) paras.push(buf.join(" "));
  return paras.map((p) => `<p>${p}</p>`).join("");
}

// 용어 풀이 창. 표시된 단어(.term)에 마우스를 올리면 뜨고, 떼면 사라진다.
// 휴대폰처럼 마우스가 없으면 누를 때마다 열고 닫는다. 키보드로 포커스해도 뜬다.
class Tooltip {
  constructor(root, i18n) {
    this.i = i18n;
    this.box = document.createElement("div");
    this.box.className = "gloss";
    this.box.setAttribute("role", "tooltip");
    this.box.hidden = true;
    root.body.append(this.box);
    this.current = null;

    const termOf = (e) => e.target.closest?.(".term");
    root.addEventListener("mouseover", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("mouseout", (e) => { const t = termOf(e); if (t && !t.contains(e.relatedTarget)) this.close(); });
    root.addEventListener("focusin", (e) => { const t = termOf(e); if (t) this.open(t); });
    root.addEventListener("focusout", (e) => { if (termOf(e)) this.close(); });
    root.addEventListener("click", (e) => {
      const t = termOf(e);
      if (t && window.matchMedia("(hover: none)").matches) {
        this.current === t && !this.box.hidden ? this.close() : this.open(t);
      } else if (!t) this.close();
    });
    window.addEventListener("scroll", () => this.close(), { passive: true });
  }

  open(el) {
    const text = this.i.gloss(el.dataset.term);
    if (!text) return;
    this.current = el;
    this.box.innerHTML = `<b>${el.dataset.term}</b><span>${text}</span>`;
    this.box.hidden = false;
    const r = el.getBoundingClientRect();
    const w = this.box.offsetWidth, h = this.box.offsetHeight;
    const margin = 12;
    const left = Math.min(Math.max(margin, r.left + r.width / 2 - w / 2), window.innerWidth - w - margin);
    const above = r.top - h - 8;
    const top = above > margin ? above : r.bottom + 8;
    this.box.style.left = `${left}px`;
    this.box.style.top = `${top}px`;
  }

  close() {
    this.box.hidden = true;
    this.current = null;
  }
}

// 플레이 화면 그리기 전담. 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 화면에는 지금 장면 하나만 보이고, 지나온 행동은 하단 기록창에 한 줄씩 쌓인다.
// 조작: 숫자키(1~9)로 고르기, Enter로 확인, Esc로 메인.


class GameView {
  constructor(root, config, i18n) {
    this.config = config;
    this.i = i18n;
    this.$ = (sel) => root.querySelector(sel);
    this.layer = this.$("#game");
    this.stage = this.$("#stage");
    this.logList = this.$("#log");
    this.onMenu = null;
    this.$("#toMenu").addEventListener("click", () => this.onMenu?.());
  }

  open(onMenu) {
    this.onMenu = onMenu;
    this.layer.hidden = false;
    this.$("#toMenu").hidden = false;
    this.$("#toMenu").innerHTML = `${this.i.t("game.toMenu")}<kbd>Esc</kbd>`;
    this.$("#logTitle").textContent = this.i.t("game.logTitle");
  }

  close() {
    this.layer.hidden = true;
    Keys.clear();
  }

  // 화면별 키 처리 + 공통 Esc(메인으로)
  keys(fn) {
    Keys.set((e) => {
      if (e.key === "Escape" && this.onMenu && !this.$("#toMenu").hidden) { this.onMenu(); return true; }
      return fn ? fn(e) : false;
    });
  }

  header(life, karma) {
    this.$("#life").textContent = this.i.t("game.life", { n: life });
    this.$("#karma").textContent = this.i.t("game.karma", { k: karma });
  }

  stats(state) {
    const i = this.i;
    const rows = [`<div class="stat realm"><span>${i.stat("경지")}</span><b>${i.realm(state.stat("경지"))}</b></div>`];
    for (const s of this.config.shownStats) rows.push(`<div class="stat"><span>${i.stat(s)}</span><b>${state.stat(s)}</b></div>`);
    this.$("#stats").innerHTML = rows.join("");
    const sit = state.situation ? `<li class="situation">${i.t(`situations.${state.situation}`)}</li>` : "";
    this.$("#items").innerHTML = sit + (state.items.length
      ? state.items.map((x) => `<li>${i.gloss(i.item(x)) ? `<span class="term" tabindex="0" data-term="${i.item(x)}">${i.item(x)}</span>` : i.item(x)}</li>`).join("")
      : `<li class="none">${i.t("game.emptyHands")}</li>`);
  }

  // 변화 기록 하나를 글로.
  changeText(c) {
    const i = this.i;
    if (c.type === "gain") return i.t("changes.gain", { item: i.item(c.item) });
    if (c.type === "lose") return i.t("changes.lose", { item: i.item(c.item) });
    if (c.type === "loseAll") return i.t("changes.loseAll");
    if (c.type === "realm") return i.t("changes.realm", { realm: i.realm(c.value) });
    if (c.type === "set") return `${i.stat(c.stat)} ${c.value}`;
    if (c.type === "join") return i.t("changes.join", { name: i.name(c.name) });
    if (c.type === "leave") return i.t("changes.leave");
    if (c.type === "situation") return c.name === "없음" ? i.t("changes.situationEnd") : i.t("changes.situation", { name: i.t(`situations.${c.name}`) });
    if (c.type === "bond") return i.t(c.delta > 0 ? "changes.bondUp" : "changes.bondDown", { name: i.name(c.name) });
    if (c.type === "fame") return i.t(c.delta > 0 ? "changes.fameUp" : "changes.fameDown", { name: i.name(c.name) });
    return `${i.stat(c.stat)} ${c.delta > 0 ? "+" : ""}${c.delta}`;
  }

  changesHtml(changes) {
    return changes.map((c) => `<span class="${c.good ? "up" : "down"}">${this.changeText(c)}</span>`).join(" ");
  }

  show(sec) {
    this.limitTerms(sec);
    this.stage.replaceChildren(sec);
    window.scrollTo({ top: 0 });
  }

  // 용어 밑줄 정리: termContext = { mode: () => "twice"|"always"|"off", counts: {} }
  // twice면 한 생에 용어마다 두 번까지만 밑줄을 남기고, 나머지는 보통 글자로 바꾼다.
  limitTerms(root) {
    const ctx = this.termContext;
    if (!ctx) return;
    const mode = ctx.mode();
    if (mode === "always") return;
    root.querySelectorAll(".term").forEach((t) => {
      const term = t.dataset.term;
      const n = ctx.counts[term] ?? 0;
      if (mode === "off" || n >= this.config.termLimit) t.replaceWith(...t.childNodes);
      else ctx.counts[term] = n + 1;
    });
  }

  // 기록창 전체를 다시 그린다 (최신이 맨 위). 기록에는 글 대신 id만 있어서 언어를 바꿔도 맞게 나온다.
  renderLog(entries) {
    const i = this.i;
    if (!entries.length) {
      this.logList.innerHTML = `<li class="empty">${i.t("game.logEmpty")}</li>`;
      return;
    }
    this.logList.innerHTML = entries
      .slice()
      .reverse()
      .map(
        (x) =>
          `<li class="${x.dead ? "dead" : ""}"><span class="t">${i.ev(x.ev, "title")}</span><span class="g">[${i.ev(x.ev, `c${x.c}.tag`)}]</span>${this.changesHtml(x.changes)}${x.dead ? `<span class="down">${i.t("game.death")}</span>` : ""}</li>`
      )
      .join("");
  }

  // 능력치·체질로 열린 선택지라면 무엇 덕분인지 보여 준다
  reqBadge(c) {
    const cond = c.condition ?? {};
    const i = this.i;
    const parts = [];
    if (cond.stat_min) parts.push(Object.entries(cond.stat_min).map(([k, v]) => i.t("game.statChoice", { stat: i.stat(k), v })).join(" · "));
    if (cond.stat_min_any) parts.push(Object.entries(cond.stat_min_any).map(([k, v]) => i.t("game.statChoice", { stat: i.stat(k), v })).join(i.t("game.or")));
    const stats = parts.map((p) => `<span class="trait-label">${p}</span>`).join("");
    return stats + this.traitBadge(c);
  }

  // 체질 전용 선택지라면 어떤 체질 덕분인지 보여 준다 (요구 단계의 이름)
  traitBadge(c) {
    const req = c.condition?.traits;
    if (!req) return "";
    return Object.entries(req)
      .map(([id, lv]) => {
        const tr = (this.config.traits ?? []).find((x) => x.id === id);
        const name = tr?.tiers[lv - 1]?.name ?? id;
        return `<span class="trait-label">${this.i.t("game.traitChoice", { name: this.i.t(`karmaScreen.traits.${name}.name`) })}</span>`;
      })
      .join("");
  }

  // dejavu: 기시감 문장을 붙일지 (전생에 이 인물과 인연이 깊었을 때)
  scene(ev, choices, onConfirm, isFresh = () => false, dejavu = false) {
    const i = this.i;
    const sec = el("section", "scene");
    // 기연 장면이면 제목 위에 기연 표시 (선택지에는 힌트를 주지 않는다)
    sec.innerHTML = `${ev.fortune ? `<p class="fortune-banner">${i.t("game.fortune")}</p>` : ""}<h2>${i.ev(ev.id, "title")}</h2><div class="prose">${linesToHtml(i.ev(ev.id, "desc"))}</div>${dejavu ? `<div class="prose dejavu">${linesToHtml(i.ev(ev.id, "dejavu"))}</div>` : ""}`;
    const list = el("div", "choices");
    const confirm = button(i.t("game.next"), () => go());
    confirm.hidden = true;
    let picked = null;

    const select = (n) => {
      picked = choices[n];
      list.querySelectorAll(".choice").forEach((b, j) => b.classList.toggle("picked", j === n));
      confirm.hidden = false;
    };
    const go = () => {
      if (!picked) return;
      this.lastChoice = picked; // 결과 화면에서 선택지의 능력치 표시용
      this.keys(null);
      onConfirm(picked);
    };

    choices.forEach((c, n) => {
      const badge = this.reqBadge(c);
      const b = el("button", "choice" + (c.warn ? " warn" : "") + (badge ? " trait" : ""));
      b.type = "button";
      b.innerHTML = `${badge}<span class="num">${n + 1}</span><span class="txt">${lineToHtml(i.ev(ev.id, `c${c.id}.text`))}${c.stat ? ` <span class="tag">[${i.stat(c.stat)}]</span>` : ""}</span>${c.outcomes.some((o) => o.effects?.ending) ? `<span class="end-label">${i.t("game.conclude")}</span>` : ""}${isFresh(c) ? `<span class="fresh-label">${i.t("game.fresh")}</span>` : ""}${c.warn ? `<span class="warn-label">${i.t("game.warn")}</span>` : ""}`;
      b.addEventListener("click", () => select(n));
      list.append(b);
    });
    sec.append(list, confirm);
    this.show(sec);

    this.keys((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= choices.length) { select(n - 1); return true; }
      if (e.key === "Enter" && picked) { go(); return true; }
      return false;
    });
  }

  // 첫 생에만 나오는 도입 화면.
  intro(evId, onDone) {
    const sec = el("section", "intro");
    sec.innerHTML = `<div class="prose">${linesToHtml(this.i.ev(evId, "intro"))}</div>`;
    const b = button(this.i.t("game.continue"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }

  // 결과는 새 화면으로: 장면 제목, 고른 선택 한 줄, 결과 글. textKey 예: "c2.o0"
  // textEv: 결과 글을 가져올 장면 (검은 비늘처럼 다른 장면의 결과로 바뀐 경우)
  outcome(evId, choiceId, textKey, changes, buttonKey, onNext, rare = false, fortune = false, textEv = evId, trait = null) {
    const i = this.i;
    const sec = el("section", "outcome" + (rare ? " rare" : ""));
    // trait: 결과를 바꾼 체질 id
    const traitHtml = trait ? `<div class="trait-banner"><b>${i.t("game.trait", { name: i.t(`karmaScreen.traits.${trait}.name`) })}</b><span>${i.t(`karmaScreen.traits.${trait}.fired`)}</span></div>` : "";
    sec.innerHTML = `${traitHtml}${rare ? `<p class="rare-banner">${i.t("game.rare", { n: this.config.karma.perRare })}</p>` : fortune ? `<p class="fortune-banner">${i.t("game.fortune")}</p>` : ""}<h2>${i.ev(evId, "title")}</h2>
      <p class="chosen">${lineToHtml(i.ev(evId, `c${choiceId}.text`))}${this.lastChoice?.stat ? ` <span class="tag">[${i.stat(this.lastChoice.stat)}]</span>` : ""}</p>
      <div class="prose">${linesToHtml(i.ev(textEv, textKey))}</div>`;
    if (changes.length) {
      sec.innerHTML += `<ul class="changes">${changes.map((c) => `<li class="${c.good ? "up" : "down"}">${this.changeText(c)}</li>`).join("")}</ul>`;
    }
    const b = button(i.t(buttonKey), onNext);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }

  ending(kind, summary, onDone) {
    const i = this.i;
    this.$("#toMenu").hidden = true;
    const sec = el("section", "ending " + kind);
    const end = this.lastEnding;
    const head = kind === "death" ? i.t("ending.deathHead") : kind === "ending" ? i.t(`endings.${end}.head`) : i.t("ending.endHead");
    const sub = kind === "death" ? "" : kind === "ending" ? `<p class="note">${i.t(`endings.${end}.note`)}</p>` : `<p class="note">${i.t("ending.endNote")}</p>`;
    sec.innerHTML = `<h2>${head}</h2>${sub}
      <dl class="karma">${summary.parts.filter((p) => p.value > 0 || ["scenes", "fresh"].includes(p.id)).map((p) => `<div class="part-${p.id}"><dt>${i.t(`ending.${p.id}`, { w: p.note ?? 0 })}</dt><dd>+${p.value}</dd></div>`).join("")}
      ${summary.mult > 1 ? `<div class="part-mult"><dt>${i.t("ending.mult")}</dt><dd>×${summary.mult.toFixed(2)}</dd></div>` : ""}
      <div class="total"><dt>${i.t("ending.total")}</dt><dd>+${summary.total}</dd></div></dl>
      ${summary.newAch.length ? `<p class="ach">${i.t("ending.newAch", { list: summary.newAch.map((a) => i.ach(a, "name")).join(", ") })}</p>` : ""}`;
    const b = button(i.t("game.toMain"), onDone);
    sec.append(b);
    this.show(sec);
    this.keys((e) => (e.key === "Enter" ? (b.click(), true) : false));
  }
}

function button(text, onClick, cls = "next") {
  const b = el("button", cls);
  b.type = "button";
  b.innerHTML = `${text}<kbd>Enter</kbd>`;
  b.addEventListener("click", () => { if (b.disabled) return; b.disabled = true; onClick(); });
  return b;
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// 메인 화면과 그 하위 화면(인과록, 업, 설정). 게임 규칙은 모른다. 글은 모두 i18n에서 꺼낸다.
// 조작: 메인에서는 숫자키로 바로 이동, 하위 화면은 Esc로 돌아가기.



class MenuScreens {
  constructor(root, i18n) {
    this.layer = root.querySelector("#screen");
    this.i = i18n;
  }

  hide() {
    this.layer.hidden = true;
  }

  show(sec, onBack) {
    this.layer.hidden = false;
    this.layer.replaceChildren(sec);
    window.scrollTo({ top: 0 });
    if (onBack) {
      const back = el("button", "back");
      back.type = "button";
      back.innerHTML = `${this.i.t("common.back")}<kbd>Esc</kbd>`;
      back.addEventListener("click", onBack);
      sec.prepend(back);
      Keys.set((e) => (e.key === "Escape" ? (onBack(), true) : false));
    }
  }

  // info: { lives, karma, hasSave }, h: { continue, newLife, achievements, karma, settings }
  main(info, h) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "menu");
    sec.innerHTML = `
      <div class="mast">
        <p class="eyebrow">${t("menu.eyebrow")}</p>
        <h1>${t("menu.title")}</h1>
        <p class="sub">${info.lives ? t("menu.livesLine", { n: `<b>${info.lives}</b>`, k: `<b>${info.karma}</b>` }) : t("menu.noLives")}</p>
      </div>`;
    const items = [
      { key: "continue", run: h.continue, off: !info.hasSave, note: info.hasSave ? "" : t("menu.noSave") },
      { key: "newLife", run: h.newLife, note: info.hasSave ? t("menu.loseSave") : "" },
      { key: "achievements", run: h.achievements },
      { key: "karma", run: h.karma },
      { key: "settings", run: h.settings },
    ];
    const nav = el("nav", "menu-list");
    let armed = false; // 새로 하기 두 번 확인용
    items.forEach((it, n) => {
      const b = el("button", "menu-item");
      b.type = "button";
      b.disabled = !!it.off;
      b.innerHTML = `<span class="num">${n + 1}</span><span class="lbl">${t("menu." + it.key)}</span>${it.note ? `<span class="mnote">${it.note}</span>` : ""}`;
      b.addEventListener("click", () => {
        if (it.key === "newLife" && info.hasSave && !armed) {
          armed = true;
          b.classList.add("armed");
          b.querySelector(".mnote").textContent = t("menu.confirmNew");
          return;
        }
        it.run();
      });
      nav.append(b);
    });
    sec.append(nav);
    this.show(sec);
    Keys.set((e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= items.length && !items[n - 1].off) { nav.children[n - 1].click(); return true; }
      if (e.key === "Enter" && !items[0].off) { nav.children[0].click(); return true; }
      return false;
    });
  }

  // 인과록: 인물 / 무공 / 집단 / 물건 / 업적 탭.
  // 도감 항목은 단계마다 req 중 하나라도 겪었으면 열린다(모든 생 누적). 첫 단계 전에는 이름도 ???.
  codex(sections, achList, record, onBack, startTab = "people") {
    const i = this.i;
    const sec = el("section", "sub-screen codex");
    const unlocked = record.data.achievements;
    const opened = (st) => st.req.some((r) => record.knows(r));
    const tabs = sections.map((s) => s.id).concat("achievements");
    const countOf = (id) => {
      if (id === "achievements") return [achList.filter((a) => unlocked.includes(a.id)).length, achList.length];
      const es = sections.find((s) => s.id === id).entries;
      return [es.filter((e) => opened(e.stages[0])).length, es.length];
    };
    sec.innerHTML = `<h2>${i.t("achievementsScreen.title")}</h2><div class="tabs main-tabs" role="tablist"></div><div class="codex-body"></div>`;
    const bar = sec.querySelector(".main-tabs");
    const body = sec.querySelector(".codex-body");

    const renderEntries = (id) => {
      const es = sections.find((s) => s.id === id).entries;
      body.innerHTML = `<ul class="ach-list codex-list">${es
        .map((e) => {
          const open = e.stages.filter(opened);
          if (!open.length || !opened(e.stages[0])) return `<li><b>${i.t("codex.unknown")}</b></li>`;
          const lines = e.stages.map((st, n) => (opened(st) ? `<span>${i.codex(e.id, `s${n}`)}</span>` : "")).join("");
          const more = open.length < e.stages.length ? `<span class="more">${i.t("codex.more")}</span>` : "";
          return `<li class="on"><b>${i.codex(e.id, "name")}</b>${lines}${more}</li>`;
        })
        .join("")}</ul>`;
    };
    const renderAch = () => {
      body.innerHTML = `<p class="sub">${i.t("achievementsScreen.sub", { got: `<b>${unlocked.filter((a) => achList.some((x) => x.id === a)).length}</b>`, all: achList.length, n: `<b>${record.data.outcomes.length}</b>` })}</p><div class="tabs sub-tabs" role="tablist"></div><ul class="ach-list"></ul>`;
      const sbar = body.querySelector(".sub-tabs");
      const ul = body.querySelector(".ach-list");
      const cats = Object.keys(i.t("achievementsScreen.categories")).filter((c) => achList.some((a) => a.category === c));
      const stabs = [{ id: "*", label: i.t("achievementsScreen.all"), items: achList }].concat(
        cats.map((c) => ({ id: c, label: i.t(`achievementsScreen.categories.${c}`), items: achList.filter((a) => a.category === c) }))
      );
      const draw = (tab) => {
        sbar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === tab.id));
        ul.innerHTML = tab.items
          .map((a) =>
            unlocked.includes(a.id)
              ? `<li class="on"><b>${i.ach(a.id, "name")}</b><span>${i.ach(a.id, "desc")}</span><span class="cond">${i.t("achievementsScreen.condLabel")} · ${i.ach(a.id, "cond")}</span></li>`
              : `<li><b>${i.t("achievementsScreen.locked")}</b><span>${i.ach(a.id, "hint")}</span></li>`
          )
          .join("");
      };
      stabs.forEach((tab) => {
        const b = el("button", "tab");
        b.type = "button";
        b.id = `tab-${tab.id === "*" ? "all" : tab.id}`;
        b.dataset.id = tab.id;
        const n = tab.items.filter((a) => unlocked.includes(a.id)).length;
        b.innerHTML = `${tab.label}<small>${n}/${tab.items.length}</small>`;
        b.addEventListener("click", () => draw(tab));
        sbar.append(b);
      });
      draw(stabs[0]);
    };
    const select = (id) => {
      bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === id));
      id === "achievements" ? renderAch() : renderEntries(id);
    };
    tabs.forEach((id) => {
      const b = el("button", "tab");
      b.type = "button";
      b.id = `codex-${id}`;
      b.dataset.id = id;
      const [got, all] = countOf(id);
      b.innerHTML = `${i.t(`codex.sections.${id}`)}<small>${got}/${all}</small>`;
      b.addEventListener("click", () => select(id));
      bar.append(b);
    });
    select(startTab);
    this.show(sec, onBack);
  }

  // 업 상점. shop: KarmaShop, onBuy(id)
  karma(total, shop, onBuy, onBack, tr) {
    const t = (k, v) => this.i.t(k, v);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `
      <h2>${t("karmaScreen.title")}</h2>
      <p class="big">${total}</p>
      <p class="sub">${t("karmaScreen.sub")}</p>
      <h3 class="shop-title">${t("karmaScreen.shopTitle")}</h3>
      <ul class="shop"></ul>
      <h3 class="shop-title">${t("karmaScreen.traitTitle")}</h3>
      <ul class="shop traits"></ul>`;
    const ul = sec.querySelector(".shop");
    shop.items.forEach((it, n) => {
      const lv = shop.level(it.id);
      const price = shop.price(it.id);
      const max = shop.isMax(it.id);
      const li = el("li", "shop-row");
      li.innerHTML = `<div class="shop-info"><b>${t(`karmaScreen.items.${it.id}.name`)}</b><span>${t(`karmaScreen.items.${it.id}.desc`)}</span><span class="shop-lv">${t("karmaScreen.level", { v: lv * it.amount })}</span></div>`;
      const b = el("button", "shop-buy");
      b.type = "button";
      b.id = `buy-${n}`;
      b.textContent = max ? t("karmaScreen.max") : t("karmaScreen.buy", { p: price });
      b.disabled = max || total < price;
      b.addEventListener("click", () => onBuy(it.id));
      li.append(b);
      ul.append(li);
    });
    const tl = sec.querySelector(".traits");
    shop.traits.forEach((it, n) => {
      const lv = shop.traitLevel(it.id);
      const on = shop.traitOn(it.id);
      const tier = shop.tierOf(it);
      const next = shop.nextTier(it);
      const li = el("li", "shop-row");
      const state = lv ? `<span class="shop-lv">${t(on ? "karmaScreen.traitOn" : "karmaScreen.traitOff")}</span>` : "";
      // 단계가 여럿인 체질은 단계 점(●○)과 지금 단계·다음 경지를 보여 준다
      const multi = it.tiers.length > 1;
      const pips = multi ? `<span class="tier-pips">${it.tiers.map((_, k) => (k < lv ? "●" : "○")).join("")}</span>` : "";
      const up = multi && lv
        ? `<span class="tier-line">${next ? t("karmaScreen.tierNext", { lv, name: t(`karmaScreen.traits.${next.name}.name`), desc: t(`karmaScreen.traits.${next.name}.desc`) }) : t("karmaScreen.tierMax", { lv })}</span>`
        : "";
      li.innerHTML = `<div class="shop-info"><b>${t(`karmaScreen.traits.${tier.name}.name`)}${pips}</b><span>${t(`karmaScreen.traits.${tier.name}.desc`)}</span>${up}${state}</div>`;
      const box = el("div", "shop-btns");
      if (lv) {
        const tg = el("button", "shop-buy");
        tg.type = "button";
        tg.id = `trait-${n}-toggle`;
        tg.textContent = t(on ? "karmaScreen.turnOff" : "karmaScreen.turnOn");
        tg.addEventListener("click", () => tr.toggle(it.id));
        box.append(tg);
      }
      if (next) {
        const b = el("button", "shop-buy");
        b.type = "button";
        b.id = `trait-${n}`;
        b.textContent = t(lv ? "karmaScreen.upgrade" : "karmaScreen.buy", { p: next.price });
        b.disabled = total < next.price;
        b.addEventListener("click", () => tr.buy(it.id));
        box.append(b);
      }
      li.append(box);
      tl.append(li);
    });
    this.show(sec, onBack);
  }

  // current: 설정값, languages: [{id, name}], h: { fontSize, language, wipe }
  settings(current, languages, h, onBack) {
    const t = (k) => this.i.t(k);
    const sec = el("section", "sub-screen");
    sec.innerHTML = `<h2>${t("settings.title")}</h2>
      <div class="set-row"><span class="set-lbl">${t("settings.fontSize")}</span><div class="seg" id="seg-fs" role="group"></div></div>
      <div class="set-row"><span class="set-lbl">${t("settings.termMode")}</span><p class="set-note">${t("settings.termNote")}</p><div class="seg" id="seg-term" role="group"></div></div>
      ${languages.length > 1 ? `<div class="set-row"><span class="set-lbl">${t("settings.language")}</span><div class="seg" id="seg-lang" role="group"></div></div>` : ""}
      <div class="set-row danger"><span class="set-lbl">${t("settings.wipe")}</span><p class="set-note">${t("settings.wipeNote")}</p></div>`;
    segment(sec.querySelector("#seg-fs"), FONT_SIZES.map((f) => ({ id: f.id, label: t(`settings.sizes.${f.id}`) })), current.fontSize, "fs", h.fontSize);
    segment(sec.querySelector("#seg-term"), TERM_MODES.map((m) => ({ id: m, label: t(`settings.termModes.${m}`) })), current.termMode ?? "twice", "term", h.termMode);
    const langSeg = sec.querySelector("#seg-lang");
    if (langSeg) segment(langSeg, languages.map((l) => ({ id: l.id, label: l.name })), current.language, "lang", h.language);

    const wipe = el("button", "wipe");
    wipe.type = "button";
    wipe.id = "wipe";
    wipe.textContent = t("settings.wipeBtn");
    let armed = false;
    wipe.addEventListener("click", () => {
      if (!armed) {
        armed = true;
        wipe.textContent = t("settings.wipeConfirm");
        wipe.classList.add("armed");
        return;
      }
      h.wipe();
      wipe.textContent = t("settings.wiped");
      wipe.disabled = true;
    });
    sec.querySelector(".danger").append(wipe);
    // 시험용 업 버튼 (config.testKarma가 0이면 숨김)
    if (h.testKarma) {
      const row = el("div", "set-row");
      row.innerHTML = `<span class="set-lbl">${t("settings.test")}</span>`;
      const tb = el("button", "wipe");
      tb.type = "button";
      tb.id = "test-karma";
      tb.textContent = t("settings.testKarma");
      tb.addEventListener("click", () => { h.testKarma(); tb.textContent = t("settings.testDone"); });
      row.append(tb);
      sec.append(row);
    }
    this.show(sec, onBack);
  }
}

function segment(box, options, currentId, prefix, onPick) {
  options.forEach((o) => {
    const b = el("button", "seg-btn" + (o.id === currentId ? " on" : ""));
    b.type = "button";
    b.id = `${prefix}-${o.id}`;
    b.textContent = o.label;
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      onPick(o.id);
    });
    box.append(b);
  });
}

// 앱 흐름: 메인 화면 ↔ 플레이(장면 → 선택 → 결과 → 다음 장면) → 정산 → 메인.















class App {
  constructor(events, achievements, codex, i18n, settings) {
    this.codex = codex;
    this.rng = new Rng();
    this.selector = new EventSelector(events, this.rng, CONFIG);
    this.resolver = new ResultResolver(this.rng, CONFIG);
    this.record = new LifeRecord(CONFIG);
    this.shop = new KarmaShop(CONFIG, this.record);
    this.novelty = new NoveltyWeigher(this.record, CONFIG);
    this.selector.useNovelty(this.novelty);
    this.saves = new SaveManager(CONFIG);
    this.settings = settings;
    this.i18n = i18n;
    this.achievements = achievements;
    this.view = new GameView(document, CONFIG, i18n);
    this.menu = new MenuScreens(document, i18n);
  }

  // ── 메인 화면 ──
  home() {
    this.view.close();
    this.menu.main(
      { lives: this.record.data.life, karma: this.record.data.karma, hasSave: this.saves.has() },
      {
        continue: () => this.continueLife(),
        newLife: () => this.newLife(),
        achievements: () => this.menu.codex(this.codex, this.achievements, this.record, () => this.home()),
        karma: () => this.openShop(),
        settings: () => this.openSettings(),
      }
    );
  }

  openShop() {
    this.menu.karma(
      this.record.data.karma,
      this.shop,
      (id) => { this.shop.buy(id); this.openShop(); },
      () => this.home(),
      { buy: (id) => { this.shop.buyTrait(id); this.openShop(); }, toggle: (id) => { this.shop.toggleTrait(id); this.openShop(); } }
    );
  }

  async openSettings() {
    const langs = await Promise.all(
      CONFIG.languages.map(async (id) => {
        await this.i18n.use(id);
        return { id, name: this.i18n.t("lang.name") };
      })
    );
    await this.i18n.use(this.settings.data.language);
    this.menu.settings(
      this.settings.data,
      langs,
      {
        fontSize: (id) => this.settings.set("fontSize", id),
        termMode: (id) => this.settings.set("termMode", id),
        language: async (id) => { this.settings.set("language", id); await this.i18n.use(id); this.openSettings(); },
        wipe: () => { this.record.wipe(); this.saves.clear(); },
        testKarma: CONFIG.testKarma ? () => this.record.grant(CONFIG.testKarma) : null,
      },
      () => this.home()
    );
  }

  // 인과록 도감: 지금 상태에서 알게 된 것을 기록
  learnFrom(s, evId) {
    this.record.learn([
      `ev:${evId}`,
      ...[...s.flags].map((f) => `flag:${f}`),
      ...s.items.map((x) => `item:${x}`),
      ...Object.keys(s.bonds).map((b) => `bond:${b}`),
      ...s.achievements.map((a) => `ach:${a}`),
      ...(s.affiliation ? [`aff:${s.affiliation}`] : []),
    ]);
  }

  // ── 플레이 ──
  enterGame() {
    this.menu.hide();
    this.state.traits = this.shop.activeLevels();
    this.state.pastBonds = { ...this.record.data.bondsMax };
    this.view.termContext = { mode: () => this.settings.data.termMode, counts: this.state.termCounts };
    this.view.open(() => this.home());
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.stats(this.state);
    this.view.renderLog(this.state.log);
  }

  newLife() {
    this.saves.clear();
    this.state = new GameState(CONFIG);
    this.state.stats.업 = this.record.data.karmaEarned; // 지금까지 쌓은 업 총량이 확률 보정에 쓰인다 (화면에는 안 보임)
    this.shop.apply(this.state);
    this.record.learn(this.state.items.map((x) => `item:${x}`));
    const life = this.record.startLife();
    this.enterGame();
    const first = this.selector.byId(CONFIG.prologueId);
    // 도입부(intro)는 맨 첫 생에만 보여준다.
    if (first?.intro && life === 1) return this.view.intro(first.id, () => this.play(first));
    this.play(first ?? this.selector.next(this.state));
  }

  continueLife() {
    const saved = this.saves.load();
    if (!saved) return this.home();
    this.state = saved.state;
    this.enterGame();
    this.play(saved.eventId ? this.selector.byId(saved.eventId) : null);
  }

  play(ev) {
    if (!ev) return this.finish("end");
    const s = this.state;
    s.seen.add(ev.id);
    if (ev.situation) s.situation = ev.situation; // 상황 장면에 들어서면 그 상황에 처한다
    s.lastEventId = ev.id;
    s.recent = [...(s.recent ?? []), ev.id].slice(-3);
    this.saves.save(s, ev.id);
    // '처음' 표시: 두 번째 생부터, 한 번도 골라 본 적 없는 선택지
    const isFresh = (c) => this.record.data.life > 1 && this.novelty.isFreshChoice(ev.id, c.id, s);
    this.view.scene(ev, this.selector.availableChoices(ev, s), (choice) => {
      s.scenes += 1;
      // memory=false인 장면(첫 장면 등)은 전생의 기억 보정을 받지 않는다.
      const deaths = ev.memory === false ? 0 : this.record.deathsAt(ev.id, choice.id);
      let outcome = this.resolver.pick(choice, s, deaths);
      // 체질: 켜 둔 체질이 막는 결과가 나오면 그 결과들을 빼고 다시 굴린다.
      let trait = this.shop.blocker(outcome);
      if (trait) {
        let outs = choice.outcomes.filter((o) => !this.shop.blocker(o));
        if (!outs.length) trait = null;
        else {
          // 남은 결과에 기본 결과(chance 없음)가 없으면 마지막 결과를 기본으로
          if (!outs.some((o) => o.chance == null)) outs = outs.map((o, k) => (k === outs.length - 1 ? { ...o, chance: undefined, src: o } : o));
          const re = this.resolver.pick({ ...choice, outcomes: outs }, s, deaths);
          outcome = re.src ?? re;
        }
      }
      // 확률 보정 때문에 결과가 복사본일 수 있어서, 원본 위치는 src나 글로 찾는다
      const oi = choice.outcomes.findIndex((o) => o === outcome || o === outcome.src || o.text === outcome.text);
      let textKey = `c${choice.id}.o${oi}`;
      let textEv = ev.id;
      s.outcomesSeen.push(`${ev.id}:${textKey}`);
      // 검은 비늘: 수준 낮은 적에게 죽을 뻔하면 한 번 막아준다.
      const guard = CONFIG.scaleGuard;
      if (outcome.effects?.death && outcome.weak && s.hasItem(guard.item) && !s.flags.has(guard.usedFlag)) {
        outcome = this.selector.byId(guard.event).choices[0].outcomes[0];
        textEv = guard.event;
        textKey = "c1.o0";
      }
      const rare = this.resolver.isRare(outcome);
      if (rare) s.rare += 1;
      const changes = this.resolver.apply(outcome, s);
      s.log.push({ ev: ev.id, c: choice.id, changes, dead: s.dead });
      this.learnFrom(s, ev.id);
      this.view.stats(s);
      this.view.renderLog(s.log);

      if (s.dead) {
        this.saves.clear();
        this.record.recordDeath(ev.id, choice.id);
        return this.view.outcome(ev.id, choice.id, textKey, changes, "game.closeEyes", () => this.finish("death"), rare, !!outcome.fortune, textEv, trait?.name);
      }
      // 귀결: 이야기가 매듭지어지면 결과를 보여 준 뒤 생을 마친다
      if (s.ending) {
        this.saves.clear();
        return this.view.outcome(ev.id, choice.id, textKey, changes, "game.continue", () => this.finish("ending"), rare, !!outcome.fortune, textEv, trait?.name);
      }
      // 다음 장면을 지금 정해 저장해 둔다 (껐다 켜서 다시 고르기 방지).
      const nextId = outcome.effects?.next_event;
      const next = nextId ? this.selector.byId(nextId) : this.selector.next(s);
      this.saves.save(s, next?.id ?? null);
      this.view.outcome(ev.id, choice.id, textKey, changes, "game.continue", () => this.play(next), rare, !!outcome.fortune, textEv, trait?.name);
    }, isFresh, !!ev.dejavu && meetsCondition(s, { past_bond_min: { [ev.dejavu.person]: ev.dejavu.min } }));
  }

  finish(kind) {
    this.saves.clear();
    const summary = this.record.endLife(this.state);
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.lastEnding = this.state.ending;
    this.view.ending(kind, summary, () => this.home());
  }
}

async function boot() {
  const settings = new Settings(CONFIG);
  settings.apply();
  const i18n = new I18n(CONFIG.langDir);
  const lang = CONFIG.languages.includes(settings.data.language) ? settings.data.language : CONFIG.defaultLanguage;
  await i18n.use(lang);
  new Tooltip(document, i18n);
  const loader = new EventLoader(CONFIG.eventIndex, CONFIG.achievementsPath, CONFIG.codexPath);
  const [events, ach, codex] = await Promise.all([loader.load(), loader.loadAchievements(), loader.loadCodex()]);
  new App(events, ach, codex, i18n, settings).home();
}

boot();

})();
</script>

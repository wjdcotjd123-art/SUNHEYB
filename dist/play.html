": ["진호와 나란히 앉아, 숨을 골랐다.", "", "진호의 숨소리가 거칠었다.", "\"숨을 세지 말고, **배를 봐**.\"", "관주에게 들은 말을, 그대로 일러 주었다.", "", "진호의 숨이 **조금 길어졌다**."], "B012.c3.tag": "근력", "B012.c3.text": "지구식 운동을 가르쳐 준다", "B012.c3.o0": ["\"이거 해 봐. 바닥에 엎드려서, 팔로 몸을 밀어 올려.\"", "", "진호가 팔굽혀펴기를 열 번 하고 **나자빠졌다**.", "\"…이게, 무공이야?\"", "\"…비슷한 거야.\"", "", "다음 날, 진호의 목검이 **조금 묵직해졌다**."], "B014.title": "철산무관의 도전", "B014.desc": ["장터 고을 건너편, **철산무관**의 제자 셋이 대문을 걷어찼다.", "", "\"백운무관이 삼재검법 따위나 가르친다며?\"", "\"한 수 배우러 왔다.\"", "", "엄 관주는 마루에서 차를 마시고 있었다.", "\"…누가 나갈 테냐.\""], "B014.c1.tag": "나감", "B014.c1.text": "내가 나선다", "B014.c1.o0": ["목검을 들고 마당 가운데 섰다.", "상대의 도가 **무겁게** 떨어졌다. 세 합 만에, 목검이 부러졌다.", "", "철산무관 제자들이 **비웃으며** 돌아갔다.", "관주는 아무 말도 하지 않았다. 다만, 다음 날 새 목검이 내 방 앞에 놓여 있었다."], "B014.c1.o1": ["목검을 들고 마당 가운데 섰다.", "상대의 도가 무겁게 떨어졌다. **천**으로 걷어 올렸다.", "**지**로 발목을 쓸었다. 상대가 휘청였다.", "**인.** 목검 끝이 상대의 목젖 앞에서 멈췄다.", "", "철산무관 제자들이 **말없이** 대문을 나갔다.", "수련생들이 와 하고 함성을 질렀다.", "관주가 찻잔을 내려놓았다.", "\"…따위라더니.\""], "B014.c2.tag": "마철", "B014.c2.text": "마철과 함께 나선다", "B014.c2.o0": ["\"형, 같이 가.\"", "마철이 코웃음을 쳤다. 그래도 목검을 들었다.", "", "둘이서 셋을 상대했다.", "마철이 앞을 막고, 내가 옆을 찔렀다.", "", "철산무관 제자들이 물러간 뒤, 마철이 내 어깨를 **툭 쳤다**.", "\"…나쁘지 않네.\""], "B014.c3.tag": "관주", "B014.c3.text": "관주를 바라본다", "B014.c3.o0": ["관주를 바라보았다.", "", "관주가 한숨을 쉬며 일어났다.", "**차 한 모금** 마실 동안, 철산무관 제자 셋이 마당에 누웠다.", "", "…저게, 사람이 할 수 있는 일인가."], "B015.title": "관주의 흉터", "B015.desc": ["비 오는 밤, 관주가 술을 마시고 있었다.", "", "소매가 걷힌 왼팔에, **길고 깊은 흉터**가 있었다.", "\"…녹풍채 두목한테 받은 거다. 스무 해 전에.\"", "\"그놈 칼을 막다가, 내 사형이 죽었지.\"", "", "관주가 술잔을 비웠다.", "\"그날 이후로, 삼재검법만 가르친다.\""], "B015.c1.tag": "왜", "B015.c1.text": "왜 삼재검법만 가르치느냐고 묻는다", "B015.c1.o0": ["\"왜, 삼재검법만입니까.\"", "", "\"화려한 검은, 사람을 죽이고 싶게 만든다.\"", "\"삼재검법은, 살아남게 만든다.\"", "", "관주가 목검을 들었다. 처음 보는 초식이었다.", "\"…네 번째다. 하늘도 땅도 사람도 아닌, **물러섬**.\""], "B015.c2.tag": "숨", "B015.c2.text": "말없이 술을 따르고 숨을 고른다", "B015.c2.o0": ["말없이 관주의 잔에 술을 따랐다.", "", "관주가 한참 말이 없다가, 중얼거렸다.", "\"…토납에는, 구절이 하나 더 있다.\"", "\"사형한테 배운 거다. 너한테 준다.\"", "", "그 구절대로 숨을 쉬자, 아랫배의 기운이 **두 바퀴** 돌았다."], "B016.title": "폭포 아래", "B016.desc": ["관주가 수련생들을 뒷산 **폭포**로 데려갔다.", "", "\"물줄기 아래 앉아라. 숨이 흐트러지면, 물이 너를 쓰러뜨린다.\""], "B016.c1.tag": "앉음", "B016.c1.text": "물줄기 아래 앉아 토납을 한다", "B016.c1.o0": ["물줄기 아래 앉았다.", "숨을 세 번 쉬기도 전에, **물살이 나를 밀어냈다**.", "", "이가 딱딱 부딪혔다.", "관주가 말했다. \"…내일 또.\""], "B016.c1.o1": ["물줄기 아래 앉았다.", "차가운 물이 정수리를 때렸다. 숨을 놓치지 않았다.", "", "해가 기울 무렵, 물소리가 **멀어졌다**.", "아랫배의 기운만이, 또렷했다."], "B016.c2.tag": "구경", "B016.c2.text": "바위에 앉아 다른 이들을 지켜본다", "B016.c2.o0": ["바위에 앉아, 물줄기 아래의 진호와 마철을 지켜보았다.", "마철이 **세 번** 떠내려갔다.", "", "관주가 나를 보며 혀를 찼다.", "\"…구경도 수련이냐.\""], "B017.title": "첫 진검", "B017.desc": ["관주가 칼 한 자루를 내밀었다.", "목검이 아니었다. **진검**이었다.", "", "\"정식 제자는, 진검으로 삼재를 익힌다.\""], "B017.c1.tag": "휘두름", "B017.c1.text": "진검으로 삼재검법을 펼친다", "B017.c1.o0": ["진검을 휘둘렀다.", "목검보다 **세 배는 무거웠다**. 천에서 팔이 처졌다.", "", "해가 질 때까지 휘둘렀다.", "마지막 인에서, 칼끝이 **허공을 갈랐다**. 바람 소리가 났다."], "B017.c2.tag": "닦음", "B017.c2.text": "휘두르기 전에 칼날을 닦는다", "B017.c2.o0": ["휘두르기 전에, 칼날을 닦았다.", "칼날에, **내 얼굴**이 비쳤다.", "이 세상에 떨어진 지, 얼마나 됐더라.", "", "관주가 말했다.", "\"…칼을 무서워할 줄 아는 놈이, 오래 산다.\""], "N000.title": "골짜기의 화톳불", "N000.desc": ["마을 연기를 등지고, 반대편 골짜기로 내려갔다.", "", "해 질 녘, 바위 그늘에 **화톳불**이 보였다.", "고기 굽는 냄새.", "", "가까이 가기도 전에, 목덜미에 **차가운 쇠**가 닿았다.", "\"어이쿠, 제 발로 걸어 들어온 놈이 다 있네.\"", "", "허리에 **초록 띠**를 두른 사내들이었다."], "N000.c1.tag": "순순히", "N000.c1.text": "두 손을 들고 끌려간다", "N000.c1.o0": ["두 손을 들었다.", "", "사내들이 내 손목을 묶어, 산 위로 끌고 올라갔다.", "\"두목님이 좋아하시겠다. 일손이 모자라던 참인데.\""], "N000.c2.tag": "뿌리침", "N000.c2.text": "칼날을 밀치고 달아난다", "N000.c2.o0": ["칼날을 밀치고, 골짜기 아래로 몸을 날렸다.", "", "등 뒤에서 **화살 소리**가 났다.", "**<red>등이 뜨거워졌다.<\/red>**"], "N000.c2.o1": ["칼날을 밀치고, 골짜기 아래로 몸을 날렸다.", "", "구르고, 또 굴렀다. 화살이 귓가를 스쳤다.", "정신을 차렸을 때, 낯선 **큰길**이 보였다."], "N000.c3.tag": "말", "N000.c3.text": "\"길 잃은 나그네요. 고기 한 점만 주시오.\" 하고 말한다", "N000.c3.o0": ["\"…길 잃은 나그네요. 고기 한 점만 주시오.\"", "", "사내들이 서로 얼굴을 보다가, **배를 잡고 웃었다**.", "\"산적한테 밥을 빌어? 간이 배 밖에 나왔구먼.\"", "", "고기 한 점을 얻어먹었다. 그리고 손목이 묶였다."], "N001.title": "입산 시험", "N001.desc": ["산채 마당. 횃불이 둥글게 서 있었다.", "", "가운데 무릎 꿇린 사내 하나. **표국 무복**을 입고, 입에 재갈이 물려 있었다.", "사내는 겁먹지 않았다. **이쪽을 똑바로** 보고 있었다.", "", "호피를 깔고 앉은 애꾸눈 사내가, 내 발치에 **칼**을 던졌다.", "녹풍채 두목, **독안 장패**였다.", "\"베어라.\"", "\"그럼 오늘부터, 녹풍채 식구다.\""], "N001.c1.tag": "벰", "N001.c1.text": "칼을 들어 벤다", "N001.c1.o0": ["칼을 들었다. 손이 떨렸다.", "", "눈을 감고, 내리쳤다.", "**<red>뜨뜻한 것이 얼굴에 튀었다.<\/red>**", "", "장패가 껄껄 웃으며 동전 몇 닢을 던졌다.", "\"잘했다, 막내.\"", "", "그날 밤, 손을 씻고 또 씻었다. 냄새가 **빠지지 않았다**."], "N001.c2.tag": "못함", "N001.c2.text": "\"…못 하겠습니다.\" 하고 칼을 내려놓는다", "N001.c2.o0": ["\"…못 하겠습니다.\"", "", "장패의 하나 남은 눈이, 가늘어졌다.", "\"그래? 그럼 네가 대신 묻혀라.\"", "", "**<red>구덩이는, 둘이 들어가도 넉넉했다.<\/red>**"], "N001.c2.o1": ["\"…못 하겠습니다.\"", "", "정적. 그리고 장패가 **무릎을 치며** 웃었다.", "\"사람 못 죽이는 놈은 처음이네. 배짱은 있구먼.\"", "\"물이나 길어라. 죽도록 맞고 나서.\"", "", "**<green>잡일꾼으로, 산채에 남았다.<\/green>** 대신, 실컷 두들겨 맞았다."], "N001.c3.tag": "밧줄", "N001.c3.text": "베는 척하며 사내의 밧줄을 끊는다", "N001.c3.o0": ["칼을 내리치는 척, 밧줄을 그었다.", "", "장패의 눈이 **번뜩였다**.", "\"…이놈 봐라?\"", "", "**<red>둘 다, 그 마당을 나가지 못했다.<\/red>**"], "N001.c3.o1": ["칼을 내리치는 척, 밧줄을 그었다.", "", "그 순간 표사가 **튀어 올랐다**. 맨손으로 산적 둘을 쓰러뜨리고, 내 멱살을 잡아 숲으로 끌었다.", "\"정신 차리고 뛰어!\"", "", "밤새 뛰었다. 새벽, 산 아래 큰길에서 표사가 숨을 고르며 말했다.", "\"청하표국 표사 **진우**다. 이 은혜는 갚지.\"", "", "진우는 표국으로 돌아가고, 나는 **반대쪽 길**로 걸었다."], "N001.c4.tag": "솜씨", "N001.c4.text": "칼끝으로 사내의 상투만 베어 낸다", "N001.c4.o0": ["칼을 집어 들었다.", "손목이 저절로 돌았다. 하늘을 긋고, 땅을 쓸고, 사람을 겨눈다.", "", "**사각.**", "", "표사의 상투가, 마당에 **툭** 떨어졌다. 목에는 생채기 하나 없었다.", "", "마당이 조용해졌다.", "장패가 하나 남은 눈을 크게 떴다.", "\"…**제법이군.** 검도 다룰 줄 아는 놈이었어.\"", "\"목 베는 놈은 널렸다. 저렇게 베는 놈은 귀하지. 오늘부터 내 옆에서 칼 들어라.\"", "", "표사는 몸값을 받고 풀려났다. 나는, **두목의 칼잡이**가 되었다."], "N001.c5.tag": "역습", "N001.c5.text": "칼을 들고 두목에게 달려든다", "N001.c5.o0": ["칼을 집어 들고, 표사 대신 **장패**를 향해 몸을 돌렸다.", "", "장패가 호피 위에서 일어나지도 않고 웃었다.", "\"…무관 물 먹은 놈이구먼.\"", "", "장패의 칼이, 내 칼보다 **한 뼘** 길었다.", "**<red>횃불이, 옆으로 누웠다.<\/red>**"], "N001.c5.o1": ["칼을 집어 들고, 표사 대신 **장패**를 향해 몸을 돌렸다.", "", "장패가 호피 위에서 일어나지도 않고 웃었다.", "\"…무관 물 먹은 놈이구먼.\"", "", "첫 칼이 막혔다. 둘째 칼이, 장패의 **뺨**을 그었다.", "그 틈에 표사가 밧줄을 끊고 일어섰다. 둘이서 횃불을 걷어차고, 어둠 속으로 뛰었다.", "", "등 뒤에서 장패가 고함쳤다.", "\"그 얼굴, **잊지 않으마**.\""], "N001.c6.tag": "녹풍도", "N001.c6.text": "칼 대신 옆 산적의 도를 빼앗아 든다", "N001.c6.o0": ["발치의 칼을 두고, 옆에 선 산적의 **도**를 낚아챘다.", "", "도 자루가 손에 감기자, 팔이 크게 돌았다. 바람을 가르고, 셋을 베고 지나가는 칼.", "표사의 머리 위 횃불 셋이, 한꺼번에 **꺼졌다**.", "", "마당의 산적들이 술렁였다.", "장패가 호피에서 몸을 일으켰다. 하나 남은 눈이, 내 손의 도를 **꿰뚫듯** 보았다.", "\"…그건 **우리의 도법**이다.\"", "\"네 놈이 어떻게…!\"", "", "대답하지 않았다.", "", "한참 뒤, 장패가 다시 호피에 앉았다.", "\"…좋다. 어디서 굴러온 놈이든, 그 칼이면 식구다. 대신 내 눈 밖에 나지 마라.\"", "", "표사는 몸값을 받고 풀려났다. 산적들은 그날부터, 나를 **멀찍이서** 보았다."], "N002.title": "막내의 하루", "N002.desc": ["산채의 막내는, 사람이 아니었다.", "", "새벽엔 물을 길었다. 낮엔 칼을 갈았다. 밤엔 고참들의 **발을 씻겼다**.", "", "고참 **돌쇠**가 물동이를 발로 걷어찼다.", "\"물이 미지근하잖아. 다시 길어 와.\""], "N002.c1.tag": "참음", "N002.c1.text": "말없이 다시 길어 온다", "N002.c1.o0": ["말없이 다시 길어 왔다.", "", "돌쇠가 물을 한 모금 마시고, 남은 물을 내 머리에 부었다.", "\"그래. 막내는 그래야지.\""], "N002.c2.tag": "대듦", "N002.c2.text": "\"이번엔 직접 길어 오시지요.\" 하고 맞선다", "N002.c2.o0": ["\"이번엔, 직접 길어 오시지요.\"", "", "돌쇠의 주먹이 먼저 왔다. 그 다음은 발이었다.", "**사흘을 앓았다.**"], "N002.c2.o1": ["\"이번엔, 직접 길어 오시지요.\"", "", "돌쇠가 주먹을 휘둘렀다. 피하고, 정강이를 걷어찼다.", "돌쇠가 물동이 위로 **나자빠졌다**.", "", "산적들이 휘파람을 불었다.", "\"막내가 이빨이 있네.\""], "N002.c3.tag": "꾀", "N002.c3.text": "돌쇠의 물에 소금을 탄다", "N002.c3.o0": ["다음 물동이에, 소금을 한 줌 풀었다.", "", "돌쇠가 한 모금 마시고, **사레가 들렸다**.", "\"이, 이게 무슨…!\"", "\"바닷물이 몸에 좋답니다. 제 고향에선 다들 그렇게 마십니다.\"", "", "돌쇠는 한참 나를 노려보다가, **다시는 물 심부름을 시키지 않았다**."], "N002.c4.tag": "토납", "N002.c4.text": "숨을 고르며 물동이를 쉬지 않고 나른다", "N002.c4.o0": ["숨을 길게 들이쉬고, 단전에 모았다.", "물동이 둘을 지고, 산채와 개울을 **쉬지 않고** 오갔다. 해가 질 때까지.", "", "돌쇠가 입을 벌린 채 보고 있었다.", "\"…숨 한 번 안 차네. 너 **내공** 쓰는 놈이냐?\"", "", "그날부터 돌쇠는 나를 막내라 부르지 않았다. **\"어이, 숨쟁이.\"**"], "N003.title": "첫 약탈", "N003.desc": ["고개 아래로, 상단의 **수레 다섯 대**가 올라왔다.", "호위 표사는 넷.", "", "장패가 턱짓했다.", "\"막내, 오늘은 너도 내려간다.\"", "", "나뭇가지 사이로, 수레 끝에 앉은 **어린 몸종** 하나가 보였다."], "N003.c1.tag": "앞장", "N003.c1.text": "고함을 지르며 맨 앞에서 뛰어내린다", "N003.c1.o0": ["고함을 지르며, 맨 앞에서 뛰어내렸다.", "", "표사의 창이, **배를 꿰뚫었다**.", "**<red>고함이, 끝까지 나오지 않았다.<\/red>**"], "N003.c1.o1": ["고함을 지르며, 맨 앞에서 뛰어내렸다.", "표사 하나와 뒤엉켜 비탈을 굴렀다. 일어난 쪽은, 나였다.", "", "상단은 짐을 버리고 달아났다.", "장패가 비단 한 필을 내 어깨에 걸쳐 주었다.", "\"막내 몫이다.\""], "N003.c2.tag": "뒷전", "N003.c2.text": "뒤에서 짐만 나른다", "N003.c2.o0": ["싸움은 앞에서 끝났다.", "나는 뒤에서, 쌀가마를 **산으로 날랐다**.", "", "돌쇠가 침을 뱉었다.", "\"칼 한 번 안 뽑은 놈이, 밥은 제일 많이 먹지.\""], "N003.c3.tag": "놓아줌", "N003.c3.text": "수레 뒤로 돌아가 몸종의 손을 풀어 준다", "N003.c3.o0": ["싸움판을 돌아, 수레 뒤로 갔다.", "몸종의 손목 밧줄을 풀어 주고, 덤불 쪽을 가리켰다.", "", "…돌아서자, 돌쇠가 서 있었다.", "\"두목님이 아시면, 재미있겠는데.\"", "", "그날 밤, 장패 앞에서 **매를 맞았다**. 돌쇠는 웃었다."], "N003.c3.o1": ["싸움판을 돌아, 수레 뒤로 갔다.", "몸종의 손목 밧줄을 풀어 주고, 덤불 쪽을 가리켰다.", "", "아이가 한 번 돌아보고, **덤불 속으로 사라졌다**.", "아무도 보지 못했다."], "N003.c4.tag": "솜씨", "N003.c4.text": "표사 우두머리의 칼을 쳐 떨어뜨린다", "N003.c4.o0": ["표사 우두머리 앞에 섰다.", "몸이 기억하는 대로 칼을 뉘었다가, 세웠다. 천, 지, 인.", "", "**쨍.**", "표사의 칼이 비탈 아래로 굴렀다.", "", "표사들이 칼을 버리고 물러났다. 피 한 방울 흘리지 않은 약탈이었다.", "장패가 내 어깨를 쳤다.", "\"**검 쓸 줄 아는 놈**은 이래서 좋아. 시체 치울 일이 없거든.\""], "N003.c5.tag": "배신", "N003.c5.text": "상단 편에 서서 산적을 막는다", "N003.c5.o0": ["돌아서서, 뒤따라 내려오던 **돌쇠**에게 칼을 겨눴다.", "손이 저절로 하늘을 긋고, 땅을 쓸었다.", "", "돌쇠가 칼을 놓치고 주저앉았다.", "\"…이놈, 무관에서 굴러먹던 놈이었구먼.\"", "", "표사들이 산적들을 밀어냈다. 산 위에서, 장패의 **고함**이 메아리쳤다.", "", "상단은 무사히 고개를 넘었다. 나는 상단을 따라, **산을 내려갔다**."], "N004.title": "외팔이 노가", "N004.desc": ["산채 뒤 바위에서, **외팔이 노가**가 혼자 도를 휘두르고 있었다.", "왼팔 소매가 바람에 **펄럭였다**.", "", "\"…거기 숨어서 뭘 봐.\"", "", "노가가 도를 바위에 꽂았다.", "\"배우고 싶으면, 장작 백 단부터 패.\""], "N004.c1.tag": "장작", "N004.c1.text": "장작 백 단을 팬다", "N004.c1.o0": ["사흘 동안, 장작 백 단을 팼다.", "손바닥이 터지고, 아물고, 다시 터졌다.", "", "노가가 장작더미를 보고 코웃음을 쳤다.", "\"…미련한 놈이 오래 살지.\"", "", "그날부터, 노가가 **녹풍도법**의 첫 초식을 보여 주었다.", "도를 크게 휘둘러 **바람을 가르는** 칼. 녹림 산적들이 대대로 써 온, 투박한 도법이었다."], "N004.c2.tag": "질문", "N004.c2.text": "\"그 팔은, 어쩌다 잃으셨습니까.\" 하고 묻는다", "N004.c2.o0": ["\"그 팔은, 어쩌다 잃으셨습니까.\"", "", "노가가 한참 말이 없었다.", "\"…표국 놈들 호송 수레를 털다가. 표사 하나가, **검을 쓸 줄 알더군**.\"", "\"너도 기억해 둬. 산적 칼은 셋을 상대하는 칼이다. 하나를 상대하는 칼이 아니고.\"", "", "그리고 도를 뽑아, 첫 초식을 **딱 한 번** 보여 주었다."], "N004.c3.tag": "솜씨", "N004.c3.text": "주운 칼로 노가의 도를 받아 본다", "N004.c3.o0": ["주운 칼을 들고, 노가 앞에 섰다.", "노가의 도가 내려왔다. 받아 흘리고, 비켜 섰다. 손이 먼저 길을 알았다.", "", "노가가 도를 멈췄다.", "\"…**삼재검법**이군. 무관에서 애들 가르치는 그거.\"", "\"흔해 빠졌지만, 뿌리는 바르다. 거기에 산적 칼을 얹으면, 제법 쓸 만하겠어.\"", "", "그날 노가는, 녹풍도법 **세 초식**을 한꺼번에 보여 주었다."], "N004.c4.tag": "토납", "N004.c4.text": "노가 곁에 앉아 숨을 고른다", "N004.c4.o0": ["노가 곁 바위에 앉아, 숨을 골랐다.", "들이쉬고, 모으고, 내쉬었다.", "", "노가가 곁눈질하다가, 혀를 찼다.", "\"…숨은 제대로 쉬는 놈이네. 그 숨으로 도를 휘두르면, **세 번 휘두를 걸 다섯 번** 휘두른다.\"", "", "노가가 도를 내 손에 쥐여 주었다."], "N005.title": "산채의 나날", "N005.desc": ["산채의 하루는 길었다.", "", "고개 너머에서 상단 소식이 오면 칼을 갈고, 오지 않으면 **노름판**이 섰다.", "돌쇠가 투전목을 흔들었다.", "\"막내, 한 판 할래?\""], "N005.c1.tag": "수련", "N005.c1.text": "바위 뒤에서 녹풍도법을 휘두른다", "N005.c1.o0": ["바위 뒤에서, 도를 휘둘렀다.", "바람을 가르고, 또 갈랐다.", "", "노가가 지나가다 한마디 했다.", "\"허리. 팔로 휘두르지 마라.\""], "N005.c2.tag": "노름", "N005.c2.text": "투전판에 앉는다", "N005.c2.o0": ["투전판에 앉았다.", "", "…확률. 남은 패를 세면, **다음 패가 보였다**.", "", "돌쇠의 전대가, 내 앞으로 왔다.", "\"…이 새끼, 패를 세는 거 아냐?\""], "N005.c2.o1": ["투전판에 앉았다.", "패를 셌다. 셌는데도, **졌다**.", "", "\"하늘에서 떨어진 놈도, 투전은 못 이기네.\""], "N005.c3.tag": "잡일", "N005.c3.text": "칼을 갈고 무기고를 정리한다", "N005.c3.o0": ["무기고의 녹슨 칼을, 하나씩 갈았다.", "", "장패가 지나가다, 반짝이는 칼날에 얼굴을 비춰 보았다.", "\"…쓸 만하군.\""], "N005.c4.tag": "삼재", "N005.c4.text": "삼재검법을 되짚는다", "N005.c4.o0": ["밤, 산채 뒤 공터에서 칼을 들었다.", "천. 지. 인. 천하에서 가장 흔한 검법이, 가장 **정직하게** 손을 따라왔다.", "", "보초를 서던 산적이 하품을 하며 중얼거렸다.", "\"…산적이 검법 연습은. 별종이야.\""], "N006.title": "보초 서는 밤", "N006.desc": ["보초 서는 밤.", "", "산채 문 밖으로, 달빛 받은 **산길**이 하얗게 뻗어 있었다.", "뒤에서는 산적들의 코 고는 소리.", "", "…지금이면, 아무도 모른다."], "N006.c1.tag": "남음", "N006.c1.text": "창을 고쳐 쥐고 자리를 지킨다", "N006.c1.o0": ["창을 고쳐 쥐었다.", "", "새벽, 교대하러 온 돌쇠가 하품을 했다.", "\"별일 없었냐.\"", "\"…없었습니다.\""], "N006.c2.tag": "도망", "N006.c2.text": "창을 내려놓고 산길을 내려간다", "N006.c2.o0": ["창을 내려놓고, 산길을 내려갔다.", "", "세 번째 굽이에서, **덫**을 밟았다.", "횃불이 다가왔다. 장패의 목소리.", "\"…막내야. 녹풍채는, 들어올 때는 맘대로여도 나갈 때는 아니다.\"", "", "**<red>달빛이, 붉게 번졌다.<\/red>**"], "N006.c2.o1": ["창을 내려놓고, 산길을 내려갔다.", "", "굽이를 돌 때마다, 뒤를 돌아보았다. 아무도 따라오지 않았다.", "", "날이 밝을 무렵, 산 아래 **큰길**에 섰다.", "초록 띠를 풀어, 개울에 던졌다."], "N007.title": "산채의 밤", "N007.desc": ["약탈이 없는 밤이면, 산채 마당에 **모닥불**이 올랐다.", "", "술이 몇 순배 돌자, 누군가 말했다.", "\"막내야. 너는 어쩌다 이 산에 굴러들었냐.\"", "", "모두의 눈이, 나에게 왔다."], "N007.c1.tag": "되물음", "N007.c1.text": "\"형님들은 어쩌다 오셨습니까.\" 하고 되묻는다", "N007.c1.o0": ["\"형님들은, 어쩌다 오셨습니까.\"", "", "한참 아무도 말이 없었다.", "", "돌쇠가 먼저 입을 열었다. 흉년에 부모가 **쌀 두 말**에 자기를 팔았다고.", "다른 하나는 빚 때문에, 또 하나는 관아 포졸을 때려눕혀서.", "", "노가는 끝까지 아무 말도 하지 않았다.", "대신, 내 잔에 술을 **가득** 따랐다."], "N007.c2.tag": "의적", "N007.c2.text": "하늘 저편의 의적 이야기를 들려준다", "N007.c2.o0": ["\"제 고향에 이런 이야기가 있습니다.\"", "", "부자의 곳간을 털어 가난한 백성에게 나눠 준 **도적** 이야기.", "", "다 듣고 나서, 산적들이 서로 얼굴을 보았다.", "\"…그래서 그놈은, 남는 게 뭐냐?\"", "\"이름이 남지요.\"", "\"이름으로 밥을 먹냐?\"", "", "모닥불가에 **웃음**이 터졌다.", "…그날 밤, 돌쇠가 혼자 오래 불을 보고 앉아 있었다."], "N007.c3.tag": "술", "N007.c3.text": "말 대신 술잔을 비운다", "N007.c3.o0": ["말 대신, 술잔을 비웠다.", "또 비웠다.", "", "정신을 차려 보니, 아침이었다. 장패의 **호피** 위에서 자고 있었다.", "", "\"…막내야.\"", "**<red>그날, 산채 개울물을 백 번 길었다.<\/red>**"], "N008.title": "와우촌으로", "N008.desc": ["장패가 지도 대신, 땅바닥에 나뭇가지로 길을 그었다.", "", "\"다음 그믐엔, **와우촌**이다.\"", "\"막내, 네가 살던 데지. 곳간이 어디 붙었는지, 개가 몇 마리인지 다 알 테고.\"", "", "산적들의 눈이, 나에게 쏠렸다."], "N008.c1.tag": "앞장", "N008.c1.text": "곳간 자리를 짚어 준다", "N008.c1.o0": ["나뭇가지를 받아, 곳간 자리를 **하나씩** 짚었다.", "", "그믐밤, 와우촌은 **울음소리**로 깼다.", "돌아오는 길, 등 뒤에서 누군가 내 이름을 불렀다.", "…돌아보지 않았다."], "N008.c2.tag": "귀띔", "N008.c2.text": "밤에 몰래 내려가 마을에 귀띔한다", "N008.c2.o0": ["밤에 몰래 산을 내려가, 마을 어귀 집 문을 두드렸다.", "", "돌아오는 길, 바위 뒤에 **돌쇠**가 서 있었다.", "\"…어디 다녀오냐, 막내.\"", "", "**<red>그날 밤, 산채 마당에 구덩이가 하나 파였다.<\/red>**"], "N008.c2.o1": ["밤에 몰래 산을 내려가, 마을 어귀 집 문을 두드렸다.", "\"그믐에, 산적이 옵니다.\"", "", "그믐밤. 와우촌 어귀에 **횃불이 줄지어** 서 있었다.", "산적들은 고개에서 발길을 돌렸다.", "", "장패가 하나 남은 눈으로, 산적들을 하나씩 훑었다.", "\"…누가 샜군.\""], "N008.c3.tag": "둘러댐", "N008.c3.text": "\"그 마을엔 털 게 없습니다.\" 하고 둘러댄다", "N008.c3.o0": ["\"그 마을엔, 털 게 없습니다. 쥐도 굶어 나가는 곳입니다.\"", "", "장패가 나를 한참 보았다.", "\"…그래? 그럼 네 말이 맞는지, 네가 직접 보고 와라.\"", "", "결국 그믐밤, 맨 앞에 서서 와우촌으로 내려갔다.", "곳간은, **생각보다 두둑했다**.", "장패가 쌀가마를 발로 툭 찼다. 아무 말도 하지 않았다. 그게 더 무서웠다."], "N008.c4.tag": "칼등", "N008.c4.text": "약탈에 따라가, 칼등으로만 마을 장정들을 눕힌다", "N008.c4.o0": ["그믐밤, 맨 앞에서 와우촌으로 내려갔다.", "몽둥이를 든 장정들이 막아섰다. 칼을 **뒤집어 쥐었다**.", "", "하늘, 땅, 사람. 칼등이 손목을 치고, 정강이를 쓸었다.", "장정들이 하나둘 주저앉았다. 피는 **한 방울도** 나지 않았다.", "", "곳간 하나만 털고, 산적들을 돌려세웠다.", "\"됐다. 더 털면 내년에 털 게 없다.\"", "", "장패가 껄껄 웃었다.", "\"**제법이군.** 털 줄도 알고, 남길 줄도 알고.\""], "N012.title": "칼자국의 제안", "N012.desc": ["개울가에서 칼을 씻는데, 부두목 **황칠**이 옆에 쭈그려 앉았다.", "얼굴에 길게 그어진 **칼자국**. 산채에서는 다들 그냥 칼자국이라 불렀다.", "", "\"장패 그 늙은이, 요즘 몫을 혼자 다 먹지.\"", "\"눈도 하나 남은 게, 이제 침침하고.\"", "", "황칠이 내 귀에 대고 속삭였다.", "\"다음 보름, 같이 하자. 끝나면, **부두목 자리**는 네 거다.\""], "N012.c1.tag": "가담", "N012.c1.text": "\"…좋습니다.\" 하고 손을 잡는다", "N012.c1.o0": ["\"…좋습니다.\"", "", "황칠이 이를 드러내고 웃었다.", "\"보름밤. 두목 방 뒷문은, 내가 열어 두지.\""], "N012.c2.tag": "고자질", "N012.c2.text": "그날 밤 장패에게 일러바친다", "N012.c2.o0": ["그날 밤, 장패의 방문을 두드렸다.", "", "장패는 다 듣고도, 표정 하나 바꾸지 않았다.", "\"…알고 있었다. 누가 먼저 오나, 보고 있었지.\"", "", "보름 전날, 황칠은 개울가에서 **떠오르지 않았다**.", "", "장패가 내 잔에 술을 따랐다.", "\"오늘부터, 네가 부두목이다.\""], "N012.c3.tag": "모른척", "N012.c3.text": "\"못 들은 걸로 하겠습니다.\" 하고 일어선다", "N012.c3.o0": ["\"…못 들은 걸로 하겠습니다.\"", "", "황칠의 눈이 **가늘어졌다**.", "\"그래. 못 들은 놈은, 보름밤에 잠이나 자라.\""], "N013.title": "보름밤", "N013.desc": ["보름밤. 산채가 **조용했다**. 너무 조용했다.", "", "두목 방에서, 칼 부딪는 소리가 터졌다.", "장패의 고함. 황칠의 웃음.", "", "산적들이 횃불을 들고 마당으로 쏟아져 나왔다. 아무도, 어느 편인지 말하지 않았다."], "N013.c1.tag": "황칠", "N013.c1.text": "황칠 편에서 장패를 친다", "N013.c1.o0": ["두목 방으로 뛰어들었다.", "", "장패가 벽에 등을 대고, 하나 남은 눈으로 나를 보았다.", "\"…막내, 너냐.\"", "", "**<red>장패의 칼이, 마지막으로 한 번 빛났다.<\/red>**"], "N013.c1.o1": ["두목 방으로 뛰어들었다.", "", "장패가 벽에 등을 대고, 하나 남은 눈으로 나를 보았다.", "\"…막내, 너냐.\"", "", "둘이서 달려들었다. 장패가 **무릎을 꿇었다**.", "", "이튿날 아침, 황칠이 호피 위에 앉았다.", "\"부두목. 술 따라라.\""], "N013.c2.tag": "장패", "N013.c2.text": "장패 편에 서서 황칠을 막는다", "N013.c2.o0": ["황칠의 등 뒤로 달려들었다.", "", "황칠이 돌아서며, 칼자국 난 얼굴로 **웃었다**.", "\"이 배신자 새끼가.\"", "**<red>그 웃음이, 마지막으로 본 얼굴이었다.<\/red>**"], "N013.c2.o1": ["황칠의 등 뒤로 달려들었다.", "황칠이 돌아서는 사이, 장패의 칼이 황칠의 **옆구리**를 꿰뚫었다.", "", "장패가 숨을 몰아쉬며, 피 묻은 손으로 내 어깨를 짚었다.", "\"…쓸 만한 놈이, 하나는 있었군.\"", "\"오늘부터, 네가 부두목이다.\""], "N013.c3.tag": "둘다", "N013.c3.text": "칼을 들고 두 사람 사이에 뛰어든다", "N013.c3.o0": ["칼을 들고, 두 사람 사이에 뛰어들었다.", "", "장패의 칼과 황칠의 칼이, 동시에 내게로 왔다.", "손이 먼저 길을 알았다. 하늘로 하나를 쳐 올리고, 땅으로 하나를 눌렀다.", "", "두 칼이, **동시에** 바닥에 떨어졌다.", "", "마당의 산적들이, 횃불을 든 채 굳었다.", "…누군가 먼저, **무릎을 꿇었다**.", "", "그날 밤, 장패와 황칠은 산을 내려갔다. 두 번 다시 돌아오지 않았다.", "호피 위에, **내가** 앉았다."], "N013.c4.tag": "떠남", "N013.c4.text": "혼란한 틈에 산채를 빠져나간다", "N013.c4.o0": ["횃불과 고함 사이로, 산채 뒷문을 빠져나갔다.", "", "산길을 다 내려와 돌아보니, 산채 쪽 하늘이 **붉었다**.", "누가 이겼는지는, 끝내 알지 못했다."], "N014.title": "현상금 사냥꾼", "N014.desc": ["장터에 다녀온 산적이, 종이 한 장을 내밀었다.", "관아 방문(榜文). 녹풍채 두목의 목에 **은자 백 냥**.", "", "그날 밤, 산채 아래 숲에서 **새가 한꺼번에** 날아올랐다.", "", "보초가 소리쳤다.", "\"사냥꾼이다!\""], "N014.c1.tag": "싸움", "N014.c1.text": "칼을 들고 산채 문을 지킨다", "N014.c1.o0": ["칼을 들고, 산채 문 앞에 섰다.", "", "검은 옷의 사내가 문을 넘었다. 칼이 **보이지 않았다**.", "**<red>목이 서늘했다. 그게 다였다.<\/red>**"], "N014.c1.o1": ["칼을 들고, 산채 문 앞에 섰다.", "", "검은 옷의 사내들과 뒤엉켰다. 하나를 문밖으로 밀어내고, 하나에게 팔을 베였다.", "새벽, 사냥꾼들이 물러갔다.", "", "장패가 내 팔의 상처를 보고, 술을 부어 주었다.", "\"…녹풍채 칼잡이 상처다. 자랑해도 된다.\""], "N014.c2.tag": "숨음", "N014.c2.text": "무기고 짚더미 밑에 숨는다", "N014.c2.o0": ["무기고 짚더미 밑으로 기어들었다.", "", "밖에서 비명과 칼 소리. 그리고 **조용해졌다**.", "", "새벽에 기어 나오니, 돌쇠가 피투성이로 앉아 있었다.", "돌쇠는 나를 보고, 아무 말도 하지 않았다. **침도 뱉지 않았다.**"], "N014.c3.tag": "거래", "N014.c3.text": "사냥꾼에게 산채 뒷길을 알려 주고 몫을 받는다", "N014.c3.o0": ["어둠 속에서, 사냥꾼 우두머리의 소매를 잡았다.", "\"뒷길을 알려 드리지요. 대신, 백 냥에서 스무 냥.\"", "", "사냥꾼이 나를 보았다. 그리고 웃었다.", "\"산적 목에도 값이 붙어 있지. **네 목**에도.\"", "**<red>값을 매기는 쪽은, 처음부터 저쪽이었다.<\/red>**"], "N014.c3.o1": ["어둠 속에서, 사냥꾼 우두머리의 소매를 잡았다.", "\"뒷길을 알려 드리지요. 대신, 백 냥에서 스무 냥.\"", "", "새벽, 산채는 **텅 비었다**. 산적들의 목이 수레에 실려 관아로 내려갔다.", "", "내 품에는 은자 스무 냥.", "산을 내려가는 길, 한 번도 뒤돌아보지 않았다. 돌아볼 수가 없었다."], "N014.c4.tag": "숨", "N014.c4.text": "산채 뒤 연못에 몸을 담그고 숨을 죽인다", "N014.c4.o0": ["산채 뒤 연못으로 들어가, 물속에 몸을 담갔다.", "숨을 아랫배로 내리고, 길게, 더 길게.", "", "연못가를 사냥꾼들의 횃불이 **세 번** 지나갔다.", "세 번 다, 물결 하나 일지 않았다.", "", "새벽에 물 밖으로 나오자, 살아남은 산적들이 귀신 보듯 나를 보았다.", "\"…숨쟁이, 너 **아가미** 달렸냐?\""], "N015.title": "토벌", "N015.desc": ["아침 안개 속에서, **북소리**가 올라왔다.", "", "관군의 깃발. 그 사이사이, 관군과는 다른 옷을 입은 **무림인**들.", "\"녹풍채는 들어라. 칼을 버리면 목숨은 살려 준다.\"", "", "장패가 호피에서 일어나, 칼을 뽑았다.", "\"…녹풍채가 칼을 버린 적은, 없다.\""], "N015.c1.tag": "싸움", "N015.c1.text": "두목 곁에서 끝까지 싸운다", "N015.c1.o0": ["장패 곁에 섰다.", "", "관군의 창이 몰려왔다. 하나를 막고, 둘을 막았다.", "셋째 창이, **옆구리**로 들어왔다.", "", "**<red>안개가, 붉게 물들었다.<\/red>**"], "N015.c1.o1": ["장패 곁에 섰다.", "", "해가 질 때까지, 산채 문은 **열리지 않았다**.", "관군이 물러갔다. 산채 마당엔, 산적 절반이 누워 있었다.", "", "장패가 피 묻은 손으로 내 머리를 쥐고 흔들었다.", "\"살았다, 막내. 살았어.\""], "N015.c2.tag": "투항", "N015.c2.text": "칼을 버리고 산채 문을 나선다", "N015.c2.o0": ["칼을 버리고, 산채 문을 나섰다.", "", "관아 옥에서, **세 해**를 살았다.", "풀려나던 날, 옥졸이 말했다.", "\"다시 산에 오르면, 그땐 목이다.\"", "", "산을 등지고, 나무꾼으로 살았다.", "가끔 녹풍채가 있던 산을 보았다. 연기는, 다시 오르지 않았다.", "", "**<gold>수명이 다했다.<\/gold>**"], "N015.c3.tag": "뒷길", "N015.c3.text": "안개를 틈타 뒷길로 빠져나간다", "N015.c3.o0": ["안개를 틈타, 뒷길로 빠져나갔다.", "", "뒷길 끝에, 검을 든 **무림인**이 서 있었다.", "\"…쥐새끼 하나.\"", "**<red>안개 속에서, 검이 한 번 울었다.<\/red>**"], "N015.c3.o1": ["안개를 틈타, 뒷길로 빠져나갔다.", "", "등 뒤에서, 산채가 **타는 냄새**가 났다.", "초록 띠를 풀어, 덤불에 던졌다."], "N015.c4.tag": "검", "N015.c4.text": "안개 속으로 들어가 무림인과 칼을 맞댄다", "N015.c4.o0": ["안개 속으로 들어가, 무림인 앞에 섰다.", "", "무림인의 검이 왔다. 받아 흘리고, 비켜 섰다. 천, 지, 인.", "세 합 만에, 무림인이 **한 걸음** 물러섰다.", "", "\"…산적이 **삼재검법**을? 어느 무관 출신이냐.\"", "\"산적입니다.\"", "", "무림인이 한참 나를 보더니, 검을 거두었다.", "\"이 산채 하나쯤, 오늘 아니어도 된다.\"", "", "토벌대가, **북을 거두었다**. 산적들이 나를, 처음 보는 사람처럼 보았다."], "N016.title": "마지막 초식", "N016.desc": ["새벽, 노가가 나를 산채 뒤 바위로 불렀다.", "", "노가가 빈 왼쪽 소매를 걷어 올렸다. 어깨 아래, **매끈하게** 아문 자리.", "\"…말했었지. 표사 하나가 검을 쓸 줄 알았다고.\"", "\"그놈 검이 내 팔을 가져갈 때, 나는 초식 하나를 **끝까지** 못 펼쳤다.\"", "", "노가가 오른손 하나로 도를 뽑았다.", "\"녹풍도법은 열둘이 아니다. **열셋**이다.\"", "\"마지막 하나는, 아무한테도 안 가르쳤다. 가르칠 놈이 없었으니까.\""], "N016.c1.tag": "배움", "N016.c1.text": "무릎을 꿇고 도를 받든다", "N016.c1.o0": ["무릎을 꿇고, 두 손으로 도를 받들었다.", "", "노가가 바위 위에서, 마지막 초식을 펼쳤다.", "도가 크게 돌아 나가다가, 바람을 등지고 **되돌아왔다**. 셋을 베고 지나간 칼이, 넷째를 향해 돌아오는 칼.", "", "\"**회풍(回風)**이다.\"", "\"산적 칼은 셋을 상대하는 칼이라 했지. 이건, 돌아서서 **하나를 지키는** 칼이다.\"", "", "해가 질 때까지, 회풍만 휘둘렀다.", "노가는 바위에 앉아, 한 번도 말을 보태지 않았다.", "", "해가 지고 나서야, 노가가 일어섰다.", "\"…됐다. 이제 이 칼은, 내가 죽어도 **안 죽는다**.\""], "N016.c2.tag": "질문", "N016.c2.text": "\"그 표사는, 어떻게 되었습니까.\" 하고 묻는다", "N016.c2.o0": ["\"…그 표사는, 어떻게 되었습니까.\"", "", "노가가 한참 말이 없었다.", "\"살려 줬다. 내 팔을 가져간 값으로, 그놈 목은 두고 왔지.\"", "\"그날 깨달았다. 칼은 **돌아설 줄** 알아야 한다고.\"", "", "노가가 마지막 초식을 펼쳤다. 크게 돌아 나간 도가, 바람을 등지고 **되돌아왔다**.", "\"**회풍(回風)**이다. 받아 가라.\"", "", "해가 질 때까지, 회풍만 휘둘렀다.", "노가는 끝내, 그 표사의 이름은 말하지 않았다."], "N017.title": "붉은 열매", "N017.desc": ["땔감을 하러 산채 뒤 골짜기로 들어갔다.", "", "벼랑 틈, 이끼 낀 바위 사이에 **처음 보는 나무** 한 그루.", "가지 끝에, 손가락 마디만 한 **붉은 열매**가 세 알 달려 있었다.", "", "가까이 가자, 단내가 **코를 찔렀다**.", "새들도, 벌레도, 그 나무에는 앉지 않았다."], "N017.c1.tag": "먹음", "N017.c1.text": "한 알을 따서 입에 넣는다", "N017.c1.o0": ["한 알을 따서, 입에 넣었다.", "", "달았다. 그리고 배 속이 **불덩이**처럼 끓어올랐다.", "바위에 주저앉아, 숨을 몰아쉬었다. 열기가 단전에서 사지로, 사지에서 다시 단전으로 **돌고 또 돌았다**.", "", "해가 질 무렵, 열기가 가라앉았다.", "몸이, 가벼웠다. 뼈마디 하나하나가 **새로 맞춰진** 것 같았다.", "", "…나중에 노가가 그 나무 이야기를 듣고, 한참 말을 잃었다.", "\"**주과(朱果)**다. 무림인들이 평생 찾아 헤매는 것을, 산적 막내가 땔감 하다 따 먹었다고?\""], "N017.c1.o1": ["한 알을 따서, 입에 넣었다.", "", "달았다. 그리고 혀끝부터 **저려 왔다**.", "손가락이, 발가락이, 차례로 말을 듣지 않았다.", "", "**<red>단내가, 끝까지 코에 남아 있었다.<\/red>**"], "N017.c1.o2": ["한 알을 따서, 입에 넣었다.", "", "달았다. 허기가 **조금** 가셨다.", "…그리고 **사흘을 설사**했다.", "", "돌쇠가 뒷간 앞에서 낄낄댔다.", "\"산에서 아무거나 주워 먹는 놈은, 산에서 못 살아.\""], "N017.c1.o3": ["한 알을 따서, 입에 넣었다.", "", "달았다. 시큼한 즙이 혀를 적시고, 빈 배 속이 **조금** 따뜻해졌다.", "남은 두 알도 마저 따 먹었다.", "", "허기가, **조금** 가셨다."], "N017.c2.tag": "돌쇠", "N017.c2.text": "열매를 따 와서 돌쇠에게 먼저 권한다", "N017.c2.o0": ["열매를 따 와서, 돌쇠에게 내밀었다.", "\"형님, 산 귀한 열매랍니다.\"", "", "돌쇠가 덥석 받아먹었다.", "…그리고 **사흘을 뒷간**에서 살았다.", "", "나흘째, 핼쑥해진 돌쇠가 내 멱살을 잡았다.", "\"막내, 너 **알고** 그랬지.\"", "\"…몰랐습니다. 정말로.\""], "N017.c3.tag": "둠", "N017.c3.text": "손대지 않고 땔감만 해서 돌아간다", "N017.c3.o0": ["손대지 않았다. 처음 보는 것은, 먹지 않는다.", "", "땔감을 지고 골짜기를 나서는데, 등 뒤에서 **원숭이** 한 마리가 나무로 뛰어올랐다.", "열매 세 알을, 차례로 **입에 털어 넣었다**.", "", "원숭이가 나를 보고, 이를 드러냈다.", "…웃은 것 같았다."], "N018.title": "멧돼지", "N018.desc": ["산채 고기가 떨어졌다.", "", "장패가 빈 솥을 발로 걷어찼다.", "\"막내, 고기 좀 잡아 와라.\"", "", "골짜기 진흙에, **멧돼지 발자국**이 깊게 찍혀 있었다."], "N018.c1.tag": "정면", "N018.c1.text": "창을 들고 멧돼지 앞을 막아선다", "N018.c1.o0": ["창을 꼬나쥐고, 멧돼지 앞을 막아섰다.", "", "멧돼지가 **고개를 숙이고** 달려왔다. 창이 빗나갔다.", "**<red>엄니가, 허벅지를 파고들었다.<\/red>**"], "N018.c1.o1": ["창을 꼬나쥐고, 멧돼지 앞을 막아섰다.", "", "멧돼지가 고개를 숙이고 달려왔다. 비켜서며, 옆구리에 창을 **박았다**.", "한참을 끌려다니다, 멧돼지가 쓰러졌다.", "", "그날 밤, 산채 솥이 **넘치도록** 끓었다.", "장패가 뒷다리 하나를 뜯으며, 처음으로 내 몫을 **먼저** 덜어 주었다."], "N018.c2.tag": "올가미", "N018.c2.text": "짐승 길목에 올가미를 놓는다", "N018.c2.o0": ["짐승 길목에, 칡넝쿨로 올가미를 놓았다.", "", "사흘 뒤, 올가미에 걸린 건 **산토끼 한 마리**였다.", "돌쇠가 토끼 귀를 쥐고 흔들었다.", "\"이걸로 열두 놈이 먹냐?\""], "N018.c2.o1": ["짐승 길목에, 칡넝쿨로 올가미를 놓았다.", "", "이튿날 새벽, 올가미 쪽에서 **꽥꽥** 소리가 산을 울렸다.", "다리가 묶인 멧돼지가, 지쳐 나자빠져 있었다.", "", "산적들이 멧돼지를 메고 오며 혀를 찼다.", "\"막내 놈, 손재주는 있네.\""], "N018.c3.tag": "몰이", "N018.c3.text": "돌쇠와 둘이 몰이를 한다", "N018.c3.o0": ["돌쇠와 둘이서, 골짜기를 위아래로 갈라 몰이를 했다.", "", "덤불을 두드리며 내려가는데, 진흙 위에 발자국이 하나 더 있었다.", "멧돼지 발자국보다 **훨씬 큰**, 둥근 발자국.", "", "돌쇠의 얼굴이 하얗게 질렸다.", "\"…**산군(山君)**이다. 뛰어.\"", "", "둘이서, 뒤도 안 돌아보고 산채까지 달렸다.", "그날 밤, 산채의 누구도 고기 이야기를 꺼내지 않았다."], "N018.c3.o1": ["돌쇠와 둘이서, 골짜기를 위아래로 갈라 몰이를 했다.", "", "덤불을 두드리며 내려가자, 멧돼지가 돌쇠 쪽으로 **튀어 나갔다**.", "돌쇠가 몽둥이로 정수리를 내리쳤다. 한 방이었다.", "", "돌쇠가 숨을 몰아쉬며 웃었다.", "\"막내. 너 몰이 하나는 기가 막히다.\""], "N019.title": "약초", "N019.desc": ["지난 약탈에서 다친 놈이 셋.", "그중 하나는 다리의 상처가 **곪아** 열이 끓었다.", "", "노가가 상처를 들여다보고 혀를 찼다.", "\"막내. 골짜기 그늘에 가서, 잎이 세 갈래로 갈라진 풀을 캐 와라.\""], "N019.c1.tag": "약초", "N019.c1.text": "골짜기에서 세 갈래 잎 풀을 캔다", "N019.c1.o0": ["골짜기 그늘에서, 세 갈래로 갈라진 잎을 한 아름 캐 왔다.", "", "노가가 잎을 한 장 씹어 보더니, **퉤** 뱉었다.", "\"…이건 독초다. 잎맥이 다르잖아.\"", "", "다시 캐러 가는 사이, 열이 끓던 놈의 숨이 **잦아들었다**.", "돌쇠가 나를 보지 않았다."], "N019.c1.o1": ["골짜기 그늘에서, 세 갈래로 갈라진 잎을 한 아름 캐 왔다.", "", "노가가 잎을 짓이겨 상처에 붙였다.", "사흘 뒤, 열이 **내렸다**.", "", "다리를 절며 일어난 놈이, 내게 고개를 꾸벅 숙였다.", "\"…막내, 고맙다.\""], "N019.c2.tag": "끓임", "N019.c2.text": "물을 끓여 상처를 씻고, 삶은 천으로 감는다", "N019.c2.o0": ["\"약초보다 먼저, 물부터 끓이시지요.\"", "", "솥에 물을 끓여, 상처의 고름을 **씻어 냈다**. 천은 삶아서 말렸다.", "산적들이 둘러서서 수군거렸다.", "\"상처에 끓인 물을 붓는다고? 미친놈 아냐?\"", "", "닷새 뒤, 다친 셋이 **모두** 일어났다.", "노가가 솥을 한참 보다가 중얼거렸다.", "\"…약초 없이, 물로 사람을 살렸단 말이지.\"", "", "그날부터 산채에서는, 다치면 **막내부터** 찾았다."], "N019.c3.tag": "외면", "N019.c3.text": "\"산적 상처는 알아서 낫는다지요.\" 하고 돌아선다", "N019.c3.o0": ["\"산적 상처는, 알아서 낫는다지요.\"", "", "노가가 나를 한 번 보고, 혼자 골짜기로 내려갔다.", "", "노가가 돌아왔을 때, 열이 끓던 놈은 이미 **식어** 있었다.", "노가는 그날 저녁, 내 잔에 술을 따르지 않았다."], "N020.title": "버들골", "N020.desc": ["장패가 다음 약탈 자리를 불렀다.", "\"**버들골**. 고개 너머 작은 마을이다. 올가을 콩 농사가 잘됐다더군.\"", "", "돌쇠의 얼굴이, 확 **굳었다**.", "", "그날 밤, 돌쇠가 칼을 갈며 중얼거렸다.", "\"…버들골. 쌀 두 말에 나를 판 데가, 거기다.\"", "숫돌에 칼날이 **긁히는** 소리가, 밤새 그치지 않았다."], "N020.c1.tag": "말림", "N020.c1.text": "\"형님은 이번에 빠지시지요.\" 하고 말린다", "N020.c1.o0": ["\"…형님은, 이번에 빠지시지요.\"", "", "돌쇠가 숫돌을 **벽에** 내던졌다. 숫돌이 두 쪽으로 쪼개졌다.", "\"네가 뭔데 남의 일에 **참견질**이야!\"", "\"막내 주제에, 내 속을 다 안다는 거냐? 어? 대답해 봐!\"", "", "돌쇠가 내 멱살을 잡아, 벽에 **처박았다**. 주먹이 코앞에서 부들부들 떨렸다.", "…주먹은, 끝내 내려오지 않았다.", "그리고 장패에게 가서, 이번 약탈에서 빼 달라고 했다. **침을 뱉으며**.", "", "그날 밤, 돌쇠는 혼자 술독을 비웠다. 나와는 눈도 마주치지 않았다."], "N020.c2.tag": "동행", "N020.c2.text": "\"같이 가겠습니다.\" 하고 돌쇠 곁에 선다", "N020.c2.o0": ["\"…같이 가겠습니다.\"", "", "돌쇠가 칼 가는 손을 멈추고, 나를 보았다.", "\"…그래. 너는 봐 둬라.\""], "N021.title": "쌀 두 말", "N021.desc": ["버들골. 콩대가 마당마다 **쌓여** 있었다.", "", "돌쇠는 곳간이 아니라, 마을 끝 **초가** 한 채로 곧장 갔다.", "문을 걷어차자, 늙은 내외가 마당에 주저앉았다.", "", "\"나 알아보겠어?\"", "\"**쌀 두 말!** 쌀 두 말에 나를 팔아 놓고, 콩 농사는 잘 지었더라!\"", "", "늙은 아낙이 돌쇠의 얼굴을 알아보았다. 입을 막고, 울기 시작했다.", "\"…미안하다. 미안하다, 얘야.\"", "", "돌쇠가 몽둥이를 **치켜들었다**."], "N021.c1.tag": "지켜봄", "N021.c1.text": "말없이 지켜본다", "N021.c1.o0": ["말없이, 지켜보았다.", "", "몽둥이가 **내려갔다**.", "늙은 내외의 울음이, 끊겼다가, 다시 이어졌다.", "", "돌쇠가 몽둥이를 떨어뜨렸다.", "그리고 마당 구석에서 **헛구역질**을 했다. 한참을.", "", "\"…후련할 줄 알았는데.\"", "\"아니었어. 하나도, 아니었어.\"", "", "돌아오는 길, 돌쇠는 한 마디도 하지 않았다."], "N021.c2.tag": "붙잡음", "N021.c2.text": "몽둥이를 붙잡는다", "N021.c2.o0": ["몽둥이가 내려오기 전에, 팔을 **붙잡았다**.", "", "돌쇠가 나를 노려보았다.", "\"놔. **또** 너냐. 놓으라고!\"", "", "늙은 내외는 돌쇠의 발치에 엎드려, 울기만 했다.", "\"미안하다. 미안하다…\"", "그 말 말고는, 아무 말도 하지 않았다.", "", "돌쇠가 몽둥이를 내던졌다.", "\"…빌어먹을. 빌어먹을!\"", "", "돌쇠는 곳간 하나 털지 않고, 혼자 산으로 돌아갔다.", "산적들이 투덜댔지만, 나는 돌쇠 뒤를 따랐다."], "N022.title": "야참", "N022.desc": ["보초를 서는 밤, 돌쇠가 **식은 감자** 두 알을 들고 왔다.", "하나를 내 손에 쥐여 주고, 옆에 털썩 앉았다.", "", "한참을 둘이서, 말없이 감자만 먹었다."], "N022.c1.tag": "기다림", "N022.c1.text": "돌쇠가 입을 열 때까지 기다린다", "N022.c1.o0": ["기다렸다.", "", "돌쇠가 감자 껍질을 손가락으로 **비비며** 말했다.", "\"…그때, 말려 줘서.\"", "\"고맙다. 그 말 하려고 왔다.\"", "", "돌쇠의 눈에서, 눈물이 **뚝뚝** 떨어졌다. 식은 감자 위로.", "돌쇠는 그걸 닦지도 않았다.", "", "한참 뒤, 돌쇠가 소매로 얼굴을 문지르고 일어섰다.", "몇 걸음 가다가, 돌아보지 않은 채 덧붙였다.", "\"감자 남기지 마라. 막내.\""], "N022.c2.tag": "먼저", "N022.c2.text": "\"형님, 그날 일은…\" 하고 먼저 꺼낸다", "N022.c2.o0": ["\"형님. 그날 일은…\"", "", "\"알아.\"", "돌쇠가 말을 끊었다.", "\"…알아. 그러니까, 고맙다고.\"", "", "돌쇠의 목소리가, **갈라졌다**. 고개를 숙인 돌쇠의 어깨가 들썩였다.", "", "한참 뒤, 돌쇠가 젖은 얼굴로 감자를 한 입에 밀어 넣고, 우물거리며 하늘을 보았다.", "별이, **많았다**."], "N023.title": "혼례 가마", "N023.desc": ["고개 아래로, **붉은 가마** 하나가 올라왔다.", "가마꾼 넷, 하인 둘. 가마 뒤로 함지박을 인 아낙들.", "", "산적들이 내려서자, 가마꾼들이 가마를 내던지고 **달아났다**.", "", "가마 문이 열렸다.", "붉은 활옷을 입은 처녀가, 산적들을 둘러보았다.", "…놀란 얼굴이 아니었다.", "", "\"와우촌 **향아**예요.\"", "\"장터 고을 쉰 넘은 포목상한테 셋째 첩으로 가는 길이고요.\"", "\"…잘됐네요. **데려가 주세요**.\""], "N023.c2.tag": "길", "N023.c2.text": "다른 고을로 가는 산길을 일러 준다", "N023.c2.o0": ["\"산채는 사람 살 데가 못 되오.\"", "\"이 길로 사흘을 가면, 아무도 당신을 모르는 고을이 나오.\"", "", "향아가 한참 나를 보았다.", "그리고 활옷을 벗어 가마 위에 던지고, 속치마 바람으로 산길을 내려갔다.", "", "한 번, 돌아보았다.", "\"…산적이 길도 가르쳐 주네요. 고마워요.\""], "N023.c3.tag": "몸값", "N023.c3.text": "신랑 집에 몸값을 받아 낸다", "N023.c3.o0": ["가마를 산채에 들여놓고, 장터 고을 포목상에게 기별을 넣었다.", "", "사흘 뒤, 은자 꾸러미가 고개 바위에 놓였다.", "향아는 다시 가마에 태워져, 고개를 내려갔다.", "", "가마 창 너머로, 향아가 나를 보았다.", "…원망하는 눈도 아니었다. **아무것도** 없는 눈이었다."], "N023.c4.tag": "보냄", "N023.c4.text": "가마꾼을 불러 가마를 그대로 보낸다", "N023.c4.o0": ["\"…가던 길 가시오.\"", "", "향아가 잠시 나를 보더니, 말없이 가마 문을 **닫았다**.", "", "숲에 숨어 있던 가마꾼들이 슬금슬금 돌아와 가마를 메었다.", "산적들이 나를 이상하다는 눈으로 보았다. 장패가 혀를 찼다.", "\"…빈손으로 올 거면, 왜 내려갔냐.\""], "N024.title": "솔뫼의 쌀", "N024.desc": ["약탈에서 돌아온 밤, 돌쇠가 나를 곳간 뒤로 끌고 갔다.", "", "\"막내. 그때 네가 한 얘기 있잖아. 곳간 털어서 가난한 놈들 나눠 줬다는 도적.\"", "\"…고개 너머 **솔뫼**, 올봄에 굶어 죽은 놈이 셋이란다.\"", "", "돌쇠가 쌀가마 하나를 툭 쳤다.", "\"한 가마만. 두목 몰래.\""], "N024.c1.tag": "나눔", "N024.c1.text": "쌀가마를 메고 솔뫼로 내려간다", "N024.c1.o0": ["쌀가마를 하나씩 메고, 밤길을 내려갔다.", "", "솔뫼 마을 어귀에서, 돌아오던 장패와 **딱** 마주쳤다.", "장패가 쌀가마를 보고, 우리를 보았다.", "\"…곳간 쥐새끼가 둘이었군.\"", "", "그날 밤, 둘이 나란히 **매를 맞았다**. 돌쇠는 맞으면서도 웃었다."], "N024.c1.o1": ["쌀가마를 하나씩 메고, 밤길을 내려갔다.", "", "솔뫼 마을 어귀 우물가에 쌀가마를 내려놓고, 문 하나를 두드렸다.", "문틈으로 나온 아이가, 쌀가마를 보고 **얼어붙었다**.", "", "뒤따라 나온 아낙이 무릎을 꿇었다.", "\"…고맙습니다. 고맙습니다, 나리.\"", "", "돌아오는 길, 돌쇠가 자꾸 **실실** 웃었다.", "\"…나리래. 산적한테, 나리래.\"", "\"고맙다는 소리, 태어나서 **처음** 들어 봤다.\"", "돌쇠가 빈 어깨를 으쓱하며, 가슴을 **쭉** 폈다."], "N024.c2.tag": "말림", "N024.c2.text": "\"두목이 알면 둘 다 죽습니다.\" 하고 말린다", "N024.c2.o0": ["\"두목이 알면, 둘 다 죽습니다.\"", "", "돌쇠가 쌀가마에서 손을 뗐다.", "\"…그래. 그렇지. 산적이 무슨.\"", "", "돌쇠는 그날 밤, 혼자 솔뫼 쪽 하늘을 오래 보고 있었다."], "N024.c3.tag": "말림", "N024.c3.text": "\"…산적이 그런 짓 하면, 산적 아니다.\" 하고 말린다", "N024.c3.o0": ["\"…산적이 그런 짓 하면, 산적 아니다.\"", "", "돌쇠가 쌀가마에서 손을 뗐다.", "\"…그래. 그렇지. 산적이 무슨.\"", "", "돌쇠는 그날 밤, 혼자 솔뫼 쪽 하늘을 오래 보고 있었다."], "N025.title": "잘못 건드린 나그네", "N025.desc": ["고개에서 털어 온 나그네는, 혼자였다.", "**검은 장포**에, 맨손. 짐이라곤 술 호리병 하나.", "", "산적 넷이 그를 산채 마당까지 끌고 왔다. 나그네는 순순히 따라왔다. 너무 순순히.", "", "나그네가 마당을 한 바퀴 둘러보더니, 술을 한 모금 마셨다.", "\"…녹림이라더니, **녹슨** 놈들이구먼.\"", "", "다음 순간, 나그네를 붙잡고 있던 산적 둘이 **담장 너머로** 날아갔다."], "N025.c1.tag": "숨음", "N025.c1.text": "무기고 뒤로 몸을 숨긴다", "N025.c1.o0": ["무기고 뒤로, 몸을 숨겼다.", "", "비명. 부서지는 소리. 그리고 다시 비명.", "향 한 대 탈 시간이었다.", "", "조용해진 마당으로 나가 보니, 산적들이 **하나도 빠짐없이** 누워 신음하고 있었다.", "나그네는 장패의 호피를 어깨에 걸치고, 곳간의 은자를 호리병처럼 허리에 차고 있었다.", "\"**패천문**이다. 다음엔 사람 보고 털어라.\"", "", "녹풍채는 그날, 탈탈 **털렸다**. 산적이."], "N025.c2.tag": "맞섬", "N025.c2.text": "칼을 뽑아 나그네에게 덤빈다", "N025.c2.o0": ["칼을 뽑아, 나그네에게 덤벼들었다.", "", "나그네가 돌아보지도 않고, 손등으로 칼날을 **튕겼다**.", "**<red>그 손등이 다음에 닿은 곳은, 내 가슴이었다.<\/red>**"], "N025.c2.o1": ["칼을 뽑아, 나그네에게 덤벼들었다.", "", "나그네가 손등으로 칼날을 튕겼다. 팔이 **저렸다**. 칼이 날아갔다.", "가슴에 손바닥이 닿았다. 마당 끝까지, **굴렀다**.", "", "정신이 들었을 때, 녹풍채는 탈탈 털려 있었다.", "나그네가 호리병을 흔들며 말했다.", "\"**패천문**이다. 다음엔 사람 보고 털어라.\""], "N025.c3.tag": "받아냄", "N025.c3.text": "도를 세우고, 물러서지 않는다", "N025.c3.o0": ["나그네가 산적들을 쓸어 넘기며 다가왔다.", "물러서지 않았다. 도를 세워, 다가오는 손바닥 앞을 막았다.", "", "**쾅.**", "", "도가 휘었다. 몸이 마당 끝까지 밀려나, 담장에 등이 부딪혔다.", "입안에 **피 맛**이 돌았다. 그래도, 무릎은 꿇지 않았다.", "", "나그네가 처음으로, 걸음을 멈췄다.", "\"…호오.\"", "\"산적 소굴에 썩히기엔, 아까운 놈이 하나 있네.\"", "", "나그네가 호리병을 내게 던졌다.", "\"**패천문** 철우강이다. 따라오겠냐, 여기서 녹슬겠냐.\""], "N026.title": "패천문의 길", "N026.desc": ["부서진 산채 마당.", "신음하는 산적들 사이로, 장패가 하나 남은 눈으로 나를 보았다.", "", "철우강이 산채 문 앞에서, 호리병을 흔들며 기다리고 있었다."], "N026.c1.tag": "따라감", "N026.c1.text": "호리병을 들고 철우강을 따라간다", "N026.c1.o0": ["호리병을 들고, 철우강을 따라 산채 문을 나섰다.", "", "등 뒤에서, 누군가 내 이름을 불렀다. 돌아보지 않았다.", "", "철우강이 걸으며 말했다.", "\"패천문에는 문규가 딱 하나다. **센 놈이 옳다.**\"", "\"…너는 아직, 안 옳다.\"", "", "산 아래로, 사파의 길이 **열려** 있었다."], "N026.c2.tag": "남음", "N026.c2.text": "호리병을 돌려주고 산채에 남는다", "N026.c2.o0": ["호리병을, 철우강에게 돌려주었다.", "\"…저는 녹풍채 식구입니다.\"", "", "철우강이 호리병을 받아 들고, 껄껄 웃었다.", "\"녹슨 칼도, 칼은 칼이지.\"", "", "철우강이 떠난 뒤, 장패가 나를 오래 보았다.", "그날부터 장패는, 나를 막내라 부르지 않았다."], "N009.title": "산채의 겨울", "N009.desc": ["몇 번째 겨울인지, 세지 않게 되었다.", "", "돌쇠는 상단을 털다 죽었다. 노가는 어느 봄, 바위 뒤에서 **도를 쥔 채** 식어 있었다.", "장패의 하나 남은 눈도, 이제 흐려졌다.", "", "눈 덮인 산채 마당에서, 새로 들어온 막내가 물동이를 지고 **비틀거렸다**."], "N009.c1.tag": "고참", "N009.c1.text": "\"물이 미지근하잖아.\" 하고 물동이를 걷어찬다", "N009.c1.o0": ["\"물이 미지근하잖아. 다시 길어 와.\"", "", "막내가 이를 악물고, 다시 산길을 내려갔다.", "…어디서 들어 본 말이었다.", "", "그 뒤로도 여러 해, **산채에서 칼을 찼다**.", "", "**<gold>수명이 다했다.<\/gold>**"], "N009.c2.tag": "거듦", "N009.c2.text": "물동이 하나를 받아 함께 진다", "N009.c2.o0": ["물동이 하나를 받아, 함께 졌다.", "", "막내가 눈을 동그랗게 떴다.", "\"…고참이 이런 거 해도 됩니까?\"", "\"해도 된다. 내가 고참이니까.\"", "", "그 뒤로도 여러 해, **산채에서 칼을 찼다**.", "산채의 막내들은 나를, 물 길어 주는 고참이라 불렀다.", "", "**<gold>수명이 다했다.<\/gold>**"], "N009.c3.tag": "칼잡이", "N009.c3.text": "장패 곁에서 마지막까지 칼을 든다", "N009.c3.o0": ["장패가 숨을 거두던 밤, 그 곁에 있었다.", "\"…네 칼은, 산적 칼이 아니었다. 끝까지.\"", "", "그 뒤로도 여러 해, 녹풍채는 **내 칼**로 버텼다.", "고개를 넘는 상단들은, 피 한 방울 안 흘리고 짐만 빼앗는 이상한 산적 이야기를 했다.", "", "**<gold>수명이 다했다.<\/gold>**"], "N009.c4.tag": "두목", "N009.c4.text": "호피 위에서 산채를 내려다본다", "N009.c4.o0": ["호피 위에서, 산채를 내려다보았다.", "", "약탈은 줄었다. 대신 고개를 넘는 상단에게서 **통행세**를 받았다. 피는 덜 흘렀고, 쌀은 더 쌓였다.", "", "\"두목. 우리 이제, 산적 맞수?\"", "\"…산적이다. 세금 받는 산적.\"", "", "그 뒤로도 여러 해, 녹풍채는 **내 이름**으로 고개를 지켰다.", "", "**<gold>수명이 다했다.<\/gold>**"], "SYS_SCALE.title": "검은 비늘", "SYS_SCALE.desc": ["(시스템 장면)"], "SYS_SCALE.c1.tag": "비늘", "SYS_SCALE.c1.text": "(시스템)", "SYS_SCALE.c1.o0": ["끝이라고 느낀 순간.", "", "**<gold>쨍.<\/gold>**", "", "품속의 {검은 비늘}이 울었다. 다가오던 죽음이 **한 뼘 비껴갔다.**", "", "숨을 고르고 다시 앞을 보았다. 아직 끝나지 않았다.", "", "품속의 비늘이 **차갑게 식었다.** 더는 아무 기척이 없다."], "SYS_MADNESS.title": "마두(魔頭)", "SYS_MADNESS.desc": ["눈을 떴다.", "", "어디인지 모르겠다. 언제인지도 모르겠다.", "발밑에 무언가가 **<red>흥건하다.<\/red>**", "", "머릿속에서 웃음소리가 들린다. 내 목소리다.", "", "**<purple>검붉은 기운이 단전을 뚫고 올라온다.<\/purple>**", "이대로 두면, 다시는 돌아오지 못한다."], "SYS_MADNESS.c1.tag": "억제", "SYS_MADNESS.c1.text": "이를 악물고 마기를 단전에 가둔다", "SYS_MADNESS.c1.o0": ["사흘 밤낮.", "", "검붉은 기운을 한 올씩 단전으로 밀어 넣었다.", "", "나흘째 아침, 웃음소리가 **멎었다.**", "손끝이 아직 떨린다. 언제 다시 올지 모른다."], "SYS_MADNESS.c1.o1": ["가두려던 기운이 **<red>역류했다.<\/red>**", "", "마지막으로 들은 건, 내 웃음소리였다."], "SYS_MADNESS.c2.tag": "산공", "SYS_MADNESS.c2.text": "검끝으로 스스로 단전을 찌른다", "SYS_MADNESS.c2.o0": ["검끝이 배꼽 아래로 파고들었다.", "", "단전이 **깨졌다.**", "쌓아 온 기운이 전부, 검붉은 것과 함께 빠져나간다.", "", "텅 빈 몸으로 하늘을 보았다.", "웃음소리가 들리지 않는다. **…조용하다.**"], "SYS_MADNESS.c3.tag": "마기", "SYS_MADNESS.c3.text": "웃음소리에 몸을 맡긴다", "SYS_MADNESS.c3.o0": ["웃었다.", "", "그 뒤의 일은 강호가 기억한다.", "마을 셋. 문파 하나. 무림맹 무사 백여 명.", "", "내가 기억하는 건,", "**마지막 날의 하늘이 아주 붉었다는 것뿐이다.**"], "SYS_SCALE_소년.title": "흰 옷의 소년", "SYS_SCALE_소년.desc": ["(시스템 장면)"], "SYS_SCALE_소년.c1.tag": "비늘", "SYS_SCALE_소년.c1.text": "(시스템)", "SYS_SCALE_소년.c1.o0": ["소년의 손끝이 목에 닿기 직전.", "", "품속에서 **<gold>쨍<\/gold>** 하는 소리가 났다.", "{검은 비늘}이 울고 있다. 소년의 손이 멈췄다.", "", "\"이 비늘은…? 범인 주제에 이걸 대체 어디서!\"", "", "소년이 비늘을 낚아챘다. 그리고 내 멱살을 움켜쥐었다.", "\"노인께 보여 드려야겠어.\"", "", "**발밑의 땅이 뒤로 흘러간다.**", "전각에 닿자 노인이 소년의 손에 든 비늘을 한참 내려다보았다.", "\"그분께서 지나가신 산에서 주웠겠지. 범인에게는 과분한 물건이다.\""], "SYS_SCALE_노인.title": "노인의 전각", "SYS_SCALE_노인.desc": ["(시스템 장면)"], "SYS_SCALE_노인.c1.tag": "비늘", "SYS_SCALE_노인.c1.text": "(시스템)", "SYS_SCALE_노인.c1.o0": ["노인이 손을 들어 올렸다.", "", "그 순간, 품속에서 **<gold>쨍<\/gold>** 하는 소리가 났다.", "{검은 비늘}이 울고 있다. 노인의 손이 허공에서 멈췄다.", "", "\"이 비늘은…? 범인이 이것을 대체 어디서…!\"", "", "노인의 눈이 비늘에 붙박였다. 내 말은 더 듣지 않았다.", "\"다른 세상이라… 그분의 기운에 쐬어 정신이 나간 게로군.\"", "", "노인이 비늘을 소매에 넣고 손을 내저었다.", "정신을 차리니 소년과 마주쳤던 그 산길이다.", "그 뒤로 소년은 **다시 나타나지 않았다.**"], "SYS_SCALE_천마.title": "마지막 일 검", "SYS_SCALE_천마.desc": ["(시스템 장면)"], "SYS_SCALE_천마.c1.tag": "비늘", "SYS_SCALE_천마.c1.text": "(시스템)", "SYS_SCALE_천마.c1.o0": ["남은 혈강이 한꺼번에 나를 덮쳤다.", "", "그 순간, 품속에서 **<gold>쨍<\/gold>** 하는 소리가 났다.", "혈강이 **한 뼘 비껴갔다.** 품속의 {검은 비늘}이 산산조각 나 흩어졌다.", "", "천마의 눈이 처음으로 흔들렸다.", "\"그 비늘은… 하늘의 것이다.\"", "\"네 놈… **수선자의 끄나풀**이었구나.\"", "", "천마의 몸에서 혈강이 다시 차오른다. 이번에는 나만을 노리고."]}, "glossary": {"무인": "무공을 익힌 사람. 칼이나 주먹으로 싸우는 무술가.", "무공": "싸움 기술과 기운을 다루는 수련법을 통틀어 이르는 말.", "내공": "수련으로 몸 안에 쌓은 기운. 많을수록 힘과 속도가 강해진다.", "삼류": "무인 등급 중 가장 낮은 단계. 무공에 막 발을 들인 수준.", "영과": "신비한 기운이 깃든 열매. 먹으면 몸이 튼튼해진다.", "금창약": "칼에 베인 상처에 바르는 약.", "은자": "은으로 만든 돈. 한 냥이면 장정 한 달 품삯쯤 된다.", "전낭": "돈을 넣어 허리에 차는 주머니.", "관병": "나라에 속한 병사.", "관부": "고을을 다스리는 관청. 죄인을 잡아들이는 곳이기도 하다.", "도포": "도사들이 입는, 소매가 넓은 긴 옷.", "전각": "궁궐이나 절에 있는 크고 화려한 건물.", "산채": "산적들이 산속에 꾸린 소굴.", "흑풍채": "이 근방 고갯길을 차지한 산적 무리.", "정파": "의리와 명예를 중시하는 명문 무림 세력.", "사파": "이익을 좇는 무림 세력. 산적, 살수, 뒷골목 조직 등.", "마교": "천마를 받드는 거대한 무림 세력. 정파와는 철천지원수다.", "마공": "마교의 무공. 빠르게 강해지지만 몸과 마음을 갉아먹는다.", "혈마공": "피를 매개로 기운을 끌어올리는 마공.", "화산파": "화산에 자리 잡은 이름난 정파 문파. 화려한 검술로 유명하다.", "삼대제자": "문파를 세운 사람으로부터 3대째 이어지는 제자. 문파의 젊은 주력이다.", "마보": "말을 탄 것처럼 무릎을 굽히고 버티는 기초 수련 자세.", "토납법": "숨을 뱉고 들이마시며 몸 안의 기운을 다스리는 호흡 수련법.", "구결": "무공의 요령을 외우기 쉽게 정리한 짧은 글귀.", "시진": "옛 시간 단위. 한 시진은 약 두 시간이다.", "해시": "밤 9시에서 11시 사이.", "객잔": "밥과 술을 팔고 잠자리도 내주는 숙소 겸 식당.", "훈장": "서당에서 아이들에게 글을 가르치는 선생.", "무관": "돈을 받고 무술을 가르치는 도장.", "고뿔": "감기를 이르는 옛말.", "영근": "하늘과 땅의 영기를 빨아들이는 타고난 뿌리라고 한다. 수만 명 가운데 하나 날까 말까 한, 하늘이 고른 그릇.", "이류": "삼류 위의 무인 등급. 웬만한 고을에서는 고수 소리를 듣는다.", "투전": "패를 뽑아 끗수를 겨루는 노름.", "보부상": "물건을 지고 이 장터 저 장터를 떠도는 장사꾼.", "기녀": "술자리에서 노래와 춤으로 손님을 접대하는 여인.", "법력": "무공과는 결이 다른, 정체 모를 힘. 내공으로는 설명되지 않는다.", "무복": "무술을 익힐 때 입는 활동하기 편한 옷.", "사문": "자신이 속한 문파를 높여 부르는 말.", "상단": "여럿이 함께 장사하는 큰 상인 조직.", "죽비": "대나무로 만든 회초리 같은 도구. 수련생을 깨우칠 때 친다.", "검은 비늘": "뿔 달린 자가 남긴 비늘. 차갑고 단단하다. 쓰는 법은 모르지만, 하계의 어떤 칼도 흠집 하나 내지 못한다.", "동전": "구리로 만든 작은 돈. 백 닢을 꿰어 한 꾸러미, 천 닢이면 은자 한 냥쯤 된다.", "비무": "무예를 겨루는 일. 목숨을 걸지 않는 대련.", "표국": "돈을 받고 물건이나 사람을 지켜 실어 나르는 곳.", "표사": "표국에 속해 짐을 지키는 무인.", "정식 제자": "잡일꾼이 아니라 정식으로 무공을 배우는 제자.", "비급": "무공의 비법을 적은 책.", "운기조식": "몸 안의 기운을 돌려 다스리고 쌓는 수련.", "단전": "배꼽 아래, 기운이 모이는 곳.", "폐관": "바깥과 연락을 끊고 틀어박혀 수련하는 일.", "내상": "몸 안, 기운이 다니는 길이 다친 것.", "녹림": "산적 무리를 점잖게 이르는 말.", "표두": "표국 일행을 이끄는 우두머리.", "무당파": "태극의 이치를 따르는 이름난 정파 문파.", "남궁세가": "검으로 이름난 명문 무가.", "가부좌": "두 다리를 꼬아 앉는 수련 자세.", "포두": "관부에서 도적을 잡는 일을 맡은 우두머리.", "속가제자": "문파에 머물지 않고 바깥에서 무공을 배우는 제자.", "산문": "문파로 들어가는 산 입구의 문.", "장문인": "문파를 이끄는 우두머리.", "천마신교": "마교가 스스로를 부르는 이름.", "기루": "기녀들이 노래와 술로 손님을 맞는 곳.", "경맥": "몸 안에서 기운이 다니는 길.", "영지": "신령한 기운이 깃든 버섯. 귀한 영약이 된다.", "일류": "이류 위의 무인 등급. 강호에서 이름 석 자로 통한다.", "별호": "강호에서 이름 대신 불리는 별명.", "무림맹": "정파 문파들이 손잡고 세운 연합. 마교에 맞선다.", "장로": "문파나 교에서 우두머리 바로 아래의 높은 어른.", "장력": "손바닥으로 내뿜는 기운.", "장서각": "귀한 책과 기록을 모아 둔 누각.", "절정": "일류 위의 무인 등급. 무림에서 한 손에 꼽히는 고수.", "생사결": "목숨을 걸고 겨루는 결투.", "루주": "기루의 주인.", "가주": "한 가문을 이끄는 어른.", "교두": "무사들에게 무예를 가르치는 사람.", "초절정": "절정 위의 경지. 강호에 손꼽을 만큼밖에 없는 고수.", "검기": "검끝에 기운을 맺어 검날보다 날카롭게 베는 경지. 일류 고수의 표지.", "검사": "검끝의 기운이 실처럼 검을 벗어나 허공을 가르는 경지. 절정 고수의 솜씨.", "검강": "검끝의 기운이 형체를 얻어 빛으로 된 검날이 되는 경지. 초절정 고수의 표지.", "화경": "초절정 위의 경지. 정·기·신이 하나로 모여 머리 위에 세 송이 꽃이 핀다. 강호에 전설로만 남은 자리.", "삼화취정": "정(精)·기(氣)·신(神) 세 기운이 모여 머리 위에 세 송이 꽃으로 피어나는 것. 화경에 이른 표지.", "천마": "마교(천마신교)의 우두머리를 높여 부르는 이름. 대마다 한 사람이 이 이름을 잇는다.", "매화만리향": "화산 매화검법의 끝. 피워 낸 매화의 향이 만 리에 퍼진다.", "현경": "화경 위의 경지. 기운이 안으로 숨어 겉으로는 범인처럼 보인다. 무림에서 전설로만 전해진다.", "반박귀진": "꾸밈을 버리고 본래의 참됨으로 돌아간다는 말. 극에 이른 기운이 안으로 숨어 겉으로는 평범한 사람처럼 보인다.", "무형검": "형체 없는 검. 검날 대신 베겠다는 뜻이 먼저 가서 벤다.", "심검": "마음의 검. 마음이 닿는 곳이면 거리와 상관없이 벤다.", "위영근": "수선자들은 다섯 영근이 뒤섞인 것을 위영근이라 부르며 // 브라우저 저장소 감싸기. 저장이 막힌 환경에서도 게임이 멈추지 않게 한다.
const Store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (_) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (_) {}
  },
};

// 시드 가능한 난수. 같은 시드면 같은 결과가 나와서 버그 재현이 쉽다.
class Rng {
  constructor(seed = Date.now()) {
    this.s = seed >>> 0;
  }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  percent() {
    return this.next() * 100;
  }
  pickWeighted(list, weightOf) {
    const total = list.reduce((s, x) => s + weightOf(x), 0);
    let r = this.next() * total;
    for (const x of list) {
      r -= weightOf(x);
      if (r < 0) return x;
    }
    return list[list.length - 1];
  }
}

// 한 번의 생(生) 동안의 주인공 상태.
class GameState {
  static weapons = {};
  constructor(config) {
    if (config.weapons) GameState.weapons = config.weapons;
    this.stats = { ...config.startStats };
    this.items = [...config.startItems];
    this.flags = new Set();
    this.bonds = {};
    this.reputation = {};
    this.affiliation = null;
    this.situation = null; // 지금 처한 상황(예: "수감"). 있으면 그 상황의 장면만 나온다
    this.path = null; // 이야기 갈래(예: "이어진_길"). 화면에는 보이지 않고, 그 갈래의 장면만 나온다
    this.seen = new Set();
    this.outcomesSeen = [];
    this.achievements = [];
    this.scenes = 0;
    this.lastEventId = null;
    this.recent = []; // 최근 본 장면 3개
    this.termCounts = {}; // 이번 생에 용어 밑줄이 나온 횟수
    this.stagnant = 0; // 벽을 넘을 준비가 된 뒤 머문 장면 수
    this.rare = 0; // 이번 생에 터진 드문 인과 수
    this.log = []; // 하단 기록창 내용 {title, tag, changes, dead}
    this.dead = false;
    this.ending = null; // 귀결(이야기가 매듭지어진 결말) id
    this.pastBonds = {}; // 지난 생들의 최고 인연 (기시감)
  }
  // 능력치(가진 무기의 보너스 포함). base()는 무기를 뺀 원래 값.
  stat(name) {
    return this.base(name) + (this.gear()[name] ?? 0);
  }
  base(name) {
    return this.stats[name] ?? 0;
  }
  // 가진 무기 중 보너스 합이 가장 큰 한 자루만 쓴다.
  weapon() {
    let best = null, top = 0;
    for (const it of this.items) {
      const b = GameState.weapons[it];
      const sum = b ? Object.values(b).reduce((a, v) => a + v, 0) : 0;
      if (sum > top) { best = it; top = sum; }
    }
    return best;
  }
  gear() {
    const w = this.weapon();
    return w ? GameState.weapons[w] : {};
  }
  hasItem(name) {
    return this.items.includes(name);
  }
  addItem(name) {
    this.items.push(name);
  }
  removeItem(name) {
    const i = this.items.indexOf(name);
    if (i >= 0) this.items.splice(i, 1);
  }
}

// 데이터 읽기. 이벤트 묶음 목록은 data/events/index.json에 있다.
// 단일 파일로 빌드된 판에서는 window.EVENT_DATA / window.ACHIEVEMENT_DATA를 그대로 쓴다.
class EventLoader {
  constructor(indexPath, achievementsPath, codexPath) {
    this.codexPath = codexPath;
    this.indexPath = indexPath;
    this.achievementsPath = achievementsPath;
  }
  async load() {
    if (window.EVENT_DATA) return this.merge(window.EVENT_DATA);
    const base = this.indexPath.slice(0, this.indexPath.lastIndexOf("/") + 1);
    const index = await (await fetch(this.indexPath)).json();
    const batches = await Promise.all(index.batches.map(async (f) => (await fetch(base + f)).json()));
    return this.merge(batches);
  }
  async loadCodex() {
    const data = window.CODEX_DATA ?? (await (await fetch(this.codexPath)).json());
    return data.sections;
  }
  async loadCombat() {
    return window.COMBAT_DATA ?? (await (await fetch("data/combat.json")).json());
  }
  async loadAchievements() {
    const data = window.ACHIEVEMENT_DATA ?? (await (await fetch(this.achievementsPath)).json());
    return data.achievements;
  }
  merge(batches) {
    const byId = new Map();
    for (const b of batches) for (const ev of b.events) byId.set(ev.id, ev);
    return byId;
  }
}

// 조건 판정과 다음 장면 고르기.
// pool 종류: "pool"(기본, 무작위 등장) / "chain"(다른 장면의 next_event로만) / "fixed"(정해진 때에만, 예: 첫 장면)
function meetsCondition(state, cond = {}) {
  if (cond.items && !cond.items.every((i) => state.hasItem(i))) return false;
  if (cond.items_none && cond.items_none.some((i) => state.hasItem(i))) return false;
  if (cond.flags && !cond.flags.every((f) => state.flags.has(f))) return false;
  if (cond.flags_any && !cond.flags_any.some((f) => state.flags.has(f))) return false;
  if (cond.flags_none && cond.flags_none.some((f) => state.flags.has(f))) return false;
  // flags_count: { of: [플래그…], min, max } — 목록 중 가진 개수가 min~max일 때만
  if (cond.flags_count) {
    const { of, min = 0, max = Infinity } = cond.flags_count;
    const n = of.filter((f) => state.flags.has(f)).length;
    if (n < min || n > max) return false;
  }
  // any: [조건…] 중 하나라도 맞으면 / none_of: [조건…] 중 하나도 안 맞으면
  if (cond.any && !cond.any.some((c) => meetsCondition(state, c))) return false;
  if (cond.none_of && cond.none_of.some((c) => meetsCondition(state, c))) return false;
  if (cond.scenes_min && (state.scenes ?? 0) < cond.scenes_min) return false;
  if (cond.stat_min && !Object.entries(cond.stat_min).every(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.stat_min_any && !Object.entries(cond.stat_min_any).some(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.realm_min != null && state.stat("경지") < cond.realm_min) return false;
  if (cond.realm_max != null && state.stat("경지") > cond.realm_max) return false;
  // 인연: { 인물: 최소 인연 }
  if (cond.bond_min && !Object.entries(cond.bond_min).every(([k, v]) => (state.bonds?.[k] ?? 0) >= v)) return false;
  // 전생의 인연: { 인물: 지난 생들에서 쌓았던 최고 인연 } — 기시감 선택지
  if (cond.past_bond_min && !Object.entries(cond.past_bond_min).every(([k, v]) => (state.pastBonds?.[k] ?? 0) >= v)) return false;
  // 지난 생의 업적: [업적id…] 중 하나라도 지난 생들에서 얻었으면
  if (cond.past_achievements_any && !cond.past_achievements_any.some((a) => (state.pastAchievements ?? []).includes(a))) return false;
  // 지난 생에 겪은 것: ["flag:…", "item:…", "aff:…", "ev:…"] 중 하나라도 겪었으면
  if (cond.past_known_any && !cond.past_known_any.some((k) => (state.pastKnown ?? []).includes(k))) return false;
  // 체질: { 체질id: 최소 단계 } — 켜 둔 체질이 그 단계 이상일 때만
  if (cond.traits && !Object.entries(cond.traits).every(([k, v]) => (state.traits?.[k] ?? 0) >= v)) return false;
  // 소속: "none"이면 무소속일 때만, 이름이면 그 소속일 때만. affiliation_not은 그 소속이면 안 됨.
  const aff = state.affiliation ?? "none";
  if (cond.affiliation && cond.affiliation !== aff) return false;
  if (cond.affiliation_not && cond.affiliation_not.includes(aff)) return false;
  return true;
}

class EventSelector {
  constructor(eventsById, rng, config) {
    this.events = eventsById;
    this.rng = rng;
    this.config = config;
  }
  // 인과록 기반 새로움 가중치 (NoveltyWeigher)
  useNovelty(weigher) {
    this.novelty = weigher;
  }
  // 정사 치우침 (SideLean)
  useSides(lean) {
    this.sides = lean;
  }
  byId(id) {
    return this.events.get(id) ?? null;
  }
  next(state) {
    // repeat=true인 장면(수련 등)은 여러 번 나올 수 있다. 단, 방금 본 장면은 다른 후보가 있으면 건너뛴다.
    let pool = [...this.events.values()].filter(
      (ev) =>
        (ev.pool ?? "pool") === "pool" &&
        (ev.situation ?? null) === (state.situation ?? null) && // 상황(감옥 등)에 맞는 장면만
        (ev.path ?? null) === (state.path ?? null) && // 이야기 갈래(이어진 길 등)에 맞는 장면만
        (ev.repeat || !state.seen.has(ev.id)) &&
        meetsCondition(state, ev.conditions)
    );
    // 최근에 본 장면(최대 3개)은 다른 후보가 있으면 건너뛴다.
    const recent = state.recent ?? [state.lastEventId];
    for (let n = recent.length; n > 0; n--) {
      const left = pool.filter((ev) => !recent.slice(-n).includes(ev.id));
      if (left.length) { pool = left; break; }
    }
    if (!pool.length) {
      // 이 경지에서 더 나올 장면이 없으면 경지별 마지막 장면(한 번만)
      const fb = this.byId(this.config.fallbackEvents?.[state.stat("경지")]);
      return fb && !state.seen.has(fb.id) ? fb : null;
    }
    // 내 소속과 같은 group의 장면은 더 자주 나온다.
    // weight_flags: { 표시: 배수 } — 그 표시가 있으면 더 잘 나온다 (소문을 들은 장면 등)
    const flagBoost = (ev) => Object.entries(ev.weight_flags ?? {}).reduce((m, [f, x]) => (state.flags.has(f) ? m * x : m), 1);
    const boost = (ev) => flagBoost(ev) * (ev.group && ev.group === state.affiliation ? this.config.affiliationBoost : 1) * this.personBoost(ev, state) * (this.sides ? this.sides.weight(ev, state) : 1);
    const fresh = (ev) => (this.novelty ? this.novelty.weight(ev, state) : 1);
    return this.rng.pickWeighted(pool, (ev) => (ev.weight ?? this.config.defaultWeight) * boost(ev) * fresh(ev) * this.chainBoost(ev));
  }
  // 연계의 다음 장면(앞 장면의 플래그나 인연을 조건으로 하는 장면)은 더 자주 나온다. 경지가 오르기 전에 매듭짓도록.
  chainBoost(ev) {
    const c = ev.conditions ?? {};
    const isChain = !ev.repeat && (c.flags?.length || c.flags_any?.length || c.bond_min);
    return isChain ? this.config.chainBoost ?? 1 : 1;
  }
  // 인연을 쌓은 인물이 나오는 장면(person)은 더 자주 나온다: 인연 n당 ×(1 + n/perBond), 최대 maxBond배
  personBoost(ev, state) {
    if (!ev.person) return 1;
    const { perBond, max } = this.config.personBoost;
    const people = Array.isArray(ev.person) ? ev.person : [ev.person];
    // 이야기 갈래(이어진 길 등)의 장면은 지난 생의 인연도 본다
    const bondOf = (p) => Math.max(state.bonds?.[p] ?? 0, ev.path ? state.pastBonds?.[p] ?? 0 : 0);
    const best = Math.max(0, ...people.map(bondOf));
    return Math.min(max, 1 + best / perBond);
  }
  // 조건을 채운 선택지. 비추천 표시와 정렬은 main에서 지금 상태로 계산한다.
  availableChoices(ev, state) {
    return ev.choices.filter((c) => meetsCondition(state, c.condition));
  }
}

// 새로움 가중치: 인과록(모든 생의 기록)을 보고, 아직 못 본 것이 남은 장면을 더 자주 띄운다.
// 노려볼 만한 것(지금 고를 수 있는 선택지 + 기본 확률 minChance% 이상, 또는 기본 결과)만 센다.

class NoveltyWeigher {
  constructor(record, config) {
    this.record = record;
    this.cfg = config.novelty;
  }
  // 지금 상태에서 노려볼 만한 결과들 [{ evId, choice, outcome, index }]
  reachable(ev, state) {
    const out = [];
    for (const c of ev.choices) {
      if (!meetsCondition(state, c.condition)) continue;
      c.outcomes.forEach((o, index) => {
        if (o.effects?.death) return;
        if (o.chance != null && o.chance < this.cfg.minChance) return;
        out.push({ choice: c, outcome: o, index });
      });
    }
    return out;
  }
  // 이번 생에 겪은 결과까지 포함해 본 적 있는지
  seenOutcome(state, key) {
    return this.record.data.outcomes.includes(key) || state.outcomesSeen.includes(key);
  }
  weight(ev, state) {
    const rec = this.record;
    if (!rec.knows(`ev:${ev.id}`)) return this.cfg.unseen;
    const reach = this.reachable(ev, state);
    let w = 1;
    if (reach.some((r) => !this.seenOutcome(state, `${ev.id}:c${r.choice.id}.o${r.index}`))) w *= this.cfg.outcome;
    if (reach.some((r) => r.outcome.effects?.achievement && !rec.data.achievements.includes(r.outcome.effects.achievement))) w *= this.cfg.achievement;
    const people = ev.person ? (Array.isArray(ev.person) ? ev.person : [ev.person]) : [];
    const items = reach.flatMap((r) => r.outcome.effects?.items ?? []);
    if (people.some((p) => !rec.knows(`bond:${p}`)) || items.some((x) => !rec.knows(`item:${x}`))) w *= this.cfg.codex;
    return w;
  }
  // 아직 한 번도 골라 본 적 없는 선택지 (모든 생 + 이번 생)
  isFreshChoice(evId, choiceId, state) {
    const p = `${evId}:c${choiceId}.`;
    return !this.record.data.outcomes.some((k) => k.startsWith(p)) && !state.outcomesSeen.some((k) => k.startsWith(p));
  }
}

// 정사 치우침: 내가 정파·사파 중 한쪽으로 크게 기울면, 반대쪽 인물의 장면이 덜 나온다.
// 기울었다고 보는 때: 평판 차이가 repGap 이상 / 그쪽 인물과 인연이 bond 이상 / 그쪽 편을 골랐을 때(sideFlags)
class SideLean {
  constructor(config) {
    this.cfg = config.sides;
  }
  // 지금 기운 쪽("정파" | "사파" | null)
  lean(state) {
    const c = this.cfg;
    if (!c) return null;
    const score = {};
    for (const side of Object.keys(c.people)) {
      const other = Object.keys(c.people).find((s) => s !== side);
      const rep = (state.reputation?.[side] ?? 0) - (state.reputation?.[other] ?? 0);
      const bond = Math.max(0, ...c.people[side].map((p) => state.bonds?.[p] ?? 0));
      score[side] = (rep >= c.repGap ? 1 : 0) + (bond >= c.bond ? 1 : 0) + (state.flags.has(c.sideFlags[side]) ? 1 : 0);
    }
    const [a, b] = Object.keys(score);
    if (score[a] === score[b]) return null;
    return score[a] > score[b] ? a : b;
  }
  sideOf(person) {
    for (const [side, list] of Object.entries(this.cfg?.people ?? {})) if (list.includes(person)) return side;
    return null;
  }
  // 장면 가중치 배수
  weight(ev, state) {
    if (!ev.person || !this.cfg) return 1;
    const lean = this.lean(state);
    if (!lean) return 1;
    const people = Array.isArray(ev.person) ? ev.person : [ev.person];
    const opposite = people.some((p) => { const s = this.sideOf(p); return s && s !== lean; });
    return opposite ? this.cfg.factor : 1;
  }
}

// 장면 글 갈래: 조건에 맞으면 같은 장면의 글을 조금 바꿔 보여 준다.
// 장면에 "variants": [{ "when": {조건}, "terms": {"맹주": "사도련주"}, "lines": {"원래 줄": ["바뀐 줄", …]} }]
//  - terms: 글 속 낱말을 바꾼다(긴 낱말부터)
//  - lines: 줄 하나를 여러 줄로 바꾼다(빈 배열이면 그 줄을 지운다)

class TextVariants {
  constructor(eventsById) {
    this.events = eventsById;
  }
  apply(id, value, state) {
    const ev = this.events.get(id);
    if (!ev?.variants || !state) return value;
    for (const v of ev.variants) {
      if (!meetsCondition(state, v.when)) continue;
      value = Array.isArray(value) ? this.applyLines(value, v) : this.applyTerms(value, v.terms);
    }
    return value;
  }
  applyLines(lines, v) {
    const out = [];
    for (const line of lines) {
      const rep = v.lines?.[line];
      const list = rep ?? [line];
      for (const l of list) out.push(this.applyTerms(l, v.terms));
    }
    return out;
  }
  applyTerms(s, terms) {
    if (!terms || typeof s !== "string") return s;
    const keys = Object.keys(terms).sort((a, b) => b.length - a.length);
    if (!keys.length) return s;
    const re = new RegExp(keys.map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
    return s.replace(re, (m) => terms[m]);
  }
}

// 선택 결과 판정(확률 + 스탯 보정)과 효과 적용.

class ResultResolver {
  constructor(rng, config) {
    this.rng = rng;
    this.config = config;
  }

  chanceOf(outcome, state) {
    let c = outcome.chance;
    for (const [stat, per] of Object.entries(outcome.mods ?? {})) c += per * state.stat(stat);
    if (outcome.effects?.realm_set) c += this.breakBonus(state);
    // flagMods: { 플래그: %p } — 그 플래그가 있으면 확률을 더한다 (예: 결전에서 모인 조력)
    for (const [f, per] of Object.entries(outcome.flagMods ?? {})) if (state.flags.has(f)) c += per;
    // 하한은 chanceMin이지만, 원래부터 그보다 낮게 잡은 극악 확률은 그대로 둔다.
    return Math.min(this.config.chanceMax, Math.max(Math.min(this.config.chanceMin, outcome.chance), c));
  }

  // 결과의 when: 그 조건을 채울 때만 그 결과가 후보가 된다 (예: 말을 모를 때만 나오는 결과)
  onlyWhen(choice, state) {
    if (!choice.outcomes.some((o) => o.when)) return choice;
    return { ...choice, outcomes: choice.outcomes.filter((o) => !o.when || meetsCondition(state, o.when)) };
  }

  // 드문 인과: 기본 확률이 rareChance 이하이면서 죽음이 아닌 결과.
  isRare(outcome) {
    return outcome.chance != null && outcome.chance <= this.config.rareChance && !outcome.effects?.death;
  }

  // chance가 있는 결과들을 차례로 쌓고, 남은 확률은 chance 없는 결과가 가져간다.
  // deaths: 전생에 이 선택지에서 죽은 횟수. 죽음 확률을 조금 깎아준다(전생의 기억).
  //  - 죽음 결과에 chance가 있으면 그만큼 빼고,
  //  - 죽음이 나머지 확률이면 처음 나오는 평범한 생존 결과에 더한다.
  //  - 드문 인과(대박)는 배율로만 조금 올려서 대박의 희소함은 지킨다.
  pick(choice, state, deaths = 0) {
    choice = this.onlyWhen(choice, state);
    // noDeathIf: 이 조건을 채우면 이 선택지에서는 죽지 않는다 (남은 확률은 마지막 생존 결과가 가져감)
    if (choice.noDeathIf && meetsCondition(state, choice.noDeathIf)) {
      const alive = choice.outcomes.filter((o) => !o.effects?.death);
      const last = alive[alive.length - 1];
      choice = { ...choice, outcomes: alive.map((o) => (o === last ? { ...o, chance: undefined } : o)) };
    }
    const m = { ...this.config.deathMemory, ...(choice.memory ?? {}) }; // 선택지마다 전생의 기억 보정을 키울 수 있다
    const bonus = Math.min(m.cap, deaths * m.perDeath);
    const outs = choice.outcomes;
    const fallback = outs.find((o) => o.chance == null) ?? null;
    const fallbackDeath = !!fallback?.effects?.death;
    let boosted = false;
    const r = this.rng.percent();
    let acc = 0;
    for (const o of outs) {
      if (o.chance == null) continue;
      let c = this.chanceOf(o, state);
      if (bonus) {
        if (o.effects?.death) c = Math.max(0, c - bonus);
        else if (this.isRare(o)) c *= 1 + Math.min(m.rareCap, deaths * m.rarePerDeath);
        else if (fallbackDeath && !boosted) { c += bonus; boosted = true; }
      }
      acc += c;
      if (r < acc) return o;
    }
    return fallback ?? outs[outs.length - 1];
  }

  // pick과 같은 규칙으로 각 결과가 나올 확률(%)을 [결과, 확률] 목록으로 돌려준다.
  distribution(choice, state, deaths = 0) {
    choice = this.onlyWhen(choice, state);
    if (choice.noDeathIf && meetsCondition(state, choice.noDeathIf)) {
      const alive = choice.outcomes.filter((o) => !o.effects?.death);
      const last = alive[alive.length - 1];
      choice = { ...choice, outcomes: alive.map((o) => (o === last ? { ...o, chance: undefined, src: o.src ?? o } : o)) };
    }
    const m = { ...this.config.deathMemory, ...(choice.memory ?? {}) }; // 선택지마다 전생의 기억 보정을 키울 수 있다
    const bonus = Math.min(m.cap, deaths * m.perDeath);
    const outs = choice.outcomes;
    const fallback = outs.find((o) => o.chance == null) ?? outs[outs.length - 1];
    const fallbackDeath = !!outs.find((o) => o.chance == null)?.effects?.death;
    let boosted = false;
    let acc = 0;
    const list = [];
    for (const o of outs) {
      if (o.chance == null) continue;
      let c = this.chanceOf(o, state);
      if (bonus) {
        if (o.effects?.death) c = Math.max(0, c - bonus);
        else if (this.isRare(o)) c *= 1 + Math.min(m.rareCap, deaths * m.rarePerDeath);
        else if (fallbackDeath && !boosted) { c += bonus; boosted = true; }
      }
      list.push([o, Math.max(0, Math.min(acc + c, 100) - Math.min(acc, 100))]);
      acc += c;
    }
    list.push([fallback, Math.max(0, 100 - acc)]);
    return list;
  }

  stalled(stat, state) {
    const st = this.config.stagnation;
    return !!st && (state.stagnant ?? 0) >= st.limit && st.stats.includes(stat) && state.stat("경지") in st.walls;
  }

  // 켜 둔 체질이 경지 돌파 결과에 더해 주는 확률(%p)
  breakBonus(state) {
    let b = 0;
    for (const tr of this.config.traits ?? []) {
      const lv = state.traits?.[tr.id];
      if (lv) b += tr.tiers[lv - 1]?.breakBonus ?? 0;
    }
    return b;
  }

  // 켜 둔 체질이 이 능력치를 얻을 때 더 주는 양 { n, name } (없으면 null)
  gainBonus(stat, state) {
    for (const tr of this.config.traits ?? []) {
      const lv = state.traits?.[tr.id];
      const n = lv ? tr.tiers[lv - 1]?.bonus?.[stat] : 0;
      if (n) return { n, name: tr.tiers[lv - 1].name };
    }
    return null;
  }

  // 이 결과가 지금 상태에서 목숨을 앗아가는지 (죽음, 또는 체력이 바닥나는 피해)
  kills(outcome, state) {
    const e = outcome.effects ?? {};
    if (e.death) return true;
    if (e.피해) {
      const amt = Math.max(1, Math.ceil(state.stat("최대체력") * this.config.hpTiers.피해[e.피해]));
      return state.stat("체력") - amt <= 0;
    }
    return false;
  }

  // 효과를 적용하고, 화면에 보여줄 변화 목록(언어와 무관한 구조)을 돌려준다.
  apply(outcome, state) {
    const changes = [];
    const e = outcome.effects ?? {};
    for (const [k, v] of Object.entries(e)) {
      // 없앤 능력치(체력 등)는 적용하지 않는다
      if (this.config.disabledStats?.includes(k.replace(/_set$/, ""))) continue;
      if (k === "death") state.dead = !!v;
      else if (k === "items") v.forEach((i) => { state.addItem(i); changes.push({ type: "gain", item: i, good: true }); });
      else if (k === "items_remove") v.forEach((i) => { state.removeItem(i); changes.push({ type: "lose", item: i, good: false }); });
      else if (k === "items_clear") { if (state.items.length) changes.push({ type: "loseAll", good: false }); state.items = []; }
      else if (k === "flags") v.forEach((f) => state.flags.add(f));
      else if (k === "flags_remove") v.forEach((f) => state.flags.delete(f));
      else if (k === "achievement") state.achievements.push(v);
      else if (k === "next_event" || k === "전투") continue;
      // if: [{ when: {조건}, effects: {…} }] — 조건을 채울 때만 더 적용 (예: 지난 생 기억이 있으면 단서)
      else if (k === "if") v.forEach((c) => { if (meetsCondition(state, c.when)) changes.push(...this.apply({ effects: c.effects }, state)); });
      else if (k === "ending") state.ending = v;
      // 전투 기세 같은 임시 수치를 조용히 0으로 (예: "기세_reset": true)
      // 체력 회복·피해: 단계(조금/제법/완전, 가볍게/크게/치명)를 최대 체력 비율로
      else if (k === "회복" || k === "피해") {
        const max = state.stat("최대체력");
        const amt = Math.max(1, Math.ceil(max * this.config.hpTiers[k][v]));
        state.stats.체력 = k === "회복" ? Math.min(max, state.stat("체력") + amt) : state.stat("체력") - amt;
        changes.push({ type: "hp", kind: k, tier: v, good: k === "회복" });
      }
      else if (k.endsWith("_reset")) state.stats[k.slice(0, -6)] = 0;
      else if (k === "realm_set") { if (v > state.stat("경지")) state.stats.체력 = state.stat("최대체력"); state.stats.경지 = v; state.stagnant = 0; changes.push({ type: "realm", value: v, good: true }); }
      else if (k.endsWith("_set")) { const s = k.slice(0, -4); state.stats[s] = v; changes.push({ type: "set", stat: s, value: v, good: false }); }
      else if (k === "갈래") state.path = v === "없음" ? null : v; // 숨은 이야기 갈래(화면에 표시하지 않음)
      else if (k === "상황") {
        // 상황 "없음"은 상황에서 벗어난다 (예: 감옥에서 풀려남)
        state.situation = v === "없음" ? null : v;
        changes.push({ type: "situation", name: v, good: v === "없음" });
      }
      else if (k === "소속") {
        // 소속 "없음"은 무소속으로 되돌린다.
        state.affiliation = v === "없음" ? null : v;
        changes.push(v === "없음" ? { type: "leave", good: false } : { type: "join", name: v, good: true });
      }
      else if (k === "인연") { addAll(state.bonds, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "bond", name: who, delta: d, good: d > 0 }); }
      else if (k === "평판") { addAll(state.reputation, v); for (const [who, d] of Object.entries(v)) changes.push({ type: "fame", name: who, delta: d, good: d > 0 }); }
      else if (typeof v === "number" && v > 0 && this.stalled(k, state)) {
        // 벽 앞에서 너무 오래 머물렀다: 이 경지에서는 더 오르지 않는다
        if (!changes.some((c) => c.type === "stall")) changes.push({ type: "stall", good: false });
      }
      else if (typeof v === "number") {
        const extra = v > 0 ? this.gainBonus(k, state) : null; // 예: 삼재지체는 내공을 얻을 때마다 1 더
        state.stats[k] = state.base(k) + v + (extra?.n ?? 0);
        if (k === "재물" && state.stats[k] < 0) state.stats[k] = 0; // 재물은 있는 만큼만 잃는다
        changes.push({ type: "stat", stat: k, delta: v, extra, good: v > 0 });
      }
    }
    if (state.stat("체력") <= 0) state.dead = true;
    return changes;
  }
}

function addAll(target, deltas) {
  for (const [k, d] of Object.entries(deltas)) target[k] = (target[k] ?? 0) + d;
}


// 전투 엔진: 화면과 상관없이 합(合) 단위로 계산만 한다.
// 근골 = 피해량, 민첩 = 명중·회피(선공도 민첩), 행운 = 치명타·회피 보정, 내공 = 무공 위력(쓸 때 소모, 끝나면 복구)
class Battle {
  constructor(rng, config, player, enemy, arts, items = []) {
    this.rng = rng;
    this.cfg = config.combat;
    this.config = config;
    this.player = player; // GameState
    this.enemy = { ...enemy, hp: enemy.체력, max: enemy.체력 };
    this.arts = arts; // 지금 쓸 수 있는 무공
    this.itemDefs = items; // 전투 소지품 정의 (data/combat.json items)
    this.buff = {}; // 소지품으로 오른 능력치 (이번 전투만)
    this.usedOnce = new Set();
    this.enemyBlind = false;
    this.after = []; // 전투가 끝나면 받을 피해 단계
    this.neigongStart = player.stat("내공");
    this.round = 0;
    this.over = null; // "win" | "lose"
    // 민첩이 높은 쪽이 먼저 친다 (같으면 나)
    this.playerFirst = player.stat("민첩") >= enemy.민첩;
  }
  // 공격자 능력치 묶음
  me() {
    const s = this.player;
    const b = this.buff;
    return { 근골: s.stat("근골") + (b.근골 ?? 0), 민첩: s.stat("민첩") + (b.민첩 ?? 0), 행운: s.stat("행운") + (b.행운 ?? 0), realm: s.stat("경지") };
  }
  hitChance(att, def) {
    const c = this.cfg;
    const v = c.baseHit + (att.민첩 - def.민첩) * c.perAgi - def.행운 * c.perLuckEvade + (att.realm - def.realm) * c.perRealmHit;
    return Math.max(c.minHit, Math.min(c.maxHit, v));
  }
  damage(att, def, mult = 1) {
    const c = this.cfg;
    const base = 1 + att.근골 * c.perStr + Math.max(0, att.realm - def.realm) * c.perRealmDmg;
    const spread = 0.85 + this.rng.next() * 0.3;
    return Math.max(1, Math.round(base * mult * spread));
  }
  // 한 번의 공격. 결과 { who, hit, crit, dmg, art }
  strike(who, art = null, guarded = false) {
    const att = who === "me" ? this.me() : this.enemy;
    const def = who === "me" ? this.enemy : this.me();
    const res = { who, art: art?.id ?? null, hit: false, crit: false, dmg: 0 };
    // 눈이 가려진 놈의 공격은 반드시 빗나간다
    if (who === "enemy" && this.enemyBlind) { this.enemyBlind = false; res.blind = true; return res; }
    if (this.rng.percent() >= this.hitChance(att, def)) return res;
    res.hit = true;
    let mult = 1;
    if (art) mult = art.power + this.player.stat("내공") * art.perNeigong * 0.1;
    if (this.rng.percent() < this.cfg.baseCrit + att.행운 * this.cfg.perLuckCrit) { res.crit = true; mult *= 2; }
    let dmg = this.damage(att, def, mult);
    if (guarded) dmg = Math.max(0, Math.round(dmg * (1 - this.cfg.guard)));
    res.dmg = dmg;
    if (who === "me") this.enemy.hp -= dmg;
    else this.player.stats.체력 = this.player.stat("체력") - dmg;
    return res;
  }
  // 한 합: action = { type: "attack" | "art" | "guard", art }
  turn(action) {
    this.round += 1;
    const log = [];
    const art = action.type === "art" ? action.art : null;
    if (action.type === "item") log.push(this.useItem(action.item));
    if (art) this.player.stats.내공 = this.player.stat("내공") - art.cost;
    const guard = action.type === "guard";
    const mine = () => { if (!guard && action.type !== "item") log.push(this.strike("me", art)); };
    const theirs = () => { log.push(this.strike("enemy", null, guard)); };
    const order = this.playerFirst ? [mine, theirs] : [theirs, mine];
    for (const step of order) {
      step();
      if (this.enemy.hp <= 0) { this.over = "win"; break; }
      if (this.player.stat("체력") <= 0) { this.over = "lose"; break; }
    }
    return log;
  }
  // 소지품 쓰기. 결과 { who: "item", item, ... }
  useItem(def) {
    const s = this.player;
    if (def.heal) {
      const max = s.stat("최대체력");
      const amt = Math.max(1, Math.ceil(max * this.config.hpTiers.회복[def.heal]));
      s.stats.체력 = Math.min(max, s.stat("체력") + amt);
    }
    if (def.blind) this.enemyBlind = true;
    if (def.buff) for (const [k, v] of Object.entries(def.buff)) this.buff[k] = (this.buff[k] ?? 0) + v;
    if (def.after) this.after.push(def.after);
    if (def.once) this.usedOnce.add(def.id);
    if (def.consume) s.removeItem(def.id);
    return { who: "item", item: def.id };
  }
  // 지금 쓸 수 있는 전투 소지품
  usableItems() {
    return this.itemDefs.filter((d) => this.player.hasItem(d.id) && !this.usedOnce.has(d.id));
  }
  // 쓸 수 있는 무공 (내공이 모자라면 못 씀)
  usableArts() {
    return this.arts.map((a) => ({ ...a, ok: this.player.stat("내공") >= a.cost }));
  }
  // 전투가 끝나면 내공은 원래대로
  finish() {
    this.player.stats.내공 = this.neigongStart;
    // 소지품의 뒤탈 (예: 검은 환약)
    for (const tier of this.after) {
      const max = this.player.stat("최대체력");
      this.player.stats.체력 = Math.max(1, this.player.stat("체력") - Math.max(1, Math.ceil(max * this.config.hpTiers.피해[tier])));
    }
  }
}

// 언어 파일 읽기와 글 꺼내기. 화면에 나가는 모든 글은 여기를 거친다.
// 언어 파일: lang/<언어>/ui.json, events.json, achievements.json, items.json, names.json(인물·세력), glossary.json(용어 풀이)
const FILES = ["ui", "events", "achievements", "items", "names", "glossary", "codex"];

class I18n {
  constructor(langDir) {
    this.langDir = langDir;
    this.packs = {};
    this.lang = null;
  }

  async use(lang) {
    if (!this.packs[lang]) {
      const inline = window.LANG_DATA?.[lang];
      this.packs[lang] =
        inline ??
        Object.fromEntries(
          await Promise.all(FILES.map(async (f) => [f, await (await fetch(`${this.langDir}/${lang}/${f}.json`)).json()]))
        );
    }
    this.lang = lang;
    this.p = this.packs[lang];
    document.documentElement.lang = lang;
  }

  // 화면 글자. 예: t("menu.title"), t("game.life", { n: 3 })
  t(path, vars) {
    let s = path.split(".").reduce((o, k) => o?.[k], this.p.ui);
    if (s == null) return path;
    if (vars && typeof s === "string") for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
    return s;
  }

  // 이벤트 글. 예: ev(id, "title"), ev(id, "c2.o0")
  ev(id, part) {
    const v = this.p.events[`${id}.${part}`] ?? `${id}.${part}`;
    return this.evFilter ? this.evFilter(id, v) : v;
  }

  ach(id, field) {
    return this.p.achievements[`${id}.${field}`] ?? id;
  }

  // 인과록 도감 글. part: "name" 또는 "s0", "s1" …
  codex(id, part) {
    return this.p.codex?.[`${id}.${part}`] ?? id;
  }

  item(id) {
    return this.p.items[id] ?? id.replaceAll("_", " ");
  }

  // 전투 글: combat("enemy.<id>.name"), combat("art.<id>.name")
  combat(key) {
    return this.p.combat?.[key] ?? key.split(".")[1].replaceAll("_", " ");
  }

  name(id) {
    return this.p.names?.[id] ?? id.replaceAll("_", " ");
  }

  // 소지품 설명: 용어 풀이가 있으면 그것, 없으면 인과록 도감의 첫 단계 글
  itemDesc(id) {
    return this.gloss(this.item(id)) ?? this.p.codex?.[`${id}.s0`] ?? null;
  }

  // 용어 풀이. 없으면 null
  gloss(term) {
    return this.p.glossary?.[term] ?? null;
  }

  stat(id) {
    return this.p.ui.stats?.[id] ?? id;
  }

  realm(n) {
    return this.p.ui.realms?.[n] ?? String(n);
  }
}

// 회차(몇 번째 생)와 업(業), 인과록, 전생의 죽음 기록, 업 상점 단계.

const empty = () => ({ life: 0, karma: 0, karmaEarned: 0, outcomes: [], achievements: [], deaths: {}, shop: {}, traits: {}, known: [], bondsMax: {}, endings: [], memories: {}, memoriesSeen: [] });

class LifeRecord {
  constructor(config) {
    this.config = config;
    const saved = Store.get(config.storage.meta, {});
    this.data = { ...empty(), ...saved };
    // 예전 기록에는 누적 업이 없으므로 남은 업으로 채운다.
    if (saved.karmaEarned == null) this.data.karmaEarned = this.data.karma;
    // 예전 기록의 인과록(업적)도 도감 지식으로 옮겨 둔다.
    this.data.known = [...new Set([...this.data.known, ...this.data.achievements.map((a) => `ach:${a}`)])];
  }
  save() {
    Store.set(this.config.storage.meta, this.data);
  }
  wipe() {
    this.data = empty();
    Store.remove(this.config.storage.meta);
  }
  startLife() {
    this.data.life += 1;
    this.save();
    return this.data.life;
  }
  // 인과록 도감용: 모든 생을 통틀어 겪은 것(ev:/flag:/item:/ach:/bond:/aff:)
  learn(keys) {
    const set = new Set(this.data.known);
    const before = set.size;
    keys.forEach((k) => set.add(k));
    if (set.size !== before) { this.data.known = [...set]; this.save(); }
  }
  knows(key) {
    return this.data.known.includes(key);
  }
  // 전생의 기억: 어떤 선택지에서 몇 번 죽었는지
  deathsAt(evId, choiceId) {
    return this.data.deaths[`${evId}:${choiceId}`] ?? 0;
  }
  recordDeath(evId, choiceId) {
    const k = `${evId}:${choiceId}`;
    this.data.deaths[k] = (this.data.deaths[k] ?? 0) + 1;
    this.save();
  }
  // 시험용: 업을 그냥 넣어 준다
  grant(amount) {
    this.data.karma += amount;
    this.save();
  }
  spend(amount) {
    if (this.data.karma < amount) return false;
    this.data.karma -= amount;
    this.save();
    return true;
  }
  // 한 생이 끝날 때 업을 계산해 쌓는다.
  endLife(state) {
    const k = this.config.karma;
    const known = new Set(this.data.outcomes);
    const fresh = [...new Set(state.outcomesSeen)].filter((o) => !known.has(o));
    const newAch = [...new Set(state.achievements)].filter((a) => !this.data.achievements.includes(a));
    const parts = [
      { id: "scenes", value: state.scenes * k.perScene },
      { id: "fresh", value: fresh.length * k.perNewOutcome },
      { id: "realm", value: state.stat("경지") * k.perRealm },
      { id: "achievements", value: newAch.length * k.perAchievement },
      { id: "wealth", value: Math.max(0, Math.floor(state.stat("재물") / k.wealthPer)), note: state.stat("재물") },
      { id: "rare", value: (state.rare ?? 0) * k.perRare },
      { id: "ending", value: state.ending ? k.perEnding : 0 },
    ];
    // 오래 버틸수록 배율이 붙는다: 1 + 턴 수 × perSceneMult (최대 maxMult)
    const base = parts.reduce((s, p) => s + p.value, 0);
    const mult = Math.min(k.maxMult, 1 + state.scenes * k.perSceneMult);
    const total = Math.round(base * mult);
    // 기시감용: 인물마다 지난 생들의 최고 인연
    for (const [who, v] of Object.entries(state.bonds)) this.data.bondsMax[who] = Math.max(this.data.bondsMax[who] ?? 0, v);
    // 처음 본 귀결이 기억을 연다면 정산 화면에서 알린다
    const newMemories = state.ending && !this.data.endings.includes(state.ending)
      ? (this.config.memories ?? []).filter((m) => m.unlock === state.ending).map((m) => m.id) : [];
    if (state.ending && !this.data.endings.includes(state.ending)) this.data.endings.push(state.ending);
    // 표시(flag:)로 여는 기억: 이번 생에 그 표시를 얻었으면 업에 나타난다
    const unl = (this.data.memUnlocked ??= []);
    for (const m of this.config.memories ?? []) {
      if (!m.unlock?.startsWith("flag:") || unl.includes(m.id)) continue;
      if (state.flags.has(m.unlock.slice(5))) { unl.push(m.id); newMemories.push(m.id); }
    }
    this.data.outcomes.push(...fresh);
    this.data.achievements.push(...newAch);
    this.data.karma += total;
    this.data.karmaEarned += total;
    this.save();
    return { parts, base, mult, total, newAch, newMemories };
  }
}

// 업 상점: 업을 써서 타고난 바탕을 올린다. 산 단계는 매 생 시작할 때 적용된다.
class KarmaShop {
  constructor(config, record) {
    this.items = config.shop;
    this.traits = config.traits ?? [];
    this.memories = config.memories ?? [];
    this.record = record;
  }
  level(id) {
    return this.record.data.shop[id] ?? 0;
  }
  price(id) {
    const it = this.items.find((x) => x.id === id);
    return Math.round(it.base * Math.pow(it.growth, this.level(id)));
  }
  isMax(id) {
    const it = this.items.find((x) => x.id === id);
    return this.level(id) >= it.max;
  }
  buy(id) {
    if (this.isMax(id) || !this.record.spend(this.price(id))) return false;
    this.record.data.shop[id] = this.level(id) + 1;
    this.record.save();
    return true;
  }
  // 새 생의 상태에 산 만큼 더해준다.
  apply(state) {
    for (const it of this.items) state.stats[it.stat] = state.base(it.stat) + it.amount * this.level(it.id);
  }
  // 체질: record.data.traits[id] = { lv: 산 단계(1부터), on: 켜짐 }
  traitData(id) {
    const v = this.record.data.traits[id];
    if (v == null) return { lv: 0, on: false };
    return typeof v === "boolean" ? { lv: 1, on: v } : v; // 예전 기록(참/거짓) 호환
  }
  traitLevel(id) {
    return this.traitData(id).lv;
  }
  traitOn(id) {
    const d = this.traitData(id);
    return d.lv > 0 && d.on;
  }
  // 지금 단계(안 샀으면 첫 단계)와 다음 단계
  tierOf(tr) {
    return tr.tiers[Math.max(0, this.traitLevel(tr.id) - 1)];
  }
  nextTier(tr) {
    return tr.tiers[this.traitLevel(tr.id)] ?? null;
  }
  buyTrait(id) {
    const tr = this.traits.find((x) => x.id === id);
    const next = tr && this.nextTier(tr);
    if (!next || !this.record.spend(next.price)) return false;
    this.record.data.traits[id] = { lv: this.traitLevel(id) + 1, on: true };
    this.record.save();
    return true;
  }
  toggleTrait(id) {
    const d = this.traitData(id);
    if (!d.lv) return;
    this.record.data.traits[id] = { lv: d.lv, on: !d.on };
    this.record.save();
  }
  // 켜 둔 체질의 단계 { id: lv } — 매 생(이어하기 포함) 시작할 때 state.traits로 넣는다
  activeLevels() {
    return Object.fromEntries(this.traits.filter((x) => this.traitOn(x.id)).map((x) => [x.id, this.traitLevel(x.id)]));
  }
  // 기억: record.data.memories[id] = { on } (산 것만 들어 있다). 귀결 unlock을 본 적이 있어야 보인다
  get mem() {
    return (this.record.data.memories ??= {});
  }
  memoryVisible(m) {
    return (this.record.data.endings ?? []).includes(m.unlock) || (this.record.data.memUnlocked ?? []).includes(m.id);
  }
  visibleMemories() {
    return this.memories.filter((m) => this.memoryVisible(m));
  }
  memoryOwned(id) {
    return !!this.mem[id];
  }
  memoryOn(id) {
    return !!this.mem[id]?.on;
  }
  buyMemory(id) {
    const m = this.memories.find((x) => x.id === id);
    if (!m || this.memoryOwned(id) || !this.memoryVisible(m) || !this.record.spend(m.price)) return false;
    this.mem[id] = { on: true };
    this.record.save();
    return true;
  }
  toggleMemory(id) {
    if (!this.memoryOwned(id)) return;
    this.mem[id].on = !this.mem[id].on;
    this.record.save();
  }
  // 아직 업 화면에서 보지 못한 기억 (처음 보면 '새로' 표시)
  unseenMemories() {
    const seen = this.record.data.memoriesSeen ?? [];
    return this.visibleMemories().filter((m) => !seen.includes(m.id)).map((m) => m.id);
  }
  markMemoriesSeen() {
    const seen = (this.record.data.memoriesSeen ??= []);
    for (const id of this.unseenMemories()) seen.push(id);
    this.record.save();
  }
  // 켜 둔 기억의 플래그 — 새 생을 시작할 때 붙인다
  memoryFlags() {
    return this.memories.filter((m) => this.memoryOn(m.id)).map((m) => m.flag);
  }

  // 이 결과를 막는 켜 둔 체질의 지금 단계 (없으면 undefined)
  // choice를 넘기면 선택지에 따라 정해지는 막기(madDeath: 마공 선택지의 죽음)도 본다
  blocker(outcome, choice = null) {
    const hit = (b) => (b === "madDeath" ? !!choice?.madness && !!outcome.effects?.death : outcome[b]);
    for (const tr of this.traits) {
      if (!this.traitOn(tr.id)) continue;
      const tier = this.tierOf(tr);
      if (tier.blocks.some(hit)) return tier;
    }
  }
}

// 사용자 설정: 글자 크기, 언어, 용어 밑줄(twice: 한 생에 용어당 두 번까지 / always / off).
const TERM_MODES = ["twice", "always", "off"];

const FONT_SIZES = [
  { id: "s", px: 15 },
  { id: "m", px: 17 },
  { id: "l", px: 19 },
  { id: "xl", px: 21 },
];

class Settings {
  constructor(config) {
    this.key = config.storage.settings;
    this.data = { fontSize: "m", language: config.defaultLanguage, termMode: "twice", sound: "mid", ...Store.get(this.key, {}) };
  }
  set(k, v) {
    this.data[k] = v;
    Store.set(this.key, this.data);
    this.apply();
  }
  apply() {
    const f = FONT_SIZES.find((x) => x.id === this.data.fontSize) ?? FONT_SIZES[1];
    document.documentElement.style.setProperty("--fs", `${f.px}px`);
  }
}

// 진행 중인 생 저장/불러오기. "다음에 볼 장면"까지 함께 저장해서
// 결과를 본 뒤 껐다 켜도 선택을 다시 할 수 없게 한다.


class SaveManager {
  constructor(config) {
    this.config = config;
    this.key = config.storage.save;
  }
  has() {
    return !!Store.get(this.key);
  }
  save(state, eventId) {
    Store.set(this.key, {
      eventId,
      state: {
        stats: state.stats,
        items: state.items,
        flags: [...state.flags],
        bonds: state.bonds,
        reputation: state.reputation,
        affiliation: state.affiliation,
        situation: state.situation ?? null,
        path: state.path ?? null,
        ending: state.ending ?? null,
        seen: [...state.seen],
        outcomesSeen: state.outcomesSeen,
        achievements: state.achievements,
        scenes: state.scenes,
        stagnant: state.stagnant ?? 0,
        lastEventId: state.lastEventId,
        recent: state.recent,
        termCounts: state.termCounts,
        rare: state.rare,
        log: state.log,
      },
    });
  }
  // 메인 화면용: 저장된 생이 몇 장의 어느 장면에 멈춰 있는지
  peek() {
    const raw = Store.get(this.key);
    return raw ? { chapter: (raw.state?.scenes ?? 0) + 1, eventId: raw.eventId } : null;
  }
  load() {
    const raw = Store.get(this.key);
    if (!raw) return null;
    const s = new GameState(this.config);
    Object.assign(s, raw.state, { flags: new Set(raw.state.flags), seen: new Set(raw.state.seen) });
    return { state: s, eventId: raw.eventId };
  }
  clear() {
    Store.remove(this.key);
  }
}

// 효과음: 소리 파일 없이 브라우저에서 합성한다(Web Audio).
// 쪽 넘김(묵은 한지), 경지 상승(풍경), 기연·드문 인과(편경 도·레·솔), 죽음(멎는 심장), 귀결(징).
const SOUND_LEVELS = [
  { id: "off", gain: 0 },
  { id: "low", gain: 0.4 },
  { id: "mid", gain: 0.7 },
  { id: "high", gain: 1 },
];

class SoundBank {
  constructor() {
    this.ctx = null;
    this.volume = 0.7;
  }

  setLevel(id) {
    this.volume = (SOUND_LEVELS.find((x) => x.id === id) ?? SOUND_LEVELS[2]).gain;
    if (this.master) this.master.gain.value = this.volume;
  }

  // 자리 이름: realm / fortune / death / ending
  play(cue) {
    if (!this.volume || !this[cue]) return;
    try {
      this.init();
      if (this.ctx.state === "suspended") this.ctx.resume();
      this[cue](this.ctx.currentTime + 0.03);
    } catch {
      // 소리를 낼 수 없는 환경이면 조용히 넘어간다
    }
  }

  init() {
    if (this.ctx) return;
    const ctx = (this.ctx = new (window.AudioContext || window.webkitAudioContext)());
    this.master = ctx.createGain();
    this.master.gain.value = this.volume;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    this.master.connect(comp).connect(ctx.destination);
    // 절간 같은 울림: 지수로 줄어드는 잡음으로 만든 잔향
    this.verb = ctx.createConvolver();
    this.verb.buffer = this.impulse(2.5, 2.8);
    const wet = ctx.createGain();
    wet.gain.value = 0.45;
    this.verb.connect(wet).connect(this.master);
    // 묵직한 타격음용: 살짝 뭉개고 높은 쪽을 깎는다
    this.sat = ctx.createWaveShaper();
    const c = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) c[i] = Math.tanh(2.2 * (i / 511.5 - 1)) / Math.tanh(2.2);
    this.sat.curve = c;
    this.satLp = ctx.createBiquadFilter();
    this.satLp.type = "lowpass";
    this.satLp.frequency.value = 900;
    this.sat.connect(this.satLp);
  }

  impulse(sec, decay) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  // 마른 소리(dry)와 잔향(wet)을 섞어 내보내는 입구
  out(dry, wet) {
    const g = this.ctx.createGain(), d = this.ctx.createGain(), w = this.ctx.createGain();
    d.gain.value = dry;
    w.gain.value = wet;
    g.connect(d).connect(this.master);
    g.connect(w).connect(this.verb);
    return g;
  }

  lowpass(freq, dest) {
    const f = this.ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = freq;
    f.connect(dest);
    return f;
  }

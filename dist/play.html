<style>

:root {

  --gold: #e8c26e;
  --f-display: "Song Myung", "Nanum Myeongjo", serif;

  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--paper); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.85; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ink); border-bottom: 1px solid var(--line); padding-block: 12px 10px; display: grid; gap: 10px; }

.stat { display: grid; gap: 0; text-align: center; padding-block: 4px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.stat b { font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }

#items li { border: 1px solid var(--line); border-radius: 2px; padding: 1px 8px; color: var(--paper); }

#stage { display: grid; gap: 28px; padding-top: 28px; }
.scene h2, .ending h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0 0 14px; letter-spacing: 0.04em; text-wrap: balance; }
.prose p { margin: 0 0 1.1em; }

.c-red { color: var(--red); } .c-violet { color: var(--violet); } .c-jade { color: var(--jade); } .c-gold { color: var(--gold); }

.choices { display: grid; gap: 8px; margin-top: 6px; }

.choice:disabled { cursor: default; }
.choice.picked { border-color: var(--accent); }
.choice.dim { opacity: 0.32; }

.outcome { border-left: 1px solid var(--line); padding-left: 16px; }
.changes { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-ui); font-size: 14px; }

.next { font-family: var(--f-ui); font-size: 15px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 8px 22px; letter-spacing: 0.1em; }

.ach { font-family: var(--f-ui); font-size: 14px; color: var(--gold); }
#loading { color: var(--muted); font-family: var(--f-ui); }

@media (max-width: 480px) {

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

// 시드 가능한 난수. 같은 시드면 같은 결과가 나와서 버그 재현이 쉽다.
class Rng {
  constructor(seed = Date.now()) {
    this.s = seed >>> 0;
  }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  percent() {
    return this.next() * 100;
  }
  pickWeighted(list, weightOf) {
    const total = list.reduce((s, x) => s + weightOf(x), 0);
    let r = this.next() * total;
    for (const x of list) {
      r -= weightOf(x);
      if (r < 0) return x;
    }
    return list[list.length - 1];
  }
}

    this.bonds = {};

    this.seen = new Set();
    this.outcomesSeen = [];
    this.achievements = [];
    this.scenes = 0;
    this.dead = false;
  }
  stat(name) {
    return this.stats[name] ?? 0;
  }
  hasItem(name) {
    return this.items.includes(name);
  }
  addItem(name) {
    this.items.push(name);
  }
  removeItem(name) {
    const i = this.items.indexOf(name);
    if (i >= 0) this.items.splice(i, 1);
  }
}

  }
  async load() {
    if (window.EVENT_DATA) return this.merge(window.EVENT_DATA);
    const base = this.indexPath.slice(0, this.indexPath.lastIndexOf("/") + 1);
    const index = await (await fetch(this.indexPath)).json();
    const batches = await Promise.all(index.batches.map(async (f) => (await fetch(base + f)).json()));
    return this.merge(batches);
  }
  merge(batches) {
    const byId = new Map();
    for (const b of batches) for (const ev of b.events) byId.set(ev.id, ev);
    return byId;
  }
}

// 조건 판정과 다음 장면 고르기.
function meetsCondition(state, cond = {}) {
  if (cond.items && !cond.items.every((i) => state.hasItem(i))) return false;
  if (cond.flags && !cond.flags.every((f) => state.flags.has(f))) return false;
  if (cond.flags_any && !cond.flags_any.some((f) => state.flags.has(f))) return false;
  if (cond.flags_none && cond.flags_none.some((f) => state.flags.has(f))) return false;
  if (cond.stat_min && !Object.entries(cond.stat_min).every(([k, v]) => state.stat(k) >= v)) return false;
  if (cond.realm_min != null && state.stat("경지") < cond.realm_min) return false;
  return true;
}

class EventSelector {
  constructor(eventsById, rng, config) {
    this.events = eventsById;
    this.rng = rng;
    this.config = config;
  }
  byId(id) {
    return this.events.get(id) ?? null;
  }
  next(state) {
    const pool = [...this.events.values()].filter(
      (ev) => ev.pool !== "chain" && !state.seen.has(ev.id) && meetsCondition(state, ev.conditions)
    );
    if (!pool.length) return null;
    return this.rng.pickWeighted(pool, (ev) => ev.weight ?? this.config.defaultWeight);
  }
  availableChoices(ev, state) {
    return ev.choices.filter((c) => meetsCondition(state, c.condition));
  }
}

// 선택 결과 판정(확률 + 스탯 보정)과 효과 적용.
class ResultResolver {
  constructor(rng, config) {
    this.rng = rng;
    this.config = config;
  }

  chanceOf(outcome, state) {
    let c = outcome.chance;
    for (const [stat, per] of Object.entries(outcome.mods ?? {})) c += per * state.stat(stat);
    return Math.min(this.config.chanceMax, Math.max(this.config.chanceMin, c));
  }

  // chance가 있는 결과들을 차례로 쌓고, 남은 확률은 chance 없는 결과가 가져간다.
  pick(choice, state) {
    const r = this.rng.percent();
    let acc = 0;
    let fallback = null;
    for (const o of choice.outcomes) {
      if (o.chance == null) {
        fallback = fallback ?? o;
        continue;
      }
      acc += this.chanceOf(o, state);
      if (r < acc) return o;
    }
    return fallback ?? choice.outcomes[choice.outcomes.length - 1];
  }

  // 효과를 적용하고, 화면에 보여줄 변화 목록을 돌려준다.
  apply(outcome, state) {
    const changes = [];
    const e = outcome.effects ?? {};
    for (const [k, v] of Object.entries(e)) {
      if (k === "death") state.dead = !!v;
      else if (k === "items") v.forEach((i) => { state.addItem(i); changes.push({ text: `${nice(i)} 획득`, good: true }); });
      else if (k === "items_remove") v.forEach((i) => { state.removeItem(i); changes.push({ text: `${nice(i)} 잃음`, good: false }); });
      else if (k === "items_clear") { if (state.items.length) changes.push({ text: "소지품 전부 잃음", good: false }); state.items = []; }
      else if (k === "flags") v.forEach((f) => state.flags.add(f));
      else if (k === "flags_remove") v.forEach((f) => state.flags.delete(f));
      else if (k === "achievement") state.achievements.push(v);
      else if (k === "next_event") continue;
      else if (k === "realm_set") { state.stats.경지 = v; changes.push({ text: `경지 · ${this.config.realmNames[v]}`, good: true }); }
      else if (k.endsWith("_set")) { const s = k.slice(0, -4); state.stats[s] = v; changes.push({ text: `${s} ${v}`, good: false }); }
      else if (k === "소속") state.affiliation = v;
      else if (k === "인연") addAll(state.bonds, v);
      else if (k === "평판") addAll(state.reputation, v);
      else if (typeof v === "number") {
        state.stats[k] = state.stat(k) + v;
        changes.push({ text: `${k} ${v > 0 ? "+" : ""}${v}`, good: v > 0 });
      }
    }
    if (state.stat("체력") <= 0) state.dead = true;
    return changes;
  }
}

function addAll(target, deltas) {
  for (const [k, d] of Object.entries(deltas)) target[k] = (target[k] ?? 0) + d;
}

function nice(id) {
  return id.replaceAll("_", " ");
}

// 회차(몇 번째 생)와 업(業) 기록. 브라우저에 저장하되, 저장이 막혀도 게임은 돌아간다.
class LifeRecord {
  constructor(config) {
    this.config = config;
    this.data = { life: 0, karma: 0, outcomes: [], achievements: [] };
    try {
      const raw = localStorage.getItem(config.storageKey);
      if (raw) this.data = { ...this.data, ...JSON.parse(raw) };
    } catch (_) {}
  }
  save() {
    try {
      localStorage.setItem(this.config.storageKey, JSON.stringify(this.data));
    } catch (_) {}
  }
  startLife() {
    this.data.life += 1;
    this.save();
    return this.data.life;
  }
  // 한 생이 끝날 때 업을 계산해 쌓는다.
  endLife(state) {
    const k = this.config.karma;
    const known = new Set(this.data.outcomes);
    const fresh = [...new Set(state.outcomesSeen)].filter((o) => !known.has(o));
    const newAch = [...new Set(state.achievements)].filter((a) => !this.data.achievements.includes(a));
    const parts = [
      { label: "걸어온 길", value: state.scenes * k.perScene },
      { label: "처음 겪은 인과", value: fresh.length * k.perNewOutcome },
      { label: "도달한 경지", value: state.stat("경지") * k.perRealm },
      { label: "새로 새긴 인과록", value: newAch.length * k.perAchievement },
    ];
    const total = parts.reduce((s, p) => s + p.value, 0);
    this.data.outcomes.push(...fresh);
    this.data.achievements.push(...newAch);
    this.data.karma += total;
    this.save();
    return { parts, total, newAch };
  }
}

// 본문 표기 규칙을 HTML로 바꾼다. **굵게**, <빨강>…</빨강> 등 색 태그.
const COLORS = { 빨강: "c-red", 보라: "c-violet", 초록: "c-jade", 금색: "c-gold" };

function lineToHtml(line) {
  let s = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  for (const [tag, cls] of Object.entries(COLORS)) {
    s = s.replaceAll(`&lt;${tag}&gt;`, `<span class="${cls}">`).replaceAll(`&lt;/${tag}&gt;`, "</span>");
  }
  return s;
}

// 빈 줄을 기준으로 문단을 나눈다.
function linesToHtml(lines) {
  const paras = [[]];
  for (const l of lines) l === "" ? paras.push([]) : paras[paras.length - 1].push(lineToHtml(l));
  return paras.filter((p) => p.length).map((p) => `<p>${p.join("<br>")}</p>`).join("");
}

// 화면 그리기 전담. 게임 규칙은 모른다.


class GameView {
  constructor(root, config) {
    this.config = config;
    this.$ = (sel) => root.querySelector(sel);
    this.stage = this.$("#stage");
  }

  header(life, karma) {
    this.$("#life").textContent = `제 ${life} 생`;
    this.$("#karma").textContent = `업 ${karma}`;
  }

  stats(state) {
    const realm = this.config.realmNames[state.stat("경지")] ?? "?";
    const rows = [`<div class="stat realm"><span>경지</span><b>${realm}</b></div>`];
    for (const s of this.config.shownStats) rows.push(`<div class="stat"><span>${s}</span><b>${state.stat(s)}</b></div>`);
    this.$("#stats").innerHTML = rows.join("");
    this.$("#items").innerHTML = state.items.length
      ? state.items.map((i) => `<li>${nice(i)}</li>`).join("")
      : `<li class="none">빈손</li>`;
  }

  clear() {
    this.stage.innerHTML = "";
  }

  scene(ev, choices, onPick) {
    const sec = el("section", "scene");
    sec.innerHTML = `<h2>${ev.title}</h2><div class="prose">${linesToHtml(ev.description)}</div>`;
    const list = el("div", "choices");
    choices.forEach((c) => {
      const b = el("button", "choice" + (c.condition ? " earned" : ""));
      b.type = "button";
      b.innerHTML = `<span class="tag">[${c.tag}]</span><span>${c.text}</span>`;
      b.addEventListener("click", () => {
        list.querySelectorAll("button").forEach((x) => (x.disabled = true));
        b.classList.add("picked");
        list.querySelectorAll("button:not(.picked)").forEach((x) => x.classList.add("dim"));
        onPick(c);
      });
      list.append(b);
    });
    sec.append(list);
    this.stage.append(sec);
    list.querySelector("button")?.focus({ preventScroll: true });
    sec.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  outcome(outcome, changes, buttonText, onNext) {
    const sec = el("section", "outcome");
    sec.innerHTML = `<div class="prose">${linesToHtml(outcome.text)}</div>`;
    if (changes.length) {
      sec.innerHTML += `<ul class="changes">${changes.map((c) => `<li class="${c.good ? "up" : "down"}">${c.text}</li>`).join("")}</ul>`;
    }
    sec.append(this.button(buttonText, onNext));
    this.stage.append(sec);
    sec.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  ending(kind, summary, onRestart) {
    const sec = el("section", "ending " + kind);
    const head = kind === "death" ? "이번 생은 여기서 끝났다." : "길이 여기서 끊겨 있다.";
    const sub = kind === "death" ? "" : `<p class="note">시험판에 들어 있는 장면을 모두 지나왔다.</p>`;
    sec.innerHTML = `<h2>${head}</h2>${sub}
      <dl class="karma">${summary.parts.map((p) => `<div><dt>${p.label}</dt><dd>+${p.value}</dd></div>`).join("")}
      <div class="total"><dt>얻은 업</dt><dd>+${summary.total}</dd></div></dl>
      ${summary.newAch.length ? `<p class="ach">인과록에 새겨짐 · ${summary.newAch.map(nice).join(", ")}</p>` : ""}`;
    sec.append(this.button("다음 생으로", onRestart));
    this.stage.append(sec);
    sec.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  button(text, onClick) {
    const b = el("button", "next");
    b.type = "button";
    b.textContent = text;
    b.addEventListener("click", () => { b.disabled = true; onClick(); }, { once: true });
    setTimeout(() => b.focus({ preventScroll: true }), 0);
    return b;
  }
}

function el(tag, cls) {
  const e = document.createElement(tag);
  e.className = cls;
  return e;
}

// 게임 흐름: 생 시작 → 장면 → 선택 → 결과 → (연결 장면 or 다음 장면) → 죽음/끝 → 다음 생.








class Game {
  constructor(events) {
    this.rng = new Rng();
    this.selector = new EventSelector(events, this.rng, CONFIG);
    this.resolver = new ResultResolver(this.rng, CONFIG);
    this.record = new LifeRecord(CONFIG);
    this.view = new GameView(document, CONFIG);
  }

  startLife() {
    this.state = new GameState(CONFIG);
    const life = this.record.startLife();
    this.view.header(life, this.record.data.karma);
    this.view.stats(this.state);
    this.view.clear();
    this.play(this.selector.next(this.state));
  }

  play(ev) {
    if (!ev) return this.finish("end");
    const s = this.state;
    s.seen.add(ev.id);
    s.scenes += 1;
    this.view.scene(ev, this.selector.availableChoices(ev, s), (choice) => {
      const outcome = this.resolver.pick(choice, s);
      s.outcomesSeen.push(`${ev.id}:${choice.id}:${choice.outcomes.indexOf(outcome)}`);
      const changes = this.resolver.apply(outcome, s);
      this.view.stats(s);
      const nextId = outcome.effects?.next_event;
      if (s.dead) return this.view.outcome(outcome, changes, "눈을 감는다", () => this.finish("death"));
      this.view.outcome(outcome, changes, "계속", () =>
        this.play(nextId ? this.selector.byId(nextId) : this.selector.next(s))
      );
    });
  }

  finish(kind) {
    const summary = this.record.endLife(this.state);
    this.view.header(this.record.data.life, this.record.data.karma);
    this.view.ending(kind, summary, () => this.startLife());
  }
}

new EventLoader(CONFIG.eventIndex).load().then((events) => new Game(events).startLife());

})();
</script>

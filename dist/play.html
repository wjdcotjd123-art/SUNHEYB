<style>
/* 한밤 산중의 먹빛 한 장. 좁은 세로 두루마리 한 줄, 위에는 생(生)과 업, 그 아래 몸 상태, 본문은 장면이 쌓이며 흘러내린다. */
:root {
  --ink: #12151b;
  --ink-2: #1a1e26;
  --line: #2c3240;
  --paper: #eee9dd;
  --muted: #aaa69b;
  --accent: #c8a35a;
  --red: #e0675c;
  --violet: #b58ee0;
  --jade: #72c29d;
  --gold: #e8c26e;
  --f-display: "Song Myung", "Noto Serif KR", serif;
  --f-body: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --log-h: 132px;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--paper); }
body { font-family: var(--f-body); font-weight: 500; font-size: var(--fs, 17px); line-height: 1.85; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--log-h) + 48px); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ink); border-bottom: 1px solid var(--line); padding-block: 12px 10px; display: grid; gap: 10px; }
.bar { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-ui); }
#life { font-family: var(--f-display); font-size: 22px; color: var(--accent); letter-spacing: 0.06em; }
.bar-r { display: flex; gap: 14px; align-items: baseline; }
#toMenu { font-family: var(--f-ui); font-size: 12px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 2px 10px; }
#toMenu:hover, #toMenu:focus-visible { color: var(--paper); border-color: var(--muted); outline: none; }
#karma { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
#stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); }
.stat { display: grid; gap: 0; text-align: center; padding-block: 4px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.stat b { font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat.realm b { color: var(--accent); }
#items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-ui); font-size: 12px; }
#items li { border: 1px solid var(--line); border-radius: 2px; padding: 1px 8px; color: var(--paper); }
#items li.none { color: var(--muted); border-style: dashed; }

#stage { display: grid; gap: 28px; padding-top: 28px; }
.scene h2, .ending h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0 0 14px; letter-spacing: 0.04em; text-wrap: balance; }
.prose p { margin: 0 0 1.1em; }
.prose strong { font-weight: 700; color: #f1ecdf; }
.term { border-bottom: 1px dotted currentColor; text-underline-offset: 3px; cursor: help; }
.term:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.gloss { position: fixed; z-index: 10; max-width: min(300px, calc(100vw - 24px)); background: #262b36; border: 1px solid var(--accent); border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px; font-family: var(--f-ui); font-size: 14px; line-height: 1.6; color: var(--paper); box-shadow: 0 6px 20px rgba(0,0,0,0.45); pointer-events: none; }
.gloss b { color: var(--accent); font-weight: 500; }
.c-red { color: var(--red); } .c-purple { color: var(--violet); } .c-green { color: var(--jade); } .c-gold { color: var(--gold); }

.choices { display: grid; gap: 8px; margin-top: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.choice { display: flex; gap: 10px; align-items: baseline; text-align: left; width: 100%; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 11px 14px; font-family: var(--f-ui); font-size: 16px; line-height: 1.5; transition: border-color .15s, background .15s, opacity .2s; }
.choice .num { color: var(--muted); font-size: 13px; min-width: 1em; font-variant-numeric: tabular-nums; }
.choice .tag { color: var(--accent); white-space: nowrap; font-weight: 500; }
.choice .txt { min-width: 0; }
.fortune-banner { margin: 0 0 10px; font-family: var(--f-display); font-size: 17px; letter-spacing: 0.2em; color: var(--gold); text-shadow: 0 0 14px rgba(232,194,110,0.55); animation: fortuneIn 1.2s ease-out 1; }
.fortune-banner .hanja { color: var(--gold); opacity: 0.75; }
@keyframes fortuneIn { from { opacity: 0; letter-spacing: 0.6em; } to { opacity: 1; letter-spacing: 0.2em; } }
.rare-banner { margin: 0 0 18px; padding: 10px 14px; font-family: var(--f-display); font-size: 20px; letter-spacing: 0.14em; color: var(--ink); background: linear-gradient(90deg, #b8913f, var(--gold), #f6dd9a, var(--gold), #b8913f); background-size: 200% 100%; border-radius: 3px; text-align: center; animation: rareSweep 1.6s ease-out 1, rarePulse 2.6s ease-in-out 1.6s infinite; box-shadow: 0 0 30px rgba(232,194,110,0.35); }
@keyframes rareSweep { from { background-position: 100% 0; transform: scale(0.96); opacity: 0; } to { background-position: 0 0; transform: scale(1); opacity: 1; } }
@keyframes rarePulse { 0%, 100% { box-shadow: 0 0 22px rgba(232,194,110,0.25); } 50% { box-shadow: 0 0 40px rgba(232,194,110,0.5); } }
.outcome.rare .prose strong { color: #fff4d6; }
.karma .part-rare dt, .karma .part-rare dd { color: var(--gold); }
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--accent); background: #20252f; outline: none; }
.choice:disabled { cursor: default; }
.choice.warn { background: rgba(224, 103, 92, 0.12); border-color: rgba(224, 103, 92, 0.45); opacity: 0.8; flex-wrap: wrap; }
.choice.warn .tag { color: var(--red); }
.choice.warn .warn-label { margin-left: auto; font-size: 11px; letter-spacing: 0.08em; color: var(--red); border: 1px solid rgba(224, 103, 92, 0.6); border-radius: 2px; padding: 0 6px; align-self: center; }
.choice.warn:hover:not(:disabled), .choice.warn:focus-visible { border-color: var(--red); background: rgba(224, 103, 92, 0.2); opacity: 1; }
.intro { padding-top: 12vh; }
.intro .prose { font-size: 1.05em; }
.choice.picked { border-color: var(--accent); background: #262b35; box-shadow: inset 0 0 0 1px var(--accent); }
.choice.picked .num { color: var(--accent); }
.choice.dim { opacity: 0.45; }
.scene > .next { margin-top: 14px; }

.outcome h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.3; margin: 0 0 6px; letter-spacing: 0.04em; color: var(--muted); }
.chosen { margin: 0 0 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-family: var(--f-ui); font-size: 15px; color: var(--muted); }
.chosen .tag { color: var(--accent); }
.next kbd { font-family: var(--f-ui); font-size: 11px; margin-left: 10px; opacity: 0.7; letter-spacing: 0; }

.logbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--ink-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.logbox .in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.logbox h3 { margin: 0 0 4px; font-family: var(--f-ui); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; }
#log { list-style: none; margin: 0; padding: 0; max-height: calc(var(--log-h) - 30px); overflow-y: auto; font-family: var(--f-ui); font-size: 13px; line-height: 1.7; }
#log li { display: flex; flex-wrap: wrap; gap: 2px 8px; }
#log li:first-child { color: var(--paper); }
#log li:not(:first-child) { opacity: 0.7; }
#log .t { color: var(--paper); }
#log .g { color: var(--accent); }
#log .up { color: var(--jade); } #log .down { color: var(--red); }
#log li.empty { color: var(--muted); opacity: 1; }
.changes { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-ui); font-size: 14px; }
.changes .up { color: var(--jade); } .changes .down { color: var(--red); }
.next { font-family: var(--f-ui); font-size: 15px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 8px 22px; letter-spacing: 0.1em; }
.next:hover:not(:disabled), .next:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
.next:disabled { opacity: 0.35; cursor: default; }

.ending { border-top: 1px solid var(--line); padding-top: 22px; }
.ending.death h2 { color: var(--red); }
.ending .note { color: var(--muted); font-size: 15px; }
.karma { font-family: var(--f-ui); margin: 0 0 16px; display: grid; gap: 4px; max-width: 320px; }
.karma div { display: flex; justify-content: space-between; }
.karma dt { color: var(--muted); } .karma dd { margin: 0; font-variant-numeric: tabular-nums; }
.karma .total { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.karma .total dt, .karma .total dd { color: var(--accent); }
.ach { font-family: var(--f-ui); font-size: 14px; color: var(--gold); }
#loading { color: var(--muted); font-family: var(--f-ui); }

/* 메인·하위 화면 */
#screen { padding-block: 48px 64px; }
.mast { display: grid; gap: 6px; margin-bottom: 40px; }
.eyebrow { margin: 0; font-family: var(--f-ui); font-size: 12px; letter-spacing: 0.3em; color: var(--muted); }
.mast h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 72px; line-height: 1.1; letter-spacing: 0.12em; color: var(--paper); }
.sub { margin: 0; font-family: var(--f-ui); font-size: 14px; color: var(--muted); }
.sub b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
.menu-list { display: grid; gap: 2px; max-width: 360px; }
.menu-item { display: grid; grid-template-columns: 1.6em 1fr; align-items: baseline; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 14px 4px; font-family: var(--f-ui); }
.menu-item .num { color: var(--muted); font-size: 13px; }
.menu-item .lbl { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.08em; }
.menu-item .mnote { grid-column: 2; font-size: 12px; color: var(--muted); }
.menu-item:hover:not(:disabled) .lbl, .menu-item:focus-visible .lbl { color: var(--accent); }
.menu-item:focus-visible { outline: none; }
.menu-item:disabled { cursor: default; opacity: 0.4; }
.menu-item.armed .lbl, .menu-item.armed .mnote { color: var(--red); }
.hanja { font-family: var(--f-body); font-size: 0.62em; font-weight: 400; color: var(--muted); margin-left: 0.25em; letter-spacing: 0.06em; vertical-align: 0.12em; }
.back { font-family: var(--f-ui); font-size: 13px; background: none; border: none; color: var(--muted); padding: 0; margin-bottom: 24px; }
.back:hover, .back:focus-visible { color: var(--paper); outline: none; }
.back kbd, #toMenu kbd { font-family: var(--f-ui); font-size: 11px; margin-left: 10px; opacity: 0.7; }
.sub-screen h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0 0 8px; letter-spacing: 0.08em; }
.sub-screen .big { font-family: var(--f-display); font-size: 64px; color: var(--accent); margin: 8px 0 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
.shop-title { font-family: var(--f-ui); font-size: 13px; font-weight: 500; letter-spacing: 0.14em; color: var(--muted); margin: 32px 0 6px; }
.shop { list-style: none; margin: 0; padding: 0; display: grid; }
.shop-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.shop-info { display: grid; gap: 2px; min-width: 0; }
.shop-info b { font-weight: 500; }
.shop-info span { font-size: 13px; color: var(--muted); }
.shop-info .shop-lv { color: var(--accent); }
.shop-buy { flex: none; font-family: var(--f-ui); font-size: 14px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.shop-buy:hover:not(:disabled), .shop-buy:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
.shop-buy:disabled { opacity: 0.35; cursor: default; }
.sub-screen .empty { margin-top: 32px; padding: 18px; border: 1px dashed var(--line); border-radius: 3px; color: var(--muted); font-family: var(--f-ui); font-size: 15px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
.tab { font-family: var(--f-ui); font-size: 14px; background: none; border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.tab small { font-size: 11px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.tab:focus-visible { outline: 1px solid var(--accent); }
.ach-list .cond { font-size: 12px; color: var(--accent); opacity: 0.85; }
.ach-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 0; }
.ach-list li { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.ach-list b { font-weight: 500; color: var(--muted); }
.ach-list span { font-size: 13px; color: var(--muted); }
.ach-list li.on b { color: var(--gold); }
.ach-list li.on span { color: var(--paper); }
.set-row { display: grid; gap: 10px; padding: 20px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.set-lbl { font-size: 15px; }
.set-note { margin: 0; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn, .wipe { font-family: var(--f-ui); font-size: 14px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 14px; }
.seg-btn.on { border-color: var(--accent); color: var(--accent); }
.seg-btn:focus-visible, .wipe:focus-visible { outline: 1px solid var(--accent); }
.wipe { justify-self: start; color: var(--red); }
.wipe.armed { background: var(--red); color: var(--ink); border-color: var(--red); }
.wipe:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 480px) {
  .mast h1 { font-size: 56px; }
  #stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; animation: none !important; } }
</style>

 "입을 여는 순간,", "그 존재의 기운이 **<red>목구멍으로 쏟아져 들어왔다.<\/red>**", "", "놈은 이쪽을 보지도 않았다.", "**그저 지나갔을 뿐이다.**"], "P001.c3.tag": "응시", "P001.c3.text": "고개를 들어 놈을 똑바로 본다", "P001.c3.o0": ["고개를 드는 순간.", "", "**금빛 세로 눈동자**와 눈이 마주쳤다.", "", "눈알이 타들어 간다. 피눈물이 흐른다.", "살갗이 녹아내리는 게 느껴진다.", "", "그래도. **<gold>버텼다.<\/gold>**", "", "구름이 갈라졌다.", "놈이 **내려온다.**", "", "금빛 세로 눈동자가 바로 눈앞에 있다.", "", "\"…하계의 벌레가, 내 눈을 버텼다고?\"", "", "뿔 달린 자가 손가락으로 내 이마를 짚는다.", "**<gold>뜨거운 피 한 방울<\/gold>**이 이마에 스며든다.", "", "\"재미있군. 기억해 두마.\"", "", "놈이 사라진 뒤, 녹아내렸던 살갗이 **새로 돋아났다.**"], "P001.c3.o1": ["고개를 들었다.", "", "구름 사이, **금빛 세로 눈동자.**", "**눈이 마주쳤다.**", "", "찰나.", "", "**<red>눈부터 녹아내렸다.<\/red>**", "비명을 지를 틈도 없었다."], "P001.c4.tag": "이변", "P001.c4.text": "몸속에서 끓어오르는 힘을 그대로 드러낸다", "P001.c4.o0": ["숨을 들이켰다.", "몸 안의 무언가가 **<gold>폭발하듯 깨어났다.<\/gold>**", "", "짓누르던 기운을 **밀어냈다.**", "", "구름 위의 놈이 처음으로 **멈췄다.**", "", "\"…이런 몸이, 하계에?\"", "", "뿔 달린 자가 고개를 돌린다.", "웃는다. 아주 즐거운 듯이.", "", "\"**<gold>다음에 볼 때까지 살아남아라.<\/gold>**\"", "", "놈이 지나간 자리에서 **<gold>{검은 비늘} 하나<\/gold>**가 떨어져 내린다."], "D001.title": "낯선 열매", "D001.desc": ["배가 쓰리다.", "마지막으로 뭘 먹은 게 언제였는지 기억도 나지 않는다.", "", "그때, 덤불 사이로 무언가 보였다.", "**<red>핏빛처럼 붉은 열매<\/red>**.", "가지가 휘어질 만큼 주렁주렁 달려 있다.", "", "달큰한 향이 코끝을 찌른다.", "침이 고인다.", "", "**처음 보는 열매다.**"], "D001.c1.tag": "포식", "D001.c1.text": "먹는다", "D001.c1.o0": ["한 입. 또 한 입.", "달다. 미치도록 달다.", "", "혀끝이 저려온다.", "곧이어 목구멍이 타들어 간다.", "", "**<purple>독이다.<\/purple>**"], "D001.c1.o1": ["열매가 혀에 닿자마자 녹아내린다.", "뜨거운 기운이 배꼽 아래로 퍼진다.", "", "온몸의 뼈마디가 **우두둑** 소리를 낸다.", "", "**<gold>{영과}(靈果)였다.<\/gold>**"], "D001.c1.o2": ["한 입. 또 한 입.", "달다. 미치도록 달다.", "", "정신없이 먹고 나니 **배가 든든하다.**"], "D001.c2.tag": "시식", "D001.c2.text": "조금만 맛본다", "D001.c2.o0": ["혀끝이 살짝 저린다.", "급히 뱉어냈다.", "", "**<purple>독이 있었다.<\/purple>** 조금만 먹길 다행이다."], "D001.c2.o1": ["새콤하고 달다.", "몇 알 더 따서 먹었다.", "", "**허기가 조금 가셨다.**"], "D001.c3.tag": "인내", "D001.c3.text": "먹지 않는다", "D001.c3.o0": ["모르는 열매는 입에 대지 않는다.", "배를 움켜쥐고 걸음을 옮긴다."], "D001.c4.tag": "경험", "D001.c4.text": "짐승이 먹던 열매만 골라 먹는다", "D001.c4.o0": ["아까 산토끼가 먹던 그 열매다.", "짐승이 먹으면 사람도 먹는다.", "", "**안심하고 배를 채웠다.**"], "D002.title": "맑은 샘물", "D002.desc": ["목이 타들어 간다.", "입술이 갈라져 피 맛이 난다.", "", "졸졸.", "물소리다.", "", "바위틈에서 **맑은 샘물**이 솟고 있다.", "", "샘 주변에", "**<red>짐승 뼈가 흩어져 있다.<\/red>**"], "D002.c1.tag": "해갈", "D002.c1.text": "엎드려 마신다", "D002.c1.o0": ["정신없이 물을 들이켠다.", "", "등 뒤에서 낮은 그르렁 소리.", "돌아보니 **<red>누런 눈<\/red>**이 번뜩인다.", "", "샘은 놈의 영역이었다.", "죽어라 도망쳤다. 어깨가 찢겼다."], "D002.c1.o1": ["차갑다.", "물이 목을 타고 내려가며 온몸을 깨운다.", "", "**살 것 같다.**"], "D002.c2.tag": "경계", "D002.c2.text": "주변을 먼저 살핀다", "D002.c2.o0": ["뼈를 살피다 이상한 걸 깨달았다.", "짐승에게 뜯긴 흔적이 없다.", "", "샘 깊은 곳에서", "**<gold>희미한 기운<\/gold>**이 피어오른다.", "", "물을 마시자 머리가 맑아진다."], "D002.c2.o1": ["진흙에 커다란 발자국이 찍혀 있다.", "아직 마르지 않았다.", "", "**<red>맹수가 근처에 있다.<\/red>**", "물 몇 모금만 급히 떠 마시고 자리를 떴다."], "D002.c2.o2": ["별다른 흔적은 없다.", "오래된 뼈일 뿐이다.", "", "**천천히 목을 축였다.**"], "D002.c3.tag": "회피", "D002.c3.text": "불길하다. 떠난다", "D002.c3.o0": ["뼈가 마음에 걸린다.", "마른 침을 삼키며 발길을 돌렸다."], "D003.title": "덤불 속 산토끼", "D003.desc": ["부스럭.", "", "덤불이 흔들린다.", "숨을 죽이고 들여다본다.", "", "**산토끼 한 마리.**", "붉은 열매를 오물오물 씹고 있다.", "", "통통하다.", "잡으면 **한 끼는 된다.**"], "D003.c1.tag": "사냥", "D003.c1.text": "덮친다", "D003.c1.o0": ["몸을 날렸다.", "손끝에 따뜻한 털이 잡힌다.", "", "**<green>잡았다.<\/green>**", "", "날고기라도 배는 찬다."], "D003.c1.o1": ["몸을 날렸다.", "토끼는 이미 없다.", "", "**돌부리에 무릎이 깨졌다.**"], "D003.c2.tag": "관찰", "D003.c2.text": "가만히 지켜본다", "D003.c2.o0": ["토끼는 열매를 다 먹고 유유히 사라졌다.", "", "멀쩡하다.", "**저 열매는 먹어도 되는 모양이다.**"], "D003.c3.tag": "투척", "D003.c3.text": "돌을 던진다", "D003.c3.o0": ["딱.", "", "**<green>정통으로 맞혔다.<\/green>**", "토끼가 버둥거리다 축 늘어진다."], "D003.c3.o1": ["돌은 엉뚱한 곳에 떨어졌다.", "토끼는 순식간에 사라졌다."], "D004.title": "버려진 오두막", "D004.desc": ["해가 진다.", "숲이 금세 어두워진다.", "", "나무 사이로 **오두막** 하나가 보인다.", "지붕은 반쯤 무너졌다.", "문짝은 경첩 하나에 겨우 매달려 있다.", "", "사람 기척은 없다.", "**<red>안쪽에서 퀴퀴한 냄새가 난다.<\/red>**"], "D004.c1.tag": "수색", "D004.c1.text": "안을 뒤진다", "D004.c1.o0": ["구석의 거적을 들췄다.", "", "**<red>백골.<\/red>**", "", "비명을 삼켰다.", "뒷걸음치다 썩은 기둥에 부딪혔다.", "지붕이 무너져 내린다."], "D004.c1.o1": ["먼지 쌓인 궤짝을 열었다.", "", "**<green>낡은 삼베옷<\/green>**과 **<green>녹슨 손칼<\/green>**.", "", "이 세계 사람들이 입는 옷이다.", "지금 입은 옷보다는 **덜 눈에 띄겠지.**"], "D004.c2.tag": "휴식", "D004.c2.text": "들어가서 잠만 잔다", "D004.c2.o0": ["한밤중.", "문 밖에서 킁킁거리는 소리.", "", "**<red>늑대다.<\/red>**", "", "문짝을 몸으로 막고 밤을 새웠다.", "한숨도 못 잤다."], "D004.c2.o1": ["바람을 막아줄 벽이 있다는 게 이렇게 고마울 줄이야.", "", "**오랜만에 깊이 잠들었다.**"], "D004.c3.tag": "경계", "D004.c3.text": "들어가지 않는다", "D004.c3.o0": ["냄새가 영 꺼림칙하다.", "오두막 처마 밑에 웅크려 밤을 보냈다.", "", "춥다. 그래도 무사하다."], "D005.title": "얼어붙는 밤", "D005.desc": ["밤이 깊다.", "기온이 뚝 떨어졌다.", "", "이가 딱딱 부딪힌다.", "손끝 감각이 사라져 간다.", "", "**<red>이대로 자면 얼어 죽을지도 모른다.<\/red>**"], "D005.c1.tag": "불씨", "D005.c1.text": "나뭇가지를 비벼 불을 피운다", "D005.c1.o0": ["손바닥이 벗겨지도록 비볐다.", "", "연기. 그리고 작은 불씨.", "", "**<green>불이 붙었다.<\/green>**", "따뜻하다. 눈물이 날 만큼."], "D005.c1.o1": ["손바닥만 벗겨졌다.", "불은 끝내 붙지 않았다.", "", "**덜덜 떨며 밤을 지새웠다.**"], "D005.c2.tag": "인내", "D005.c2.text": "낙엽을 긁어모아 파묻힌다", "D005.c2.o0": ["새벽녘, 몸이 불덩이 같다.", "", "**<red>{고뿔}에 걸렸다.<\/red>**"], "D005.c2.o1": ["낙엽 냄새 속에서 겨우 잠들었다.", "", "**살아서 아침을 맞았다.**"], "D005.c3.tag": "강행", "D005.c3.text": "몸을 데우려 밤새 걷는다", "D005.c3.o0": ["어둠 속에서 발밑이 꺼졌다.", "", "**<red>낭떠러지였다.<\/red>**"], "D005.c3.o1": ["밤새 걸었다.", "다리가 후들거린다.", "", "그래도 **조금 단단해진 기분이다.**"], "D005.c4.tag": "라이터", "D005.c4.text": "주머니 속 라이터를 켠다", "D005.c4.o0": ["딸깍.", "", "**<gold>불꽃<\/gold>**이 피어오른다.", "", "지구에서 가져온 유일한 문명.", "모닥불 앞에서 처음으로 집 생각에 목이 멘다."], "D006.title": "약초꾼 노인", "D006.desc": ["산비탈에서 **노인 하나**가 땅을 파고 있다.", "", "등에는 커다란 약초 바구니.", "허리춤에는 두툼한 **보따리**.", "", "노인이 고개를 든다.", "주름진 얼굴이 내 옷차림을 훑는다.", "", "\"…자네, 이 근방 사람이 아니구먼.\""], "D006.c1.tag": "질문", "D006.c1.text": "마을로 가는 길을 묻는다", "D006.c1.o0": ["노인이 지팡이로 산 아래를 가리킨다.", "", "\"개울을 따라 반나절이면 **청하촌**일세.\"", "", "노인이 품에서 **주먹밥** 하나를 꺼내 건넨다.", "", "**<green>마을의 위치를 알았다.<\/green>**"], "D006.c2.tag": "노동", "D006.c2.text": "약초 캐는 일을 돕는다", "D006.c2.o0": ["해가 기울 때까지 흙을 팠다.", "허리가 끊어질 듯하다.", "", "노인이 작은 단지를 내민다.", "\"품삯일세. 다쳤을 때 바르게.\"", "", "**<green>{금창약}을 얻었다.<\/green>**"], "D006.c3.tag": "약탈", "D006.c3.text": "보따리를 낚아채 달아난다", "D006.c3.o0": ["보따리에 손이 닿는 순간.", "", "노인의 지팡이가 **보이지 않았다.**", "", "\"쯧. 젊은 놈이.\"", "", "**<red>시야가 뒤집힌다.<\/red>**"], "D006.c3.o1": ["보따리를 낚아채 내달렸다.", "등 뒤에서 노인의 욕설이 멀어진다.", "", "**<green>{동전} 한 꾸러미<\/green>**와 말린 약초가 들어 있다.", "", "가슴 한구석이 **찜찜하다.**"], "D006.c3.o2": ["달리다 발이 꼬였다.", "노인의 지팡이가 정수리를 내리쳤다.", "", "\"도둑놈의 새끼!\"", "", "**<red>머리가 깨졌다.<\/red>**"], "D007.title": "불어난 강", "D007.desc": ["길이 끊겼다.", "", "**흙탕물이 된 강**이 앞을 가로막았다.", "어젯밤 비에 물이 불었다.", "", "물살이 거칠다.", "건너편까지는 서른 걸음 남짓.", "", "물가 얕은 곳에 **물고기 그림자**가 어른거린다."], "D007.c1.tag": "도강", "D007.c1.text": "헤엄쳐 건넌다", "D007.c1.o0": ["강 한가운데서 다리에 쥐가 났다.", "", "흙탕물이 입과 코로 밀려든다.", "", "**<red>떠내려간다.<\/red>**"], "D007.c1.o1": ["물살에 휩쓸려 한참을 떠내려갔다.", "겨우 바위를 붙잡고 기어 나왔다.", "", "**<red>온몸이 멍투성이다.<\/red>**"], "D007.c1.o2": ["이를 악물고 팔을 저었다.", "", "**<green>건넜다.<\/green>**", "숨이 턱까지 찬다. 그래도 해냈다."], "D007.c2.tag": "사냥", "D007.c2.text": "맨손으로 물고기를 잡는다", "D007.c2.o0": ["물살을 노려보다 손을 내리꽂았다.", "", "미끈한 감촉.", "**<green>잡았다.<\/green>**"], "D007.c2.o1": ["한나절 내내 허탕만 쳤다.", "옷만 흠뻑 젖었다."], "D007.c3.tag": "우회", "D007.c3.text": "강을 따라 하류로 내려간다", "D007.c3.o0": ["물길을 따라 걷는다.", "", "멀리서 **밥 짓는 연기**가 피어오른다.", "", "**<green>사람 사는 곳이 가깝다.<\/green>**"], "D008.title": "쓰러진 무인", "D008.desc": ["비린내가 난다.", "", "숲길 한가운데.", "**<red>피투성이 사내<\/red>**가 나무에 기대 쓰러져 있다.", "", "허리에 찬 **검집**.", "찢긴 옷 사이로 드러난 단단한 몸.", "", "보통 사람이 아니다.", "**{무인}(武人)이다.**", "", "가슴이 미약하게 오르내린다.", "아직, 살아 있다."], "D008.c1.tag": "치료", "D008.c1.text": "상처를 치료해준다", "D008.c1.o0": ["옷을 찢어 상처를 동여맸다.", "", "한참 뒤.", "사내가 눈을 뜬다.", "", "\"…빚을 졌군.\"", "", "사내가 {동전} 한 꾸러미를 손에 쥐여준다.", "", "**<gold>{무인}과 인연이 생겼다.<\/gold>**"], "D008.c1.o1": ["피를 막느라 정신이 없던 그때.", "", "사방에서 **<red>검은 옷의 사내들<\/red>**이 걸어 나온다.", "", "\"같이 있던 놈이다. 함께 묻어라.\""], "D008.c2.tag": "약탈", "D008.c2.text": "품을 뒤진다", "D008.c2.o0": ["품에 손을 넣는 순간.", "", "**<red>손목이 붙잡혔다.<\/red>**", "", "핏발 선 눈이 이쪽을 노려본다.", "\"…쥐새끼가.\"", "", "검광이 번쩍였다."], "D008.c2.o1": ["묵직한 {전낭}. {은자} 한 냥에 {동전} 꾸러미가 셋.", "**<gold>낡은 책자<\/gold>** 한 권도.", "", "표지에 무언가 적혀 있다.", "읽을 수는 없지만, **범상치 않은 물건이다.**"], "D008.c3.tag": "외면", "D008.c3.text": "못 본 척 지나친다", "D008.c3.o0": ["엮이면 좋을 게 없다.", "걸음을 재촉했다.", "", "등 뒤로 **멀리서 칼 부딪치는 소리**가 들려왔다."], "D008.c4.tag": "금창약", "D008.c4.text": "{금창약}을 발라준다", "D008.c4.o0": ["{금창약}을 상처에 듬뿍 발랐다.", "피가 거짓말처럼 멎는다.", "", "사내가 눈을 뜬다.", "나를, 그리고 빈 약단지를 본다.", "", "\"귀한 걸 썼군.\"", "\"…내 제자가 될 텐가?\"", "", "**<gold>사부를 얻었다.<\/gold>**"], "D008.c5.tag": "기척", "D008.c5.text": "주변의 기척을 살핀다", "D008.c5.o0": ["숨을 고르고 귀를 기울인다.", "", "왼쪽 수풀. 오른쪽 나무 위.", "**<red>추격자 둘.<\/red>**", "", "놈들은 아직 이쪽을 눈치채지 못했다."], "D009.title": "산적의 길목", "D009.desc": ["고갯마루.", "", "바위 뒤에서 사내들이 우르르 쏟아져 나온다.", "녹슨 칼. 몽둥이. 누런 이.", "", "\"어이, 거기.\"", "\"**<red>가진 거 다 내놓고 가라.<\/red>**\"", "", "다섯. 아니, 여섯.", "뒤쪽 길도 막혔다."], "D009.c1.tag": "굴복", "D009.c1.text": "가진 돈을 다 내준다", "D009.c1.o0": ["주머니를 탈탈 털어 내밀었다.", "", "\"쳇, 거지새끼였네.\"", "", "발길질 몇 번.", "**목숨은 건졌다.**"], "D009.c2.tag": "도주", "D009.c2.text": "도망친다", "D009.c2.o0": ["몸을 돌려 비탈로 뛰어내렸다.", "가시덤불이 살을 찢는다.", "", "욕설이 멀어진다.", "", "**<green>따돌렸다.<\/green>**"], "D009.c2.o1": ["세 걸음.", "", "뒤통수에 몽둥이가 꽂혔다.", "", "**<red>눈앞이 캄캄해진다.<\/red>**"], "D009.c3.tag": "입산", "D009.c3.text": "{산채}에 들어가겠다고 한다", "D009.c3.o0": ["두목이 피식 웃는다.", "", "\"배짱은 있네.\"", "", "부하 하나가 등을 걷어차 무릎을 꿇린다.", "\"좋아. 대신 **<red>값을 치러야지.<\/red>**\"", "", "부하들이 묶인 행인 하나를 끌고 온다.", "칼 한 자루가 발치에 떨어진다."], "D009.c3.o1": ["\"너 같은 비리비리한 놈은 필요 없어.\"", "", "**<red>칼날이 목을 그었다.<\/red>**"], "D009.c4.tag": "저항", "D009.c4.text": "녹슨 손칼을 겨눈다", "D009.c4.o0": ["앞장선 놈의 팔뚝을 그었다.", "", "\"이 미친놈이…!\"", "", "놈들이 멈칫한 틈에 내달렸다.", "**<green>살았다.<\/green>**"], "D009.c4.o1": ["손칼을 쥔 손이 덜덜 떨린다.", "", "\"오, 무섭네?\"", "", "웃음소리.", "**<red>그리고 여섯 개의 칼날.<\/red>**"], "D010.title": "관병의 수색", "D010.desc": ["말발굽 소리.", "", "창을 든 **{관병}들**이 길을 막고 행인들을 검문하고 있다.", "", "벽에 **수배 그림**이 붙어 있다.", "글은 못 읽어도 그림은 알아본다.", "", "그림 속 사내가 입은 옷.", "후드티에 청바지, 운동화.", "", "**<red>지금 내 옷차림 그대로다.<\/red>**", "", "관병들이 찾는 사람은,", "**<red>나다.<\/red>**"], "D010.c1.tag": "순응", "D010.c1.text": "순순히 다가간다", "D010.c1.o0": ["{관병} 대장이 나를 위아래로 훑는다.", "", "\"…찾았다. 정중히 모셔라.\"", "", "포박은 없다.", "대신 **<gold>황궁의 문양<\/gold>**이 새겨진 마차가 다가온다.", "", "마차 안에서, 처음으로 **배불리 먹었다.**"], "D010.c1.o1": ["\"이놈이 그 **간자**다!\"", "", "변명할 틈도 없었다.", "", "**<red>목에 칼이 떨어졌다.<\/red>**"], "D010.c2.tag": "도주", "D010.c2.text": "숲으로 숨는다", "D010.c2.o0": ["\"저기다! 잡아라!\"", "", "화살이 허벅지를 꿰뚫었다.", "", "**<red>끌려간다.<\/red>**"], "D010.c2.o1": ["덤불 속에 엎드려 숨을 죽였다.", "", "말발굽 소리가 멀어진다.", "", "**살았다.** 이제 **<red>쫓기는 몸이다.<\/red>**"], "D010.c3.tag": "위장", "D010.c3.text": "삼베옷으로 갈아입고 백성인 척한다", "D010.c3.o0": ["낡은 삼베옷에 고개를 푹 숙였다.", "", "{관병}이 힐끗 보더니 턱짓한다.", "\"지나가.\"", "", "**<green>무사히 빠져나왔다.<\/green>**"], "D010.c3.o1": ["\"잠깐.\"", "", "{관병}이 내 신발을 내려다본다.", "**<red>운동화.<\/red>**", "", "\"…이놈 잡아!\"", "", "창대가 옆구리를 후려친다."], "D008_추격자.title": "수풀 속의 칼", "D008_추격자.desc": ["숨을 죽인다.", "", "왼쪽 수풀에 하나.", "오른쪽 나무 위에 하나.", "**<red>검은 옷의 추격자들.<\/red>**", "", "나무 위의 놈은 **팔에 붕대**를 감고 있다.", "피가 배어 나온다. {무인}에게 당한 상처다.", "", "쓰러진 무인이 희미하게 신음한다.", "놈들이 고개를 돌리기까지,", "**얼마 남지 않았다.**"], "D008_추격자.c1.tag": "도주", "D008_추격자.c1.text": "{무인}을 업고 반대편으로 달린다", "D008_추격자.c1.o0": ["{무인}을 들쳐 업었다.", "생각보다 무겁다. 무릎이 꺾인다.", "", "그래도 달렸다.", "등 뒤의 기척이 점점 멀어진다.", "", "**<green>따돌렸다.<\/green>**", "", "등 위에서 무인이 중얼거린다.", "\"…미련한 놈.\""], "D008_추격자.c1.o1": ["열 걸음도 못 가 다리가 풀렸다.", "", "등 뒤에서 바람 가르는 소리.", "", "**<red>비수가 등에 박혔다.<\/red>**"], "D008_추격자.c2.tag": "밀고", "D008_추격자.c2.text": "추격자들에게 {무인}의 위치를 알린다", "D008_추격자.c2.o0": ["\"여, 여기 있습니다!\"", "", "검은 옷의 사내가 다가와 나를 내려다본다.", "피식 웃는다.", "", "\"눈치는 빠르군.\"", "", "**<green>{동전} 한 꾸러미<\/green>**가 발치에 떨어진다.", "등 뒤로 짧은 비명이 들렸다.", "", "**<purple>손에 더러운 무언가가 묻은 기분이다.<\/purple>**"], "D008_추격자.c2.o1": ["\"여, 여기 있습니다!\"", "", "\"그래. 수고했다.\"", "", "**<red>입막음은 확실하게.<\/red>**"], "D008_추격자.c3.tag": "기습", "D008_추격자.c3.text": "다친 놈부터 덮친다", "D008_추격자.c3.o0": ["나무에서 내려오는 순간을 노렸다.", "붕대 감은 팔을 그대로 걷어찼다.", "", "\"크악!\"", "", "그 틈에 {무인}이 눈을 떴다.", "검광 두 번.", "", "**<gold>추격자들이 쓰러졌다.<\/gold>**", "", "\"…쓸 만한 놈이군.\""], "D008_추격자.c3.o1": ["달려드는 발소리가 너무 컸다.", "", "놈이 성한 팔로 칼을 휘둘렀다.", "", "**<red>시야가 붉게 물든다.<\/red>**"], "D008_추격자.c4.tag": "손칼", "D008_추격자.c4.text": "녹슨 손칼을 던진다", "D008_추격자.c4.o0": ["손칼이 허공을 갈랐다.", "", "퍽.", "나무 위의 놈이 떨어진다.", "", "남은 하나가 당황한 사이,", "{무인}이 몸을 일으켜 마무리했다.", "", "**<gold>살았다. 둘 다.<\/gold>**"], "D008_추격자.c4.o1": ["손칼이 나무줄기에 박혔다.", "", "\"찾았다.\"", "", "**<red>두 개의 칼날이 동시에 날아든다.<\/red>**"], "D009_입산시험.title": "흑풍채의 값", "D009_입산시험.desc": ["발치에 떨어진 칼.", "", "그 앞에 무릎 꿇린 **젊은 사내**.", "입에 재갈이 물려 있다.", "", "사내의 눈은 겁에 질려 있지 않다.", "**이쪽을 똑바로 보고 있다.**", "", "손목의 밧줄이", "**<gold>조금 느슨하다.<\/gold>**", "", "두목이 턱짓한다.", "\"**<red>베어라. 그럼 오늘부터 {흑풍채} 식구다.<\/red>**\""], "D009_입산시험.c1.tag": "참수", "D009_입산시험.c1.text": "칼을 들어 벤다", "D009_입산시험.c1.o0": ["손이 떨린다.", "", "눈을 감고 내리쳤다.", "", "뜨뜻한 피가 얼굴에 튄다.", "", "두목이 어깨를 두드린다.", "\"잘했다, 막내.\"", "", "두목이 {동전} 몇 닢을 던져준다.", "", "**<purple>오늘, 처음으로 사람을 죽였다.<\/purple>**"], "D009_입산시험.c2.tag": "거부", "D009_입산시험.c2.text": "못 하겠다고 한다", "D009_입산시험.c2.o0": ["\"…못 합니다.\"", "", "정적.", "", "두목이 껄껄 웃는다.", "\"사람 못 죽이는 놈은 처음이네. 그래도 배짱은 있어.\"", "", "**<green>잡일꾼으로 {산채}에 남게 되었다.<\/green>**", "", "대신, **실컷 두들겨 맞았다.**"], "D009_입산시험.c2.o1": ["\"…못 합니다.\"", "", "\"그래? 그럼 **<red>네가 대신 묻혀라.<\/red>**\""], "D009_입산시험.c3.tag": "결박", "D009_입산시험.c3.text": "베는 척하며 밧줄을 끊는다", "D009_입산시험.c3.o0": ["칼을 내리치는 척, 밧줄을 그었다.", "", "그 순간.", "사내가 **<gold>튀어 올랐다.<\/gold>**", "", "맨손으로 산적 둘을 쓰러뜨리고,", "내 멱살을 잡아 끌고 숲으로 뛰어든다.", "", "\"정신 차리고 뛰어!\"", "", "**<gold>살았다.<\/gold>**", "", "사내가 숨을 고르며 말한다.", "\"{화산파} {삼대제자} **진우**다. 은혜는 갚지.\""], "D009_입산시험.c3.o1": ["밧줄을 긋는 순간,", "두목의 눈이 번뜩였다.", "", "\"이 새끼가?\"", "", "**<red>둘 다 죽여.<\/red>**"], "D009_입산시험.c4.tag": "역습", "D009_입산시험.c4.text": "칼을 들고 두목에게 달려든다", "D009_입산시험.c4.o0": ["아무도 예상하지 못했다.", "나 자신조차.", "", "칼날이 두목의 목에 박혔다.", "", "산적들이 얼어붙는다.", "", "**<gold>{흑풍채} 두목이 죽었다.<\/gold>**", "", "누군가 중얼거린다.", "\"…새 두목이다.\"", "", "{산채} 창고에 쌓인 {은자}가 이제 **내 차지다.**"], "D009_입산시험.c4.o1": ["두목은 웃으며 몸을 비틀었다.", "", "**<red>그게 마지막으로 본 광경이었다.<\/red>**"], "D010_황궁의_마차.title": "국사(國師)", "D010_황궁의_마차.desc": ["마차는 사흘을 달렸다.", "", "도착한 곳은 황궁이 아니었다.", "황궁 뒤편, **향 연기가 자욱한 {전각}**.", "", "백발의 노인이 앉아 있다.", "관복도, 갑옷도 아닌 **<gold>소매 넓은 {도포}<\/gold>**.", "", "노인이 눈을 뜬다.", "", "그 순간, 숨이 막혔다.", "**<red>눈빛만으로 온몸이 짓눌린다.<\/red>**", "\"…하늘에 금이 간 그 밤.\"", "\"산 하나가 통째로 패였다. 그 근처를 헤매던 놈이 너라더군.\"", "\"**무엇을 보았느냐.**\"", "", "노인의 눈은 사람을 보는 눈이 아니다.", "**사냥감 냄새를 맡은 짐승의 눈.**", "", "다른 세상에서 왔다고 하면.", "**<red>왠지, 그 순간 끝장이다.<\/red>**"], "D010_황궁의_마차.c1.tag": "진실", "D010_황궁의_마차.c1.text": "다른 세상에서 왔다고 털어놓는다", "D010_황궁의_마차.c1.o0": ["\"…다른 세상이라.\"", "", "노인이 한참 말이 없다.", "", "\"이 말, **<red>나 말고는 누구에게도 하지 마라.<\/red>**\"", "\"이 세상은 이방인을 살려두지 않는다. 나도 원래는 그렇고.\"", "", "옥으로 된 패 하나가 발치에 떨어진다.", "\"살아남거라. 언젠가 다시 부르마.\""], "D010_황궁의_마차.c1.o1": ["\"…다른 세상이라.\"", "", "노인의 입꼬리가 올라간다.", "\"이계의 것이 하계를 밟았단 말이지.\"", "", "\"**<red>그렇다면 살려둘 수 없지.<\/red>**\"", "", "{전각}의 문이 닫힌다."], "D010_황궁의_마차.c2.tag": "목격", "D010_황궁의_마차.c2.text": "하늘에서 빛이 떨어지는 걸 봤다고만 한다", "D010_황궁의_마차.c2.o0": ["\"…빛이라.\"", "", "노인이 눈을 감는다.", "\"그래. 그 밤 산에 있던 놈들은 다들 그렇게 말하더군.\"", "", "\"가거라. 본 것은 잊어라.\"", "", "{관병}이 {동전} 한 꾸러미를 쥐여주며 궁 밖까지 데려다준다."], "D010_황궁의_마차.c2.o1": ["\"…빛만?\"", "", "노인의 눈이 가늘어진다.", "\"**<red>무언가 숨기는구나.<\/red>**\"", "", "보이지 않는 손이 목을 조여 온다.", "\"생각이 날 때까지 가둬 둬라.\""], "D010_황궁의_마차.c2.o2": ["\"빛…이라.\"", "", "노인이 한참 나를 내려다본다.", "\"범인의 눈에는 그 정도겠지.\"", "", "풀려났다. 등줄기가 **땀에 흠뻑 젖었다.**"], "D010_황궁의_마차.c3.tag": "기만", "D010_황궁의_마차.c3.text": "기억을 잃었다고 둘러댄다", "D010_황궁의_마차.c3.o0": ["노인의 눈이 가늘어진다.", "", "\"**<red>내 앞에서 거짓을 말하는구나.<\/red>**\"", "", "보이지 않는 손이 목을 조여 온다.", "의식이 멀어지기 직전, 손이 풀렸다.", "", "\"…쓸모없군. 내다 버려라.\""], "D010_황궁의_마차.c3.o1": ["노인은 한동안 말이 없다.", "", "\"…그래. 그런 일도 있겠지.\"", "", "{관병}들이 나를 궁 밖에 내려놓았다.", "**<green>풀려났다.<\/green>** {동전} 한 꾸러미와 함께."], "D010_황궁의_마차.c4.tag": "침묵", "D010_황궁의_마차.c4.text": "입을 다문다", "D010_황궁의_마차.c4.o0": ["입을 열지 않는다.", "", "노인이 처음으로 웃는다.", "", "\"겁에 질려서도 혀를 아끼는구나.\"", "\"**<gold>그릇이 아주 없지는 않군.<\/gold>**\"", "", "노인의 손가락이 이마를 톡 친다.", "머릿속이 맑게 개는 느낌.", "", "\"가거라.\""], "D010_감옥.title": "지하 감옥", "D010_감옥.desc": ["축축하다.", "쥐 오줌 냄새가 코를 찌른다.", "", "쇠창살 너머로 간수 하나가 졸고 있다.", "허리춤에 **열쇠꾸러미**.", "", "옆 감방에는 **산발한 노인**.", "쇠사슬에 묶인 채 벽에 기대 있다.", "", "이상하다.", "**<gold>노인의 숨소리가 들리지 않는다.<\/gold>**", "죽지는 않았다. 그런데 숨을 쉬지 않는다."], "D010_감옥.c1.tag": "탈옥", "D010_감옥.c1.text": "간수가 잠든 틈에 열쇠를 노린다", "D010_감옥.c1.o0": ["팔을 쇠창살 밖으로 뻗는다.", "손끝이 열쇠고리에 닿았다.", "", "찰랑.", "", "간수는 깨지 않았다.", "", "**<green>탈옥했다.<\/green>**"], "D010_감옥.c1.o1": ["찰랑.", "", "간수가 눈을 떴다.", "", "\"이놈이!\"", "", "**<red>몽둥이가 쏟아진다.<\/red>**"], "D010_감옥.c2.tag": "말걸기", "D010_감옥.c2.text": "옆 감방의 노인에게 말을 건다", "D010_감옥.c2.o0": ["\"…저기요.\"", "", "대답이 없다.", "사흘째 말을 걸었다.", "", "나흘째 밤.", "노인이 눈을 떴다.", "", "\"…시끄러운 놈.\"", "\"숨 쉬는 법부터 틀렸다. 따라 해 봐라.\"", "", "**<gold>노인에게 호흡법을 배웠다.<\/gold>**"], "D010_감옥.c2.o1": ["\"…저기요.\"", "", "대답이 없다.", "며칠을 말을 걸어도 노인은 미동도 없다.", "", "**그래도, 혼자가 아니라는 게 위안이 됐다.**"], "D010_감옥.c3.tag": "매수", "D010_감옥.c3.text": "간수에게 {동전} 꾸러미를 찔러준다", "D010_감옥.c3.o0": ["간수가 {동전}을 세어 본다.", "", "\"…뒷문은 {해시}(亥時)에 열린다.\"", "", "**<green>풀려났다.<\/green>**"], "D010_감옥.c3.o1": ["간수가 {동전}을 챙기고 히죽 웃는다.", "", "\"고맙다. 잘 쓰마.\"", "", "**<red>문은 열리지 않았다.<\/red>**"], "D010_감옥.c4.tag": "옥패", "D010_감옥.c4.text": "{국사}에게 받은 옥패를 보여준다", "D010_감옥.c4.o0": ["간수가 옥패를 보더니 하얗게 질린다.", "", "\"구, {국사}님의…!\"", "", "**<gold>문이 열렸다.<\/gold>**", "간수가 연신 허리를 숙인다.", "", "간수가 {동전} 한 꾸러미를 쥐여주며 연신 허리를 숙인다."], "D011.title": "청하촌", "D011.desc": ["드디어, **사람 사는 곳**이다.", "", "흙담. 초가지붕. 장터의 소란.", "", "사람들의 시선이 내 옷에 꽂힌다.", "수군거림.", "", "장터 한쪽, 비단옷을 입은 **상인**이 이쪽을 유심히 본다.", "아니, 정확히는", "**내 주머니 쪽을.**", "", "마을 안쪽에서는", "**기합 소리**가 들려온다. {무관}이 있는 모양이다."], "D011.c1.tag": "흥정", "D011.c1.text": "상인에게 다가가 물건을 팔겠다고 한다", "D011.c1.o0": ["라이터를 켜 보였다.", "", "상인의 눈이 휘둥그레진다.", "\"이, 이건 대체…!\"", "", "**<gold>{동전} 다섯 꾸러미.<\/gold>**", "이 세계에 와서 처음 쥐어보는 큰돈이다.", "", "상인이 라이터를 품에 넣으며 묻는다.", "\"**이런 걸 어디서 구했소?**\""], "D011.c2.tag": "무관", "D011.c2.text": "기합 소리를 따라간다", "D011.c2.o0": ["허름한 {무관}.", "웃통을 벗은 청년들이 목검을 휘두르고 있다.", "", "문 앞에 방이 붙어 있다.", "글은 못 읽어도, 옆의 아이가 읽어준다.", "", "\"**잡일꾼 구함.** 숙식 제공이래요.\"", "", "무관 앞 우물에서 물 한 바가지를 얻어 마셨다."], "D011.c3.tag": "객잔", "D011.c3.text": "{객잔}에서 일자리를 구한다", "D011.c3.o0": ["주방 설거지 자리를 얻었다.", "", "고된 일이다.", "그래도 **밥은 굶지 않는다.**", "", "{객잔}에는", "**<gold>온갖 소문이 모인다.<\/gold>**"], "D011.c3.o1": ["\"근본도 모르는 놈은 안 써.\"", "", "문전박대.", "**마을 어귀 처마 밑에서 밤을 보냈다.**"], "D012.title": "낯익은 지팡이", "D012.desc": ["약방 앞을 지나는데.", "", "탁. 탁.", "", "**<red>낯익은 지팡이 소리.<\/red>**", "", "산에서 보따리를 빼앗았던 그 노인이", "약방 문을 열고 나온다.", "", "약방 주인이 허리를 숙인다.", "\"**의원 어르신**, 살펴 가십시오.\"", "", "노인의 고개가 천천히 이쪽으로 돌아간다."], "D012.c1.tag": "사죄", "D012.c1.text": "무릎 꿇고 사죄하며 훔친 돈을 돌려준다", "D012.c1.o0": ["\"그때는… 배가 고파서…\"", "", "노인이 한참 내려다본다.", "", "\"…쯧. 일어나게.\"", "\"도둑놈이 돌려주러 오다니, 별일이구먼.\"", "", "**<gold>노인이 약방 일을 맡겼다.<\/gold>**"], "D012.c2.tag": "외면", "D012.c2.text": "고개를 숙이고 모르는 척 지나간다", "D012.c2.o0": ["\"거기 서라.\"", "", "약방 주인과 일꾼들이 길을 막는다.", "", "\"**<red>도둑놈이다!<\/red>**\"", "", "장터 한복판에서 몰매를 맞았다.", "이제 마을 사람 모두가 내 얼굴을 안다."], "D012.c2.o1": ["노인은 아무 말도 하지 않았다.", "", "그저 **지팡이로 바닥을 한 번 쳤을 뿐.**", "", "등 뒤가 서늘하다."], "D012.c3.tag": "도주", "D012.c3.text": "등을 돌려 달린다", "D012.c3.o0": ["뛰었다.", "아무도 쫓아오지 않았다.", "", "골목 끝에서 돌아보니", "노인은 그 자리에 서서 **이쪽을 보고 있다.**", "", "**<red>이 마을에서 약을 구하긴 글렀다.<\/red>**"], "D013.title": "첫 번째 가르침", "D013.desc": ["모닥불 건너편.", "{무인}이 칼을 닦고 있다.", "", "\"너, **{무공}을 배워본 적 있나.**\"", "", "고개를 젓자, 무인이 혀를 찬다.", "", "\"이 세상에서 칼 하나 못 쥐는 놈은 **<red>개죽음<\/red>**이다.\"", "\"기초 정도는 가르쳐 주지.\"", "", "무인이 일어선다.", "**자세가 낮다. 무릎이 거의 땅에 닿는다.**"], "D013.c1.tag": "수련", "D013.c1.text": "시키는 대로 {마보}를 선다", "D013.c1.o0": ["한 {시진}.", "다리가 불타오른다.", "", "두 시진.", "감각이 사라졌다.", "", "그때, 배꼽 아래가 **<gold>따뜻해졌다.<\/gold>**", "", "{무인}이 처음으로 웃는다.", "\"…기가 돌았군.\"", "", "**<gold>{삼류} 무인이 되었다.<\/gold>**"], "D013.c1.o1": ["다리가 풀려 고꾸라졌다.", "", "\"오늘은 여기까지.\"", "", "**그래도 다리에 힘이 붙었다.**"], "D013.c2.tag": "질문", "D013.c2.text": "왜 이렇게 자세를 낮추는지 묻는다", "D013.c2.o0": ["{무인}이 의외라는 듯 본다.", "", "\"뿌리가 깊어야 기가 고인다.\"", "\"무작정 따라 하는 놈보다는 낫군.\"", "", "**<green>수련의 요령을 깨달았다.<\/green>**", "다음 수련은 조금 쉬워지겠지.", "", "그날 밤, 혼자 다시 자세를 잡아봤다. **다리에 힘이 붙는다.**"], "D013.c3.tag": "거절", "D013.c3.text": "칼싸움은 하기 싫다고 한다", "D013.c3.o0": ["{무인}이 한참 바라본다.", "", "\"…그래. 네 목숨이니.\"", "", "다음 날 아침.", "**<red>무인은 사라지고 없었다.<\/red>**", "", "모닥불 자리에 {동전} 한 꾸러미가 놓여 있다."], "D014.title": "읽을 수 없는 책", "D014.desc": ["{무인}의 품에서 가져온 책을 펼친다.", "", "글자는 한 자도 읽을 수 없다.", "", "**그림**은 있다.", "사람의 몸. 그 위를 흐르는 선들.", "", "선은 **<purple>검붉은 먹<\/purple>**으로 그려져 있다.", "가만히 보고 있으면", "**<purple>속이 울렁거린다.<\/purple>**"], "D014.c1.tag": "독학", "D014.c1.text": "그림을 보며 따라 해본다", "D014.c1.o0": ["선을 따라 숨을 들이쉰다.", "", "배 속에서 무언가 꿈틀거린다.", "뜨겁다. 아니, 차갑다.", "", "**<purple>피를 토했다.<\/purple>**", "", "**<red>기가 거꾸로 흘렀다.<\/red>**"], "D014.c1.o1": ["선을 따라 숨을 들이쉰다.", "", "배 속에서 무언가 꿈틀거린다.", "**<purple>차갑고 끈적한 기운<\/purple>**이 혈관을 타고 돈다.", "", "힘이 솟는다.", "**<purple>기분이 영 좋지 않다.<\/purple>**", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "D014.c1.o2": ["한참을 따라 해봤지만", "아무 일도 일어나지 않았다.", "", "**속만 울렁거린다.**"], "D014.c2.tag": "해독", "D014.c2.text": "글을 아는 사람에게 읽어달라고 한다", "D014.c2.o0": ["서당 {훈장}이 책을 펼치다 얼굴이 하얗게 질린다.", "", "\"이, 이건…\"", "\"**<purple>{혈마공}(血魔功)<\/purple>**이오.\"", "\"**{마교}의 {무공}이란 말이오!**\"", "", "{훈장}은 그대로 문을 닫아걸었다.", "", "미리 건넨 {동전} 서른 닢은 **돌려받지 못했다.**"], "D014.c3.tag": "매각", "D014.c3.text": "장터에 내다 판다", "D014.c3.o0": ["골동품상이 책을 휘리릭 넘기더니", "{은자}를 넉넉히 쳐준다.", "", "**<green>{은자} 세 냥.<\/green>**", "", "너무 쉽게 팔렸다.", "**<red>조금 이상할 만큼.<\/red>**"], "D014.c4.tag": "소각", "D014.c4.text": "불길하다. 태워버린다", "D014.c4.o0": ["책이 타들어 간다.", "", "검붉은 먹이 녹아내리며", "**<purple>비명 같은 소리<\/purple>**가 났다. 착각이겠지.", "", "속이 개운하다."], "D015.title": "무관의 잡일꾼", "D015.desc": ["{무관} 마당.", "", "턱수염 덥수룩한 **{사범}**이 나를 위아래로 훑는다.", "", "\"물 긷고, 장작 패고, 마당 쓸고.\"", "\"**대신 밥은 준다.**\"", "", "사범 뒤에서 수련생 하나가 비웃는다.", "이마에 **<red>칼자국<\/red>**이 있는 덩치 큰 놈.", "", "\"저런 비실이가 버티겠어요?\""], "D015.c1.tag": "인내", "D015.c1.text": "고개를 숙이고 일을 받는다", "D015.c1.o0": ["새벽부터 밤까지 물을 길었다.", "", "칼자국 사내가 일부러 물통을 걷어찬다.", "다시 길었다.", "", "한 달 뒤.", "**<green>팔뚝에 근육이 붙었다.<\/green>**", "", "{사범}이 지나가며 툭 던진다.", "\"내일부터 새벽 수련에 끼어라.\""], "D015.c2.tag": "도발", "D015.c2.text": "칼자국 사내를 노려본다", "D015.c2.o0": ["\"뭘 봐?\"", "", "주먹이 날아온다.", "몸이 먼저 움직였다. 고개를 숙였다.", "", "헛방.", "", "마당이 조용해진다.", "{사범}이 턱수염을 쓸며 웃는다.", "", "\"**<gold>눈은 좋군.<\/gold>** 들어와라.\""], "D015.c2.o1": ["\"뭘 봐?\"", "", "주먹이 날아왔다.", "", "**<red>코뼈가 부러졌다.<\/red>**", "", "{사범}이 혀를 찬다.", "\"…그래도 일은 해라.\""], "D015.c3.tag": "거절", "D015.c3.text": "잡일은 사양한다", "D015.c3.o0": ["\"그럼 꺼져.\"", "", "등 뒤로 웃음소리가 쏟아진다.", "", "그날 밤도 처마 밑에서 떨었다."], "D016.title": "책을 찾는 자들", "D016.desc": ["밤.", "", "잠결에 눈을 떴다.", "**<red>누군가 내려다보고 있다.<\/red>**", "", "검은 옷. 검은 복면.", "숲에서 {무인}을 쫓던 자들과 **같은 차림**이다.", "", "\"그 시체 품에서 가져간 물건.\"", "\"**<red>내놔라.<\/red>**\"", "", "복면 사이로 보이는 눈.", "**어딘가 초조해 보인다.**"], "D016.c1.tag": "반납", "D016.c1.text": "책을 순순히 내준다", "D016.c1.o0": ["책을 받아 든 사내가 숨을 내쉰다.", "", "\"…현명하군.\"", "", "**<green>사내는 그대로 사라졌다.<\/green>**"], "D016.c1.o1": ["책을 받아 든 사내가 중얼거린다.", "", "\"**<red>읽었는지 아닌지 모르니.<\/red>**\""], "D016.c2.tag": "모른척", "D016.c2.text": "그런 물건은 모른다고 잡아뗀다", "D016.c2.o0": ["\"그래?\"", "", "**<red>칼끝이 뺨을 긋는다.<\/red>**", "", "사내가 방을 샅샅이 뒤진다.", "아무것도 없다.", "", "\"…다음엔 귀가 떨어질 거다.\""], "D016.c2.o1": ["사내가 주위를 뒤진다.", "아무것도 없다.", "", "\"…헛걸음이군.\"", "", "**사라졌다.**", "**<red>놈들은 다시 온다.<\/red>**", "", "그날 밤은 한숨도 자지 못했다."], "D016.c3.tag": "흥정", "D016.c3.text": "판 곳을 알려줄 테니 목숨을 달라고 한다", "D016.c3.o0": ["\"골동품상에 팔았소. 장터 동쪽 끝.\"", "", "사내가 잠시 생각하더니", "칼을 거둔다.", "", "", "사내가 {동전} 몇 닢을 바닥에 던져두고 간다.", "다음 날 아침.", "**<red>골동품상이 불타 있었다.<\/red>**", "", "**<purple>내 탓일까.<\/purple>**"], "D016.c4.tag": "역공", "D016.c4.text": "베개 밑의 손칼로 찌른다", "D016.c4.o0": ["초조한 눈빛. 그게 틈이었다.", "", "손칼이 복면 아래로 파고든다.", "", "사내가 비틀거리며 창밖으로 몸을 날린다.", "", "**<green>살았다.<\/green>**", "바닥에 **<gold>검은 패<\/gold>** 하나가 떨어져 있다."], "D016.c4.o1": ["손칼이 허공을 찔렀다.", "", "\"…쥐새끼가 이빨을 드러내는군.\"", "", "**<red>마지막으로 검은 소매가 보였다.<\/red>**"], "D017.title": "새벽 마당", "D017.desc": ["닭도 울기 전.", "", "{무관} 마당에 수련생들이 줄지어 선다.", "물동이를 내려놓고 맨 끝에 섰다.", "", "{사범}이 외친다.", "\"**{마보}!** 향 한 대 탈 때까지 버틴다!\"", "", "옆의 수련생이 작게 속삭인다.", "\"**숨을 배꼽 아래로 내려.** 그래야 오래 가.\""], "D017.c1.tag": "버티기", "D017.c1.text": "이를 악물고 버틴다", "D017.c1.o0": ["향이 반쯤 탔을 때.", "다리가 떨리다 못해 **뜨거워졌다.**", "", "아니다. 다리가 아니다.", "배꼽 아래가.", "", "**<gold>기가 돌기 시작했다.<\/gold>**", "", "{사범}이 눈을 가늘게 뜬다.", "\"…잡일꾼 놈이?\""], "D017.c1.o1": ["향이 반도 타기 전에 주저앉았다.", "", "웃음소리.", "", "그래도 **어제보다 오래 버텼다.**"], "D017.c2.tag": "호흡", "D017.c2.text": "속삭임대로 숨을 아래로 내린다", "D017.c2.o0": ["들이쉬고. 아래로.", "내쉬고. 다시 아래로.", "", "어느 순간 배꼽 아래에서", "**<gold>작은 불씨<\/gold>**가 켜졌다.", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**", "", "속삭였던 수련생이 씩 웃는다.", "\"거봐. 나 **석두**야.\""], "D017.c2.o1": ["숨에 신경 쓰다 자세가 무너졌다.", "", "{사범}의 {죽비}가 등짝에 꽂힌다.", "", "그래도 **숨 쉬는 법은 조금 알겠다.**"], "D017.c3.tag": "요령", "D017.c3.text": "떠돌이 {무인}에게 배운 대로 뿌리를 내린다", "D017.c3.o0": ["\"뿌리가 깊어야 기가 고인다.\"", "", "그 말을 떠올리며 무릎을 더 낮췄다.", "", "향이 다 탔다.", "마당에 남은 사람은 **나 하나뿐이다.**", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "D017.c3.o1": ["뿌리는 내렸는데 기는 오지 않았다.", "", "그래도 마지막까지 버텼다.", "{사범}이 처음으로 고개를 끄덕인다."], "D018.title": "칼자국 왕두", "D018.desc": ["우물가.", "", "물동이가 발길에 차여 엎어진다.", "", "이마에 칼자국. **왕두**다.", "", "\"잡일꾼 주제에 요즘 {사범}님 눈에 드는 모양이지?\"", "", "왕두 뒤로 패거리 둘.", "왕두의 **오른쪽 무릎에 붕대**가 감겨 있다."], "D018.c1.tag": "인내", "D018.c1.text": "말없이 물을 다시 긷는다", "D018.c1.o0": ["대꾸하지 않았다.", "", "왕두가 혀를 차며 물동이를 한 번 더 걷어찬다.", "", "세 번을 다시 길었다.", "**어깨가 조금 단단해졌다.**"], "D018.c2.tag": "급소", "D018.c2.text": "붕대 감은 무릎을 걷어찬다", "D018.c2.o0": ["퍽.", "", "왕두가 무릎을 움켜쥐고 고꾸라진다.", "", "패거리들이 얼어붙는다.", "", "멀리서 지켜보던 {사범}이 피식 웃는다.", "\"**<gold>싸움은 머리로 하는 법이다.<\/gold>**\""], "D018.c2.o1": ["발을 뻗는 순간, 왕두가 몸을 틀었다.", "", "\"그걸 노릴 줄 알았지.\"", "", "**<red>셋이서 실컷 두들겨 팼다.<\/red>**"], "D018.c3.tag": "고자질", "D018.c3.text": "{사범}에게 일러바친다", "D018.c3.o0": ["{사범}이 왕두를 불러 세운다.", "", "왕두는 마당을 백 바퀴 돌았다.", "", "그날 밤.", "**<red>이불 속에 누가 물을 부어놨다.<\/red>**"], "D018.c4.tag": "일권", "D018.c4.text": "정면으로 주먹을 내지른다", "D018.c4.o0": ["배꼽 아래의 기운을 주먹에 실었다.", "", "**쾅.**", "", "왕두가 우물 벽까지 날아갔다.", "", "\"…너, 너 언제…\"", "", "**<gold>{무관}에서 나를 무시하는 놈은 이제 없다.<\/gold>**"], "D018.c4.o1": ["기운이 손끝까지 오지 않았다.", "", "왕두가 비웃으며 주먹을 받아낸다.", "**<red>손목이 꺾였다.<\/red>**"], "D019.title": "산채의 밤", "D019.desc": ["{산채}의 모닥불.", "산적들이 술판을 벌이고 있다.", "", "한쪽에서는 **{투전}판**.", "{동전}이 오가는 소리가 요란하다.", "", "구석에서는 늙은 산적 하나가 혼자 칼을 간다.", "**왼손이 없다.**", "", "부두목이 손짓한다.", "\"막내, 이리 와서 한 판 해.\""], "D019.c1.tag": "투전", "D019.c1.text": "{투전}판에 낀다", "D019.c1.o0": ["패를 쥔 손에 땀이 찬다.", "", "한 판. 두 판.", "", "**<green>이겼다.<\/green>**", "부두목의 얼굴이 굳는다."], "D019.c1.o1": ["패가 영 안 붙는다.", "", "부두목이 {동전}을 쓸어 담으며 웃는다.", "\"**막내가 착하네.**\""], "D019.c2.tag": "외팔이", "D019.c2.text": "칼 가는 늙은 산적 옆에 앉는다", "D019.c2.o0": ["한참을 말없이 앉아 있었다.", "", "\"…칼은 이렇게 쥐어라.\"", "", "외팔이가 남은 한 손으로 시범을 보인다.", "놀랍도록 빠르다.", "", "\"나도 한때는 **<gold>{이류}<\/gold>** 소리 들었지.\""], "D019.c2.o1": ["\"꺼져.\"", "", "숫돌이 날아왔다.", "이마가 찢어졌다."], "D019.c3.tag": "술", "D019.c3.text": "산적들과 어울려 술을 마신다", "D019.c3.o0": ["독한 술이 목을 태운다.", "", "산적들이 어깨를 두드린다.", "\"이제 좀 식구 같네!\"", "", "다음 날 아침.", "**머리가 깨질 듯하다.**"], "D019.c4.tag": "탈주", "D019.c4.text": "다들 취한 틈에 {산채}를 빠져나간다", "D019.c4.o0": ["코 고는 소리 사이로 발을 옮겼다.", "", "목책을 넘고, 비탈을 굴렀다.", "", "**<green>빠져나왔다.<\/green>**", "", "이제 {흑풍채}는 **<red>나를 배신자로 여기겠지.<\/red>**"], "D019.c4.o1": ["목책에 걸린 방울이 울렸다.", "", "\"막내가 튄다!\"", "", "**<red>끌려와서 반쯤 죽도록 맞았다.<\/red>**"], "D020.title": "새 두목", "D020.desc": ["두목의 자리.", "호랑이 가죽이 깔린 의자에 앉았다.", "", "산적 서른 명이 이쪽을 보고 있다.", "", "존경하는 눈빛이 아니다.", "**<red>언제 목을 딸지 재는 눈빛이다.<\/red>**", "", "부두목 **곽철**이 앞으로 나선다.", "\"새 두목님. 첫 명령을 내리시지요.\"", "", "그 손이 **칼자루 근처에 머물러 있다.**"], "D020.c1.tag": "분배", "D020.c1.text": "창고의 {은자}를 모두에게 나눠준다", "D020.c1.o0": ["창고 문을 활짝 열었다.", "", "\"전부 나눠 가져라.\"", "", "환호성.", "곽철의 손이 칼자루에서 떨어진다.", "", "**<gold>산적들이 처음으로 고개를 숙인다.<\/gold>**"], "D020.c1.o1": ["{은자}를 나눠주자 곽철이 비웃는다.", "", "\"돈으로 사는 충성은 오래 안 가지.\"", "", "그날 밤, 곽철은 **<red>절반을 데리고 {산채}를 떠났다.<\/red>**"], "D020.c2.tag": "본보기", "D020.c2.text": "곽철을 먼저 친다", "D020.c2.o0": ["말이 끝나기도 전에 몸을 날렸다.", "", "곽철의 칼이 반쯤 뽑힌 채 멈춘다.", "", "**<gold>쓰러진 쪽은 곽철이었다.<\/gold>**", "", "{산채}가 쥐 죽은 듯 조용해진다."], "D020.c2.o1": ["곽철은 기다리고 있었다.", "", "**<red>칼날이 먼저 닿았다.<\/red>**"], "D020.c3.tag": "해산", "D020.c3.text": "{흑풍채}를 해산하겠다고 선언한다", "D020.c3.o0": ["\"오늘부로 {흑풍채}는 없다.\"", "", "웅성거림.", "곽철이 크게 웃는다.", "", "\"그럼 넌 두목이 아니군.\"", "", "**<red>{산채} 밖으로 내던져졌다.<\/red>**", "그래도 품에는 창고에서 챙긴 {은자} 한 냥이 있다."], "D021.title": "화산의 빚", "D021.desc": ["산길에서 누군가 손을 흔든다.", "", "흰 {무복}. 등에 멘 검.", "**진우**다.", "", "\"찾느라 애먹었다, 은인!\"", "", "진우가 허리를 깊이 숙인다.", "\"{화산파} 제자는 은혜를 잊지 않는다.\"", "\"**원하는 걸 말해봐.**\""], "D021.c1.tag": "검법", "D021.c1.text": "검 쓰는 법을 가르쳐 달라고 한다", "D021.c1.o0": ["진우가 나뭇가지 하나를 건넨다.", "", "\"{사문}의 검법은 못 가르쳐. 대신 기초는.\"", "", "사흘 밤낮을 휘둘렀다.", "나흘째 아침, 가지 끝이 **<gold>바람을 갈랐다.<\/gold>**", "", "\"…너, 재능 있다.\""], "D021.c1.o1": ["사흘 밤낮을 휘둘렀다.", "", "손바닥이 다 까졌다.", "\"…괜찮아. 다들 처음엔 그래.\""], "D021.c2.tag": "재물", "D021.c2.text": "돈을 달라고 한다", "D021.c2.o0": ["진우가 잠시 멈칫하더니 {전낭}을 통째로 내민다.", "", "\"…그래. 그게 필요하겠지.\"", "", "**<green>{은자} 한 냥.<\/green>**", "", "진우의 눈빛이 조금 식었다."], "D021.c3.tag": "추천", "D021.c3.text": "{화산파}에 들어가고 싶다고 한다", "D021.c3.o0": ["진우가 난감한 얼굴을 한다.", "", "\"입문 시험은 내가 어쩔 수 없어. 대신…\"", "", "품에서 **<gold>매화 문양 패<\/gold>**를 꺼낸다.", "\"이걸 보여주면 시험 자리는 내줄 테니까.\""], "D021.c3.o1": ["\"…미안. 범인은 화산 문턱도 못 넘어.\"", "", "진우가 대신 말린 고기 한 덩이를 쥐여준다.", "", "**<red>범인.<\/red>** 그 말이 귀에 박힌다."], "D022.title": "숨 쉬는 법", "D022.desc": ["감옥의 노인이 가르쳐 준 구절.", "", "**들이쉼은 길게. 머묾은 깊게. 내쉼은 가늘게.**", "", "밤마다 따라 해 봤지만", "아직 아무것도 느껴지지 않는다.", "", "노인의 마지막 말이 떠오른다.", "\"**<purple>급하면 죽는다.<\/purple>**\""], "D022.c1.tag": "인내", "D022.c1.text": "한 달 동안 매일 밤 천천히 따라 한다", "D022.c1.o0": ["스무하루째 밤.", "", "숨이 배꼽 아래에서 **<gold>멈추지 않고 돌았다.<\/gold>**", "", "한 바퀴. 두 바퀴.", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "D022.c1.o1": ["한 달이 지났다.", "기는 오지 않았다.", "", "대신 **잠이 깊어지고 몸이 가볍다.**"], "D022.c2.tag": "강행", "D022.c2.text": "숨을 억지로 오래 참는다", "D022.c2.o0": ["더. 조금만 더.", "", "눈앞이 하얘졌다.", "", "**<purple>코피가 쏟아졌다.<\/purple>**", "", "급하면 죽는다. 그 말이 맞았다."], "D022.c2.o1": ["숨을 참고, 참고, 또 참았다.", "", "배 속이 **뜨겁다.**", "", "기가 돌았다. 거칠게, 날뛰듯이.", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**", "가슴 한쪽이 **<purple>욱신거린다.<\/purple>**"], "D022.c3.tag": "질문", "D022.c3.text": "옥중 노인을 다시 찾아간다", "D022.c3.o0": ["감옥 담장 밖, 노인의 감방 창살 아래.", "", "\"…미련한 놈. 다시 오다니.\"", "", "노인이 구절 하나를 더 읊어준다.", "", "\"**머묾이 핵심이다.** 숨이 아니라 마음을 붙잡아라.\""], "D023.title": "국사의 사자", "D023.desc": ["밤길.", "", "등 뒤에서 발소리가 없다.", "돌아보니 **누군가 서 있다.**", "", "흰 옷의 소년.", "발이 **<gold>땅에서 한 뼘 떠 있다.<\/gold>**", "", "\"{국사}님의 명이다.\"", "", "소년이 손바닥만 한 **<gold>투명한 구슬<\/gold>**을 내민다.", "\"**손을 얹어라.** 네 안에 무엇이 있는지 본다.\""], "D023.c1.tag": "순응", "D023.c1.text": "구슬에 손을 얹는다", "D023.c1.o0": ["손을 얹자 구슬 속에", "**<gold>희미한 빛 한 줄기<\/gold>**가 피어오른다.", "", "소년의 눈이 커진다.", "", "\"…있다. **{영근}**이 있어.\"", "", "소년이 처음으로 웃는다.", "\"{국사}님께 고하겠다. 그때까지 살아 있어라.\""], "D023.c1.o1": ["손을 얹었다.", "", "구슬은 **아무 빛도 내지 않았다.**", "", "소년이 차갑게 고개를 돌린다.", "\"**<red>범인이군.<\/red>** 헛걸음했다.\"", "", "눈 깜빡할 사이, 소년이 사라졌다.", "", "**발이 땅에서 떠 있던 사람.**", "이 세계에는 **<gold>{무인}보다 더 높은 무언가<\/gold>**가 있다."], "D023.c2.tag": "거절", "D023.c2.text": "왜 그래야 하냐고 묻는다", "D023.c2.o0": ["소년이 고개를 갸웃한다.", "", "\"범인이 질문을 하네.\"", "", "손가락 하나가 움직였다.", "**<red>몸이 땅바닥에 처박혔다.<\/red>**", "", "\"다음엔 묻지 말고 따라라.\"", "", "소년이 사라진 자리에 **{은자} 한 냥**이 떨어져 있다. 약값이라는 듯."], "D023.c3.tag": "라이터", "D023.c3.text": "대신 라이터를 켜 보인다", "D023.c3.o0": ["딸깍.", "", "불꽃을 본 소년이 처음으로 놀란다.", "", "\"…{법력}도 없이 불을?\"", "", "소년이 라이터를 낚아채 사라진다.", "", "\"**{국사}님께 보여드리겠다.**\"", "", "구슬 시험은 **잊힌 모양이다.**"], "D024.title": "객잔의 소문", "D024.desc": ["설거지통 너머로 손님들의 말소리가 들린다.", "", "창가의 **{보부상}**.", "\"{흑풍채} 놈들 목에 **현상금**이 붙었다더군.\"", "", "구석의 **취객**.", "\"검은 옷 입은 놈들 말이야. 그게 다 **<purple>{마교}<\/purple>** 졸개래.\"", "", "이층 계단의 **{기녀}**.", "\"황궁 {국사}님이 **사람을 찾는다**던데요. 하늘에 금이 간 밤, 산에 있던 사람.\""], "D024.c1.tag": "현상금", "D024.c1.text": "{보부상}에게 술을 따르며 더 묻는다", "D024.c1.o0": ["{보부상}이 술잔을 비우며 손가락 다섯 개를 편다.", "", "\"두목 목 하나에 **{은자} 열 냥.**\"", "\"산적 하나당 한 냥이고.\"", "", "보부상이 {동전} 몇 닢을 던져준다."], "D024.c2.tag": "흑의인", "D024.c2.text": "취객 옆에 앉아 검은 옷의 자들에 대해 묻는다", "D024.c2.o0": ["취객이 목소리를 낮춘다.", "", "\"{마교}에서 **<purple>도망친 놈<\/purple>**이 있대. 귀한 걸 훔쳐서.\"", "\"그걸 찾느라 온 산을 뒤지고 다닌다더라.\"", "", "**도망친 놈.** 숲에서 쓰러져 있던 그 {무인}이 떠오른다."], "D024.c2.o1": ["\"뭘 그렇게 캐물어?\"", "", "취객의 눈이 갑자기 맑아진다.", "", "**<red>취한 척이었다.<\/red>**", "", "취객이 술값도 안 내고 사라졌다. 그 값은 내 품삯에서 깎였다."], "D024.c3.tag": "국사", "D024.c3.text": "{기녀}에게 {국사} 이야기를 묻는다", "D024.c3.o0": ["{기녀}가 부채로 입을 가리고 웃는다.", "", "\"하늘에 금이 간 밤, 산 하나가 통째로 패였대요.\"", "\"{국사}님이 그 근처를 이 잡듯 뒤진다나.\"", "", "그 구덩이.", "**<red>등골이 서늘하다.<\/red>**", "", "기녀가 웃으며 술 한 잔을 따라준다."], "D025.title": "라이터의 출처", "D025.desc": ["장터를 걷는데 누가 소매를 잡는다.", "", "그 비단옷 **상인**이다.", "", "\"찾았소! 그 불 켜는 물건 말이오.\"", "\"**하나 더 없소?** 부르는 값을 주겠소.\"", "", "상인 뒤에 덩치 큰 호위 둘.", "웃고 있지만 **<red>눈은 웃지 않는다.<\/red>**"], "D025.c1.tag": "허풍", "D025.c1.text": "구해오겠다고 큰소리친다", "D025.c1.o0": ["\"좋소! 선금이오.\"", "", "**<green>{동전} 세 꾸러미<\/green>**가 손에 쥐어진다.", "", "상인이 등을 두드린다.", "\"**보름 안에** 가져오시오. 못 가져오면…\"", "", "호위들이 손가락 마디를 꺾는다."], "D025.c2.tag": "정직", "D025.c2.text": "하나뿐이었다고 솔직히 말한다", "D025.c2.o0": ["상인이 한참 이쪽을 살핀다.", "", "\"…거짓말은 아니군.\"", "", "상인이 명패 하나를 건넨다.", "\"혹시 비슷한 물건이 생기면 **금화{상단}**으로 오시오.\""], "D025.c2.o1": ["\"거짓말.\"", "", "호위 하나가 멱살을 잡아 골목으로 끌고 간다.", "", "주머니를 뒤집어 털렸다.", "**<red>있는 걸 다 빼앗겼다.<\/red>**"], "D025.c3.tag": "도주", "D025.c3.text": "소매를 뿌리치고 인파 속으로 달린다", "D025.c3.o0": ["좌판을 넘고, 골목을 꺾었다.", "", "**<green>따돌렸다.<\/green>**", "", "청하촌 장터에는 **당분간 얼씬도 못 하겠다.**"], "D025.c3.o1": ["다섯 걸음 만에 호위의 손이 뒷덜미를 잡았다.", "", "\"**<red>도망치는 걸 보니 뭔가 있군.<\/red>**\""], "D026.title": "다시 온 그림자", "D026.desc": ["달이 없는 밤.", "", "풀벌레 소리가 **뚝 끊겼다.**", "", "나무 사이로 검은 옷이 하나, 둘, 셋.", "", "가운데 선 자는 복면을 쓰지 않았다.", "얼굴 반쪽이 **<purple>검붉은 문신<\/purple>**으로 덮여 있다.", "", "\"그놈이 너한테 뭘 맡겼는지 다 안다.\"", "\"**<red>오늘은 묻지 않는다.<\/red>**\""], "D026.c1.tag": "도주", "D026.c1.text": "등을 돌려 계곡 쪽으로 뛴다", "D026.c1.o0": ["비탈을 미끄러져 내려갔다.", "계곡물에 몸을 던졌다.", "", "물살이 몸을 휘감아 한참을 끌고 갔다.", "", "**<green>살았다.<\/green>**", "온몸이 돌에 긁혀 성한 데가 없다."], "D026.c1.o1": ["세 걸음.", "", "등 뒤에서 **<purple>차가운 기운<\/purple>**이 덮쳐왔다.", "", "**<red>그대로 어둠이 내렸다.<\/red>**"], "D026.c2.tag": "사부", "D026.c2.text": "사부의 이름을 크게 외친다", "D026.c2.o0": ["\"사부님!!\"", "", "대답 대신,", "**<gold>검광이 밤을 갈랐다.<\/gold>**", "", "문신의 사내가 한 걸음 물러선다.", "\"…살아 있었나, 배신자.\"", "", "사부가 앞을 막아선다.", "\"내 제자다. **꺼져라.**\"", "", "그림자들이 물러갔다."], "D026.c2.o1": ["\"사부님!!\"", "", "대답이 없다.", "", "문신의 사내가 웃는다.", "\"그놈은 **<red>이미 죽었다.<\/red>**\"", "", "그 말이 마지막으로 들은 말이었다."], "D026.c3.tag": "역습", "D026.c3.text": "먼저 덤빈다", "D026.c3.o0": ["배꼽 아래의 기운을 전부 끌어올렸다.", "", "가장 가까운 놈의 팔목을 꺾고, 칼을 빼앗았다.", "", "휘둘렀다. 무작정.", "", "**<gold>검은 옷 하나가 쓰러졌다.<\/gold>**", "", "문신의 사내가 눈을 가늘게 뜬다.", "\"…재미있군. 다음에 보자.\""], "D026.c3.o1": ["주먹이 닿기도 전에", "**<purple>검붉은 손바닥<\/purple>**이 가슴에 닿았다.", "", "**<red>심장이 멎었다.<\/red>**"], "D026.c4.tag": "흥정", "D026.c4.text": "물건은 없지만 그 {무인}이 간 곳을 안다고 거짓말한다", "D026.c4.o0": ["\"서, 서쪽이오! 화산 쪽으로!\"", "", "문신의 사내가 한참 이쪽을 내려다본다.", "", "\"…거짓이면 다시 온다.\"", "", "그림자들이 서쪽으로 사라졌다.", "다리가 풀려 주저앉았다."], "D026.c4.o1": ["\"서, 서쪽이…\"", "", "\"**<red>눈동자가 왼쪽으로 갔군.<\/red>**\"", "", "문신의 사내가 손을 들었다."], "F001.title": "첫 약탈", "F001.desc": ["고갯길 아래.", "덜컹거리는 **마차 두 대**가 올라온다.", "", "부두목이 낮게 속삭인다.", "\"**비단 {상단}**이다. 호위는 넷.\"", "\"막내, 오늘이 네 첫 일이다.\"", "", "호위 넷 중 하나는 **늙었고**, 하나는 **졸고 있다.**", "나머지 둘은 허리에 찬 칼에서 손을 떼지 않는다."], "F001.c1.tag": "망보기", "F001.c1.text": "뒤에서 망을 본다", "F001.c1.o0": ["바위 뒤에 숨어 길을 지켜봤다.", "", "고함. 비명. 칼 부딪치는 소리.", "", "일이 끝나고 부두목이 {동전} 몇 닢을 던져준다.", "\"겁쟁이 몫이다.\""], "F001.c2.tag": "급습", "F001.c2.text": "졸고 있는 호위부터 덮친다", "F001.c2.o0": ["졸던 호위가 눈을 뜨기도 전에", "몽둥이가 정수리에 떨어졌다.", "", "그 틈에 산적들이 쏟아져 내려간다.", "", "**<green>비단 세 필과 {동전} 꾸러미.<\/green>**", "부두목이 처음으로 어깨를 두드린다.", "\"제법이다, 막내.\""], "F001.c2.o1": ["달려드는 순간 졸던 호위가 눈을 떴다.", "", "**자는 척이었다.**", "", "**<red>칼날이 배를 갈랐다.<\/red>**"], "F001.c2.o2": ["호위가 몸을 비틀어 피했다.", "칼등에 어깨를 얻어맞고 나뒹굴었다.", "", "싸움은 산적들이 끝냈다.", "**나는 피만 흘렸다.**"], "F001.c3.tag": "밀고", "F001.c3.text": "늙은 호위에게 몰래 신호를 보낸다", "F001.c3.o0": ["돌멩이를 늙은 호위 발치에 굴렸다.", "", "늙은 호위가 눈을 가늘게 뜨더니,", "마차를 **되돌렸다.**", "", "산적들이 허탕을 쳤다.", "", "며칠 뒤, {산채} 앞에 **보따리 하나**가 놓여 있었다.", "안에는 약과 {동전} 한 꾸러미. **고맙다는 쪽지와 함께.**"], "F001.c3.o1": ["돌멩이를 굴리는 걸", "**<red>부두목이 봤다.<\/red>**", "", "\"이 새끼가?\"", "", "그날 밤 {산채} 기둥에 묶여 매질을 당했다."], "F002.title": "외팔이의 칼", "F002.desc": ["새벽. {산채} 뒤편 공터.", "", "외팔이 노도가 장작을 패고 있다.", "도끼가 아니라 **칼**로.", "", "통나무가 소리도 없이 반으로 갈라진다.", "", "\"보고만 있을 거냐.\"", "노도가 녹슨 칼 한 자루를 발치에 던진다.", "\"**칼은 팔로 휘두르는 게 아니다. 허리로 휘두른다.**\""], "F002.c1.tag": "수련", "F002.c1.text": "말대로 허리로 휘두른다", "F002.c1.o0": ["천 번.", "허리가 끊어질 듯하다.", "", "천한 번째.", "칼끝이 **<gold>바람을 갈랐다.<\/gold>**", "배꼽 아래가 **뜨거워졌다.**", "", "노도가 처음으로 웃는다.", "\"…그래. 그게 **기**다.\"", "", "**<gold>{삼류} {무인}이 되었다.<\/gold>**"], "F002.c1.o1": ["천 번을 휘둘렀다.", "손바닥이 다 터졌다.", "", "\"내일 또 와라.\"", "", "**칼을 쥐는 손이 조금 단단해졌다.**"], "F002.c2.tag": "질문", "F002.c2.text": "왜 산적이 되었는지 묻는다", "F002.c2.o0": ["노도의 칼이 멈춘다.", "", "\"…{표국}의 {표사}였다.\"", "\"{흑풍채}에 표물을 털렸지. 왼팔과 함께.\"", "\"돌아갈 곳이 없어 여기 남았다.\"", "", "노도가 다시 칼을 든다.", "\"**너는 돌아갈 곳이 있느냐.**\""], "F002.c3.tag": "거절", "F002.c3.text": "칼을 돌려주고 장작이나 패겠다고 한다", "F002.c3.o0": ["\"…그래라.\"", "", "도끼로 장작을 팼다.", "노도는 더 이상 말을 걸지 않았다.", "", "**팔뚝만 굵어졌다.**"], "F003.title": "현상금 사냥꾼", "F003.desc": ["한밤중. 목책 밖에서 **불화살**이 날아든다.", "", "\"**현상금 사냥꾼이다!**\"", "", "{산채}가 불바다가 된다.", "산적들이 우왕좌왕 뛰어다닌다.", "", "뒷문 쪽은 **아직 조용하다.**", "정문에서는 부두목이 홀로 칼을 휘두르고 있다."], "F003.c1.tag": "도주", "F003.c1.text": "뒷문으로 혼자 빠져나간다", "F003.c1.o0": ["불길을 등지고 뒷문을 빠져나왔다.", "", "등 뒤에서 비명이 이어진다.", "", "**<green>살았다.<\/green>**", "", "{흑풍채}는 그날 밤 무너졌다.", "**나는 다시 혼자다.**"], "F003.c1.o1": ["뒷문 밖에", "**<red>사냥꾼 셋이 기다리고 있었다.<\/red>**", "", "\"쥐새끼는 늘 뒷문으로 나오지.\""], "F003.c2.tag": "의리", "F003.c2.text": "정문으로 달려가 부두목 곁에 선다", "F003.c2.o0": ["부두목의 등 뒤를 막았다.", "", "칼이 스치고, 피가 튀고.", "", "새벽이 밝았을 때,", "사냥꾼들은 **물러가 있었다.**", "", "부두목이 피투성이 얼굴로 웃는다.", "\"…막내. 아니, **형제.**\""], "F003.c2.o1": ["부두목 곁에 섰다.", "", "**<red>화살 한 대가 목을 꿰뚫었다.<\/red>**"], "F003.c2.o2": ["싸웠다. 정신없이.", "", "결국 {산채}는 무너졌다.", "부두목을 부축해 숲으로 도망쳤다.", "", "\"…이 빚은 잊지 않으마.\""], "F003.c3.tag": "투항", "F003.c3.text": "무기를 버리고 사냥꾼들에게 투항한다", "F003.c3.o0": ["무기를 던지고 두 손을 들었다.", "", "\"막내 놈이군. 목값은 한 냥이야.\"", "", "**<red>오랏줄에 묶여 끌려갔다.<\/red>**"], "F004.title": "곽철의 제안", "F004.desc": ["곽철이 술병을 들고 다가온다.", "", "\"막내. 우리 두목 어떻게 생각하냐.\"", "", "목소리를 낮춘다.", "\"**늙었어.** 겁도 많아졌고.\"", "\"내가 두목이 되면 네 몫은 **두 배**다.\"", "", "곽철의 눈이 **웃고 있지 않다.**"], "F004.c1.tag": "동참", "F004.c1.text": "곽철 편에 서겠다고 한다", "F004.c1.o0": ["사흘 뒤 밤.", "두목의 방에서 짧은 비명이 들렸다.", "", "다음 날 아침, 의자에는 **곽철이 앉아 있었다.**", "", "\"약속은 지킨다.\"", "곽철이 {동전} 두 꾸러미를 던져준다."], "F004.c1.o1": ["사흘 뒤 밤.", "**<red>두목은 기다리고 있었다.<\/red>**", "", "곽철은 목이 잘렸고,", "나는 매를 맞고 {산채} 밖으로 던져졌다."], "F004.c2.tag": "밀고", "F004.c2.text": "두목에게 일러바친다", "F004.c2.o0": ["두목이 고개를 끄덕인다.", "", "그날 밤 곽철은 **사라졌다.**", "", "두목이 내 어깨를 두드린다.", "\"충성스러운 놈이군.\"", "", "산적들의 눈빛이 **조금 차가워졌다.**"], "F004.c2.o1": ["\"곽철이? 그럴 리가.\"", "", "두목은 믿지 않았다.", "곽철은 **<red>밀고자가 나라는 사실을 알아챘다.<\/red>**"], "F004.c3.tag": "모른척", "F004.c3.text": "술만 받아 마시고 대답하지 않는다", "F004.c3.o0": ["술을 받아 마셨다.", "대답은 하지 않았다.", "", "곽철이 피식 웃는다.", "\"영리한 놈이군.\"", "", "**술이 독하다.**"], "F005.title": "막내의 하루", "F005.desc": ["{산채} 막내의 일은 끝이 없다.", "", "물 긷기. 장작 패기. 밥 짓기.", "밤에는 **보초**까지.", "", "오늘은 셋 중 하나만 하면 된다고 한다.", "부두목이 손가락 세 개를 편다.", "\"골라.\""], "F005.c1.tag": "장작", "F005.c1.text": "장작을 팬다", "F005.c1.o0": ["하루 종일 도끼를 휘둘렀다.", "", "**어깨가 단단해졌다.**"], "F005.c2.tag": "취사", "F005.c2.text": "밥을 짓는다", "F005.c2.o0": ["솥 바닥까지 긁어먹을 만큼 맛있게 지었다.", "", "\"막내 밥 잘하네!\"", "**산적들이 좀 다정해졌다.**"], "F005.c2.o1": ["밥을 태웠다.", "", "**국자로 머리를 맞았다.**"], "F005.c3.tag": "보초", "F005.c3.text": "밤새 보초를 선다", "F005.c3.o0": ["새벽녘. 숲 너머에 **횃불 몇 개**가 보였다.", "", "급히 종을 쳤다.", "산적들이 뛰쳐나가 염탐꾼 둘을 잡았다.", "", "두목이 {동전} 한 꾸러미를 던져준다.", "\"눈이 좋구나.\""], "F005.c3.o1": ["밤새 눈을 부릅떴다.", "아무 일도 없었다.", "", "**눈만 시뻘게졌다.**"], "F006.title": "보름 비무", "F006.desc": ["보름마다 열리는 **{비무}**.", "이기면 잡일꾼에서 **{정식 제자}**가 된다.", "", "{사범}이 이름을 부른다.", "내 상대는 **석두**.", "", "석두가 머리를 긁적인다.", "\"미안. 봐주진 않는다.\"", "", "석두는 **왼쪽으로 돌 때마다 발이 꼬인다.** 지난번 수련 때 봤다."], "F006.c1.tag": "정면", "F006.c1.text": "정면으로 맞붙는다", "F006.c1.o0": ["주먹과 주먹.", "한 대 맞고, 두 대 때리고.", "", "석두가 먼저 무릎을 꿇었다.", "", "{사범}이 손을 든다.", "\"**<gold>오늘부로 {정식 제자}다.<\/gold>**\""], "F006.c1.o1": ["주먹과 주먹.", "", "석두의 주먹이 더 무거웠다.", "**<red>바닥에 대자로 뻗었다.<\/red>**", "", "\"다음 보름에 또 해보자.\" 석두가 손을 내민다."], "F006.c2.tag": "허점", "F006.c2.text": "왼쪽으로 돌게 유도한다", "F006.c2.o0": ["오른쪽으로 파고들었다.", "석두가 왼쪽으로 몸을 튼다.", "", "발이 꼬였다.", "", "그 틈에 다리를 걸었다.", "석두가 나동그라진다.", "", "{사범}이 턱수염을 쓰다듬는다.", "\"**<gold>머리를 쓸 줄 아는군.<\/gold>** {정식 제자}로 받아주마.\""], "F006.c2.o1": ["석두가 이번엔 왼쪽으로 돌지 않았다.", "", "\"그거 고쳤어.\"", "", "**<red>주먹이 턱에 꽂혔다.<\/red>**"], "F006.c3.tag": "기권", "F006.c3.text": "석두에게 져준다", "F006.c3.o0": ["몇 합 겨루는 척하다 일부러 쓰러졌다.", "", "{사범}의 눈이 가늘어진다.", "\"…다음엔 진심으로 해라.\"", "", "그날 밤 석두가 찐빵 하나를 몰래 건넨다.", "\"고마워. **어머니가 아프셔서 꼭 이겨야 했어.**\""], "F007.title": "석두의 부탁", "F007.desc": ["석두가 우물가에 쭈그려 앉아 있다.", "", "\"…어머니가 기침을 멈추지 않으셔.\"", "\"약방에 가봤는데 **약값이 {은자} 반 냥**이래.\"", "", "석두가 주먹을 꽉 쥔다.", "\"산 너머 **절벽에 약초가 자란다**던데.\""], "F007.c1.tag": "약초", "F007.c1.text": "함께 절벽에 약초를 캐러 간다", "F007.c1.o0": ["절벽에 매달려 반나절.", "", "**<green>약초를 캤다.<\/green>**", "", "석두가 약초를 품에 안고 운다.", "\"…평생 잊지 않을게.\""], "F007.c1.o1": ["발 디딘 돌이 부서졌다.", "", "**<red>절벽 아래로.<\/red>**"], "F007.c1.o2": ["손이 미끄러져 굴러떨어졌다.", "덤불에 걸려 살았다.", "", "약초는 석두 혼자 캤다.", "\"…괜찮아? 고마워, 정말.\""], "F007.c2.tag": "돈", "F007.c2.text": "가진 돈을 보탠다", "F007.c2.o0": ["말없이 {동전} 꾸러미 다섯을 쥐여줬다.", "", "석두가 한참을 쳐다본다.", "\"…이걸 내가 어떻게 갚아.\"", "", "\"갚지 마.\""], "F007.c3.tag": "의원", "F007.c3.text": "약방 의원에게 사정을 말해본다", "F007.c3.o0": ["의원 노인이 혀를 찬다.", "", "\"도둑놈이 이제 남 걱정을 하는구먼.\"", "", "그래도 약을 지어준다. **값은 받지 않았다.**", "", "석두가 내 손을 붙잡고 놓지 않는다."], "F007.c4.tag": "외면", "F007.c4.text": "내 코가 석 자라고 한다", "F007.c4.o0": ["\"…그래. 미안, 괜한 얘길 했다.\"", "", "석두가 터덜터덜 걸어간다.", "", "**마음 한구석이 무겁다.**"], "F008.title": "무관의 빚", "F008.desc": ["{무관} 대문이 **발길에 차여 열린다.**", "", "험상궂은 사내들 다섯.", "맨 앞의 사내가 장부를 흔든다.", "", "\"{사범} 영감. **빚진 {은자} 세 냥.** 오늘까지다.\"", "", "사범이 이를 악문다.", "수련생들은 다들 벽에 붙어 떨고 있다.", "", "사내들의 허리춤에 **검은 바람 문양.**", "{흑풍채}의 표식이다."], "F008.c1.tag": "맞섬", "F008.c1.text": "{사범} 앞을 막아선다", "F008.c1.o0": ["\"물러가라.\"", "", "맨 앞의 사내가 웃으며 주먹을 날린다.", "피했다. 그리고 되받았다.", "", "사내가 마당에 나뒹굴었다.", "", "수련생들이 하나둘 목검을 든다.", "", "\"…**<gold>오늘은 물러가지.<\/gold>**\""], "F008.c1.o1": ["\"물러가라.\"", "", "**<red>다섯이 한꺼번에 달려들었다.<\/red>**", "", "정신을 차렸을 때, {사범}이 장부에 지장을 찍고 있었다.", "{무관} 대문에 **차압 딱지**가 붙었다."], "F008.c2.tag": "변제", "F008.c2.text": "가진 돈을 내놓는다", "F008.c2.o0": ["말없이 {은자}를 꺼내 장부 위에 올려놨다.", "", "사내들이 눈을 동그랗게 뜬다.", "\"…잡일꾼 주제에?\"", "", "{사범}이 한참 내 얼굴을 본다.", "\"**이 빚은 {무관}이 갚는다. 반드시.**\""], "F008.c3.tag": "아는척", "F008.c3.text": "{흑풍채} 사람들에게 아는 척을 한다", "F008.c3.o0": ["\"어이, 오랜만이다.\"", "", "맨 앞의 사내가 눈을 가늘게 뜬다.", "\"…막내?\"", "", "한참을 웅성거리더니,", "\"**<gold>막내 얼굴 봐서 한 달 미뤄준다.<\/gold>**\"", "", "수련생들의 눈빛이 묘하게 바뀌었다."], "F008.c3.o1": ["\"어이, 오랜만이다.\"", "", "\"…막내? 너 **도망친 놈**이잖아.\"", "", "**<red>표적이 {사범}에서 나로 바뀌었다.<\/red>**"], "F008.c4.tag": "방관", "F008.c4.text": "벽에 붙어 지켜본다", "F008.c4.o0": ["벽에 붙어 숨을 죽였다.", "", "{사범}이 장부에 지장을 찍었다.", "{무관} 대문에 **차압 딱지**가 붙었다.", "", "사범이 수련생들을 한 명씩 본다.", "**나와는 눈을 마주치지 않았다.**"], "F009.title": "새벽 산길", "F009.desc": ["{사범}의 명령.", "\"뒷산 꼭대기까지 **향 한 대 안에** 다녀와라.\"", "", "수련생들이 일제히 뛰어나간다.", "", "산길은 둘.", "넓지만 **멀리 도는 길.**", "좁고 가파른 **짐승 길.**"], "F009.c1.tag": "큰길", "F009.c1.text": "넓은 길로 꾸준히 달린다", "F009.c1.o0": ["숨이 턱까지 찼지만 멈추지 않았다.", "", "향이 다 타기 직전에 도착했다.", "**다리가 묵직하게 단단해졌다.**"], "F009.c2.tag": "지름길", "F009.c2.text": "가파른 짐승 길로 오른다", "F009.c2.o0": ["바위틈에 손을 짚었는데,", "**<gold>붉은 열매 하나<\/gold>**가 손에 잡혔다.", "", "먹어보니 몸이 후끈 달아오른다.", "", "꼭대기에 가장 먼저 도착했다."], "F009.c2.o1": ["바위를 타고, 뿌리를 붙잡고.", "", "**가장 먼저 꼭대기에 섰다.**", "", "{사범}이 고개를 끄덕인다."], "F009.c2.o2": ["발을 헛디뎌 비탈을 굴렀다.", "", "꼴찌로 도착했다.", "**온몸이 긁혔다.**"], "F009.c3.tag": "요령", "F009.c3.text": "중간쯤에서 숨어 쉬다가 내려간다", "F009.c3.o0": ["바위 뒤에서 한숨 돌리고 내려갔다.", "", "아무도 눈치채지 못했다.", "**덕분에 쌩쌩하다.**"], "F009.c3.o1": ["바위 뒤에서 쉬는데,", "**{사범}이 그 바위 위에 서 있었다.**", "", "\"…마당 백 바퀴.\""], "F010.title": "왕두의 사정", "F010.desc": ["밤. {무관} 뒤편.", "", "누군가 혼자 목검을 휘두르고 있다.", "**왕두**다.", "", "이마의 칼자국이 달빛에 번들거린다.", "", "왕두가 나를 보고 목검을 내린다.", "\"…뭘 봐.\"", "", "그 목소리가 **평소와 다르게 힘이 없다.**"], "F010.c1.tag": "대화", "F010.c1.text": "옆에 앉아 무슨 일이냐고 묻는다", "F010.c1.o0": ["한참 말이 없던 왕두가 입을 연다.", "", "\"이 칼자국. **{흑풍채}** 놈들한테 당한 거다.\"", "\"아버지 {객잔}을 불태운 날.\"", "", "\"강해져서 갚아줄 생각이었어. 너한테 지니까… 분하더라.\"", "", "왕두가 처음으로 웃는다.", "\"**같이 수련할래?**\""], "F010.c1.o1": ["\"꺼져.\"", "", "왕두가 목검을 휘두르며 돌아선다.", "", "**그래도 다음 날 아침, 물동이를 걷어차지 않았다.**"], "F010.c2.tag": "대련", "F010.c2.text": "목검을 집어 들고 상대해 준다", "F010.c2.o0": ["달빛 아래 목검이 부딪친다.", "", "한 {시진} 뒤.", "둘 다 바닥에 대자로 누웠다.", "", "\"…너 진짜 독하다.\"", "\"너도.\""], "F010.c2.o1": ["왕두의 목검이 정강이를 후려쳤다.", "", "\"…아까보다 낫네.\"", "**절뚝거리며 돌아왔다.**"], "F010.c3.tag": "비웃음", "F010.c3.text": "진 놈이 연습해 봐야 소용없다고 비웃는다", "F010.c3.o0": ["왕두의 얼굴이 굳는다.", "", "목검이 날아왔다.", "", "**<red>이번엔 진심이었다.<\/red>**"], "S001.title": "객잔의 시비", "S001.desc": ["{객잔} 구석에서 국수를 먹는데", "누군가 탁자를 걷어찬다.", "", "술 냄새를 풍기는 **떠돌이 {무인}**.", "\"어이, 거기. 칼 찬 걸 보니 너도 무인이냐?\"", "", "사내의 발걸음이 **비틀거린다.**", "칼자루를 쥔 손은 **떨리지 않는다.**"], "S001.c1.tag": "사과", "S001.c1.text": "고개를 숙이고 술값을 대신 내준다", "S001.c1.o0": ["\"쳇. 재미없는 놈.\"", "", "사내가 술병을 들고 자리를 뜬다.", "", "**술값이 꽤 나왔다.**"], "S001.c2.tag": "맞섬", "S001.c2.text": "젓가락을 내려놓고 일어선다", "S001.c2.o0": ["사내의 주먹을 흘리고 팔꿈치를 꽂았다.", "", "사내가 탁자 위로 나자빠진다.", "", "{객잔}이 조용해졌다가,", "누군가 휘파람을 분다.", "", "**<green>사내의 {전낭}이 바닥에 떨어져 있다.<\/green>**"], "S001.c2.o1": ["취한 척이었다.", "", "사내의 주먹이 정확히 명치에 꽂혔다.", "**<red>국수를 다 토했다.<\/red>**", "", "\"아직 멀었다, 애송이.\""], "S001.c3.tag": "관찰", "S001.c3.text": "취한 척이라는 걸 짚어준다", "S001.c3.o0": ["\"취한 사람 손이 그렇게 안 떨리진 않지.\"", "", "사내가 멈칫하더니 껄껄 웃는다.", "\"눈이 좋구나.\"", "", "사내가 술 한 잔을 따라주며", "**호흡을 고르는 요령** 하나를 일러준다."], "S001.c3.o1": ["\"…눈치만 빠른 놈은 일찍 죽는다.\"", "", "칼집이 옆구리를 후려쳤다."], "S002.title": "표국의 일거리", "S002.desc": ["청하촌 어귀의 작은 {표국}.", "", "\"{삼류}라도 칼 쓸 줄 알면 된다.\"", "\"사흘 길, 약재 수레 호위. **품삯은 {은자} 반 냥.**\"", "", "한 달 품삯의 절반.", "", "늙은 {표두}가 덧붙인다.", "\"요즘 **고갯길에 {녹림}이 날뛴다.** 각오는 해라.\""], "S002.c1.tag": "호위", "S002.c1.text": "일을 맡는다", "S002.c1.o0": ["사흘 내내 칼자루에서 손을 떼지 않았다.", "", "아무 일도 없었다.", "", "{표두}가 {은자}를 건넨다.", "\"다음에도 부르마.\""], "S002.c1.o1": ["둘째 날 밤, 화살이 쏟아졌다.", "", "**<red>첫 화살이 내 가슴을 찾았다.<\/red>**"], "S002.c1.o2": ["둘째 날 밤, {녹림}이 덮쳤다.", "", "정신없이 칼을 휘둘렀다.", "어깨를 베였지만, 수레는 지켰다.", "", "{표두}가 {은자} 반 냥에 **{동전} 꾸러미 셋을 더 얹어준다.**", "\"목숨값이다.\""], "S002.c2.tag": "흥정", "S002.c2.text": "위험수당을 더 달라고 한다", "S002.c2.o0": ["\"…배짱은 좋군. {은자} 한 냥.\"", "", "사흘 길은 조용했다.", "**두둑하게 챙겼다.**"], "S002.c2.o1": ["\"그럼 다른 놈 구하지.\"", "", "{표두}가 등을 돌린다.", "**일거리를 놓쳤다.**", "", "대신 {객잔}에서 하루 쉬었다."], "S002.c3.tag": "연줄", "S002.c3.text": "고갯길 {녹림}과 아는 사이라고 귀띔한다", "S002.c3.o0": ["{표두}의 눈이 가늘어진다.", "", "\"…그러니까, 길을 터 주겠다?\"", "", "고갯길에서 옛 동료들을 만났다.", "눈짓 한 번에 길이 열렸다.", "", "표두가 {은자} 한 냥을 건넨다.", "\"**이 일은 없던 걸로 하지.**\""], "S003.title": "비급 장수", "S003.desc": ["장터 구석. 돗자리 위에 **낡은 책자**가 수십 권.", "", "\"{비급} 사시오, 비급!\"", "\"이게 그 유명한 **{무당파}의 태극심법**이오!\"", "", "책 한 권에 **{동전} 세 꾸러미.**", "", "장수가 웃는다.", "그 이 사이에 **금니**가 번쩍인다. 장사가 잘되는 모양이다."], "S003.c1.tag": "구매", "S003.c1.text": "동전 세 꾸러미를 내고 산다", "S003.c1.o0": ["밤새 읽었다.", "", "가짜였다. 태극심법이 아니었다.", "", "대신 **진짜 무언가**였다.", "누군가 손으로 베낀 이름 없는 **<gold>호흡법<\/gold>**.", "", "따라 해보자 {단전}이 **뜨거워진다.**"], "S003.c1.o1": ["밤새 읽었다.", "", "**<red>가짜다.<\/red>**", "", "그림은 엉망이고 글귀는 엉터리.", "그래도 뭔가 하긴 해서 **몸은 좀 풀렸다.**"], "S003.c2.tag": "감정", "S003.c2.text": "책을 몇 장 넘겨보며 진짜를 고른다", "S003.c2.o0": ["책장을 넘기다 손이 멈췄다.", "", "다른 책들과 **먹 색이 다르다.**", "", "\"…그건 덤으로 끼워놓은 건데. {동전} 한 꾸러미 반.\"", "", "**<gold>값을 치르고 품에 넣었다.<\/gold>**"], "S003.c2.o1": ["다 비슷비슷해 보인다.", "", "\"안 살 거면 비켜!\"", "", "장수에게 떠밀려 나왔다.", "**보는 눈은 조금 생겼다.**"], "S003.c3.tag": "폭로", "S003.c3.text": "다 가짜라고 큰 소리로 외친다", "S003.c3.o0": ["\"이거 다 가짜요!\"", "", "구경꾼들이 웅성거린다.", "장수가 이를 갈며 돗자리를 걷는다.", "", "골목에서 장수의 패거리에게 둘러싸였다.", "**<red>얻어터졌다.<\/red>** 그래도 몇 대는 돌려줬다."], "S004.title": "폭포 아래", "S004.desc": ["깊은 산속, 하얗게 쏟아지는 **폭포**.", "", "옛날 이야기가 떠오른다.", "고수들은 폭포 아래 앉아 **{내공}을 닦았다**고.", "", "물살이 바위를 때리는 소리가 천둥 같다.", "**물이 얼음처럼 차다.**"], "S004.c1.tag": "수련", "S004.c1.text": "폭포 아래 앉아 버틴다", "S004.c1.o0": ["물줄기가 어깨를 내리친다.", "", "한 {시진}.", "몸 안의 기운이 물살을 **밀어내기 시작했다.**", "", "두 시진.", "**<gold>{단전}이 끓는다.<\/gold>**"], "S004.c1.o1": ["물줄기에 머리를 맞고 정신을 잃었다.", "", "깨어나 보니 하류 자갈밭.", "**<red>온몸이 얼어붙었다.<\/red>**"], "S004.c2.tag": "명상", "S004.c2.text": "폭포 옆 바위에 앉아 물소리만 듣는다", "S004.c2.o0": ["물소리에 숨을 맞췄다.", "", "들이쉬고. 내쉬고.", "", "**마음이 고요해진다.**"], "S004.c3.tag": "탐색", "S004.c3.text": "폭포 뒤에 동굴이 있는지 살핀다", "S004.c3.o0": ["물줄기 뒤로 **좁은 틈**이 있었다.", "", "안에는 이끼 낀 석벽.", "누군가 손가락으로 새긴 **<gold>글귀와 그림.<\/gold>**", "", "그림을 따라 숨을 쉬어 본다.", "**기운이 길을 찾는다.**"], "S004.c3.o1": ["젖은 바위에 미끄러졌다.", "", "**그냥 폭포였다.**"], "S005.title": "운기조식", "S005.desc": ["조용한 밤.", "", "{가부좌}를 틀고 앉는다.", "{단전}에 고인 **기운**이 미약하게 꿈틀거린다.", "", "{운기조식}.", "기운을 몸 구석구석 돌려 다시 단전에 모으는 일.", "", "**급하면 탈이 난다.** 모두가 그렇게 말한다."], "S005.c1.tag": "정진", "S005.c1.text": "천천히, 한 바퀴만 정확히 돌린다", "S005.c1.o0": ["기운이 실처럼 가늘게 흐른다.", "", "한 바퀴.", "", "**{단전}이 조금 더 차올랐다.**"], "S005.c2.tag": "강행", "S005.c2.text": "밤새 쉬지 않고 돌린다", "S005.c2.o0": ["한 바퀴, 두 바퀴, 열 바퀴.", "", "새벽닭이 울 때", "**<gold>{단전}이 뜨겁게 부풀었다.<\/gold>**"], "S005.c2.o1": ["다섯 바퀴째, 기운이 엉켰다.", "", "**<purple>가슴이 찢어질 듯 아프다.<\/purple>**", "피를 한 모금 토했다."], "S005.c3.tag": "요양", "S005.c3.text": "기운으로 몸의 상처를 다스린다", "S005.c3.o0": ["기운을 상처 쪽으로 보냈다.", "", "욱신거림이 **천천히 가라앉는다.**"], "S006.title": "도전자", "S006.desc": ["길을 막아선 **앳된 {무인}**.", "", "\"당신이 요즘 이름이 좀 난다는 그 사람이오?\"", "", "소년이 검을 뽑는다.", "**자세가 정석이다.** 명문가에서 배운 티가 난다.", "", "\"한 수 청하겠소!\"", "", "소년의 신발은 **갓 산 새 신**이고, 손바닥에는 **굳은살이 없다.**"], "S006.c1.tag": "비무", "S006.c1.text": "정정당당히 {비무}를 받아준다", "S006.c1.o0": ["정석은 정석이었다.", "**실전은 처음인 칼이다.**", "", "세 합 만에 소년의 검이 땅에 떨어졌다.", "", "소년이 이를 악물고 고개를 숙인다.", "\"…{남궁세가}의 **남궁현**이오. 이 빚은 잊지 않겠소.\""], "S006.c1.o1": ["굳은살 없는 손이었지만,", "**검은 빨랐다.**", "", "칼등에 손목을 맞고 검을 놓쳤다.", "", "\"…생각보다 별거 아니군.\"", "소년이 우쭐대며 떠난다."], "S006.c2.tag": "회피", "S006.c2.text": "다음에 하자며 피한다", "S006.c2.o0": ["\"겁쟁이!\"", "", "소년의 외침이 등 뒤에 꽂힌다.", "", "**소문은 빨리 퍼졌다.**"], "S006.c3.tag": "흙탕", "S006.c3.text": "{비무} 도중 흙을 뿌린다", "S006.c3.o0": ["눈에 흙을 맞은 소년이 비틀거린다.", "", "그대로 걷어차 쓰러뜨렸다.", "", "\"비, 비겁하다!\"", "", "**이겼다.** 지켜보던 사람들의 눈빛은 싸늘하다."], "S006.c3.o1": ["흙을 쥐는 손을 소년이 봤다.", "", "**<red>칼끝이 손등을 꿰뚫었다.<\/red>**", "", "\"하류배.\""], "S007.title": "검은 손짓", "S007.desc": ["{객잔} 이층, 구석 자리.", "", "맞은편에 누군가 앉는다.", "검은 옷. 얼굴 반쪽의 **<purple>검붉은 문신<\/purple>**.", "", "\"겁먹지 마라. 오늘은 칼을 뽑으러 온 게 아니다.\"", "", "사내가 **검은 환약** 하나를 탁자에 올린다.", "\"{삼류}에서 몇 년을 썩을 생각이냐.\"", "\"**이걸 먹으면 한 달 만에 {이류}다.**\""], "S007.c1.tag": "복용", "S007.c1.text": "환약을 삼킨다", "S007.c1.o0": ["삼키자마자 {단전}이 **<purple>불타올랐다.<\/purple>**", "", "기운이 미친 듯이 차오른다.", "**강해지는 게 느껴진다.**", "", "사내가 웃는다.", "\"이제 너는 **우리 쪽**이다.\"", "", "손등에 **<purple>검붉은 점<\/purple>** 하나가 떠올랐다."], "S007.c1.o1": ["삼키자마자 {단전}이 **<purple>터져 나갔다.<\/purple>**", "", "사내가 혀를 찬다.", "\"…그릇이 작았군.\""], "S007.c2.tag": "거절", "S007.c2.text": "환약을 밀어낸다", "S007.c2.o0": ["\"사양하지.\"", "", "사내가 잠시 나를 본다.", "", "\"…아깝군. 마음이 바뀌면 그 환약을 깨물어라.\"", "", "사내가 사라진 자리에 **환약이 그대로 남아 있다.**"], "S007.c2.o1": ["\"사양하지.\"", "", "\"그래? 그럼 **<red>아는 걸 너무 많이 아는 놈<\/red>**이군.\"", "", "탁자 아래로 칼이 들어왔다.", "옆구리를 베였지만 창문으로 뛰어내렸다."], "S007.c3.tag": "역제안", "S007.c3.text": "그 {무인}(사부)의 행방을 대가로 요구한다", "S007.c3.o0": ["사내의 눈이 번뜩인다.", "", "\"…역시 그놈 제자였군.\"", "", "사내가 웃으며 일어선다.", "\"좋아. **그놈이 살아 있다는 사실만 알려주지.**\"", "\"서쪽, 화산 아래에서 봤다.\"", "", "탁자 위에 {은자} 한 냥이 남아 있다. 술값이라는 듯."], "S008.title": "산채의 칼잡이", "S008.desc": ["두목이 나를 부른다.", "", "\"너 **기**가 돈다며.\"", "\"이제 막내 아니다. **칼잡이**다.\"", "", "두목이 지도를 펼친다.", "\"청하{표국} 수레가 모레 고갯길을 넘는다.\"", "\"**네가 앞장선다.**\"", "", "지도 위, 표국 수레 옆에 적힌 이름 하나.", "**{표두} — 노삼.** 외팔이 노도가 예전에 몸담았던 표국이다."], "S008.c1.tag": "앞장", "S008.c1.text": "명령대로 앞장선다", "S008.c1.o0": ["{표국} 호위 셋을 혼자 막았다.", "", "기운을 실은 칼이 **<gold>상대의 칼을 부러뜨렸다.<\/gold>**", "", "약탈은 성공했다.", "두목이 내 몫으로 **{은자} 한 냥**을 던져준다."], "S008.c1.o1": ["{표두} 노삼은 **{이류}**였다.", "", "칼 한 번에 내 칼이 날아갔다.", "**<red>허벅지를 베였다.<\/red>**", "", "산적들이 나를 끌고 도망쳤다."], "S008.c2.tag": "노도", "S008.c2.text": "외팔이 노도에게 이 일을 알린다", "S008.c2.o0": ["노도가 지도를 한참 내려다본다.", "", "\"…노삼. 내 사형이다.\"", "", "그날 밤 노도는 **{산채}를 떠났다.**", "남은 물건은 칼 한 자루와 쪽지 한 장.", "", "**\"너도 늦기 전에 떠나라.\"**"], "S008.c3.tag": "배신", "S008.c3.text": "{표국}에 미리 습격을 알린다", "S008.c3.o0": ["밤길을 달려 {표국}에 알렸다.", "", "모레, 고갯길.", "매복한 쪽은 산적이 아니라 **표국**이었다.", "", "{흑풍채}는 크게 꺾였다.", "", "{표두} 노삼이 내 손을 잡는다.", "\"**오갈 데 없으면 우리 표국으로 와라.**\""], "S008.c3.o1": ["{산채}를 빠져나가는 걸", "**<red>곽철이 지켜보고 있었다.<\/red>**"], "S009.title": "사범의 비전", "S009.desc": ["늦은 밤, {사범}이 나를 따로 부른다.", "", "\"청하{무관}에는 **대대로 내려오는 {구결}**이 하나 있다.\"", "\"정식 제자 중에서도 하나만 가르친다.\"", "", "사범이 낡은 종이 한 장을 펼친다.", "", "\"너는 아직 {정식 제자}가 아니다.\"", "\"**그래도 가르칠지 말지, 내가 정한다.**\""], "S009.c1.tag": "청함", "S009.c1.text": "무릎을 꿇고 가르침을 청한다", "S009.c1.o0": ["{사범}이 오래 침묵한다.", "", "\"…따라 읊어라.\"", "", "한 구절, 한 구절.", "**<gold>{단전}이 처음 느껴보는 방향으로 돈다.<\/gold>**"], "S009.c1.o1": ["\"아직이다.\"", "", "{사범}이 종이를 접는다.", "\"대신 오늘 밤은 내 옆에서 운기해라.\"", "", "**사범 곁에서 돌린 기운은 유난히 매끄러웠다.**"], "S009.c2.tag": "제자", "S009.c2.text": "{정식 제자}로서 당당히 요구한다", "S009.c2.o0": ["{사범}이 피식 웃는다.", "", "\"그래. 그럴 자격은 있지.\"", "", "밤새 {구결}을 익혔다.", "**<gold>{단전}이 깊어졌다.<\/gold>**"], "S009.c3.tag": "양보", "S009.c3.text": "석두에게 먼저 가르쳐 달라고 한다", "S009.c3.o0": ["{사범}이 한참 나를 본다.", "", "\"…녀석, 사람 될 놈이구나.\"", "", "{구결}은 석두에게 갔다.", "", "며칠 뒤 석두가 몰래 찾아와 **구결을 그대로 읊어준다.**", "\"이건 네 거야.\""], "S010.title": "벽", "S010.desc": ["{단전}이 **꽉 찼다.**", "", "더는 기운이 들어갈 자리가 없다.", "몸 안 어딘가에 **보이지 않는 벽**이 있다.", "", "벽 너머가 **{이류}**다.", "", "넘으면 다른 세상이 열린다.", "잘못 넘으면 **<purple>기가 거꾸로 흐른다.<\/purple>**"], "S010.c1.tag": "폐관", "S010.c1.text": "동굴에 들어가 홀로 벽을 두드린다", "S010.c1.o0": ["이레 밤낮.", "", "벽에 금이 갔다.", "그리고 **<gold>무너졌다.<\/gold>**", "", "기운이 온몸으로 터져 나간다.", "손끝, 발끝, 머리끝까지.", "", "동굴을 나섰을 때 세상이 **선명하다.**", "", "**<gold>{이류} {무인}이 되었다.<\/gold>**"], "S010.c1.o1": ["벽을 세게 두드렸다.", "", "벽이 **<purple>되받아쳤다.<\/purple>**", "", "피를 한 사발 토했다.", "{단전}의 기운이 **흩어졌다.**"], "S010.c1.o2": ["이레를 버텼다.", "벽은 꿈쩍도 하지 않았다.", "", "그래도 **벽의 생김새는 알았다.**", "다음엔 조금 더 다가가겠지."], "S010.c2.tag": "가르침", "S010.c2.text": "스승에게 곁을 지켜달라고 청한다", "S010.c2.o0": ["등 뒤에 손바닥이 닿는다.", "\"서두르지 마라. 내가 길을 잡아주마.\"", "", "스승의 기운이 내 기운을 이끈다.", "벽 앞에서 멈추고, 숨을 고르고.", "", "**<gold>한 번에 뚫었다.<\/gold>**", "", "**<gold>{이류} {무인}이 되었다.<\/gold>**"], "S010.c2.o1": ["스승의 기운이 이끌었지만,", "벽은 아직 단단했다.", "", "\"…아직이다. 그래도 거의 왔다.\"", "", "**스승의 기운이 몸에 조금 남았다.**"], "S010.c3.tag": "마공", "S010.c3.text": "{마공}으로 벽을 억지로 부순다", "S010.c3.o0": ["**<purple>검붉은 기운<\/purple>**을 끌어올려 벽을 내리쳤다.", "", "벽이 산산조각 났다.", "", "힘이 넘친다. 무엇이든 부수겠다.", "", "거울 속 내 눈이", "**<purple>붉게 물들어 있다.<\/purple>**", "", "**<gold>{이류} {무인}이 되었다.<\/gold>**"], "S010.c3.o1": ["검붉은 기운이 벽이 아니라", "**<purple>나를 부쉈다.<\/purple>**"], "S010.c4.tag": "환약", "S010.c4.text": "검은 환약을 깨문다", "S010.c4.o0": ["환약을 깨물었다.", "", "**<purple>불길이 벽을 태워버렸다.<\/purple>**", "", "**<gold>{이류} {무인}이 되었다.<\/gold>**", "", "손등에 **<purple>검붉은 점<\/purple>**이 떠오른다."], "S010.c4.o1": ["환약을 깨물었다.", "", "**<purple>{단전}이 터졌다.<\/purple>**"], "S010.c5.tag": "인내", "S010.c5.text": "아직 때가 아니다. 기운을 더 다진다", "S010.c5.o0": ["벽 앞에서 돌아섰다.", "", "넘치는 기운을 다시 다지고, 또 다진다.", "", "**{단전}이 더 단단해졌다.**"]}, "glossary": {"무인": "무공을 익힌 사람. 칼이나 주먹으로 싸우는 무술가.", "무공": "싸움 기술과 기운을 다루는 수련법을 통틀어 이르는 말.", "내공": "수련으로 몸 안에 쌓은 기운. 많을수록 힘과 속도가 강해진다.", "삼류": "무인 등급 중 가장 낮은 단계. 무공에 막 발을 들인 수준.", "영과": "신비한 기운이 깃든 열매. 먹으면 몸이 튼튼해진다.", "금창약": "칼에 베인 상처에 바르는 약.", "은자": "은으로 만든 돈. 한 냥이면 장정 한 달 품삯쯤 된다.", "전낭": "돈을 넣어 허리에 차는 주머니.", "관병": "나라에 속한 병사.", "관부": "고을을 다스리는 관청. 죄인을 잡아들이는 곳이기도 하다.", "국사": "황제의 스승으로 나라의 큰일을 돌보는 사람. 이 세계에서는 황실을 지키는 정체 모를 노인이다.", "도포": "도사들이 입는, 소매가 넓은 긴 옷.", "전각": "궁궐이나 절에 있는 크고 화려한 건물.", "산채": "산적들이 산속에 꾸린 소굴.", "흑풍채": "이 근방 고갯길을 차지한 산적 무리.", "정파": "의리와 명예를 중시하는 명문 무림 세력.", "사파": "이익을 좇는 무림 세력. 산적, 살수, 뒷골목 조직 등.", "마교": "천마를 받드는 거대한 무림 세력. 정파와는 철천지원수다.", "마공": "마교의 무공. 빠르게 강해지지만 몸과 마음을 갉아먹는다.", "혈마공": "피를 매개로 기운을 끌어올리는 마공.", "화산파": "화산에 자리 잡은 이름난 정파 문파. 화려한 검술로 유명하다.", "삼대제자": "문파를 세운 사람으로부터 3대째 이어지는 제자. 문파의 젊은 주력이다.", "마보": "말을 탄 것처럼 무릎을 굽히고 버티는 기초 수련 자세.", "토납법": "숨을 뱉고 들이마시며 몸 안의 기운을 다스리는 호흡 수련법.", "구결": "무공의 요령을 외우기 쉽게 정리한 짧은 글귀.", "시진": "옛 시간 단위. 한 시진은 약 두 시간이다.", "해시": "밤 9시에서 11시 사이.", "객잔": "밥과 술을 팔고 잠자리도 내주는 숙소 겸 식당.", "훈장": "서당에서 아이들에게 글을 가르치는 선생.", "무관": "돈을 받고 무술을 가르치는 도장.", "사범": "무관에서 무술을 가르치는 사람.", "고뿔": "감기를 이르는 옛말.", "영근": "하늘과 땅의 영기를 빨아들이는 타고난 뿌리. 영근을 지닌 자만이 신선의 길에 오른다. 수만 명 가운데 하나, 하늘이 고른 그릇.", "이류": "삼류 위의 무인 등급. 웬만한 고을에서는 고수 소리를 듣는다.", "투전": "패를 뽑아 끗수를 겨루는 노름.", "보부상": "물건을 지고 이 장터 저 장터를 떠도는 장사꾼.", "기녀": "술자리에서 노래와 춤으로 손님을 접대하는 여인.", "법력": "수도자가 쓰는 신비한 힘.", "무복": "무술을 익힐 때 입는 활동하기 편한 옷.", "사문": "자신이 속한 문파를 높여 부르는 말.", "상단": "여럿이 함께 장사하는 큰 상인 조직.", "죽비": "대나무로 만든 회초리 같은 도구. 수련생을 깨우칠 때 친다.", "검은 비늘": "뿔 달린 자가 남긴 비늘. 차갑고 단단하다. 지금은 어디에 쓰는지 알 수 없다.", "용의 정혈": "뿔 달린 자가 남긴 피 한 방울. 지금은 그 쓰임을 알 수 없다.", "동전": "구리로 만든 작은 돈. 백 닢을 꿰어 한 꾸러미, 천 닢이면 은자 한 냥쯤 된다.", "비무": "무예를 겨루는 일. 목숨을 걸지 않는 대련.", "표국": "돈을 받고 물건이나 사람을 지켜 실어 나르는 곳.", "표사": "표국에 속해 짐을 지키는 무인.", "정식 제자": "잡일꾼이 아니라 정식으로 무공을 배우는 제자.", "비급": "무공의 비법을 적은 책.", "운기조식": "몸 안의 기운을 돌려 다스리고 쌓는 수련.", "단전": "배꼽 아래, 기운이 모이는 곳.", "폐관": "바깥과 연락을 끊고 틀어박혀 수련하는 일.", "내상": "몸 안, 기운이 다니는 길이 다친 것.", "녹림": "산적 무리를 점잖게 이르는 말.", "표두": "표국 일행을 이끄는 우두머리.", "무당파": "태극의 이치를 따르는 이름난 정파 문파.", "남궁세가": "검으로 이름난 명문 무가.", "가부좌": "두 다리를 꼬아 앉는 수련 자세."}, "names": {"국사": "국사", "떠돌이_무인": "떠돌이 무인", "무관_사범": "무관 사범", "사파": "사파", "약초꾼_노인": "약초꾼 노인", "옥중_노인": "옥중 노인", "정파": "정파", "진우": "진우", "청하무관": "청하무관", "칼자국_왕두": "칼자국 왕두", "흑의인": "흑의인", "흑풍채": "흑풍채", "곽철": "곽철", "금화상단": "금화상단", "석두": "석두", "없음": "없음", "외팔이_노도": "외팔이 노도", "남궁현": "남궁현", "떠돌이_검객": "떠돌이 검객", "청하표국": "청하표국"}, "items": {"금창약": "금창약", "낡은_무공서": "낡은 무공서", "낡은_삼베옷": "낡은 삼베옷", "녹슨_손칼": "녹슨 손칼", "라이터": "라이터", "토납법_구결": "토납법 구결", "황실_옥패": "황실 옥패", "흑의인의_패": "흑의인의 패", "금화상단_명패": "금화상단 명패", "화산파_추천패": "화산파 추천패", "검은_비늘": "검은 비늘", "용의_정혈": "용의 정혈", "검은_환약": "검은 환약", "노도의_칼": "노도의 칼", "이름_없는_심법": "이름 없는 심법"}, "achievements": {"첫_죽음은_용에게.name": "구름 아래의 벌레", "첫_죽음은_용에게.desc": "이 세
